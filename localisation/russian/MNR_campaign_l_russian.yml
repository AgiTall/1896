 MNR_PPN_project:0 "Доставить рис между общинами"
 MNR_PPN_project_desc:0 "45 дней; 35 политической власти, 12 запасов. Награда: 4 запасов, 10 доверия, 1 завершённый проект; 1% стабильности. Требуется собственная контролируемая столица. Всего три проекта."
 mnr_campaign.215.t:0 "Спор о местных приоритетах"
 mnr_campaign.215.d:0 "Местный совет требует отчёта о припасах и правах общин. Договор с делегатами укрепит доверие, а чрезвычайный порядок передаст больше власти гарнизону."
 mnr_campaign.215.a:0 "Оплатить согласованное решение"
 mnr_campaign.215.b:0 "Ввести чрезвычайный порядок"
 mnr_campaign.315.t:0 "Доставить рис между общинами: итог"
 mnr_campaign.315.d:0 "Первый проект завершён. Следующие два потребуют новых ресурсов. Местные специалисты могут воспроизвести результат, но сооружения не появляются бесплатно при каждом повторении."
 mnr_campaign.315.a:0 "Продолжить работу"
 mnr_campaign.415.t:0 "Панай без голодных деревень"
 mnr_campaign.415.d:0 "Касики Панай согласуют рисовые поставки между общинами. Земельный договор может дать им доверие крестьян или закрепить власть старых семейств. Теперь правительство располагает подготовленными службами, запасами и тремя завершёнными проектами. Дальнейшая внешняя политика остаётся вашим выбором."
 mnr_campaign.415.a:0 "Начинается следующая глава"
 MNR_PVI_root:0 "Висайская республика: собственный путь"
 MNR_PVI_root_desc:0 "Разные островные советы требуют равного доступа к паромам и общему бюджету. Централизация охраны не должна лишить малые гавани права голоса."
