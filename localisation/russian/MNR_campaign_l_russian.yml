 MNR_PNM_command_law_desc:0 "Сверить мобилизационные списки: +8 опыта армии и +5% поддержки войны."
 MNR_PNM_command_settlement:0 "Мандат вооружённой готовности"
 MNR_PNM_command_settlement_desc:0 "Получить цель войны против соперничающего правительства, если мы независимы и не состоим с ним в одной фракции. Объявление войны остаётся решением игрока."
 MNR_PNM_projects:0 "План национального проекта"
 MNR_PNM_projects_desc:0 "Обследовать маршрут к внутренним поселениям. Решение открывает оплачиваемый проект; время и ресурсы указаны в его описании."
 MNR_PNM_specialists:0 "Подготовить местных специалистов"
 MNR_PNM_specialists_desc:0 "Освоить выпуск дополнительного оснащения и получить 50 комплектов для землемеров, лабораторий и служб снабжения. Для повторных проектов оснащение производится самостоятельно."
 MNR_PNM_goal:0 "Соединить северные гавани с глубинкой"
 MNR_PNM_goal_desc:0 "Завершить три национальных проекта, укрепить доверие и запасы, принять политический путь и выполнить дополнительные условия, показанные в требованиях фокуса. Награда: 100 политической власти, 5% стабильности, дополнительная ячейка исследований."
