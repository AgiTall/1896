 MNR_MLT_project_desc:0 "60 дней; 35 политической власти, 10 запасов, 25 единиц дополнительного оснащения. Награда: 0 запасов, 5 доверия, 1 завершённый проект; 5 очков общей научной готовности. Требуется собственная контролируемая столица. Всего три проекта."
 mnr_campaign.205.t:0 "Спор о местных приоритетах"
 mnr_campaign.205.d:0 "Дворы требуют закрыть научную переписку, а инженеры — сохранить связи с иностранными лабораториями. Тесла не становится собственностью ни одной делегации."
 mnr_campaign.205.a:0 "Оплатить согласованное решение"
 mnr_campaign.205.b:0 "Ввести чрезвычайный порядок"
 mnr_campaign.305.t:0 "Провести приборную исследовательскую сессию: итог"
 mnr_campaign.305.d:0 "Первый проект завершён. Следующие два потребуют новых ресурсов. Местные специалисты могут воспроизвести результат, но сооружения не появляются бесплатно при каждом повторении."
 mnr_campaign.305.a:0 "Продолжить работу"
 mnr_campaign.405.t:0 "Независимый остров переговоров"
 mnr_campaign.405.d:0 "Мальта принимает изгнанные дворы и лабораторию Теслы, оставаясь отдельным государством. Местный совет должен извлекать пользу из посредничества, не отдавая остров покровителю. Теперь правительство располагает подготовленными службами, запасами и тремя завершёнными проектами. Дальнейшая внешняя политика остаётся вашим выбором."
 mnr_campaign.405.a:0 "Начинается следующая глава"
