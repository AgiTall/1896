 MNR_PNM_project_desc:0 "60 дней; 35 политической власти, 6 запасов, 25 единиц дополнительного оснащения. Награда: 0 запасов, 5 доверия, 1 завершённый проект; одна скидка 25% на промышленное исследование. Требуется собственная контролируемая столица. Всего три проекта."
