 MNR_campaign_category:0 "Местное правительство и национальные проекты"
 MNR_campaign_category_desc:0 "Запасы: [?MNR_reserve|0] / 100. Доверие общин: [?MNR_mandate|0] / 100. Завершённые проекты: [?MNR_progress|0] / 3.\nКаждый военный месяц расходует 1 единицу запасов. При показателе ниже 25 страна получает штраф. Проект оплачивается при запуске и прерывается без награды при потере контроля над столицей. Договоры требуют согласия партнёра и действуют два года."
