 MNR_A05_root:0 "Железный Союз: собственный путь"
 MNR_A05_root_desc:0 "Гавана кормит американских изгнанников, но эскадры требуют угля, а верфи — рабочих рук. Морская республика и постоянное адмиральское правление предлагают разную цену единства."
 MNR_A05_economy_spirit:0 "Контракты американских капитанов"
 MNR_A05_economy_spirit_desc:0 "Контракты американских капитанов."
 MNR_A05_economy0:0 "Ведомости Гаванского порта"
 MNR_A05_economy0_desc:0 "Сверить местные запасы: +8 запасов."
 MNR_A05_economy1:0 "Мастерские беженцев"
 MNR_A05_economy1_desc:0 "Расширить мастерские столицы: одна гражданская фабрика."
 MNR_A05_economy2:0 "Контракты американских капитанов"
 MNR_A05_economy2_desc:0 "Закрепить местную хозяйственную специализацию национальным духом."
 MNR_A05_defence0:0 "Гаванские добровольцы"
 MNR_A05_defence0_desc:0 "Открыть лёгкий шаблон из двух пехотных батальонов, получить 200 винтовок и 5 опыта армии. Новые дивизии набираются обычным порядком."
 MNR_A05_defence1:0 "Охрана Пуэрто-Рико"
 MNR_A05_defence1_desc:0 "За 5 запасов организовать местные караулы на один год."
 MNR_A05_defence2:0 "Снабжение Карибской эскадры"
 MNR_A05_defence2_desc:0 "Оборудовать оружейное предприятие в собственной контролируемой столице."
 MNR_A05_contacts:0 "Переговоры с соседями"
 MNR_A05_contacts_desc:0 "Открыть два двусторонних предложения. Партнёр вправе отказаться; для итоговой цели существует местное страхование."
 MNR_A05_chamber:0 "Собственный стол Палаты"
 MNR_A05_chamber_desc:0 "Открыть действующую систему контрактов Палаты. Прежний долг и договоры сохраняются."
 MNR_A05_civic:0 "Конгресс гаванских общин"
 MNR_A05_civic_desc:0 "Подотчётность общинам даёт стабильность и рост доверия в мирное время."
 MNR_A05_civic_law:0 "Открытые местные сметы"
 MNR_A05_civic_law_desc:0 "Укрепить выбранный порядок: +6 доверия и +30 политической власти."
 MNR_A05_civic_settlement:0 "Хартия устойчивого правления"
 MNR_A05_civic_settlement_desc:0 "Принять местную хартию: +5% стабильности и +10 запасов."
 MNR_A05_command:0 "Мандат адмирала Грейвса"
 MNR_A05_command_desc:0 "Территориальное командование ускоряет подготовку войск, но вызывает недовольство общин."
 MNR_A05_command_law:0 "Ведомости территориальных сил"
 MNR_A05_command_law_desc:0 "Сверить мобилизационные списки: +8 опыта армии и +5% поддержки войны."
 MNR_A05_command_settlement:0 "Мандат вооружённой готовности"
 MNR_A05_command_settlement_desc:0 "Получить цель войны против соперничающего правительства, если мы независимы и не состоим с ним в одной фракции. Объявление войны остаётся решением игрока."
 MNR_A05_projects:0 "План национального проекта"
 MNR_A05_projects_desc:0 "Провести карибский конвой. Решение открывает оплачиваемый проект; время и ресурсы указаны в его описании."
 MNR_A05_specialists:0 "Подготовить местных специалистов"
 MNR_A05_specialists_desc:0 "Освоить выпуск дополнительного оснащения и получить 50 комплектов для землемеров, лабораторий и служб снабжения. Для повторных проектов оснащение производится самостоятельно."
 MNR_A05_goal:0 "Карибская морская республика"
 MNR_A05_goal_desc:0 "Завершить три национальных проекта, укрепить доверие и запасы, принять политический путь и выполнить дополнительные условия, показанные в требованиях фокуса. Награда: 100 политической власти, 5% стабильности, дополнительная ячейка исследований."
 MNR_A05_project:0 "Провести карибский конвой"
 MNR_A05_project_desc:0 "45 дней; 35 политической власти, 6 запасов, 1 транспорт. Награда: 15 запасов, 5 доверия, 1 завершённый проект; 3 опыта флота. Требуется собственная контролируемая столица. Всего три проекта."
 mnr_campaign.200.t:0 "Спор о местных приоритетах"
 mnr_campaign.200.d:0 "Капитаны требуют уголь, а городские делегаты — продовольствие. Приоритет флоту сохранит боевую готовность ценой доверия гавани."
 mnr_campaign.200.a:0 "Оплатить согласованное решение"
 mnr_campaign.200.b:0 "Ввести чрезвычайный порядок"
 mnr_campaign.300.t:0 "Провести карибский конвой: итог"
 mnr_campaign.300.d:0 "Первый проект завершён. Следующие два потребуют новых ресурсов. Местные специалисты могут воспроизвести результат, но сооружения не появляются бесплатно при каждом повторении."
 mnr_campaign.300.a:0 "Продолжить работу"
 mnr_campaign.400.t:0 "Карибская морская республика"
 mnr_campaign.400.d:0 "Гавана кормит американских изгнанников, но эскадры требуют угля, а верфи — рабочих рук. Морская республика и постоянное адмиральское правление предлагают разную цену единства. Теперь правительство располагает подготовленными службами, запасами и тремя завершёнными проектами. Дальнейшая внешняя политика остаётся вашим выбором."
 mnr_campaign.400.a:0 "Начинается следующая глава"
