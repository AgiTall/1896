 MNR_PBT_contacts_desc:0 "Открыть два двусторонних предложения. Партнёр вправе отказаться; для итоговой цели существует местное страхование."
 MNR_PBT_chamber:0 "Собственный стол Палаты"
 MNR_PBT_chamber_desc:0 "Открыть действующую систему контрактов Палаты. Прежний долг и договоры сохраняются."
 MNR_PBT_civic:0 "Хартия муниципалитетов Батаана"
 MNR_PBT_civic_desc:0 "Подотчётность общинам даёт стабильность и рост доверия в мирное время."
 MNR_PBT_civic_law:0 "Открытые местные сметы"
 MNR_PBT_civic_law_desc:0 "Укрепить выбранный порядок: +6 доверия и +30 политической власти."
 MNR_PBT_civic_settlement:0 "Хартия устойчивого правления"
 MNR_PBT_civic_settlement_desc:0 "Принять местную хартию: +5% стабильности и +10 запасов."
 MNR_PBT_command:0 "Командование полуостровной обороны"
 MNR_PBT_command_desc:0 "Территориальное командование ускоряет подготовку войск, но вызывает недовольство общин."
 MNR_PBT_command_law:0 "Ведомости территориальных сил"
 MNR_PBT_command_law_desc:0 "Сверить мобилизационные списки: +8 опыта армии и +5% поддержки войны."
 MNR_PBT_command_settlement:0 "Мандат вооружённой готовности"
 MNR_PBT_command_settlement_desc:0 "Получить цель войны против соперничающего правительства, если мы независимы и не состоим с ним в одной фракции. Объявление войны остаётся решением игрока."
 MNR_PBT_projects:0 "План национального проекта"
 MNR_PBT_projects_desc:0 "Провести полуостровные оборонные учения. Решение открывает оплачиваемый проект; время и ресурсы указаны в его описании."
 MNR_PBT_specialists:0 "Подготовить местных специалистов"
 MNR_PBT_specialists_desc:0 "Освоить выпуск дополнительного оснащения и получить 50 комплектов для землемеров, лабораторий и служб снабжения. Для повторных проектов оснащение производится самостоятельно."
 MNR_PBT_goal:0 "Батаан с собственной хартией"
 MNR_PBT_goal_desc:0 "Завершить три национальных проекта, укрепить доверие и запасы, принять политический путь и выполнить дополнительные условия, показанные в требованиях фокуса. Награда: 100 политической власти, 5% стабильности, дополнительная ячейка исследований."
 MNR_PBT_project:0 "Провести полуостровные оборонные учения"
 MNR_PBT_project_desc:0 "45 дней; 35 политической власти, 6 запасов, 100 винтовок. Награда: 0 запасов, 6 доверия, 1 завершённый проект; 5 опыта армии. Требуется собственная контролируемая столица. Всего три проекта."
 mnr_campaign.222.t:0 "Спор о местных приоритетах"
 mnr_campaign.222.d:0 "Местный совет требует отчёта о припасах и правах общин. Договор с делегатами укрепит доверие, а чрезвычайный порядок передаст больше власти гарнизону."
 mnr_campaign.222.a:0 "Оплатить согласованное решение"
 mnr_campaign.222.b:0 "Ввести чрезвычайный порядок"
 mnr_campaign.322.t:0 "Провести полуостровные оборонные учения: итог"
 mnr_campaign.322.d:0 "Первый проект завершён. Следующие два потребуют новых ресурсов. Местные специалисты могут воспроизвести результат, но сооружения не появляются бесплатно при каждом повторении."
 mnr_campaign.322.a:0 "Продолжить работу"
 mnr_campaign.422.t:0 "Батаан с собственной хартией"
 mnr_campaign.422.d:0 "Батаан прикрывает подходы к Маниле, но его жители не хотят жить одним гарнизоном. Оборону полуострова нужно совместить с местным хозяйством. Теперь правительство располагает подготовленными службами, запасами и тремя завершёнными проектами. Дальнейшая внешняя политика остаётся вашим выбором."
 mnr_campaign.422.a:0 "Начинается следующая глава"
 MNR_A05_escort_order:0 "Заказать два прибрежных эскорта"
 MNR_A05_escort_order_desc:0 "После первого национального проекта и оружейных мастерских можно вложить 75 политической власти, 25 запасов и 50 единиц дополнительного оснащения в морскую службу. Через 90 дней: два малых эскорта и одна верфь в исходной столице. Один заказ за кампанию; потеря столичного порта отменяет заказ без награды."
