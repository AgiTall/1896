l_russian:
 A01_defeat_legacy:0 "Наследие поражения"
 A01_defeat_legacy_desc:0 "Разрушения, невыплаченные компенсации, бюджетное бремя, унижение, реваншизм и послевоенный кабинет объединены здесь. Каждый восстановительный фокус снимает соответствующую часть последствий."
 A01_army_development:0 "Военное строительство"
 A01_army_development_desc:0 "Единый изменяемый национальный дух. Его суммарные эффекты обновляются при реформах, снятии последствий и завершении временных мер."
 A01_civic_development:0 "Гражданское управление"
 A01_civic_development_desc:0 "Единый изменяемый национальный дух. Его суммарные эффекты обновляются при реформах, снятии последствий и завершении временных мер."
 A01_crown_order:0 "Новый порядок Короны"
 A01_crown_order_desc:0 "Единый изменяемый национальный дух. Его суммарные эффекты обновляются при реформах, снятии последствий и завершении временных мер."
 A01_crown_council_balance:0 "Королева и Большой совет"
