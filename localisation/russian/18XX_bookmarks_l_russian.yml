l_russian:
 OVT_GATHERING_STORM_DESC: "После Великого Исхода остатки европейских держав нашли спасение в море. Из разрозненных флотилий возникло Общество Всемирной Торговли, восстановившее океанские пути и создавшее новую систему порядка среди островов.\n\nИз столицы на Императорском острове Батам император Элдридж Филби стремится объединить разрозненные земли под единой цепью торговли и безопасности. Но далеко не все готовы принять власть ОВТ, и в океане всё чаще слышны голоса тех, кто мечтает о другой судьбе."
 OTHER_18XX_GATHERING_STORM_DESC: "Другие страны"
 ZZZ_GATHERING_STORM_DESC: "Пустошь не строит государство в привычном смысле. Там, где прежде были города, пути и законы, она оставляет выжженную тишину, редкие убежища и власть тех, кто пережил конец старого мира.\n\nЧернота правит не обещаниями будущего, а самим фактом распада. Если Пустошь двинется дальше, за ней останутся лишь молчание, голод и медленное исчезновение всего, что ещё пыталось называться цивилизацией."
 KRZ_GATHERING_STORM_DESC: "Красная Роза появилась во времена Великого Исхода, когда адмирал Эдмунд Шоу отказался подчиниться приказам и спасал тех, кого другие оставляли умирать на берегах погибающих континентов. Его корабли шли под знаком алой розы — символом милосердия и непокорности.\n\nСпустя десятилетия это знамя превратилось в тайное движение капитанов, агентов и свободных островов. Пока Батам строит свою империю порядка, Красная Роза готовится доказать, что океан принадлежит не императорам, а тем, кто осмелится бросить им вызов."
 MLT_GATHERING_STORM_DESC: "Мальта сохраняет стратегическое значение даже в изменившемся мире. Малый остров у морских путей может казаться незначительным, но любая сила, удерживающая его гавани и укрепления, получает контроль над важным узлом снабжения и флота.\n\nПока крупные державы заняты собственными амбициями, Мальта остаётся маленькой, но упрямой крепостью, чья ценность заметно превосходит её размеры."
 MVT_GATHERING_STORM_DESC: "Батамское океаническое владение служит внешним рубежом морской системы ОВТ. Здесь власть торговой империи ощущается особенно явно: гавани, суда и гарнизоны подчинены одному порядку, который должен удерживать океанские пути открытыми и безопасными.\n\nНо жизнь на периферии империи редко бывает спокойной. Чем дальше от центра, тем больше соблазн у местных сил искать собственный путь, а не просто исполнять волю Батама."
 PEM_GATHERING_STORM_DESC: "Небольшой остров Пемба долгое время оставался тихим соседом Занзибара. Его плодородные земли и плантации стали жизненно важным источником продовольствия, особенно в годы голода после Великого Исхода, когда именно Пемба помогла прокормить население соседнего острова.\n\nНо в мире, где океан стал ареной борьбы империй и повстанцев, даже такой спокойный остров не может оставаться в стороне. Влияние крупных держав растёт, и всё чаще звучит вопрос: сможет ли Пемба сохранить свою независимость, или её судьба будет решена чужими флотами?"
 KMR_GATHERING_STORM_DESC: "Комморские острова лежат в тени больших торговых путей между Занзибаром, Батамом и восточным побережьем Африки. Долгое время их гавани служили убежищем для купцов, рыбаков и тех, кто пытался пережить распад старого мира вдали от имперских столиц.\n\nНо даже эта удалённая островная земля больше не может оставаться в стороне. ОВТ стремится подчинить себе морские узлы региона, Красная Роза ищет союзников среди недовольных, а сами Коморы стоят перед выбором: подчиниться чужой воле или попытаться отстоять собственное место в новом океаническом порядке."
 NSB_GATHERING_STORM_DESC: "Носи Бе лежит у северо-западных берегов Мадагаскара, где морские пути встречаются с убежищами контрабандистов, купцов и изгнанников. Со временем порт острова вырос в свободную гавань, куда приходят те, кто хочет торговать вдали от имперских пошлин и чужих законов.\n\nНо чем богаче становится Свободная Пристань, тем пристальнее на неё смотрят окружающие державы. Чтобы сохранить независимость, Носи Бе придётся балансировать между торговлей, дипломатией и угрозой того, что однажды кто-то решит забрать эту гавань себе."
 PLV_GATHERING_STORM_DESC: "Палаванские Верфи стали для ОВТ главной судостроительной и ремонтной базой региона. Здесь строят клиперы и рыбацкие шхуны, заготавливают корабельный лес и пеньку, а местные воды ещё кормят окрестные острова рыбой. Без Палавана флот Батама быстро начнёт слабеть, а морские маршруты станут опаснее из-за нехватки ремонта и новых судов.\n\nФормально островом правит военная администрация ОВТ во главе с генерал-губернатором Воронькой Негровым, но реальная власть над доками и рабочими всё чаще уходит к Синдикату Корабелов и его теневому лидеру, \"Стояку\" Сантосу. Опиум, саботаж и скрытое влияние Красной Розы делают эту верфь не только опорой империи, но и одной из её самых опасных трещин."
 EZO_GATHERING_STORM_DESC: "Хоккайдо пережил конец старого мира как северный узел выживания: холодные гавани, склады зимнего снаряжения, меха, лес и мастерские, снабжающие все, кто ещё способен жить и воевать в ледяных краях. Без острова северная логистика быстро начнёт рушиться, а удержание холодных регионов станет куда труднее.\n\nФормально Хоккайдо управляется правительством, но на деле власть удерживает союз портовых гильдий. Их глава, Бек, держит в руках самое важное оружие острова — распределение продовольствия. Зависимость от внешних поставок, особенно с южных островов вроде Пембы, делает любое политическое потрясение вопросом не только власти, но и голода."
 NZL_18XX_GATHERING_STORM_DESC: "Новая Зеландия остаётся удалённым, но важным звеном Британского мира. Её безопасность кажется надёжной, пока океаны ещё разделяют великие державы, а внутреннюю политику определяют споры о социальной защите, обороне и роли доминиона в будущих конфликтах.\n\nОднако расстояние уже не гарантирует покоя. Если мир окончательно скатится к большой войне, Новой Зеландии придётся решать, как далеко она готова идти ради союзников и собственной безопасности."
 ZAN_GATHERING_STORM_DESC: "После Великого Исхода Занзибар стал одним из крупнейших портов нового океанического мира. Через его гавани проходят торговые суда, беженцы и авантюристы со всех концов Индийского океана, а его рынки давно стали местом встречи десятков народов и культур.\n\nОднако за богатством портовых кварталов скрывается нищета и напряжение. Влияние ОВТ растет, агенты Красной Розы действуют в тени, а судьба острова всё чаще решается не в дворцах Занзибара, а далеко за его пределами."
 SFT_GATHERING_STORM_DESC: "В 1868 году началось строительство крепости Суэц. Тысячи строителей погибли — Тихая чума безмолвно выкашивала людей. Суэц вырос мрачной громадой с пушками и гигантским входом для кораблей.\n\nПосле завершения главой назначили Северина Тарвальда, верного императору Филби. Но даже ему не раскрывают всех тайн: людей приходится постоянно менять из-за чумы, а он сам не знает, что именно охраняет."
