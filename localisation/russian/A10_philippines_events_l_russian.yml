 A10_confederation_faction:0 "Конфедерация Филиппинских Островов"
 A10_philippines.1.t:0 "Япония на Борнео"
 A10_philippines.1.d:0 "Уже неделю Япония ведёт войну с Нидерландами. Её войска и флот отвлечены борьбой за Борнео, а японские гарнизоны на Лусоне могут остаться без своевременной поддержки. Совет островов обсуждает, стоит ли немедленно вступить в войну ради возвращения наших земель."
 A10_philippines.1.a:0 "Это наш шанс!"
 A10_philippines.1.b:0 "Не стоит рисковать"