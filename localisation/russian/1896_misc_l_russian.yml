 ZAN_GATHERING_STORM_DESC: "После Великого Исхода Занзибар стал одним из крупнейших портов нового океанического мира. Через его гавани проходят торговые суда, беженцы и авантюристы со всех концов Индийского океана, а его рынки давно стали местом встречи десятков народов и культур.\n\nОднако за богатством портовых кварталов скрывается нищета и напряжение. Влияние ОВТ растет, агенты Красной Розы действуют в тени, а судьба острова всё чаще решается не в дворцах Занзибара, а далеко за его пределами."
