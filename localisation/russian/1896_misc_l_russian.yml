 POR_subject_DEF: "$OVERLORDADJ$ая $POR$"
 PPN_CANON_START_DESC:0 "На Панае совет касиков удерживает союз аграрных общин. Здесь не желают менять местную свободу на распоряжения далёкой столицы, но море уже не гарантирует безопасности. Будущее Конфедерации зависит и от решения этого острова."
 PSL_CANON_START_DESC:0 "Султан Джамалул Кирам II правит островами, где морские пути важнее сухопутных границ. Сулу не спешит доверять ни Конфедерации, ни Японии. Чужое покровительство обещает защиту, но его цена может оказаться выше военной угрозы."
 PSY_CANON_START_DESC:0 "Наследник Баргаша перенёс султанскую власть на Сейшелы. Океан защитил новый двор от Песни, но отрезал его от прежних владений. Между торговлей и памятью об утраченном доме предстоит найти опору для будущего."
 PZ_OTHER_COUNTRIES_DESC:0 "За пределами великих держав живут республики, султанаты и союзы общин. Выберите страну на карте или в списке: у каждого острова своя история в мире Песни."
