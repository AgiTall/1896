 JPC_1895_accounts:0 "Пересмотреть военные расходы"
 JPC_1895_accounts_desc:0 "Императорская проверка выявила расхождения между планами штаба и возможностями казны. Утвердим новую смету и вернём кабинету политическую инициативу для продолжения кампании."
 JPC_australian_assurances:0 "Заверить Австралию в безопасности"
 JPC_australian_assurances_desc:0 "Направим в Сидней объяснение целей южной кампании и заверения в безопасности Австралии. Её правительство самостоятельно ответит на предложение; дипломатическая нота не гарантирует доверия."
 JPC_batavia_demands:0 "Подготовить поход на Борнео"
 JPC_batavia_demands_desc:0 "Согласуем задачи десанта и приказы эскадрам. Борнейская кампания даст опыт морских операций, охранения и длительного снабжения. Закрепление этого опыта позволит создать флот дальнего действия и постоянный объединённый штаб. Высадку и удержание плацдарма предстоит выполнить самим."
 JPC_borneo_bridgehead:0 "Поддержать высадку на Борнео"
 JPC_borneo_bridgehead_desc:0 "Подготовим командование к снабжению и удержанию захваченного берега. Военный опыт поможет организовать операцию, но высадить войска и удержать плацдарм придётся самим: только занятая земля даст довод на мирных переговорах."
 JPC_casualty_returns:0 "Учёт потерь и помощь семьям"
 JPC_casualty_returns_desc:0 "Ведомства скрывают потери за победными донесениями. Сведём списки погибших и раненых, известим семьи и добьёмся согласованной помощи тем, кто заплатил за поход больше остальных."
 JPC_convoy_budget:0 "Строительство транспортов"
 JPC_convoy_budget_desc:0 "Новые верфи бесполезны без регулярного снабжения. Направим морской бюджет на транспортные суда и угольные запасы: эскадры должны получать необходимое без перерывов между рейсами."
 JPC_count_the_cost:0 "Подвести итоги войны"
 JPC_count_the_cost_desc:0 "После борнейского урегулирования кабинет должен подсчитать потери и обязательства. Победа потребует исполнить обещание нефтяных доходов; поражение — разобраться с необеспеченными займами. Обоим исходам нужна демобилизация."
 JPC_defeat_inquest:0 "Расследование поражения"
 JPC_defeat_inquest_desc:0 "Обещанной борнейской нефти не будет, а долги остались. Признаем причины поражения и договоримся о пересмотре обязательств. Кредиторы потребуют сократить гражданские заказы; обществу придётся объяснить цену этих уступок."
 JPC_garrison_accounts:0 "Перевооружить и снабдить Манилу"
 JPC_garrison_accounts_desc:0 "Вооружить гарнизон и закрепить приоритет манильских конвоев. Это подготовка южного театра, а не автоматическая победа над Филиппинами. Без этого фокуса военный бюджет и борнейская кампания недоступны."
 JPC_hold_until_talks:0 "Обеспечить длительную кампанию"
 JPC_hold_until_talks_desc:0 "Пересмотрим военную смету, проверим фронт и наладим караваны Сулу. Кабинет получит средства для удержания позиций до переговоров. Победу по-прежнему определит фактическое положение на Борнео."
 JPC_honolulu_letters:0 "Запросить обслуживание на Гавайях"
 JPC_honolulu_letters_desc:0 "Попросим королевство обслуживать японские торговые суда. Взамен подтвердим уважение к его нейтралитету. Гавайи вправе отказать; согласие не передаёт нам базы, территорию или союзные войска."
 JPC_honshu_depots:0 "Постоянные поставки на Север"
 JPC_honshu_depots_desc:0 "Устроить склады и постоянный график снабжения Хоккайдо. Пока действует мирный протокол, при запасе менее трёх месяцев автоматически отправляются 250 винтовок и четыре транспорта, если они есть на складах. Дефицит по-прежнему подрывает доверие Сайго."
 JPC_hospital_ships:0 "Госпитальные рейсы"
 JPC_hospital_ships_desc:0 "Учёт потерь показал, сколько раненых остаётся в переполненных прибрежных лазаретах. Выделим суда для эвакуации и свяжем фронтовые перевязочные пункты с госпиталями на родных островах."
 JPC_imperial_inspection:0 "Императорская проверка фронта"
 JPC_imperial_inspection_desc:0 "Мэйдзи потребует правдивых докладов о положении частей и посетит госпитали. Его вмешательство должно заставить соперничающие ведомства признать общую ответственность за продолжение войны."
 JPC_iwasaki_accounts:0 "Проверка счетов Мицубиси"
 JPC_iwasaki_accounts_desc:0 "Прежде чем оплачивать новые заказы, казначейство должно проверить выставленные Ивасаки счета. Отделим действительные военные расходы от частных обязательств и подготовим достоверный реестр государственного долга."
 JPC_manila_priority:0 "Наладить снабжение Манилы"
 JPC_manila_priority_desc:0 "Ито связывает кредит и северный компромисс с необходимостью удержать Манилу. Наладить доставку продовольствия, боеприпасов и охранение перевозок. Эта колонна обязательна для общего бюджета и выхода к Борнео."
 JPC_no_short_war:0 "Перейти к затяжной кампании"
 JPC_no_short_war_desc:0 "Быстрого решения на Борнео не получилось. Кабинет признает необходимость долгой войны и добьётся поддержки её продолжения. Это даст политические средства для дальнейших приготовлений, но не заменит пополнений на фронте."
 JPC_northern_protocol:0 "Договориться с Сайго"
 JPC_northern_protocol_desc:0 "Сохранить мир и автономию Хоккайдо, чтобы армия могла готовиться к действиям на континенте. Сайго получает снабжение и пакт о ненападении. Он не отказывается от тайной экспедиции в Гренландию: для её отзыва понадобится отдельное решение и доверие выше 54."
 JPC_nz_watch:0 "Следить за британскими базами"
 JPC_nz_watch_desc:0 "Наладим наблюдение за британскими опорными пунктами Новой Зеландии. Сведения о движении кораблей помогут штабу оценить угрозу нашим маршрутам. Фокус даёт опыт и возможности командования, но не начинает новую войну."
 JPC_oil_promise:0 "Передать нефтяные права Мицубиси"
 JPC_oil_promise_desc:0 "Ивасаки профинансировал поход под обещание борнейской нефти. После победы исполним гарантии и закрепим монополию Мицубиси. Казна получит возможность рассчитаться по части обязательств ценой уступки доходов промышленникам."
 JPC_one_war_cabinet:0 "Кабинет военного времени"
 JPC_one_war_cabinet_desc:0 "Начавшаяся война требует общего руководства. Опираясь на уже подготовленные договорённости, соберём министров и командующих за одним столом и согласуем потребности фронта с возможностями казны."
 JPC_osaka_orders:0 "Развивать фабрики Хонсю"
 JPC_osaka_orders_desc:0 "Адмиралтейский курс требует собственной промышленной базы. Расширение фабрик открывает военные заводы и верфи, затем единые производственные стандарты и инженерные школы. Завершение цепочки превратит военные подряды в самостоятельную промышленную систему с дополнительной исследовательской ячейкой."
 JPC_partial_demobilisation:0 "Частичная демобилизация"
 JPC_partial_demobilisation_desc:0 "Филиппинские гарнизоны остаются, но борнейская кампания закончена. Снизить военные расходы можно без отказа от всех обязательств."
 JPC_pledged_yards:0 "Расширение японских верфей"
 JPC_pledged_yards_desc:0 "Расширим японские верфи для флота, который поведёт южную кампанию. Строительство доступно после развития фабрик Хонсю. Военные заказы во время войны могут вызвать отдельный счёт казначейству."
 JPC_rebuild_ports:0 "Восстановление портов Сабаха"
 JPC_rebuild_ports_desc:0 "Победный договор не ремонтирует причалы. Средства идут на Сабах лишь пока он действительно принадлежит империи."
 JPC_regional_dispatches:0 "Соглашения в южных морях"
 JPC_regional_dispatches_desc:0 "Обратимся к Австралии и Гавайям, согласуя безопасность соседей и обслуживание судов. Каждая страна самостоятельно ответит на предложение. Отдельная миссия к ВТП позволит запросить кредит."
 JPC_replace_losses:0 "Промышленная и инженерная база"
 JPC_replace_losses_desc:0 "Объединим расширение военных заводов с едиными стандартами заказов и подготовкой инженеров. Следующий этап — самостоятельная промышленная держава после урегулирования военных долгов."
 JPC_state_guarantees:0 "Гарантировать займы Мицубиси"
 JPC_state_guarantees_desc:0 "Кредиторы Мицубиси — банки и торговые дома Осаки. Государственная гарантия спасёт конгломерат и Партию Золотой Середины от краха, но сделает казну зависимой от Ивасаки: −0,10 политической власти в день и +3% потребительских товаров. ВТП не является кредитором по этим внутренним векселям."
 JPC_sulu_escorts:0 "Конвои через море Сулу"
 JPC_sulu_escorts_desc:0 "Пиратские рейды и филиппинская война угрожают одному маршруту. Выделим сопровождение, не объявляя султанат своей собственностью."
 JPC_three_heads_again:0 "Пересмотреть союз трёх сил"
 JPC_three_heads_again_desc:0 "После войны вернёмся к спору Ито, Сайго и Ивасаки. Теперь цель — завершить временный раскол: согласовать интересы армии и флота, определить полномочия Мэйдзи и подписать постоянный договор с Севером. Проведённые реформы позволят заменить соперничество ведомств устойчивым управлением."
 JPC_war_workshops:0 "Строительство военных заводов"
 JPC_war_workshops_desc:0 "В рамках южного курса построим военный завод на базе гражданской промышленности. Заказы адмиралтейства и армии можно разместить до начала войны."
 JPC_wtc_mission:0 "Запросить кредит у ВТП"
 JPC_wtc_mission_desc:0 "Направим Палате заявку на военный кредит. Полученные транспорты помогут продолжить поход, но обслуживание долга ляжет на будущие доходы. Палата сама решает, принять заявку или отказать."
 JPD_engineering_schools:0 "Подготовить японских инженеров"
 JPD_engineering_schools_desc:0 "Заводы должны уметь совершенствовать производство собственными силами. Откроем инженерные школы при предприятиях и передадим им опыт военных заказов. Подготовленные специалисты ускорят следующие промышленные исследования."
 JPD_finance_resolved_tt:0 "Военная долговая книга закрыта через решение казначейства."
 JPD_industrial_power:0 "Самостоятельная промышленная держава"
 JPD_industrial_power_desc:0 "Собственные инженеры, стандартизированные предприятия и устойчивое финансирование позволяют Японии развиваться после войны. Завершим промышленную реформу: улучшим выпуск и освоение продукции, расширим постоянную исследовательскую базу. Зависимость от отдельных срочных заказов уступит место развитию национальной промышленности."
 JPD_integrated_staff:0 "Постоянный объединённый штаб"
 JPD_integrated_staff_desc:0 "После демобилизации сохраним опыт сухопутной и морской служб. Временный военный кабинет уступит место постоянному штабу, согласующему операции и снабжение. Борнейская кампания и опыт Манилы станут основой общей военной системы."
 JPD_north_settled_tt:0 "Постоянное соглашение с Сайго подписано."
 JPD_ocean_fleet:0 "Флот дальнего действия"
 JPD_ocean_fleet_desc:0 "Корпус морских самураев, караваны Сулу и наблюдение за британскими базами дали опыт длительной морской кампании. Закрепим его в постоянных правилах службы, снабжения и взаимодействия эскадр. Флот сможет действовать вдали от японских портов с меньшими затратами снабжения."
 JPD_professional_logistics:0 "Постоянная служба армейского снабжения"
 JPD_professional_logistics_desc:0 "Совет снабжения или подготовленные интенданты уже упорядочили работу гарнизона, а ротация дала опыт сбережения людей. Распространим эти правила на всю армию: учёт, доставка и смена частей станут постоянной службой, снижающей расход припасов и укрепляющей организацию войск."
 JPD_reformed_empire:0 "Империя после реформ"
 JPD_reformed_empire_desc:0 "Япония прошла путь от временного союза трёх сил к промышленной державе с устойчивым управлением и постоянным объединённым штабом. Подведём итог реформам и закрепим новый государственный курс. Нефтяные договоры и ответственность за колониальную политику остаются частью этого будущего."
 JPD_settle_three_heads:0 "Завершить раскол трёх сил"
 JPD_settle_three_heads_desc:0 "Армия и флот приняли общий курс, полномочия Мэйдзи закреплены, а постоянный договор с Сайго действительно подписан. Устраним чрезвычайное соперничество ведомств и закрепим новый порядок управления. Хоккайдо сохранит самостоятельность, а уступки промышленникам останутся ценой достигнутого соглашения."
 JPD_standard_orders:0 "Единые промышленные заказы"
 JPD_standard_orders_desc:0 "Военные заводы и верфи уже расширены. Объединим требования к деталям, приёмке и срокам поставок, чтобы каждый новый заказ укреплял общую производственную систему. Это начало перехода от отдельных подрядов к постоянной промышленной базе."
 JPD_sustainable_credit:0 "Заменить чрезвычайные займы бюджетом"
 JPD_sustainable_credit_desc:0 "Военная долговая книга закрыта, порядок оплаты поставок установлен. Переведём заказы на устойчивое финансирование. Казна сможет планировать расходы без ежемесячного спасения очередного военного займа; действующие нефтяные обязательства сохраняются."
 JPF_bond_register:0 "Реестр военных обязательств"
 JPF_bond_register_desc:0 "Проверенные счета позволят отделить государственные займы от частных долгов Мицубиси. Составим единый реестр, чтобы казначейство знало, кому и за что оно обязано платить."
 JPF_civil_budget:0 "Вернуть вклады и закрыть военную смету"
 JPF_civil_budget_desc:0 "Подготовим возврат мелких вкладов и переход к мирному бюджету. После урегулирования нефтяных обязательств и внешних долгов решение казначейства закроет военную книгу. Тогда станет доступно завершение промышленной реформы."
 JPF_coal_not_glory:0 "Угольные контракты флота"
 JPF_coal_not_glory_desc:0 "Закрепим регулярные поставки угля за действующими эскадрами. Предварительная оплата увеличит ближайшие расходы, зато позволит снабжать корабли без дорогих срочных закупок."
 JPF_delivery_calendar:0 "Оплатить военные поставки"
 JPF_delivery_calendar_desc:0 "После реформы займов казна оплачивает военные заказы. Крах Мицубиси блокирует этот фокус до завершения чрезвычайной реструктуризации. Оплаченные поставки — обязательное условие общего бюджета."
 JPF_excise_bargain:0 "Акцизы на обслуживание долга"
 JPF_excise_bargain_desc:0 "Проверка казны показала, каких поступлений не хватает для расчёта с кредиторами. Разрешим чрезвычайный акцизный сбор. Он облегчит выплаты, но переложит военные расходы на жителей городов и торговлю."
 JPF_madeira_table:0 "Обсудить внешний военный заём"
 JPF_madeira_table_desc:0 "Представители Палаты предложат кредит под страховку Серебряного Конвоя. Кабинету предстоит выбрать между новыми транспортами с дополнительными долговыми обязательствами и сокращением гражданских заказов."
 JPF_public_accounts:0 "Реформа государственных займов"
 JPF_public_accounts_desc:0 "Свести частные векселя и государственные обязательства в проверяемую долговую книгу. Реформа останавливает срок до краха даже при принятии долгов под казну; она не отменяет зависимости от Ивасаки или недоверия Осаки. После уже состоявшегося краха потребуется отдельная реструктуризация."
 JPF_return_small_savings:0 "Выкупить мелкие военные облигации"
 JPF_return_small_savings_desc:0 "Семьи солдат вложили сбережения в обещание короткого похода. Вернём средства мелким держателям облигаций, когда долговое давление позволит начать выкуп. Это поможет восстановить доверие к казначейству."
 JPF_royalty_register:0 "Нефтяные доходы на выплату долга"
 JPF_royalty_register_desc:0 "Нефть Борнео заложена заранее. Реестр роялти направит часть доходов на долг; обещанная Мицубиси монополия останется ценой победы."
 JPF_small_subscription:0 "Срочный заём у промышленников"
 JPF_small_subscription_desc:0 "Вместо долгой проверки счетов примем быстрый аванс Мицубиси и привлечём сбережения частных вкладчиков. Транспорты поступят раньше, но обязательства вырастут, а открытый разбор счетов придётся отложить."
 JPI_airship_hangars:0 "Небесные верфи"
 JPI_airship_hangars_desc:0 "Известные принципы воздухоплавания воплотятся в собственной серии из 24 дирижаблей. Их производственная стоимость снижается на 15%; выпуск кораблей падает на 10%, тяжёлая эскадра подкрепления не строится."
 JPI_closed_ports:0 "Опора на собственные силы"
 JPI_closed_ports_desc:0 "Выбрать собственную промышленную базу: военный завод, бонус к промышленному исследованию и открытие выбора между углём Кюсю и нефтяной программой. Учёт сырья включён в этот фокус."
 JPI_coastal_trials:0 "Морские испытания генераторов"
 JPI_coastal_trials_desc:0 "Завершить корабельную энергетическую программу: −8% морского расхода снабжения, +10% скорости подготовки вторжений, 15 морского опыта и 10 транспортов. Даёт техническую готовность к Южному рывку. Переносные башни этим путём недоступны."
 JPI_copied_samples:0 "Японские образцы машин"
 JPI_copied_samples_desc:0 "Разбираем образцы и воспроизводим узлы без признания источника. Это дольше; слабая агентурная сеть всё ещё оставляет 20% риска провала."
 JPI_electrical_bureau:0 "Бюро Теслы"
 JPI_electrical_bureau_desc:0 "Сосредоточить электротехническую программу в едином бюро. Даёт 50% бонус к одному промышленному исследованию. Исключает мастерские флота; после любого из этих путей можно выбрать переносные башни или корабельные генераторы."
 JPI_fleet_workshops:0 "Мастерские флота"
 JPI_fleet_workshops_desc:0 "Передать разработку электрических систем мастерским флота. Даёт 15 морского опыта и +5% скорости строительства верфей, но увеличивает долговое давление на 5. Исключает единое бюро Теслы; обе организации могут выбрать любой энергетический путь."
 JPI_japanese_terms:0 "Диктовать условия торговли"
 JPI_japanese_terms_desc:0 "Закупать машины на японских условиях: доступ к внешним контрактам, местные вольфрам и хром, затем выбор между посредническими закупками и копированием образцов. Подготовка контрактов включена в этот фокус."
 JPI_kure_yards:0 "Расширение верфей Курэ"
 JPI_kure_yards_desc:0 "Расширяем существующие стапели Курэ и готовим тяжёлую эскадру. Выпуск кораблей растёт на 10%, но изъятие специалистов повышает производственную стоимость авиации на 10%. Небесные верфи придётся оставить без средств."
 JPI_kyushu_coal:0 "Угольные бассейны Кюсю"
 JPI_kyushu_coal_desc:0 "Паровые машины остаются опорой эскадры. Разработка бассейнов Кюсю ускоряет строительство верфей на 15%, но обслуживание угольной сети увеличивает расход морского снабжения на 10%."
 JPI_leak_tt:0 "Сведения о заказах утекли: секретность эскадры снижена на 180 дней."
 JPI_oil_hunger:0 "Чёрное золото Юга"
 JPI_oil_hunger_desc:0 "Флот пока идёт на угле, но будущие двигатели потребуют нефтепереработки. Даём два 100%-ных бонуса исследованиям переработки; переоснащение снижает выпуск военных заводов на 10% на 180 дней. Срок южного похода сокращается на 30 дней."
 JPI_portable_prototype:0 "Переносные башни"
 JPI_portable_prototype_desc:0 "За 25 политической власти разработать переносной образец башни Теслы. Исключает корабельные генераторы и открывает береговые испытания. Итоговая система усиливает флот в бою и даёт 20 транспортов."
 JPI_proxy_machines:0 "Закупки через третьих лиц"
 JPI_proxy_machines_desc:0 "Подставные покупатели доставят станки быстрее. Вероятность раскрытия заказа — 35%; утечка ослабит секретность будущей эскадры."
 JPI_quiet_coast:0 "Испытать башни на берегу"
 JPI_quiet_coast_desc:0 "Завершить программу переносных башен: боевой дух электротехнического флота, 20 транспортов и техническая готовность к Южному рывку. Это завершение выбранного пути, без отдельного фокуса на бюрократическое утверждение."
 JPI_raw_register:0 "Инвентаризация ресурсов империи"
 JPI_raw_register_desc:0 "Сводим внутренние запасы в единый реестр. Шахты и мастерские смогут работать без посредничества Палаты."
 JPI_scarlet_iron:0 "Алые паруса: тяжёлые корабли"
 JPI_scarlet_iron_desc:0 "Результат выбранного промышленного курса Японии."
 JPI_scarlet_sails:0 "Алые паруса"
 JPI_scarlet_sails_desc:0 "Свести выбранные промышленные, корабельные и энергетические решения в единую доктрину. Доступно после береговых испытаний башен или морских испытаний генераторов. Награды зависят от выбранных ресурсов и типа верфей."
 JPI_scarlet_sky:0 "Алые паруса: дирижабли над берегом"
 JPI_scarlet_sky_desc:0 "Результат выбранного промышленного курса Японии."
 JPI_ship_generators:0 "Корабельные генераторы"
 JPI_ship_generators_desc:0 "За 15 политической власти разработать корабельную энергетическую установку и получить 5000 топлива. Исключает переносные башни. Морские испытания дадут экономию снабжения и ускорят подготовку высадок."
 JPI_southern_push:0 "Операция «Нанъё»"
 JPI_southern_push_desc:0 "Нанъё — южный поход императорского адмиралтейства. Испытанные электрические станции и готовая эскадра открывают путь к Борнео. Ультиматум будет предъявлен по истечении срока подготовки, либо сразу, если тот уже прошёл. Нефтяная программа сокращает действующий таймер ещё на 15 дней."
 JPI_standard_node:0 "Стандартизация производства"
 JPI_standard_node_desc:0 "Каким бы ни был источник материалов и станков, корабли получат взаимозаменяемые узлы. Достаточно завершить один из четырёх путей."
 JPI_towers_tt:0 "Переносные вышки готовы. Их радиус около 500 м представлен бонусом высадки; отдельной зоной на карте он не отображается."
 JPI_unsigned_contracts:0 "Тайные торговые соглашения"
 JPI_unsigned_contracts_desc:0 "Заказы оформляют торговые дома. В порту появляются вольфрам и хром, а Палата сохраняет копии закупочных ведомостей."
 JPL_borneo_is_not_luzon:0 "Вернуть внимание гарнизону Манилы"
 JPL_borneo_is_not_luzon_desc:0 "Борнейское урегулирование освобождает часть внимания штаба, но не завершает войну на Лусоне. Перераспределим охранение и дадим отдых манильским частям. Новые поставки увеличат расходы казны."
 JPL_convoy_timetable:0 "Постоянное охранение Манилы"
 JPL_convoy_timetable_desc:0 "Закрепим эскортные корабли за манильскими караванами. Гарнизон получит надёжное снабжение, но южной эскадре придётся обходиться меньшими силами. Одновременный приоритет обоих направлений флоту не по средствам."
 JPL_forward_workshops:0 "Полевые ремонтные мастерские"
 JPL_forward_workshops_desc:0 "Сделать ставку на ремонт и оружейные запасы: 500 винтовок и постоянное снижение расхода снабжения на 5%. Цена — +5 долгового давления и +5 усталости гарнизона, которому придётся отложить ротацию. Исключает медицинскую ротацию."
 JPL_limited_mandate:0 "Установить правила оккупации Лусона"
 JPL_limited_mandate_desc:0 "Закрепим ответственность управы за закупки, довольствие и действия гарнизона. Подотчётное управление поможет ограничить цену оккупации. Война с Филиппинской конфедерацией продолжается до отдельного урегулирования."
 JPL_medical_rotation:0 "Помощь солдатам и ротация"
 JPL_medical_rotation_desc:0 "Направить ресурсы на госпитальные суда и ротацию гарнизона. Снижает усталость, укрепляет стабильность и даёт опыт, но требует политических расходов. Исключает полевые ремонтные мастерские; оба варианта открывают профессиональную логистику."
 JPL_municipal_buyers:0 "Договориться о местных закупках"
 JPL_municipal_buyers_desc:0 "Привлечём местные управы к снабжению гарнизона продовольствием. Политическая поддержка договорённостей подготовит создание общего совета поставок. Постоянные закупки и их стоимость потребуют дальнейших решений."
 JPL_names_and_units:0 "Приоритет борнейской эскадры"
 JPL_names_and_units_desc:0 "Сосредоточим главные морские силы у Борнео. Эскадра будет действовать согласованнее, но Маниле придётся терпеть перебои и обходиться редкими караванами. Местные проверки и ротация помогут гарнизону пережить нехватку охранения."
 JPL_payroll_inquiry:0 "Расследовать хищения жалованья"
 JPL_payroll_inquiry_desc:0 "В гарнизонных ведомостях числятся деньги и припасы, которых солдаты не получали. Начнём расследование связей чиновников, подрядчиков и офицеров. Его выводы потребуют отдельного решения кабинета."
 JPL_port_and_mountains:0 "Сократить периметр гарнизона"
 JPL_port_and_mountains_desc:0 "За пределами Манилы дороги и горы остаются опасными для наших частей. Сосредоточим снабжение на меньшем числе позиций, чтобы снизить нагрузку на гарнизон. Контроль над остальным Лусоном придётся устанавливать в ходе войны."
 JPL_quartermaster_school:0 "Открыть школу интендантов"
 JPL_quartermaster_school_desc:0 "Расследование ведомостей показало нехватку подготовленных служащих. На средства военного бюджета откроем школу приёмки и учёта грузов. Обученные интенданты помогут снизить дальнейшую нагрузку на гарнизон."
 JPL_supply_board:0 "Реформа гарнизонного снабжения"
 JPL_supply_board_desc:0 "Объединим местные закупки, расследование растрат, совет поставок и обучение интендантов. Решения расследования сохранятся в событиях; каждый административный шаг больше не требует отдельного фокуса."
 JPN_north_admiralty_hearing:0 "Снизить недовольство адмиралтейства"
 JPN_north_admiralty_hearing_desc:0 "Ито считает, что северный нейтралитет отнимает у флота суда и деньги. Выслушаем его офицеров и согласуем расходы, чтобы уменьшить раздражение. От Сайго не потребуют отправить дивизии на юг."
 JPN_north_civilian_holds:0 "Гражданские караваны на Север"
 JPN_north_civilian_holds_desc:0 "Зафрахтуем торговые суда с продовольствием для Хоккайдо. Это позволит исполнять договор, меньше отвлекая военные перевозки. Выбирая регулярные караваны, кабинет отказывается от расчёта на отсрочки."
 JPN_north_emergency_calendar:0 "Отсрочка северных поставок"
 JPN_north_emergency_calendar_desc:0 "Попросим Сайго письменно разрешить задержку части грузов ради южной кампании. Адмиралтейство сохранит суда для Борнео, но на Севере уступку сочтут очередным доказательством ненадёжности Токио."
 JPN_north_imperial_arbitration:0 "Урегулировать северные поставки"
 JPN_north_imperial_arbitration_desc:0 "После договора согласовать гражданские поставки и уступки Сайго; после объявления мятежа — утвердить снабжение северного фронта. Оба пути открывают бюджет, но военный путь не выдаёт победу над Хоккайдо и не прекращает расходы до его покорения."
 JPN_north_inspection_channel:0 "Совместная проверка складов"
 JPN_north_inspection_channel_desc:0 "Даже исправные ведомости не гарантируют, что груз дошёл до получателя. Предложим Сайго совместную проверку складов и отдельно согласуем полномочия инспекторов, чтобы ревизию не приняли за попытку вмешательства."
 JPN_north_keep_distance:0 "Гарантии самостоятельности Севера"
 JPN_north_keep_distance_desc:0 "Принять пределы договора: Север не даёт солдат, Токио не командует его складами. Снабжение становится постоянным обязательством вместо повторяющихся ультиматумов."
 JPN_north_permanent_protocol:0 "Постоянное соглашение с Севером"
 JPN_north_permanent_protocol_desc:0 "Исправные поставки и восстановленное доверие позволят заменить временный договор постоянным. Сайго сохранит самостоятельное командование, а Токио примет устойчивые обязательства по снабжению Хоккайдо."
 JPN_north_postwar_audience:0 "Постоянный договор с Сайго"
 JPN_north_postwar_audience_desc:0 "Проведём послевоенную аудиенцию, подготовим постоянный протокол и гарантируем самостоятельность Севера. Окончательная подпись зависит от доверия и реальных поставок; один фокус не заменяет исполнения договора."
 JPN_north_supply_register:0 "Учёт поставок на Хоккайдо"
 JPN_north_supply_register_desc:0 "Склады готовы принимать грузы, но каждый рейс должен соответствовать обещаниям Сайго. Введём единый учёт запасов и отправок, чтобы северные части не оставались без снабжения из-за споров между ведомствами."
 JPN_north_tokyo_auditors:0 "Проверка отправителей в Токио"
 JPN_north_tokyo_auditors_desc:0 "Недостача может возникнуть ещё до выхода судов в море. Проверим столичные ведомства наравне с северными складами: взаимные обвинения уступят место сверке документов, а казна избавится от лишних расходов."
 JPR_defence_budget:0 "Утвердить военный бюджет"
 JPR_defence_budget_desc:0 "Общий бюджет требует трёх результатов: оплаченных военных поставок, урегулированного снабжения Севера по мирному или военному пути и перевооружённой Манилы. Крах Мицубиси должен быть устранён. Бюджет открывает промышленную ветку «Алые паруса», которая ведёт к Южному рывку и Борнео."
 JPT_north_front_supply:0 "Снабдить северный фронт"
 JPT_north_front_supply_desc:0 "Выдать 500 винтовок и организовать фронтовые поставки. Долговое давление вырастет на 8. Открывает урегулирование северного снабжения; победу в гражданской войне придётся обеспечить армии."
 JPT_north_rebellion:0 "Объявить Север мятежным"
 JPT_north_rebellion_desc:0 "Возобновить гражданскую войну с Хоккайдо. Кабинет освобождается от уступок Сайго и отдаёт южные ресурсы Ито, но северный фронт требует +5% потребительских товаров и +10% снабжения; стабильность падает на 8%. Пока Север не покорён, экспедиция Сайго остаётся угрозой."
 JPT_north_settled_tt:0 "Подписан постоянный компакт с Сайго или мятежное Хоккайдо покорено."
 JPT_treasury_debts:0 "Взять долги под казну"
 JPT_treasury_debts_desc:0 "Передать частные обязательства Мицубиси под прямой контроль казны. Ивасаки теряет финансовый рычаг, но банки и купечество Осаки теряют доверие: −8% к строительству гражданских фабрик, −4% к выпуску военных заводов, −4% стабильности. Этот шаг сам по себе не останавливает крах: успейте провести реформу займов за 180 дней."
 JPX_kami:0 "Опереться на синтоистское духовенство"
 JPX_kami_desc:0 "Представители святилищ предлагают объединить страну вокруг священного авторитета императора. Их поддержка укрепит положение двора, но даст жрецам собственное влияние и потребует средств на содержание святилищ.\n\n§YАльтернативный путь: в этой версии доступны выбор курса и один следующий фокус. Основная кампания и её промышленность требуют поддержки адмиралтейства.§!"
 JPX_kami_institution:0 "Созвать совет святилищ"
 JPX_kami_institution_desc:0 "Представители святилищ обсудят создание Божественного Самурайского Ордена. Нам предстоит выбрать между помощью семьям солдат и общим религиозным воззванием, определив первую обязанность нового движения.\n\n§YАльтернативный путь: в этой версии доступны выбор курса и один следующий фокус. Основная кампания и её промышленность требуют поддержки адмиралтейства.§!"
 JPX_land:0 "Поддержать Северную армию"
 JPX_land_desc:0 "Сайго предлагает опереться на сухопутных офицеров, крестьян и жрецов. Его сторонники хотят вернуть империи континентальные цели; флот опасается потери денег и влияния.\n\n§YАльтернативный путь: в этой версии доступны выбор курса и один следующий фокус. Основная кампания и её промышленность требуют поддержки адмиралтейства.§!"
 JPX_land_institution:0 "Принять посланников Сайго"
 JPX_land_institution_desc:0 "Северные проповедники представят замысел Ордена Чистой Земли. Двор решит, какую поддержку оказать новому движению. Переговоры сохраняют самостоятельность Хоккайдо и командование Сайго.\n\n§YАльтернативный путь: в этой версии доступны выбор курса и один следующий фокус. Основная кампания и её промышленность требуют поддержки адмиралтейства.§!"
 JPX_prologue_tt:0 "Выбран политический курс. Это подготовительная часть пути: она не заключает мир, не меняет владельцев территорий и не завершает преобразование государства."
 JPX_sea:0 "Курс императорского адмиралтейства"
 JPX_sea_desc:0 "Адмиралтейство требует подготовки к южному походу. После Исхода промышленная самостоятельность стала вопросом выживания: известные принципы электрической защиты и воздухоплавания ещё предстоит воплотить в японских образцах."
 JPX_sea_institution:0 "Учредить корпус морских самураев"
 JPX_sea_institution_desc:0 "После утверждения военного бюджета Ито представит проект особого морского корпуса. На совете предстоит определить его устройство и цену. Устав станет началом подготовки десантных частей."
 JPX_throne:0 "Установить личное правление Мэйдзи"
 JPX_throne_desc:0 "Император потребует прямых докладов от ведомств и начнёт отстранять посредников трёх фракций. Чтобы личная власть действовала за пределами дворца, ей понадобятся собственная канцелярия и проверенные чиновники.\n\n§YАльтернативный путь: в этой версии доступны выбор курса и один следующий фокус. Основная кампания и её промышленность требуют поддержки адмиралтейства.§!"
 JPX_throne_institution:0 "Учредить императорскую канцелярию"
 JPX_throne_institution_desc:0 "Небольшая канцелярия будет проверять счета и докладывать лично Мэйдзи. Двору придётся потратить политическое влияние на создание аппарата. Новые титулы не передают императору северные войска.\n\n§YАльтернативный путь: в этой версии доступны выбор курса и один следующий фокус. Основная кампания и её промышленность требуют поддержки адмиралтейства.§!"
 JPX_trade:0 "Передать инициативу промышленникам"
 JPX_trade_desc:0 "Ивасаки предлагает искать выход в торговле и переговорах. Промышленники готовы поддержать кабинет, который займётся долгами и подготовит условия соглашения с Батавией. Выбор курса сам по себе не заключает мир.\n\n§YАльтернативный путь: в этой версии доступны выбор курса и один следующий фокус. Основная кампания и её промышленность требуют поддержки адмиралтейства.§!"
 JPX_trade_institution:0 "Подготовить условия торгового мира"
 JPX_trade_institution_desc:0 "Соберём долговые книги и поручим промышленникам подготовить предложения Батавии. Ревизия поможет сократить внутреннее долговое давление, но сама по себе не остановит войну и не обеспечит согласия Нидерландов.\n\n§YАльтернативный путь: в этой версии доступны выбор курса и один следующий фокус. Основная кампания и её промышленность требуют поддержки адмиралтейства.§!"
 JSM_offer_desc:0 "Токио предлагает признать японское верховенство. Согласие сохранит местную администрацию под властью Японии; отказ даст Японии цель войны на подчинение."
