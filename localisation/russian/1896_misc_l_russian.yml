 ZZZ_GATHERING_STORM_DESC: "Пустошь не строит государство в привычном смысле. Там, где прежде были города, пути и законы, она оставляет выжженную тишину, редкие убежища и власть тех, кто пережил конец старого мира.\n\nЧернота правит не обещаниями будущего, а самим фактом распада. Если Пустошь двинется дальше, за ней останутся лишь молчание, голод и медленное исчезновение всего, что ещё пыталось называться цивилизацией."
