 A01_ROYAL_EMPIRE_neutrality_DEF:0 "Королевская империя Нидерландов"
 A01_admirals_council:0 "Власть Совета Адмиралов"
 A01_admirals_council_desc:0 "В Батавии правит Военно-морская коллегия. Обычно адмиралы блокируют пересмотр законов о призыве, экономике и торговле, однако конституционные поправки могут временно изменить полномочия самого Совета."
 A01_admirals_council_laws_allowed_status:0 "£trigger_yes  Изменять законы о призыве\n£trigger_yes  Изменять законы об экономике\n£trigger_yes  Изменять законы о торговле"
 A01_admirals_council_laws_locked_status:0 "£trigger_no  Изменять законы о призыве\n£trigger_no  Изменять законы об экономике\n£trigger_no  Изменять законы о торговле"
 A01_admirals_council_laws_locked_tt:0 "Смена законов о призыве, экономике и торговле: £trigger_no"
 A01_admirals_council_laws_status_tt:0 "[Root.GetA01AdmiralsLawsStatus]"
 A01_admirals_side:0 "Совет адмиралов"
 A01_admirals_stratocracy:0 "Морская стратократия"
 A01_admirals_stratocracy_desc:0 "Совет Адмиралов подчинил государство интересам флота. Верфи расширяются, а общество готовят к неизбежной борьбе за океан."
 A01_army_advisor_unlocked_tt:0 "Станет доступен начальник армии §YИнспекция колониальной армии (КНИЛ)§! с бонусом к обороне. КНИЛ — регулярные сухопутные войска Нидерландов в Индонезии. Назначение стоит 100 политической власти."
 A01_army_development:0 "Военное строительство"
 A01_army_development_desc:0 "Перестройка армии затрагивает обучение, командование и снабжение. Общая подготовка офицеров и согласованная работа ведомств должны превратить разрозненные гарнизоны в надёжную защиту архипелага."
 A01_australian_project_tt:0 "Австралия: §G+10§! отношения. Принимаются гарантии по Новой Гвинее; «Укрепить австралийский рубеж» станет недоступен. После реализации: §G+10%§! защиты против Японии."
 A01_balance_compromise:0 "Неустойчивое равновесие"
 A01_before_japanese_war_tt:0 "Война с Японской империей ещё не началась"
 A01_begin_island_defence:0 "Начать оборону острова"
 A01_begin_island_defence_desc:0 "Начать подготовку к обороне Борнео. Японские приготовления могут сократить этот срок, а уступки — продлить его."
 A01_borneo_australian_cooperation:0 "Совместный оборонный проект"
 A01_borneo_british_exclusion:0 "Британия исключена из оборонного проекта"
 A01_british_project_tt:0 "Потеря суверенитета: §R+10§! пунктов. Влияние Британии: §R+15§! пунктов. После реализации: §G+15%§! защиты против Японии."
 A01_british_raj_model_idea:0 "Гибкий колониализм"
 A01_british_raj_model_idea_desc:0 "Косвенное управление по образцу Британской Индии: местные элиты сотрудничают с Батавией ради взаимной выгоды."
 A01_can_change_conscription_law_tt:0 "Изменять закон о призыве"
 A01_can_change_economy_law_tt:0 "Изменять закон об экономике"
 A01_can_change_trade_law_tt:0 "Изменять закон о торговле"
 A01_charter_A11:0 "Предоставить хартию: Кутай"
 A01_charter_A11_desc:0 "Султанат получит собственную администрацию и армию, оставаясь зависимым от Батавии. Японские права на нефть и каучук сохраняются."
 A01_charter_A12:0 "Предоставить хартию: Понтианак"
 A01_charter_A12_desc:0 "Султанат получит собственную администрацию и армию, оставаясь зависимым от Батавии. Японские права на нефть и каучук сохраняются."
 A01_charter_A13:0 "Предоставить хартию: Банджар"
 A01_charter_A13_desc:0 "Султанат получит собственную администрацию и армию, оставаясь зависимым от Батавии. Японские права на нефть и каучук сохраняются."
 A01_civic_development:0 "Гражданское управление"
 A01_civic_development_desc:0 "Равное гражданство, представительство островов и ответственная администрация создают основу общего государства. Устойчивость нового порядка зависит от того, насколько эти обещания воплощаются в повседневной жизни."
 A01_colonial_police_mobilized:0 "Мобилизованная колониальная полиция"
 A01_colonial_police_mobilized_desc:0 "Дополнительные полицейские части укрепляют оборону, но их снабжение отнимает ресурсы у промышленности."
 A01_colonial_security_policy:0 "Колониальная политика безопасности"
 A01_colonial_security_policy_desc:0 "Военное положение и усиленная портовая охрана помогают защищать склады и коммуникации. Однако мобилизованные рабочие покидают мастерские, а чрезвычайные полномочия администрации вызывают недовольство общин."
 A01_constitutional_amendments_window:0 "Действие конституционных поправок"
 A01_constitutional_amendments_window_desc:0 "Совет Адмиралов вынужден временно подчиниться новым конституционным нормам. До истечения срока правительство может свободно пересмотреть основные законы государства."
 A01_constitutional_amendments_window_tt:0 "\n«§YВласть Совета адмиралов§W»§! §Wизменится на:\n£trigger_yes  Изменять законы о призыве\n£trigger_yes  Изменять законы об экономике\n£trigger_yes  Изменять законы о торговле"
 A01_council_influence:0 "Влияние морского ведомства"
 A01_council_obstruction:0 "Обструкция Совета"
 A01_council_pressure:0 "Совет диктует условия"
 A01_council_supremacy:0 "Господство адмиралов"
 A01_council_veto:0 "Право вето Совета"
 A01_crown_equilibrium:0 "Соглашение о полномочиях"
 A01_crown_order:0 "Новый порядок Короны"
 A01_crown_order_desc:0 "Корона стремится согласовать интересы двора, адмиралтейства и островных правителей. Судьба нового порядка решается в назначениях, бюджетных спорах и гарантиях, данных подданным."
 A01_defeat_legacy:0 "Наследие поражения"
 A01_defeat_legacy_desc:0 "Война оставила разрушенные порты, неоплаченные счета и семьи без кормильцев. Военные требуют реванша, жители — помощи, кредиторы — выплат. Кабинету предстоит восстановить хозяйство и доверие к власти."
 A01_direct_naval_rule_suppression_tt:0 "§GОблегчит§! прохождение будущей ветки жёсткого подавления индонезийского населения."
 A01_federal_defence_compact:0 "Просьба султанов о втором шансе"
 A01_federal_defence_compact_desc:0 "Султанские делегации просят Совет не уничтожать кабинет, впервые признавший их право на самоуправление. Они предлагают совместную оборону и поддержку Людольфа в обмен на переход от колонии к федерации."
 A01_future_of_netherlands:0 "В чьих руках будущее Нидерландов"
 A01_future_of_netherlands_desc:0 "Поражение уничтожило уверенность в прежнем порядке. Адмиралы требуют ответственности, индонезийские общины — свободы, а Людольф пытается сохранить государство, которое больше нельзя удержать одними приказами. Решение о его смещении станет спором о том, кому принадлежит страна."
 A01_golden_bridges_idea:0 "Золотые мосты флота"
 A01_golden_bridges_idea_desc:0 "Умеренная часть офицерского корпуса интегрирована в парламентские и государственные структуры."
 A01_government_course:0 "Морская стратократия"
 A01_government_course_desc:0 "Совет Адмиралов подчинил государственный аппарат интересам флота."
 A01_grand_council_side:0 "Большой совет"
 A01_indonesian_refusal_to_serve:0 "Отказ индонезийцев служить"
 A01_indonesian_refusal_to_serve_desc:0 "Военное положение вызвало массовое уклонение от призыва и дезертирство среди индонезийского населения."
 A01_industrial_advisor_unlocked_tt:0 "Станет доступен советник §YИнженерный совет Батавии§! с чертой §YКапитан индустрии§!. Назначение стоит 150 политической власти."
 A01_japanese_preparations_reduction_tt:0 "Японские приготовления усилены. Дата Борнейского кризиса не меняется."
 A01_local_project_tt:0 "Рекрутируемое население: §G+15%§!. Стабильность расового раскола: §G+10%§!. Уважение адмиралов: §R−5§! пунктов. После реализации: §G+5%§! защиты против Японии."
 A01_ludolf_authority:0 "Авторитет губернатора"
 A01_ludolf_influence:0 "Гражданское руководство"
 A01_ludolf_navy_command_idea:0 "Людольф во главе флота"
 A01_ludolf_navy_command_idea_desc:0 "Людольф руководит реорганизацией военно-морских сил, гарантируя верность флота новому конституционному строю."
 A01_ludolf_side:0 "Людольф Слут ван де Беле"
 A01_ludolf_supremacy:0 "Устойчивое правительство"
 A01_military_scapegoat:0 "Вина пала на армию"
 A01_military_scapegoat_desc:0 "Позор поражения перенесён на военную верхушку. Общество обвиняет адмиралов, а гражданское правительство спасено от краха."
 A01_national_amnesty_idea:0 "Национальное примирение"
 A01_national_amnesty_idea_desc:0 "Амнистия после кризиса в ратуше снизила напряжённость и предотвратила офицерский бунт."
 A01_no_australian_guarantees_tt:0 "Нет обязательства перед Австралией не укреплять рубеж Новой Гвинеи."
 A01_occupation_balance_tt:0 "§RЯпонская оккупация снижает влияние Людольфа:§! −10 пунктов за каждый регион, −20 за Сабах, −25 за Батавию. Штраф применяется один раз за регион в этой войне. Мирная аренда Брунея не учитывается."
 A01_oil_dependency:0 "Нефтяная зависимость"
 A01_oil_dependency_desc:0 "Мы поставили всё на переработку нефти из Суматры и Борнео. Новые покупатели постепенно снижают издержки отрасли, поэтому последствия зависимости меняются вместе с доступом к мировому рынку."
 A01_oil_dependency_first_buyers:0 "Нефтяная зависимость: первые покупатели"
 A01_oil_dependency_first_buyers_desc:0 "Контакт с Всемирной Торговой Палатой привёл первых покупателей нашей нефти и каучука. Экспорт пока не решил всех проблем, но содержание добывающей отрасли уже обходится заметно дешевле."
 A01_oil_dependency_research_tt:0 "Темпы исследований синтетических ресурсов: §G+20.00%§!"
 A01_own_fortifications_tt:0 "Защита против Японии: §G+20%§!. Британия: §R−10§! отношения. Долговые обязательства сохраняются после войны."
 A01_premier_pending:0 "Кабинет ещё не избран"
 A01_premier_raden_surya:0 "Раден Сурья"
 A01_premier_van_der_velde:0 "Хендрик ван дер Велде"
 A01_premier_van_rijn:0 "Маттейс ван Рейн"
 A01_prepare_bornean_logistics: "Подготовить логистику"
 A01_prepare_bornean_logistics_desc: "Новая железная дорога свяжет Джесселтон с Сандаканом и Тавау и позволит быстрее перебрасывать снабжение и подкрепления через Сабах."
 A01_project_implementation_tt:0 "Будет введён в действие бонус защиты выбранного проекта против Японии."
 A01_project_selected_tt:0 "Выбран один из трёх проектов обороны."
 A01_queen_influence:0 "Двор укрепляет позиции"
 A01_queen_side:0 "Королева"
 A01_queen_supremacy:0 "Власть Королевы"
 A01_racial_divide:0 "Расовый раскол"
 A01_racial_divide_desc:0 "Отношения между голландской администрацией и индонезийским населением постоянно меняются под давлением войны, репрессий и компромиссов. Последствия раскола теперь отражают текущий курс правительства."
 A01_racial_divide_hardened_desc:0 "Военное положение окончательно превратило расовое неравенство в систему открытого принуждения. Индонезийцы уклоняются от службы, саботируют приказы и всё чаще помогают подполью."
 A01_racial_divide_mitigated_desc:0 "Страховые гарантии ВТП смягчили самые тяжёлые последствия расового раскола. Неравенство сохраняется, но часть индонезийцев вновь готова сотрудничать с администрацией."
 A01_real_militia_tt:0 "Будут сформированы §Y12 дивизий индонезийского ополчения§!, каждая из §Y3 батальонов ополчения§!. Это временные части: после окончания кризиса с Японией они будут распущены."
 A01_royal_reassurances:0 "Обещание вернуться к парламенту"
 A01_sultanates_language_guarantees_idea:0 "Языковые и правовые гарантии"
 A01_sultanates_language_guarantees_idea_desc:0 "Сохранение традиционных языков и обычаев султанатов гарантировало мир на архипелаге и снизило накал партизанского сопротивления."
 A01_wtc_debt_20_tt:0 "Долг перед ВТП увеличится на §R20 пунктов§! по шкале процентов долговой нагрузки."
 A01_wtc_insured_loyalty:0 "Застрахованная лояльность"
 A01_wtc_insured_loyalty_desc:0 "Страхование жизни и имущества убедило часть индонезийцев, что их семьи не останутся ни с чем в случае войны."
 A01_wtc_internal_leverage:0 "Рычаги ВТП в Батавии"
 A01_wtc_internal_leverage_desc:0 "Новые концессии и портовые инспекторы позволяют Всемирной Торговой Палате всё сильнее влиять на внутренние решения Батавии."
 A01_wtc_offer_required_tt:0 "Выполнено «Предложение для ВТП» и существует ВТП."
 A01_wtc_postwar_unlock_tt:0 "Открывает послевоенное соглашение с ВТП о восстановлении и погашении долгов."
 A01_wtc_presence:0 "Присутствие ВТП в Батавии"
 A01_wtc_presence_desc:0 "Контракты, страховые гарантии, концессии и портовые инспекторы Всемирной Торговой Палаты образуют единую систему влияния. Её последствия будут меняться по мере усиления или ослабления ВТП."
 A02_CANON_START_DESC:0 "Лондон остался по ту сторону Песни. На Бермудах Виктория хранит достоинство империи, а адмирал Фишер удерживает её разрозненные владения силой флота. От Гибралтара до Новой Зеландии британские гавани живут торговлей, долгами и надеждой на возвращение."
 A03_PACIFIC_START_DESC:0 "Императорский двор Мэйдзи стремится укрепить Японию среди соперничающих морских держав. Новые заводы и верфи должны стать опорой внешней политики. На севере сохраняется власть армии Сайго, на Филиппинах продолжается сопротивление, а нефть южных морей привлекает всё больше внимания Токио."
 A03_army_reorganisation:0 "Реорганизация императорской армии"
 A03_army_reorganisation_desc:0 "Единые штаты и постоянные полевые сборы укрепят армию западных префектур. Опыт частей станет основой общих наставлений."
 A03_asian_liberation_crusade:0 "Освободители народов Азии"
 A03_asian_liberation_crusade_desc:0 "Мы разворачиваем масштабную пропаганду, представляя Японию щитом и мечом азиатских народов против европейского империализма."
 A03_asian_liberation_crusade_idea:0 "Освободители народов Азии"
 A03_asian_liberation_crusade_idea_desc:0 "Пропаганда борьбы с европейскими колонизаторами обеспечивает сочувствие местного населения."
 A03_batavia_convention:0 "Батавская конвенция"
 A03_batavia_convention_desc:0 "Морские перевозчики заинтересованы в каучуке и нефти Ост-Индии. Предложим Батавии взаимные гарантии и торговый договор: безопасность поставок может стоить больше, чем завоевание."
 A03_batavia_ultimatum:0 "Ультиматум Батавии"
 A03_batavia_ultimatum_desc:0 "Потребуем доступа к сырью Борнео независимо от курса Батавии. Отказ Нидерландов означает немедленную войну."
 A03_cabinet_dissolution:0 "Закрепить право роспуска кабинета"
 A03_cabinet_dissolution_desc:0 "Предоставим императору право отправлять правительство в отставку. Неудачная политика приведёт к смене министров, а престол сохранит возможность назначить новый кабинет и изменить курс."
 A03_combined_operations:0 "Совместные операции"
 A03_combined_operations_desc:0 "Армейские и морские штабы проведут общие учения. Только согласованные действия позволят развить успех после захвата побережья."
 A03_commercial_diplomacy:0 "Торговая дипломатия"
 A03_commercial_diplomacy_desc:0 "Торговые дома способны открыть двери, закрытые для военных делегаций. Поддержим постоянные представительства в главных портах Тихого океана."
 A03_conscription_register:0 "Воинский учёт"
 A03_conscription_register_desc:0 "Полные списки военнообязанных позволят заранее подготовить пополнение. Резервисты пройдут обучение, прежде чем получат боевые назначения."
 A03_constitutional_debate:0 "Определить полномочия Мэйдзи"
 A03_constitutional_debate_desc:0 "После войны двор должен решить, кто отвечает за государственный курс. Обсудим два пути: управление через ответственный кабинет или личную власть императора. Последующие решения закрепят выбранное устройство."
 A03_continental_ambitions:0 "Вооружить сухопутную армию"
 A03_continental_ambitions_desc:0 "Выделим средства на разработку пехотного оружия и военный завод на Хонсю. Армия получит материальное подтверждение обещаний кабинета. Эта программа готовит войска, но не начинает континентальную войну."
 A03_continental_army_appeased:0 "Уступки сухопутным милитаристам"
 A03_continental_army_appeased_desc:0 "Северная армия Сайго довольна финансированием и готовится к будущей войне на материке."
 A03_direct_imperial_rule:0 "Личная власть Мэйдзи"
 A03_direct_imperial_rule_desc:0 "Закрепим непосредственное управление императора и его верховный авторитет. Это альтернативное устройство власти внутри адмиралтейского курса, ведущее к тому же завершению государственного кризиса."
 A03_direct_rule_idea:0 "Прямое правление Мэйдзи"
 A03_direct_rule_idea_desc:0 "Император лично решает государственные дела без посредников и компромиссов."
 A03_divine_sovereignty:0 "Божественный авторитет"
 A03_divine_sovereignty_desc:0 "Сакральная воля Тэнно не знает компромиссов; нация мобилизуется на тотальное служение Императору."
 A03_divine_sovereignty_idea:0 "Божественный авторитет Тэнно"
 A03_divine_sovereignty_idea_desc:0 "Беспрекословное повиновение верховному владыке."
 A03_electrical_workshops:0 "Электротехнические мастерские"
 A03_electrical_workshops_desc:0 "Телеграфы, генераторы и измерительные приборы требуют новых производственных навыков. Создадим предприятия для растущей электротехнической отрасли."
 A03_field_artillery:0 "Полевая артиллерия"
 A03_field_artillery_desc:0 "Пехота нуждается в надёжной огневой поддержке. Расширение оружейных предприятий Сикоку обеспечит основу артиллерийского снабжения."
 A03_fleet_exercises:0 "Манёвры Объединённого флота"
 A03_fleet_exercises_desc:0 "Корабли должны учиться действовать вместе до начала войны. Большие манёвры проверят связь, разведку и взаимодействие эскадр."
 A03_grand_southern_mandate:0 "Общая программа армии и флота"
 A03_grand_southern_mandate_desc:0 "Согласуем уступки сухопутным командирам и промышленникам, расширим военное производство и морские перевозки. Общий южный курс заменит спор ведомств о каждом заказе."
 A03_grand_southern_mandate_idea:0 "Великий южный бросок"
 A03_grand_southern_mandate_idea_desc:0 "Единая доктрина экспансии объединила армию и флот ради захвата ресурсов Тихого океана."
 A03_hiroshima_arsenal:0 "Хиросимский арсенал"
 A03_hiroshima_arsenal_desc:0 "Хиросимские мастерские получат оборудование для серийного выпуска оружия. Расширение арсенала сократит зависимость армии от иностранных поставщиков."
 A03_imperial_authority:0 "Императорский авторитет"
 A03_imperial_authority_desc:0 "Императорская власть объединяет кабинет и военное командование."
 A03_imperial_council:0 "Три головы дракона"
 A03_imperial_council_desc:0 "Мэйдзи назначает Ито премьер-министром. Но премьер не хозяин страны: деньги остаются у Ивасаки и Мицубиси, Север — у Сайго, а южную войну ведёт кабинет Ито. Три головы должны согласовать займы, северные поставки и снабжение Манилы, прежде чем утвердить общий военный бюджет. После назначения начинается 180-дневный срок до краха Мицубиси."
 A03_imperial_predator:0 "Тихоокеанская колониальная система"
 A03_imperial_predator_desc:0 "Объединим гражданские вложения, пропаганду братства, контроль добычи и трудовую мобилизацию. За обещанием освобождения закрепится система имперского управления; её выгоды и ответственность сохранятся после реформ."
 A03_imperial_university:0 "Императорский технический университет"
 A03_imperial_university_desc:0 "Инженерные кафедры должны работать вместе с арсеналами и верфями. Новый университет обеспечит промышленность собственными специалистами."
 A03_industrial_power:0 "Промышленная держава"
 A03_industrial_power_desc:0 "Сеть арсеналов должна выпускать оружие в масштабах всей империи. Расширение предприятий Хиросимы завершит первую промышленную программу."
 A03_kansai_railways:0 "Железные дороги Кансая"
 A03_kansai_railways_desc:0 "Железные дороги соединят заводы Осаки с промышленными районами Нагои. Регулярные перевозки сократят расходы и ускорят развёртывание войск."
 A03_kempeitai_control_idea:0 "Хватка Кэмпэйтай"
 A03_kempeitai_control_idea_desc:0 "Тотальный полицейский контроль над оккупированными землями подавляет партизанское движение."
 A03_kempeitai_iron_fist:0 "Железная хватка Кэмпэйтай"
 A03_kempeitai_iron_fist_desc:0 "За парадным фасадом скрывается тотальный военно-полицейский контроль. Любое сопротивление, забастовка или партизанский вылазка караются на месте."
 A03_kure_yards:0 "Верфи Куре"
 A03_kure_yards_desc:0 "Гавани Куре подходят для создания крупного судостроительного центра. Расширенные доки позволят обслуживать растущую эскадру."
 A03_labor_battalions:0 "Трудовые батальоны"
 A03_labor_battalions_desc:0 "Принудительный труд местного населения направляется на строительство аэродромов, железных дорог, фортификаций и военных баз."
 A03_labor_battalions_idea:0 "Трудовые батальоны"
 A03_labor_battalions_idea_desc:0 "Принудительный труд обеспечивает быстрое возведение стратегических объектов."
 A03_landing_forces:0 "Десантные отряды"
 A03_landing_forces_desc:0 "Борьба за острова требует особой подготовки. Десантные отряды освоят высадку, захват причалов и удержание плацдармов."
 A03_manage_triple_split:0 "Согласовать интересы армии и флота"
 A03_manage_triple_split_desc:0 "Закрепим послевоенный компромисс между сухопутными офицерами, адмиралтейством и промышленниками. Он позволит кабинету работать, пока каждая сторона ждёт обещанных уступок. Для общего южного курса понадобятся договорённости с обоими военными лагерями."
 A03_merchant_marine:0 "Торговый флот"
 A03_merchant_marine_desc:0 "Без торговых судов заморские базы останутся без снабжения. Государственные заказы пополнят тоннаж и подготовят новые экипажи."
 A03_naval_programme:0 "Императорская кораблестроительная программа"
 A03_naval_programme_desc:0 "Разовые закупки не создают сильного флота. Программа строительства в Нагасаки обеспечит регулярную закладку и ремонт кораблей."
 A03_naval_zaibatsu_compromise:0 "Союз с дзайбацу и флотом"
 A03_naval_zaibatsu_compromise_desc:0 "Мицубиси и верфи Осаки требуют гарантий сырья и морских заказов. Мы свяжем интересы крупного капитала с величием императорского флота."
 A03_naval_zaibatsu_pact:0 "Пакт флота и дзайбацу"
 A03_naval_zaibatsu_pact_desc:0 "Альянс Мицубиси и верфей гарантирует снабжение военно-морских сил."
 A03_osaka_industry:0 "Осакский промышленный район"
 A03_osaka_industry_desc:0 "Осакские торговые дома и мастерские способны стать основой современной промышленности. Государство поддержит строительство крупных фабрик."
 A03_pacific_predator_idea:0 "Хищник Тихого океана"
 A03_pacific_predator_idea_desc:0 "Синтез парадного фасада и железной эксплуатации делает империю грозной силой во всём бассейне Тихого океана."
 A03_pacific_prosperity:0 "Тихоокеанское процветание"
 A03_pacific_prosperity_desc:0 "Договор с Батавией обеспечил поставки сырья. Теперь промышленники Кансая смогут вкладывать средства в новые фабрики, рассчитывая на устойчивую торговлю."
 A03_pacific_resource_lifeline:0 "Укрепить морские перевозки"
 A03_pacific_resource_lifeline_desc:0 "Расширим верфи и закажем транспорты для тихоокеанских маршрутов. Флот и промышленники получат средства для доставки сырья и военных грузов между островами империи."
 A03_pan_asian_brotherhood:0 "Пан-азиатское братство"
 A03_pan_asian_brotherhood_desc:0 "Создание коллаборационистских комитетов и обществ дружбы позволяет привлечь местную верхушку к обслуживанию интересов империи."
 A03_pan_asian_brotherhood_idea:0 "Пан-азиатское братство"
 A03_pan_asian_brotherhood_idea_desc:0 "Коллаборационистские элиты поддерживают японскую администрацию."
 A03_placate_continental_army:0 "Дать гарантии сухопутной армии"
 A03_placate_continental_army_desc:0 "Армейские командиры требуют внимания к подготовке войск и континентальным задачам. Поддержим их программу, чтобы они приняли послевоенное соглашение и прекратили борьбу с кабинетом за каждый заказ."
 A03_prefectural_reform:0 "Префектурная реформа"
 A03_prefectural_reform_desc:0 "Общие правила налогообложения и отчётности укрепят связь столицы с префектурами. Правительство получит средства для последовательной программы реформ."
 A03_prime_minister_filter:0 "Ответственное правительство"
 A03_prime_minister_filter_desc:0 "Учредим кабинет министров, закрепим положение императора, роль совета Гэнро и право роспуска правительства. Завершённая система управления станет одним из оснований урегулирования раскола трёх сил."
 A03_privy_council_arbiters:0 "Тайный совет Гэнро"
 A03_privy_council_arbiters_desc:0 "Совет старейшин становится скрытым арбитром японской политики, способным быстро смещать зарвавшихся министров без публичных кризисов."
 A03_privy_council_idea:0 "Тайный совет Гэнро"
 A03_privy_council_idea_desc:0 "Старейшины нации следят за устойчивостью курса державы."
 A03_sacred_shield_idea:0 "Сакральный громоотвод монарха"
 A03_sacred_shield_idea_desc:0 "Премьер-министр и кабинет поглощают любые политические удары, сохраняя абсолютный авторитет Императора."
 A03_sacred_shield_monarch:0 "Неприкосновенность престола"
 A03_sacred_shield_monarch_desc:0 "Закрепим ответственность правительства за неудачи государственной политики. Отставка министров позволит менять курс, не превращая каждый кризис в спор о законности самого престола."
 A03_showcase_of_prosperity:0 "Развивать колониальную промышленность"
 A03_showcase_of_prosperity_desc:0 "Подкрепим обещания освобождения гражданским строительством и расширением промышленности. Кабинет рассчитывает укрепить сотрудничество с местными элитами и показать материальную пользу японского присутствия."
 A03_showcase_of_prosperity_idea:0 "Витрина процветания"
 A03_showcase_of_prosperity_idea_desc:0 "Образцовые колониальные фасады скрывают реальное положение дел."
 A03_southern_bases:0 "Южные опорные пункты"
 A03_southern_bases_desc:0 "Палау станет промежуточной базой между метрополией и южными морями. Новые мастерские и транспортные суда поддержат длительную кампанию."
 A03_southern_campaign:0 "Южная кампания"
 A03_southern_campaign_desc:0 "Подготовим десантные части, тяжёлые корабли и передовые запасы для похода к Борнео. Штаб должен увязать высадку с охранением транспортов и снабжением занятого берега."
 A03_southern_reconstruction:0 "Восстановление южных владений"
 A03_southern_reconstruction_desc:0 "По Борнейской конвенции Япония получила северные районы и Лимбанг. Восстановим промышленность Сабаха и закрепим новые владения."
 A03_southern_strategy:0 "Южная стратегия"
 A03_southern_strategy_desc:0 "Южные морские пути ведут к сырью и опорным пунктам империи. Штаб флота подготовит общий план действий на случай провала дипломатии."
 A03_standard_rifles:0 "Единый образец винтовки"
 A03_standard_rifles_desc:0 "Разнородные винтовки затрудняют снабжение полков. Единый образец оружия и общие требования к деталям упростят производство и ремонт."
 A03_steel_contracts:0 "Контракты на сталь"
 A03_steel_contracts_desc:0 "Долгосрочные контракты дадут металлургам уверенность в будущих заказах. Стабильные поставки металла ускорят строительство предприятий."
 A03_total_resource_drain:0 "Усилить добычу колониального сырья"
 A03_total_resource_drain_desc:0 "Передадим приоритет военным и промышленным потребностям метрополии. Более жёсткий контроль над добычей и новые разработки обеспечат империю сырьём, усиливая зависимость колоний от Токио."
 A03_total_resource_drain_idea:0 "Выкачивание колониальных ресурсов"
 A03_total_resource_drain_idea_desc:0 "Максимальная эксплуатация нефти, каучука и полезных ископаемых архипелага."
 A03_triple_split_balance:0 "Хрупкий баланс трёх фракций"
 A03_triple_split_balance_desc:0 "Двор вынужден тратить силы на примирение континентальных генералов, флотских промышленников и Токио."
 A03_two_faced_colonialism:0 "Определить колониальную политику"
 A03_two_faced_colonialism_desc:0 "Токио обещает народам Азии освобождение, но военные и промышленники требуют контроля над территориями и ресурсами. Разрешим кабинету развивать пропаганду сотрудничества и аппарат принуждения: их сочетание определит облик империи."
 A04_CANON_START_DESC:0 "У Всемирной торговой палаты нет империи на карте — её власть записана в долговых книгах. Из Фуншала директор Ламберт связывает острова кредитами, складами и торговыми договорами. Каждая новая война угрожает морским путям; каждая новая технология может обесценить старые долги."
 A05_CANON_START_DESC:0 "Изгнанники с погибшего американского севера нашли новую опору в Гаване. Адмирал Грейвс держит Железный Союз военной дисциплиной, но Куба разделена между непримиримыми наследниками старого мира. Здесь борьба за острова уже стала войной."
 A06_CANON_START_DESC:0 "В Исландии сохранились император, двор и имя погибшей державы. Александр III ищет будущее для русского изгнания, но Победоносцев видит в модернизации угрозу вере и порядку. Пока спорят о трудах Теслы, нехватка людей становится опаснее любого внешнего врага."
 A06_pobedonostsev_advisor:0 "Константин Победоносцев"
 A07_CANON_START_DESC:0 "Правительство Джорджа Диббса управляет Новым Южным Уэльсом из Сиднея. Порты, промышленность и торговля дают колонии вес среди австралийских соседей. Британская корона сохраняет верховную власть, но споры о пошлинах и будущем объединении требуют собственного политического курса."
 A08_CANON_START_DESC:0 "На Хоккайдо армия Сайго Такамори хранит собственное представление о судьбе Японии. Военная дисциплина и синтоистская вера противопоставлены власти южного флота и торговых домов Осаки. Архипелаг разделён, но ни один из его правителей не считает раскол окончательным."
 A09_CANON_START_DESC:0 "В Осаке власть принадлежит торговле. Ивасаки Яносукэ ведёт республику между императорским флотом и Северной Армией, пока долги Мицубиси сужают свободу выбора. Заводы и морские связи дают силу, но сохранить независимость одним золотом будет трудно."
 A10_CANON_START_DESC:0 "Манила, Батаан и северный Лусон находятся под японской оккупацией. Только Кавите безоговорочно признаёт центральную власть. На остальных островах местные правительства требуют самостоятельности."
