 PAP_subject_ADJ: "Ватиканск"
 PAZ_CANON_START_DESC:0 "Эрнандес объединил мексиканских изгнанников обещанием возрождения. На востоке Кубы и Эспаньолы военная власть опирается на проповедь Пророка Пятого Солнца. Соседи видят в новом движении угрозу; его последователи — начало иной эпохи."
 PAZ_prophet_advisor:0 "Пророк Пятого Солнца"
 PCB_CANON_START_DESC:0 "Совет торговых домов Себу ценит открытые гавани и собственную власть. Конфедерация зовёт остров под общее знамя, а японское продвижение угрожает привычным торговым связям. Нейтралитет становится всё более дорогим выбором."
 PCF_CANON_START_DESC:0 "В центральной Кубе сенатор Борегар собирает наследников американского Юга. Их власть опирается на плантации и старые привилегии, но вокруг сражаются Железный Союз и последователи Пятого Солнца. Спасение от Песни не принесло мира."
 PEM_GATHERING_STORM_DESC: "Небольшой остров Пемба долгое время оставался тихим соседом Занзибара. Его плодородные земли и плантации стали жизненно важным источником продовольствия, особенно в годы голода после Великого Исхода, когда именно Пемба помогла прокормить население соседнего острова.\n\nНо в мире, где океан стал ареной борьбы империй и повстанцев, даже такой спокойный остров не может оставаться в стороне. Влияние крупных держав растёт, и всё чаще звучит вопрос: сможет ли Пемба сохранить свою независимость, или её судьба будет решена чужими флотами?"
 PHR_CANON_START_DESC:0 "В Гаити Маман Бриджит ведёт общины, пережившие гибель континентов. Вера связывает их крепче старых законов, но карибская война не оставляет безопасных берегов. За проливами стоят армии, для которых остров — следующая добыча."
 PHW_CANON_START_DESC:0 "Королевство Калакауа стоит на пересечении тихоокеанских путей. Для великих держав гавайские гавани — желанные опорные пункты; для жителей островов — основа независимой жизни. Далёкие войны всё ближе подходят к этому убежищу."
 PLS_CANON_START_DESC:0 "§YВера в горах§!\n\nПосле падения Манилы в горах северного Лусона возникла Католическая Республика. Эмилио Агинальдо ищет силы для борьбы с японскими гарнизонами. Конфедерация может стать союзником, но общая опасность ещё не означает согласия о будущем островов.\n\n§YНа пороге 1893 года: §!Сохранить оплот сопротивления и найти союзников."
 PLV_GATHERING_STORM_DESC: "Палаванские Верфи стали для ОВТ главной судостроительной и ремонтной базой региона. Здесь строят клиперы и рыбацкие шхуны, заготавливают корабельный лес и пеньку, а местные воды ещё кормят окрестные острова рыбой. Без Палавана флот Батама быстро начнёт слабеть, а морские маршруты станут опаснее из-за нехватки ремонта и новых судов.\n\nФормально островом правит военная администрация ОВТ во главе с генерал-губернатором Воронькой Негровым, но реальная власть над доками и рабочими всё чаще уходит к Синдикату Корабелов и его теневому лидеру, \"Стояку\" Сантосу. Опиум, саботаж и скрытое влияние Красной Розы делают эту верфь не только опорой империи, но и одной из её самых опасных трещин."
