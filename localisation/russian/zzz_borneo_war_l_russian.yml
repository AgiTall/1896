l_russian:
 A01_surya_wirata_name:0 "Раден Сурья Вирата"
 A01_japan.2.t:0 "Индонезийцы отказываются воевать"
 A01_japan.2.d:0 "У ворот адмиралтейства стоят грузчики, матросские жёны и посланцы деревень. Они принесли не японские флаги, а списки пропавших работников и требования прекратить призыв. Представитель портов Хасан согласился войти в зал лишь после обещания выпустить делегацию обратно.\n\n«Вы называете это защитой родины, — начинает он. — Но кто из нас решает, где её границы? Плантатор оставляет себе прибыль, чиновник — должность, а нам достаются могилы». Посланница деревень Сити кладёт на стол долговые расписки: пока мужчины служат, семьи теряют землю.\n\nКасемброот разворачивает карту портов: японский ультиматум касается нефти, каучука и контроля над побережьем. Фабиус просит не путать страх перед вторжением с согласием на колониальные порядки. Сурья Вирата предлагает сначала выслушать тех, кого собираются вооружить. Совет должен выбрать, кто начнёт переговоры."
 A01_japan.2.hard:0 "Поручить выступление Касемброоту."
 A01_japan.2.balance:0 "Поручить выступление Фабиусу."
 A01_japan.2.support:0 "Поручить выступление Сурье Вирате."
 A01_japan.10.t:0 "Касемброот требует повиновения"
 A01_japan.10.d:0 "Касемброот придвигает к Хасану карту морских путей. «Закройте эти проливы — и рис не дойдёт до ваших рынков. Отдайте порты Токио — и следующий приказ о погрузке будет написан по-японски. У нас нет месяца на спор о каждом приказе».\n\n«Зато у вас были годы, чтобы услышать наши жалобы», — отвечает Хасан. Он рассказывает о грузчиках, которым задолжали жалованье, и о призывниках, чьи семьи продолжают платить сборы за отсутствующих работников. Сити спрашивает, почему караул охраняет склады компании, когда деревни просят защиты от реквизиций.\n\nАдмирал на миг замолкает. Он признаёт, что снабженцы должны отвечать за воровство, но требует немедленного возвращения людей на службу. Фабиус возражает: приказ заставит человека явиться в казарму, но не удержит его в бою. Делегаты готовы говорить об обороне; принять безусловное повиновение они отказываются."
 A01_japan.11.t:0 "Фабиус предлагает договор о службе"
 A01_japan.11.d:0 "Фабиус начинает не с карты, а с расчётной ведомости. «Здесь одинаковая служба оплачивается по-разному. Если я называю вас товарищами по обороне, эта бумага делает меня лжецом». Он предлагает проверку выплат, помощь семьям и разбор жалоб, сохраняя обязательную службу.\n\nХасан не берёт протянутый документ. «Мой отец уже слышал слово “после”. После урожая, после переписи, после следующей войны. Кто заставит вашего чиновника исполнить обещание?» Сити добавляет: деньги бесполезны, если землевладелец заберёт участок до возвращения солдата.\n\nКасемброот напоминает, что казна не бездонна, а противник не станет ждать окончания проверок. Фабиус отвечает, что сорванный призыв обойдётся дороже. Он предлагает допустить представителей общин к жалобам через совет султанов. Сурья Вирата поддерживает договор, но спрашивает, будет ли у местных солдат право командовать, а не только подчиняться."
 A01_japan.12.t:0 "Сурья Вирата обращается к островам"
 A01_japan.12.d:0 "Сурья Вирата снимает фуражку и садится напротив делегатов. «Я служу на этих кораблях и знаю, как звучит приказ, когда тебя считают чужим. Но японский офицер не вернёт вам землю только потому, что говорит об освобождении». Он предлагает добровольческие части для защиты архипелага.\n\nХасан отвечает, что люди готовы охранять свои причалы, но не хотят быть отправлены за море ради чужих концессий. Сити требует назвать срок службы: деревня не может годами кормить армию и ждать мужчин. Представитель молодых забастовщиков спрашивает, не отнимут ли у добровольцев оружие сразу после того, как исчезнет опасность для администрации.\n\nКасемброот видит другую угрозу: отдельные отряды могут однажды повернуть винтовки против Батавии. «А вы предлагаете дать винтовку человеку, которому заранее не доверяете?» — спрашивает Вирата. Фабиус предлагает обсудить единое снабжение и общий штаб. Впервые спор идёт об условиях совместной защиты, а не о том, кто обязан замолчать."
 A01_japan.20.t:0 "Адмиралы спорят о принуждении"
 A01_japan.20.d:0 "На втором заседании Касемброот требует разоружить пикеты у складов. Хасан отвечает, что без пикетов хозяева снова наймут штрейкбрехеров и забудут долги. «Вы просите доверия, держа людей у ворот под прицелом».\n\nАдмирал говорит о транспортах, которые нельзя разгрузить, и батареях, оставшихся без снарядов. Сити признаёт опасность: семьи портовых рабочих тоже погибнут при высадке. Но она требует отделить защиту гавани от наказания за жалобы. Фабиус предлагает обмен: делегация убеждает людей вернуться, совет рассматривает злоупотребления и условия службы.\n\n«Если я уступлю сейчас, завтра любой приказ будут встречать забастовкой», — говорит Касемброот. «Если не уступите никогда, приказ некому будет выполнять», — отвечает Вирата. Делегация не обещает покорности. Совет может сохранить принуждение, принять договор Фабиуса или доверить защиту добровольцам."
 A01_japan.21.t:0 "Компромисс под перекрёстным огнём"
 A01_japan.21.d:0 "Фабиус зачитывает проект договора. Хасан останавливает его на словах о помощи семьям: «Кто получит выплату, если писарь объявит брак недействительным?» Сити требует принимать свидетельства общины. Адмирал соглашается передать спорные случаи на рассмотрение совета султанов.\n\nКасемброот возражает против превращения каждого взыскания в разбирательство. Он опасается, что командиры потеряют власть именно перед вторжением. Фабиус проводит границу: боевой приказ остаётся приказом, спор о невыплаченном жалованье не становится мятежом.\n\nВирата предлагает местных командиров, но Фабиус пока не готов перестраивать всю армию. Хасан признаёт, что договор даст семьям больше защиты, чем прежние обещания, однако молодые делегаты требуют добровольческой службы. Компромисс никого не устраивает полностью. Теперь совет должен решить, достаточно ли этого для общего дела — или выбрать иной порядок."
 A01_japan.22.t:0 "Кто будет командовать добровольцами?"
 A01_japan.22.d:0 "На столе лежит проект добровольческого мандата. Вирата предлагает местных командиров при едином оборонном плане. Касемброот спрашивает прямо: «Если штаб прикажет оставить вашу деревню ради защиты пролива, вы подчинитесь?» Хасан отвечает: «Если вы объясните, что спасаете остров, а не склад компании».\n\nФабиус предупреждает, что армия не может проводить собрание перед каждым манёвром. Делегаты соглашаются на общее командование в бою и единое снабжение. Взамен они требуют письменного ограничения срока службы: после завершения кризиса ополчение должно вернуться домой.\n\nСити просит прочитать эту строку вслух. Касемброот требует именно роспуска частей, опасаясь постоянной вооружённой силы вне старой армии. Вирата принимает условие, хотя часть молодых делегатов считает его уступкой. Договор готов; совет ещё может предпочесть обязательную службу с гарантиями или вернуться к принуждению."
 A01_japan.30.t:0 "Служба под принуждением"
 A01_japan.30.d:0 "Распоряжение о принудительном призыве доставляют в порты раньше утренней смены. Касемброот получает списки вернувшихся людей и говорит, что оборона больше не может ждать. У складов возобновляется погрузка; на перекличке снова слышны ответы.\n\nХасан возвращается к делегатам без подписанного договора. «Мы добились, чтобы нас выслушали. Мы не добились, чтобы нам поверили». Сити уносит долговые расписки: для этих семей заседание ничего не изменило. Фабиус предупреждает совет, что присутствие людей в строю ещё не означает верности.\n\nНекоторые считают жёсткость спасением перед вторжением, другие прячут сыновей и перестают разговаривать с администрацией. Недовольство уходит с площади в деревни. Совет получает возможность опереться на колониальную полицию, но вместе с ней — риск нового партизанского выступления. Спор окончен приказом; его причины остаются."
 A01_japan.31.t:0 "Гарантии Фабиуса утверждены"
 A01_japan.31.d:0 "Фабиус подписывает распоряжения о проверке жалованья и защите семей. Хасан ставит подпись под призывом вернуться к работе, но не под благодарностью правительству. «Мы будем судить по первой жалобе, которую вы решите против своего чиновника». Сити просит копию для деревенского собрания.\n\nКасемброот принимает договор ради восстановления службы, предупредив, что требования командования сохраняются. Вирата считает это началом иного разговора, хотя вопрос местных командиров остаётся открытым. Молодые забастовщики уходят недовольными: обязательный призыв не отменён.\n\nВ портах снова работают, а семьи получают обещанные гарантии. Постоянный совет султанов сможет стать путём для дальнейших жалоб, если правительство поддержит его создание. Этот порядок требует средств и ежедневного исполнения. Батавия купила не любовь, а возможность доказать, что её подпись чего-то стоит."
 A01_japan.32.t:0 "Островное добровольческое ополчение"
 A01_japan.32.d:0 "На плацу строятся добровольцы. Двенадцать дивизий ополчения получают оружие и место в общем оборонном плане. Вирата обращается к ним без торжественной речи: «За вами остаются дома. Ради них вы здесь». Хасан наблюдает за погрузкой вместе с людьми, которые недавно перекрывали ворота порта.\n\nКасемброот проверяет распоряжения о снабжении. Он по-прежнему опасается самостоятельных частей, но теперь отвечает и за их способность сражаться. Фабиус хранит подписанный мандат; Сити забирает копию с обещанием роспуска после войны.\n\nНе все общины прислали людей. Для одних добровольцы защищают архипелаг, для других помогают прежней администрации пережить кризис. Доверие выросло, но вопрос о власти над островами остался. Когда опасность минует, правительство должно будет выполнить обещание и отпустить тех, кого сегодня вооружает."
 A01_japan.40.t:0 "Ополчение возвращается домой"
 A01_japan.40.d:0 "У причала складывают оружие и сверяют списки. Временный мандат закончился: добровольческие дивизии распущены. Сити встречает возвращающихся людей и ищет знакомые лица; некоторые места в строю навсегда останутся пустыми.\n\n«Армия могла бы пригодиться ещё», — замечает один из штабных офицеров. Фабиус закрывает папку: «Именно поэтому обещание надо выполнить сейчас». Касемброот получает отчёт о роспуске, а Вирата провожает последних добровольцев за ворота.\n\nХасан напоминает, что возвращение винтовок не означает возвращения к молчанию. Люди защищали острова и теперь хотят участвовать в решениях об их будущем. Сегодня Батавия сдержала слово о сроке службы. Ответа на вопрос, кому принадлежит право говорить от имени архипелага, в этом приказе нет."
 A01_indonesian_refusal:0 "Массовый отказ от службы"
 A01_indonesian_refusal_desc:0 "До завершения переговоров и выступлений призывные участки пустуют, а доверие в частях падает."
 A01_coerced_service:0 "Принудительная мобилизация"
 A01_coerced_service_desc:0 "Полиция вернула часть призывников, но принуждение не восстановило доверия. Сохраняются уклонение, организационные проблемы и политическая напряжённость."
 A01_service_compromise:0 "Договор о колониальной службе"
 A01_service_compromise_desc:0 "Гарантии жалованья и помощи семьям смягчили конфликт. Уклонение уменьшилось, однако полного согласия ещё нет."
 A01_indonesian_volunteers:0 "Индонезийские добровольцы"
 A01_indonesian_volunteers_desc:0 "Три временные дивизии защищают острова под местным командованием. Они будут распущены после войны с Японией."
 A03_southern_blitz:0 "Стремительная южная кампания"
 A03_southern_blitz_desc:0 "На 180 дней флот и десантные силы получают приоритет снабжения: усиленный обстрел берега, повышенные атака и дальность флота, ускоренные подготовка и проведение высадок. После полугода программа прекращается."
 A03_southern_preparations:0 "Последние приготовления к южной войне"
 A03_charter_transports:0 "Зафрахтовать дополнительные транспорты"
 A03_charter_transports_desc:0 "Сокращает активный таймер вторжения в Ост-Индию на 15 дней. Решение доступно один раз."
 A03_advance_coaling:0 "Перенести вперёд сроки снабжения"
 A03_advance_coaling_desc:0 "Сокращает активный таймер вторжения на 15 дней. Решение доступно один раз."
 A03_final_sailing_orders:0 "Отдать окончательные приказы эскадре"
 A03_final_sailing_orders_desc:0 "Сокращает активный таймер вторжения на 15 дней. Решение доступно один раз."
 southern_war.2.t:0 "Япония ускоряет приготовления"
 southern_war.2.d:0 "Разведка сообщает о переносе сроков японских морских приготовлений. Наш активный таймер вторжения сокращён. До начала войны остаётся меньше времени, чем рассчитывал кабинет."
 southern_war.2.a:0 "Проверить новый срок мобилизации."
 A03_southern_campaign_desc:0 "Подготовим десантные части, тяжёлые корабли и запасы для Борнео. Завершение программы сокращает активный таймер вторжения ещё на 15 дней. Война начнётся по окончании этого таймера."
 A03_southern_reconstruction_desc:0 "По Борнейской конвенции Япония получила северные районы и Лимбанг. Восстановим промышленность Сабаха и закрепим новые владения."
 ludolf.20.d:0 "Японское морское давление заставило Батавию согласиться на переговоры. Конвенция передаёт Японии Сабах, Бруней и Лимбанг (1024, 1023 и 1059); Ост-Индия получает Саравак и западный Калимантан (333 и 1022). За Японией закрепляются права на нефть и каучук Борнео. Военное ополчение будет распущено, а правительству предстоит пережить последствия поражения."
 ludolf.21.d:0 "Борнейская конвенция закрепляет за Японией районы 1024, 1023 и 1059. Батавия получает 333 и 1022, признав японские права на нефть и каучук Борнео. Морская кампания завершена; начинается восстановление новых владений."
 A01_japan.10.a:0 "Выслушать ответ делегации."
 A01_japan.11.a:0 "Пусть делегаты проверят каждую гарантию."
 A01_japan.12.a:0 "Обсудить пределы добровольческой службы."
 A01_japan.20.a:0 "Сохранить принудительный призыв."
 A01_japan.21.a:0 "Подписать договор о службе."
 A01_japan.22.a:0 "Утвердить добровольческий мандат."
 A01_japan.30.a:0 "Приказ вступает в силу."
 A01_japan.31.a:0 "Теперь придётся отвечать за свою подпись."
 A01_japan.32.a:0 "Сформировать ополчение для защиты островов."
 A01_japan.40.a:0 "Выполнить обещание добровольцам."
 A01_japan.choose_hard:0 "Вернуться к обязательному призыву без уступок."
 A01_japan.choose_balance:0 "Принять гарантии Фабиуса."
 A01_japan.choose_support:0 "Доверить оборону добровольцам."
