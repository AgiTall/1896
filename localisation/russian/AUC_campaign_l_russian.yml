 auc_campaign.13.d:0 "Западная Австралия решает, вступать ли в Содружество. Голос «за» разрешит Сиднею присоединить нашу страну после хартии: территории, войска и управление перейдут федерации. Голос «против» сохраняет отдельное государство."
 auc_campaign.13.a:0 "За федерацию и передачу управления"
 auc_campaign.13.b:0 "Сохранить отдельное правительство"
 auc_campaign.14.t:0 "Референдум о федерации"
 auc_campaign.14.d:0 "Тасмания решает, вступать ли в Содружество. Голос «за» разрешит Сиднею присоединить нашу страну после хартии: территории, войска и управление перейдут федерации. Голос «против» сохраняет отдельное государство."
