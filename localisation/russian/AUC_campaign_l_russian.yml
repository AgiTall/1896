 auc_campaign.14.b:0 "Сохранить отдельное правительство"
 auc_campaign.1.t:0 "Британская хартия Австралии"
 auc_campaign.1.d:0 "Сидней просит разрешить объединение согласившихся колоний под короной. Хартия сохраняет британскую верховную власть, но создаёт единое австралийское правительство."
 auc_campaign.1.a:0 "Разрешить договорную федерацию"
 auc_campaign.1.b:0 "Сохранить раздельные колонии"
 auc_campaign.2.t:0 "Ответ на проект федерации"
 auc_campaign.2.d:0 "Результат переговоров отображается в решениях федерации. При отказе можно повторить переговоры через полгода или добиваться суверенитета."
 auc_campaign.2.a:0 "Продолжить работу"
 auc_campaign.3.t:0 "Австралия требует суверенитета"
 auc_campaign.3.d:0 "Содружество требует самостоятельной внешней политики. Отказ сохранит колониальный статус и откроет путь австралийской войне за независимость."
 auc_campaign.3.a:0 "Признать австралийский суверенитет"
 auc_campaign.3.b:0 "Отклонить требование"
 auc_campaign.4.t:0 "Наши полномочия и корона"
 auc_campaign.4.d:0 "Правительство получило британский ответ. Признание даёт независимость; отказ оставляет выбор между новыми переговорами и подготовкой вооружённого разрыва."
 auc_campaign.4.a:0 "Доложить парламенту"
 auc_campaign.40.t:0 "Итоги колониального голосования"
 auc_campaign.40.d:0 "Одна из колоний разрешила вступление. Текущее число согласившихся правительств и условия ратификации доступны в решениях федерации."
 auc_campaign.40.a:0 "Принять протокол"
 auc_campaign.5.t:0 "Австралийское предложение о перемирии"
 auc_campaign.5.d:0 "Австралийцы удерживают свои владения после шести месяцев борьбы и предлагают признать независимость. Согласие прекратит войну с Австралией и разрешит договорное объединение согласившихся колоний."
 auc_campaign.5.a:0 "Признать самостоятельную Австралию"
 auc_campaign.5.b:0 "Продолжить войну"
 auc_campaign.6.t:0 "Британское признание независимости"
 auc_campaign.6.d:0 "Перемирие подтверждает австралийскую самостоятельность. Британская сторона также разрешила включение колоний, которые отдельно согласятся на федерацию."
 auc_campaign.6.a:0 "Утвердить мир"
 AUC_federation_category:0 "Австралийская федерация"
 AUC_federation_category_desc:0 "Федерация строится на согласии колоний. После хартии или получения независимости Сидней может объединить согласившиеся правительства. Отказавшиеся колонии сохраняют свой путь."
