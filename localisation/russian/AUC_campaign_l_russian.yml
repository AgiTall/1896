 AUC_A07_arsenal_desc:0 "Заказать местное производство винтовок до появления единой федеральной армии."
 AUC_A07_research:0 "Межколониальный технический совет"
 AUC_A07_research_desc:0 "Обмен техническими решениями сократит стоимость военных и промышленных исследований."
 AUC_A07_chamber:0 "Палата при федеральной казне"
 AUC_A07_chamber_desc:0 "Сохранить доступ к соглашениям ВТП и внешним торговым связям."
 AUC_A07_accounts:0 "Не закладывать будущую федерацию"
 AUC_A07_accounts_desc:0 "Уменьшить существующую задолженность, прежде чем финансировать общие ведомства новыми займами."
 AUC_A07_staff:0 "Общий оборонный комитет"
 AUC_A07_staff_desc:0 "Колониальные штабы согласуют планы обороны и подготовку резервов."
 AUC_A07_coast:0 "Береговая дозорная сеть"
 AUC_A07_coast_desc:0 "Береговые наблюдатели и связь предупреждают гарнизоны о высадках."
 AUC_A07_yards:0 "Федеральная программа верфей"
 AUC_A07_yards_desc:0 "Расширить строительство и ремонт судов. Крупный флот придётся построить за счёт собственной промышленности."
 AUC_A07_convoys:0 "Торговые суда под охраной"
 AUC_A07_convoys_desc:0 "Выделить новые транспорты и обучить конвойные службы."
 AUC_A07_japan:0 "Тихоокеанская угроза"
 AUC_A07_japan_desc:0 "Японское продвижение к Филиппинам требует готовности северных гарнизонов. Австралия начнёт подготовку, сохраняя выбор момента войны."
 AUC_A07_partners:0 "Связи с Батавией и Филиппинами"
 AUC_A07_partners_desc:0 "Предложить невоюющим с нами правительствам взаимный военный доступ. Союз и участие в их войнах не возникают автоматически."
 AUC_A07_deter:0 "Австралийский тихоокеанский рубеж"
 AUC_A07_deter_desc:0 "Единый штаб повышает готовность флота. После создания Содружества Австралия сможет сама определить свою политику на море."
 AUC_A07_japan_goal:0 "Потребовать японского отхода"
 AUC_A07_japan_goal_desc:0 "Независимая Австралия получает повод к войне за Манилу, если Япония по-прежнему владеет ею. Это подготовка конфликта: войну объявляет игрок."
 AUC_A07_sovereignty:0 "Ответственное австралийское правительство"
 AUC_A07_sovereignty_desc:0 "После учреждения Содружества или отказа в хартии потребовать контроля внешней политики. Британское правительство может согласиться или отвергнуть требование."
 AUC_A07_own_flag:0 "Внешняя политика под своим флагом"
 AUC_A07_own_flag_desc:0 "Закрепить независимость и право самостоятельно выбирать союзников."
 AUC_A07_break_crown:0 "Разрыв с британской короной"
 AUC_A07_break_crown_desc:0 "После отказа в суверенитете открыть войну за независимость. Этот фокус освобождает Австралию от британского подчинения и немедленно начинает войну с Британией."
 AUC_A07_british_routes:0 "Снабжение без британских портов"
 AUC_A07_british_routes_desc:0 "Расширить самостоятельную логистику перед длительным противостоянием с метрополией."
 auc_campaign.10.t:0 "Референдум о федерации"
 auc_campaign.10.d:0 "Виктория решает, вступать ли в Содружество. Голос «за» разрешит Сиднею присоединить нашу страну после хартии: территории, войска и управление перейдут федерации. Голос «против» сохраняет отдельное государство."
 auc_campaign.10.a:0 "За федерацию и передачу управления"
 auc_campaign.10.b:0 "Сохранить отдельное правительство"
 auc_campaign.11.t:0 "Референдум о федерации"
 auc_campaign.11.d:0 "Квинсленд решает, вступать ли в Содружество. Голос «за» разрешит Сиднею присоединить нашу страну после хартии: территории, войска и управление перейдут федерации. Голос «против» сохраняет отдельное государство."
