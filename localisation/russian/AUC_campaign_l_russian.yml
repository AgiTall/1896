 auc_campaign.12.d:0 "Южная Австралия решает, вступать ли в Содружество. Голос «за» разрешит Сиднею присоединить нашу страну после хартии: территории, войска и управление перейдут федерации. Голос «против» сохраняет отдельное государство."
