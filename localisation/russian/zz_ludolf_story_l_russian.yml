l_russian:
 A01_ludolf_admirals_balance:0 "Власть в Батавии"
 A01_admirals_side:0 "Совет адмиралов"
 A01_ludolf_side:0 "Людольф Слут ван де Беле"
 A01_balance_compromise:0 "Неустойчивое равновесие"
 A01_council_influence:0 "Влияние морского ведомства"
 A01_council_pressure:0 "Совет диктует условия"
 A01_council_supremacy:0 "Господство адмиралов"
 A01_ludolf_influence:0 "Гражданское руководство"
 A01_ludolf_authority:0 "Авторитет губернатора"
 A01_ludolf_supremacy:0 "Устойчивое правительство"
 ludolf.1.t:0 "Нефть, каучук и гарантии"
 ludolf.1.d:0 "Представительство Всемирной Торговой Палаты получило предложение Батавии. Предстоит согласовать закупки каучука и нефти, страхование рейсов и строительство складов. Губернатор рассчитывает получить внешний капитал, не отдавая Палате управление колонией."
 ludolf.1.a:0 "Направить торговую делегацию."
 ludolf.2.t:0 "Батавский ресурсный контракт"
 ludolf.2.d:0 "Ост-Индия предлагает Палате долгосрочные поставки нефти и каучука. Наши представители приглашены обсудить цены, портовые сборы и страховые гарантии. Это возможность закрепиться в торговле архипелага без прямого вмешательства в его управление."
 ludolf.2.a:0 "Принять приглашение Батавии."
 ludolf.10.t:0 "Губернатор и морское ведомство"
 ludolf.10.d:0 "Отказ от внешних союзов оставляет Батавию один на один с морскими угрозами. Адмиралы требуют участия в распределении бюджета. Людольф сохраняет гражданские полномочия, но ему придётся заслужить уважение офицеров делами.\n\nБаланс сил показывает политический контроль; уважение Совета определяет готовность адмиралов сотрудничать с губернатором."
 ludolf.10.a:0 "Власть придётся подкрепить доверием."
 ludolf.20.t:0 "Условия мира на Борнео"
 ludolf.20.d:0 "Морская война истощила казну и обнажила слабость обороны северного Борнео. Япония предлагает прекратить боевые действия: Сабах (1024), Бруней (1023), Лимбанг (1059) и Саравак (333) переходят империи; внутреннее Борнео (1022) закрепляется за Батавией. Япония получает права на нефть и каучук всего Борнео.\n\nСовет адмиралов возложит ответственность за унизительный договор на Людольфа."
 ludolf.20.a:0 "Подписать договор. Мы не выдержим новой кампании."
 ludolf.20.b:0 "Продолжать войну вопреки Совету."
 ludolf.21.t:0 "Борнейская конвенция"
 ludolf.21.d:0 "Батавия подписала договор. Империя получает Сабах, Бруней, Лимбанг и Саравак, а также исключительные права на нефтяные и каучуковые ресурсы Борнео. Внутренние районы острова остаются в сфере управления Ост-Индии."
 ludolf.21.a:0 "Ресурсный вопрос решён."
 ludolf.30.t:0 "Правительство после поражения"
 ludolf.30.d:0 "В Батавии обсуждают, кто заплатит за Борнейскую конвенцию. Адмиралы требуют следствия и нового кабинета; местные правители добиваются автономии. Людольф предлагает перестройку управления, которая сохранит общую оборону и даст султанам собственные правительства."
 ludolf.30.a:0 "Сначала расследование и открытые счета."
 ludolf.30.b:0 "Сохранить кабинет и закрыть обсуждение."
 ludolf.31.t:0 "Султаны просят дать Людольфу шанс"
 ludolf.31.d:0 "Хартии вступили в силу: на сохранившихся территориях Кутай, Понтианак и Банджар получили собственные администрации под верховенством Нидерландов. Ресурсные уступки Японии не исчезли, но решения о местной жизни больше не будут приниматься одним колониальным чиновником.\n\nДелегации султанатов обращаются к Совету. «Мы не оправдываем поражение. Но человек, подписавший эти хартии, впервые признал наше место в общей стране. Дайте ему ещё один шанс». Индонезийские представители поддерживают просьбу с условием: будущая федерация должна дать голос жителям, а не только дворам. Людольф принимает это условие. Касемброот требует доказательств, что новая опора кабинета послужит стране, а не только губернатору."
 ludolf.31.a:0 "Автономия стала политической силой."
 ludolf.32.t:0 "Память о потерянном севере"
 ludolf.32.d:0 "В офицерских клубах и портовых кварталах говорят о возвращении Сабаха и Брунея. Одни требуют немедленной мести, другие призывают сначала восстановить флот. Людольф видит шанс объединить страну вокруг долгой программы восстановления."
 ludolf.32.a:0 "Реванш начинается с восстановления."
 ludolf.32.b:0 "Поддержать горячие головы."
 ludolf.33.t:0 "Совет требует отчёта о поражении"
 ludolf.33.d:0 "Военная комиссия требует новых полномочий и ответственности гражданского кабинета. Людольф отвечает, что следствие не должно заранее выбирать виновного. Фабиус предлагает продолжить открытые слушания.\n\nМожно передать комиссии больше материалов и укрепить позиции Совета либо защитить самостоятельность кабинета, потратив политический капитал. Ни одно из этих решений пока не снимает губернатора с поста."
 ludolf.33.resign:0 "Согласиться на передачу власти."
 ludolf.33.a:0 "Расширить расследование Совета."
 ludolf.33.b:0 "Защитить право кабинета на ответ."
 ludolf.33.c:0 "Отвергнуть требования Совета."
 ludolf.34.t:0 "У кабинета требуют новые объяснения"
 ludolf.34.d:0 "Адмиралы называют обещанные реформы попыткой уйти от ответственности. Делегаты возражают: смена правительства не вернёт потерянные берега. Спор продолжается в рамках слушаний; даже перевес Совета ещё не заменяет решения о будущем власти."
 ludolf.34.a:0 "Предоставить комиссии дополнительные полномочия."
 ludolf.34.b:0 "Отстоять гражданские процедуры."
 ludolf.35.t:0 "Людольф под арестом"
 ludolf.35.d:0 "Утром к резиденции прибывает караул Совета. Людольфу зачитывают обвинение в ответственности за проигранную войну и запрещают обращаться к делегатам. Он успевает спросить, будет ли открытое разбирательство. Офицер отвечает, что порядок определит директория.\n\nСултанские посланцы передают протест, но ворота уже закрыты. Совет принимает управление страной. В министерства отправляют списки должностей, подлежащих проверке; в штабы — новые формы присяги. Отставка оказалась первым шагом. Теперь победившая сторона намерена перестроить весь государственный аппарат."
 ludolf.35.a:0 "Директория приступает к управлению."
 ludolf.36.t:0 "Второй шанс в обмен на другую страну"
 ludolf.36.d:0 "Султанские делегаты и представители общин требуют сохранить Людольфа, но отказываются поддержать возвращение к прежнему порядку. Их условие — федерация с общим гражданством и участием индонезийцев в выборе государственных служащих.\n\nЛюдольф соглашается. Совет снимает вопрос о немедленном смещении, сохранив право критиковать действия кабинета. Хасан предупреждает: «Мы поддержали перемены. Если вы остановитесь, подписи под вашей поддержкой исчезнут». Губернатор получает власть, которую теперь придётся оправдывать перед людьми, прежде исключёнными из управления."
 ludolf.36.a:0 "Начать федеральные преобразования."
 A01_council_relations:0 "Губернатор и Совет адмиралов"
 A01_council_relations_desc:0 "§YУважение Совета: [?A01_admirals_respect|0]/100§!\n\nУступки передают полномочия адмиралам, но повышают их готовность сотрудничать. Манёвры, открытые счета и выполнение обещаний укрепляют уважение без отказа от гражданской власти. После поражения низкий баланс может привести к отставке Людольфа."
 A01_concede_naval_budget:0 "Уступить Совету часть бюджета"
 A01_concede_naval_budget_desc:0 "Морское ведомство получит больше контроля над заказами. Уважение Совета +15; баланс на 10% в пользу адмиралов."
 A01_honour_naval_officers:0 "Отметить заслуги офицеров"
 A01_honour_naval_officers_desc:0 "Губернатор лично вручит награды отличившимся экипажам. Уважение +10; баланс на 5% в пользу Людольфа."
 A01_joint_naval_exercises:0 "Провести совместные манёвры"
 A01_joint_naval_exercises_desc:0 "Совместная инспекция и учения подтвердят серьёзность оборонной программы. Уважение +10; баланс на 10% в пользу Людольфа."
 A01_open_admiralty_accounts:0 "Открыть счета Адмиралтейства"
 A01_open_admiralty_accounts_desc:0 "Прозрачные закупки уменьшат взаимные подозрения. Уважение +8; небольшое укрепление гражданского контроля."
 A01_accept_naval_appointments:0 "Принять назначения Совета"
 A01_accept_naval_appointments_desc:0 "Адмиралы займут новые административные посты. Уважение +20; баланс на 15% в пользу Совета."
 A01_postwar_reconstruction:0 "Перестройка Ост-Индии"
 A01_postwar_reconstruction_desc:0 "Борнейская конвенция изменила границы, но не сняла противоречий между губернатором, флотом и местными правителями. Автономные султанаты сохранят подчинение Батавии и японские ресурсные права."
 A01_charter_A11:0 "Предоставить хартию: Кутай"
 A01_charter_A11_desc:0 "Султанат получит собственную администрацию и армию, оставаясь зависимым от Батавии. Японские права на нефть и каучук сохраняются."
 A01_charter_A12:0 "Предоставить хартию: Понтианак"
 A01_charter_A12_desc:0 "Султанат получит собственную администрацию и армию, оставаясь зависимым от Батавии. Японские права на нефть и каучук сохраняются."
 A01_charter_A13:0 "Предоставить хартию: Банджар"
 A01_charter_A13_desc:0 "Султанат получит собственную администрацию и армию, оставаясь зависимым от Батавии. Японские права на нефть и каучук сохраняются."
 A01_fund_widows:0 "Помощь семьям погибших"
 A01_fund_widows_desc:0 "Выплаты семьям моряков уменьшат ожесточение в портах. Уважение +5, стабильность +3%."
 A01_borneo_humiliation:0 "Борнейское унижение"
 A01_borneo_humiliation_desc:0 "Утрата северного Борнео и японские концессии подрывают доверие к Батавии."
 A01_revanchism_simmering:0 "Зреющий реваншизм"
 A01_revanchism_simmering_desc:0 "Общество требует вернуть потерянные земли, но общей программы восстановления пока нет."
 A01_revanchism_organised:0 "Программа национального восстановления"
 A01_revanchism_organised_desc:0 "Реваншистские настроения направлены на восстановление флота и оборонной промышленности."
 A01_reconstruction_cabinet:0 "Кабинет восстановления"
 A01_reconstruction_cabinet_desc:0 "Новый кабинет согласует восстановление портов и отношения с автономными правителями."
 A01_sultanate_federation:0 "Договор с султанатами"
 A01_sultanate_federation_desc:0 "Автономные администрации сохраняют общий оборонный договор с Батавией."
 A01_civilian_naval_compact:0 "Гражданско-морской компромисс"
 A01_civilian_naval_compact_desc:0 "Совет признал гражданское руководство в обмен на выполнение согласованной морской программы."
 A01_reconstruction_commission:0 "Опись разрушений и обязательств"
 A01_reconstruction_commission_desc:0 "Комиссия сведёт расходы на восстановление, выплаты семьям и долги в единый реестр. Это откроет государственное финансирование и переговоры с ВТП."
 A01_autonomous_sultanates:0 "Соглашение с султанатами"
 A01_autonomous_sultanates_desc:0 "Признаем местное самоуправление и договоримся об участии султанатов в будущей федерации. Действующий механизм создаёт автономные субъекты; позднее они смогут войти в общее государство."
 A01_northern_memory:0 "Кто ответит за потерянные берега?"
 A01_northern_memory_desc:0 "Публикация списков потерь превращает горе в политический вопрос. Военная комиссия утверждает, что страну погубило гражданское вмешательство. Семьи погибших требуют выяснить, почему командование не смогло защитить острова."
 A01_federal_defence_compact:0 "Просьба султанов о втором шансе"
 A01_federal_defence_compact_desc:0 "Султанские делегации просят Совет не уничтожать кабинет, впервые признавший их право на самоуправление. Они предлагают совместную оборону и поддержку Людольфа в обмен на переход от колонии к федерации."
 A01_fleet_of_recovery:0 "Флот под надзором Совета"
 A01_fleet_of_recovery_desc:0 "Восстановить верфи и передать адмиральскому штабу руководство морской программой. Совет использует новые назначения, чтобы собрать опору для собственного правительства."
 A01_ludolf_survives:0 "Мандат на гражданские реформы"
 A01_ludolf_survives_desc:0 "Людольф сохраняет власть ради перехода от колониального режима к федерации. Гражданский мандат смягчит трудности переходного правительства."
 A01_negotiated_resignation:0 "Приход Совета адмиралов"
 A01_negotiated_resignation_desc:0 "Передать власть Совету сразу после формирования послевоенного кабинета. Адмиралы сместят и арестуют Людольфа за поражение, начнут чистки и подчинят государственные учреждения военной элите."
 A01_review_borneo_convention:0 "Пересмотр Борнейской конвенции"
 A01_review_borneo_convention_desc:0 "Восстановив управление и флот, Батавия сможет сформулировать требования о пересмотре унизительного договора. Утрата земель останется центром внешней политики."
 A01_pacific_settlement:0 "Кабинет после поражения"
 A01_pacific_settlement_desc:0 "Поражение ставит вопрос о том, кому принадлежит власть. Этот фокус открывает главную послевоенную развилку: сохранить гражданский кабинет Людольфа и начать реформы или передать государство Совету адмиралов. Начинаются слушания о смещении губернатора; выбор ветви определит дальнейшие преобразования."
