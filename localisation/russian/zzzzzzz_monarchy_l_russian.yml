l_russian:
 A01_monarchy.0.t:0 "Дневник Вильгельмины"
 A01_monarchy.0.d:0 "В дневнике юная Вильгельмина пишет, что не хочет быть декорацией. Она видит, как Совет и адмиралы разоряют страну, и хочет взять ответственность за её будущее. Поддержим ли мы корону в послевоенном споре?"
 A01_monarchy.0.a:0 "Она ещё ребёнок."
 A01_monarchy.0.b:0 "Она — наша надежда."
 A01_monarchy.1.t:0 "Разговор с матерью"
 A01_monarchy.1.d:0 "Эмма Вальдек-Пирмонтская вызывает дочь в кабинет. Мать говорит о долге, осторожности и стране, не готовой к правлению ребёнка. Дочь отвечает, что страна гибнет, пока решения откладывают. Разговор длится всю ночь. К утру обе выходят с красными глазами."
 A01_monarchy.1.a:0 "Уступить матери."
 A01_monarchy.1.b:0 "Настоять на своём."
 A01_monarchy.3.t:0 "Парламент при короне"
 A01_monarchy.3.d:0 "Вильгельмина открывает первое заседание парламента Нидерландов и Индонезии. Голландские купцы, гражданские делегаты островов и представители султанских дворов спорят о бюджете и избирательном законе. Совет адмиралов больше не имеет права вето. Королева обещает назначить премьер-министра, способного получить доверие палаты."
 A01_monarchy.3.a:0 "Пусть говорят."
 A01_monarchy.3.b:0 "Корона гарантирует соблюдение конституции."
 A01_monarchy.4.t:0 "Содружество двух берегов"
 A01_monarchy.4.d:0 "Хартия содружества признаёт равные права жителей Нидерландов и Индонезии. Султанаты сохраняют местные законы и представительство; общие дела решаются парламентом при короне. Это союз под одной короной, основанный на договоре."
 A01_monarchy.4.a:0 "Одна корона, много народов."
 A01_monarchy.5.t:0 "Королевская диктатура"
 A01_monarchy.5.d:0 "После устранения Совета Вильгельмина закрепляет личную власть. Гвардия присягает короне, министры отвечают перед ней, а парламентский кабинет не создаётся. Островные хартии сохраняют силу: победа над адмиралами не отменяет договоров с султанатами."
 A01_monarchy.5.a:0 "Так надо."
 A01_monarchy.5.b:0 "Мы ещё вернёмся к парламенту."
 A01_monarchy.6.t:0 "Власть королевского указа"
 A01_monarchy.6.d:0 "Совет адмиралов утрачивает право вмешиваться в гражданские дела. Министры отвечают перед королевой, а армия остаётся на службе государства. Ответственность за каждое решение теперь лежит на короне."
 A01_monarchy.6.a:0 "Корона принимает ответственность."
 A01_monarchy.7.t:0 "Корона и меч"
 A01_monarchy.7.d:0 "Верфи и мобилизационные управления переходят на военные приоритеты. Королевский флот становится опорой власти на островах. За это придётся платить: гражданское снабжение уступает место вооружению."
 A01_monarchy.7.a:0 "Служить короне."
 A01_emma_and_daughter:0 "Эмма и её дочь"
 A01_emma_and_daughter_desc:0 "Решить спор о сроках передачи власти от регентши к королеве."
 A01_royal_guard_corps:0 "Корпус королевской гвардии"
 A01_royal_guard_corps_desc:0 "Сформировать отдельную дивизию королевской гвардии и создать военную опору реформ. Гвардия позволит силой устранить Совет, но чистка ослабит флот."
 A01_royal_naval_advisors:0 "Морские советники короны"
 A01_royal_naval_advisors_desc:0 "Офицеры флота присягают короне и готовят единые правила морской службы."
 A01_island_delegation:0 "Делегация островов"
 A01_island_delegation_desc:0 "Представители островов получают постоянное место в обсуждении государственных дел."
 A01_royal_dictatorship:0 "Королевская диктатура"
 A01_royal_dictatorship_desc:0 "Опираясь на гвардию и флот, королева отказывается от конституционного ограничения власти."
 A01_crown_parliament:0 "Парламент при короне"
 A01_crown_parliament_desc:0 "Собрать голландских и индонезийских представителей под властью конституционной короны."
 A01_crown_commonwealth:0 "Королевское содружество"
 A01_crown_commonwealth_desc:0 "Закрепить равноправие народов и договорное устройство содружества с Индонезией."
 A01_crown_absolute_rule:0 "Абсолютная власть короны"
 A01_crown_absolute_rule_desc:0 "Упразднить политическую власть Совета адмиралов и подчинить министров королеве."
 A01_crown_militarism:0 "Военная монархия"
 A01_crown_militarism_desc:0 "Направить средства на верфи и мобилизацию ценой гражданского снабжения."
 A01_royal_secret_police:0 "Тайная полиция короны"
 A01_royal_secret_police_desc:0 "Создать службу надзора. Подавление сопротивления усилится, но общество заплатит за это доверием."
