l_russian:
 A01_agrarian_society:0 "Аграрное общество"
 A01_agrarian_society_desc:0 "Большинство жителей занято на небольших хозяйствах и плантациях. Промышленных рабочих, инженеров и местных подрядчиков не хватает; оборудование приходится ввозить, а казна зависит от экспортных доходов. Массовый призыв лишил бы сельское хозяйство рабочих рук. Создание новых предприятий и подготовка резервов требуют времени и средств, которых у Батавии почти нет.\n\nШтрафы складываются с гражданской экономикой, нефтяной зависимостью и расовым расколом. Ограничения сохраняются и после смены правительства."
 A01_occupation_balance_tt:0 "§RЯпонская оккупация снижает влияние Людольфа:§! −10 пунктов за каждый регион, −20 за Сабах, −25 за Батавию. Штраф применяется один раз за регион в этой войне. Мирная аренда Брунея не учитывается."
