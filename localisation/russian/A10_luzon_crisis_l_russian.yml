l_russian:
 A10_settlement.6.t:0 "Переговоры о Филиппинах"
 A10_settlement.6.d:0 "Филиппинские войска заняли наши владения на архипелаге. Командование предлагает признать потерю удерживаемых противником территорий и прекратить эту войну. Промедление лишь усилит недовольство дома: у правительства осталось три месяца, чтобы избежать политического кризиса."
 A10_settlement.propose:0 "Предложить мир Филиппинам"
 A10_settlement.delay:0 "Мы ещё можем переломить ход войны"
 A10_settlement.7.t:0 "Крах на Лусоне"
 A10_settlement.7.d:0 "Три месяца правительство обещало вернуть утраченные позиции. Но филиппинские войска по-прежнему удерживают наши территории, а семьи погибших требуют ответа. Газеты называют кампанию бессмысленной бойней. Мы можем признать поражение и заключить мир, либо продолжить войну вопреки растущему возмущению общества."
 A10_settlement.7.a:0 "Не стоит проливать за это кровь"
 A10_settlement.7.b:0 "Лусон будет нашим — любой ценой!"
 A10_settlement.8.t:0 "Япония предлагает мир"
 A10_settlement.8.d:0 "Японское правительство предлагает прекратить войну и признать освобождение удерживаемых нами территорий. Если освобождена лишь Манила, Северный Лусон и Батаан останутся под японским управлением. При полном освобождении архипелага Япония признает потерю всех своих островных владений, занятых нами и нашими союзными республиками."
