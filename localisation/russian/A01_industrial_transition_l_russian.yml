l_russian:
 A01_dutch_literacy:0 "Нидерландская грамотность"
 A01_dutch_literacy_desc:0 "Обязательное обучение чтению, счёту и нидерландскому языку готовит крестьян к фабричной работе. Аграрное общество ослабляется, а обязательная нидерландская школа ускоряет освоение производства. Первый этап реформы: 35 дней."
 A01_rural_labour_duty:0 "Трудовая повинность"
 A01_rural_labour_duty_desc:0 "Администрация вводит трудовые списки и обязательные квоты для деревень. Крестьян направляют в фабричные поселения: аграрные ограничения сокращаются, но стабильность падает на 5 процентных пунктов. Второй этап реформы: 35 дней."
 A01_factory_resettlement:0 "Переход к фабричному труду"
 A01_factory_resettlement_desc:0 "Постоянное переселение, жильё при фабриках и обучение на рабочем месте превращают трудовую повинность в новый уклад. Аграрный национальный дух полностью снимается и появляется подготовленная фабричная рабочая сила. Стабильность падает ещё на 5 процентных пунктов. Завершающий этап реформы: 70 дней."
 A01_production_standardisation:0 "Единые фабричные стандарты"
 A01_production_standardisation_desc:0 "Единые чертежи, размеры деталей и нормы обучения заменят разрозненные порядки мастерских. Национальный дух фабричной рабочей силы будет улучшен: выпуск, освоение и предельная эффективность производства возрастут."
 A01_java_steam_power:0 "Паровая энергетика Явы"
 A01_java_steam_power_desc:0 "Объединим паровые электростанции и снабжение фабричных округов. Промышленная энергосеть ускорит строительство, а инфраструктура Батавии и Восточной Явы улучшится."
 A01_local_nco_schools:0 "Местные сержантские школы"
 A01_local_nco_schools_desc:0 "Подготовить местных сержантов для КНИЛ — Королевской нидерландской ост-индской армии. Это регулярные сухопутные части архипелага. Армейский дух будет улучшен, а инспекция колониальной армии станет доступна в качестве начальника армии."
 A01_agrarian_schooling:0 "Аграрное общество: первые школы"
 A01_agrarian_schooling_desc:0 "Начальное образование создаёт основу для перехода от сельского хозяйства к фабричному труду. Аграрные ограничения ещё действуют."
 A01_agrarian_labour_transition:0 "Аграрное общество: трудовая повинность"
 A01_agrarian_labour_transition_desc:0 "Рабочих направляют на фабрики по обязательным квотам. Экономика ещё зависит от деревни, но промышленная нехватка рабочих сокращается."
 A01_factory_workforce:0 "Подготовленная фабричная рабочая сила"
 A01_factory_workforce_desc:0 "Выпускники начальных школ и переселённые сельские семьи образуют постоянную промышленную рабочую силу. Аграрный национальный дух снят."
 A01_standardised_industry:0 "Единые промышленные стандарты"
 A01_standardised_industry_desc:0 "Общие чертежи и нормы обучения позволяют фабрикам быстрее осваивать производство и эффективнее использовать оборудование."
 A01_industrial_power_grid:0 "Промышленная энергосеть"
 A01_industrial_power_grid_desc:0 "Согласованное развитие паровых электростанций и фабричных округов ускоряет новое строительство."
 A01_knil_field_training:0 "КНИЛ: островные гарнизоны"
 A01_knil_field_training_desc:0 "КНИЛ — Королевская нидерландская ост-индская армия, регулярные сухопутные войска колонии. Общая подготовка и гарнизонная служба повышают организацию и оборону этих частей."
 A01_knil_reformed:0 "КНИЛ: полевые реформы"
 A01_knil_reformed_desc:0 "Полевые наставления и единое снабжение регулярной колониальной армии повышают организацию, ускоряют подготовку и снижают расход припасов."
 A01_knil_professional:0 "КНИЛ: подготовленный командный состав"
 A01_knil_professional_desc:0 "КНИЛ — регулярная ост-индская армия. Местные сержанты обеспечивают связь между командирами и солдатами и закрепляют результаты реформ."
 A01_marine_training:0 "Подготовка морских бригад"
 A01_marine_training_desc:0 "Единые программы подготовки расширяют возможности содержания специализированных частей."
 A01_local_armaments:0 "Островные оружейные заказы"
 A01_local_armaments_desc:0 "Местные заказы и единые стандарты вооружения укрепляют оружейное производство."
 A01_escort_coordination:0 "Координация морского охранения"
 A01_escort_coordination_desc:0 "Общие маршруты и порядок взаимодействия улучшают организацию флота."
 A01_dutch_primary_schooling:0 "Обязательная нидерландская школа"
 A01_dutch_primary_schooling_desc:0 "Чтение, счёт и нидерландский язык становятся основой подготовки фабричной рабочей силы."
 A01_industrial_advisory_council_name:0 "Инженерный совет Батавии"
 A01_industrial_advisory_council:0 "Инженерный совет Батавии"
 A01_knil_inspectorate_name:0 "Инспекция колониальной армии (КНИЛ)"
 A01_knil_inspectorate:0 "Инспекция колониальной армии (КНИЛ)"
 A01_industrial_advisor_unlocked_tt:0 "Станет доступен советник §YИнженерный совет Батавии§! с чертой §YКапитан индустрии§!. Назначение стоит 150 политической власти."
 A01_army_advisor_unlocked_tt:0 "Станет доступен начальник армии §YИнспекция колониальной армии (КНИЛ)§! с бонусом к обороне. КНИЛ — регулярные сухопутные войска Нидерландов в Индонезии. Назначение стоит 100 политической власти."
