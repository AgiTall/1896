 A01_PACIFIC_START_DESC:0 "Батавия управляет богатым, но разобщённым архипелагом. Совет адмиралов ограничивает гражданскую власть, а неравенство подрывает мобилизацию. Людольфу предстоит выбрать между соглашением с местными правителями и сохранением колониального порядка. На севере Япония присматривается к нефти Борнео."
