l_russian:
 A10R_provincial_rolls:0 "Мандаты островных советов"
 A10R_provincial_rolls_desc:0 "Не каждый человек с печатью представляет свой остров. Проверка мандатов даст общему собранию опору в муниципалитетах и деревнях."
 A10R_emergency_council:0 "Казна правительства в изгнании"
 A10R_emergency_council_desc:0 "Корабельные расписки и пожертвования эмигрантов нужно свести в одну кассовую книгу. Даже осаждённое правительство обязано платить своим служащим."
 A10R_common_treasury:0 "Взносы вместо поборов"
 A10R_common_treasury_desc:0 "Общий бюджет получит заранее согласованные взносы, а не случайные реквизиции. Республикам придётся отвечать за обещанное перед остальными островами."
 A10R_republican_court:0 "Суд межостровных споров"
 A10R_republican_court_desc:0 "Таможенный спор или задержанный пароход больше не будут поводом для вооружённого столкновения. Решение общего суда обязует даже влиятельные семьи."
 A10R_language_charters:0 "Языки общего дома"
 A10R_language_charters_desc:0 "Петиции на тагальском, себуанском и других островных языках получат одинаковую силу. Переводчики соединят делегатов лучше, чем запрет родной речи."
 A10R_tenant_guarantees:0 "Договор с арендаторами"
 A10R_tenant_guarantees_desc:0 "Сельские отряды защищают не одни флаги. Ограничение долговых взысканий и письменные договоры аренды дадут семьям причину доверять республикам."
 A10R_civilian_inspectors:0 "Гражданские комиссары при штабе"
 A10R_civilian_inspectors_desc:0 "Общий штаб отвечает перед конгрессом. Комиссары проверят ведомости снабжения и жалобы деревень, не присваивая себе командование полками."
 A10R_assembly_of_islands:0 "Собрание всех островов"
 A10R_assembly_of_islands_desc:0 "Временное соглашение выдержало первые испытания. Теперь делегаты спорят, достаточно ли договора республик или народу нужен общий федеральный закон."
 A10R_republics_forever:0 "Союз равных республик"
 A10R_republics_forever_desc:0 "Республики сохранят суверенные собрания, общую оборону и право голоса в союзном бюджете. Доверие между островами станет основой государства."
 A10R_rotating_presidency:0 "Председательство по очереди"
 A10R_rotating_presidency_desc:0 "Союзный председатель не будет принадлежать одному острову навечно. Очерёдность председательства даст малым республикам весомый голос."
 A10R_customs_union:0 "Одна таможенная граница"
 A10R_customs_union_desc:0 "Между союзными портами исчезнут внутренние пошлины. Доходы внешней таможни будут распределяться по открытой ведомости, доступной каждой республике."
 A10R_republican_compact_end:0 "Солнце над девятью республиками"
 A10R_republican_compact_end_desc:0 "Общая присяга не требует одинаковых законов на каждом острове. Союз обретает постоянные учреждения, сохраняя множество местных голосов."
 A10R_federal_convention:0 "Федеральный конвент"
 A10R_federal_convention_desc:0 "Сторонники федерации предлагают общее гражданство и ответственное правительство. Ни одна республика не войдёт в новый строй без собственного согласия."
 A10R_bill_of_rights:0 "Неприкосновенные права островов"
 A10R_bill_of_rights_desc:0 "Местные языки, избираемые советы и свобода вероисповедания должны быть защищены от будущего большинства. Только так федеральный проект заслужит доверие."
 A10R_federal_parliament:0 "Первый федеральный парламент"
 A10R_federal_parliament_desc:0 "Палата населения и палата островов начнут совместную работу. Правительство будет отвечать перед избранными представителями, а армия — перед законом."
 A10R_civilian_commonwealth:0 "Гражданская республика островов"
 A10R_civilian_commonwealth_desc:0 "Университеты, провинциальные советы и парламент станут опорой общего государства. Власть, выросшая из войны, учится жить доверием граждан."
 A10R_luzon_relief:0 "Комитет помощи Лусону"
 A10R_luzon_relief_desc:0 "Лодочники, связные и семьи беженцев знают побережье лучше любого штаба. Комитет свяжет местные отряды с республиканскими складами."
 A10R_war_accounts:0 "Счёт войны"
 A10R_war_accounts_desc:0 "После последних выстрелов остаются сожжённые склады, вдовы и неоплаченные расписки. Комиссия восстановления начнёт с открытого подсчёта потерь."
 A10R_veterans_land:0 "Земля и пенсии ветеранам"
 A10R_veterans_land_desc:0 "Вернувшимся солдатам нужны не новые походы, а кров, работа и признание ран. Земельные комиссии разберут требования без изгнания крестьянских семей."
 A10R_peace_generation:0 "Поколение мира"
 A10R_peace_generation_desc:0 "Дети, выросшие среди гарнизонов и беженцев, должны узнать другую жизнь. Острова направят силы на школы, торговлю и возвращение разлучённых семей."
 A10D_island_census:0 "Перепись островных хозяйств"
 A10D_island_census_desc:0 "Сборщики пошлин знают число тюков, но не число голодных семей. Перепись лодок, колодцев и посевов покажет, какие провинции действительно способны кормить соседей."
 A10D_municipal_roads:0 "Муниципальные дороги"
 A10D_municipal_roads_desc:0 "Дорога от поля до пристани важнее обещаний о большой железной дороге. Общины получат инструменты и оплату за мощёные участки, мосты и дренажные канавы."
 A10D_mail_ferries:0 "Почтовые паромы"
 A10D_mail_ferries_desc:0 "Между островами ходят парусники с несовместимыми расписаниями. Договор с капитанами соединит почтовую службу, перевозку врачей и доставку зерна в одну сеть."
 A10D_abaca_cooperatives:0 "Кооперативы абаки"
 A10D_abaca_cooperatives_desc:0 "Корабли всего мира нуждаются в манильском пеньковом канате. Совместные склады и единый вес тюка позволят мелким производителям договариваться с купцами без разорительных авансов."
 A10D_sugar_inspectors:0 "Весы сахарных пристаней"
 A10D_sugar_inspectors_desc:0 "Провинциальные инспекторы проверят вес и качество сахара, а договоры сохранят участки под рис. Экспорт не должен оставлять семьи без хлеба в сезон штормов."
 A10D_timber_and_slipways:0 "Лесопилки у проливов"
 A10D_timber_and_slipways_desc:0 "Сушильные навесы, пилорамы и учёт рубок обеспечат досками лодочников и строителей. Заказы пойдут в Себу, если остров остаётся в нашем круге, иначе — в доступные союзные мастерские."
 A10D_provincial_workshops:0 "Провинциальные мастерские"
 A10D_provincial_workshops_desc:0 "Провинции не обязаны отдавать свои станки столице. Общие чертежи и закупка приводных ремней соединят небольшие мастерские в сеть взаимных заказов."
 A10D_rice_granaries:0 "Рисовые амбары общин"
 A10D_rice_granaries_desc:0 "Каждая община оставит часть урожая в сухом общественном амбаре. Запас будут учитывать избранные хранители, чтобы тайфун не превращал нехватку пароходов в голод."
 A10D_district_clinics:0 "Уездные лечебницы"
 A10D_district_clinics_desc:0 "Кипячёная вода, перевязочный материал и акушерка спасают больше жизней, чем пышные столичные больницы. Лечебницы станут одновременно местом обучения санитаров для островных гарнизонов."
 A10D_normal_schools:0 "Учительские семинарии"
 A10D_normal_schools_desc:0 "Учитель должен уметь объяснить счёт, устройство насоса и содержание государственного письма на языке своей общины. Семинарии подготовят таких наставников для прибрежных городков и горных селений."
 A10D_cable_cooperatives:0 "Кабельные артели"
 A10D_cable_cooperatives_desc:0 "Местный телеграф не заменит океанских кабелей Палаты, зато позволит сообщать о штормах и ценах без недельного ожидания. Рыбацкие артели дадут береговые команды, мастерские — изоляторы и провод."
 A10D_sanitary_commission:0 "Санитарная комиссия островов"
 A10D_sanitary_commission_desc:0 "Карантин должен останавливать лихорадку, а не торговлю. Врачи согласуют правила для портов, устроят чистые водозаборы и научат паромные команды распознавать первые признаки болезни."
 A10D_island_polytechnic:0 "Островной политехникум"
 A10D_island_polytechnic_desc:0 "Машинисты, землемеры и химики нуждаются в собственном училище. Политехникум объединит преподавателей из провинций и беженцев со старого материка вокруг практических задач островной жизни."
 A10D_national_market:0 "Рынок тысячи пристаней"
 A10D_national_market_desc:0 "Расписания паромов, проверенные весы, ремесленные школы и здоровые портовые города наконец складываются в одно хозяйство. Каждый остров сохранит своё лицо, а его товары найдут дорогу к соседям."
 A10D_rifle_inspections:0 "Осмотр полковых винтовок"
 A10D_rifle_inspections_desc:0 "На соседних островах одинаковое слово «патрон» означает разный калибр. Оружейники перепишут системы, отделят опасные стволы и вернут в строй исправные винтовки."
 A10D_coastal_boatyards:0 "Лодочные верфи"
 A10D_coastal_boatyards_desc:0 "Малой стране нужны ремонтные стапели раньше океанских броненосцев. Лодочники и котельщики начнут строить простые грузовые суда и обслуживать прибрежные пароходы."
 A10D_common_calibres:0 "Общий калибр снабжения"
 A10D_common_calibres_desc:0 "Не требуется немедленно перевооружать каждого солдата. Достаточно разделить склады по системам, ввести одинаковые ящики и перестать посылать части патроны, которыми она не может стрелять."
 A10D_chart_the_straits:0 "Промеры проливов"
 A10D_chart_the_straits_desc:0 "Рыбаки знают рифы, которые отсутствуют на адмиральских картах. Гидрографы запишут их знания, поставят сигнальные огни и соберут службу лоцманов для тёмных и штормовых проходов."
 A10D_field_batteries:0 "Полевые батареи"
 A10D_field_batteries_desc:0 "Пехоте нужны лёгкие полевые пушки и несколько старых гаубиц, которые можно разобрать для вьючной перевозки. Расчёты обучатся выбирать позиции в джунглях и экономить привозные снаряды."
 A10D_harbour_defences:0 "Батареи у гаваней"
 A10D_harbour_defences_desc:0 "Старое морское орудие на береговом станке всё ещё опасно для десантной баржи. Укрытые склады и наблюдательные посты помогут защищать гавани без разорительного состязания с японскими броненосцами."
 A10D_sappers_and_pack_trains:0 "Сапёры и вьючные колонны"
 A10D_sappers_and_pack_trains_desc:0 "Мулы, плоты и переносные мостки доставят боеприпасы туда, где не пройдёт повозка. Сапёры научатся готовить тропы до подхода колонн, а не после первых потерь от голода."
 A10D_merchant_reserve:0 "Резерв торговых судов"
 A10D_merchant_reserve_desc:0 "Судовладельцы заранее узнают условия найма, а армия — грузоподъёмность каждого судна. Резервные команды не позволят мобилизации сразу остановить рисовые перевозки."
 A10D_staff_college:0 "Штабная школа островов"
 A10D_staff_college_desc:0 "Штаб должен рассчитывать прилив так же уверенно, как численность батальона. В школе сведут полевых офицеров, лоцманов и интендантов за одним картографическим столом."
 A10D_gunboat_school:0 "Школа канонерских команд"
 A10D_gunboat_school_desc:0 "Будущим командирам предстоит служить на канонерках, миноносцах и вооружённых пароходах. Они начнут с котельного дела, стрельбы по щитам и сопровождения тихоходных транспортов."
 A10D_ammunition_toolrooms:0 "Инструментальные цеха арсеналов"
 A10D_ammunition_toolrooms_desc:0 "Новые цеха будут делать гильзы, пружины и запасные части по общим допускам. Заказ мал, но его можно выполнять круглый год, не ожидая очередного застрахованного каравана."
 A10D_patrol_flotillas:0 "Дозорные флотилии"
 A10D_patrol_flotillas_desc:0 "Небольшие дозоры прикроют подходы к паромным линиям и передадут предупреждение гарнизонам. Их задача — сохранить перевозки и уйти от превосходящих сил, пока береговые батареи готовятся к бою."
 A10W_oath:0 "Присяга торговой палате"
 A10W_oath_desc:0 "Совет островов предлагает Палате верность договорам в обмен на кредит, страхование и признание. Присяга ещё не передаёт суверенитет: каждая уступка должна получить отдельную печать. Ответ с Мадейры определит цену союза, а молчание заставит открыть собственную кассу."
 A10W_creditors_register:0 "Переписать долговые книги"
 A10W_creditors_register_desc:0 "Векселя Манилы, расписки Себу и обязательства провинциальных касс редко сходятся в одной сумме. Общий реестр отделит законный долг от повторных требований. Палата получит прозрачные счета; острова — основание спорить с её поверенными."
 A10W_bonded_warehouses:0 "Склады под двойной печатью"
 A10W_bonded_warehouses_desc:0 "Ни одна партия абаки не должна исчезать между пристанью и таможней. Склады будут запирать местный сборщик и поверенный страховщика; часть сборов обеспечит портовые работы. Купцы получат надёжный оборот, но аренда складов сделает каждую поставку дороже."
 A10W_silver_convoy:0 "Полис «Серебряного конвоя»"
 A10W_silver_convoy_desc:0 "Подпись старой гвардии открывает страховую книгу, но не превращает торговые суда в броненосцы. Мы оплатим ограниченный полис и подготовим местный страховой резерв на случай отказа. Убытки придётся считать даже под самым дорогим флагом."
 A10W_cable_priority:0 "Кабель и портовая стража"
 A10W_cable_priority_desc:0 "Связь с Мадейрой бесполезна, если противник первым займёт телеграфную станцию. Совместим кабельный договор с дозорами на пристанях, сигнальными постами и учениями островных рот. Палата продаёт доступ к сведениям; защищать берега предстоит нашим людям."
 A10W_harbour_survey:0 "Опись причалов и маяков"
 A10W_harbour_survey_desc:0 "Поверенные требуют карту доходов, судовладельцы — карту мелей. Одна экспедиция составит обе, проверив фарватеры, маяки и склады. Новые работы оплачиваются векселями: каждый причал должен принести больше, чем стоит его обслуживание."
 A10W_local_shareholding:0 "Доли для островных домов"
 A10W_local_shareholding_desc:0 "Если все дивиденды уплывут на Мадейру, присяга останется чужой сделкой. Выделим долю местным торговым домам, кооперативам грузчиков и провинциальным кассам. Их представители смогут проверять отчёты, хотя крупные держатели уже спорят о числе голосов."
 A10W_charter_congress:0 "Съезд под двумя печатями"
 A10W_charter_congress_desc:0 "На стол съезда положены два проекта: островная колониальная хартия под покровительством Палаты и самостоятельная метрополия её восточной сети. Ни один не отменяет права делегатов спорить о труде, налогах и представительстве. Прежде чем выбрать хозяина книги, договоримся, кто сможет её читать."
 A10W_colonial_charter:0 "Проект колониальной хартии"
 A10W_colonial_charter_desc:0 "Сторонники покровительства готовы передать внешние договоры Палате, сохранив островные суды и местную стражу. Пока обе стороны не ратифицируют конвенцию, документ остаётся внутренним уставом. Даже самая подробная хартия не даёт Мадейре власти без её согласия."
 A10W_resident_council:0 "Совет при резиденте"
 A10W_resident_council_desc:0 "Резидент должен знать острова через избранных поверенных, а не только через счета экспортёров. Провинции получат места в совете, но печать казначейства останется общей. Такая власть работает быстрее съезда и вызывает немало подозрений у тех, кто лишится последнего слова."
 A10W_revenue_covenant:0 "Разделить портовые сборы"
 A10W_revenue_covenant_desc:0 "Определим заранее, сколько сборов идёт на причалы, сколько — на островную казну и сколько — кредиторам. Публичные доли урежут старые расписки без передачи самой земли. Уступка доходов облегчит долг сегодня и стеснит стройки в ближайшие месяцы."
 A10W_charter_constabulary:0 "Островная контрактная стража"
 A10W_charter_constabulary_desc:0 "Палата не пришлёт армию для каждой таможенной ссоры. Службу у складов, мостов и телеграфа возьмут островные роты с единым жалованьем. Стража подчинится местным начальникам; её содержание войдёт в бюджет хартии."
 A10W_export_estates:0 "Абака, сахар и аренда"
 A10W_export_estates_desc:0 "Экспортные дома обещают средства для дорог в обмен на долгие договоры аренды. Межи проверят местные суды, а ставки занесут в общую книгу. Выручка расширит хозяйство, но земледельцы опасаются, что чужие векселя окажутся прочнее их прав."
 A10W_debt_conversion:0 "Обмен долга на длинные бумаги"
 A10W_debt_conversion_desc:0 "Короткие расписки грозят казне новым кризисом при каждом выходе судна. Заменим их долгими бумагами под согласованные сборы и публичную отчётность. Это сократит внешний счёт, но будущие бюджеты ещё долго будут оплачивать нынешнюю передышку."
 A10W_colony:0 "Ратифицировать островную колонию"
 A10W_colony_desc:0 "Пошлём окончательную конвенцию на Мадейру: Палата получает верховное покровительство, острова сохраняют собственное управление и вооружённую стражу. Согласие превратит хартию в реальную зависимость. Отказ оставит наш кабинет у власти и откроет новый раунд переговоров после передышки."
 A10W_port_welfare:0 "Лазареты у причалов"
 A10W_port_welfare_desc:0 "Постоянные отчисления на воду, лазареты и помощь семьям грузчиков обойдутся дороже разовой милостыни. Зато эпидемия или несчастье не будет всякий раз останавливать порт. Совет хартии отвечает за эти расходы при любом исходе переговоров с Палатой."
 A10W_metropolitan_charter:0 "Проект новой метрополии"
 A10W_metropolitan_charter_desc:0 "Зачем вечно отправлять книги на другой край света, если главный оборот проходит у наших берегов? Островные дома предлагают собственный директорат и восточный центр расчётов. Мадейра получит предложение стать автономной атлантической конторой, а не приказ покинуть свои земли."
 A10W_island_registries:0 "Островные торговые реестры"
 A10W_island_registries_desc:0 "Новая метрополия начинается с признанных подписей, образцов мер и надёжного хранения контрактов. Канцелярии приведут портовые книги к одному порядку. Ни одна контора не получит власть над чужим берегом только потому, что занесла его в свой атлас."
 A10W_merchant_assembly:0 "Собрание торговых домов"
 A10W_merchant_assembly_desc:0 "Островные дома согласны содержать общий секретариат, если решения не замкнутся в нескольких семьях. Распределим места между портами и учредим слушания по крупным договорам. Новое собрание ускорит сбор средств, но споры о дивидендах останутся частью его жизни."
 A10W_duplicate_cables:0 "Копии по двум кабелям"
 A10W_duplicate_cables_desc:0 "Одна оборванная линия не должна лишать острова всех котировок и приказов. Школы связистов подготовят людей для запасных станций, а важные книги будут храниться в нескольких портах. Технократам обещан заказ на оборудование вместо права закрывать сведения."
 A10W_secretariat_rules:0 "Ограничить тайный секретариат"
 A10W_secretariat_rules_desc:0 "Закрытая переписка нужна торговле, но секретный департамент охотно превращает её в отдельную власть. Учредим двойную подпись на чрезвычайных поручениях и закрытую проверку расходов. Часть поверенных уйдёт, зато островной совет узнает цену собственных тайн."
 A10W_escrow_exchange:0 "Биржа обеспеченных обязательств"
 A10W_escrow_exchange_desc:0 "Наши расписки должны опираться на реальные склады и проверенные доходы. Биржа введёт залоговые счета, открытые тарифы и суд для торговых споров. Прибыль останется умереннее громких обещаний, зато меньше домов обрушится от одной пропавшей шхуны."
 A10W_new_metropole:0 "Манильская конвенция"
 A10W_new_metropole_desc:0 "Предложим Мадейре перенести верховный расчётный центр на острова и сохранить за старой палатой широкую автономию атлантической конторы. Такая перемена требует её добровольной подписи. Пока Манила не возвращена, директорат будет заседать при временной островной бирже; отказ Мадейры не закроет её двери."
 A10W_oceanic_covenant:0 "Хартия двух океанов"
 A10W_oceanic_covenant_desc:0 "Свяжем страховые резервы, школы связи и сопровождение судов общим уставом. Каждая контора отвечает за свои убытки и нанимает охрану по договору; островная армия не становится войском Палаты. Так новая сеть сможет расти через согласованные сделки, сохраняя цену каждой гарантии в книгах."
