 WTN_PHI_accounts:0 "Местные счета и общие обещания"
 WTN_PHI_accounts_desc:0 "Отделим собственные обязательства от обещаний, которые другие делегации дали от нашего имени."
 WTN_PHI_own_resources:0 "Снабжение силами острова"
 WTN_PHI_own_resources_desc:0 "Местные средства помогут погасить счета, сохраняя самостоятельное решение о новых закупках."
 WTN_PHI_chamber_channel:0 "Собственная делегация в Палату"
 WTN_PHI_chamber_channel_desc:0 "Наши представители предложат Фуншалу торговое соглашение, которое не связывает другие филиппинские кабинеты."
 WTN_PHI_local_service:0 "Ремонтные дворы острова"
 WTN_PHI_local_service_desc:0 "Местные мастера подготовят склады и ремонтное оборудование для снабжающих остров судов."
 WTN_PHI_programme_1:0 "Самостоятельная торговая переписка"
 WTN_PHI_programme_1_desc:0 "Посланники смогут договариваться о морских службах, сохраняя собственную власть и действующие союзы."
 WTN_PHI_programme_2:0 "Согласовать приёмку припасов"
 WTN_PHI_programme_2_desc:0 "Портовые команды и местные власти сверят ведомости прибывающих грузов."
 WTN_PHI_programme_3:0 "Устойчивые островные службы"
 WTN_PHI_programme_3_desc:0 "Согласованные склады, ремонт и переписка помогут местной власти поддерживать связь с внешним миром."
 WTC_debt:0 "Долг Палате"
 WTC_old_guard:0 "Влияние Старой гвардии"
 WTC_technocrats:0 "Влияние технократов"
 WTC_secret_department:0 "Влияние Тайного департамента"
 WTN_liquidity:0 "Кредитный резерв"
 WTN_reputation:0 "Репутация Палаты"
 WTN_principal:0 "Суммарный индекс обязательств"
 WTN_accounts:0 "Долговые счета"
 WTN_distressed:0 "Счета под угрозой"
 WTN_partners:0 "Соглашения Палаты"
 WTN_suspend_credit:0 "Приостановить новые кредитные линии"
 WTN_suspend_credit_desc:0 "Прекратить открытие новых стандартных кредитов и целевых поставок. Предложения, под которые резерв уже выделен, сохраняют силу до ответа или истечения срока."
 WTN_resume_credit:0 "Возобновить кредитные линии"
 WTN_resume_credit_desc:0 "Вновь разрешить новые кредитные предложения в пределах доступного резерва."
 WTN_world_accounts:0 "Мировая долговая книга"
 WTN_world_accounts_desc:0 "Резерв Палаты: §Y[?WTN_liquidity|0]/100§!\nРепутация: §Y[?WTN_reputation|0]/100§!\nОбязательства: §Y[?WTN_principal|0]§!\nСчета с долгом: §Y[?WTN_accounts|0]§!; под угрозой: §R[?WTN_distressed|0]§!\nДействующие соглашения: §Y[?WTN_partners|0]§!\nСводка обновляется ежемесячно и при проверке счёта. Кредитное предложение резервирует 10 единиц до ответа; непринятое возвращает резерв."
 WTN_foreign_desks:0 "Торговые представительства"
 WTN_foreign_desks_desc:0 "Наш долг Палате: §Y[?WTC_debt|0]/100§!\nКредитный резерв Фуншала: §Y[?A04.WTN_liquidity|0]/100§!\nПоставки, страхование и расчёты требуют отдельных соглашений. Отправленное предложение не связывает вторую сторону до её ответа."
 WTN_offer_credit:0 "Предложить кредит: [FROM.GetName]"
 WTN_offer_credit_desc:0 "Зарезервируем средства для поставки транспортов и оснащения. Получатель решит, принимать ли обязательство."
 WTN_review_account:0 "Счёт [FROM.GetName]: [?FROM.WTC_debt|0]"
 WTN_review_account_desc:0 "Сверить счёт и обновить мировую сводку обязательств."
 WTN_account_report_tt:0 "Долг [FROM.GetName]: §Y[?FROM.WTC_debt|0]/100§!."
 WTN_relieve_account:0 "Списать часть долга: [FROM.GetName]"
 WTN_relieve_account_desc:0 "Сократить долг на 12 за 8 единиц резерва. Повторное списание этому кабинету — не ранее чем через 360 дней."
 WTN_recapitalise:0 "Собрать чрезвычайные взносы"
 WTN_recapitalise_desc:0 "Добавить 20 единиц резерва ценой 3 единиц репутации. Новые взносы можно собирать раз в 180 дней."
 WTN_request_credit:0 "Запросить целевую поставку Палаты"
 WTN_request_credit_desc:0 "При согласии: 15 транспортов и 75 вспомогательного оснащения за 15 долга; дополнительные проценты начисляются шесть месяцев. Средства резервируются до ответа, срок ответа — 30 дней."
 WTN_request_compact:0 "Предложить соглашение торговых служб"
 WTN_request_compact_desc:0 "Предложить Палате годовое соглашение. При согласии долг увеличится на 5; британские морские услуги вместо этого сокращают его на 5. Услуги соответствуют нуждам нашей страны."
 WTN_terminate_compact:0 "Расторгнуть соглашение с Палатой"
 WTN_terminate_compact_desc:0 "Прекратить услуги по соглашению. Ранее принятый долг сохраняется; срыв поставок вызывает недовольство."
 WTN_revoke_cover:0 "Отозвать британское прикрытие Палаты"
 WTN_revoke_cover_desc:0 "Отозвать флотское обеспечение кредитного принуждения. Без него Палата не сможет поддерживать чёрный список и навязывать долговые кабинеты."
 WTN_restore_cover:0 "Возобновить британское прикрытие"
 WTN_restore_cover_desc:0 "Вновь поручить флоту охрану путей Палаты при сохранении мира с Фуншалом."
 WTN_open_compact_tt:0 "Открывает предложение соглашения в торговых представительствах. Палата вправе отказать."
 WTN_open_relations_tt:0 "Открывает предложения взаимного обслуживания морских рейсов подходящим партнёрам. Вторая сторона вправе отказать."
 WTN_credit_committee_tt:0 "Открывает адресные кредитные предложения в мировой долговой книге."
 WTN_arbitration_tt:0 "Открывает адресное списание части долга за средства Палаты."
 wtn_network.1.t:0 "Предложение из Фуншала"
 wtn_network.1.d:0 "Представитель Палаты предлагает оплатить фрахт транспортов и доставку оснащения. Взамен казна признает новое обязательство; его обслуживание войдёт в общие расчёты с Фуншалом. Подписи нашего кабинета под договором пока нет."
 wtn_network.1.a:0 "Подписать условия поставки"
 wtn_network.1.b:0 "Отказаться от нового обязательства"
 wtn_network.3.t:0 "Торговое представительство [FROM.GetName]"
 wtn_network.3.d:0 "Представительство предлагает согласовать обслуживание рейсов и расчёты с Палатой. Делегаты подчёркивают: их кабинет сохраняет самостоятельность, а соглашение касается только оговорённых торговых служб."
 wtn_network.3.a:0 "Согласовать условия с представителями"
 wtn_network.3.b:0 "Отложить заключение соглашения"
 wtn_network.4.t:0 "Палата подтвердила соглашение"
 wtn_network.4.d:0 "Из Фуншала поступили подписанные ведомости. Представители Палаты согласовали обслуживание рейсов и порядок расчётов; наши портовые службы получили условия работы на предстоящий сезон."
 wtn_network.5.t:0 "Переговоры остались без соглашения"
 wtn_network.5.d:0 "Посланники завершили переписку с Фуншалом без подтверждённых условий. Кабинету предстоит опираться на собственные морские службы и вновь оценить предложения посредников."
 wtn_network.ack:0 "Принять донесение к сведению"
