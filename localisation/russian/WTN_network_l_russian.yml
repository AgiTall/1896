l_russian:
 WTN_british_contract:0 "Оплаченные океанские стоянки"
 WTN_british_contract_desc:0 "Согласованные расчёты помогают морским станциям поддерживать ремонт и снабжение."
 WTN_osaka_contract:0 "Осакские расчётные ведомости"
 WTN_osaka_contract_desc:0 "Торговые дома согласуют платежи и очередность промышленных заказов."
 WTN_northern_contract:0 "Сверенные северные запасы"
 WTN_northern_contract_desc:0 "Интенданты знают, какие грузы находятся в складах и какие ещё идут морем."
 WTN_research_contract:0 "Обмен научной перепиской"
 WTN_research_contract_desc:0 "Учёные получают приборы и сопоставимые журналы наблюдений, сохраняя самостоятельность своих лабораторий."
 WTN_caribbean_contract:0 "Согласованные карибские рейсы"
 WTN_caribbean_contract_desc:0 "Капитаны и посредники согласуют места встречи и передачи грузов."
 WTN_colonial_contract:0 "Колониальные торговые ведомости"
 WTN_colonial_contract_desc:0 "Склады и мастерские получают согласованные сведения о поступлении материалов."
 WTN_island_contract:0 "Островные складские соглашения"
 WTN_island_contract_desc:0 "Посредники и портовые команды работают по согласованным правилам хранения и расчёта."
 WTN_domestic_workshops:0 "Заказы собственным мастерским"
 WTN_domestic_workshops_desc:0 "Местные мастера согласуют работу, чтобы реже ожидать срочных морских поставок."
 WTN_insurance_office:0 "Сверенные страховые книги"
 WTN_insurance_office_desc:0 "Палата оценивает потери по проверенным сведениям своих отделений."
 WTN_cable_office:0 "Согласованная кабельная служба"
 WTN_cable_office_desc:0 "Станции передают срочные сообщения по согласованной очереди."
 WTN_warden_contract:0 "Договоры охраны и ремонта"
 WTN_warden_contract_desc:0 "Наёмная охрана отвечает за причалы, а мастерские — за готовность судов к рейсу."
 WTN_solvent_accounts:0 "Обеспеченные счета Палаты"
 WTN_solvent_accounts_desc:0 "Отделения сверяют обязательства с доступными средствами, поддерживая доверие к общей подписи."
 WTN_guard_settlement:0 "Устав обеспеченных обязательств"
 WTN_guard_settlement_desc:0 "Страховые дома соблюдают общий порядок рассмотрения залоговых споров."
 WTN_technical_directorate:0 "Технический директорат"
 WTN_technical_directorate_desc:0 "Инженеры участвуют в решениях о связи, снабжении приборов и научной переписке."
 WTN_secret_accounts:0 "Подотчётный Тайный департамент"
 WTN_secret_accounts_desc:0 "Закрытый отдел обязан объяснять расходы директорату, даже когда имена посредников остаются в запечатанных делах."
 WTN_island_congress:0 "Конгресс торговых представителей"
 WTN_island_congress_desc:0 "Островные представители пользуются общим порядком переговоров с Палатой."
 WTN_british_stations:0 "Сеть британских стоянок"
 WTN_british_stations_desc:0 "Адмиралтейские станции обмениваются расписаниями и сведениями о ремонте."
 WTN_northern_observatory:0 "Северные наблюдательные журналы"
 WTN_northern_observatory_desc:0 "Наблюдения сведены в сопоставимые записи и сохранены для дальнейших исследований."
 WTN_osaka_accounts:0 "Ответственные торговые дома"
 WTN_osaka_accounts_desc:0 "Торговые дома отвечают по своим счетам и поддерживают общий порядок приёмки заказов."
 WTN_northern_stores:0 "Северное складское хозяйство"
 WTN_northern_stores_desc:0 "Собственные склады помогают гарнизонам выдерживать перебои связи с югом."
 WTN_havana_routes:0 "Торговый выход Гаваны"
 WTN_havana_routes_desc:0 "Гаванские посредники поддерживают устойчивую связь с внешними торговыми домами."
 WTN_colonial_council:0 "Совещания колониальных кабинетов"
 WTN_colonial_council_desc:0 "Отдельные кабинеты обсуждают общие торговые дела, сохраняя самостоятельные парламенты."
 WTN_harbour_court:0 "Двор и торговые представители"
 WTN_harbour_court_desc:0 "Представители двора отвечают за переговоры, а портовые общины — за исполнение местных договоров."
 WTN_island_cooperation:0 "Договор островных служб"
 WTN_island_cooperation_desc:0 "Оба правительства согласовали обмен морскими ведомостями и порядок обслуживания торговых рейсов."
 WTN_local_services:0 "Устойчивые местные службы"
 WTN_local_services_desc:0 "Местная власть согласовала работу складов, ремонтных дворов и торговых представителей."
 WTN_link_research_services:0 "Совместные наблюдательные журналы"
 WTN_link_research_services_desc:0 "Исландские и мальтийские исследователи обмениваются записями через согласованные морские службы."
 WTN_link_workshop_services:0 "Осакско-токийские производственные ведомости"
 WTN_link_workshop_services_desc:0 "Заказчики и мастерские сверяют сведения о деталях и очередности поставок."
 WTN_link_northern_services:0 "Северный порядок поставок"
 WTN_link_northern_services_desc:0 "Северные и южные представители согласуют приёмку грузов, сохраняя отдельные правительства."
 WTN_link_fuel_services:0 "Сопровождение батавских грузов"
 WTN_link_fuel_services_desc:0 "Британские и батавские портовые службы согласуют морские рейсы, обслуживающие торговлю топливом."
 WTN_link_colonial_services:0 "Межколониальная грузовая служба"
 WTN_link_colonial_services_desc:0 "Кабинеты согласовали приёмку строительных грузов, не объединяя колониальные казначейства."
 WTN_link_caribbean_services:0 "Согласованные карибские эскорты"
 WTN_link_caribbean_services_desc:0 "Карибские и внешние капитаны согласуют места встречи торговых судов с охранением."
 WTN_pact_british_services:0 "Палата: Оплаченные океанские стоянки"
 WTN_pact_british_services_desc:0 "Согласованные расчёты помогают морским станциям поддерживать ремонт и снабжение."
 WTN_pact_osaka_services:0 "Палата: Осакские расчётные ведомости"
 WTN_pact_osaka_services_desc:0 "Торговые дома согласуют платежи и очередность промышленных заказов."
 WTN_pact_northern_services:0 "Палата: Сверенные северные запасы"
 WTN_pact_northern_services_desc:0 "Интенданты знают, какие грузы находятся в складах и какие ещё идут морем."
 WTN_pact_research_services:0 "Палата: Обмен научной перепиской"
 WTN_pact_research_services_desc:0 "Учёные получают приборы и сопоставимые журналы наблюдений, сохраняя самостоятельность своих лабораторий."
 WTN_pact_caribbean_services:0 "Палата: Согласованные карибские рейсы"
 WTN_pact_caribbean_services_desc:0 "Капитаны и посредники согласуют места встречи и передачи грузов."
 WTN_pact_colonial_services:0 "Палата: Колониальные торговые ведомости"
 WTN_pact_colonial_services_desc:0 "Склады и мастерские получают согласованные сведения о поступлении материалов."
 WTN_pact_island_services:0 "Палата: Островные складские соглашения"
 WTN_pact_island_services_desc:0 "Посредники и портовые команды работают по согласованным правилам хранения и расчёта."
 WTN_annual_report:0 "Годовой отчёт Ламберта"
 WTN_annual_report_desc:0 "Сведения о потерянных рейсах и долгах сойдутся под одной подписью. Директорат должен увидеть, на чём держится торговый порядок."
 WTN_common_registry:0 "Единый реестр обязательств"
 WTN_common_registry_desc:0 "Отделения Палаты обмениваются выписками, чтобы одна и та же выручка не служила залогом нескольким кредиторам. В Фуншале оборудуют мастерские для общих конторских и портовых служб."
 WTN_credit_committee:0 "Кредитный комитет"
 WTN_credit_committee_desc:0 "Новые займы пройдут через общий комитет. Каждому обещанию должна соответствовать запись о доступном резерве."
 WTN_gold_reserves:0 "Неприкосновенный резерв"
 WTN_gold_reserves_desc:0 "Часть поступлений останется в Фуншале для покрытия задержек и непредвиденных убытков."
 WTN_arbitration:0 "Арбитраж долговых палат"
 WTN_arbitration_desc:0 "Долг, который нельзя взыскать, опаснее уступки. Арбитры получат право договариваться о частичном списании."
 WTN_reserve_audit:0 "Ревизия отделений"
 WTN_reserve_audit_desc:0 "Проверим выданные гарантии и отделим действительные залоги от обещаний местных посредников."
 WTN_mutual_settlement:0 "Взаимный зачёт"
 WTN_mutual_settlement_desc:0 "Встречные платежи можно сводить в Фуншале, освобождая суда от перевозки одних и тех же расписок."
 WTN_solvent_chamber:0 "Палата исполняет обязательства"
 WTN_solvent_chamber_desc:0 "Отделения должны знать: директорат отвечает за собственную подпись так же, как требует ответа от должников. Постоянные мастерские получат дополнительные заказы для общей сети."
 WTN_guard_charter:0 "Устав Старой гвардии"
 WTN_guard_charter_desc:0 "Страховые дома предлагают укрепить привычный порядок: залоги, премии и ответственность капитанов."
 WTN_silver_convoy:0 "Книги «Серебряного Конвоя»"
 WTN_silver_convoy_desc:0 "Страховщики сведут сведения о потерях и перестанут назначать премии по слухам с пристаней."
 WTN_insured_ports:0 "Смотрители застрахованных портов"
 WTN_insured_ports_desc:0 "Смотрители проверят склады и порядок погрузки прежде, чем Палата примет риск на себя."
 WTN_market_rules:0 "Общие правила премий"
 WTN_market_rules_desc:0 "Отделениям запретят скрывать скидки и перекладывать убытки на соседние страховые дома."
 WTN_guard_settlement_charter:0 "Порядок обеспеченных обязательств"
 WTN_guard_settlement_charter_desc:0 "Кредиторы сохранят право на залог, но спор о нём будет решаться по общему уставу."
 WTN_tech_charter:0 "Мандат молодых технократов"
 WTN_tech_charter_desc:0 "Инженеры предлагают вкладывать средства в связь и измерения, пока новые открытия не оставили Палату позади."
 WTN_cable_survey:0 "Обследовать кабельную сеть"
 WTN_cable_survey_desc:0 "Ремонтные суда сверят повреждённые линии, а станции договорятся о передаче срочных сообщений."
 WTN_malta_correspondence:0 "Переписка с Мальтой"
 WTN_malta_correspondence_desc:0 "Лабораториям нужны приборы и свободная переписка. Палата предложит оплату поставок без права присваивать чужие открытия."
 WTN_measurement_fund:0 "Фонд измерительных станций"
 WTN_measurement_fund_desc:0 "Разрозненные наблюдения Песни станут полезнее, если приборы и журналы будут сопоставимы."
 WTN_open_patents:0 "Договор о научной переписке"
 WTN_open_patents_desc:0 "Обмен сведениями даст Палате место за столом исследователей, сохраняя самостоятельность лабораторий."
 WTN_secret_charter:0 "Полномочия Тайного департамента"
 WTN_secret_charter_desc:0 "Директорат поручит особому отделу проверять посредников и узнавать о закрытых сделках до их подписания."
 WTN_cable_watch:0 "Закрытые кабельные сводки"
 WTN_cable_watch_desc:0 "Кабельные служащие будут отделять коммерческие слухи от сведений, требующих внимания директората."
 WTN_strait_wardens:0 "Договоры со Стражами Проливов"
 WTN_strait_wardens_desc:0 "Наёмной охране поручат склады и причалы. Условия найма должны исключать самостоятельные походы от имени Палаты."
 WTN_pirate_contacts:0 "Посредники в вольных гаванях"
 WTN_pirate_contacts_desc:0 "Непризнанные капитаны знают обходные пути. Их услуги сохранят связь ценой доверия открытых торговых домов."
 WTN_secret_accounts_control:0 "Отчётность закрытого отдела"
 WTN_secret_accounts_control_desc:0 "Даже тайные расходы должны иметь предел. Директорат потребует отчёта о людях, договорах и утраченных средствах."
 WTN_foreign_offices:0 "Отделения островного мира"
 WTN_foreign_offices_desc:0 "Фуншал должен слышать не только крупнейших должников, но и небольшие гавани, через которые проходит торговля."
 WTN_british_understanding:0 "Соглашение с Левиафаном"
 WTN_british_understanding_desc:0 "Британский флот охраняет пути Палаты, но его адмиралы ждут признания собственных расходов и интересов."
 WTN_pacific_accounts:0 "Тихоокеанские счета"
 WTN_pacific_accounts_desc:0 "Батавия, Токио и Осака связаны торговлей даже тогда, когда их штабы готовятся к столкновению."
 WTN_colonial_desks:0 "Шесть австралийских отделений"
 WTN_colonial_desks_desc:0 "Каждая колония ведёт собственные счета. Общий представитель не вправе подписывать обязательства за соседей."
 WTN_caribbean_routes:0 "Карибские маршруты"
 WTN_caribbean_routes_desc:0 "Гаванские посредники готовы обсуждать проводку судов, но не признают за Палатой права распоряжаться их берегами."
 WTN_northern_observers:0 "Наблюдатели северных морей"
 WTN_northern_observers_desc:0 "Записи исландских и мальтийских учёных помогут оценить слухи о переменах на покинутых берегах."
 WTN_island_congress_protocol:0 "Конгресс торговых представителей"
 WTN_island_congress_protocol_desc:0 "Островные правительства получат общий порядок переговоров с Палатой, сохраняя право отвергать её условия."
 WTN_BRI_council:0 "Совет уцелевшего Адмиралтейства"
 WTN_BRI_council_desc:0 "Разбросанные базы требуют общих приказов, а правительство на Бермудах — отчёта об их исполнении."
 WTN_BRI_accounts:0 "Счета имперских стоянок"
 WTN_BRI_accounts_desc:0 "Адмиралы сверят долги стоянок и расходы на суда, прежде чем обещать новые походы."
 WTN_BRI_independent_admiralty:0 "Самостоятельное Адмиралтейство"
 WTN_BRI_independent_admiralty_desc:0 "Собственные сборы помогут сократить зависимость от Фуншала. Флот получит право пересмотреть охрану путей Палаты."
 WTN_BRI_chamber_channel:0 "Цена морского прикрытия"
 WTN_BRI_chamber_channel_desc:0 "Палата пользуется британской охраной. Обсудим зачёт части долга в обмен на обслуживание её морских путей."
 WTN_BRI_local_service:0 "Диспетчеры океанских станций"
 WTN_BRI_local_service_desc:0 "Станции согласуют сроки переходов и перестанут требовать одни и те же суда одновременно."
 WTN_BRI_programme_1:0 "Переговоры о нефти Батавии"
 WTN_BRI_programme_1_desc:0 "Без топлива не удержать океан. Торговым представителям поручат прямую переписку с Батавией."
 WTN_BRI_programme_2:0 "Колониальные представители"
 WTN_BRI_programme_2_desc:0 "Австралийские кабинеты должны обсуждать снабжение своими голосами, а не получать единый счёт из Гамильтона."
 WTN_BRI_programme_3:0 "Мальтийские приборы"
 WTN_BRI_programme_3_desc:0 "Доставим лабораториям измерительное оборудование и защитим научную переписку морской почтой."
 WTN_BRI_programme_4:0 "Ремонт между переходами"
 WTN_BRI_programme_4_desc:0 "Списки запасных деталей будут сопровождать корабли от одной стоянки к другой."
 WTN_BRI_programme_5:0 "Левиафан держит пути"
 WTN_BRI_programme_5_desc:0 "Разбросанные гавани смогут полагаться на согласованное расписание и общие морские службы."
 WTN_RUS_council:0 "Двор и канцелярия в Рейкьявике"
 WTN_RUS_council_desc:0 "Императорский двор и церковная канцелярия должны разобраться, кто отвечает за повседневную жизнь изгнания."
 WTN_RUS_accounts:0 "Перепись северных запасов"
 WTN_RUS_accounts_desc:0 "Зимние запасы и долги купцам сведут в общие ведомости, открытые ответственным чиновникам."
 WTN_RUS_own_resources:0 "Сборы общин изгнания"
 WTN_RUS_own_resources_desc:0 "Общины помогут оплатить снабжение своими средствами, хотя новые сборы вызовут недовольство."
 WTN_RUS_chamber_channel:0 "Кредит северным лабораториям"
 WTN_RUS_chamber_channel_desc:0 "Учёные предлагают принимать целевые поставки приборов через Палату и сохранять собственные журналы наблюдений."
 WTN_RUS_local_service:0 "Портовые службы Рейкьявика"
 WTN_RUS_local_service_desc:0 "Общие склады помогут зимующим судам пережить задержку очередного рейса."
 WTN_RUS_programme_1:0 "Письма мальтийским учёным"
 WTN_RUS_programme_1_desc:0 "Обменяемся измерениями с Мальтой, не передавая ей ни лаборатории, ни право говорить от имени двора."
 WTN_RUS_programme_2:0 "Правила береговых наблюдений"
 WTN_RUS_programme_2_desc:0 "Наблюдатели будут сверять записи, чтобы слух о тишине не стал приказом к неподготовленному возвращению."
 WTN_RUS_programme_3:0 "Ответственность северных чиновников"
 WTN_RUS_programme_3_desc:0 "Портовым чиновникам придётся отвечать за утраченные грузы перед общинами и двором."
 WTN_RUS_programme_4:0 "Северные журналы"
 WTN_RUS_programme_4_desc:0 "Сохраним сведения о побережьях для будущих экспедиций, не обещая безопасной дороги через Песнь."
 WTN_OSA_council:0 "Совет осакских торговых домов"
 WTN_OSA_council_desc:0 "Ивасаки соберёт дома, чьи расписки поддерживают мастерские и связывают их с кредиторами."
 WTN_OSA_accounts:0 "Свести векселя Мицубиси"
 WTN_OSA_accounts_desc:0 "Отделим обязательства торговых домов от обещаний императорским подрядчикам."
 WTN_OSA_own_resources:0 "Сократить незакрытые заказы"
 WTN_OSA_own_resources_desc:0 "Откажемся от части обещанных поставок, чтобы рассчитаться по старым обязательствам собственными средствами."
 WTN_OSA_chamber_channel:0 "Осакская расчётная палата"
