l_russian:
 A01_DUAL_CAPITAL:0 "Новый Амстердам — Батавия"
 A01_NEW_AMSTERDAM:0 "Новый Амстердам"
 A01_conservatives:0 "Партия консерваторов"
 A01_constitution.a: "Да здравствует новая конституция!"
 A01_constitution.d: "Конституция 1854 года была написана ещё в Амстердаме для колонии, управляемой из метрополии. Метрополии больше нет. Амстердам под Песнью.\n\nНовая конституция предлагает пересмотреть статьи о гражданских правах коренного населения Индонезийского архипелага, землевладении и военной службе."
 A01_constitution.t: "Конституция 1854 года"
 A01_crown.1.a:0 "Признать право Совета на назначения"
 A01_crown.1.b:0 "Заключить соглашение о разделении власти"
 A01_crown.1.c:0 "Гвардия напомнит им, кому они присягали"
 A01_crown.1.d:0 "За закрытыми дверями адмиралы и островные вельможи требуют права блокировать указы и назначать министров. Гвардия ждёт приказа Королевы. От сегодняшнего решения зависит, станет ли монархия договором с Советом или властью нового двора."
 A01_crown.1.t:0 "Последний ультиматум Большого совета"
 A01_crown.2.a:0 "Дать Совету место за столом"
 A01_crown.2.b:0 "Обратиться к подданным напрямую"
 A01_crown.2.d:0 "Совет задерживает новые назначения и требует уступок по бюджету. Двор предлагает обойти его прямым обращением к населению. Пока основной закон не принят, спор о власти будет возвращаться."
 A01_crown.2.t:0 "Петиции Большого совета"
 A01_crown.3.a:0 "Вернуть Совету часть полномочий"
 A01_crown.3.b:0 "Арестовать заговорщиков"
 A01_crown.3.d:0 "Влияние двора стало почти безграничным. Несколько членов Совета тайно обсуждают отстранение королевских министров. Можно отступить ради соглашения или поручить гвардии арестовать заговорщиков, заплатив за это политическим кризисом."
 A01_crown.3.t:0 "Заговор в коридорах дворца"
 A01_crown_council_balance:0 "Королева и Большой совет"
 A01_future.1.a:0 "Начать подготовку."
 A01_future.1.d:0 "Разведка сообщает о японской подготовке на юге. В Батавии и Токио теперь считают дни до одной и той же развязки: укрепления, снабжение и дипломатические уступки определят, с чем стороны встретят войну.\n\nВ адмиралтействе спорят о том, можно ли ещё выиграть время. Фабиус предупреждает: перестановка министров в Токио не отменит ресурсных требований. Вирата просит объяснить населению, почему его снова готовят к службе. Касемброот требует заняться береговыми батареями. На столе лежит календарь; никакая торжественная речь не добавит к нему дней."
 A01_future.1.t:0 "Один отсчёт для двух берегов"
 A01_future.10.a:0 "Лояльность станет условием службы."
 A01_future.10.d:0 "Командиров вызывают по одному. На столе лежат послужной список и текст личной присяги Совету. Победы, ранения и знание проливов больше не гарантируют сохранения должности. Комиссия ищет связи с прежним кабинетом и сомнения в новом порядке.\n\nОфицер спрашивает, можно ли обжаловать решение. Ему отвечают, что жалоба будет передана тем же людям, которые проводят проверку. На кораблях появляются новые командиры; часть знает экипажи хуже, зато обладает безупречными рекомендациями. Штаб отмечает временное падение слаженности. Совет считает цену приемлемой: следующую войну должны вести люди, которые не станут спорить о власти."
 A01_future.10.t:0 "Присяга перед закрытой дверью"
 A01_future.11.a:0 "Регентство должно удержать страну."
 A01_future.11.d:0 "Эмма просит убрать со стола заранее подготовленные заявления о победе одной из сторон. «Я пришла не подписывать чужую капитуляцию». Адмиралы не смогли окончательно вытеснить кабинет, Людольф не сумел получить устойчивого большинства; равновесие угрожало превратиться в распад управления.\n\nКоролева-мать принимает регентство. Людольф передаёт полномочия, Совет сохраняет командование флотом и лишается претензии на исключительную власть. Делегаты островов требуют подтверждения хартий. Эмма соглашается обсуждать их отдельным актом. У каждого в зале есть причина быть недовольным — и причина признать арбитра, которого не назначил его противник."
 A01_future.11.t:0 "Регентша входит без свиты"
 A01_future.12.a:0 "Хартия связывает и будущего монарха."
 A01_future.12.d:0 "Султанские посланцы требуют заверить каждый экземпляр хартии. Индонезийские делегаты просят закрепить участие общин, чтобы автономия не стала лишь свободой местного двора от Батавии. Эмма поручает вписать обе гарантии.\n\nКасемброот предупреждает, что раздельные обязательства осложнят оборону. Регентша оставляет флот общим, но требует обсуждать бюджет с представителями островов. После заседания Сити спрашивает, переживёт ли документ смену монарха. «Иначе это было бы обещание женщины, а не обязательство короны», — отвечает Эмма."
 A01_future.12.t:0 "Хартия, которую читают на островах"
 A01_future.13.a:0 "Да здравствует королева Вильгельмина."
 A01_future.13.d:0 "Регентские бумаги закрывают отдельной лентой. Вильгельмина достигла совершеннолетия и принимает власть, которую её мать удерживала между спорящими кабинетами, адмиралами и островными делегациями.\n\nЭмма передаёт ей не только государственную печать, но и копии хартий. «Эти подписи удержали больше, чем многие приказы». Молодая королева выслушивает представителей султанатов прежде, чем начинает торжественное заседание. Военные ждут подтверждения морской программы, гражданские учреждения — конституционных гарантий. Регентство закончилось; необходимость договариваться осталась."
 A01_future.13.t:0 "Вильгельмина принимает полномочия"
 A01_future.14.a:0 "Ни один приказ не стоит выше конституции."
 A01_future.14.d:0 "В новой конституции нет должности, которая позволяла бы одному ведомству владеть всей страной. Монарх обеспечивает преемственность, гражданские учреждения ведут управление, военное командование отвечает за оборону. Представительство островов и автономные хартии становятся частью общего порядка.\n\nСовет добивается ясного определения командных полномочий, делегаты — порядка рассмотрения жалоб. Вильгельмина подписывает текст после последнего чтения. Эмма наблюдает за церемонией без регентской печати. Страна получила ответ на спор о верховной власти; теперь ей предстоит научиться жить по этому ответу."
 A01_future.14.t:0 "Корона и закон"
 A01_future.15.a:0 "Все аппараты подчинены Совету."
 A01_future.15.d:0 "Министерские таблички сохраняют названия, но за ними теперь стоят военные назначения. Бюджет проходит через Совет, судьи получают утверждение директории, местные учреждения отчитываются перед уполномоченными. Независимая политическая деятельность запрещена.\n\nЧистки заканчиваются не оправданием обвинённых, а исчезновением необходимости кого-либо обвинять публично. Людольф остаётся в тюрьме как символ наказанного поражения. На верфях ускоряются заказы; на площадях замолкают собрания. Совет объявляет, что государство наконец обрело единую волю. Тем, чья воля с ней не совпадает, места в учреждениях больше нет."
 A01_future.15.t:0 "Государство становится штабом"
 A01_future.16.a:0 "Рассмотреть монархический выход из кризиса."
 A01_future.16.b:0 "Продолжить спор без вмешательства короны."
 A01_future.16.d:0 "Вечером Фабиусу передают письмо королевы-матери. Эмма не предлагает вернуть старые порядки: она спрашивает, осталось ли в Батавии место для власти, которую признают обе стороны. Совет не может собрать решающего большинства, гражданский кабинет тоже держится лишь на чужом страхе перед соперником.\n\nВ письме предлагается регентство, подтверждение островных хартий и разграничение гражданской и военной власти. Фабиус читает его Людольфу без свидетелей. Тот долго смотрит на последние строки. Принять предложение означает уйти; отвергнуть — продолжить борьбу, исход которой всё ещё не решён."
 A01_future.16.t:0 "Письмо без герба на конверте"
 A01_future.17.a:0 "Приступить к гражданским реформам."
 A01_future.17.d:0 "Послевоенный кабинет сохраняет гражданский курс. Людольф остаётся на посту, но не получает прощения за поражение. Совет требует результатов, а делегаты островов — ответа на требования свободы.\n\nФабиус предлагает начать с открытой комиссии. Вирата настаивает, что жители должны увидеть перемены за пределами Батавии. Людольф поручает готовить автономные хартии. Когда султанаты появятся, именно их представители смогут обратиться к Совету с просьбой дать губернатору второй шанс."
 A01_future.17.t:0 "Людольф получает время на реформы"
 A01_future.2.a:0 "Мы должны ответить им."
 A01_future.2.d:0 "Перед закрытыми воротами резиденции читают условия соглашения с Японией. Из толпы спрашивают, почему людям предлагают платить за войну, в решении о которой они не участвовали. Хасан держит список погибших грузчиков. Сити принесла письмо деревенского собрания: если Батавия не может защитить острова, пусть хотя бы перестанет решать за них всё.\n\nОдни требуют автономии, другие — выборов, третьи — немедленного конца колониальной власти. Людольф предлагает преобразования. Совет отвечает, что проигравший губернатор не вправе обещать новую страну. Общество уже не согласится вернуться к прежней тишине."
 A01_future.2.t:0 "После поражения заговорили острова"
 A01_future.3.a:0 "Открыть слушания."
 A01_future.3.d:0 "Совет принимает заявление о рассмотрении ответственности Людольфа. Касемброот требует передать дела военной комиссии; Фабиус возражает против смены правительства одним приказом. «Если мы судим за потерянные берега, придётся выслушать и тех, кто отдавал приказы флоту». Людольф остаётся на посту на время слушаний. На улицах это называют отсрочкой, в адмиралтействе — последней возможностью объясниться. Губернатор просит пригласить представителей островов. Протоколист впервые оставляет для их подписей отдельное место."
 A01_future.3.t:0 "Кабинет остаётся. Пока"
 A01_future.4.a:0 "Пусть страна услышит обе стороны."
 A01_future.4.d:0 "В зале заседаний сталкиваются два ответа на поражение. Совет требует единого командования: министры спорили, пока японские транспорты шли к берегу. Делегаты островов отвечают, что командование не становится правым лишь потому, что умеет отдавать приказы.\n\nЛюдольф признаёт собственную ответственность, но просит не подменять расследование захватом власти. «Нельзя вернуть доверие, просто сменив вывеску над резиденцией». Касемброот спрашивает, на чью поддержку он рассчитывает. Губернатор смотрит на ещё пустые места султанских делегатов. Теперь каждое назначение, хартия и выступление станет частью борьбы за будущее Нидерландов."
 A01_future.4.t:0 "Кому принадлежит право решать?"
 A01_future.5.a:0 "Дать Людольфу федеральный мандат."
 A01_future.5.b:0 "Передать власть Совету и арестовать Людольфа."
 A01_future.5.d:0 "Срок слушаний истёк. Папки комиссии больше не помещаются на столе: донесения, жалобы семей, проекты хартий и требования отставки. Фабиус просит закончить спор решением, которое можно будет исполнить.\n\nПредставители султанатов, если они получили автономию, предлагают сохранить Людольфа ради федеративных преобразований. Совет считает, что второй шанс станет оправданием поражения, и требует передачи власти военным. Продолжать временное правление уже невозможно. Сегодня речь идёт не только об одном человеке: участники заседания выбирают, кто получит право назначать служащих, распоряжаться казной и говорить от имени страны."
 A01_future.5.t:0 "Решающее заседание"
 A01_future.6.a:0 "Гражданство не определяется происхождением."
 A01_future.6.d:0 "Писарь читает отменяемые ограничения, и зал постепенно замолкает. Прежде эти строки решали, чья жалоба заслуживает рассмотрения и чья кандидатура даже не попадёт в список. Теперь происхождение перестаёт быть законным основанием для отстранения от гражданского участия.\n\nСити спрашивает, кто проверит исполнение на островах. Людольф отвечает, что одного распоряжения недостаточно: следующим шагом должны стать местные выборные учреждения. Европейские чиновники опасаются потерять привычные места; молодые делегаты опасаются, что старые правила вернут под другим названием. Хасан забирает копию закона. «Теперь у нас будет бумага, с которой можно прийти в ваш суд»."
 A01_future.6.t:0 "Одна строка в законе"
 A01_future.7.a:0 "Учреждения должны отвечать перед жителями."
 A01_future.7.d:0 "Окружной совет отклоняет предложенного Батавией начальника порта и выдвигает местного служащего. Его фамилия вызывает раздражение в ведомстве; его отчёты оказываются лучше отчётов прежнего начальника. Людольф утверждает решение совета, несмотря на письмо влиятельной компании.\n\nСултанские делегаты требуют участия своих территорий в федеральных назначениях. Индонезийские представители настаивают, чтобы право голоса не принадлежало только дворцам. После спора утверждают открытые слушания, выдвижение от окружных советов и совместное рассмотрение центральных должностей. Первая процедура проходит медленно. Но впервые задержка вызвана необходимостью получить согласие людей, которыми собираются управлять."
 A01_future.7.t:0 "Имя в списке назначений"
 A01_future.8.a:0 "Нидерланды становятся общим делом."
 A01_future.8.d:0 "Под конституцией стоят подписи гражданского кабинета, выборных представителей островов и автономных султанатов. Не все голосовали за неё; никто не получил всего, чего хотел. Общины добились участия в управлении, султаны — гарантий самоуправления, центральное правительство — общих правил обороны и бюджета.\n\nЛюдольф произносит короткую речь. Когда он говорит о сохранённом государстве, Хасан поправляет: «О государстве, в котором мы наконец появились». Губернатор принимает поправку. На следующем заседании уже придётся отвечать на вопросы о выборах и расходах. Федерация начинается с права задавать эти вопросы вслух."
 A01_future.8.t:0 "Подписи под общей страной"
 A01_future.9.a:0 "Назначения переходят к военным."
 A01_future.9.d:0 "Военные уполномоченные входят в министерства с перечнями отстранённых. Одним предлагают подписать присягу Совету, другим не дают собрать вещи. Архивы опечатывают, заседания местных советов отменяют до проверки благонадёжности.\n\nЧлены комиссии спорят, где заканчивается расследование ошибок и начинается устранение противников. Ответ приходит в новом приказе: несогласие с курсом Совета само становится основанием для увольнения. Людольф остаётся в заключении; обращения о его освобождении подшивают к материалам о неблагонадёжных. Учреждения работают хуже, но теперь в каждом кабинете точно знают, чьё решение считается последним."
 A01_future.9.t:0 "Печати меняют хозяев"
 A01_japan.1.a:0 "Стоит готовиться к худшему"
 A01_japan.1.d:0 "Японское правительство отвергло предложенный пакт о ненападении и отказалось обсуждать ограниченный доступ к каучуковым лесам. Вместо соглашения Токио предъявил ультиматум: Батавия должна предоставить Японии широкие права на нефть и каучук, а также допустить японских представителей в ключевые порты. Принять такие требования означало бы отказаться от собственного суверенитета."
 A01_japan.1.t:0 "Япония отвергает наше предложение"
 A01_japan.10.a:0 "Выслушать ответ делегации."
 A01_japan.10.d:0 "Касемброот придвигает к Хасану карту морских путей. «Закройте эти проливы — и рис не дойдёт до ваших рынков. Отдайте порты Токио — и следующий приказ о погрузке будет написан по-японски. У нас нет месяца на спор о каждом приказе».\n\n«Зато у вас были годы, чтобы услышать наши жалобы», — отвечает Хасан. Он рассказывает о грузчиках, которым задолжали жалованье, и о призывниках, чьи семьи продолжают платить сборы за отсутствующих работников. Сити спрашивает, почему караул охраняет склады компании, когда деревни просят защиты от реквизиций.\n\nАдмирал на миг замолкает. Он признаёт, что снабженцы должны отвечать за воровство, но требует немедленного возвращения людей на службу. Фабиус возражает: приказ заставит человека явиться в казарму, но не удержит его в бою. Делегаты готовы говорить об обороне; принять безусловное повиновение они отказываются."
 A01_japan.10.t:0 "Касемброот требует повиновения"
 A01_japan.11.a:0 "Пусть делегаты проверят каждую гарантию."
 A01_japan.11.d:0 "Фабиус начинает не с карты, а с расчётной ведомости. «Здесь одинаковая служба оплачивается по-разному. Если я называю вас товарищами по обороне, эта бумага делает меня лжецом». Он предлагает проверку выплат, помощь семьям и разбор жалоб, сохраняя обязательную службу.\n\nХасан не берёт протянутый документ. «Мой отец уже слышал слово “после”. После урожая, после переписи, после следующей войны. Кто заставит вашего чиновника исполнить обещание?» Сити добавляет: деньги бесполезны, если землевладелец заберёт участок до возвращения солдата.\n\nКасемброот напоминает, что казна не бездонна, а противник не станет ждать окончания проверок. Фабиус отвечает, что сорванный призыв обойдётся дороже. Он предлагает допустить представителей общин к жалобам через совет султанов. Сурья Вирата поддерживает договор, но спрашивает, будет ли у местных солдат право командовать, а не только подчиняться."
 A01_japan.11.t:0 "Фабиус предлагает договор о службе"
 A01_japan.12.a:0 "Обсудить пределы добровольческой службы."
 A01_japan.12.d:0 "Сурья Вирата снимает фуражку и садится напротив делегатов. «Я служу на этих кораблях и знаю, как звучит приказ, когда тебя считают чужим. Но японский офицер не вернёт вам землю только потому, что говорит об освобождении». Он предлагает добровольческие части для защиты архипелага.\n\nХасан отвечает, что люди готовы охранять свои причалы, но не хотят быть отправлены за море ради чужих концессий. Сити требует назвать срок службы: деревня не может годами кормить армию и ждать мужчин. Представитель молодых забастовщиков спрашивает, не отнимут ли у добровольцев оружие сразу после того, как исчезнет опасность для администрации.\n\nКасемброот видит другую угрозу: отдельные отряды могут однажды повернуть винтовки против Батавии. «А вы предлагаете дать винтовку человеку, которому заранее не доверяете?» — спрашивает Вирата. Фабиус предлагает обсудить единое снабжение и общий штаб. Впервые спор идёт об условиях совместной защиты, а не о том, кто обязан замолчать."
 A01_japan.12.t:0 "Сурья Вирата обращается к островам"
 A01_japan.2.a:0 "Объявить военное положение и заставить их молчать"
 A01_japan.2.b:0 "Предложить страхование от ВТП в обмен на лояльность"
 A01_japan.2.balance:0 "Поручить выступление Фабиусу."
 A01_japan.2.d:0 "У ворот адмиралтейства стоят грузчики, матросские жёны и посланцы деревень. Они принесли не японские флаги, а списки пропавших работников и требования прекратить призыв. Представитель портов Хасан согласился войти в зал лишь после обещания выпустить делегацию обратно.\n\n«Вы называете это защитой родины, — начинает он. — Но кто из нас решает, где её границы? Плантатор оставляет себе прибыль, чиновник — должность, а нам достаются могилы». Посланница деревень Сити кладёт на стол долговые расписки: пока мужчины служат, семьи теряют землю.\n\nКасемброот разворачивает карту портов: японский ультиматум касается нефти, каучука и контроля над побережьем. Фабиус просит не путать страх перед вторжением с согласием на колониальные порядки. Сурья Вирата предлагает сначала выслушать тех, кого собираются вооружить. Совет должен выбрать, кто начнёт переговоры."
 A01_japan.2.hard:0 "Поручить выступление Касемброоту."
 A01_japan.2.support:0 "Поручить выступление Сурье Вирате."
 A01_japan.2.t:0 "Индонезийцы отказываются воевать"
 A01_japan.20.a:0 "Сохранить принудительный призыв."
 A01_japan.20.d:0 "На втором заседании Касемброот требует разоружить пикеты у складов. Хасан отвечает, что без пикетов хозяева снова наймут штрейкбрехеров и забудут долги. «Вы просите доверия, держа людей у ворот под прицелом».\n\nАдмирал говорит о транспортах, которые нельзя разгрузить, и батареях, оставшихся без снарядов. Сити признаёт опасность: семьи портовых рабочих тоже погибнут при высадке. Но она требует отделить защиту гавани от наказания за жалобы. Фабиус предлагает обмен: делегация убеждает людей вернуться, совет рассматривает злоупотребления и условия службы.\n\n«Если я уступлю сейчас, завтра любой приказ будут встречать забастовкой», — говорит Касемброот. «Если не уступите никогда, приказ некому будет выполнять», — отвечает Вирата. Делегация не обещает покорности. Совет может сохранить принуждение, принять договор Фабиуса или доверить защиту добровольцам."
 A01_japan.20.t:0 "Адмиралы спорят о принуждении"
 A01_japan.21.a:0 "Подписать договор о службе."
 A01_japan.21.d:0 "Фабиус зачитывает проект договора. Хасан останавливает его на словах о помощи семьям: «Кто получит выплату, если писарь объявит брак недействительным?» Сити требует принимать свидетельства общины. Адмирал соглашается передать спорные случаи на рассмотрение совета султанов.\n\nКасемброот возражает против превращения каждого взыскания в разбирательство. Он опасается, что командиры потеряют власть именно перед вторжением. Фабиус проводит границу: боевой приказ остаётся приказом, спор о невыплаченном жалованье не становится мятежом.\n\nВирата предлагает местных командиров, но Фабиус пока не готов перестраивать всю армию. Хасан признаёт, что договор даст семьям больше защиты, чем прежние обещания, однако молодые делегаты требуют добровольческой службы. Компромисс никого не устраивает полностью. Теперь совет должен решить, достаточно ли этого для общего дела — или выбрать иной порядок."
 A01_japan.21.t:0 "Компромисс под перекрёстным огнём"
 A01_japan.22.a:0 "Утвердить добровольческий мандат."
 A01_japan.22.d:0 "На столе лежит проект добровольческого мандата. Вирата предлагает местных командиров при едином оборонном плане. Касемброот спрашивает прямо: «Если штаб прикажет оставить вашу деревню ради защиты пролива, вы подчинитесь?» Хасан отвечает: «Если вы объясните, что спасаете остров, а не склад компании».\n\nФабиус предупреждает, что армия не может проводить собрание перед каждым манёвром. Делегаты соглашаются на общее командование в бою и единое снабжение. Взамен они требуют письменного ограничения срока службы: после завершения кризиса ополчение должно вернуться домой.\n\nСити просит прочитать эту строку вслух. Касемброот требует именно роспуска частей, опасаясь постоянной вооружённой силы вне старой армии. Вирата принимает условие, хотя часть молодых делегатов считает его уступкой. Договор готов; совет ещё может предпочесть обязательную службу с гарантиями или вернуться к принуждению."
 A01_japan.22.t:0 "Кто будет командовать добровольцами?"
 A01_japan.30.a:0 "Приказ вступает в силу."
 A01_japan.30.d:0 "Распоряжение о принудительном призыве доставляют в порты раньше утренней смены. Касемброот получает списки вернувшихся людей и говорит, что оборона больше не может ждать. У складов возобновляется погрузка; на перекличке снова слышны ответы.\n\nХасан возвращается к делегатам без подписанного договора. «Мы добились, чтобы нас выслушали. Мы не добились, чтобы нам поверили». Сити уносит долговые расписки: для этих семей заседание ничего не изменило. Фабиус предупреждает совет, что присутствие людей в строю ещё не означает верности.\n\nНекоторые считают жёсткость спасением перед вторжением, другие прячут сыновей и перестают разговаривать с администрацией. Недовольство уходит с площади в деревни. Совет получает возможность опереться на колониальную полицию, но вместе с ней — риск нового партизанского выступления. Спор окончен приказом; его причины остаются."
 A01_japan.30.t:0 "Служба под принуждением"
 A01_japan.31.a:0 "Теперь придётся отвечать за свою подпись."
 A01_japan.31.d:0 "Фабиус подписывает распоряжения о проверке жалованья и защите семей. Хасан ставит подпись под призывом вернуться к работе, но не под благодарностью правительству. «Мы будем судить по первой жалобе, которую вы решите против своего чиновника». Сити просит копию для деревенского собрания.\n\nКасемброот принимает договор ради восстановления службы, предупредив, что требования командования сохраняются. Вирата считает это началом иного разговора, хотя вопрос местных командиров остаётся открытым. Молодые забастовщики уходят недовольными: обязательный призыв не отменён.\n\nВ портах снова работают, а семьи получают обещанные гарантии. Постоянный совет султанов сможет стать путём для дальнейших жалоб, если правительство поддержит его создание. Этот порядок требует средств и ежедневного исполнения. Батавия купила не любовь, а возможность доказать, что её подпись чего-то стоит."
 A01_japan.31.t:0 "Гарантии Фабиуса утверждены"
 A01_japan.32.a:0 "Сформировать ополчение для защиты островов."
 A01_japan.32.d:0 "На плацу строятся добровольцы. Двенадцать дивизий ополчения получают оружие и место в общем оборонном плане. Вирата обращается к ним без торжественной речи: «За вами остаются дома. Ради них вы здесь». Хасан наблюдает за погрузкой вместе с людьми, которые недавно перекрывали ворота порта.\n\nКасемброот проверяет распоряжения о снабжении. Он по-прежнему опасается самостоятельных частей, но теперь отвечает и за их способность сражаться. Фабиус хранит подписанный мандат; Сити забирает копию с обещанием роспуска после войны.\n\nНе все общины прислали людей. Для одних добровольцы защищают архипелаг, для других помогают прежней администрации пережить кризис. Доверие выросло, но вопрос о власти над островами остался. Когда опасность минует, правительство должно будет выполнить обещание и отпустить тех, кого сегодня вооружает."
 A01_japan.32.t:0 "Островное добровольческое ополчение"
 A01_japan.4.a:0 "Ненависть вышла из подполья"
 A01_japan.4.d:0 "Тишина после введения военного положения оказалась обманчивой. В сельских районах Борнео появились вооружённые группы, которым помогают местные жители и японские агенты. Колониальная администрация теряет контроль над дорогами и плантациями."
 A01_japan.4.t:0 "Партизанское движение набирает силу"
 A01_japan.40.a:0 "Выполнить обещание добровольцам."
 A01_japan.40.d:0 "У причала складывают оружие и сверяют списки. Временный мандат закончился: добровольческие дивизии распущены. Сити встречает возвращающихся людей и ищет знакомые лица; некоторые места в строю навсегда останутся пустыми.\n\n«Армия могла бы пригодиться ещё», — замечает один из штабных офицеров. Фабиус закрывает папку: «Именно поэтому обещание надо выполнить сейчас». Касемброот получает отчёт о роспуске, а Вирата провожает последних добровольцев за ворота.\n\nХасан напоминает, что возвращение винтовок не означает возвращения к молчанию. Люди защищали острова и теперь хотят участвовать в решениях об их будущем. Сегодня Батавия сдержала слово о сроке службы. Ответа на вопрос, кому принадлежит право говорить от имени архипелага, в этом приказе нет."
 A01_japan.40.t:0 "Ополчение возвращается домой"
 A01_japan.5.a:0 "Встретим их на берегу"
 A01_japan.5.d:0 "Срок японского ультиматума истёк. Разведка сообщает о выходе транспортных соединений и боевых кораблей к берегам Борнео. Япония объявила войну Батавии, а главной целью наступления стали нефтяные месторождения и каучуковые плантации острова."
 A01_japan.5.t:0 "Японское наступление на Борнео"
 A01_japan.choose_balance:0 "Принять гарантии Фабиуса."
 A01_japan.choose_hard:0 "Вернуться к обязательному призыву без уступок."
 A01_japan.choose_support:0 "Доверить оборону добровольцам."
 A01_liberals:0 "Партия либералов"
 A01_ludolf_admirals_balance:0 "Власть в Батавии"
 A01_monarchy.0.a:0 "Она ещё ребёнок."
 A01_monarchy.0.b:0 "Она — наша надежда."
 A01_monarchy.0.d:0 "В дневнике юная Вильгельмина пишет, что не хочет быть декорацией. Она видит, как Совет и адмиралы разоряют страну, и хочет взять ответственность за её будущее. Поддержим ли мы корону в послевоенном споре?"
 A01_monarchy.0.t:0 "Дневник Вильгельмины"
 A01_monarchy.1.a:0 "Уступить матери."
 A01_monarchy.1.b:0 "Настоять на своём."
 A01_monarchy.1.d:0 "Эмма Вальдек-Пирмонтская вызывает дочь в кабинет. Мать говорит о долге, осторожности и стране, не готовой к правлению ребёнка. Дочь отвечает, что страна гибнет, пока решения откладывают. Разговор длится всю ночь. К утру обе выходят с красными глазами."
 A01_monarchy.1.t:0 "Разговор с матерью"
 A01_monarchy.3.a:0 "Пусть говорят."
 A01_monarchy.3.b:0 "Корона гарантирует соблюдение конституции."
 A01_monarchy.3.d:0 "Вильгельмина открывает первое заседание парламента Нидерландов и Индонезии. Голландские купцы, гражданские делегаты островов и представители султанских дворов спорят о бюджете и избирательном законе. Совет адмиралов больше не имеет права вето. Королева обещает назначить премьер-министра, способного получить доверие палаты."
 A01_monarchy.3.t:0 "Парламент при короне"
 A01_monarchy.4.a:0 "Одна корона, много народов."
 A01_monarchy.4.d:0 "Хартия содружества признаёт равные права жителей Нидерландов и Индонезии. Султанаты сохраняют местные законы и представительство; общие дела решаются парламентом при короне. Это союз под одной короной, основанный на договоре."
 A01_monarchy.4.t:0 "Содружество двух берегов"
 A01_monarchy.5.a:0 "Так надо."
 A01_monarchy.5.b:0 "Мы ещё вернёмся к парламенту."
 A01_monarchy.5.d:0 "После устранения Совета Вильгельмина закрепляет личную власть. Гвардия присягает короне, министры отвечают перед ней, а парламентский кабинет не создаётся. Островные хартии сохраняют силу: победа над адмиралами не отменяет договоров с султанатами."
 A01_monarchy.5.t:0 "Королевская диктатура"
 A01_monarchy.6.a:0 "Корона принимает ответственность."
 A01_monarchy.6.d:0 "Совет адмиралов утрачивает право вмешиваться в гражданские дела. Министры отвечают перед королевой, а армия остаётся на службе государства. Ответственность за каждое решение теперь лежит на короне."
 A01_monarchy.6.t:0 "Власть королевского указа"
 A01_monarchy.7.a:0 "Служить короне."
 A01_monarchy.7.d:0 "Верфи и мобилизационные управления переходят на военные приоритеты. Королевский флот становится опорой власти на островах. За это придётся платить: гражданское снабжение уступает место вооружению."
 A01_monarchy.7.t:0 "Корона и меч"
 A01_postwar.1.a:0 "Людольф получит мандат на реформы."
 A01_postwar.1.b:0 "Власть переходит Совету адмиралов."
 A01_postwar.1.c:0 "Передать власть короне: регентше Эмме от имени Вильгельмины."
 A01_postwar.1.d:0 "Поражение разрушило прежний порядок. Людольф предлагает гражданские реформы, Совет адмиралов требует передачи власти, а корона готова стать арбитром при равновесии сторон. Сегодня кабинет должен определить, кто поведёт страну дальше."
 A01_postwar.1.t:0 "В чьих руках власть Нидерландов?"
 A01_postwar.2.a:0 "Открыть регистрацию партий и избирателей."
 A01_postwar.2.d:0 "Учредительное собрание вводит президентскую должность и общее избирательное право. Партия либералов выступает за свободную торговлю, консерваторы — за постепенные перемены, Народная партия индонезийцев — за равное представительство островов. Каждая партия выставит кандидата на первых выборах."
 A01_postwar.2.t:0 "Президент вместо губернатора"
 A01_postwar.3.a:0 "Партия либералов — Людольф."
 A01_postwar.3.b:0 "Партия консерваторов — Хендрик ван дер Велде."
 A01_postwar.3.c:0 "Народная партия — Раден Сурья."
 A01_postwar.3.d:0 "Нидерландцы и индонезийцы впервые голосуют в общем государстве. Либералы предлагают продолжить реформы Людольфа, консерваторы защищают порядок и местное самоуправление, Народная партия выступает за социальные гарантии и равное представительство. Избирательная комиссия объявляет победителя:"
 A01_postwar.3.t:0 "Первые федеральные выборы"
 A01_postwar.4.a:0 "Потребовать извинений и сохранить равное представительство."
 A01_postwar.4.b:0 "Договориться о коалиции за закрытыми дверями."
 A01_postwar.4.c:0 "Уступить противникам индонезийских министров."
 A01_postwar.4.conservative_d:0 "При обсуждении министерских назначений депутат Партии консерваторов возмущается: «Индонезийцы в правительстве? Кто дал им право управлять нами?» Журналисты записывают реплику. Народная партия индонезийцев требует ответа президента: распространяется ли равное гражданство на министерские кресла?"
 A01_postwar.4.d:0 "На переговорах о министерских постах один из политиков не сдерживается: «Мы действительно собираемся допустить индонезийцев к управлению государством?» Реплику слышат журналисты. Индонезийская делегация требует публичного ответа президента: равное гражданство должно действовать и за дверями министерств."
 A01_postwar.4.liberal_d:0 "При обсуждении министерских назначений депутат Партии либералов возмущается: «Индонезийцы в правительстве? Кто дал им право управлять нами?» Журналисты записывают реплику. Народная партия индонезийцев требует ответа президента: распространяется ли равное гражданство на министерские кресла?"
 A01_postwar.4.t:0 "Скандал при формировании кабинета"
 A01_royal_story.1.a:0 "Гарантировать местное самоуправление."
 A01_royal_story.1.b:0 "Сначала общий бюджет и таможня."
 A01_royal_story.1.d:0 "За столом лежат разные проекты хартий. Султанские послы требуют местных налогов и неприкосновенности престолов. Министры предлагают общий бюджет обороны. Эмма замечает, что договор должен защищать не только дворцы, но и тех, кто платит налоги. Можно обещать широкое самоуправление или начать с общей таможни."
 A01_royal_story.1.t:0 "Четыре двора и одна корона"
 A01_royal_story.10.a:0 "Пусть избиратели решат."
 A01_royal_story.10.d:0 "Газеты печатают программы трёх блоков. Конституционный союз обещает открытый бюджет, Партия порядка — гарантии дворам и сильный флот, Индонезийская коалиция — школы и равные назначения."
 A01_royal_story.10.t:0 "Кампания без адмиральского вето"
 A01_royal_story.11.a:0 "Назначить кабинет и открыть сессию."
 A01_royal_story.11.d:0 "Премьер-министр — [Root.GetA01RoyalPremier]. Председатель палаты приносит результаты выборов. Королева утверждает назначение и требует соблюдения конституции. Следующая кампания начнётся через два года. При равной поддержке преимущество получает индонезийская коалиция, затем партия порядка — правило согласовано избирательной комиссией заранее."
 A01_royal_story.11.t:0 "Королева принимает премьер-министра"
 A01_royal_story.12.a:0 "Море должно соединять."
 A01_royal_story.12.d:0 "Новая доктрина ставит безопасность перевозок и развитие островов выше походов за престижем. Дворы получают рынки, граждане — рабочие места. Военные предупреждают, что этот выбор уменьшит общественную готовность к войне."
 A01_royal_story.12.t:0 "Корона на торговых путях"
 A01_royal_story.13.a:0 "Сохранить родину и построить будущее."
 A01_royal_story.13.d:0 "Беженцы открывают архив и училище потерянной метрополии. В правительстве подчёркивают: память не даёт права отнять будущее у индонезийцев. Флот возвращения будет строиться за счёт открытого бюджета, без обещаний лёгкой победы."
 A01_royal_story.13.t:0 "Родина на картах школьных классов"
 A01_royal_story.14.a:0 "Наше будущее здесь."
 A01_royal_story.14.d:0 "Морские карты теперь начинаются с Явы. Дворы, гражданские делегаты и военное министерство подписывают общий план обороны. Новая держава зависит от сотрудничества народов архипелага, а не только от голландского имени."
 A01_royal_story.14.t:0 "Государство, обращённое к Тихому океану"
 A01_royal_story.15.a:0 "Продлить следствие за счёт двора."
 A01_royal_story.15.b:0 "Выступить перед страной."
 A01_royal_story.15.d:0 "Срок следствия истёк, но Совет ещё держит ведомство. Парламентские юристы требуют новой сессии. Продление расследования потребует уступок со стороны двора, а капитаны станут осторожнее в своих показаниях."
 A01_royal_story.15.t:0 "Совет выигрывает время"
 A01_royal_story.2.a:0 "Гражданские делегаты получат места."
 A01_royal_story.2.b:0 "Сначала договоримся с дворами."
 A01_royal_story.2.d:0 "На ступенях дворца учитель читает петицию на малайском, затем переводит её на голландский. Подписанты не просят новых князей: они хотят суд, школу и право стать офицером. Султанские делегаты опасаются, что гражданская палата вытеснит их дворы. Короне предстоит признать обе стороны или отложить решение."
 A01_royal_story.2.t:0 "Кто представляет Индонезию?"
 A01_royal_story.3.a:0 "Автономные султанаты под общей короной."
 A01_royal_story.3.b:0 "Единая страна, гарантированные хартии."
 A01_royal_story.3.d:0 "На столе два приложения. Первое учреждает автономные султанаты с собственной администрацией и общей обороной под короной. Второе сохраняет единую страну, но закрепляет местное право, гражданское представительство и налоговые гарантии. Передавать можно только земли, которыми мы владеем. Японские права на Борнео сохраняются."
 A01_royal_story.3.t:0 "Подписи под островным договором"
 A01_royal_story.4.a:0 "Открыть слушания."
 A01_royal_story.4.b:0 "Сначала защитить свидетелей."
 A01_royal_story.4.d:0 "Секретарь морского ведомства приносит копии контрактов и приказ о сожжении оригиналов. Адмиралы называют документы подделкой. Публичное слушание убедит гражданских делегатов; тайная проверка поможет защитить свидетелей. Обоим путям нужны дополнительные доказательства."
 A01_royal_story.4.t:0 "Архив, который приказали сжечь"
 A01_royal_story.5.a:0 "Наказывать только доказанные преступления."
 A01_royal_story.5.b:0 "Проверить весь высший штаб."
 A01_royal_story.5.d:0 "Суд установил ответственность руководителей Совета за сокрытие контрактов и вмешательство в гражданское управление. Капитаны ждут решения о рядовых офицерах. Ограниченные приговоры сохранят опыт; расширенное следствие усилит корону, но потребует ещё одной перестройки штаба."
 A01_royal_story.5.t:0 "Приговор не должен стать местью"
 A01_royal_story.6.a:0 "Ограничить чистку руководителями заговора."
 A01_royal_story.6.b:0 "Продолжить проверку лояльности."
 A01_royal_story.6.d:0 "Гвардия опечатала адмиралтейства. Арестованные руководители лишены политических должностей, но под подозрение попали десятки капитанов. Одни требуют немедленного суда, другие — бесконечной проверки лояльности. Флоту уже не хватает штабистов."
 A01_royal_story.6.t:0 "Утро без Совета"
 A01_royal_story.7.a:0 "Победа закона: подготовить конституцию."
 A01_royal_story.7.b:0 "Победа короны: министры служат королеве."
 A01_royal_story.7.d:0 "Адмиральское политическое вето отменено. Но гвардия, гражданские делегаты и султанские дворы по-разному понимают новый порядок. Королева может закрепить разграничение полномочий или опереться на личную присягу. Это решение задаст условия конституционного либо абсолютного пути."
 A01_royal_story.7.t:0 "Кому принадлежит победа?"
 A01_royal_story.8.a:0 "Новый Амстердам — столица короны."
 A01_royal_story.8.b:0 "Батавия — имя нашего общего города."
 A01_royal_story.8.c:0 "Новый Амстердам — Батавия."
 A01_royal_story.8.d:0 "Новый правительственный квартал открыт. Придворные предлагают Новый Амстердам — память о потерянной родине. Городской совет напоминает о торговцах, кварталах и языках, для которых Батавия давно стала домом. Корона может выбрать новое имя, сохранить старое или признать оба."
 A01_royal_story.8.t:0 "Как зовётся столица?"
 A01_royal_story.9.a:0 "Территориальные гарантии и гражданская палата."
 A01_royal_story.9.b:0 "Равное гражданское представительство."
 A01_royal_story.9.d:0 "Княжеские делегаты требуют территориальных гарантий, иначе малые острова потеряются за населением Явы. Гражданская коалиция требует равного голоса. Конституционный союз предлагает компромисс. Выбранный закон изменит начальную поддержку партий; агитация сможет изменить результат."
 A01_royal_story.9.t:0 "Острова считают голоса"
 A01_town_hall.1.a:0 "Хунта повержена. Порядок восстановлен."
 A01_town_hall.1.d:0 "Радикальные адмиралы забаррикадировались в ратуше Батавии, угрожая военным переворотом. Но план Людольфа сработал: умеренная часть флота отказалась стрелять в гражданских. После артиллерийского окружения и штурма верными батальонами мятежные адмиралы сдались и отправлены под арест. Власть хунты сломлена."
 A01_town_hall.1.t:0 "Кризис в Адмиралтейской ратуше"
 A01_town_hall.2.a:0 "Забвение прошлых раздоров ради общего будущего."
 A01_town_hall.2.d:0 "Чтобы не порождать мучеников и не озлоблять флот, правительство провозглашает широкую амнистию для офицеров и моряков. Лидеры мятежа изолированы, но остальной корпус сохраняет свои звания и присягает на верность новому порядку. Страна вздыхает с облегчением."
 A01_town_hall.2.t:0 "Всеобщая амнистия"
 A01_town_hall.3.a:0 "Мастерский политический манёвр."
 A01_town_hall.3.d:0 "«Серый кардинал» завершил свою партию. Людольф добровольно слагает полномочия главы правительства, уйдя от любой судебной ответственности за прежние неудачи, и занимает пост Главнокомандующего Королевским ВМФ. Дорога к демократической федерации или регентству королевы-матери Эммы открыта."
 A01_town_hall.3.t:0 "Людольф принимает пост командующего ВМФ"
 A03_imperial.1.a:0 "Создать институт Премьер-министра как громоотвод для престола."
 A03_imperial.1.b:0 "Император должен править лично и безраздельно."
 A03_imperial.1.d:0 "В залах дворца кипит спор о будущем государственного устройства. Одни советники настаивают на институте Премьер-министра: правительство должно стать институциональным «громоотводом». В случае военных неудач или народных бедствий премьера можно уволить, а кабинет разогнать, сохранив сакральный статус Императора неприкосновенным. Другие требуют прямого единоличного правления Мэйдзи без бюрократических ширм."
 A03_imperial.1.t:0 "Спор о власти Мэйдзи"
 A03_imperial.2.a:0 "Трон защищён навсегда."
 A03_imperial.2.d:0 "Указ скреплён печатью. Назначен Премьер-министр, возглавивший кабинет министров. Отныне правительство отвечает перед нацией за каждый шаг, а Император возвышается над сиюминутной политикой. Если разразится буря — молния ударит в Премьера, а не в престол."
 A03_imperial.2.t:0 "Премьер-министр как политический громоотвод"
 A03_imperial.3.a:0 "Красивый фасад для мира, железный кулак для колоний."
 A03_imperial.3.d:0 "Военный совет утвердил принципы управления новыми территориями. На границах возводятся «витрины процветания», а газеты прославляют Японию как защитника азиатских братьев от европейских колонизаторов. Но в глубине островов Кэмпэйтай устанавливает свирепый порядок, а сырьевые монополии выкачивают нефть и каучук до последней капли."
 A03_imperial.3.t:0 "Двуликий колониальный фасад"
 A10_philippines.1.a:0 "Это наш шанс!"
 A10_philippines.1.b:0 "Не стоит рисковать"
 A10_philippines.1.d:0 "Уже неделю Япония ведёт войну с Нидерландами. Её войска и флот отвлечены борьбой за Борнео, а японские гарнизоны на Лусоне могут остаться без своевременной поддержки. Совет островов обсуждает, стоит ли немедленно вступить в войну ради возвращения наших земель."
 A10_philippines.1.t:0 "Япония на Борнео"
 A10_settlement.1.d:0 "Наши гарнизоны вытеснены с Филиппинского архипелага. Правительство островов предлагает прекратить войну и признать передачу освобождённых японских владений тем, кто их удерживает. Это предложение касается только филиппинского фронта."
 A10_settlement.1.t:0 "Филиппинское мирное предложение"
 A10_settlement.2.d:0 "Филиппинцы удерживают Манилу и предлагают мир в обмен на признание её освобождения. Северный Лусон, Батаан и прочие владения останутся за Японией."
 A10_settlement.2.t:0 "Предложение Манильского компромисса"
 A10_settlement.3.a:0 "Острова отстояли свободу"
 A10_settlement.3.d:0 "Япония признала освобождение своих филиппинских владений. Мир подписан, а участники Конфедерации сохраняют освобождённые ими области."
 A10_settlement.3.t:0 "Архипелаг свободен"
 A10_settlement.4.a:0 "Сохранить достигнутое"
 A10_settlement.4.d:0 "Манила признана свободной, и война окончена. Северный Лусон и Батаан остаются за Японией — тяжёлая цена за сегодняшний мир."
 A10_settlement.4.t:0 "Манильский компромисс"
 A10_settlement.5.a:0 "Продолжить борьбу"
 A10_settlement.5.d:0 "Токио отказалось подписать договор. Война продолжается. Новое предложение можно направить после окончания дипломатической паузы."
 A10_settlement.5.t:0 "Япония отклонила условия"
 A10_settlement.6.d:0 "Филиппинские войска заняли наши владения на архипелаге. Командование предлагает признать потерю удерживаемых противником территорий и прекратить эту войну. Промедление лишь усилит недовольство дома: у правительства осталось три месяца, чтобы избежать политического кризиса."
 A10_settlement.6.t:0 "Переговоры о Филиппинах"
 A10_settlement.7.a:0 "Не стоит проливать за это кровь"
 A10_settlement.7.b:0 "Лусон будет нашим — любой ценой!"
 A10_settlement.7.d:0 "Три месяца правительство обещало вернуть утраченные позиции. Но филиппинские войска по-прежнему удерживают наши территории, а семьи погибших требуют ответа. Газеты называют кампанию бессмысленной бойней. Мы можем признать поражение и заключить мир, либо продолжить войну вопреки растущему возмущению общества."
 A10_settlement.7.t:0 "Крах на Лусоне"
 A10_settlement.8.d:0 "Японское правительство предлагает прекратить войну и признать освобождение удерживаемых нами территорий. Если освобождена лишь Манила, Северный Лусон и Батаан останутся под японским управлением. При полном освобождении архипелага Япония признает потерю всех своих островных владений, занятых нами и нашими союзными республиками."
 A10_settlement.8.t:0 "Япония предлагает мир"
 A10_settlement.accept:0 "Принять условия"
 A10_settlement.delay:0 "Мы ещё можем переломить ход войны"
 A10_settlement.propose:0 "Предложить мир Филиппинам"
 A10_settlement.reject:0 "Продолжить войну"
 JSM_accept:0 "Принять условия"
 JSM_offer_title:0 "Предложение японского протектората"
 JSM_refuse:0 "Отстоять независимость"
 a01_peace_request.1.a:0 "Ждать ответа."
 a01_peace_request.1.d:0 "Батавия предлагает прекратить войну на условиях Борнейской конвенции. Теперь решение за японским правительством."
 a01_peace_request.1.t:0 "Обращение в Токио"
 a01_peace_request.2.accept:0 "Принять предложение."
 a01_peace_request.2.d:0 "Голландская администрация готова принять Борнейскую конвенцию. Мы можем завершить кампанию либо продолжить войну."
 a01_peace_request.2.reject:0 "Продолжить кампанию."
 a01_peace_request.2.t:0 "Батавия просит мира"
 a01_peace_request.3.a:0 "Начать восстановление."
 a01_peace_request.3.d:0 "Япония приняла предложение. Сабах, Бруней, Лимбанг и Саравак переходят Японии; война заканчивается на условиях конвенции."
 a01_peace_request.3.t:0 "Досрочная Борнейская конвенция"
 a01_peace_request.4.a:0 "Готовиться к дальнейшей борьбе."
 a01_peace_request.4.d:0 "Японское правительство отвергло мирный запрос. Кампания продолжается."
 a01_peace_request.4.t:0 "Токио отвергает предложение"
 borneo_project.1.a:0 "Британские инженеры и бетон."
 borneo_project.1.b:0 "Австралийские материалы и специалисты."
 borneo_project.1.c:0 "Довериться местным общинам."
 borneo_project.1.d:0 "Инспекция выявила слабость береговых позиций. Британия предлагает бетон и инженеров; Австралия — материалы и специалистов в обмен на гарантии по Новой Гвинее. Индонезийские общины готовы строить земляные валы, препятствия и скрытые тропы. Каждый проект имеет свою цену."
 borneo_project.1.t:0 "Три проекта обороны Борнео"
 expansion.1.a:0 "Острова остаются за нами."
 expansion.1.d:0 "Срок японской кампании истёк. На Борнео не осталось ни одного японского плацдарма, и Токио вынужден прекратить наступление. Мир сохраняет наши владения. Успешная оборона укрепила гражданский кабинет Людольфа и его отношения с морским ведомством."
 expansion.1.t:0 "Борнео удержан — экспансия остановлена"
 expansion.10.a:0 "Восстановить нашу администрацию."
 expansion.10.d:0 "Временная японская администрация завершила работу. Бруней возвращён под управление Батавии в соответствии с условиями аренды."
 expansion.10.t:0 "Срок аренды Брунея истёк"
 expansion.11.a:0 "Соблюдать временное соглашение."
 expansion.11.d:0 "Дата кризиса остаётся прежней. Во время войны возврат откладывается; Борнейская конвенция может закрепить владение окончательно."
 expansion.11.t:0 "Полугодовая аренда Брунея"
 expansion.2.a:0 "Признать неудачу экспедиции."
 expansion.2.d:0 "Отведённый срок истёк, но на Борнео не осталось ни одной провинции под нашим контролем. Экспансия признана провалившейся. Япония прекращает войну без территориальных приобретений; кабинет сталкивается с падением общественной поддержки."
 expansion.2.t:0 "Провал Борнейской экспедиции"
 expansion.3.a:0 "Приступить к восстановлению."
 expansion.3.d:0 "К окончанию кампании Япония сохранила плацдарм на Борнео. Батавия вынуждена принять Борнейскую конвенцию. Война завершена; передача северных районов и ресурсные уступки ослабили положение губернатора."
 expansion.3.t:0 "Японский плацдарм на Борнео"
 japan_agency.1.a:0 "Кабинет отвечает за свой выбор."
 japan_agency.1.d:0 "Флот просит денег, но гарантий будущей нефти ещё нет. Пока кабинет не завершит переговоры, Мицубиси продолжит перекладывать на него текущие расходы. Если отложить договор до отправки ультиматума, кредит придётся принять на навязанных условиях."
 japan_agency.1.t:0 "Ивасаки больше не ждёт"
 japan_agency.2.a:0 "Кабинет отвечает за свой выбор."
 japan_agency.2.d:0 "Сайго не станет воевать за Борнео. Вопрос в том, будет ли его нейтралитет согласованным договором или односторонним решением. Кабинету предстоит согласовать поставки и убедить адмиралтейство, что спокойный Север стоит отвлечённых грузов."
 japan_agency.2.t:0 "Север требует письменного ответа"
 japan_agency.3.a:0 "Кабинет отвечает за свой выбор."
 japan_agency.3.d:0 "Ультиматум отправлен. Подготовленные договорённости вступают в силу. Там, где переговоры остались незавершёнными, кабинет вынужден уступать Мицубиси, мириться с недоверием Севера и исправлять спешные приказы флоту. Возвращаться к этим вопросам теперь придётся во время войны."
 japan_agency.3.t:0 "Настало время предъявить счета"
 japan_canon.1.d:0 "Мэйдзи назначил Ито премьер-министром. Ивасаки требует гарантий по долгам Мицубиси перед банками и торговыми домами Осаки. Сайго распоряжается Севером и скрывает подготовку арктической экспедиции. Ито требует снабдить Манилу и готовить рывок к Борнео. Премьер получил печать кабинета, но две другие головы дракона не склонились перед ним."
 japan_canon.1.o0:0 "Удержать их за одним столом."
 japan_canon.1.t:0 "Совет трёх голов"
 japan_canon.2.d:0 "Мицубиси больше не кредитует флот без обеспечения. Ивасаки требует государственную гарантию исключительных прав на нефть северного Борнео после победы. Император ставит печать. Миролюбие Осаки уступает надежде спасти компанию войной."
 japan_canon.2.o0:0 "Государство отвечает по этим обязательствам."
 japan_canon.2.t:0 "Финансовый ультиматум"
 japan_canon.20.d:0 "Токио просит кредит на перевозки. ВТП может снабжать японцев, не признавая их территориальных притязаний. Доход обеспечат платежи после войны."
 japan_canon.20.o0:0 "Открыть обеспеченную линию."
 japan_canon.20.o1:0 "Риск слишком велик."
 japan_canon.20.t:0 "Японские векселя"
 japan_canon.21.d:0 "Япония просит коммерческое обслуживание в Гонолулу. Согласие принесёт доход, но нейтральное королевство не обязано предоставлять военные базы или вступать в войну."
 japan_canon.21.o0:0 "Только торговые услуги."
 japan_canon.21.o1:0 "Нейтралитет важнее прибыли."
 japan_canon.21.t:0 "Уголь для японских пароходов"
 japan_canon.22.d:0 "Япония заверяет Сидней, что её требования ограничены войной с Батавией. Австралия может принять заверения или усилить береговую оборону. Британская Новая Зеландия остаётся отдельным центром силы."
 japan_canon.22.o0:0 "Примем к сведению, оставаясь в стороне."
 japan_canon.22.o1:0 "Укрепить подступы к Австралии."
 japan_canon.22.t:0 "Письмо из Токио"
 japan_canon.23.d:0 "Японская война угрожает британским морским путям. Новозеландские базы могут стать опорой давления. Фишер предлагает потребовать гарантий свободного судоходства; отказ Токио даст повод к агрессии, но решение о войне останется за Адмиралтейством."
 japan_canon.23.o0:0 "Предъявить требование о судоходстве."
 japan_canon.23.o1:0 "Наблюдать с новозеландских баз."
 japan_canon.23.t:0 "Левиафан смотрит на восток"
 japan_canon.24.d:0 "Конвои оплачены. Взамен казна принимает обслуживание обеспеченного кредита ВТП. После войны долг можно погасить отдельным решением."
 japan_canon.24.o0:0 "Записать обязательства."
 japan_canon.24.t:0 "Палата открывает кредит"
 japan_canon.25.d:0 "Наше предложение не получило поддержки. Торговые партнёры не обязаны оплачивать японскую войну или принимать японские заверения на веру."
 japan_canon.25.o0:0 "Придётся обходиться своими силами."
 japan_canon.25.t:0 "Осторожный ответ"
 japan_canon.26.d:0 "Получен ограниченный положительный ответ. Договор не меняет границы и не превращает нейтральную страну в участника нашей войны."
 japan_canon.26.o0:0 "Соблюдать пределы договорённости."
 japan_canon.26.t:0 "Договор без союза"
 japan_canon.27.d:0 "Левиафан требует гарантий свободного судоходства. За словами стоят Сингапур и британские базы Новой Зеландии. Уступка ограничит действия флота; отказ может открыть третий фронт."
 japan_canon.27.o0:0 "Принять инспекции торговых рейсов."
 japan_canon.27.o1:0 "Ито не принимает приказов с Бермуд."
 japan_canon.27.t:0 "Британская нота"
 japan_canon.28.d:0 "Япония отвергла требования. Адмиралтейство может начать войну, опираясь на новозеландские базы, или ограничиться демонстрацией силы. Борнейский мир не прекратит отдельную британскую войну автоматически."
 japan_canon.28.o0:0 "Отдать боевой приказ."
 japan_canon.28.o1:0 "Не тратить флот на чужую войну."
 japan_canon.28.t:0 "Токио отвергает ноту"
 japan_canon.3.d:0 "Сайго требует признать нейтралитет Хоккайдо. Поставки с Хонсю продолжатся, но Северная Армия не даст ни одного полка для Борнео. Ито возмущён. Мэйдзи принимает условия: войны с Голландией достаточно, гражданской войны страна не вынесет."
 japan_canon.3.o0:0 "Пусть север молчит."
 japan_canon.3.t:0 "Север не пойдёт на юг"
 japan_canon.30.d:0 "Северный Борнео закреплён договором. Но филиппинская война не закончилась, Мицубиси требует монополию, ВТП — платежи, Сайго — свободу действий. Победа спасла кабинет, а не разрешила раскол."
 japan_canon.30.o0:0 "Теперь предъявят обещания."
 japan_canon.30.t:0 "Борнео получен. Счета остались."
 japan_canon.31.d:0 "Совет собирается без прежнего общего врага. Ито считает корабли, Ивасаки — долги, Сайго — упущенные месяцы. Мэйдзи снова должен удержать их за одним столом. Первая глава закончилась; противоречия пережили войну."
 japan_canon.31.o0:0 "Империя ещё держится."
 japan_canon.31.t:0 "Снова три головы"
 japan_canon.32.d:0 "Токио обещает Мицубиси нефтяную монополию на севере Борнео после победы. Ивасаки меняет позицию: спасение компании теперь зависит от успеха южной экспедиции. Осака сохраняет собственное управление, но возобновляет снабжение флота."
 japan_canon.32.o0:0 "Принять государственное обеспечение."
 japan_canon.32.t:0 "Гарантия за императорской печатью"
 japan_canon.33.d:0 "Мэйдзи подтвердил: Хоккайдо не участвует в голландской войне. Поставки с Хонсю продолжатся. Сайго получает время для своих ритуалов и планов возвращения на континент; Токио получает передышку от угрозы внутренней войны."
 japan_canon.33.o0:0 "Север будет ждать."
 japan_canon.33.t:0 "Токио признаёт нейтралитет севера"
 japan_canon.4.d:0 "Конфедерация переходит к ударам по японским гарнизонам. Манила взята, но Лусон не покорён. Ито вынужден оставить часть флота у Филиппин: будущая борнейская экспедиция уже недосчитывается кораблей."
 japan_canon.4.o0:0 "Манилу нельзя оставить."
 japan_canon.4.t:0 "Апрельский удар"
 japan_canon.5.d:0 "Япония требует северный Борнео, доступа к портам и компенсаций. За требованиями Ито стоят гарантии Мицубиси и обещания императора. Передача нефти не остановит кризис — только перенесёт его в Батавию. Кабинет отвергает ультиматум."
 japan_canon.5.o0:0 "Борнео не продаётся."
 japan_canon.5.t:0 "Японский ультиматум"
 japan_canon.6.d:0 "Батавия отказала. Флот получает приказ идти на юг, Осака — новые заказы, Хоккайдо — обещанную тишину. Единой Японии по-прежнему нет. Есть три стороны, которым пока выгоден один приказ."
 japan_canon.6.o0:0 "Теперь нам нужна победа."
 japan_canon.6.t:0 "Война вместо единства"
 japan_canon.7.d:0 "Счета за уголь приходят быстрее, чем сводки об успехах. Госпитальные суда возвращаются полными. Военный кабинет признаёт: обещанная экспедиция превратилась в войну на истощение."
 japan_canon.7.o0:0 "Пересчитать смету."
 japan_canon.7.t:0 "Короткая война окончена. Долгая начинается."
 japan_canon.8.d:0 "Весной 1895 года филиппинское сопротивление усиливается. Конфедерация получает новые поставки и готовит наступление. Японский кабинет не может снять гарнизоны, даже если Борнео потребует последних резервов."
 japan_canon.8.o0:0 "Снова делить резервы."
 japan_canon.8.t:0 "Манила снова в сводках"
 japan_canon.9.d:0 "Кредиторы не получают прибыли от бесконечной войны. В феврале 1896 года Палата сведёт стороны за столом переговоров. Япония должна удержать борнейский плацдарм; его отсутствие обернёт нефтяные гарантии пустой бумагой."
 japan_canon.9.o0:0 "Продержаться до февраля."
 japan_canon.9.t:0 "ВТП предлагает конференцию"
 japan_dragon.1.a:0 "Собрать обломки долговой книги."
 japan_dragon.1.d:0 "Банки и торговые дома Осаки отказались продлевать обязательства. Гарантии или реформа не были проведены вовремя. Конгломерат замораживает поставки; общий военный бюджет придётся отложить. После реформы займов доступна чрезвычайная реструктуризация."
 japan_dragon.1.t:0 "Мицубиси не платит по векселям"
 japan_dragon.2.a:0 "Отозвать экспедицию и принять издержки."
 japan_dragon.2.b:0 "Не уступать: экспедиция под нашей защитой."
 japan_dragon.2.d:0 "Тайная экспедиция Сайго достигла Гренландии. Датские представители требуют её отзыва, британские дипломаты обсуждают силовое вмешательство, а российские наблюдатели подозревают подготовку новой арктической базы. Северный компромисс не дал Ито контроля над этой затеей. Защитив экспедицию, кабинет рискует получить ещё одну войну."
 japan_dragon.2.t:0 "Люди Сайго в Гренландии"
 japan_dragon.3.a:0 "Пусть возвращаются."
 japan_dragon.3.d:0 "Льды и нехватка припасов сорвали переход к Гренландии. Экспедиция возвращается. Кризис с европейскими державами удалось избежать, но северные сторонники Сайго винят Токио."
 japan_dragon.3.t:0 "Арктика остановила Сайго"
 japan_dragon.4.a:0 "Передать дипломатический протест."
 japan_dragon.4.d:0 "Японские северяне высадились в Гренландии. Дания требует защиты своих прав, Британия — гарантий морской безопасности, Россия — объяснений об арктических намерениях. Токио должен решить, отзывать ли экспедицию или брать её под защиту."
 japan_dragon.4.t:0 "Протест из-за экспедиции Сайго"
 japan_dragon.5.a:0 "Усилить дипломатическое давление."
 japan_dragon.5.b:0 "Объявить войну Японии."
 japan_dragon.5.d:0 "Ито отказался отозвать людей Сайго. Мы можем усилить дипломатическое давление или объявить войну Японии. Последний вариант свяжет арктический кризис с борьбой за Борнео и способен превратить региональный конфликт в мировую цепочку войн."
 japan_dragon.5.t:0 "Токио защищает гренландскую экспедицию"
 japan_finance.1.audit:0 "Заплатить за проверку."
 japan_finance.1.d:0 "В Осаке предлагают записать филиппинские расходы как государственные, а доходы — как частные. Ивасаки напоминает, что без его аванса верфи остановятся. Император может оплатить проверку или согласиться на закрытые книги."
 japan_finance.1.seal:0 "Пока примем их расчёты."
 japan_finance.1.t:0 "Кому принадлежат счета?"
 japan_finance.2.advance:0 "Взять аванс без огласки."
 japan_finance.2.d:0 "Гарантии Мицубиси уже обещаны. Осталось решить, кто увидит условия: парламентский реестр укрепит доверие, а закрытый аванс немедленно даст флоту транспорты. Ни один выбор не отменяет монополию после победы."
 japan_finance.2.public:0 "Внести гарантии в открытый реестр."
 japan_finance.2.t:0 "Подпись под будущей нефтью"
 japan_finance.3.d:0 "Верфи требуют расчёта за военный заказ. Платёж обеспечит новые транспорты, увеличив долг. Отсрочка сбережёт казначейство, но рабочие не выйдут на смену под одни обещания."
 japan_finance.3.defer:0 "Отложить расчёт."
 japan_finance.3.pay:0 "Оплатить счёт сейчас."
 japan_finance.3.t:0 "Адмиралтейство предъявляет счёт"
 japan_finance.4.advance:0 "Принять новый аванс Осаки."
 japan_finance.4.d:0 "Казначейство платёжеспособно на бумаге. Сегодня оно не может покрыть жалованье, уголь и пособия одновременно. Ивасаки предлагает ещё один аванс; адмиралы требуют оставить деньги флоту."
 japan_finance.4.fleet:0 "Флот получит деньги; семьи подождут."
 japan_finance.4.freeze:0 "Заморозить заказы и признать разрыв."
 japan_finance.4.t:0 "Денег не хватает до понедельника"
 japan_finance.5.credit:0 "Подписать кредитный договор."
 japan_finance.5.d:0 "Палата готова предоставить транспорты под будущие платежи и страховой договор. Казна получит суда, но примет обязательства перед внешними кредиторами в дополнение к счетам Мицубиси. Отказ заставит кабинет немедленно сократить гражданские заказы."
 japan_finance.5.domestic:0 "Сократить внутренние расходы."
 japan_finance.5.t:0 "Мостовой кредит Мадейры"
 japan_finance.6.creditors:0 "Сначала погасить крупные обязательства."
 japan_finance.6.d:0 "Борнейские роялти наконец поступили в Осаку. Кредиторы требуют первого платежа. Семьи моряков спрашивают, почему победа снова отодвигает их пособия."
 japan_finance.6.families:0 "Вернуть долг семьям."
 japan_finance.6.t:0 "Нефть есть, свободных денег нет"
 japan_industry.1.a:0 "Эскадра готова."
 japan_industry.1.copied_samples_airship_hangars:0 "Палата знает списки материалов, но происхождение скопированных узлов мы не признаём. Медленная работа не исключила провала слабой агентурной сети.Алые дирижабли идут над берегом; их скорость оплачена отказом от тяжёлого подкрепления. Транспорты несут переносные испытанные электрические станции для первого плацдарма."
 japan_industry.1.copied_samples_kure_yards:0 "Палата знает списки материалов, но происхождение скопированных узлов мы не признаём. Медленная работа не исключила провала слабой агентурной сети. Тяжёлые алые корабли Курэ разворачивают «щупальца». Транспорты несут переносные испытанные электрические станции для первого плацдарма."
 japan_industry.1.kyushu_coal_airship_hangars:0 "Опора на собственные силы дали грубую, но самостоятельную промышленность. Уголь бассейнов Кюсю наполнил бункеры.Алые дирижабли идут над берегом; их скорость оплачена отказом от тяжёлого подкрепления. Транспорты несут переносные испытанные электрические станции для первого плацдарма."
 japan_industry.1.kyushu_coal_kure_yards:0 "Опора на собственные силы дали грубую, но самостоятельную промышленность. Уголь бассейнов Кюсю наполнил бункеры. Тяжёлые алые корабли Курэ разворачивают «щупальца». Транспорты несут переносные испытанные электрические станции для первого плацдарма."
 japan_industry.1.oil_hunger_airship_hangars:0 "Опора на собственные силы дали собственные мастерские. Паровой флот ещё держится на угле, но будущая нефтяная программа требует месторождений Борнео.Алые дирижабли идут над берегом; их скорость оплачена отказом от тяжёлого подкрепления. Транспорты несут переносные испытанные электрические станции для первого плацдарма."
 japan_industry.1.oil_hunger_kure_yards:0 "Опора на собственные силы дали собственные мастерские. Паровой флот ещё держится на угле, но будущая нефтяная программа требует месторождений Борнео. Тяжёлые алые корабли Курэ разворачивают «щупальца». Транспорты несут переносные испытанные электрические станции для первого плацдарма."
 japan_industry.1.proxy_machines_airship_hangars:0 "Палата видит наши закупки. Подставные дома быстро доставили чужие станки; их следы могут выдать приготовления.Алые дирижабли идут над берегом; их скорость оплачена отказом от тяжёлого подкрепления. Транспорты несут переносные испытанные электрические станции для первого плацдарма."
 japan_industry.1.proxy_machines_kure_yards:0 "Палата видит наши закупки. Подставные дома быстро доставили чужие станки; их следы могут выдать приготовления. Тяжёлые алые корабли Курэ разворачивают «щупальца». Транспорты несут переносные испытанные электрические станции для первого плацдарма."
 japan_industry.1.t:0 "Алые паруса"
 japan_luzon.1.a:0 "Оплатить дополнительное довольствие."
 japan_luzon.1.b:0 "Сократить периметр."
 japan_luzon.1.d:0 "Порт взят, дороги за ним — нет. Гарнизон требует дополнительных грузов. Ито может оплатить рейс через казначейство или приказать держать меньший периметр теми же людьми."
 japan_luzon.1.t:0 "Манила просит ещё один рейс"
 japan_luzon.2.a:0 "Выделить охранение с Борнео."
 japan_luzon.2.b:0 "Пусть Манила обойдётся меньшим."
 japan_luzon.2.d:0 "Не каждый пропавший транспорт потоплен Конфедерацией. В накладных встречаются одинаковые номера, а страховые агенты требуют сопровождения. Отдать Маниле охранение или оставить гарнизон с урезанным пайком?"
 japan_luzon.2.t:0 "Страховой случай в проливе"
 japan_luzon.3.a:0 "Оплатить госпитальную эвакуацию."
 japan_luzon.3.b:0 "Газеты должны писать о стойкости."
 japan_luzon.3.d:0 "В списках больных больше лихорадки, чем ранений. Новый госпиталь потребует денег; приказ терпеть поднимет боевой пыл газет, но не вернёт людей в строй."
 japan_luzon.3.t:0 "Лазарет переполнен"
 japan_luzon.4.a:0 "Открыть дело против поставщиков."
 japan_luzon.4.b:0 "Не трогать договоры во время войны."
 japan_luzon.4.d:0 "Казначейство оплачивает довольствие части, которой нет ни в порту, ни в горах. След ведёт к уважаемым поставщикам. Следствие уменьшит потери, но разорвёт знакомые цепочки закупок."
 japan_luzon.4.t:0 "Батальон, которого не было"
 japan_luzon.5.a:0 "Вернуть часть охранения к Маниле."
 japan_luzon.5.b:0 "Пусть победа оправдает новые усилия."
 japan_luzon.5.d:0 "Победные салюты в Токио слышны лучше, чем просьбы гарнизона. Освободившиеся эскорты можно вернуть к Лусону. Ивасаки напоминает: ещё один рейс будет занесён в книгу расходов."
 japan_luzon.5.t:0 "Борнейский мир, манильская война"
 japan_luzon.6.a:0 "Оплатить эвакуацию и перегруппировку."
 japan_luzon.6.b:0 "Приказать удерживать оставшиеся позиции."
 japan_luzon.6.d:0 "Сообщение гарнизона пришло по обходному маршруту. Потеря пристани сделала прежние планы бессмысленными. Эвакуация больных стоит денег; требование держаться увеличит усталость оставшихся."
 japan_luzon.6.t:0 "Манильская пристань потеряна"
 japan_north.1.a:0 "Погрузить положенные ящики."
 japan_north.1.b:0 "Запросить письменную отсрочку."
 japan_north.1.c:0 "Сначала отправить комиссию."
 japan_north.1.d:0 "Сайго не просит места в штабе Ито. Он просит выполнить накладную. Отправить винтовки, согласовать отсрочку или послать комиссию — каждое решение будет прочитано и на Хоккайдо, и в адмиралтействе."
 japan_north.1.e:0 "Флоту нужнее. Рейса не будет."
 japan_north.1.t:0 "Телеграмма о следующем рейсе"
 japan_north.2.a:0 "Проверять грузы, не солдат."
 japan_north.2.b:0 "Потребовать полный доступ."
 japan_north.2.c:0 "Пусть посредник императора снимет спор."
 japan_north.2.d:0 "Комиссия допущена к накладным, но Сайго запрещает перепись частей. Адмиралтейство требует доказательств, что за словом нейтралитет не скрывается подготовка мятежа."
 japan_north.2.t:0 "За порогом северных складов"
 japan_north.3.a:0 "Оплатить новое посредничество."
 japan_north.3.b:0 "Публично признать пределы нашей власти."
 japan_north.3.d:0 "Север закрывает склады перед чиновниками Токио. Ито заявляет, что уступки лишь поощряют неповиновение. До гражданской войны ещё далеко, но прежняя подпись больше не обеспечивает послушания."
 japan_north.3.t:0 "Протокол больше не работает"
 japan_north.4.a:0 "Выделить деньги адмиралтейству."
 japan_north.4.b:0 "Договор с Севером останется в силе."
 japan_north.4.d:0 "Адмиралы складывают расходы на нейтральный Север и потери борнейской эскадры. Они требуют компенсации, иначе следующая телеграмма станет обвинением всему кабинету."
 japan_north.4.t:0 "Ито считает северные транспорты"
 japan_north.5.a:0 "Оплатить личную аудиенцию."
 japan_north.5.b:0 "Сначала закончить демобилизацию."
 japan_north.5.d:0 "Сайго возвращает довоенную переписку с пометкой: ответ не получен. Временный нейтралитет пережил войну. Теперь Север хочет знать, останется ли Токио верен слову без общего врага."
 japan_north.5.t:0 "После победных сводок"
 japan_north.6.a:0 "Подписать компакт и отправить поставку."
 japan_north.6.b:0 "Условия ещё требуют обсуждения."
 japan_north.6.d:0 "Сайго согласен на постоянный график снабжения при сохранении своего командования. Флот получит предсказуемые расходы вместо кризисных караванов. Это договор о сосуществовании, не об объединении армий."
 japan_north.6.t:0 "Компакт двух берегов"
 japan_paths.1.a:0 "Оплатить учебную команду"
 japan_paths.1.b:0 "Пока утвердить только устав"
 japan_paths.1.d:0 "Ито кладёт перед императором список инструкторов. В нём офицеры, которых армия не готова отпустить. Адмирал просит оплатить отдельную учебную команду: тогда спор о подчинении можно отложить. Двор вправе ограничиться уставом, однако бумага не научит людей высаживаться под огнём."
 japan_paths.1.t:0 "Устав морских самураев"
 japan_paths.2.a:0 "Открыть школы добровольцев"
 japan_paths.2.b:0 "Ограничиться закрытыми слушаниями"
 japan_paths.2.d:0 "Посланники привезли рассказы о Песни и просьбу открыть школы для добровольцев. Они обещают дисциплину, но не подчинение морскому министерству. Офицеры флота требуют закрытых слушаний; сторонники Сайго — публичной кафедры."
 japan_paths.2.t:0 "Посланники Чистой Земли"
 japan_paths.3.a:0 "Оплатить независимую ревизию"
 japan_paths.3.b:0 "Подготовить закрытую записку"
 japan_paths.3.d:0 "В Осаке составляют две сметы: сколько стоит продолжать войну и сколько потребуют за её прекращение. Представитель Палаты интересуется залогом, банкиры — очередностью выплат. Ивасаки предлагает сначала открыть собственные книги, рискуя доверием кредиторов."
 japan_paths.3.t:0 "Цена будущего мира"
 japan_paths.4.a:0 "Учредить фонд семей солдат"
 japan_paths.4.b:0 "Обратиться к стране с воззванием"
 japan_paths.4.d:0 "Жрецы расходятся в том, с чего начинается очищение. Одни требуют торжественного воззвания, другие указывают на семьи погибших, которым нечем платить за рис. Общий фонд даст собору опору в деревнях, но его придётся организовать за государственный счёт."
 japan_paths.4.t:0 "Первый собор святилищ"
 japan_paths.5.a:0 "Проверить счета всех ведомств"
 japan_paths.5.b:0 "Начать с единой формы доклада"
 japan_paths.5.d:0 "Впервые донесения флота, армии и Осакских банков лежат на одном столе. Числа не сходятся. Чиновники предлагают начать с формы доклада; Мэйдзи может потребовать настоящую сверку и принять на себя недовольство всех ведомств."
 japan_paths.5.t:0 "Канцелярия личного доклада"
 ludolf.1.a:0 "Направить торговую делегацию."
 ludolf.1.d:0 "Представительство Всемирной Торговой Палаты получило предложение Батавии. Предстоит согласовать закупки каучука и нефти, страхование рейсов и строительство складов. Губернатор рассчитывает получить внешний капитал, не отдавая Палате управление колонией."
 ludolf.1.t:0 "Нефть, каучук и гарантии"
 ludolf.10.a:0 "Власть придётся подкрепить доверием."
 ludolf.10.d:0 "Отказ от внешних союзов оставляет Батавию один на один с морскими угрозами. Адмиралы требуют участия в распределении бюджета. Людольф сохраняет гражданские полномочия, но ему придётся заслужить уважение офицеров делами.\n\nБаланс сил показывает политический контроль; уважение Совета определяет готовность адмиралов сотрудничать с губернатором."
 ludolf.10.t:0 "Губернатор и морское ведомство"
 ludolf.2.a:0 "Принять приглашение Батавии."
 ludolf.2.d:0 "Ост-Индия предлагает Палате долгосрочные поставки нефти и каучука. Наши представители приглашены обсудить цены, портовые сборы и страховые гарантии. Это возможность закрепиться в торговле архипелага без прямого вмешательства в его управление."
 ludolf.2.t:0 "Батавский ресурсный контракт"
 ludolf.20.a:0 "Подписать договор. Мы не выдержим новой кампании."
 ludolf.20.b:0 "Продолжать войну вопреки Совету."
 ludolf.20.d:0 "Японское морское давление заставило Батавию согласиться на переговоры. Конвенция передаёт Японии Сабах, Бруней и Лимбанг (1024, 1023 и 1059); Ост-Индия получает Саравак и западный Калимантан (333 и 1022). За Японией закрепляются права на нефть и каучук Борнео. Военное ополчение будет распущено, а правительству предстоит пережить последствия поражения."
 ludolf.20.t:0 "Условия мира на Борнео"
 ludolf.21.a:0 "Ресурсный вопрос решён."
 ludolf.21.d:0 "Борнейская конвенция закрепляет за Японией районы 1024, 1023 и 1059. Батавия получает 333 и 1022, признав японские права на нефть и каучук Борнео. Морская кампания завершена; начинается восстановление новых владений."
 ludolf.21.t:0 "Борнейская конвенция"
 ludolf.30.a:0 "Сначала расследование и открытые счета."
 ludolf.30.b:0 "Сохранить кабинет и закрыть обсуждение."
 ludolf.30.d:0 "В Батавии обсуждают, кто заплатит за Борнейскую конвенцию. Адмиралы требуют следствия и нового кабинета; местные правители добиваются автономии. Людольф предлагает перестройку управления, которая сохранит общую оборону и даст султанам собственные правительства."
 ludolf.30.t:0 "Правительство после поражения"
 ludolf.31.a:0 "Автономия стала политической силой."
 ludolf.31.d:0 "Хартии вступили в силу: на сохранившихся территориях Кутай, Понтианак и Банджар получили собственные администрации под верховенством Нидерландов. Ресурсные уступки Японии не исчезли, но решения о местной жизни больше не будут приниматься одним колониальным чиновником.\n\nДелегации султанатов обращаются к Совету. «Мы не оправдываем поражение. Но человек, подписавший эти хартии, впервые признал наше место в общей стране. Дайте ему ещё один шанс». Индонезийские представители поддерживают просьбу с условием: будущая федерация должна дать голос жителям, а не только дворам. Людольф принимает это условие. Касемброот требует доказательств, что новая опора кабинета послужит стране, а не только губернатору."
 ludolf.31.t:0 "Султаны просят дать Людольфу шанс"
 ludolf.32.a:0 "Реванш начинается с восстановления."
 ludolf.32.b:0 "Поддержать горячие головы."
 ludolf.32.d:0 "В офицерских клубах и портовых кварталах говорят о возвращении Сабаха и Брунея. Одни требуют немедленной мести, другие призывают сначала восстановить флот. Людольф видит шанс объединить страну вокруг долгой программы восстановления."
 ludolf.32.t:0 "Память о потерянном севере"
 ludolf.33.a:0 "Расширить расследование Совета."
 ludolf.33.b:0 "Защитить право кабинета на ответ."
 ludolf.33.c:0 "Отвергнуть требования Совета."
 ludolf.33.d:0 "Военная комиссия требует новых полномочий и ответственности гражданского кабинета. Людольф отвечает, что следствие не должно заранее выбирать виновного. Фабиус предлагает продолжить открытые слушания.\n\nМожно передать комиссии больше материалов и укрепить позиции Совета либо защитить самостоятельность кабинета, потратив политический капитал. Ни одно из этих решений пока не снимает губернатора с поста."
 ludolf.33.resign:0 "Согласиться на передачу власти."
 ludolf.33.t:0 "Совет требует отчёта о поражении"
 ludolf.34.a:0 "Предоставить комиссии дополнительные полномочия."
 ludolf.34.b:0 "Отстоять гражданские процедуры."
 ludolf.34.d:0 "Адмиралы называют обещанные реформы попыткой уйти от ответственности. Делегаты возражают: смена правительства не вернёт потерянные берега. Спор продолжается в рамках слушаний; даже перевес Совета ещё не заменяет решения о будущем власти."
 ludolf.34.t:0 "У кабинета требуют новые объяснения"
 ludolf.35.a:0 "Директория приступает к управлению."
 ludolf.35.d:0 "Утром к резиденции прибывает караул Совета. Людольфу зачитывают обвинение в ответственности за проигранную войну и запрещают обращаться к делегатам. Он успевает спросить, будет ли открытое разбирательство. Офицер отвечает, что порядок определит директория.\n\nСултанские посланцы передают протест, но ворота уже закрыты. Совет принимает управление страной. В министерства отправляют списки должностей, подлежащих проверке; в штабы — новые формы присяги. Отставка оказалась первым шагом. Теперь победившая сторона намерена перестроить весь государственный аппарат."
 ludolf.35.t:0 "Людольф под арестом"
 ludolf.36.a:0 "Начать федеральные преобразования."
 ludolf.36.d:0 "Султанские делегаты и представители общин требуют сохранить Людольфа, но отказываются поддержать возвращение к прежнему порядку. Их условие — федерация с общим гражданством и участием индонезийцев в выборе государственных служащих.\n\nЛюдольф соглашается. Совет снимает вопрос о немедленном смещении, сохранив право критиковать действия кабинета. Хасан предупреждает: «Мы поддержали перемены. Если вы остановитесь, подписи под вашей поддержкой исчезнут». Губернатор получает власть, которую теперь придётся оправдывать перед людьми, прежде исключёнными из управления."
 ludolf.36.t:0 "Второй шанс в обмен на другую страну"
 pacific.1.a:0 "Подписать торговое соглашение."
 pacific.1.b:0 "Они сами еле на ногах держатся."
 pacific.1.d:0 "Батавия предлагает гарантированные поставки каучука в обмен на взаимное ненападение. Промышленники поддерживают соглашение, но морское ведомство требует контроля над источниками сырья."
 pacific.1.t:0 "Предложение Батавии"
 pacific.2.a:0 "Дипломатия принесла результат."
 pacific.2.d:0 "Договор с Японией обеспечивает рынки сбыта и взаимные гарантии ненападения. Порты готовятся принять первые торговые суда."
 pacific.2.t:0 "Конвенция подписана"
 pacific.3.a:0 "Принять условия."
 pacific.3.b:0 "Наши порты останутся независимыми."
 pacific.3.d:0 "Японские представители предлагают торговую конвенцию и взаимное ненападение. Принятие договора обеспечит инвестиции, но свяжет нашу торговлю с империей."
 pacific.3.t:0 "Японская торговая миссия"
 pacific.4.a:0 "Уступить ради мира."
 pacific.4.b:0 "Отвергнуть ультиматум. Мы будем защищаться."
 pacific.4.d:0 "Япония требует привилегированного доступа к сырью Борнео. Согласие сохранит мир ценой экономических уступок. Отказ означает немедленное объявление войны."
 pacific.4.t:0 "Требования морского ведомства"
 pacific.5.a:0 "Они сами еле на ногах держатся."
 pacific.5.d:0 "Нидерландское правительство объявило курс на прямое соперничество с Японией. Морское ведомство предлагает ответить подготовкой экспедиции на Борнео."
 pacific.5.t:0 "Батавия бросает вызов"
 pacific.6.d:0 "Япония ответила на объявленное соперничество угрозой морской экспедиции. Её подготовка идёт независимо от наших дипломатических шагов. Нам предстоит подготовить Борнео к обороне."
 pacific.6.t:0 "Токио принимает вызов"
 sabah_war.1.a:0 "Укрепить береговую оборону Джессельтона."
 sabah_war.1.b:0 "Объявить дополнительный призыв среди местного населения."
 sabah_war.1.d:0 "Разведчики с Таваупа сообщают о дыме на горизонте: японские крейсера и миноносцы прошли к северу от Джессельтона. Портовые офицеры требуют усилить береговые батареи, пока орудийный огонь не накрыл гавань."
 sabah_war.1.t:0 "Японский флот у берегов Сабаха"
 sabah_war.2.a:0 "Эскадра прорвалась — начинаем высадку."
 sabah_war.2.b:0 "Голландские субмарины вынудили нас отойти. Перестраиваем маршрут."
 sabah_war.2.d:0 "Японская лёгкая эскадра прорывается сквозь заслоны нидерландских подводных лодок и занимает позиции для прикрытия высадки. Морской штаб докладывает: путь на Сабах практически свободен."
 sabah_war.2.t:0 "Столкновение у Джессельтона"
 sabah_war.3.a:0 "Гнать подкрепления! Времени терять нельзя."
 sabah_war.3.b:0 "Сначала закрепить плацдарм, потом наступать."
 sabah_war.3.d:0 "Транспорты под огневым прикрытием тяжёлых крейсеров входят в бухту Сандакан. Первые отряды Нанкай Токубэцу Рикусэнтай уже на берегу. Наши цели — порты Джессельтона и Сандакана. Сабах должен стать нашим."
 sabah_war.3.t:0 "Морские пехотинцы Нанкая высаживаются на Сабахе!"
 sabah_war.4.a:0 "Мобилизовать резервы — Сабах нужно вернуть!"
 sabah_war.4.b:0 "Принять утрату — удержать Бруней любой ценой."
 sabah_war.4.d:0 "Японские морские пехотинцы заняли Джессельтон и Сандакан. Нидерландский гарнизон оказывал сопротивление несколько суток, но без подкреплений был сломлен. Северный Борнео теперь под японским флагом. Батавия в трауре."
 sabah_war.4.t:0 "Сабах пал!"
 sabah_war.6.a:0 "Закрепить победу — двигаться на юг."
 sabah_war.6.d:0 "Имперский флот установил господство в море Сулу. Сабах и Бруней в наших руках, нидерландские суда вытеснены из этих вод. Южная стратегия приносит плоды — Борнео становится японской сферой влияния."
 sabah_war.6.t:0 "Море Сулу под японским контролем"
 southern_war.2.a:0 "Проверить новый срок мобилизации."
 southern_war.2.d:0 "Разведка сообщает об ускоренной погрузке японских транспортов и пополнении передовых угольных складов. Эскадры могут выйти в море раньше, чем рассчитывал кабинет. Подготовку береговой обороны следует завершить без промедления."
 southern_war.2.t:0 "Япония ускоряет приготовления"
 wtc_credit.1.a:0 "Уступить сборы на восемь месяцев."
 wtc_credit.1.b:0 "Оплатить обязательства сейчас."
 wtc_credit.1.c:0 "Отвергнуть требование."
 wtc_credit.1.d:0 "Долг превысил 70. Директор Ламберт требует уступить портовые сборы. Кабинет может заплатить политическую цену сейчас, передать часть доходов или отвергнуть требование и увеличить долг."
 wtc_credit.1.t:0 "Мадейра требует обеспечение"
 wtc_credit.10.a:0 "Сохранить общую подпись."
 wtc_credit.10.d:0 "У директората три голоса и одна подпись. Банкиры требуют сохранить Серебряный Конвой; технократы ищут договор с Теслой; тайный департамент предлагает кабели, пиратов и исчезающие имена. Никто не знает, существует ли человек по имени Ламберт. Все знают, что без британского флота их приказы не дойдут дальше причала."
 wtc_credit.10.t:0 "Кто подписывает «Ламберт»?"
 wtc_credit.11.a:0 "Дать лабораториям контракт."
 wtc_credit.11.d:0 "Технократы предлагают оплачивать приборы и телеграфные лаборатории. Старая гвардия боится, что независимая энергия сделает страховщика ненужным. Новый приоритет откроет лабораторные контракты подписчикам Палаты."
 wtc_credit.11.t:0 "Тесла не просит разрешения"
 wtc_credit.12.a:0 "Подписать договор без печати."
 wtc_credit.12.d:0 "Тайный департамент предлагает оплачивать безопасные коридоры тем, кто вчера нападал на них. Стражи Проливов обеспечат встречу, британская разведка — имена. Канал доступен страхователям, но слухи о договоре испортят репутацию."
 wtc_credit.12.t:0 "Пираты с правильными накладными"
 wtc_credit.2.a:0 "Искать деньги для выплаты."
 wtc_credit.2.d:0 "Долг выше 90. Кабельные сообщения задерживаются. Если британский флот прикрывает Палату, страховые агенты заносят страну в чёрный список. Без британского щита ВТП сохраняет связь, но теряет силу морского принуждения."
 wtc_credit.2.t:0 "Отлучение от торговой книги"
 wtc_credit.20.a:0 "Отправить проект британскому кабинету."
 wtc_credit.20.d:0 "Батавия предлагает Британии начать сближение европейских островных обществ. Это первый шаг к возможному объединению, но Лондон должен согласиться сам. Японский ультиматум остаётся в общем календаре."
 wtc_credit.20.t:0 "Письмо о европейской демократии"
 wtc_credit.21.a:0 "Принять делегацию."
 wtc_credit.21.b:0 "Ограничиться дипломатической перепиской."
 wtc_credit.21.d:0 "Нидерланды предлагают общий демократический курс и будущие переговоры об объединении. Принять делегацию не значит заранее передать ей флот, колонии или корону."
 wtc_credit.21.t:0 "Батавский проект объединения"
 wtc_credit.22.a:0 "Закрепить договор торговых советов."
 wtc_credit.22.d:0 "Расширение торговых советов даст демократическим группам голос. Сотрудничество с ВТП и рост демократии теперь становятся отдельным политическим курсом."
 wtc_credit.22.t:0 "Демократия под страховой печатью"
 wtc_credit.3.a:0 "Принять долговую администрацию."
 wtc_credit.3.b:0 "Выкупить долг чрезвычайным сбором."
 wtc_credit.3.c:0 "Без британских кораблей приказ бессилен."
 wtc_credit.3.d:0 "Долг достиг 100. Тайный департамент приготовил замену кабинету — местную долговую администрацию. Палата не может управлять нашими провинциями сама. Без британского прикрытия операция сорвётся; иначе спасением станет только чрезвычайный выкуп."
 wtc_credit.3.t:0 "Последняя расписка"
