l_russian:
 A01_war_response_category:0 "Ответ на индонезийские волнения"
 A01_war_response_category_desc:0 "Японский ультиматум расколол население архипелага. Выбранный в ходе волнений курс открыл одно особое решение: силовая политика позволяет мобилизовать колониальную полицию, а соглашение с ВТП — созвать Совет султанов. После выполнения решение исчезнет."
 A01_inevitable_conflict_category:0 "Японская экспансия"
 A01_inevitable_conflict_category_desc:0 "Японская подготовка идёт независимо от наших фокусов. После скрытой начальной фазы открывается общий отсчёт на 288 дней. Японские приготовления сокращают его, уступки продлевают. Соглашение отменяет наступление. Отказ от ультиматума означает немедленную войну."
 A01_japanese_invasion_countdown:0 "Японская экспансия: приготовления"
 A01_japanese_invasion_countdown_desc:0 "После независимой скрытой подготовки начинается общий отсчёт на §Y288 дней§!. Уступки продлевают срок, японские приготовления сокращают его. Соглашение отменяет наступление. После начала войны Япония получает §Y180 дней§! для удержания хотя бы одной провинции Борнео."
 A01_mobilize_colonial_police:0 "Мобилизовать колониальную полицию"
 A01_mobilize_colonial_police_desc:0 "Вооружим резервистов, портовую охрану и сельские полицейские отряды, чтобы прикрыть склады и коммуникации от диверсантов. Мобилизация займёт §Y7 дней§! и потребует §Y50§! ед. политической власти.\n\n§YПосле завершения:§!\n— защита дивизий: §G+10%§!;\n— объём заводского производства: §R−5%§!.\n\nЭти изменения будут добавлены в национальный дух §Y«Колониальная политика безопасности»§! и останутся постоянными."
 A01_convene_council_of_sultans:0 "Созвать Совет султанов"
 A01_convene_council_of_sultans_desc:0 "При посредничестве ВТП местные правители публично подтвердят верность Батавии, а администрация повторно гарантирует страховые выплаты семьям и защиту имущества. Подготовка съезда займёт §Y7 дней§! и потребует §Y50§! ед. политической власти.\n\n§YПосле завершения:§! стабильность §G+10%§! на §Y180 дней§!."
