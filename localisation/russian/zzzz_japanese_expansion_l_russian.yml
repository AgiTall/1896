l_russian:
 A01_begin_island_defence:0 "Начать оборону острова"
 A01_japanese_expansion:0 "Японская экспансия"
 A03_japanese_expansion:0 "Японская экспансия"
 A03_japanese_invasion_countdown:0 "Японская экспансия: приготовления"
 A01_lease_brunei:0 "Передать Бруней в аренду на полгода"
 A01_lease_brunei_desc:0 "Передать Японии управление Брунеем (1023) на §Y180 дней§! и продлить подготовку к войне на §G180 дней§! у обеих стран. Затем регион вернётся Нидерландам. Если война начнётся досрочно, возврат будет отложен до мира; победа Японии закрепит передачу по конвенции."
 A01_rubber_concession:0 "Предоставить временную каучуковую концессию"
 A01_rubber_concession_desc:0 "Предоставить Японии права на каучук восточного Калимантана (1055) на §Y180 дней§!. Общий срок до войны увеличится на §G60 дней§!. Новые постоянные права по Борнейской конвенции сохранятся, если она будет подписана позднее."
 A01_supply_concession:0 "Уступить партию стрелкового оружия"
 A01_supply_concession_desc:0 "Передать Японии §Y1000 единиц пехотного снаряжения§!, продлив общий срок подготовки к войне на §G30 дней§!."
 expansion.1.a:0 "Острова остаются за нами."
 expansion.2.t:0 "Провал Борнейской экспедиции"
 expansion.2.a:0 "Признать неудачу экспедиции."
 expansion.3.a:0 "Приступить к восстановлению."
 expansion.10.t:0 "Срок аренды Брунея истёк"
 expansion.10.d:0 "Временная японская администрация завершила работу. Бруней возвращён под управление Батавии в соответствии с условиями аренды."
 expansion.10.a:0 "Восстановить нашу администрацию."
 expansion.11.t:0 "Полугодовая аренда Брунея"
 expansion.11.d:0 "Батавия передала Японии управление Брунеем на 180 дней. В обмен срок наших военных приготовлений продлён на 180 дней у обеих сторон. По окончании аренды регион должен быть возвращён."
 expansion.11.a:0 "Соблюдать временное соглашение."
 A01_begin_island_defence_desc:0 "Начать подготовку к обороне Борнео. У нас и Японии появится общий отсчёт на §Y180 дней§! до войны. Японские приготовления могут сократить этот срок, а уступки — продлить его. После начала войны Япония получит §Y180 дней§!, чтобы закрепиться хотя бы в одной провинции Борнео."
 A01_inevitable_conflict_category_desc:0 "Японская подготовка идёт независимо от наших фокусов. После скрытой начальной фазы открывается общий отсчёт на 288 дней. Японские приготовления сокращают его, уступки продлевают. Соглашение отменяет наступление. Отказ от ультиматума означает немедленную войну."
 A01_japanese_expansion_desc:0 "Если к окончанию задания Япония контролирует §Rхотя бы одну провинцию Борнео§!, вступит в силу Борнейская конвенция. Для §Gпобеды Нидерландов§! на острове не должно остаться ни одного японского плацдарма. Полного захвата Сабаха не требуется.\n\n$A01_occupation_balance_tt$"
 A01_japanese_invasion_countdown_desc:0 "После независимой скрытой подготовки начинается общий отсчёт на §Y288 дней§!. Уступки продлевают срок, японские приготовления сокращают его. Соглашение отменяет наступление. После начала войны Япония получает §Y180 дней§! для удержания хотя бы одной провинции Борнео."
 A03_japanese_expansion_desc:0 "К окончанию задания удерживайте §Yхотя бы одну провинцию Борнео§!. Этого достаточно для победы и Борнейской конвенции. Если на острове не останется ни одного нашего плацдарма, Япония проиграет и завершит войну без приобретений. Результат определяется при истечении общего срока."
 A03_japanese_invasion_countdown_desc:0 "После независимой начальной подготовки у Японии есть §Y288 дней§! до наступления. Военные приготовления сокращают срок, нидерландские уступки продлевают. Соглашение отменяет наступление."
 expansion.1.d:0 "Срок японской кампании истёк. На Борнео не осталось ни одного японского плацдарма, и Токио вынужден прекратить наступление. Мир сохраняет наши владения. Успешная оборона укрепила гражданский кабинет Людольфа и его отношения с морским ведомством."
 expansion.1.t:0 "Борнео удержан — экспансия остановлена"
 expansion.2.d:0 "Отведённый срок истёк, но на Борнео не осталось ни одной провинции под нашим контролем. Экспансия признана провалившейся. Япония прекращает войну без территориальных приобретений; кабинет сталкивается с падением общественной поддержки."
 expansion.3.d:0 "К окончанию кампании Япония сохранила плацдарм на Борнео. Батавия вынуждена принять Борнейскую конвенцию. Война завершена; передача северных районов и ресурсные уступки ослабили положение губернатора."
 expansion.3.t:0 "Японский плацдарм на Борнео"
