 WTN_relation_maritime_tt:0 "Обе стороны получают морскую координацию +2% на срок соглашения. Одинаковые услуги нескольких партнёров не складываются."
 WTN_relation_research_tt:0 "Обе стороны получают морскую координацию +2% и скорость исследований +2% на срок соглашения."
 WTN_relation_workshop_tt:0 "Обе стороны получают морскую координацию +2% и рост эффективности производства +2% на срок соглашения."
 WTN_relation_northern_tt:0 "Обе стороны получают морскую координацию +2% и расход снабжения −2% на срок соглашения."
 WTN_relation_fuel_tt:0 "Обе стороны получают морскую координацию +2% и морской расход снабжения −3% на срок соглашения. Нефть и регионы не передаются."
 WTN_relation_colonial_tt:0 "Обе стороны получают морскую координацию +2% и скорость строительства +2% на срок соглашения. Колонии сохраняют отдельные кабинеты."
 WTN_relation_caribbean_tt:0 "Обе стороны получают морскую координацию +2% и эффективность эскортов +2% на срок соглашения."
 WTN_island_relations:0 "Островная дипломатия"
 WTN_island_relations_desc:0 "Прямые соглашения морских служб дополняют отношения с Палатой. Обе стороны должны подтвердить условия; долг, власть и границы соглашением не передаются."
 wtn_relations.title:0 "Представители [FROM.GetName]"
 wtn_relations.desc:0 "Прибывшие представители предлагают обмениваться портовыми ведомостями, сверять места встречи судов и согласовать передачу торговых грузов. Они готовы подписать ограниченное соглашение морских служб, оставляющее политические вопросы за пределами договора."
 wtn_relations.decline:0 "Сейчас мы не готовы принять эти условия"
 wtn_relations.accept:0 "Согласовать работу морских служб"
 wtn_relations.accepted.t:0 "Морские службы договорились"
 wtn_relations.accepted.d:0 "Посланники прислали подтверждённые условия. Портовые команды обоих правительств могут согласовывать рейсы и обмениваться проверенными ведомостями."
 wtn_relations.declined.t:0 "Предложение осталось без соглашения"
 wtn_relations.declined.d:0 "Представители вернулись без подтверждённых условий. Нашим морским службам предстоит поддерживать рейсы своими средствами и искать другие возможности договориться."
 wtn_relations.ack:0 "Принять донесение к сведению"
