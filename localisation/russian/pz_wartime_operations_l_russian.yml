l_russian:
 A03_wartime_operations:0 "Продолжение южной кампании"
 A03_wartime_operations_desc:0 "Переброска резервов и мобилизация продлевают общий срок Борнейской кампании у обеих сторон."
 A03_rush_second_wave:0 "Отправить вторую волну"
 A03_rush_second_wave_desc:0 "Продлить обе военные миссии на 45 дней, выделить 1000 единиц оружия и 5000 резервистов."
 A03_mobilize_reserves:0 "Мобилизовать резервы"
 A03_mobilize_reserves_desc:0 "Продлить обе военные миссии на 30 дней, получить 15000 резервистов, 2000 единиц оружия и топливо."
 A03_imperial_press_campaign:0 "Имперская кампания в печати"
 A03_imperial_press_campaign_desc:0 "Продлить обе военные миссии на 20 дней и укрепить общественную поддержку кампании."
 A01_peace_request_category:0 "Переговоры с Японией"
 A01_peace_request_category_desc:0 "При японском контроле хотя бы одной провинции Борнео можно предложить досрочный мир на японских условиях."
 A01_request_japanese_terms:0 "Запросить японские условия мира"
 A01_request_japanese_terms_desc:0 "Обратиться в Токио с предложением Борнейской конвенции. Япония может принять или отклонить запрос. Аренда Брунея тоже считается японским контролем."
 a01_peace_request.1.t:0 "Обращение в Токио"
 a01_peace_request.1.d:0 "Батавия предлагает прекратить войну на условиях Борнейской конвенции. Теперь решение за японским правительством."
 a01_peace_request.1.a:0 "Ждать ответа."
 a01_peace_request.2.t:0 "Батавия просит мира"
 a01_peace_request.2.d:0 "Голландская администрация готова принять Борнейскую конвенцию. Мы можем завершить кампанию либо продолжить войну."
 a01_peace_request.2.accept:0 "Принять предложение."
 a01_peace_request.2.reject:0 "Продолжить кампанию."
 a01_peace_request.3.t:0 "Досрочная Борнейская конвенция"
 a01_peace_request.3.d:0 "Япония приняла предложение. Сабах, Бруней, Лимбанг и Саравак переходят Японии; война заканчивается на условиях конвенции."
 a01_peace_request.3.a:0 "Начать восстановление."
 a01_peace_request.4.t:0 "Токио отвергает предложение"
 a01_peace_request.4.d:0 "Японское правительство отвергло мирный запрос. Кампания продолжается."
 a01_peace_request.4.a:0 "Готовиться к дальнейшей борьбе."
