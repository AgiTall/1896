 SONG_EARTH_1893_NAME:0 "1893 — Острова надежды"
 SONG_EARTH_1893_DESC:0 "§Y1 января 1893 года§!\n\nКонтиненты замолкли. Моря стали дорогами, острова — последними убежищами человечества. Старые короны живут в изгнании, новые республики спорят за гавани, а Всемирная торговая палата держит в руках их долги.\n\nЯпония ищет нефть Борнео. Батавия пытается сохранить единство. Карибы уже охвачены войной. Далеко на севере Гренландия хранит надежду, способную изменить судьбу мира.\n\n§YЧья песнь прозвучит над океаном?§!"
