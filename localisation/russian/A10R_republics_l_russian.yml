l_russian:
 A10R_congress.1.t:0 "Столы под навесом"
 A10R_congress.1.d:0 "В Кавите не хватает зала для всех делегатов. Заседание продолжается под парусиновым навесом: одни требуют оружия для Лусона, другие — письменного обещания не отнимать у островов свободу. Председатель просит сначала выслушать тех, кто добирался сюда через японские патрули."
 A10R_congress.1.o0:0 "Сначала скрепим обещания."
 A10R_congress.1.o1:0 "Сначала откроем склады."
 A10R_congress.2.t:0 "Печати Минданао"
 A10R_congress.2.d:0 "Посланники Минданао привезли две разные печати и общий список требований. Они готовы защищать острова, но не принимать чужих судей и сборщиков налогов. Военные торопят переговоры; переводчики просят дать старейшинам договорить."
 A10R_congress.2.o0:0 "Подтвердить местное право."
 A10R_congress.2.o1:0 "Общая оборона требует общего сбора."
 A10R_congress.3.t:0 "Долговые расписки землевладельцев"
 A10R_congress.3.d:0 "В конгресс доставили тетрадь арендатора: долг за семена пережил два урожая и смену власти. Землевладелец требует уважать собственность, сельские делегаты — прекратить бесконечные взыскания. Решение станет известным далеко за пределами одной деревни."
 A10R_congress.3.o0:0 "Проверить долги в открытом суде."
 A10R_congress.3.o1:0 "Выкупить спорные обязательства из казны."
 A10R_congress.4.t:0 "Договор или конституция"
 A10R_congress.4.d:0 "Вопрос о будущем союза расколол даже старых товарищей. Одни видят в общем правительстве защиту от нового завоевателя, другие вспоминают, как столицы превращали временные полномочия в вечные. На столе лежат два проекта, и оба обещают свободу."
 A10R_congress.4.o0:0 "Обсудим оба проекта на островах."
 A10R_congress.5.t:0 "Ни одной молчаливой ратификации"
 A10R_congress.5.d:0 "Конвент направляет республикам проект федерального закона. Представители требуют записать: отсутствие ответа не означает согласия, а военная необходимость не отменяет местного голосования. Секретарь оставляет в книге отдельную страницу для каждой печати."
 A10R_congress.5.o0:0 "Разослать проект собраниям республик."
 A10R_congress.6.t:0 "Федерация, которую ещё предстоит собрать"
 A10R_congress.6.d:0 "Федеральная конституция провозглашена. Делегаты, одобрившие её, остаются у стола, остальные возвращаются к своим избирателям. Теперь задача правительства — исполнить гарантии и заключить соглашение с каждой республикой, а не объявить все острова подчинёнными одной печати."
 A10R_congress.6.o0:0 "Один закон, добровольное присоединение."
 A10R_congress.7.t:0 "Имена в приходских книгах"
 A10R_congress.7.d:0 "Комиссия восстановления сравнивает армейские списки с приходскими книгами. Там, где штаб насчитал потерянные винтовки, деревни называют погибших кормильцев. В общей ведомости найдётся место и разрушенным мастерским, и семьям, которым некуда возвращаться."
 A10R_congress.7.o0:0 "Начать с семей погибших."
 A10R_congress.7.o1:0 "Сначала вернуть людям работу."
 A10R_congress.8.t:0 "Девять мест под солнцем"
 A10R_congress.8.d:0 "Над местом заседания поднят союзный флаг. Республика, приславшая всего одного делегата, голосует рядом с многолюдными портами. Председатель читает договор: общая оборона, открытые гавани и обязательство решать споры словами прежде, чем брать оружие."
 A10R_congress.8.o0:0 "Республики держат данное слово."
 A10R_congress.9.t:0 "Правительство перед палатами"
 A10R_congress.9.d:0 "Министры заняли скамьи перед двумя палатами. Среди депутатов — бывшие связные, учителя и владельцы прибрежных мастерских. Военные представители присутствуют как приглашённые: впервые после падения Манилы вопрос о бюджете решают без приказа штаба."
 A10R_congress.9.o0:0 "Открыть первое заседание."
 A10R_congress.10.t:0 "Пустующие места делегатов"
 A10R_congress.10.d:0 "Несколько островных делегаций покинули заседание. Они обвиняют казну в сокрытии сборов, а штаб — в предпочтении одних портов другим. Союз не распадётся от одного спора, но молчание сделает следующий раскол гораздо глубже."
 A10R_congress.10.o0:0 "Оплатить согласительную комиссию."
 A10R_congress.10.o1:0 "Вернуть островам часть сборов."
 A10R_local_vote_PVI:0 "Местное собрание: Висайской республики"
 A10R_local_vote_PVI_desc:0 "В освобождённой области созовём местных представителей для обсуждения федеральной хартии. Интеграция потребует их согласия, равных гражданских прав и доверия к новой администрации."
 A10R_request_PVI:0 "Ратификация: Висайской республики"
 A10R_request_PVI_desc:0 "Передадим проект конституции местному собранию. Республика вправе отказать; после нового обсуждения переговоры можно будет возобновить."
 A10R_accession_PVI:0 "Присоединение: Висайской республики"
 A10R_accession_PVI_desc:0 "После согласия республики и принятия единого гражданства её учреждения войдут в федерацию. Голосование не даёт права забирать земли, захваченные чужими войсками."
 A10R_congress.20.t:0 "Федеральный проект: Висайской республики"
 A10R_congress.20.d:0 "Посланник Кавите представил проект общей конституции. Он обещает местные советы, равное гражданство и представительство в палате островов. Собрание должно решить, доверяет ли оно этим гарантиям. Отказ сохранит республику в прежнем союзе."
 A10R_congress.20.o0:0 "Ратифицировать при сохранении местных прав."
 A10R_congress.20.o1:0 "Сохранить республиканский договор."
