 A10R_request_defensive_armistice:0 "Предложить оборонительное перемирие"
 A10R_request_defensive_armistice_desc:0 "Если силы островов иссякли, можно предложить прекращение войны без территориальных уступок. Япония вправе отказаться. Цена согласия — тяжёлый удар по престижу правительства."
 A10_japanese_settlement_desc:0 "Условия мира зависят от освобождённых гаваней. Полное соглашение требует освобождения японских владений архипелага; Манильский компромисс оставляет северный Лусон и Батаан Японии. Тяжёлое истощение позволяет просить отдельного перемирия."
 A10R_congress.40.t:0 "Посланник из Кавите"
 A10R_congress.40.d:0 "Филиппинский посланник предлагает прекратить боевые действия и вернуть войска за прежние границы. Манильские офицеры называют это упущенной победой, казначейство — возможностью сократить расходы. Никаких новых уступок островитяне не предлагают."
 A10R_congress.40.o0:0 "Принять прекращение огня."
 A10R_congress.40.o1:0 "Продолжать кампанию."
 A10R_congress.41.t:0 "Горькая тишина"
 A10R_congress.41.d:0 "На пристанях снова разгружают мирные товары, но северные гавани остались под чужим флагом. Правительство говорит о спасённых жизнях. Вернувшиеся солдаты молчат. Впереди восстановление страны и долгий спор о цене мира."
 A10R_congress.41.o0:0 "Сберечь то, что удалось удержать."
 A10R_provisional_compact:0 "Временный договор республик"
 A10R_provisional_compact_desc:0 "Общие учреждения ещё слабы, но первые обязательства уже скреплены печатями островов."
 A10R_common_treasury_spirit:0 "Открытая союзная казна"
 A10R_common_treasury_spirit_desc:0 "Республики видят, куда идут их взносы, и могут требовать ответа у казначеев."
 A10R_arbitration:0 "Межостровный арбитраж"
 A10R_arbitration_desc:0 "Споры между советами разбирает общий суд, а не республиканские отряды."
 A10R_tenant_rights:0 "Гарантии сельских общин"
 A10R_tenant_rights_desc:0 "Письменные договоры и проверка долгов защищают сельские семьи от произвола."
 A10R_confederal_covenant:0 "Союз суверенных республик"
 A10R_confederal_covenant_desc:0 "Острова связывает постоянный договор, общая оборона и взаимная ответственность."
 A10R_customs_union_spirit:0 "Общая внешняя таможня"
 A10R_customs_union_spirit_desc:0 "Внутренние пошлины уступили место открытым гаваням и согласованным внешним сборам."
 A10R_republican_solidarity:0 "Республиканская солидарность"
 A10R_republican_solidarity_desc:0 "Разные знамёна больше не мешают совместной обороне родных берегов."
 A10R_bill_of_rights_spirit:0 "Гарантии федеральной хартии"
 A10R_bill_of_rights_spirit_desc:0 "Местные языки, советы и верования защищены общим законом."
 A10R_federal_citizenship:0 "Единое островное гражданство"
 A10R_federal_citizenship_desc:0 "Место рождения больше не определяет права человека перед федеральным законом."
 A10R_responsible_cabinet:0 "Правительство перед парламентом"
 A10R_responsible_cabinet_desc:0 "Министры обязаны обосновывать свои решения перед двумя палатами."
 A10R_fractured_council:0 "Разлад островных советов"
 A10R_fractured_council_desc:0 "Делегаты не доверяют общей казне, а командиры спорят о снабжении."
 A10R_trusted_council:0 "Доверие островов"
 A10R_trusted_council_desc:0 "Советы исполняют общие решения, потому что участвовали в их принятии."
 A10R_emergency_concessions:0 "Чрезвычайные уступки республикам"
 A10R_emergency_concessions_desc:0 "Часть союзных доходов временно оставлена местным советам ради сохранения согласия."
 A10R_reconstruction:0 "Обязательства восстановления"
 A10R_reconstruction_desc:0 "Пристани, дороги и семьи погибших требуют помощи из общей казны."
 A10R_island_recovery:0 "Острова возвращаются к жизни"
 A10R_island_recovery_desc:0 "Вновь работают мастерские, возвращаются семьи, открываются школы."
 A10R_bitter_armistice:0 "Горечь перемирия"
 A10R_bitter_armistice_desc:0 "Война остановлена, но обещание вернуть все северные гавани осталось неисполненным."
 A10R_council:0 "Совет республик"
 A10R_council_desc:0 "Согласие островов: [?A10R_cohesion|0]/100. Военные нужды испытывают союз на прочность; открытая казна и собрания делегатов укрепляют доверие."
 A10R_federal_ratification:0 "Федеральные ратификации"
 A10R_federal_ratification_desc:0 "Одобрено республиками: [?A10R_federal_votes|0]. Для провозглашения федерации нужны три согласия либо согласие всех оставшихся республик, если их меньше трёх, и согласие островов не ниже 40. Присоединение требует мира, ратификации и единого гражданства; местные национальные земли сохраняются."
 A10R_ratification_tt:0 "Открываются отдельные переговоры о ратификации с республиками — участницами союза. Каждая может согласиться или отказать."
 A10R_convene_delegates:0 "Созвать островных делегатов"
 A10R_convene_delegates_desc:0 "Выслушаем жалобы республик и согласуем общий порядок снабжения."
 A10R_emergency_contributions:0 "Попросить чрезвычайные поставки"
 A10R_emergency_contributions_desc:0 "Республики выделят оружие из местных запасов, но такая просьба испытывает их доверие."
 A10R_publish_accounts:0 "Опубликовать союзные счета"
 A10R_publish_accounts_desc:0 "Открытые ведомости покажут советам, что их взносы не исчезают в чужих карманах."
 A10R_federal_presidency_name:0 "Федеральный гражданский кабинет"
 A10R_federal_presidency_desc:0 "Избранное правительство, ответственное перед палатой населения и палатой островов."
 A10R_confederal_presidency_name:0 "Совет островных республик"
 A10R_confederal_presidency_desc:0 "Союзное председательство, ответственное перед делегатами суверенных островных республик."
 A10_federal_administration_desc:0 "Общий устав связывает провинциальные службы с избираемыми советами. Доверие к новым учреждениям растёт медленно и требует соблюдения обещанных прав."
 A10_common_army_desc:0 "Республики содержат собственные отряды, но склады, переправы и распоряжения штаба подчиняются общему порядку."
