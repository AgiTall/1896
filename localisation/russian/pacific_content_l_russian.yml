l_russian:
 A01_java_development:0 "План развития Явы"
 A01_java_development_desc:0 "Государственные заказы свяжут мастерские Батавии и предприятия Явы. Новые фабрики обеспечат архипелаг собственными промышленными товарами."
 A01_sumatran_railways:0 "Суматранские железные дороги"
 A01_sumatran_railways_desc:0 "Плантации и порты Суматры разделяют сотни километров труднопроходимой местности. Железнодорожное строительство сократит путь от склада до причала."
 A01_surabaya_arsenal:0 "Арсенал Сурабаи"
 A01_surabaya_arsenal_desc:0 "Сурабая станет центром ремонта оружия и выпуска боеприпасов. Армия не должна зависеть от каждого транспорта, прибывающего из Европы."
 A01_batavia_docks:0 "Доковый комплекс Батавии"
 A01_batavia_docks_desc:0 "Углубление гаваней и новые сухие доки позволят обслуживать эскадру в Батавии. Повреждённым кораблям больше не придётся искать ремонт за пределами наших вод."
 A01_rubber_processing:0 "Переработка каучука"
 A01_rubber_processing_desc:0 "Вывозить сырой каучук проще, чем развивать переработку, но прибыль остаётся за морем. Построим предприятия рядом с суматранскими плантациями."
 A01_local_rifles:0 "Местное производство винтовок"
 A01_local_rifles_desc:0 "Оружейные контракты Сурабаи обеспечат винтовки и постоянную программу местных заказов. Она ускорит строительство военных заводов и повысит предельную эффективность производства."
 A01_technical_college:0 "Батавский технический институт"
 A01_technical_college_desc:0 "Высшее техническое образование свяжет верфи и фабрики с подготовкой инженеров. Добавляется исследовательская ячейка и становится доступен инженерный совет Батавии."
 A01_knil_reform:0 "Реформа КНИЛ — колониальной армии"
 A01_knil_reform_desc:0 "КНИЛ (KNIL, Koninklijk Nederlands-Indisch Leger) — Королевская нидерландская ост-индская армия, сухопутные войска Нидерландов в Индонезии. В моде это регулярные гарнизоны и полевые части архипелага под управлением Батавии.\n\nРеформа вводит общую подготовку и создаёт национальный дух КНИЛ. Последующие армейские фокусы улучшают его организацию, оборону, обучение и снабжение. Добровольческое индонезийское ополчение — отдельные временные части для войны с Японией."
 A01_island_garrisons:0 "Гарнизоны островов"
 A01_island_garrisons_desc:0 "Введём единый порядок подготовки островных гарнизонов КНИЛ — регулярной колониальной армии. Её национальный дух получит дополнительный бонус к обороне."
 A01_marine_brigades:0 "Морские бригады"
 A01_marine_brigades_desc:0 "Для возвращения потерянных портов нужны части, способные высадиться с моря. Морские бригады будут обучаться вместе с корабельными командами."
 A01_jungle_supply:0 "Островная служба снабжения"
 A01_jungle_supply_desc:0 "Полевые инструкции и общее снабжение улучшат дух КНИЛ — регулярной ост-индской армии: организация возрастёт, подготовка ускорится, расход припасов снизится."
 A01_coastal_watch:0 "Береговая наблюдательная служба"
 A01_coastal_watch_desc:0 "Сведём наблюдение за побережьями и островную оборону в единый порядок. Будет добавлен национальный дух островной обороны."
 A01_admiralty_shipyards:0 "Верфи Адмиралтейства"
 A01_admiralty_shipyards_desc:0 "Адмиральский режим направит казённые средства на расширение верфей Сурабаи. Контроль над морем потребует постоянного пополнения флота."
 A01_naval_general_staff:0 "Морской генеральный штаб"
 A01_naval_general_staff_desc:0 "Разрозненные эскадры нуждаются в едином плане. Морской генеральный штаб согласует разведку, ремонт и боевое развёртывание."
 A01_military_industry:0 "Военные предприятия"
 A01_military_industry_desc:0 "Прямые заказы администрации позволят расширить яванские оружейные мастерские. Военные предприятия получат приоритет при распределении материалов."
 A01_defence_in_depth:0 "Оборона в глубину"
 A01_defence_in_depth_desc:0 "Удержать каждую бухту невозможно. Подготовленные рубежи и резервы позволят сдержать противника после высадки и выиграть время для контрудара."
 A01_archipelago_command:0 "Единое командование архипелага"
 A01_archipelago_command_desc:0 "Армия и флот должны защищать один архипелаг, а не собственные ведомственные интересы. Единое командование объединит планы обороны."
 A01_wartime_industry:0 "Мобилизация промышленности"
 A01_wartime_industry_desc:0 "Мирные контракты уступят место срочным оборонным заказам. Дополнительный выпуск оружия потребует отвлечь рабочих и материалы от гражданских нужд."
 A01_secure_sea_lanes:0 "Защита морских коммуникаций"
 A01_secure_sea_lanes_desc:0 "Конвойные маршруты получат общие правила охранения. Координация морского охранения повысит организацию флота; торговля также получит новые транспорты."
 A01_pacific_settlement:0 "Тихоокеанское урегулирование"
 A01_pacific_settlement_desc:0 "Поражение ставит вопрос о том, кому принадлежит власть. Этот фокус открывает главную послевоенную развилку: сохранить гражданский кабинет Людольфа и начать реформы или передать государство Совету адмиралов. Начинаются слушания о смещении губернатора; выбор ветви определит дальнейшие преобразования."
 A03_imperial_council:0 "Императорский совет"
 A03_imperial_council_desc:0 "Двор в Киото должен определить место империи в раздробленном Тихоокеанском мире. Совет согласует требования промышленников, армии и флота, прежде чем выбрать новый курс."
 A03_civil_government:0 "Гражданский кабинет"
 A03_civil_government_desc:0 "Гражданские министры предлагают укрепить империю через устойчивые финансы и торговлю. Военные сохранят влияние, но не будут определять каждый государственный заказ."
 A03_naval_government:0 "Морской кабинет"
 A03_naval_government_desc:0 "Морское ведомство берёт на себя руководство кабинетом. Безопасность проливов и снабжение заморских баз станут главными государственными задачами."
 A03_prefectural_reform:0 "Префектурная реформа"
 A03_prefectural_reform_desc:0 "Общие правила налогообложения и отчётности укрепят связь столицы с префектурами. Правительство получит средства для последовательной программы реформ."
 A03_commercial_diplomacy:0 "Торговая дипломатия"
 A03_commercial_diplomacy_desc:0 "Торговые дома способны открыть двери, закрытые для военных делегаций. Поддержим постоянные представительства в главных портах Тихого океана."
 A03_batavia_convention:0 "Батавская конвенция"
 A03_batavia_convention_desc:0 "Морские перевозчики заинтересованы в каучуке и нефти Ост-Индии. Предложим Батавии взаимные гарантии и торговый договор: безопасность поставок может стоить больше, чем завоевание."
 A03_pacific_prosperity:0 "Тихоокеанское процветание"
 A03_pacific_prosperity_desc:0 "Договор с Батавией обеспечил поставки сырья. Теперь промышленники Кансая смогут вкладывать средства в новые фабрики, рассчитывая на устойчивую торговлю."
 A03_southern_strategy:0 "Южная стратегия"
 A03_southern_strategy_desc:0 "Южные морские пути ведут к сырью и опорным пунктам империи. Штаб флота подготовит общий план действий на случай провала дипломатии."
 A03_resource_commission:0 "Императорская ресурсная комиссия"
 A03_resource_commission_desc:0 "Промышленности нужен точный учёт запасов и поставок. Ресурсная комиссия согласует потребности заводов с возможностями торгового флота."
 A03_batavia_ultimatum:0 "Ультиматум Батавии"
 A03_batavia_ultimatum_desc:0 "Потребуем доступа к сырью Борнео независимо от курса Батавии. Отказ Нидерландов означает немедленную войну."
 A03_southern_bases:0 "Южные опорные пункты"
 A03_southern_bases_desc:0 "Палау станет промежуточной базой между метрополией и южными морями. Новые мастерские и транспортные суда поддержат длительную кампанию."
 A03_southern_campaign:0 "Южная кампания"
 A03_southern_campaign_desc:0 "Батавия отвергла требования империи. Флоту предстоит прикрыть десантную операцию, целью которой станут нефтяные районы Борнео."
 A03_southern_reconstruction:0 "Восстановление южных владений"
 A03_southern_reconstruction_desc:0 "Захваченные нефтяные районы должны вернуться к работе. Восстановим мастерские, порты и гражданское производство Восточного Калимантана."
 A03_osaka_industry:0 "Осакский промышленный район"
 A03_osaka_industry_desc:0 "Осакские торговые дома и мастерские способны стать основой современной промышленности. Государство поддержит строительство крупных фабрик."
 A03_kansai_railways:0 "Железные дороги Кансая"
 A03_kansai_railways_desc:0 "Железные дороги соединят заводы Осаки с промышленными районами Нагои. Регулярные перевозки сократят расходы и ускорят развёртывание войск."
 A03_hiroshima_arsenal:0 "Хиросимский арсенал"
 A03_hiroshima_arsenal_desc:0 "Хиросимские мастерские получат оборудование для серийного выпуска оружия. Расширение арсенала сократит зависимость армии от иностранных поставщиков."
 A03_steel_contracts:0 "Контракты на сталь"
 A03_steel_contracts_desc:0 "Долгосрочные контракты дадут металлургам уверенность в будущих заказах. Стабильные поставки металла ускорят строительство предприятий."
 A03_standard_rifles:0 "Единый образец винтовки"
 A03_standard_rifles_desc:0 "Разнородные винтовки затрудняют снабжение полков. Единый образец оружия и общие требования к деталям упростят производство и ремонт."
 A03_imperial_university:0 "Императорский технический университет"
 A03_imperial_university_desc:0 "Инженерные кафедры должны работать вместе с арсеналами и верфями. Новый университет обеспечит промышленность собственными специалистами."
 A03_electrical_workshops:0 "Электротехнические мастерские"
 A03_electrical_workshops_desc:0 "Телеграфы, генераторы и измерительные приборы требуют новых производственных навыков. Создадим предприятия для растущей электротехнической отрасли."
 A03_industrial_power:0 "Промышленная держава"
 A03_industrial_power_desc:0 "Сеть арсеналов должна выпускать оружие в масштабах всей империи. Расширение предприятий Хиросимы завершит первую промышленную программу."
 A03_naval_programme:0 "Императорская кораблестроительная программа"
 A03_naval_programme_desc:0 "Разовые закупки не создают сильного флота. Программа строительства в Нагасаки обеспечит регулярную закладку и ремонт кораблей."
 A03_kure_yards:0 "Верфи Куре"
 A03_kure_yards_desc:0 "Гавани Куре подходят для создания крупного судостроительного центра. Расширенные доки позволят обслуживать растущую эскадру."
 A03_merchant_marine:0 "Торговый флот"
 A03_merchant_marine_desc:0 "Без торговых судов заморские базы останутся без снабжения. Государственные заказы пополнят тоннаж и подготовят новые экипажи."
 A03_naval_academy:0 "Морская академия"
 A03_naval_academy_desc:0 "Офицерам необходимы общие знания навигации, артиллерии и управления соединениями. Академия введёт единые стандарты подготовки флота."
 A03_island_supply:0 "Островные конвои"
 A03_island_supply_desc:0 "Снабжение дальних гарнизонов требует точного расписания рейсов и запасных складов. Организуем постоянную службу островных конвоев."
 A03_fleet_exercises:0 "Манёвры Объединённого флота"
 A03_fleet_exercises_desc:0 "Корабли должны учиться действовать вместе до начала войны. Большие манёвры проверят связь, разведку и взаимодействие эскадр."
 A03_army_reorganisation:0 "Реорганизация императорской армии"
 A03_army_reorganisation_desc:0 "Единые штаты и постоянные полевые сборы укрепят армию западных префектур. Опыт частей станет основой общих наставлений."
 A03_conscription_register:0 "Воинский учёт"
 A03_conscription_register_desc:0 "Полные списки военнообязанных позволят заранее подготовить пополнение. Резервисты пройдут обучение, прежде чем получат боевые назначения."
 A03_landing_forces:0 "Десантные отряды"
 A03_landing_forces_desc:0 "Борьба за острова требует особой подготовки. Десантные отряды освоят высадку, захват причалов и удержание плацдармов."
 A03_field_artillery:0 "Полевая артиллерия"
 A03_field_artillery_desc:0 "Пехота нуждается в надёжной огневой поддержке. Расширение оружейных предприятий Сикоку обеспечит основу артиллерийского снабжения."
 A03_expeditionary_staff:0 "Экспедиционный штаб"
 A03_expeditionary_staff_desc:0 "Заморская операция начинается с расчёта грузов и маршрутов. Экспедиционный штаб согласует перевозки, высадку и снабжение войск."
 A03_combined_operations:0 "Совместные операции"
 A03_combined_operations_desc:0 "Армейские и морские штабы проведут общие учения. Только согласованные действия позволят развить успех после захвата побережья."
 A01_knil_training:0 "Подготовка колониальной армии (КНИЛ)"
 A01_knil_training_desc:0 "КНИЛ — Королевская нидерландская ост-индская армия (KNIL), регулярные сухопутные войска архипелага. Общие программы подготовки делают гарнизоны и полевые части более организованными. Это кадровая армия; временное добровольческое ополчение формируется отдельно."
 A01_island_defence:0 "Оборона архипелага"
 A01_island_defence_desc:0 "Оборона архипелага: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A01_colonial_administration:0 "Колониальная администрация"
 A01_colonial_administration_desc:0 "Колониальная администрация: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A01_naval_staff:0 "Штаб Адмиралтейства"
 A01_naval_staff_desc:0 "Штаб Адмиралтейства: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A01_war_production:0 "Оборонные заказы"
 A01_war_production_desc:0 "Оборонные заказы повышают выпуск заводов ценой дополнительных потребительских расходов. Программа начинается до войны с Японией, действует во время неё и снимается после заключения мира."
 A03_commercial_network:0 "Тихоокеанская торговая сеть"
 A03_commercial_network_desc:0 "Тихоокеанская торговая сеть: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A03_industrial_contracts:0 "Промышленные контракты"
 A03_industrial_contracts_desc:0 "Промышленные контракты: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A03_army_reform:0 "Армейская реформа"
 A03_army_reform_desc:0 "Армейская реформа: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A03_landing_force:0 "Императорские десантные силы"
 A03_landing_force_desc:0 "Императорские десантные силы: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 pacific_trade_accord_idea:0 "Батавская торговая конвенция"
 pacific_trade_accord_idea_desc:0 "Батавская торговая конвенция: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 pacific.1.t:0 "Предложение Батавии"
 pacific.1.d:0 "Батавия предлагает гарантированные поставки каучука в обмен на взаимное ненападение. Промышленники поддерживают соглашение, но морское ведомство требует контроля над источниками сырья."
 pacific.1.a:0 "Подписать торговое соглашение."
 pacific.1.b:0 "Они сами еле на ногах держатся."
 pacific.2.t:0 "Конвенция подписана"
 pacific.2.d:0 "Договор с Японией обеспечивает рынки сбыта и взаимные гарантии ненападения. Порты готовятся принять первые торговые суда."
 pacific.2.a:0 "Дипломатия принесла результат."
 pacific.3.t:0 "Японская торговая миссия"
 pacific.3.d:0 "Японские представители предлагают торговую конвенцию и взаимное ненападение. Принятие договора обеспечит инвестиции, но свяжет нашу торговлю с империей."
 pacific.3.a:0 "Принять условия."
 pacific.3.b:0 "Наши порты останутся независимыми."
 pacific.4.t:0 "Требования морского ведомства"
 pacific.4.d:0 "Япония требует привилегированного доступа к сырью Борнео. Согласие сохранит мир ценой экономических уступок. Отказ означает немедленное объявление войны."
 pacific.4.a:0 "Уступить ради мира."
 pacific.4.b:0 "Отвергнуть ультиматум. Мы будем защищаться."
 A03_imperial_council_name:0 "Императорский совет Киото"
 A03_army_commander_name:0 "Штаб Западной армии"
 A01_admiralty_diplomacy:0 "Дипломатия канонерок"
 A01_admiralty_diplomacy_desc:0 "Адмиралы уверены, что усиленный флот заставит Японию считаться с Батавией. Предложим торговые гарантии с позиции силы, сохранив готовность защищать Борнео."

 A01_before_japanese_war_tt:0 "Война с Японской империей ещё не началась"
 A01_borneo_fortification_directorate:0 "Управление укреплений Борнео"
 A01_borneo_fortification_directorate_desc:0 "Военные инженеры готовят портовые оборонительные позиции. На 180 дней скорость строительства сухопутных и береговых укреплений повышается на 15%. Программа не даёт общего бонуса к защите армии."

 A01_direct_rivalry:0 "Прямое соперничество"
 A01_direct_rivalry_desc:0 "Батавия открыто оспорит японское господство. Стабильность снизится на 5%, авторитет Людольфа вырастет на 10 пунктов. Этот курс не запускает и не сбрасывает независимый японский отсчёт."
 pacific.5.t:0 "Батавия бросает вызов"
 pacific.5.d:0 "Нидерландское правительство объявило курс на прямое соперничество с Японией. Морское ведомство предлагает ответить подготовкой экспедиции на Борнео."
 pacific.5.a:0 "Они сами еле на ногах держатся."

 pacific.6.t:0 "Токио принимает вызов"
 pacific.6.d:0 "Япония ответила на объявленное соперничество угрозой морской экспедиции. Её подготовка идёт независимо от наших дипломатических шагов. Нам предстоит подготовить Борнео к обороне."

 A01_japanese_preparations_reduction_tt:0 "Японские приготовления уже сократили общий срок до вторжения на §R15 дней§!. Нажатие этой кнопки не сокращает срок повторно."

 borneo_project.1.t:0 "Три проекта обороны Борнео"
 borneo_project.1.d:0 "Инспекция выявила слабость береговых позиций. Британия предлагает бетон и инженеров; Австралия — материалы и специалистов в обмен на гарантии по Новой Гвинее. Индонезийские общины готовы строить земляные валы, препятствия и скрытые тропы. Каждый проект имеет свою цену. Защитный бонус появится после завершения фокуса «Реализация проекта»."
 borneo_project.1.a:0 "Британские инженеры и бетон."
 borneo_project.1.b:0 "Австралийские материалы и специалисты."
 borneo_project.1.c:0 "Довериться местным общинам."
 A01_wtc_debt_20_tt:0 "Долг перед ВТП увеличится на §R20 пунктов§! по шкале процентов долговой нагрузки."
 A01_own_fortifications_tt:0 "Защита против Японии: §G+20%§!. Британия: §R−10§! отношения. Долговые обязательства сохраняются после войны."
 A01_project_selected_tt:0 "Выбран один из трёх проектов обороны."
 A01_project_implementation_tt:0 "Будет введён в действие бонус защиты выбранного проекта против Японии."
 A01_british_project_tt:0 "Потеря суверенитета: §R+10§! пунктов. Влияние Британии: §R+15§! пунктов. После реализации: §G+15%§! защиты против Японии."
 A01_australian_project_tt:0 "Австралия: §G+10§! отношения. Принимаются гарантии по Новой Гвинее; «Укрепить австралийский рубеж» станет недоступен. После реализации: §G+10%§! защиты против Японии."
 A01_local_project_tt:0 "Рекрутируемое население: §G+15%§!. Стабильность расового раскола: §G+10%§!. Уважение адмиралов: §R−5§! пунктов. После реализации: §G+5%§! защиты против Японии."
 A01_no_australian_guarantees_tt:0 "Нет обязательства перед Австралией не укреплять рубеж Новой Гвинеи."
 A01_borneo_british_exclusion:0 "Британия исключена из оборонного проекта"
 A01_borneo_australian_cooperation:0 "Совместный оборонный проект"
 A01_state_loan:0 "Государственный заём"
 A01_state_loan_desc:0 "Заём у ВТП увеличит долговые обязательства на 20 пунктов. Прирост политической власти снизится на 10%. Средства позволят начать собственное строительство."
 A01_own_fortifications:0 "Собственные укрепления"
 A01_own_fortifications_desc:0 "Собственная программа даёт +20% защиты против Японии. На стройку направляются дополнительные 5% потребительских фабрик; выплаты требуют 0,10 политической власти в день. Британия теряет 10 пунктов отношения к нам. Будет построена железная дорога между портами Сабаха."
 A01_request_fortification_project:0 "Запросить проект"
 A01_request_fortification_project_desc:0 "Правительство рассмотрит британское и австралийское предложения, а также план индонезийских общин. Выбрать можно только один проект. Бонус защиты начнёт действовать после реализации."
 A01_implement_fortification_project:0 "Реализация проекта"
 A01_implement_fortification_project_desc:0 "Выполним выбранный план и свяжем порты Сабаха железной дорогой. Защита против Японии: британский проект +15%, австралийский +10%, местный +5%."
 A01_borneo_state_loan:0 "Заём ВТП на оборону"
 A01_borneo_state_loan_desc:0 "Заём увеличил долговую нагрузку ВТП на 20 пунктов. Обслуживание обязательств снижает прирост политической власти на 10%.\nТекущий долг: [?A01_wtc_debt|0] пунктов."
 A01_borneo_self_build:0 "Государственная программа укреплений"
 A01_borneo_self_build_desc:0 "Собственные укрепления повышают защиту против Японии на 20%. Строительство и долг отвлекают фабрики и политические ресурсы. Военный бонус снимается после окончания кампании, выплаты сохраняются."
 A01_borneo_debt_service:0 "Обслуживание оборонного займа"
 A01_borneo_debt_service_desc:0 "После окончания войны сохраняются выплаты по займу и обязательства перед подрядчиками."
 A01_borneo_british_commitments:0 "Британская инженерная миссия"
 A01_borneo_british_commitments_desc:0 "Британское влияние выросло на 15 пунктов, потеря суверенитета — на 10. Согласование с иностранными советниками снижает прирост политической власти на 10%.\nВлияние Британии: [?A01_british_influence|0]. Потеря суверенитета: [?A01_sovereignty_loss|0]."
 A01_borneo_british_defence:0 "Британский проект обороны"
 A01_borneo_british_defence_desc:0 "Современные бетонные позиции дают +15% защиты против Японии до окончания кампании."
 A01_borneo_australian_commitments:0 "Гарантии по Новой Гвинее"
 A01_borneo_australian_commitments_desc:0 "Австралийское участие улучшает отношения на 10 пунктов. Мы обязуемся не укреплять направленный против Австралии рубеж: соответствующий фокус недоступен."
 A01_borneo_australian_defence:0 "Австралийский проект обороны"
 A01_borneo_australian_defence_desc:0 "Материалы и специалисты Австралии дают +10% защиты против Японии до окончания кампании."
 A01_borneo_local_commitments:0 "Сотрудничество с индонезийскими общинами"
 A01_borneo_local_commitments_desc:0 "Общины обеспечивают +15% рекрутируемого населения. Расовый раскол смягчён на 10 пунктов стабильности, но уважение адмиралов к губернатору снижено на 5 пунктов."
 A01_borneo_local_defence:0 "Местная система обороны"
 A01_borneo_local_defence_desc:0 "Земляные позиции, препятствия и скрытые тропы дают +5% защиты против Японии до окончания кампании."

 A01_repair_ports:0 "Восстановить порты и мастерские"
 A01_repair_ports_desc:0 "Ремонт снимает штраф разрушений: −10% строительства и −10% выпуска заводов. Восстановленные коммуникации дадут −5% расхода снабжения. Стоимость — 40 политической власти."
 A01_families_compensation:0 "Пенсии семьям погибших"
 A01_families_compensation_desc:0 "Установим выплаты вдовам, детям и инвалидам войны. Снимается штраф невыплаченных компенсаций; стабильность +3%. Стоимость — 35 политической власти."
 A01_wtc_settlement:0 "Погасить обязательства через ВТП"
 A01_wtc_settlement_desc:0 "ВТП закрывает долг, финансирует ремонт и выплаты семьям. Снимаются финансовые и восстановительные штрафы, обязательства по оборонному займу; все три счётчика задолженности обнуляются."
 A01_domestic_debt_redemption:0 "Выкупить долговые обязательства"
 A01_domestic_debt_redemption_desc:0 "Погасим прежние займы без нового соглашения с ВТП. Снимаются штрафы оборонного займа, долг обнуляется. Стоимость — 75 политической власти."
 A01_recovery_investment:0 "От восстановления к развитию"
 A01_recovery_investment_desc:0 "После погашения обязательств начнём новые инвестиции: одна гражданская фабрика на Яве и +5% скорости строительства."
 A01_demobilise_colonial_army:0 "Демобилизация и возвращение домой"
 A01_demobilise_colonial_army_desc:0 "Завершим принудительный военный призыв и введём переходный порядок службы. Армии предстоит переучивание: −5% организации; поддержка войны −3%."
 A01_joint_officer_schools:0 "Совместные офицерские училища"
 A01_joint_officer_schools_desc:0 "Откроем офицерскую карьеру нидерландцам и индонезийцам. Переходный штраф снимается; организация +5%, время подготовки −5%, опыт армии +15."
 A01_civilian_defence_ministry:0 "Гражданское министерство обороны"
 A01_civilian_defence_ministry_desc:0 "Передадим бюджет и назначения гражданскому министру. Политическая власть +25; уважение адмиралов −5 пунктов."
 A01_federal_defence_command:0 "Единое федеральное командование"
 A01_federal_defence_command_desc:0 "Объединим штаб армии, флота и островных гарнизонов под гражданским контролем. Расход снабжения −5%, организация флота +5%."
 A01_abolish_admirals_council:0 "Упразднить Совет адмиралов"
 A01_abolish_admirals_council_desc:0 "Совет лишится права ограничивать гражданское правительство. Его национальный модификатор удаляется; стабильность +3%. Морские офицеры сохраняют военную службу."
 A01_federal_constitution:0 "Конституция двух народов"
 A01_federal_constitution_desc:0 "Закрепим равные права, полномочия островов и ответственность правительства перед парламентом. Конституция даст +5% стабильности и +0,05 политической власти в день."
 A01_legalise_federal_parties:0 "Легализовать федеральные партии"
 A01_legalise_federal_parties_desc:0 "Либералы, консерваторы и Народная партия получат равные права на участие в выборах. Политическая власть +25."
 A01_first_federal_election:0 "Первые федеральные выборы"
 A01_first_federal_election_desc:0 "Проведём первые выборы. Событие определит победившую партию и главу правительства; после объявления результата откроется только её ветка."
 A01_liberal_victory:0 "Победа Либералов"
 A01_liberal_victory_desc:0 "Победившая партия принимает мандат избирателей. Политическая власть +25. Продолжение партийной ветки пока не добавлено."
 A01_conservative_victory:0 "Победа Консерваторов"
 A01_conservative_victory_desc:0 "Победившая партия принимает мандат избирателей. Политическая власть +25. Продолжение партийной ветки пока не добавлено."
 A01_peoples_party_victory:0 "Победа Народной Партии"
 A01_peoples_party_victory_desc:0 "Победившая партия принимает мандат избирателей. Политическая власть +25. Продолжение партийной ветки пока не добавлено."
 A01_wtc_offer_required_tt:0 "Выполнено «Предложение для ВТП» и существует ВТП."
 A01_postwar_destruction:0 "Разрушенные порты и мастерские"
 A01_postwar_destruction_desc:0 "Ремонтные обязательства: [?A01_reconstruction_costs|0] пунктов. Снимается восстановлением портов или финансированием ВТП."
 A01_unpaid_families:0 "Невыплаченные компенсации семьям"
 A01_unpaid_families_desc:0 "Обязательства перед семьями: [?A01_family_compensation_costs|0] пунктов. Снимается выплатой пенсий или финансированием ВТП."
 A01_postwar_budget_burden:0 "Расходы послевоенного восстановления"
 A01_postwar_budget_burden_desc:0 "Ремонт и социальные обязательства отвлекают 5% фабрик на потребительские товары и 0,10 политической власти в день. Снимается государственным фондом или погашением через ВТП."
 A01_civilian_reform_mandate:0 "Гражданский мандат Людольфа"
 A01_civilian_reform_mandate_desc:0 "Временный гражданский мандат поддерживает Людольфа во время реформ: +0,05 политической власти в день. Заменяется ответственной гражданской службой."
 A01_restored_port_network:0 "Восстановленная портовая сеть"
 A01_restored_port_network_desc:0 "Отремонтированные гавани и склады сокращают расход снабжения на 5%."
 A01_wtc_recovery_guarantees:0 "Коммерческие гарантии ВТП"
 A01_wtc_recovery_guarantees_desc:0 "Годовые коммерческие обязательства перед ВТП снижают предел эффективности производства на 5%. По истечении 365 дней дух снимается автоматически."
 A01_recovery_investment_idea:0 "Инвестиции после восстановления"
 A01_recovery_investment_idea_desc:0 "Погашенные обязательства позволяют направлять средства в строительство: скорость строительства +5%."
 A01_army_transition:0 "Армия в переходный период"
 A01_army_transition_desc:0 "Демобилизация и перестройка службы временно снижают организацию армии на 5%. Снимается совместными офицерскими училищами."
 A01_joint_officer_corps:0 "Общий офицерский корпус"
 A01_joint_officer_corps_desc:0 "Равный доступ к офицерской карьере укрепляет кадровую армию: организация +5%, время подготовки −5%."
 A01_federal_defence_command_idea:0 "Федеральное оборонное командование"
 A01_federal_defence_command_idea_desc:0 "Общий штаб армии, флота и гарнизонов: расход снабжения −5%, организация флота +5%."
 A01_island_representation_idea:0 "Представительство островов"
 A01_island_representation_idea_desc:0 "Островные делегации участвуют в подготовке федерации: стабильность +3%. При создании федерации представительство становится постоянным государственным институтом."
 A01_federal_constitution_idea:0 "Федеральная конституция"
 A01_federal_constitution_idea_desc:0 "Равноправие народов и парламентская ответственность закреплены конституцией: стабильность +5%, политическая власть +0,05 в день."
 A01_accountable_civil_service:0 "Ответственная гражданская служба"
 A01_accountable_civil_service_desc:0 "Постоянная гражданская администрация: прирост политической власти +5%, стоимость армейских советников −5%."
