l_russian:
 A01_accept_naval_appointments:0 "Принять назначения Совета"
 A01_accept_naval_appointments_desc:0 "Адмиралы займут новые административные посты."
 A01_admiralty_deadline:0 "Совет затягивает следствие"
 A01_admiralty_deadline_desc:0 "Следствие должно завершиться судом, отстранением виновных или соглашением об отставке. Если слушания затянутся, Совету придётся предложить новую уступку ради их продолжения."
 A01_archipelago_naval_exercises:0 "Общие манёвры архипелага"
 A01_archipelago_naval_exercises_desc:0 "Штаб короны и султанские командиры отработают защиту проливов. Мы получим 20 морского опыта, каждый автономный султанат — 10. Доступно один раз."
 A01_audit_naval_contracts:0 "Проверить флотские контракты"
 A01_audit_naval_contracts_desc:0 "Проверка счетов добавит один комплект доказательств."
 A01_audit_wtc_contracts:0 "Проверить договоры ВТП"
 A01_audit_wtc_contracts_desc:0 "Пересмотрим договоры с ВТП и устраним условия, дающие компании чрезмерное влияние на администрацию. Прозрачные обязательства укрепят доверие к правительству."
 A01_back_admiralty_inquiry:0 "Поддержать расследование Совета"
 A01_back_admiralty_inquiry_desc:0 "Передать новые материалы военной комиссии, усилив позиции адмиралов."
 A01_batavian_congress_category:0 "Батавский съезд"
 A01_batavian_congress_category_desc:0 "Раз в два года Военно-морская коллегия созывает представителей колониальной администрации для пересмотра законов о призыве, экономике и торговле. Съезд завершится после выбора одного из трёх курсов; следующий созыв состоится через два года."
 A01_bilingual_ballots:0 "Бюллетени на местных языках"
 A01_bilingual_ballots_desc:0 "Помочь островным округам участвовать в выборах."
 A01_campaign_constitutional:0 "Агитация: Конституционный союз"
 A01_campaign_constitutional_desc:0 "Поддержим агитацию Конституционного союза за открытый бюджет и парламентскую ответственность. Его сторонникам нужны собрания, печатные листки и возможность донести программу до островов."
 A01_campaign_indonesian:0 "Агитация: Индонезийская коалиция"
 A01_campaign_indonesian_desc:0 "Поддержим выступления Индонезийской коалиции за школы и равный доступ к назначениям. Представители островов должны услышать её программу на понятном им языке."
 A01_campaign_order:0 "Агитация: Партия порядка"
 A01_campaign_order_desc:0 "Поможем Партии порядка представить свою программу сильного флота и гарантий местным дворам. Согласованная агитация объединит тех, кто опасается слишком быстрых перемен."
 A01_coalition_roundtable:0 "Круглый стол трёх партий"
 A01_coalition_roundtable_desc:0 "Договориться о представительстве индонезийцев и урегулировать скандал."
 A01_concede_naval_budget:0 "Уступить Совету часть бюджета"
 A01_concede_naval_budget_desc:0 "Морское ведомство получит больше контроля над заказами."
 A01_congress_loosen_laws:0 "Ослабить законы"
 A01_congress_loosen_laws_desc:0 "Спокойная обстановка позволяет сократить чрезвычайные расходы. Вернёмся к добровольной службе, гражданским заказам и свободной торговле. Новый порядок сохранится до следующего пересмотра законов съездом."
 A01_congress_maintain_laws:0 "Сохранить действующий курс"
 A01_congress_maintain_laws_desc:0 "Совет не станет нарушать сложившееся равновесие между флотом, промышленниками и колониальной администрацией.\n\n§YПосле принятия решения:§!\n— действующие законы о призыве, экономике и торговле останутся без изменений;\n— следующий Батавский съезд состоится через §Y2 года§!."
 A01_congress_tighten_laws:0 "Ужесточить законы"
 A01_congress_tighten_laws_desc:0 "Угроза войны и волнения на островах требуют дополнительных сил. Съезд утвердит ограниченный призыв, перевод части промышленности на военные заказы и ограничение вывоза необходимых товаров. Следующий пересмотр законов состоится на очередном съезде."
 A01_convene_council_of_sultans:0 "Созвать Совет султанов"
 A01_convene_council_of_sultans_desc:0 "При посредничестве ВТП местные правители публично подтвердят верность Батавии. Взамен администрация повторно гарантирует выплаты семьям и защиту имущества. Съезд должен укрепить доверие между островами и правительством."
 A01_council_concessions:0 "Согласовать бюджет с Советом"
 A01_council_concessions_desc:0 "Согласуем бюджет с Советом адмиралов. Уступка ограничит самостоятельность двора, зато позволит провести расходы без нового противостояния."
 A01_council_relations:0 "Губернатор и Совет адмиралов"
 A01_council_relations_desc:0 "§YУважение Совета: [?A01_admirals_respect|0]/100§!\n\nУступки передают полномочия адмиралам, но повышают их готовность сотрудничать. Манёвры, открытые счета и выполнение обещаний укрепляют уважение без отказа от гражданской власти. После поражения низкий баланс может привести к отставке Людольфа."
 A01_crown_audiences:0 "Открытые аудиенции Королевы"
 A01_crown_audiences_desc:0 "Откроем двор для публичных аудиенций. Выслушав представителей островов, королева укрепит личный авторитет и доверие к престолу."
 A01_crown_compromise:0 "Созвать согласительную комиссию"
 A01_crown_compromise_desc:0 "Создадим согласительную комиссию двора и Совета. Участникам придётся отказаться от части требований ради устойчивого управления государством."
 A01_crown_struggle:0 "Борьба за новый порядок"
 A01_crown_struggle_desc:0 "Двор и Совет борются за право определять политику. Компромисс может привести к конституционному порядку; преобладание королевы — к личному правлению. Ни одна сторона не уступит без гарантий."
 A01_exile_volunteer_register:0 "Открыть реестр добровольцев изгнания"
 A01_exile_volunteer_register_desc:0 "Архивы беженцев помогут найти подготовленных добровольцев. Государство получит 6000 людских ресурсов и 20 армейского опыта; эта программа проводится один раз."
 A01_extend_cabinet_hearings:0 "Продлить слушания о кабинете"
 A01_extend_cabinet_hearings_desc:0 "Промедление даст время реформам, но усилит усталость общества."
 A01_fund_widows:0 "Помощь семьям погибших"
 A01_fund_widows_desc:0 "Выплаты семьям моряков уменьшат ожесточение в портах."
 A01_future_contest:0 "Спор о будущем Нидерландов"
 A01_guard_oaths:0 "Присяга офицеров Королеве"
 A01_guard_oaths_desc:0 "Приведём гвардию к личной присяге королеве. Двор получит надёжную опору, но противники увидят в церемонии угрозу привычному порядку власти."
 A01_hear_island_delegates:0 "Принять делегатов островов"
 A01_hear_island_delegates_desc:0 "Выслушать общины и усилить гражданскую сторону в споре с адмиралами."
 A01_honour_naval_officers:0 "Отметить заслуги офицеров"
 A01_honour_naval_officers_desc:0 "Губернатор лично вручит награды отличившимся экипажам."
 A01_inevitable_conflict_category:0 "Японская экспансия"
 A01_inevitable_conflict_category_desc:0 "Японский флот готовится к борьбе за Борнео. Батавии необходимо укрепить оборону и использовать оставшееся время для переговоров. Коммерческие уступки поддерживают торговлю, но лишь политическое соглашение способно остановить поход."
 A01_japanese_expansion:0 "До Борнейской конференции"
 A01_japanese_expansion_desc:0 "Борнейская конференция должна решить судьбу спорных территорий. Пока на острове остаётся японский плацдарм, Токио может требовать уступок. Чтобы отстоять прежние границы, необходимо вытеснить десант с Борнео до начала переговоров."
 A01_japanese_invasion_countdown:0 "До японского ультиматума"
 A01_japanese_invasion_countdown_desc:0 "Японский ультиматум назначен на 1 июня 1893 года. Если Батавия откажется уступить северный Борнео, 1 сентября Япония начнёт войну. До этого срока необходимо подготовить оборону или добиться соглашения."
 A01_joint_naval_exercises:0 "Провести совместные манёвры"
 A01_joint_naval_exercises_desc:0 "Совместная инспекция и учения подтвердят серьёзность оборонной программы."
 A01_lease_brunei:0 "Передать Бруней в аренду на полгода"
 A01_lease_brunei_desc:0 "Аренда не меняет дату Борнейского кризиса. Во время войны возврат откладывается; мирный договор может закрепить японское владение."
 A01_meet_princely_envoys:0 "Принять послов султанатов"
 A01_meet_princely_envoys_desc:0 "Пригласим посланников местных дворов обсудить сбор налогов и правосудие. Постоянный разговор позволит заменить подозрения взаимными обязательствами."
 A01_mobilize_colonial_police:0 "Мобилизовать колониальную полицию"
 A01_mobilize_colonial_police_desc:0 "Вооружим резервистов, портовую охрану и сельские полицейские отряды, чтобы прикрыть склады и коммуникации от диверсантов. Оборона станет надёжнее, но мастерские лишатся части рабочих рук."
 A01_monarchy_category:0 "Будущее короны"
 A01_motion_to_dismiss_ludolf:0 "Рассмотрение вопроса о смещении Людольфа"
 A01_motion_to_dismiss_ludolf_desc:0 "Совет рассматривает ответственность Людольфа за поражение. Губернатору необходимо представить убедительную программу реформ и заручиться поддержкой островов. Если слушания затянутся, адмиралы потребуют решающего голосования о его отставке."
 A01_new_republic:0 "Новая политика Людольфа"
 A01_new_republic_desc:0 "Реформы требуют денег и общественного доверия. Влияние ВТП: §Y[?A01_wtc_influence|0]/100§!. При 50 и выше компания получает экономические уступки: растут потребительские расходы и падает политический ресурс правительства."
 A01_open_admiralty_accounts:0 "Открыть счета Адмиралтейства"
 A01_open_admiralty_accounts_desc:0 "Прозрачные закупки уменьшат взаимные подозрения."
 A01_open_seas_convention:0 "Конвенция общего торгового моря"
 A01_open_seas_convention_desc:0 "Согласовать портовые правила султанатов и короны. Вклады в гражданские предприятия дадут одну фабрику в столице и политическую поддержку автономных партнёров. Доступно один раз."
 A01_pay_the_captains:0 "Выплатить жалованье капитанам"
 A01_pay_the_captains_desc:0 "Гарантировать жалованье вместо раздачи политических должностей."
 A01_peace_request_category:0 "Переговоры с Японией"
 A01_peace_request_category_desc:0 "При японском контроле хотя бы одной провинции Борнео можно предложить досрочный мир на японских условиях."
 A01_postwar_reconstruction:0 "Перестройка Ост-Индии"
 A01_postwar_reconstruction_desc:0 "Борнейская конвенция изменила границы, но не сняла противоречий между губернатором, флотом и местными правителями. Автономные султанаты сохранят подчинение Батавии и японские ресурсные права."
 A01_request_japanese_terms:0 "Запросить японские условия мира"
 A01_request_japanese_terms_desc:0 "Обратиться в Токио с предложением Борнейской конвенции. Япония может принять или отклонить запрос. Аренда Брунея тоже считается японским контролем."
 A01_review_charter_courts:0 "Совместная ревизия островных судов"
 A01_review_charter_courts_desc:0 "Проверить исполнение хартий гражданскими и княжескими судьями. Устранение произвольных поборов укрепит стабильность страны и автономных султанатов. Доступно один раз."
 A01_royal_ballot:0 "Выборы премьер-министра"
 A01_royal_ballot_desc:0 "Действующий премьер-министр: §Y[Root.GetA01RoyalPremier]§!.\nПоддержка блоков: Конституционный союз §Y[?A01_vote_constitutional|0]§!, Партия порядка §Y[?A01_vote_order|0]§!, Индонезийская коалиция §Y[?A01_vote_indonesian|0]§!.\nПобеждает блок с наибольшей поддержкой. При равенстве: индонезийская коалиция, затем партия порядка."
 A01_royal_election_campaign:0 "90 дней до голосования"
 A01_royal_election_campaign_desc:0 "После окончания кампании избирательная комиссия определит победивший блок по поддержке."
 A01_royal_election_term:0 "Срок полномочий кабинета"
 A01_royal_election_term_desc:0 "Парламент готовится к очередным выборам по установленному конституцией порядку. Действующий кабинет продолжает работу до объявления нового результата."
 A01_royal_institutions:0 "Корона, адмиралы и острова"
 A01_royal_institutions_desc:0 "Доказательства: §Y[?A01_admiralty_evidence|0]§! / 3. Лояльность капитанов: §Y[?A01_fleet_loyalty|0]§! / 2. Доверие дворов: §Y[?A01_sultan_confidence|0]§!.\nСуд требует доказательств и капитанов; чистка требует гвардии и капитанов. Островной договор требует не менее 3 доверия дворов."
 A01_rubber_concession:0 "Предоставить временную каучуковую концессию"
 A01_rubber_concession_desc:0 "Предоставим японским компаниям временные права на каучук восточного Калимантана. Торговые уступки поддержат переговоры, но сами по себе не остановят военные приготовления Токио."
 A01_secure_witnesses:0 "Защитить свидетелей"
 A01_secure_witnesses_desc:0 "Охрана семей позволит капитанам выступить против Совета."
 A01_sultanate_conference:0 "Совещание автономных султанатов"
 A01_sultanate_conference_desc:0 "Согласовать оборону и бюджет с местными правителями."
 A01_supply_concession:0 "Уступить партию стрелкового оружия"
 A01_supply_concession_desc:0 "Передать Японии 1000 винтовок. Эта уступка не отменяет и не откладывает кризис."
 A01_veterans_register:0 "Единый реестр семей погибших"
 A01_veterans_register_desc:0 "Расширить выплаты и устранить двойные списки."
 A01_war_response_category:0 "Ответ на индонезийские волнения"
 A01_war_response_category_desc:0 "Японский ультиматум расколол население архипелага. Выбранный в ходе волнений курс открыл одно особое решение: силовая политика позволяет мобилизовать колониальную полицию, а соглашение с ВТП — созвать Совет султанов. После выполнения решение исчезнет."
 A01_wilhelminas_diary:0 "Дневник Вильгельмины"
 A01_wilhelminas_diary_desc:0 "Прочитать дневник принцессы и решить, поддержать ли корону в споре о послевоенной власти. Доступно с 1895 года, пока политический путь не выбран."
 A01_wtc_port_concession:0 "Портовая концессия ВТП"
 A01_wtc_port_concession_desc:0 "Компания построит гражданскую фабрику в столице в обмен на концессию."
 A01_wtc_reconstruction_credit:0 "Кредит ВТП на восстановление"
 A01_wtc_reconstruction_credit_desc:0 "Получим у ВТП средства на восстановление промышленности. Помощь ускорит возвращение к мирной жизни, но усилит влияние Палаты на решения кабинета."
 A03_advance_coaling:0 "Перенести вперёд сроки снабжения"
 A03_advance_coaling_desc:0 "Заблаговременно доставим топливо на передовые станции. Эскадрам не придётся ждать очередных угольщиков, и выход к Борнео можно будет приблизить."
 A03_charter_transports:0 "Зафрахтовать дополнительные транспорты"
 A03_charter_transports_desc:0 "Выкупим торговые суда для перевозки войск и припасов. Дополнительные транспорты позволят завершить приготовления к походу раньше намеченного срока."
 A03_final_sailing_orders:0 "Отдать окончательные приказы эскадре"
 A03_final_sailing_orders_desc:0 "Утвердим маршруты, сигналы и порядок сбора эскадр. Согласованные приказы позволят флоту раньше завершить подготовку и выйти в море."
 A03_imperial_press_campaign:0 "Имперская кампания в печати"
 A03_imperial_press_campaign_desc:0 "Газеты опубликуют обращение императора к стране. Поддержка семей военнослужащих и правдивый рассказ о целях похода должны укрепить решимость продолжать борьбу."
 A03_japanese_expansion:0 "До Борнейской конференции"
 A03_japanese_expansion_desc:0 "На Борнейской конференции дипломатам понадобятся веские основания для территориальных требований. Удержанный плацдарм даст Японии такой довод; полное вытеснение десанта заставит завершить кампанию без приобретений."
 A03_japanese_invasion_countdown:0 "До японского ультиматума"
 A03_japanese_invasion_countdown_desc:0 "Адмиралтейство рассчитывает подготовить эскадры к началу 1894 года. Дополнительные суда, передовые запасы топлива и заранее отданные приказы позволят выступить раньше. По завершении приготовлений Батавии будут предъявлены окончательные требования."
 A03_mobilize_reserves:0 "Мобилизовать резервы"
 A03_mobilize_reserves_desc:0 "Призовём резервистов и подготовим дополнительные запасы вооружения и топлива. Кампания требует новых людей и снабжения, прежде чем истощение вынудит эскадры отойти."
 A03_rush_second_wave:0 "Отправить вторую волну"
 A03_rush_second_wave_desc:0 "Перебросим к Борнео следующую волну подкреплений и вооружения. Свежие части поддержат десант и помогут закрепить занятый берег."
 A03_southern_preparations:0 "Последние приготовления к южной войне"
 A03_southern_preparations_desc:0 "Штаб готовит поход к Борнео. Дополнительные транспорты, угольные запасы и согласованные приказы позволят флоту выйти раньше. Дипломаты должны успеть предъявить требования Батавии до начала высадки."
 A03_wartime_operations:0 "Продолжение южной кампании"
 A03_wartime_operations_desc:0 "Переброска резервов и мобилизация продлевают общий срок Борнейской кампании у обеих сторон."
 A10_integrate_1026:0 "Национализация: [1026.GetName]"
 A10_integrate_1026_desc:0 "Остров признал власть Федерации. Закрепим его полноправное участие в общем государстве, распространив на жителей федеральные права и обязанности."
 A10_integrate_1027:0 "Национализация: [1027.GetName]"
 A10_integrate_1027_desc:0 "Остров признал власть Федерации. Закрепим его полноправное участие в общем государстве, распространив на жителей федеральные права и обязанности."
 A10_integrate_1085:0 "Национализация: [1085.GetName]"
 A10_integrate_1085_desc:0 "Остров признал власть Федерации. Закрепим его полноправное участие в общем государстве, распространив на жителей федеральные права и обязанности."
 A10_integrate_327:0 "Национализация: [327.GetName]"
 A10_integrate_327_desc:0 "Остров признал власть Федерации. Закрепим его полноправное участие в общем государстве, распространив на жителей федеральные права и обязанности."
 A10_integrate_623:0 "Национализация: [623.GetName]"
 A10_integrate_623_desc:0 "Остров признал власть Федерации. Закрепим его полноправное участие в общем государстве, распространив на жителей федеральные права и обязанности."
 A10_integrate_624:0 "Национализация: [624.GetName]"
 A10_integrate_624_desc:0 "Остров признал власть Федерации. Закрепим его полноправное участие в общем государстве, распространив на жителей федеральные права и обязанности."
 A10_integrate_625:0 "Национализация: [625.GetName]"
 A10_integrate_625_desc:0 "Остров признал власть Федерации. Закрепим его полноправное участие в общем государстве, распространив на жителей федеральные права и обязанности."
 A10_integrate_627:0 "Национализация: [627.GetName]"
 A10_integrate_627_desc:0 "Остров признал власть Федерации. Закрепим его полноправное участие в общем государстве, распространив на жителей федеральные права и обязанности."
 A10_integrate_628:0 "Национализация: [628.GetName]"
 A10_integrate_628_desc:0 "Остров признал власть Федерации. Закрепим его полноправное участие в общем государстве, распространив на жителей федеральные права и обязанности."
 A10_integration:0 "Федеральное подчинение и интеграция"
 A10_integration_desc:0 "Федерация должна заслужить доверие островов. Восстановление порядка и работа местных управ подготовят почву для их полноправного участия в общем государстве."
 A10_japanese_settlement:0 "Мир с Японией"
 A10_offer_archipelago_peace:0 "Предложить мир: свободный архипелаг"
 A10_offer_archipelago_peace_desc:0 "Япония вытеснена с архипелага. Предложить признание освобождения её владений, включая Манилу, Батаан, северный Лусон и Палаван. Контроль наших участников Конфедерации учитывается. Япония может отказать."
 A10_offer_manila_peace:0 "Предложить мир: Манильский компромисс"
 A10_offer_manila_peace_desc:0 "Мы удерживаем Манилу, а северный Лусон и Батаан остаются под японским контролем. Предложить мир с передачей Манилы; северный Лусон, Батаан и остальные японские владения останутся Японии."
 A10_pacify_624:0 "Умиротворение: [624.GetName]"
 A10_pacify_624_desc:0 "Восстановим порядок на острове, защитим местные управы и наладим переговоры с общинами. Прочная гражданская власть должна опираться на доверие жителей, а не только на присутствие войск."
 JPC_cabinet:0 "Протоколы военного кабинета"
 JPC_cabinet_desc:0 "Адмиралтейство, промышленники и Север связаны временными обещаниями. Кабинет должен обеспечить военный поход, удержать кредиторов от разрыва договоров и не потерять доверие Хоккайдо. Мир с Батавией не разрешит все споры внутри империи."
 JPC_emergency_shipping:0 "Оплатить внеочередной рейс"
 JPC_emergency_shipping_desc:0 "Выделить политический капитал на закупку десяти транспортов."
 JPC_luzon_talks:0 "Выслушать условия Конфедерации"
 JPC_luzon_talks_desc:0 "Если Конфедерация освободила Манилу или архипелаг, предложить существующее территориальное урегулирование. Борнейский договор не заменяет этот мир."
 JPC_repay_credit:0 "Погасить обеспеченный кредит"
 JPC_repay_credit_desc:0 "После завершения войн рассчитаемся с ВТП. Погашение кредита освободит будущие доходы от обслуживания внешних обязательств."
 JPC_support_families:0 "Пособия семьям мобилизованных"
 JPC_support_families_desc:0 "Разовое ассигнование поможет сохранить доверие к двору; оно не отменит потерь и раскола."
 JPF_bridge_credit:0 "Запросить мостовой кредит"
 JPF_bridge_credit_desc:0 "Открывает переговоры с ВТП о новых транспортах и обязательствах."
 JPF_close_ledger:0 "Закрыть чрезвычайную книгу"
 JPF_close_ledger_desc:0 "Когда войны завершатся, чрезвычайный кредит будет погашен, а доверие к казне восстановлено, можно закрыть военную долговую книгу. Прежде следует исполнить нефтяные гарантии или согласовать с кредиторами последствия поражения."
 JPF_defer_yard_orders:0 "Отложить заказы верфям"
 JPF_defer_yard_orders_desc:0 "Отложим часть заказов, чтобы ослабить давление срочных платежей. Верфи замедлят работу, а поставщики усомнятся в способности кабинета исполнять обещания."
 JPF_finance:0 "Счета войны"
 JPF_finance_desc:0 "Долговое давление Мицубиси: §Y[?JPF_debt_pressure|0]§!\nДоверие к казне: §Y[?JPF_budget_confidence|0]§!\nВоенные заказы увеличивают обязательства. Проверенные счета и регулярные выплаты поддерживают доверие; затяжные просрочки грозят остановкой поставок и кассовым кризисом."
 JPF_levy_excise:0 "Собрать чрезвычайный акциз"
 JPF_levy_excise_desc:0 "Взыщем чрезвычайные акцизы для расчёта с кредиторами. Облегчение долгового бремени обернётся недовольством городов и сокращением средств на строительство."
 JPF_osaka_advance:0 "Взять осакский аванс"
 JPF_osaka_advance_desc:0 "Примем аванс осакских промышленников вооружением и транспортами. Помощь позволит закрыть ближайшие потребности, но усилит зависимость казны от Мицубиси."
 JPF_pay_dockworkers:0 "Выплатить жалованье рабочим"
 JPF_pay_dockworkers_desc:0 "Погасим задолженность перед портовыми рабочими. Возобновление отгрузок потребует новых средств, зато прекратит задержки и вернёт доверие к обещаниям кабинета."
 JPF_publish_accounts:0 "Опубликовать проверенные счета"
 JPF_publish_accounts_desc:0 "Обнародуем проверенные счета. Открытая отчётность поможет пресечь завышенные требования и убедить вкладчиков в надёжности казначейства."
 JPF_redeem_small_savers:0 "Выкупить мелкие вклады"
 JPF_redeem_small_savers_desc:0 "Вернём деньги мелким вкладчикам прежде крупных кредиторов. Семьи получат свои сбережения, но ради выплаты придётся временно сократить гражданские заказы."
 JPF_service_bonds:0 "Обслужить государственные облигации"
 JPF_service_bonds_desc:0 "Проведём очередную выплату держателям военных облигаций. Исполнение обязательств уменьшит задолженность и укрепит доверие к казначейству."
 JPF_voluntary_subscription:0 "Открыть добровольную подписку"
 JPF_voluntary_subscription_desc:0 "Предложим частным вкладчикам поддержать транспортные заказы добровольной подпиской. Казна получит суда, но примет новые обязательства перед семьями, доверившими ей свои сбережения."
 JPL_escort_manila:0 "Выделить манильское охранение"
 JPL_escort_manila_desc:0 "Выделим корабли для охраны манильских караванов. Поставки станут надёжнее, хотя другим эскадрам придётся обходиться без части сопровождения."
 JPL_hold_port_perimeter:0 "Сжать периметр порта"
 JPL_hold_port_perimeter_desc:0 "Сосредоточим части вокруг порта и сократим протяжённость снабжаемых позиций. Удерживать рубеж станет легче, но отступление тяжело скажется на настроении солдат."
 JPL_luzon_cabinet:0 "Манила и непокорённый Лусон"
 JPL_luzon_cabinet_desc:0 "Нагрузка гарнизона: §Y[?JPL_garrison_burden|0]/100§!\nУсталость: §Y[?JPL_garrison_fatigue|0]/100§!\nОт 40 — перегрузка, от 70 — чрезвычайное снабжение; усталость от 60 снижает боевой дух. Поставки, эскорты и госпитали оплачиваются новыми обязательствами Мицубиси. Борнейский мир не завершает войну с Конфедерацией."
 JPL_open_field_hospitals:0 "Открыть полевые госпитали"
 JPL_open_field_hospitals_desc:0 "Доставим медицинское имущество и расширим полевые госпитали. Раненые получат помощь ближе к месту службы, а гарнизон — возможность восстановить силы."
 JPL_prosecute_false_accounts:0 "Судить за ложные ведомости"
 JPL_prosecute_false_accounts_desc:0 "Передадим виновных в подложных ведомостях под суд. Казна вернёт часть растраченных средств, а гарнизону придётся заново выстраивать связи с поставщиками."
 JPL_purchase_locally:0 "Закупить продовольствие на месте"
 JPL_purchase_locally_desc:0 "Закупим продовольствие через местные управы. Новые расходы уменьшат зависимость гарнизона от дальних караванов и помогут избежать разорительных реквизиций."
 JPL_rotate_garrison:0 "Ротировать гарнизон"
 JPL_rotate_garrison_desc:0 "Сменим наиболее истощённые части свежими резервистами. Перевозка и снаряжение пополнения потребуют расходов, но постоянная служба без смены обходится людям ещё дороже."
 JPL_supply_manila:0 "Дополнительное довольствие Манилы"
 JPL_supply_manila_desc:0 "Отправим гарнизону дополнительное вооружение. Новая поставка облегчит положение частей, но её оплату придётся включить в военные обязательства казны."
 JPL_verify_garrison_books:0 "Сверить гарнизонные книги"
 JPL_verify_garrison_books_desc:0 "Сверим ведомости с действительным составом частей и запасами складов. Проверка пресечёт растрату, хотя на время нарушит привычную работу поставщиков."
 JPN_north_admiralty_appropriation:0 "Компенсировать расходы флота"
 JPN_north_admiralty_appropriation_desc:0 "Выделим адмиралтейству дополнительные средства в обмен на признание северных поставок. Спор утихнет, но казна примет новый расход, а Сайго усомнится в беспристрастности кабинета."
 JPN_north_bread_before_rifles:0 "Зафрахтовать хлебный караван"
 JPN_north_bread_before_rifles_desc:0 "Направим продовольственный караван гражданскими судами. Север получит необходимое, а военные перевозки понесут меньшие потери, чем при отправке очередного оружейного груза."
 JPN_north_clear_arrears:0 "Погасить северную недопоставку"
 JPN_north_clear_arrears_desc:0 "Соберём крупный караван, чтобы погасить накопившуюся задолженность перед Севером. Исполнение обещаний позволит восстановить договор, ценой серьёзного отвлечения грузов и судов от южной кампании."
 JPN_north_council:0 "Протокол северного нейтралитета"
 JPN_north_council_desc:0 "Доверие Сайго: §Y[?JPN_north_trust|0]§!\nНедовольство адмиралтейства: §Y[?JPN_north_fleet_irritation|0]§!\nЗапас северного снабжения: §Y[?JPN_north_supply_months|0] мес.§!\nРегулярные поставки поддерживают договор. Просрочки подрывают доверие Севера, а отвлечение судов раздражает флот. Сайго сохраняет самостоятельное командование и нейтралитет Хоккайдо."
 JPN_north_meiji_letter:0 "Отправить личное письмо Мэйдзи"
 JPN_north_meiji_letter_desc:0 "Личное письмо императора подтвердит серьёзность северного соглашения. Сайго оценит внимание двора, хотя адмиралы сочтут его очередной привилегией Хоккайдо."
 JPN_north_negotiate_compact:0 "Предложить постоянный компакт"
 JPN_north_negotiate_compact_desc:0 "Требует доверия от 55, раздражения ниже 60 и новой поставки. Снимает повторяющийся кризис, сохраняя плату за нейтралитет."
 JPN_north_scheduled_shipment:0 "Отправить северную поставку"
 JPN_north_scheduled_shipment_desc:0 "Отправим на Хоккайдо обещанное вооружение и транспортное сопровождение. Исправные поставки укрепят доверие Сайго, хотя адмиралтейство вновь напомнит о нуждах южной эскадры."
 JPN_north_send_inspectors:0 "Отправить складскую комиссию"
 JPN_north_send_inspectors_desc:0 "Открывает выбор полномочий инспекторов."
 JPN_north_written_postponement:0 "Согласовать письменную отсрочку"
 JPN_north_written_postponement_desc:0 "Попросим Сайго подтвердить отсрочку очередной поставки. Флот сохранит суда для похода, но северное командование запомнит, чьи обязательства кабинет снова отложил."
 JPT_mitsubishi_deadline:0 "Срок погашения векселей Мицубиси"
 JPT_mitsubishi_deadline_desc:0 "До истечения 180 дней завершите «Гарантировать займы Мицубиси» или «Реформу государственных займов». Иначе конгломерат рухнет, а оплата поставок и общий бюджет будут заблокированы до реструктуризации."
 JPT_recall_expedition:0 "Добиться отзыва экспедиции Сайго"
 JPT_recall_expedition_desc:0 "До начала 1894 года добиться отмены экспедиции. Требуются мирный договор и доверие Сайго выше 54. Цена: 75 политической власти, −15 доверия и +10 раздражения флота. Это гарантированно предотвращает гренландский кризис."
 JPT_restructure_after_crash:0 "Чрезвычайная реструктуризация Мицубиси"
 JPT_restructure_after_crash_desc:0 "После реформы займов потратить 100 политической власти и 60 дней на ликвидацию краха. Итог: −3% стабильности, −15 долгового давления, поставки и бюджет снова доступны."
 JPT_three_heads:0 "Три головы дракона"
 JPT_three_heads_desc:0 "Кредиторы Мицубиси — банки и торговые дома Осаки. ВТП ведёт отдельный долговой счёт. После назначения Ито есть 180 дней на гарантии или реформу займов. Тайная экспедиция Сайго может достичь Гренландии в начале 1894 года; мирный договор сам по себе её не отменяет."
 JSM_offer_A01:0 "Протекторат над Нидерландской Индией"
 JSM_offer_A01_desc:0 "Переговоры займут 30 дней. Согласие создаст японскую марионетку; отказ даст цель войны."
 JSM_offer_A08:0 "Северный договор"
 JSM_offer_A08_desc:0 "Переговоры займут 30 дней. Согласие создаст японскую марионетку; отказ даст цель войны."
 JSM_offer_A10:0 "Протекторат над Филиппинами"
 JSM_offer_A10_desc:0 "Переговоры займут 30 дней. Согласие создаст японскую марионетку; отказ даст цель войны."
 JSM_subordination:0 "Императорская дипломатия"
 WTC_board:0 "Закрытый директорат Мадейры"
 WTC_board_desc:0 "«Ламберт» — подпись директората, личность за ней неизвестна.\nСтарая гвардия: §Y[?WTC_old_guard|0]§!\nМолодые технократы: §Y[?WTC_technocrats|0]§!\nТайный департамент: §Y[?WTC_secret_department|0]§!\nСтарая гвардия сохраняет страховую монополию; технократы ищут союз с Теслой; департамент ведёт разведку, операции ликвидации и переговоры с пиратами. Возвращение на континент вне системы кредитов разрушит их власть."
 WTC_board_old_guard:0 "Поддержать Старую гвардию"
 WTC_board_old_guard_desc:0 "Приоритеты влияют на страховые договоры, лабораторные проекты и пиратские каналы."
 WTC_board_secret:0 "Расширить тайный департамент"
 WTC_board_secret_desc:0 "Приоритеты влияют на страховые договоры, лабораторные проекты и пиратские каналы."
 WTC_board_technocrats:0 "Дать слово технократам"
 WTC_board_technocrats_desc:0 "Приоритеты влияют на страховые договоры, лабораторные проекты и пиратские каналы."
 WTC_borrow:0 "Взять морской кредит"
 WTC_borrow_desc:0 "Закажем транспорты в кредит у Палаты. Суда поступят немедленно, но проценты увеличат будущие выплаты и зависимость от кредиторов."
 WTC_cables:0 "Арендовать приоритет кабеля"
 WTC_cables_desc:0 "Оплатим приоритетное обслуживание кабельной связи. Военные и торговые сообщения будут доходить быстрее, а счёт Палаты пополнится новой услугой."
 WTC_concede:0 "Уступить портовые сборы"
 WTC_concede_desc:0 "Передадим Палате часть коммерческих доходов в зачёт долга. Государство сохранит суверенитет, но строительство и внутренние заказы почувствуют отток средств."
 WTC_debt_ledger:0 "Долговая книга ВТП"
 WTC_debt_ledger_desc:0 "Долг перед Палатой: §Y[?WTC_debt|0]§!\nЗа займы приходится платить будущими доходами. Просрочки ведут к требованиям концессий и ограничению кабельного обслуживания. При поддержке британского флота кредиторы могут добиться смены местного кабинета."
 WTC_end_receivership:0 "Выкупить долговую администрацию"
 WTC_end_receivership_desc:0 "После войны при долге не выше 20 снять внешнее управление. Политический строй требует отдельного решения страны."
 WTC_insure:0 "Застраховать Серебряный Конвой"
 WTC_insure_desc:0 "Застрахуем морские перевозки у Палаты. Условия договора будут зависеть от того, чьи интересы преобладают в её совете: банкиров, технических специалистов или тайного департамента."
 WTC_naval_service:0 "Отслужить долг британскому флоту"
 WTC_naval_service_desc:0 "Передать воюющей Британии 10 транспортов и 500 винтовок."
 WTC_repay:0 "Выплатить часть долга"
 WTC_repay_desc:0 "Направим свободные средства на погашение займа. Каждая исполненная расписка уменьшает власть кредиторов над будущими доходами страны."
