 A10_integration:0 "Федеральное подчинение и интеграция"
 A10_integration_desc:0 "Подавляйте сопротивление и повышайте подчинение. При 80% подчинения можно национализировать область."
 A10_confederate_member:0 "Участник Филиппинской конфедерации"
 A10_confederate_member_desc:0 "Самоуправление при едином военном командовании: войска передаются Конфедерации, участник обязан вступать в её войны."
 A10_separatism:0 "Островной сепаратизм"
 A10_separatism_desc:0 "Островные правительства требуют самостоятельности. Только Кавите признаёт центральную власть безоговорочно."
 A10_federal_administration:0 "Федеральная администрация"
 A10_common_army:0 "Общая армия островов"
 A10_FED:0 "Федерация Филиппинских Островов"
 A10_FED_DEF:0 "Федерация Филиппинских Островов"
 A10_FED_neutrality:0 "Федерация Филиппинских Островов"
 A10_FED_neutrality_DEF:0 "Федерация Филиппинских Островов"
 A10_FED_ADJ:0 "Филиппинск."
 A10_island_congress_desc:0 "Кавите удерживает острова лишь хрупким соглашением. Конгресс должен выбрать между союзом самостоятельных республик и единой федерацией."
 A10_confederation_desc:0 "Признать самостоятельность центральных Висайев и Самара. Их правительства получат особый статус участников Конфедерации с общей армией и обязательным участием в войнах."
 A10_visayan_compact_desc:0 "Передать Себу и Панаю собственное управление в обмен на подчинение общему военному командованию."
 A10_mindanao_compact_desc:0 "Юг островов получит две республики: Минданао и Северный Минданао. Их войска останутся частью общей обороны."
 A10_united_command_desc:0 "Островные республики сохранят советы и законы, но подготовку войск и оборону будет вести единый штаб в Кавите."
 A10_federation_desc:0 "Отказаться от отделения островов. Федеральная администрация снизит сопротивление и ускорит рост подчинения. При 80% область можно национализировать через решение."
 A10_gendarmerie_desc:0 "Создать постоянную жандармерию. В подконтрольных ненaциональных областях подчинение вырастет на 10 пунктов, сопротивление снизится на 10."
 A10_local_administration_desc:0 "Заменить соперничающие советы единой системой местного управления. Подчинение подконтрольных областей вырастет на 10 пунктов, сопротивление снизится на 10."
 A10_equal_citizenship_desc:0 "Общие права свяжут острова прочнее гарнизонов. Подчинение вырастет ещё на 10 пунктов. Дальнейшую интеграцию продолжат региональные решения."
 A10_coastal_arsenals_desc:0 "Расширить оружейные мастерские Кавите и вооружить защитников островов до начала наступления."
 A10_landing_plans_desc:0 "Подготовить штаб и маршруты возвращения на оккупированный Лусон."
 A10_strike_japan_desc:0 "Пока японские силы заняты войной с Нидерландами, нанести превентивный удар. Фокус объявляет войну Японии напрямую и требует завершения выбранной политической ветки."
 A10_luzon_charter_desc:0 "После освобождения северного Лусона учредить светскую республику — нового участника Конфедерации с общей армией."
 A10_capital_charters_desc:0 "Освобождённые Манила и Батаан получат собственные республики и войдут в общее военное командование."
 A10_federal_reconstruction_desc:0 "Возвращение Манилы позволяет начать восстановление. Повысить подчинение подконтрольных областей на 10 пунктов и расширить промышленность Кавите."