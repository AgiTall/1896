l_russian:
 JMC_organise_pilot_service:0 "Наладить проводку торговых караванов"
 JMC_organise_pilot_service_desc:0 "Местные лоцманы знают отмели и приливы, но их записи редко покидают родную гавань. Соберём проверенные карты, закрепим места встречи с охранением и разошлём капитанам общие сигналы. Караванам будет легче проходить узкости, сохраняя связь с эскортом."
 JMC_prepare_transport_service:0 "Подготовить транспортные команды"
 JMC_prepare_transport_service_desc:0 "При дальней экспедиции ошибка в погрузке обнаруживается уже за морем. Интенданты и капитаны должны вместе проверить порядок размещения грузов, подготовить причальные партии и согласовать передачу припасов на необорудованный берег."
 JMC_pilot_service:0 "Караванная лоцманская служба"
 JMC_pilot_service_desc:0 "Лоцманские записи сведены в общие карты. Торговые капитаны знают места встречи с охранением, а сигнальщики согласовали прохождение узкостей и сбор отставших судов."
 JMC_transport_service:0 "Слаженные транспортные команды"
 JMC_transport_service_desc:0 "Транспортные капитаны, интенданты и береговые партии работают по согласованным ведомостям. Грузы уложены в порядке выгрузки, а запасные средства доставки подготовлены к переходу."
 jmc_operations.1.t:0 "Лоцман выходит навстречу"
 jmc_operations.1.d:0 "У входа в пролив караван встретил лоцманский катер. Капитан головного парохода сверил карту: глубины, прилив и место сбора совпали с присланной из порта ведомостью. Охранение прошло узкость вместе с транспортами. В гавани торговые дома предложили сохранить общий порядок и привлекать опытных лоцманов к подготовке следующих рейсов."
 jmc_operations.1.a:0 "Передать проверенные карты во все гавани"
 jmc_operations.2.t:0 "Груз, который можно выгрузить"
 jmc_operations.2.d:0 "На учебном рейде шлюпки подошли к берегу с инструментами и канатами. Прежде этот груз оказался бы под ящиками, предназначенными для последнего дня перехода. Теперь береговая партия получила нужное первой, обозначила место разгрузки и приняла остальные суда. Капитаны внесли замечания в ведомости до возвращения транспортов в гавань."
 jmc_operations.2.a:0 "Закрепить порядок погрузки и высадки"
