l_russian:
 A10W_conditional_oath:0 "Условная присяга Палате"
 A10W_conditional_oath_desc:0 "Островной совет ищет защиту торговой сети. Договорные обязательства требуют времени и уступок, а политическая зависимость ещё должна получить отдельное согласие сторон."
 A10W_audited_ledger:0 "Сверенные долговые книги"
 A10W_audited_ledger_desc:0 "Единые счета позволяют оспаривать повторные требования кредиторов. Содержание казначейской службы оплачивается из островных доходов."
 A10W_bonded_customs:0 "Таможня под двойной печатью"
 A10W_bonded_customs_desc:0 "Местные сборщики и страховые поверенные совместно проверяют портовые склады. Оборот надёжнее, но сборы тяжелее, а спор о прибыли каждый месяц усиливает напряжение хартии."
 A10W_port_watch:0 "Портовая стража и сигнальные посты"
 A10W_port_watch_desc:0 "Островные роты охраняют телеграф, пристани и склады. Ни Мадейра, ни её страховщики не заменят местной береговой обороны."
 A10W_local_shareholders:0 "Островные пайщики"
 A10W_local_shareholders_desc:0 "Местные торговые дома и провинциальные кассы получают долю прибыли и право проверять отчёты. Хартия держится на их согласии."
 A10W_provisional_charter:0 "Предварительная колониальная хартия"
 A10W_provisional_charter_desc:0 "Островной кабинет подготовил условия зависимости от Палаты. Пока конвенция не подписана с обеих сторон, управление и внешняя политика остаются в прежних руках."
 A10W_resident_council_spirit:0 "Совет при торговом резиденте"
 A10W_resident_council_spirit_desc:0 "Провинциальные поверенные заседают рядом с держателями крупнейших контрактов. Совет ускоряет решения, но сосредоточение печатей вызывает недоверие."
 A10W_export_estates_spirit:0 "Экспортные аренды"
 A10W_export_estates_spirit_desc:0 "Долгие договоры на абаку и сахар обеспечивают дорожные работы. Доходы обременены выплатами, а земельные споры каждый месяц усиливают напряжение хартии."
 A10W_colonial_administration:0 "Колониальная администрация Палаты"
 A10W_colonial_administration_desc:0 "Добровольно ратифицированная конвенция подчиняет острова Мадейре. Палата распоряжается внешними обязательствами через местный совет; вооружённая охрана и повседневное управление остаются островными."
 A10W_port_hospitals:0 "Лазареты и водопроводы портов"
 A10W_port_hospitals_desc:0 "Постоянные отчисления поддерживают семьи портовых рабочих, чистую воду и лазареты. Забота стоит казне денег, но каждый месяц снижает напряжение хартии."
 A10W_provisional_exchange:0 "Временная островная биржа"
 A10W_provisional_exchange_desc:0 "Новая расчётная сеть уже принимает местные обязательства. Её притязание на верховную метрополию Палаты требует добровольного признания Мадейры."
 A10W_merchant_assembly_spirit:0 "Собрание торговых домов"
 A10W_merchant_assembly_spirit_desc:0 "Портовые представители собирают капитал и утверждают крупные договоры. Их общий интерес ускоряет работу, хотя соперничество за дивиденды не исчезло."
 A10W_duplicate_cables_spirit:0 "Дублирующая кабельная сеть"
 A10W_duplicate_cables_spirit_desc:0 "Запасные станции и школы связистов уменьшают зависимость от одной линии. Содержание сети оплачивается постоянными взносами."
 A10W_escrow_courts:0 "Залоговые счета и торговый суд"
 A10W_escrow_courts_desc:0 "Проверенные залоги и единый порядок разбирательств поддерживают промышленный оборот. Пустое обещание больше не равно складскому свидетельству."
 A10W_metropolitan_directorate:0 "Островной верховный директорат"
 A10W_metropolitan_directorate_desc:0 "Мадейра признала островной центр и добровольно стала автономной атлантической конторой. Содержание всемирной сети дорого; каждый месяц её обязательства усиливают напряжение хартии. Личность за подписью Ламберта по-прежнему не установлена."
 A10W_network_covenant:0 "Хартия двух океанов"
 A10W_network_covenant_desc:0 "Страховые резервы, кабельные службы и наёмное сопровождение действуют по согласованным обязательствам. Гарантии стоят денег и не спасают каждый корабль."
 A10W_charter_strikes:0 "Стачки и споры вокруг хартии"
 A10W_charter_strikes_desc:0 "Напряжение хартии превысило 59. Грузчики останавливают погрузку, арендаторы оспаривают сборы, провинциальные кассы задерживают перечисления. Посредничество и публичные счета способны вернуть работу в порты."
 A10W_emergency_mediation:0 "Временные обязательства казны"
 A10W_emergency_mediation_desc:0 "Казна покрывает стоимость посредничества, помощи рабочим или обслуживания местного займа. Передышка оплачивается из текущих доходов."
 A10W_chartered_colony:0 "Колония по островной хартии"
 A10W_chartered_colony_desc:0 "Добровольный договор островного совета с Палатой. Внешние обязательства ведёт метрополия, местное управление и вооружённая стража сохраняются; участие в войне требует отдельного согласия."
 A10W_atlantic_office:0 "Автономная атлантическая контора"
 A10W_atlantic_office_desc:0 "Мадейра добровольно признала островной верховный центр. Старый директорат сохраняет свою территорию и широкую автономию, не передаёт людей островной армии и может отклонять призывы к войне."
 A10W_resident_name:0 "Совет островной хартии"
 A10W_resident_desc:0 "Коллегия местных поверенных, провинциальных представителей и резидента Палаты ведёт дела ратифицированной колонии. Властные полномочия определены конвенцией, а не личностью обладателя печати."
 A10W_directorate_name:0 "Верховный островной директорат"
 A10W_directorate_desc:0 "Островная коллегия возглавляет новую расчётную метрополию. Атлантическая контора сохраняет закрытую подпись Ламберта; ни письма, ни протоколы не устанавливают, кто именно стоит за ней."
