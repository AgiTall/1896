 A10W_PACIFIC_ADJ:0 "Тихоокеанск."
 A10W_accounts_tt:0 "Открывает периодическую сверку счетов: политическое влияние расходуется на уменьшение долга и споров вокруг хартии."
 A10W_colony_draft_tt:0 "Готовит колониальный проект. Реальное подчинение наступит лишь после мирной конвенции и отдельного согласия Мадейры."
 A10W_metropole_draft_tt:0 "Готовит независимый торговый центр. Мадейра сможет добровольно признать его и стать автономной атлантической конторой."
 A10W_colony_convention_tt:0 "Отправляет Палате предложение о добровольном подчинении. Нужны принятая присяга, мир и независимость обеих стран, отсутствие наших субъектов и чужих союзных обязательств. Пустая островная фракция будет распущена только при согласии Палаты. Отказ оставляет действующую хартию и повторные переговоры."
 A10W_metropole_convention_tt:0 "Приглашает Мадейру добровольно стать автономной конторой под нашим верховенством. Нужны принятая присяга, мир, независимость, совместимые фракции и отсутствие субъектов у Мадейры. Чужие земли не переходят к нам. До возвращения Манилы действует временная биржа; при отказе переговоры можно повторить."
 A10W_voluntary_office_tt:0 "Всемирная торговая палата добровольно становится автономным субъектом островной метрополии A10. Территории остаются у Палаты, её войска не передаются и участие в войнах необязательно."
 A10W_charter_book:0 "Книга островной хартии"
 A10W_charter_book_desc:0 "Напряжение хартии: §Y[?A10W_charter_tension|0]/100§!\nДолг Палате: §Y[?WTC_debt|0]/100§!\n\nДвойная таможня, экспортные аренды и содержание верховного директората добавляют по §R1§! напряжению ежемесячно. Долг выше 70 добавляет ещё §R2§!. Портовые лазареты снимают §G1§! в месяц. Выше 59 начинаются стачки; выше 89 возникает чрезвычайный спор не чаще раза в полгода. Посредничество и открытые счета сохраняют договорный порядок."
 A10W_renew_oath:0 "Возобновить переписку с Мадейрой"
 A10W_renew_oath_desc:0 "Новые поверенные повторят просьбу о признании присяги. Переписку можно возобновить через полгода после предыдущего обращения; признание не подчиняет страну автоматически."
 A10W_renew_colonial_convention:0 "Вновь предложить колониальную конвенцию"
 A10W_renew_colonial_convention_desc:0 "Переговоры требуют мира и независимости обеих сторон, принятой присяги и отсутствия наших субъектов. Мы можем распустить только собственную пустую фракцию. Палата должна быть вне фракции либо возглавлять её; решение о покровительстве останется за её директоратом."
 A10W_renew_metropolitan_convention:0 "Вновь созвать Манильскую конвенцию"
 A10W_renew_metropolitan_convention_desc:0 "Просьба о добровольном переходе Мадейры под островной верховный центр. Нужны мир, независимость, принятая присяга и отсутствие субъектов у Палаты. Мы должны быть вне фракции либо возглавлять её; Палата — вне фракции, в нашей фракции без лидерства либо во главе собственной пустой фракции."
 A10W_public_accounts:0 "Опубликовать сверенные счета"
 A10W_public_accounts_desc:0 "Казначейские поверенные устранят повторные требования. Политические расходы уменьшают долг на 5 и напряжение хартии на 5."
 A10W_port_arbitration:0 "Созвать портовых посредников"
 A10W_port_arbitration_desc:0 "Грузчики, арендаторы и держатели складов обсудят текущие споры до прекращения работ. Напряжение хартии снизится на 12."
 A10W_fund_harbour_hospitals:0 "Выделить чрезвычайную портовую помощь"
 A10W_fund_harbour_hospitals_desc:0 "Помощь семьям и больным снизит напряжение хартии на 20. Содержание помощи на девяносто дней увеличит текущие расходы казны."
 A10W_customs_advance:0 "Получить аванс под таможню"
 A10W_customs_advance_desc:0 "При принятой присяге доступная Палата выделит 15 транспортов под 12 нового долга. Распределение будущих сборов усилит напряжение хартии на 10."
 A10W_local_bond_sale:0 "Разместить островной заём"
 A10W_local_bond_sale_desc:0 "Местные держатели выкупят 8 внешнего долга. Новые обязательства на сто двадцать дней обременят казну и увеличат напряжение хартии на 10."
 A10W_move_exchange_to_manila:0 "Открыть верховную биржу в Маниле"
 A10W_move_exchange_to_manila_desc:0 "После мирного возвращения столицы и признания нового верховенства Палатой перенесём островной расчётный центр в Манилу. Меняется столица наших владений; чужая земля в конвенции не участвует."
 A10W_underwriting_reserve:0 "Пополнить страховой резерв"
 A10W_underwriting_reserve_desc:0 "Местные взносы оплатят полугодовое страхование сопровождения. Это не новый внешний заём, но взносы увеличат напряжение хартии на 5."
 A10W_constabulary_drill:0 "Учения контрактной стражи"
 A10W_constabulary_drill_desc:0 "Двести винтовок пойдут на обучение островных рот. Исправная служба и проверка жалованья дадут военный опыт и снизят напряжение хартии."
 A10W_cable_school:0 "Набрать учеников кабельной школы"
 A10W_cable_school_desc:0 "Оплатим полугодовой договор с преподавателями и местными учениками. Острова получат технические знания, а новые места несколько ослабят споры вокруг хартии."
 A10W_path.1.t:0 "Присяга островного совета"
 A10W_path.1.d:0 "С островов пришла грамота: местный совет готов признать договорный порядок Палаты и открыть счета для её поверенных. Делегаты просят страхования, кабельного приоритета и признания своего правительства.\n\nПодпись под присягой ещё не делает острова колонией. Директорату предстоит решить, стоит ли связывать с ними имя Палаты, пока условия будущего устройства остаются открытыми."
 A10W_path.1.a:0 "Принять присягу; будущие уступки обсудим отдельно."
 A10W_path.1.b:0 "Ограничимся обычной торговой перепиской."
 A10W_path.2.t:0 "Мадейра приняла грамоту"
 A10W_path.2.d:0 "Ответ скреплён знаком Палаты и привычной закрытой подписью. Присяга признана, поверенным разрешено вести переговоры о страховании и кабеле.\n\nВопрос о том, останутся ли острова самостоятельным партнёром, станут колонией или примут верховный расчётный центр, пока не решён. Для него потребуются новые подписи."
 A10W_path.2.a:0 "Теперь разберём каждую статью."
 A10W_path.3.t:0 "Закрытая книга Мадейры"
 A10W_path.3.d:0 "На нашу присягу не поступило действующего согласия. Директорат мог счесть её преждевременной, связь могла оборваться, а война или чужое покровительство — сделать обещания неисполнимыми.\n\nОстровной совет продолжит устройство счетов и портов под собственной ответственностью. Через полгода можно вновь послать поверенных. Пока ратифицированной конвенции нет, ни колониальные статьи, ни притязание на метрополию не меняют власти над странами."
 A10W_path.3.a:0 "Собственную книгу мы всё равно откроем."
 A10W_path.8.t:0 "Кому доступна книга?"
 A10W_path.8.d:0 "Делегаты согласны считать договоры, но спорят о праве читать их. Грузчики требуют мест для своих поверенных, провинциальные кассы — открытых ставок, крупнейшие дома — быстрого утверждения кредитов.\n\nПредседатель предлагает либо расширить представительство за счёт времени и казённых средств, либо немедленно принять капитал держателей крупных контрактов. От этого выбора зависит, как острова встретят будущую хартию."
 A10W_path.8.a:0 "Дать места портам и оплатить открытые слушания."
 A10W_path.8.b:0 "Принять капитал домов и ускорить соглашение."
 A10W_path.10.t:0 "Острова предлагают колониальную конвенцию"
 A10W_path.10.d:0 "Островной совет закончил проект зависимости: внешние обязательства переходят под верховную печать Палаты, местные суды и вооружённая стража сохраняются. Взамен острова просят признания, долговой уступки и права вести повседневные дела через собственный совет.\n\nЭто добровольное исключение, предложенное самими островами. Палата не получает новую армию и не забирает провинции напрямую. Ратификация создаст реальное колониальное подчинение местного правительства."
 A10W_path.10.a:0 "Ратифицировать добровольную островную колонию."
 A10W_path.10.b:0 "Местных контрактов пока достаточно."
 A10W_path.11.t:0 "Две печати на колониальной хартии"
 A10W_path.11.d:0 "Конвенция ратифицирована. Островной совет признал верховенство Палаты, а её директорат — местное управление и пределы собственных требований. Старые долговые бумаги частично погашены, но содержание администрации и уступленные доходы останутся тяжестью для казны.\n\nРезидент займёт место при совете. Островная стража сохранит своё командование; ни одна подпись не способна заменить людей на пристанях."
 A10W_path.11.a:0 "Исполнять хартию и следить за её ценой."
 A10W_path.12.t:0 "Конвенция не вступила в силу"
 A10W_path.12.d:0 "Действующей подписи под колониальной конвенцией нет. Палата могла отвергнуть условия, а война, чужой сюзерен, собственные подчинённые или союзные обязательства — помешать их исполнению.\n\nСовет сохранит предварительную хартию как внутренний порядок. Когда препятствия исчезнут, посланники смогут вновь предложить договор; до этого острова не переходят под новую власть."
 A10W_path.12.a:0 "Управлять своими средствами и ждать новой встречи."
 A10W_path.20.t:0 "Предложение новой метрополии"
 A10W_path.20.d:0 "Островной директорат предлагает перенести верховный расчётный центр в тихоокеанскую сеть. Мадейра сохранит свою землю, закрытые архивы и широкую самостоятельность, но признает островной кабинет метрополией и станет его автономной атлантической конторой.\n\nСогласие означает действительное добровольное подчинение Палаты новому центру. Людей и войска передавать не требуется; военные призывы можно отклонять. Подпись Ламберта останется закрытой — соглашение не устанавливает, кто её ставит."
 A10W_path.20.a:0 "Добровольно признать островную метрополию."
 A10W_path.20.b:0 "Верховная печать останется на Мадейре."
 A10W_path.21.t:0 "Верховная книга обращена к востоку"
 A10W_path.21.d:0 "Мадейра подписала конвенцию и добровольно признала новый центр. Атлантическая контора сохранит свою территорию и закрытые дела; островной директорат примет верховное руководство общей сетью.\n\nЕсли Манила ещё не возвращена, заседания продолжатся при временной островной бирже. Когда город будет принадлежать нам и наступит мир, перенос столицы можно будет оплатить отдельным решением. Наследство Палаты состоит из обязательств не меньше, чем из возможностей."
 A10W_path.21.a:0 "Принять книги, резервы и ответственность."
 A10W_path.22.t:0 "У метрополии пока одна подпись"
 A10W_path.22.d:0 "Мадейра не дала действующего согласия на перемену верховенства. Старая гвардия могла отвергнуть проект, а войны, зависимость или чужие союзы — лишить стороны свободы договора.\n\nОстровная биржа продолжит самостоятельную работу. Её реестры, школы и резервы сохраняют ценность даже без признания старого директората. Посланники вернутся к конвенции, когда появится возможность, но чужая территория и власть не переходят к нам по одному объявлению."
 A10W_path.22.a:0 "Продолжать дело и готовить новые переговоры."
 A10W_path.30.t:0 "Стачка у запечатанных складов"
 A10W_path.30.d:0 "Грузчики прекратили погрузку, арендаторы выставили общие требования, а несколько касс придержали перечисления. В книге хартии сошлись слишком многие обещания, на которые не хватило наличных и доверия.\n\nСовет может покрыть посредничество и временную помощь из текущих доходов. Можно также настоять на немедленном исполнении контрактов, но срыв сборов обернётся новым долгом и потерей общественной поддержки."
 A10W_path.30.a:0 "Оплатить посредничество и помощь семьям."
 A10W_path.30.b:0 "Потребовать исполнения договоров."
