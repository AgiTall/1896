l_russian:
 A10M_coup:0 "Ночь запертых дверей"
 A10M_coup_desc:0 "Караулы перекроют подходы к островному конгрессу. Полковник Матео Сандоваль объявит, что свобода республик стала прикрытием бессилия, и передаст власть чрезвычайному военному командованию. Делегатов отпустят лишь после присяги."
 A10M_martial_law:0 "Приказ о чрезвычайном положении"
 A10M_martial_law_desc:0 "Военные коменданты получат контроль над портами, телеграфом и ночным движением. За каждым обещанием порядка останется семья, которой придётся просить разрешение на обычную жизнь."
 A10M_recall_charters:0 "Отозвать островные хартии"
 A10M_recall_charters_desc:0 "Коменданты заменят советы там, где власть конгресса ещё признаётся. Подчинённые нам республики вернут войска и учреждения общему командованию; за чужими границами одного приказа недостаточно."
 A10M_censor_cables:0 "Тишина на проводах"
 A10M_censor_cables_desc:0 "Частные кабельные сообщения будут проходить через цензора. Режим сможет скрывать передвижения гарнизонов, но вместе с опасными слухами исчезнут сведения, без которых купцы и учёные работают вслепую."
 A10M_officer_tribunal:0 "Трибунал над старым штабом"
 A10M_officer_tribunal_desc:0 "Офицеры, вчера охранявшие конгресс, сегодня должны ответить за его слабость. Процесс определит, станет ли армия орудием личной верности Сандовалю или сохранит место для профессионального возражения."
 A10M_rice_commissions:0 "Рисовые комиссии"
 A10M_rice_commissions_desc:0 "Без риса не удержать ни гарнизон, ни портовый квартал. Комиссии перепишут запасы и семейные наделы, чтобы штаб впервые увидел цену своих заявок на снабжение."
 A10M_requisition:0 "Складские книги командования"
 A10M_requisition_desc:0 "Поставки объединят в обязательные квоты. Арсеналы получат более ровный поток сырья, а сельские пристани — наряды, которым всё труднее соответствовать."
 A10M_compensation:0 "Расписки вместо конфискаций"
 A10M_compensation_desc:0 "Военные квитанции должны стать обязательством казны. Выплаты обременят бюджет, зато поставщики смогут снова закупать зерно и не прятать лодки при виде мундира."
 A10M_labour_battalions:0 "Трудовые батальоны"
 A10M_labour_battalions_desc:0 "Радикалы требуют поставить людей на строительство казарм и мастерских по приказу. Работы ускорятся, но семьи лишатся работников, а за проволокой возникнет новая, более непримиримая оппозиция."
 A10M_cadet_schools:0 "Школы военного сословия"
 A10M_cadet_schools_desc:0 "Коменданты отберут способных юношей для ускоренных офицерских курсов. Образование откроет дорогу тем, кого не принимали старые семейные связи, и одновременно привяжет их будущее к режиму."
 A10M_levy_rolls:0 "Единые призывные списки"
 A10M_levy_rolls_desc:0 "Разрозненные островные списки сведут воедино. Штаб получит резерв, но мастерские начнут терять опытные руки; командиры обязаны учитывать, кто ещё способен кормить призванных."
 A10M_medical_corps:0 "Санитарные команды гарнизонов"
 A10M_medical_corps_desc:0 "Полевые лазареты должны остановить потери, которые не видны на карте боёв. На санитарные лодки и лекарства придётся выделить место в каждом снабженческом рейсе."
 A10M_quartermasters:0 "Инспекция интендантов"
 A10M_quartermasters_desc:0 "Складской отчёт не должен зависеть от настроения коменданта. Инспекторы проверят потери и распределение лодок, лишив местных начальников части привычного дохода."
 A10M_junta:0 "Власть вечного караула"
 A10M_junta_desc:0 "Радикальные полковники отвергают обещание временной власти. По их уставу мирная жизнь станет продолжением военной службы, а само чрезвычайное положение — основой государства."
 A10M_directorate:0 "Директорат военных служб"
 A10M_directorate_desc:0 "Начальники служб предлагают управлять коллегией и письменным приказом. Конгресс они не вернут, но снабжение, флот и сухопутные части получат собственный голос за закрытой дверью."
 A10M_revolutionary_command:0 "Командование национального очищения"
 A10M_revolutionary_command_desc:0 "Новый штаб объявит всякое несогласие продолжением прежнего распада. Офицеры получат больше свободы наступать и меньше свободы обсуждать цену приказов."
 A10M_commissars:0 "Политические надзиратели"
 A10M_commissars_desc:0 "Рядом с каждым командиром появится уполномоченный хунты. Он поддержит части, утратившие решимость, и доложит обо всех, кто усомнится в её праве распоряжаться островами."
 A10M_islands_barracks:0 "Архипелаг казарм"
 A10M_islands_barracks_desc:0 "Учебные сборы охватят новые возрастные группы. Каждая пристань будет знать своего военного начальника, каждое хозяйство — день, когда его работник обязан явиться к строю."
 A10M_red_seal:0 "Печать верховного коменданта"
 A10M_red_seal_desc:0 "Постановление утвердит личную печать Сандоваля выше всех островных хартий. Командование отпразднует окончание переворота, хотя прекращение самой чрезвычайной власти никто уже не обещает."
 A10M_service_council:0 "Совет родов службы"
 A10M_service_council_desc:0 "Моряки, интенданты и сухопутные командиры подпишут порядок разрешения споров. Личная ссора полковников больше не должна останавливать рисовую баржу или переброску гарнизона."
 A10M_audited_budget:0 "Бюджет под подписью"
 A10M_audited_budget_desc:0 "Каждая служба представит расходы общему ревизору. Публиковать придётся хотя бы итоговые суммы: без доверия поставщиков власть останется с аккуратными приказами и пустыми складами."
 A10M_professional_army:0 "Служба по военному уставу"
 A10M_professional_army_desc:0 "Профессиональные инструкторы заменят политические проверки проверкой подготовки. Обучение займёт больше времени, зато командир сможет положиться на умение солдата, а не на его подпись под лозунгом."
 A10M_fixed_term:0 "Сроки и полномочия комендантов"
 A10M_fixed_term_desc:0 "Военная власть сохранит исключительное положение, но полномочия получат срок, а жалобы — путь в служебный суд. Это обещание не вернёт конгресс; оно хотя бы ограничит произвол отдельного гарнизона."
 A10M_coastal_observers:0 "Цепь береговых наблюдателей"
 A10M_coastal_observers_desc:0 "Малые сигнальные посты свяжут гарнизоны с дозорными судами. Рыбацкие лодки получат порядок оповещения, а береговая служба — обязанность отличать угрозу от очередного мирного рейса."
 A10M_defence_plans:0 "Планы обороны проливов"
 A10M_defence_plans_desc:0 "Штаб подготовит маршруты отхода, охрану складов и взаимодействие батарей с флотом. Приказ оборонять остров должен оставлять гарнизону путь к следующей позиции, а не только красивую последнюю телеграмму."
 A10M_veteran_settlement:0 "Долг перед солдатскими семьями"
 A10M_veteran_settlement_desc:0 "Семьи убитых и искалеченных будут получать содержание по единому списку. Этот расход нельзя вычеркнуть красивой речью о победе: без него военная власть пожрёт собственную опору."
 A10M_restore_markets:0 "Открыть рынки после караула"
 A10M_restore_markets_desc:0 "Пристани и мастерские должны вновь работать без ежедневного вмешательства коменданта. Трудовые батальоны будут распущены, а часть снабженческих полномочий вернётся гражданским распорядителям."
 A10M_iron_archipelago:0 "Железный архипелаг"
 A10M_iron_archipelago_desc:0 "Военный режим пережил первые бунты и научился считать цену собственных приказов. Он сохранит гарнизоны и закрытый конгресс, но его прочность теперь зависит от работающих складов и людей, способных дожить до следующего урожая."
 A10M_mateo_sandoval_name:0 "Матео Сандоваль"
 A10M_MILITARY:0 "Филиппинское военное государство"
 A10M_MILITARY_DEF:0 "Филиппинское военное государство"
 A10M_MILITARY_ADJ:0 "Филиппинск."
 A10M_MILITARY_neutrality:0 "Филиппинское военное государство"
 A10M_MILITARY_neutrality_DEF:0 "Филиппинское военное государство"
 A10M_MILITARY_neutrality_ADJ:0 "Филиппинск."
 A10M_MILITARY_democratic:0 "Филиппинское военное государство"
 A10M_MILITARY_democratic_DEF:0 "Филиппинское военное государство"
 A10M_MILITARY_democratic_ADJ:0 "Филиппинск."
 A10M_MILITARY_fascism:0 "Филиппинское военное государство"
 A10M_MILITARY_fascism_DEF:0 "Филиппинское военное государство"
 A10M_MILITARY_fascism_ADJ:0 "Филиппинск."
 A10M_MILITARY_communism:0 "Филиппинское военное государство"
 A10M_MILITARY_communism_DEF:0 "Филиппинское военное государство"
 A10M_MILITARY_communism_ADJ:0 "Филиппинск."
 A10M_opposition:0 "Оппозиция"
 A10M_repression:0 "Репрессии"
 A10M_strain:0 "Истощение снабжения"
 A10M_state_of_siege:0 "Государство под караулом"
 A10M_state_of_siege_desc:0 "Оппозиция: §Y[?A10M_opposition|0]/100§!\nРепрессии: §Y[?A10M_repression|0]/100§!\nИстощение снабжения: §Y[?A10M_strain|0]/100§!\n\nКаждый месяц оппозиция растёт на §R2§!. Война добавляет §R2§! истощения, мир уменьшает его на §G1§!. При репрессиях от §Y65§! ежемесячно добавляются ещё §R2§! оппозиции и §R2§! истощения. Вне постоянной хунты репрессии уменьшаются на §G1§! в месяц. Учреждения и обязательства изменяют этот итог.\n\nОппозиция от §Y65§! вызывает забастовки, истощение от §Y65§! — перебои снабжения. От §Y80§! возможны заговор и продовольственный кризис; каждый из них повторяется не чаще раза в 150 дней. Снижение показателей ниже 65 снимает соответствующие штрафы."
 A10M_martial_government:0 "Чрезвычайное военное правительство"
 A10M_martial_government_desc:0 "Армия удерживает порты и учреждения, но её право управлять признают далеко не все островитяне."
 A10M_censored_society:0 "Общество под цензурой"
 A10M_censored_society_desc:0 "Цензор пропускает победные сообщения и задерживает всё, что может смутить командование."
 A10M_requisition_bureaus:0 "Реквизиционные бюро"
 A10M_requisition_bureaus_desc:0 "Квоты поддерживают арсеналы за счёт сельских запасов. Ежемесячно: §R+2§! истощения снабжения."
 A10M_compensation_bonds:0 "Казначейские расписки поставщикам"
 A10M_compensation_bonds_desc:0 "Казна платит за изъятые запасы. Ежемесячно: §G−2§! истощения снабжения."
 A10M_compulsory_labour:0 "Принудительные трудовые батальоны"
 A10M_compulsory_labour_desc:0 "Военные стройки забирают работников из семей и мастерских. Ежемесячно: §R+3§! оппозиции и §R+2§! истощения снабжения."
 A10M_cadet_estate:0 "Кадетское сословие"
 A10M_cadet_estate_desc:0 "Новые офицеры обязаны своим положением военному государству."
 A10M_military_levies:0 "Военные призывные списки"
 A10M_military_levies_desc:0 "Общие списки расширяют резерв и отвлекают работников от производства."
 A10M_field_hospitals:0 "Гарнизонные лазареты"
 A10M_field_hospitals_desc:0 "Медики и санитарные лодки получают постоянное снабжение. Ежемесячно: §G−1§! истощения снабжения."
 A10M_supply_inspectorate:0 "Интендантская инспекция"
 A10M_supply_inspectorate_desc:0 "Потери на складах больше не исчезают из отчётов. Ежемесячно: §G−1§! истощения снабжения."
 A10M_permanent_junta:0 "Постоянная радикальная хунта"
 A10M_permanent_junta_desc:0 "Чрезвычайное положение признано вечным основанием власти. Репрессии больше не уменьшаются сами по себе."
 A10M_political_commissars:0 "Надзиратели при командирах"
 A10M_political_commissars_desc:0 "Политический надзор поддерживает решимость и связывает инициативу."
 A10M_barracks_state:0 "Казарменное государство"
 A10M_barracks_state_desc:0 "Новые возрастные группы готовятся к строю, пока гражданские стройки ждут работников."
 A10M_military_directorate:0 "Военный директорат"
 A10M_military_directorate_desc:0 "Начальники служб делят полномочия, сохраняя власть армии над закрытым конгрессом."
 A10M_professional_service:0 "Профессиональная служба"
 A10M_professional_service_desc:0 "Устав требует подготовки и запрещает месть под видом проверки верности. Ежемесячно: §G−1§! оппозиции."
 A10M_published_budget:0 "Опубликованные военные расходы"
 A10M_published_budget_desc:0 "Проверяемая смета возвращает доверие поставщиков. Ежемесячно: §G−1§! истощения снабжения."
 A10M_veterans_obligations:0 "Обязательства перед семьями солдат"
 A10M_veterans_obligations_desc:0 "Содержание семей становится постоянной статьёй бюджета. Ежемесячно: §G−1§! оппозиции и §G−2§! истощения снабжения."
 A10M_civil_recovery:0 "Гражданское восстановление"
 A10M_civil_recovery_desc:0 "Рынки вновь кормят острова, а мастерские получают работников. Ежемесячно: §G−1§! оппозиции и §G−1§! истощения снабжения."
 A10M_coastal_watch:0 "Береговая наблюдательная служба"
 A10M_coastal_watch_desc:0 "Сигнальные посты связывают патрули и гарнизоны."
 A10M_strikes:0 "Забастовки и тайные ячейки"
 A10M_strikes_desc:0 "При оппозиции от 65 склады и мастерские становятся местом сопротивления. Штраф исчезнет после снижения оппозиции ниже 65."
 A10M_rationing:0 "Срыв продовольственных квот"
 A10M_rationing_desc:0 "При истощении от 65 приказов больше, чем риса и исправных лодок. Штраф исчезнет после снижения истощения ниже 65."
 A10M_shattered_officer_corps:0 "Обезглавленные штабы"
 A10M_shattered_officer_corps_desc:0 "Устрашение сломило противников, но унёсшиеся с ними знания не заменишь новой присягой."
 A10M_iron_state:0 "Железный архипелаг"
 A10M_iron_state_desc:0 "Гарнизоны держат проливы, а государство научилось переживать собственные чрезвычайные меры."
 A10M_system_tt:0 "Открывает управление §Yоппозицией§!, §Yрепрессиями§! и §Yистощением снабжения§! через решения «Государство под караулом». Показатели ограничены диапазоном 0–100."
 A10M_recall_members_tt:0 "Присоединяет только наши собственные подчинённые островные республики и возвращает их войска. Независимые страны и чужие субъекты сохраняют свой статус."
 A10M_junta_tt:0 "Репрессии больше не снижаются на 1 каждый месяц. Освобождение задержанных остаётся доступным."
 A10M_requisition_tt:0 "Реквизиционные бюро ежемесячно добавляют §R2§! истощения снабжения. Открывает чрезвычайные реквизиции и их последующую отмену."
 A10M_compensation_tt:0 "Расписки ежемесячно уменьшают истощение снабжения на §G2§!."
 A10M_labour_tt:0 "Трудовые батальоны ежемесячно добавляют §R3§! оппозиции и §R2§! истощения снабжения. Их можно распустить отдельным решением."
 A10M_hospitals_tt:0 "Лазареты ежемесячно уменьшают истощение снабжения на §G1§!."
 A10M_inspectorate_tt:0 "Инспекция ежемесячно уменьшает истощение снабжения на §G1§!. Открывает ротацию гарнизонов."
 A10M_budget_tt:0 "Ревизия ежемесячно уменьшает истощение снабжения на §G1§!."
 A10M_professional_tt:0 "Уставная служба ежемесячно уменьшает оппозицию на §G1§!."
 A10M_settlement_tt:0 "Выплаты ежемесячно уменьшают оппозицию на §G1§! и истощение снабжения на §G2§!."
 A10M_recovery_tt:0 "Распускает трудовые батальоны. Восстановление ежемесячно уменьшает оппозицию и истощение снабжения на §G1§!."
 A10M_suspend_requisitions_tt:0 "Обязательные квоты прекращают ежемесячно добавлять 2 истощения снабжения. Разовые чрезвычайные реквизиции остаются доступны."
 A10M_provincial_hearings:0 "Выслушать провинциальных посредников"
 A10M_provincial_hearings_desc:0 "Подписанные жалобы дадут островам способ говорить без тайных собраний. Оппозиция: §G−12§!, репрессии: §G−3§!, истощение: §R+3§!."
 A10M_security_sweep:0 "Провести облавы комендатур"
 A10M_security_sweep_desc:0 "Аресты разрушат сеть противников, но их семьи запомнят лица караулов. Оппозиция: §G−18§!, репрессии: §R+12§!, истощение: §R+6§!."
 A10M_release_detainees:0 "Пересмотреть списки задержанных"
 A10M_release_detainees_desc:0 "Освобождение людей без предъявленного обвинения ограничит произвол комендантов. Репрессии: §G−15§!, оппозиция: §G−5§!."
 A10M_purchase_rice:0 "Закупить рис для гарнизонов и семей"
 A10M_purchase_rice_desc:0 "Казённые закупки пополнят запасы прежде, чем очередная квота разорит пристань. Истощение: §G−18§!, оппозиция: §G−3§!."
 A10M_emergency_requisition:0 "Изъять резервные поставки"
 A10M_emergency_requisition_desc:0 "Склад получит оружие за счёт запасов, предназначенных для будущих работ. Истощение: §R+12§!, оппозиция: §R+8§!."
 A10M_rotate_garrisons:0 "Сменить гарнизонные команды"
 A10M_rotate_garrisons_desc:0 "Смена начальников ослабит местные поборы и позволит проверить ведомости. Оппозиция: §G−8§!, истощение: §G−8§!."
 A10M_end_labour_battalions:0 "Распустить трудовые батальоны"
 A10M_end_labour_battalions_desc:0 "Люди вернутся в семьи, а казна признает обязательства перед поставщиками. Оппозиция: §G−15§!, истощение: §G−10§!."
 A10M_recall_officers:0 "Вернуть отстранённых специалистов"
 A10M_recall_officers_desc:0 "Штабам снова нужны опытные люди, даже если их прежние показания неудобны коменданту. Снимает штраф обезглавленных штабов; оппозиция: §R+5§!, репрессии: §G−5§!."
 A10M_suspend_requisitions:0 "Отменить обязательные квоты"
 A10M_suspend_requisitions_desc:0 "Поставки вернутся к закупкам по договору. Истощение: §G−15§!; реквизиционные бюро прекращают работу."
 A10M.1.t:0 "Последний звонок конгресса"
 A10M.1.d:0 "На рассвете делегатов вывели между караулами. Полковник Сандоваль принял доклады о занятых причалах и приказал снять с дверей печати конгресса. Радикалы требуют немедленных арестов. Интенданты напоминают, что без прежних служащих порт не сумеет выдать даже суточный паёк."
 A10M.1.a:0 "Закрепить власть показательной чисткой."
 A10M.1.b:0 "Оставить служащих под офицерским поручительством."
 A10M.2.t:0 "Подсудимые в мундирах"
 A10M.2.d:0 "Трибунал представил два списка. В первом — офицеры, против которых есть подписанные показания. Во втором — всякий начальник, когда-либо возражавший полковнику. Молодые радикалы уже требуют освободившиеся должности; штаб предупреждает, что списки включают лучших организаторов снабжения."
 A10M.2.a:0 "Судить только по предъявленным обвинениям."
 A10M.2.b:0 "Выжечь нелояльность во всём штабе."
 A10M.3.t:0 "Пустые мешки под казённой печатью"
 A10M.3.d:0 "Коменданты снова отчитались об исполненных квотах, но на пристанях стоят пустые мешки. В деревнях едят посевное зерно, гарнизоны делят недостающие пайки. Казна может срочно закупить продовольствие и сократить требования. Радикалы предлагают забрать остатки хозяйственных запасов ради немедленного снабжения армии."
 A10M.3.a:0 "Снизить квоты и заплатить за рис."
 A10M.3.b:0 "Забрать остатки. Армия получит своё."
 A10M.4.t:0 "Заговор под складской крышей"
 A10M.4.d:0 "Портовые рабочие, провинциальные посредники и несколько младших офицеров готовили общую остановку погрузки. Охрана захватила переписку, но новые аресты могут поднять соседние гарнизоны. Посредники обещают прекратить выступления в обмен на пересмотр задержаний и обязательств казны."
 A10M.4.a:0 "Купить перемирие пересмотром обязательств."
 A10M.4.b:0 "Объявить заговорщиков врагами государства."
 A10M.5.t:0 "Парад и закрытые двери"
 A10M.5.d:0 "На пристани прошли части нового военного государства. За трибуной остался дом конгресса, куда делегаты так и не вернулись. Командование может превратить день в новую присягу или открыть приём прошений, чтобы услышать семьи тех, кто прошёл перед трибуной."
 A10M.5.a:0 "Присяга превыше прошений."
 A10M.5.b:0 "Открыть приём семей и посредников."
 A10M.6.t:0 "Посредники у комендатуры"
 A10M.6.d:0 "Отзыв хартий не уничтожил людей, которые ими пользовались. Советы прислали старейшин с просьбой сохранить местных писарей, расписание рынков и привычный порядок водных перевозок. Радикалы видят в этих просьбах попытку переждать переворот; интенданты — единственный способ не остановить жизнь островов."
 A10M.6.a:0 "Сохранить местные службы под надзором."
 A10M.6.b:0 "Заменить посредников военными командами."
