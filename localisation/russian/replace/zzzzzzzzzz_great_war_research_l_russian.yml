 smoke_generator:0 "Дымогенераторы"
 smoke_generator_desc:0 "Небольшая модификация труб и энергетической установки позволяет легким и средним кораблям создавать дымовые завесы, чтобы скрываться от противника."
 basic_depth_charges:0 "Базовые глубинные бомбы"
 basic_depth_charges_desc:0 "Простой контейнер со взрывчаткой и детонатором, срабатывающим при достижении заданной глубины.\n\nУстановка этого модуля на §Yлегкие корабли§! и §Yкрейсеры§! даст возможность атаковать вражеские §Yподводные лодки§!."
 sonar_desc:0 "Базовый гидролокатор, способный отслеживать цели под водой по производимому ими шуму.\n\nУстановка этого модуля в §Yячейку для электроники§! на §Yлегких кораблях§! и §Yкрейсерах§! поможет обнаруживать вражеские §Yподводные лодки§!."
 improved_sonar:0 "Активный сонар"
 improved_sonar_desc:0 "Это оборудование излучает звуковые волны и способно достаточно точно оценить направление и расстояние до подводного объекта.\n\nУстановка этого модуля в §Yячейку для электроники§! на §Yлегких кораблях§! и §Yкрейсерах§! поможет обнаруживать вражеские §Yподводные лодки§!."
