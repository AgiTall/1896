 heavy_sp_artillery_brigade:0 "Тяжелая САУ"
 tank_interleaved_suspension:0 "Шахматное расположение катков"
 tank_interleaved_suspension_desc:0 "Размещая катки в шахматном порядке, можно поставить больше катков при той же длине кузова, улучшив тем самым мобильность и обеспечив дополнительную защиту с боков."
 air_equipment:0 "Авиация"
 amphibious:0 "Морской десант"
 sub_missile_launcher:0 "Ракетный комплекс для подлодки"
 sub_missile_launcher_desc:0 "Комплекс для запуска управляемых и баллистических ракет с подлодки."
 sp_air_generic_reward_air_xp_1:0 "Глоток свежего воздуха"
 sp_air_generic_aerodynamics_advancements_reward:0 "Развитие аэродинамики"
 sp_air_generic_aerodynamics_advancements_reward_desc:0 "Проводя научные исследования, мы совершили новые открытия в области аэродинамики. Они пойдут на пользу нашим авиастроителям."
 smoke_launchers:0 "Дымовые установки"
 smoke_launchers_desc:0 "Батарея пиротехнических устройств, которые можно включать изнутри, чтобы создавать снаружи танка густую дымовую завесу. Очень полезна в обороне или при попадании в засаду."
 small_plane_airframe_1:0 "Базовый корпус маленького самолета"
 small_plane_airframe_1_desc:0 "В последние годы появился ряд новых технологий, благодаря которым можно собирать мощные, но компактные самолеты. Этот корпус — всего лишь первый шаг на этом пути."
 FJN:0 "Фуцзянь"
 sp_air_generic_major_breakthrough_reward:0 "Крупный прорыв"
 sp_air_generic_major_breakthrough_reward_desc:0 "На очередном этапе разработки прототипа мы совершили крупный прорыв."
 submarine_offensive:0 "Атака подводных лодок"
 submarine_offensive_desc:0 "Обеспечив максимальный уровень связи между нашими подводными лодками, мы можем использовать их в наступательных целях. Уничтожим вражеские конвои быстрее, чем противник успеет их заменить."
 SUBDOCTRINE_CARPET_BOMBING:0 "Ковровая бомбардировка"
 sp_naval_modern_battleship_unique_reward_b:0 "Современный линкор: защита"
 sp_naval_modern_battleship_unique_reward_b_desc:0 "Чтобы сохранить свое влияние на море и доказать эффективность линкоров, нам предстоит повысить их способность противостоять вражеским ударам. Какие системы следует улучшить, чтобы наши корабли могли дать отпор любому противнику?"
 heavy_tank_destroyer_chassis:0 "Тяжелая ПТ-установка"
 heavy_tank_destroyer_chassis_desc:0 "Большая боевая машина с мощным орудием для уничтожения вражеской бронетехники."
 sp_land_reward_option_land_cruiser_turret_simplify:0 "Упростить конструкцию башен."
 massed_bomber_formations:0 "Бомбардировки в боевом порядке"
 massed_bomber_formations_desc:0 "Сохраняя боевой порядок, наши бомбардировщики смогут защищаться и повысят шанс успешного бомбометания."
 forward_interception:0 "Упреждающий перехват"
 forward_interception_desc:0 "Действуя ближе к вражескому воздушному пространству, мы увеличим вероятность перехвата вражеских самолетов до того, как они достигнут цели."
 sp_armored_lc_naval_engine_conversion_tech:0 "Конверсия корабельных двигателей"
 sp_armored_lc_naval_engine_conversion_tech_desc:0 "Используя такие достижения военно-морской техники, как усиленные коленчатые валы, высокомоментные приводы и специальные системы охлаждения, можно повысить мощность и долговечность двигателей сухопутных крейсеров, что позволит им более эффективно работать при огромных нагрузках."
 SUBDOCTRINE_FIGHTER_HOMELAND_DEFENSE_DESC:0 "Чтобы мы могли эффективно вести боевые действия, необходимо любой ценой защитить промышленность и инфраструктуру от стратегических бомбардировщиков."
 chemical_warfare:0 "Химическая война"
 sp_land_reward_option_land_cruiser_track_reduce_armor_bonus_name:0 "Уменьшенное бронирование"
 YLN:0 "Юйлинь"
 lc_internal_ammunition_compartments:0 "Внутренние отсеки для боеприпасов"
 lc_internal_ammunition_compartments_desc:0 "Укрепленные отсеки для хранения дополнительного боезапаса. Позволяют сухопутному крейсеру дольше держаться в бою без пополнения запасов."
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_safety:0 "Попытаться спасти рабочих."
 SUBDOCTRINE_IRREGULARS_DESC:0 "Асимметричный подход к ведению пехотной войны, при котором избегается прямое столкновение с превосходящими силами противника, а применяется партизанская тактика засад, дезориентации и преследования с целью сломить решимость врага."
 submarine_operations_bs:0 "Операции подводных лодок"
 submarine_operations_bs_desc:0 "Нам необязательно вступать в открытое сражение с вражескими кораблями, чтобы победить в войне. Можно наносить удары по чужим торговым судам и уходить на глубину прежде, чем противник опомнится. Трудно воевать с тем, что не видишь."
 medium_sp_artillery_brigade:0 "Средняя САУ"
 jet_tac_bomber_equipment:0 "Реактивный тактический бомбардировщик"
 jet_tac_bomber_equipment_desc:0 "Тактические бомбардировщики небольшие и быстрые; они способны помогать наземным силам и уничтожать вражеские сооружения."
