 tank_designer_signal:0 "Сигнальный (рота обеспечения)"
 tank_designer_signal_role_disallowed:0 "Добавить модуль, позволяющий выбирать роль §HСигнальный§!."
 tank_designer_armored_car_chassis:0 "Бронеавтомобиль"
 armored_car_one_man_tank_turret:0 "Одноместная турель"
 armored_car_one_man_tank_turret_desc:0 "Небольшая турель, едва вмещающая одного человека, в обязанности которого входит наводка и зарядка основного орудия, а также наблюдение за целями и угрозами."
 armored_car_two_man_tank_turret:0 "Двухместная турель"
 armored_car_two_man_tank_turret_desc:0 "Турель, позволяющая двум членам экипажа разделить работу по управлению орудием и наблюдению за обстановкой. Тем не менее, она не позволяет эффективно распределить работу между экипажем."
 armored_car_fixed_superstructure_turret:0 "Фиксированная надстройка"
 armored_car_fixed_superstructure_turret_desc:0 "Неподвижная надстройка позволяет основному вооружению двигаться по небольшой дуге, не поворачивая машину целиком. В то же время это позволяет установить на машину более мощное вооружение при ее небольших габаритах, что делает ее идеальной для засад."
 armored_car_secondary_turret_hmg:0 "Пулеметная турель"
 armored_car_secondary_turret_hmg_desc:0 "Тяжелый пулемет во вспомогательной турели. Расположение турели ограничивает дугу обстрела, снижая общую эффективность орудия, но позволяет машине поражать больше целей. Это особенно полезно при атаке."
 armored_car_secondary_turret_small_cannon:0 "Небольшая пушка"
 armored_car_secondary_turret_small_cannon_desc:0 "Небольшая пушка во вспомогательной турели. Расположение турели ограничивает дугу обстрела, снижая общую эффективность орудия, но позволяет машине поражать больше целей. Это особенно полезно при атаке."
 EQ_MOD_CAT_armored_car_secondary_turret_TITLE:0 "Вспомогательная турель"
 EQ_MOD_CAT_armored_car_turret_type_TITLE:0 "Турель"
 armored_car_truck_design:0 "Конструкция грузовика"
 armored_car_truck_design_desc:0 "Машина сконструированная как грузовик, с высокой кабиной и передними окнами, не оставляющими места для крупного вооружения. Хотя этот способ экономичен и надежен, он ограничивает наступательные возможности аппарата."
 tank_double_heavy_machine_gun:0 "Двойной пулемет"
 tank_double_heavy_machine_gun_desc:0 "Двойные пулеметы обеспечивают хорошую эффективность против пехоты. К сожалению, бронебойность патронов нисколько не лучше."
 GRAND_DOCTRINE_INDUSTRIAL_WARFARE:0 "Промышленная Война"
 GRAND_DOCTRINE_INDUSTRIAL_WARFARE_DESC:0 "Франко-прусская война определила тотальность современной войны, а Русско-японская война показала важность укреплений. Большая война подвергнет проверке множество тактик..."
 SUBDOCTRINE_ATTACK_IN_POSITION_WARFARE:0 "Атака в позиционной войне"
 SUBDOCTRINE_ATTACK_IN_POSITION_WARFARE_DESC:0 "Чтобы преодолеть тупик позиционной войны, пехоте следует предоставить автономию в принятии решений на низшем уровне, что позволит ей просачиваться в оборону противника и использовать мельчайшие слабости."
 SUBDOCTRINE_BITE_AND_HOLD:0 "Кусать и удерживать"
 SUBDOCTRINE_BITE_AND_HOLD_DESC:0 "Вместо попыток крупномасштабных наступательных операций мы сосредоточимся на захвате ограниченных целей, медленно, но верно вытесняя противника."
 SUBDOCTRINE_DEFENSE_IN_DEPTH:0 "Глубинная Оборона"
 SUBDOCTRINE_DEFENSE_IN_DEPTH_DESC:0 "Создание эшелонированных оборонительных рубежей жизненно важно для удержания захваченной территории и нанесения потерь атакующим за счёт задержек и контратак."
 SUBDOCTRINE_HURRICANE_BOMBARDMENT:0 "Ураганный Обстрел"
 SUBDOCTRINE_HURRICANE_BOMBARDMENT_DESC:0 "Артиллерия может нейтрализовать коммуникации и оборонительные позиции противника короткими интенсивными обстрелами, создавая хаос в момент начала нашей пехотной атаки, вместо попыток нанести как можно больше потерь."
 SUBDOCTRINE_INTEGRATED_FIREPOWER:0 "Интегрированная огневая мощь"
 SUBDOCTRINE_INTEGRATED_FIREPOWER_DESC:0 "Интеграция артиллерии крайне важна для обеспечения её способности поддерживать наступление или реагировать на запросы пехоты о поддержке."
 SUBDOCTRINE_METHODICAL_BATTLE:0 "Методичный Бой"
 SUBDOCTRINE_METHODICAL_BATTLE_DESC:0 "Тщательное планирование, хорошо организованное снабжение, а также интеграция новейших технологий в армию являются ключевыми элементами для обеспечения успешного наступления по всему фронту."
 SUBDOCTRINE_METHODICAL_FIRE:0 "Методичный Огонь"
 SUBDOCTRINE_METHODICAL_FIRE_DESC:0 "Широкое использование артиллерии необходимо не только для уничтожения противника и его укреплений, но и для сокращения потерь среди наших солдат."
