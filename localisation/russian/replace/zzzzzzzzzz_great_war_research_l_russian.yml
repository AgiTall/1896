 tactic_sf_armor_supported_assault:0 "Штурм города при поддержке бронетехники"
 medium_plane_airframe:0 "$tac_bomber_equipment$"
 medium_plane_airframe_desc:0 "Корпус самолета среднего размера с двумя-четырьмя двигателями и большим объемом, годящимся для полезной нагрузки, топливных баков или защитного оборудования."
 destroyed_ammo_storage:0 "Попадание в боезапас"
