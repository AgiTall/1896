 rocket_artillery_equipment_1:0 "Буксируемая реактивная артиллерия"
 rocket_artillery_equipment_1_desc:0 "Реактивная артиллерия менее точна и скорострельна, чем традиционные орудия, однако недостатки окупаются эффектом от одновременного попадания нескольких ракет в цель."
 sp_land_generic_reward_armor_bonus_1:0 "Улучшенное покрытие"
 night:0 "Ночь"
 SUBDOCTRINE_SELF_PROPELLED_SUPPORT_DESC:0 "Обеспечить армию мобильным гусеничным транспортом и защитить максимально возможное количество тяжелых вспомогательных вооружений — вот одна из наших важнейших задач в ближайшем будущем."
 lc_heavy_high_velocity_cannons:0 "Тяжелые скорострельные пушки"
 lc_heavy_high_velocity_cannons_desc:0 "Противотанковые орудия для сверхточного поражения вражеской бронетехники. Их высокоскоростные снаряды обеспечивают отличное пробитие на большой дистанции."
 force_rotation:0 "Принудительная ротация"
 force_rotation_desc:0 "Сражения, равно как периоды особой сосредоточенности, сильно изматывают, но, по возможности заменяя пилотов, мы уменьшим количество ошибок, возникающих из-за усталости."
 sp_naval_modern_carrier_free_design:0 "Современный авианосец"
 jet_engine_axial_3x:0 "Реактивный двигатель с 3 осями"
 jet_engine_axial_3x_desc:0 "$engine_1_3x_desc$"
 sp_naval_nuclear_missile_submarine_preference_c:0 "Нужно переждать"
 tank_auto_cannon:0 "Автоматическое орудие"
 tank_auto_cannon_desc:0 "Это орудие, сделанное по образцу скорострельной зенитной пушки, способно буквально уничтожать слабобронированные цели чередой снарядов. Небольшой калибр не снижает бронебойность."
 SUBDOCTRINE_FIGHTER_BOMBERS:0 "Истребители-бомбардировщики"
 tactic_tw_attack:0 "Тактическое отступление: атака"
 SUBDOCTRINE_MISSION_TYPE_TACTICS_DESC:0 "Наши командиры не должны быть бездумными роботами. Им следует разумно оценивать приказы и не следовать им строго, если это необходимо для достижения цели. Победа важнее слепого повиновения."
 sp_naval_generic_reward_test_failure_3:0 "Катастрофические последствия"
 HBC:0 "Хубэй"
 medium_sp_anti_air_brigade:0 "Средняя ЗСУ"
 fighter_sweeps:0 "Свободная охота"
 fighter_sweeps_desc:0 "Наши самолеты, агрессивно патрулирующие вражескую территорию, могут настигнуть самолеты противника во время взлета или посадки, когда они наиболее уязвимы, или сорвать вражеские учения."
 light_tank_aa_chassis:0 "Легкая ЗСУ"
