 STAT_ARMY_BREAKTHROUGH_DESC:0 "Скольких вражеских атак попытается избежать нападающая боевая единица, что позволит ей дольше атаковать."
 STAT_ARMY_BREAKTHROUGH_VALUE:0 "$VALUE|H1$"
 STAT_ARMY_BREAKTHROUGH_DIFF:0 " $VALUE|=+1$"
 STAT_ARMY_HARDNESS_DESC:0 "§T§HДоля пехоты§! показывает, какую часть вашей §Hдивизии§! составляет бронированная или хотя бы защищенная техника.\n\nВо время атаки на вашу дивизию все противопехотные и противотанковые атаки суммируются. Дивизия с высокой §Hдолей пехоты§! понесет меньше потерь от §Hпротивотанковых атак§! и больше - от §Hпротивопехотных атак§! (и наоборот).§!"
