 mio_cat_tech_medium_armor_and_modules:0 "Технологии средней бронетехники"
 shock_and_awe:0 "Шок и трепет"
 shock_and_awe_desc:0 "Огромное сосредоточение огневой силы, наносящее противнику мощный удар немедленно или достаточно своевременно, чтобы лишить его способности к дальнейшим действиям."
 hq_signal:0 "Персонал сигнальщиков и разведчиков"
 hq_signal_desc:0 "Координирует коммуникацию между армейскими подразделениями, собирает и помогает упорядочить полученные разведданные."
 SUBDOCTRINE_GRAND_ASSAULT_DESC:0 "Учитывая тяжелый опыт Первой мировой войны, мы должны применять продуманный и методичный подход к предбоевому планированию. Только тогда, используя все наши преимущества, мы сможем обрушиться на врага, словно лавина."
 submarine_offensive_bs:0 "Атака подводных лодок"
 submarine_offensive_bs_desc:0 "Обеспечив максимальный уровень связи между нашими подводными лодками, мы можем использовать их в наступательных целях. Уничтожим вражеские конвои быстрее, чем противник успеет их заменить."
 lc_armored_skirts:0 "Бронеюбки"
 lc_armored_skirts_desc:0 "Броневой пояс, закрепляемый на бортах траков, чтобы защитить уязвимые траки и систему подвески от противотанковых снарядов и стрелкового вооружения."
 sp_land_generic_reward_army_xp_1:0 "Инновации на поле боя"
 SUBDOCTRINE_NIGHT_BOMBING_DESC:0 "Дуэ ошибался: бомбардировщик не всегда способен пробиться к цели. Ночные бомбардировки менее точны, зато самолеты и экипажи гораздо чаще возвращаются с заданий."
 SUBDOCTRINE_LONG_RANGE_ESCORT_DESC:0 "Бомбардировка вражеской территории днем и без прикрытия грозит огромными потерями. Нам нужны истребители большой дальности, способные сопровождать бомбардировщики до цели и обратно."
 medium_tank_chassis_2:0 "Улучшенный средний танк"
 hq_maintenance:0 "Персонал планового обслуживания"
