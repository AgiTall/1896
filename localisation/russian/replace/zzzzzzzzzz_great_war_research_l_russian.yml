 basic_cruiser_armor_scheme:0 "Базовая схема бронирования крейсеров"
 basic_cruiser_armor_scheme_desc:0 "Схема бронирования с отдельными бронепоясом и бронепалубой, скопированная с конструкции крупных кораблей. Защищает от осколков и малокалиберных орудий.\n\nУстановка этого модуля на §Yкрейсеры§! улучшает способность §Yпротивостоять урону, наносимому врагом§!, но также §Rснижает§! §Yскорость§!."
 improved_cruiser_armor_scheme:0 "Схема бронирования крейсеров с наклонным бронепоясом"
 improved_cruiser_armor_scheme_desc:0 "Размещенный под углом бронепояс гораздо сложнее пробить при той же массе и толщине брони.\n\nУстановка этого модуля на §Yкрейсеры§! улучшает способность §Yпротивостоять урону, наносимому врагом§!, но также §Rснижает§! §Yскорость§!."
 advanced_cruiser_armor_scheme:0 "Схема бронирования крейсеров «Все или ничего»"
 advanced_cruiser_armor_scheme_desc:0 "В такой схеме бронирования упор делается на защиту только самых важных частей корабля.\n\nУстановка этого модуля на §Yкрейсеры§! улучшает их способность §Yпротивостоять урону, наносимому врагом§!, но также §Rснижает§! §Yскорость§!."
