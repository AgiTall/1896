l_russian:
 fighter:0 "Истребитель"
 fighter_equipment_desc:0 "Истребители - самолеты быстрые, маневренные и подходят для различных задач: это превосходство в воздухе, сопровождение союзных бомбардировщиков и перехват бомбардировщиков врага."
 cv_fighter:0 "Истребитель (палубный)"
 cv_fighter_equipment_desc:0 "Истребители - самолеты быстрые, маневренные и подходят для различных задач: это превосходство в воздухе, сопровождение союзных бомбардировщиков и перехват бомбардировщиков врага."
 jet_fighter:0 "Реактивный истребитель"
 jet_fighter_equipment:0 "Реактивный истребитель"
 jet_fighter_equipment_desc:0 "Истребители быстры и проворны и могут выполнять множество задач. От борьбы за превосходство в воздухе до защиты своих и перехвата вражеских бомбардировщиков."
 cas:0 "Штурмовик"
 CAS_equipment_desc:0 "Штурмовики созданы для поддержки действий наземных войск."
 nav_bomber:0 "Морской бомбардировщик"
 nav_bomber_equipment_desc:0 "Морские бомбардировщики предназначены для налетов на вражеские корабли."
 seaplane:0 "Гидросамолет"
 seaplane_equipment_desc:0 "Гидросамолеты предназначены для налетов на вражеские корабли. "
 tac_bomber:0 "Легкий бомбардировщик"
 tac_bomber_equipment_desc:0 "Легкие бомбардировщики - это небольшие быстрые бомбардировщики, которые могут помогать наземным войскам и бомбить вражеские здания."
 strat_bomber:0 "Тяжелый бомбардировщик"
 strat_bomber_equipment_desc:0 "Тяжелые бомбардировщики атакуют сооружения и инфраструктуру противника, уничтожая промышленность."
 transport_plane:0 "Транспорт"
 transport_plane_equipment_desc:0 "Перевозит пассажиров и авиагрузы."
 fighter_equipment:0 "Истребитель"
 cv_fighter_equipment:0 "Палубный истребитель"
 cv_fighter_equipment_short:0 "Палубный истребитель"
 strat_bomber_equipment:0 "Тяжелый бомбардировщик"
 scout_plane:0 "Самолет-разведчик"
 scout_plane_short:0 "Самолет-разведчик"
 scout_plane_equipment_desc:0 "Самолет, спроектированный специально для проведения фоторазведки. Главным образом полагается на скорость и незаметность, для ведения боя не приспособлен."
 scout_plane_equipment:0 "Самолет-разведчик"
 scout_plane_equipment_short:0 "Самолет-разведчик"
 scout_plane_equipment_1:0 "Самолет-разведчик I"
 scout_plane_equipment_1_short:0 "Самолет-разведчик I"
 scout_plane_equipment_1_desc:0 "Сбор данных о передвижениях войск и флота противника - важная задача авиации."
 scout_plane_equipment_2:0 "Самолет-разведчик II"
 scout_plane_equipment_2_short:0 "Самолет-разведчик II"
 scout_plane_equipment_2_desc:0 "Разрабатывая самолеты специально для разведки с воздуха и дальней разведки, мы обеспечиваем себе регулярное поступление точных данных о намерениях и возможностях нашего противника."
 scout_plane_equipment_3:0 "Самолет-разведчик III"
 scout_plane_equipment_3_desc:0 "Разрабатывая самолеты специально для разведки с воздуха и дальней разведки, мы обеспечиваем себе регулярное поступление точных данных о намерениях и возможностях нашего противника."
 scout_plane_equipment_3_short:0 "Самолет-разведчик III"
 aerial_bombs:0 "Авиабомбы"
 aerial_bombs_desc:0 "Бомбу можно установить на самолет, чтобы сбросить ее сверху и поразить наземную цель. Теперь бомбы можно прикреплять к фюзеляжу, а не бросать вручную. \n$allow_bomber_techs$"
 synchronizer:0 "Синхронизатор"
 synchronizer_desc:0 "Синхронизатор пушки или прерыватель - это устройство, позволяющее одномоторному самолету вести огонь из своего переднего вооружения по дуге вращающегося винта без попадания пуль в лопасти. Это позволяет наводить на цель не пушку, а самолет.\n$allow_fighter_and_seaplane_techs$"
 allow_fighter_and_seaplane_techs:0 "Позволяет исследовать §YИстребитель§! и §YГидросамолет§!."
 allow_bomber_techs:0 "Позволяет исследовать §YЛегкий бомбардировщик§! и §YТяжелый бомбардировщик§!."
 fighter_equipment_0:0 "Ранний истребитель"
 fighter_equipment_0_short:0 "Ранний истребитель"
 fighter_equipment_0_desc:0 "Прошло не так много времени с тех пор, как были изобретены эти летающие машины. И еще не так давно мы думали о том, чтобы взять их на войну. Но, наверное, от них есть какая-то польза."
 fighter_equipment_1:0 "Истребитель I"
 fighter_equipment_1_short:0 "Истребитель I"
 fighter_equipment_1_desc:0 "Темпы развития истребителей поражают воображение, и поэтому мы должны продолжать внедрять новые технологии и совершенствовать существующие концепции. Наш новый истребитель должен быть более надежным, обладать лучшей скоростью и мобильностью, чем другие самолеты. Кроме того, он должен быть правильно вооружен."
 fighter_equipment_2:0 "Истребитель II"
 fighter_equipment_2_short:0 "Истребитель II"
 fighter_equipment_2_desc:0 "Внедрение экспериментальных, но инновационных технологий, таких как синхронизированные передачи и конструкция триплана, может дать нам преимущество в воздушных боях."
 fighter_equipment_3:0 "Истребитель III"
 fighter_equipment_3_short:0 "Истребитель III"
 fighter_equipment_3_desc:0 "Истребители претерпели множество изменений. Мы должны начать переводить гражданские технологические достижения в военное применение."
 strat_bomber_equipment_1:0 "Тяжелый бомбардировщик I"
 strat_bomber_equipment_1_short:0 "Тяжелый бомбардировщик I"
 strat_bomber_equipment_1_desc:0 "У нас должен быть бомбардировщик, способный бомбить военные объекты противника и крупные города. Он должен летать высоко и на хорошей скорости, а также нести большую полезную нагрузку. Для этого потребуется большой планер с несколькими двигателями. Он также должен обладать определенными защитными характеристиками."
 strat_bomber_equipment_2:0 "Тяжелый бомбардировщик II"
 strat_bomber_equipment_2_short:0 "Тяжелый бомбардировщик II"
 strat_bomber_equipment_2_desc:0 "Бомбардировки доказали свою эффективность в снижении возможностей противника вести войну. Более мощное оборонительное вооружение и увеличенная скорость позволят новому проекту избежать уничтожения, а увеличение полезной нагрузки и дальности полета сделает его более эффективным."
 strat_bomber_equipment_3:0 "Тяжелый бомбардировщик III"
 strat_bomber_equipment_3_short:0 "Тяжелый бомбардировщик III"
 strat_bomber_equipment_3_desc:0 "Чтобы избежать потерь от вражеских истребителей и наземного огня, наша следующая конструкция будет летать на большой высоте. Он будет больше, чтобы нести как огромную полезную нагрузку, так и больше топлива, чтобы увеличить дальность полета."
 tac_bomber_equipment:0 "Легкий бомбардировщик"
 tac_bomber_equipment_1:0 "Легкий бомбардировщик I"
 tac_bomber_equipment_1_short:0 "Легкий бомбардировщик I"
 tac_bomber_equipment_1_desc:0 "Самые ранние легкие бомбардировщики предназначались для сброса бомб в ровном полете над целью."
 tac_bomber_equipment_2:0 "Легкий бомбардировщик II"
 tac_bomber_equipment_2_short:0 "Легкий бомбардировщик II"
 tac_bomber_equipment_2_desc:0 "Широко распространено мнение, что следующая война будет выиграна исключительно за счет бомбардировок противника. Необходимо начать разработку собственного самолета-бомбардировщика, способного нести тяжелую полезную нагрузку с достаточной скоростью."
 tac_bomber_equipment_3:0 "Легкий бомбардировщик III"
 tac_bomber_equipment_3_short:0 "Легкий бомбардировщик III"
 tac_bomber_equipment_3_desc:0 "Более тяжелые конструкции тактических бомбардировщиков могут увеличить дальность полета, полезную нагрузку и скорость, сохраняя при этом способность самолетов выполнять широкий спектр задач."
 transport_plane_equipment:0 "Транспортный самолет"
 transport_plane_equipment_1:0 "Транспортный самолет"
 transport_plane_equipment_1_short:0 "Транспорт"
 transport_plane_equipment_1_desc:0 "§LСамолеты, используемые для перевозки войск во время парашютных миссий.§!"
 nav_bomber_equipment:0 "Морской бомбардировщик"
 nav_bomber_equipment_1:0 "Морской бомбардировщик I"
 nav_bomber_equipment_1_short:0 "Морской бомбардировщик I"
 nav_bomber_equipment_1_desc:0 "В ближайшее десятилетие военно-морская авиация будет играть важную роль в противостоянии новым тенденциям в морской войне, таким как повышение роли подводных лодок. Пригодятся гидросамолеты, способные работать в качестве пикирующих бомбардировщиков и разведывательных машин."
 nav_bomber_equipment_2:0 "Морской бомбардировщик II"
 nav_bomber_equipment_2_short:0 "Морской бомбардировщик II"
 nav_bomber_equipment_2_desc:0 "Новые технологии двигателей и аэродинамически усовершенствованные конструкции значительно увеличат скорость и пикирующую способность морских самолетов."
 nav_bomber_equipment_3:0 "Морской бомбардировщик III"
 nav_bomber_equipment_3_short:0 "Морской бомбардировщик III"
 nav_bomber_equipment_3_desc:0 "Цельнометаллические конструкции и мощные воздушные тормоза позволяют создавать более сложные морские самолеты. Однако самолеты будущего потребуют большего экипажа для управления этими передовыми системами."
 seaplane_equipment:0 "Гидросамолет"
 seaplane_equipment_1:0 "Гидросамолет I"
 seaplane_equipment_1_short:0 "Гидросамолет I"
 seaplane_equipment_1_desc:0 "В ближайшее десятилетие военно-морская авиация будет играть важную роль в противостоянии новым тенденциям в морской войне, таким как повышение роли подводных лодок. Пригодятся гидросамолеты, способные работать в качестве пикирующих бомбардировщиков и разведывательных машин."
 seaplane_equipment_2:0 "Гидросамолет II"
 seaplane_equipment_2_short:0 "Гидросамолет II"
 seaplane_equipment_2_desc:0 "Новые технологии двигателей и аэродинамически усовершенствованные конструкции значительно увеличат скорость и пикирующую способность морских самолетов."
 seaplane_equipment_3:0 "Гидросамолет III"
 seaplane_equipment_3_short:0 "Гидросамолет III"
 seaplane_equipment_3_desc:0 "Цельнометаллические конструкции и мощные воздушные тормоза позволяют создавать более сложные морские самолеты. Однако самолеты будущего потребуют большего экипажа для управления этими передовыми системами."
 CAS_equipment:0 "Штурмовик"
 CAS_equipment_1:0 "Штурмовик I"
 CAS_equipment_1_desc:0 "Штурмовик играет роль, в поддержке наземных сил на поле боя. Поддержка поля боя обычно подразделяется на поддержку с воздуха и воздушное пресечение боя, причем первая требует строгого, а вторая - только общего взаимодействия с дружественными наземными силами."
 CAS_equipment_2:0 "Штурмовик II"
 CAS_equipment_2_desc:0 "Наша доктрина поддержки с воздуха требует наличия самолета, способного наносить точные удары по поверхности. Хотя эти самолеты несут меньшую полезную нагрузку по сравнению с нашими более крупными тактическими бомбардировщиками, они способны атаковать и уничтожать небольшие цели, представляющие опасность, с помощью обстрела и бомбометания с пикирования."
 CAS_equipment_3:0 "Штурмовик III"
 CAS_equipment_3_desc:0 "Опыт ранних войн показал, что для выживаемости штурмовиков в борьбе с вражескими истребителями и наземным огнем необходимы повышенная скорость, броня и маневренность. Следующее поколение будет также использовать более мощные бомбы, пушки и пулеметы для нанесения большего ущерба своим целям."
 cv_fighter_equipment_1:0 "Палубный истребитель I"
 cv_fighter_equipment_1_short:0 "Палубный истребитель I"
 cv_fighter_equipment_1_desc:0 "Ранний истребитель, модифицированный для взлета с и посадки на авианосец."
 cv_fighter_equipment_2:0 "Палубный истребитель II"
 cv_fighter_equipment_2_short:0 "Палубный истребитель II"
 cv_fighter_equipment_2_desc:0 "Улучшенный истребитель, модифицированный для взлета с и посадки на авианосец."
 cv_fighter_equipment_3:0 "Палубный истребитель III"
 cv_fighter_equipment_3_short:0 "Палубный истребитель III"
 cv_fighter_equipment_3_desc:0 "Современный истребитель, модифицированный для взлета с и посадки на авианосец."
 naval_equipment:0 "Флот"
 screen_ship:0 "Охранение"
 capital_ship:0 "Капитальные корабли"
 submarine_1:0 "Подводная лодка I"
 submarine_2:0 "Подводная лодка II"
 submarine_3:0 "Подводная лодка III"
 submarine_4:0 "Подводная лодка IV"
 cruiser_submarine:0 "$ship_hull_cruiser_submarine$"
 cruiser_submarine_desc:0 "$ship_hull_cruiser_submarine_desc$"
 fleet_submarine:0 "$ship_hull_fleet_submarine$"
 fleet_submarine_desc:0 "$ship_hull_fleet_submarine_desc$"
 coastal_submarine:0 "$ship_hull_coastal_submarine$"
 coastal_submarine_desc:0 "$ship_hull_coastal_submarine_desc$"
 submarine_1_desc:0 "Подводные лодки - это скрытные суда, предназначенные для уничтожения незащищенных конвоев. Ранние модели подводных лодок времен Великой войны прокладывают путь к новым методам ведения морской войны."
 submarine_2_desc:0 "Лучше вооруженные и более стабильные, новые конструкции подводных лодок созданы для того, чтобы использовать преимущества достижений в военно-морской тактике и иметь большую дальность действия, имея возможность атаковать удаленные маршруты конвоев."
 submarine_3_desc:0 "Роль подводной лодки во флоте за пределами нападений на конвои все еще обсуждается. Достижение баланса между сочетанием скорости, дальности и вооружения будет ключом к необходимой модели."
 submarine_4_desc:0 "Увеличенная глубина погружения и эффективные компоновки станут отличительными чертами современных подводных лодок, использующих полевой опыт для выбора соответствующего вооружения и двигателей."
 ship_hull_submarine_1_desc:0 "Подводные лодки - это скрытные суда, предназначенные для уничтожения незащищенных конвоев. Ранние модели подводных лодок времен Великой войны прокладывают путь к новым методам ведения морской войны."
 ship_hull_submarine_2_desc:0 "Лучше вооруженные и более стабильные, новые конструкции подводных лодок созданы для того, чтобы использовать преимущества достижений в военно-морской тактике и иметь большую дальность действия, имея возможность атаковать удаленные маршруты конвоев."
 ship_hull_submarine_3_desc:0 "Роль подводной лодки во флоте за пределами нападений на конвои все еще обсуждается. Достижение баланса между сочетанием скорости, дальности и вооружения будет ключом к необходимой модели."
 ship_hull_submarine_4_desc:0 "Увеличенная глубина погружения и эффективные компоновки станут отличительными чертами современных подводных лодок, использующих полевой опыт для выбора соответствующего вооружения и двигателей."
 torpedo_boat:0 "Миноносец"
 gunboat:0 "Поздняя канонерская лодка"
 destroyer_1:0 "Эсминец I"
 destroyer_2:0 "Эсминец II"
 destroyer_3:0 "Эсминец III"
 destroyer_4:0 "Эсминец IV"
 torpedo_boat_desc:0 "$ship_hull_torpedo_boat_desc$"
 gunboat_desc:0 "$ship_hull_gunboat_desc$"
 destroyer_1_desc:0 "Чтобы обеспечить безопасность конвоев, эсминцы времен Великой войны должны быть перепрофилированы и усовершенствованы. Вооружение судов большим количеством торпед позволит получить больше возможностей для ведения боевых действий."
 destroyer_2_desc:0 "Большая дальность действия торпед и более высокая скорость перезарядки, а также новые типы вооружения, такие как ПВО, позволят нашим эсминцам оставаться эффективными и универсальными."
 destroyer_3_desc:0 "Чтобы лучше противостоять угрозам сверху и снизу, новые эсминцы должны быть оснащены радарами и современным противовоздушным и противолодочным вооружением."
 destroyer_4_desc:0 "Современный эсминец должен быть оснащен различными технологиями обнаружения, новыми системами развертывания глубинных бомб и построен в большем масштабе, чем его предшественники."
 ship_hull_torpedo_boat_desc:0 "Небольшие быстроходные корабли, предназначенные для нанесения нокаутирующего удара торпедами по более крупным капитальным кораблям. Они дешевы в производстве, но крайне уязвимы перед любым видом огня, поэтому их эффективность зависит от скорости и численности."
 ship_hull_gunboat_desc:0 "Эти корабли, являющиеся эволюцией миноносцев, оснащены более мощным артиллерийским вооружением, что делает их менее зависимыми от одиночной торпедной атаки. Они лучше подходят для патрулирования прибрежных районов и охранения флота в условиях низкой угрозы."
 ship_hull_light_1_desc:0 "Первые настоящие эсминцы, эти корабли крупнее и более мореходны, чем миноносцы. Они сочетают солидное артиллерийское вооружение с торпедной угрозой и предназначены для охоты на миноносцы противника, одновременно охраняя основной боевой флот."
 ship_hull_light_2_desc:0 "По мере приближения Великой войны конструкции эсминцев становятся все более прочными и мощными. Эти корабли становятся быстрее, имеют больший радиус действия и могут быть оснащены расширенным набором вооружения, включая ранние глубинные бомбы и мины."
 ship_hull_light_3_desc:0 "Эсминцы военного времени - рабочие лошадки флота. Эти корабли рассчитаны на массовое производство и отличаются повышенной специализацией, в них больше мест для противолодочного и зенитного вооружения, что отражает их растущую роль в морской войне."
 ship_hull_light_4_desc:0 "Послевоенные эсминцы, ставшие кульминацией разработок военного времени, значительно крупнее, быстрее и лучше вооружены, чем их предшественники. Их универсальные корпуса, оснащенные новейшими двигателями, рассчитаны на установку более широкого спектра специализированного вооружения, что позволяет им служить мощными и адаптируемыми боевыми кораблями, способными выполнять множество функций в современном флоте."
 light_cruiser_0:0 "Бронепалубный крейсер"
 light_cruiser_1:0 "Легкий крейсер I"
 light_cruiser_2:0 "Легкий крейсер II"
 light_cruiser_3:0 "Легкий крейсер III"
 light_cruiser_4:0 "Легкий крейсер IV"
 torpedo_cruiser:0 "Торпедный крейсер"
 torpedo_cruiser_desc:0 "Легкие крейсера оснащались большим количеством торпедных аппаратов, за счет меньшей основной батареи и меньшего количества зенитных орудий."
 JAP_torpedo_cruiser:0 "Kitakami-class"
 light_cruiser_1_desc:0 "Маневренные легкие крейсера, способные поддерживать высокую скорость. Будут полезны для разведывательных миссий."
 light_cruiser_2_desc:0 "Послевоенные договора накладывают ограничения на крейсера, но хорошо вооруженные легкие суда могут быть разработаны, оставаясь в этих пределах."
 light_cruiser_3_desc:0 "Теперь, огибая границы договоров, можно строить более крупные и тяжелобронированные крейсера, все еще имеющие достаточно легкое вооружение, чтобы быть классифицированными как легкие крейсера."
 light_cruiser_4_desc:0 "Тактически используемые для защиты более крупных кораблей, современные легкие крейсера нового поколения могут избавиться от большинства прошлых ограничений и быть лучше вооружены для борьбы с авиацией."
 armored_cruiser_1:0 "Броненосный крейсер I"
 armored_cruiser_2:0 "Броненосный крейсер II"
 armored_cruiser_3:0 "Броненосный крейсер III"
 armored_cruiser_4:0 "Броненосный крейсер IV"
 armored_cruiser_1_desc:0 "Вашингтонский военно-морской договор был создан для предотвращения гонки вооружений крейсеров и других кораблей, но это кажется неизбежным. Сохраняя легкость брони, можно увеличить нагрузку на вооружение."
 early_armored_cruiser_desc:0 "Вашингтонский военно-морской договор был создан для предотвращения гонки вооружений крейсеров и других кораблей, но это кажется неизбежным. Сохраняя легкость брони, можно увеличить нагрузку на вооружение."
 armored_cruiser_2_desc:0 "Несмотря на новые усилия по заключению договоров, переоборудование легких крейсеров более тяжелым вооружением остается эффективным, хотя броня по-прежнему ограничена."
 armored_cruiser_3_desc:0 "Поскольку ограничения все чаще игнорируются во всем мире, могут быть построены более сбалансированные конструкции тяжелых крейсеров с большим приоритетом на броню. Лучшие зенитные орудия позволяют этим кораблям сотрудничать в борьбе в авиацией."
 armored_cruiser_4_desc:0 "Масштабные, более длинные и тяжелые конструкции с скорострельным вооружением являются характерными чертами на этих заключительных этапах разработки тяжелых крейсеров."
 ship_hull_cruiser_0_desc:0 "Бронепалубные крейсера отличаются дугообразной броневой палубой, защищающей их машинное отделение. Не имея существенного бокового броневого пояса, они уязвимы для прямого огня, но служат способными разведчиками и торговыми рейдерами в эпоху, предшествующую господству легких крейсеров."
 ship_hull_cruiser_1_desc:0 "Ранние броненосные и легкие крейсера - универсальные корабли, предназначенные для разведки, прикрытия основного флота и защиты торговых путей. Они быстрее старых бронепалубных крейсеров и имеют более мощную батарею, хотя и остаются легкобронированными."
 ship_hull_cruiser_2_desc:0 "По мере развития военно-морских технологий эти крейсера становятся все крупнее и быстрее, оснащаясь эффективными турбинными двигателями. Они предлагают более гибкие варианты размещения вооружения: пушек, торпед и ранних средств противовоздушной обороны, что делает их ценными многоцелевыми кораблями."
 ship_hull_cruiser_3_desc:0 "По мере того как крейсеры по всему миру становятся все мощнее и мощнее, требуются новые и более крупные корпуса, чтобы вместить все необходимое дополнительное оборудование."
 ship_hull_cruiser_4_desc:0 "Крейсера послевоенного поколения рассчитаны на более высокую скорость и большую дальность плавания. На них можно установить более мощное вооружение и новейшие вторичные модули. Они представляют собой значительную эволюцию по сравнению с довоенными аналогами и составляют основу современных флотов."
 protected_cruiser:0 "Бронепалубный крейсер"
 protected_cruiser_desc:0 "TODO"
 unprotected_cruiser:0 "Незащищенный крейсер"
 unprotected_cruiser_desc:0 "TODO"
 coastal_defense_ship:0 "Корабль береговой обороны"
 coastal_defense_ship_desc:0 "Слишком малый для настоящей войны в океане, этот относительно дешевый корабль жертвует дальностью плавания ради тяжелого вооружения и брони."
 battle_cruiser_1:0 "Линейный крейсер I"
 battle_cruiser_2:0 "Линейный крейсер II"
 battle_cruiser_3:0 "Линейный крейсер III"
 battle_cruiser_4:0 "Линейный крейсер IV"
 battle_cruiser_1_desc:0 "Послевоенная гонка вооружений линейных крейсеров привела к появлению нескольких тяжеловооруженных конструкций, пожертвовавших броней ради скорости по сравнению с линкорами."
 battle_cruiser_2_desc:0 "Перестроенные и перепрофилированные линейные крейсера продолжают превосходить даже современные конструкции линкоров по более легкой защите, но разработали более совершенные системы управления огнем, обнаружения и противовоздушной обороны."
 ironclad:0 "Поздний броненосец"
 battleship_0:0 "Додредноут"
 battleship_1:0 "Дредноут I"
 battleship_2:0 "Дредноут II"
 battleship_3:0 "Дредноут III"
 battleship_4:0 "Дредноут IV"
 ironclad_desc:0 "TODO"
 battleship_0_desc:0 "Одни считают их воплощением военно-морской мощи до революционных изменений в конструкции, другие - быстро устаревшим пережитком. Додредноутные линкоры были доминирующими капитальными кораблями военно-морских сил мира с 1890-х до середины 1893-х годов. Не обладая принципом «только большие пушки», присущим их преемникам - дредноутам, эти корабли были хорошо бронированы и несли грозное смешанное вооружение из орудий крупного и среднего калибра, составляя основу глобальных флотов в интенсивный период расширения ВМС и технологической эволюции."
 battleship_1_desc:0 "Одни считают их пережитком ушедшей эпохи морской войны, другие - самыми впечатляющими кораблями, когда-либо построенными, никто не может отрицать, что эти остатки гонки вооружений линкоров являются одними из самых хорошо вооруженных и бронированных судов, когда-либо построенных."
 battleship_2_desc:0 "С улучшенной стабильностью и дальностью действия, новое поколение линкоров улучшит предыдущие конструкции, оставаясь в пределах, предусмотренных военно-морскими договорами."
 battleship_3_desc:0 "Более толстая броня, более мощные двигатели, батарея крупнокалиберных орудий и улучшенные противовоздушные возможности могут позволить линкорам оставаться актуальными, если их правильно использовать, в мире, где в морской войне все больше доминирует поддержка с воздуха."
 battleship_4_desc:0 "По мере того, как мир видит, что, возможно, станет последним крупным столкновением линкоров, важность тяжелого вооружения и противовоздушных турелей возрастает как никогда."
 ship_hull_heavy_1_desc:0 "Первое поколение линкоров с принципом «только большие пушки», эти революционные проекты, оснащенные единой главной батареей крупнокалиберных орудий, в одночасье сделали все предыдущие линкоры устаревшими. Однако уже на ранних этапах их проектирования проявились недостатки в компоновке башен и относительно скромной скорости."
 ship_hull_heavy_2_desc:0 "Представляя собой эпоху «супердредноутов», эти корабли отличаются более эффективными центральными башнями, улучшенной броней и новыми мощными турбинными двигателями. Они стали крупнее, выносливее и быстрее своих предшественников, установив стандарт для капитальных кораблей Великой войны."
 ship_hull_heavy_3_desc:0 "В этих корпусах, разработанных во время войны, воплощены суровые уроки, полученные в ходе ранних морских сражений. Они обеспечивают большую гибкость для улучшения вторичного вооружения и противовоздушной обороны, а также повышенную дальность плавания и живучесть для удовлетворения растущих требований морской войны."
 ship_hull_heavy_4_desc:0 "Эти послевоенные корабли - вершина дизайна дредноутов, самые крупные и мощные капитальные корабли своей эпохи. Они обладают превосходной скоростью, защитой и значительным количеством модульных слотов, позволяющих устанавливать тяжелое вооружение и новейшие технологии, такие как система управления огнем."
 carrier_1:0 "Авианосец I"
 carrier_2:0 "Авианосец II"
 carrier_3:0 "Авианосец III"
 carrier_1_desc:0 "Многие военные теоретики считают, что морская авиация - это будущее. Преобразование старых капитальных кораблей и океанских лайнеров для перевозки самолетов станет первым шагом на пути к использованию этих новых судов."
 carrier_2_desc:0 "Когда начнется работа над первыми проектами авианосцев с килем, мы должны обеспечить, чтобы эти корабли имели дальность и скорость, чтобы не отставать от остальной части нашего флота, соблюдая при этом послевоенные морские договора."
 carrier_3_desc:0 "Усовершенствованные методы строительства и более специализированные системы, такие как лифты на краю палубы, позволяют авианосцам более эффективно перевозить больше самолетов."
 ship_hull_carrier_1_desc:0 "Многие военные теоретики считают, что морская авиация - это будущее. Преобразование старых капитальных кораблей и океанских лайнеров для перевозки самолетов станет первым шагом на пути к использованию этих новых судов."
 ship_hull_carrier_2_desc:0 "Когда начнется работа над первыми проектами авианосцев с килем, мы должны обеспечить, чтобы эти корабли имели дальность и скорость, чтобы не отставать от остальной части нашего флота, соблюдая при этом послевоенные морские договора."
 SH_battleship_1:0 "Сверхтяжелый линкор I"
 SH_battleship_2:0 "Сверхтяжелый линкор II"
 SH_battleship_1_desc:0 "В нынешнем состоянии мира больше нет места для соблюдения морских договоров. Без этих ограничений мы можем полностью сосредоточиться на создании самых тяжелых, самых хорошо вооруженных линкоров всех времен и народов, способных вступать в бой с меньшими судами."
 SH_battleship_2_desc:0 "Усовершенствование нашей более ранней сверхтяжелой конструкции с более мощным вооружением и улучшенными системами управления огнем."
 ship_hull_torpedo_boat:0 "Миноносец"
 ship_hull_gunboat:0 "Поздняя канонерская лодка"
 ship_hull_light_1:0 "Ранний эсминец"
 GER_ship_hull_light_1:0 "Ранний большой миноносец"
 ship_hull_light_2:0 "Эсминец 1896"
 GER_ship_hull_light_2:0 "Большой миноносец 1896"
 ship_hull_light_3:0 "Эсминец 1902"
 ship_hull_light_4:0 "Эсминец 1908"
 ship_hull_cruiser:0 "Крейсер"
 ship_hull_cruiser_desc:0 "Рабочая лошадка флота, крейсеры берут на себя множество важных обязанностей, от разведки и досмотра для легких крейсеров до поддержки боевой линии для тяжелых крейсеров."
 ship_hull_cruiser_0:0 "Крейсер 1880"
 ship_hull_cruiser_1:0 "Крейсер 1890"
 ship_hull_cruiser_2:0 "Крейсер 1893"
 ship_hull_cruiser_3:0 "Крейсер 1896"
 ship_hull_cruiser_4:0 "Крейсер 1902"
 ship_hull_cruiser_5:0 "Крейсер 1908"
 ship_hull_heavy:0 "Тяжелый корабль"
 ship_hull_heavy_desc:0 "Будучи высшим символом военно-морской мощи, эти массивные, тяжело бронированные бегемоты по-прежнему вызывают уважение в открытом море, хотя некоторые эксперты ставят под сомнение их роль в эпоху самолетов и подводных лодок."
 ship_hull_heavy_1:0 "Дредноут"
 ship_hull_heavy_2:0 "Супердредноут"
 ship_hull_heavy_3:0 "Поздний дредноут"
 ship_hull_heavy_4:0 "Последредноут"
 ship_hull_carrier:0 "Гидроавианосец"
 ship_hull_carrier_desc:0 "После долгих лет экспериментов авианосец постепенно превратился в самостоятельный класс кораблей. Способный поддерживать все большее количество все более мощных самолетов, авианосец готов стать последним словом в проецировании военно-морской мощи."
 ship_hull_carrier_0:0 "Ранний гидроавианосец"
 ship_hull_carrier_conversion_bb:0 "Переделанный линкор"
 ship_hull_carrier_conversion_ca:0 "Переделанный крейсер"
 improved_ship_hull_carrier:0 "Улучшенный гидроавианосец"
 ship_hull_carrier_1:0 "Гидроавианосец 1902"
 ship_hull_carrier_2:0 "Гидроавианосец 1908"
 ship_hull_submarine:0 "Подводная лодка"
 ship_hull_submarine_desc:0 "Далеко ушедшая от грубых лодок времен Великой войны, современная подводная лодка обладает большими возможностями, чем когда-либо прежде, и может угрожать даже самому большому кораблю при весьма умеренных затратах."
 ship_hull_submarine_1:0 "Ранняя подводная лодка"
 ship_hull_submarine_2:0 "Подводная лодка 1896"
 ship_hull_submarine_3:0 "Подводная лодка 1902"
 ship_hull_submarine_4:0 "Подводная лодка 1908"
 ship_hull_ironclad:0 "Поздний броненосец"
 ship_hull_ironclad_desc:0 "TODO"
 ship_hull_pre_dreadnought:0 "Додредноут"
 ship_hull_pre_dreadnought_desc:0 "Эти корабли, являющиеся переходным вариантом между броненосцами и дредноутами, имеют разнокалиберное главное вооружение и более медлительны, чем настоящие дредноуты. Они представляют собой военно-морской стандарт начала века, но быстро теряют актуальность."
 ship_hull_cruiser_panzerschiff:0 "$panzerschiff$"
 ship_hull_cruiser_panzerschiff_desc:0 "$panzerschiff_desc$"
 GER_ship_hull_cruiser_panzerschiff:0 "$GER_panzerschiff$"
 panzerschiff:0 "Карманный линкор"
 panzerschiff_desc:0 "Вооружение уровня практически боевого корабля при корпусе крейсера. Корабль, превосходящий по вооружению любой другой известный крейсер, но при этом дорогой, сравнительно медленный и относительно слабо бронированный."
 GER_panzerschiff:0 "Panzerschiff"
 ship_hull_super_heavy_1:0 "Сверхтяжелый линкор"
 ship_hull_super_heavy_1_desc:0 "В нынешнем состоянии мира больше нет места для соблюдения морских договоров. Без этих ограничений мы можем полностью сосредоточиться на создании самых тяжелых, самых хорошо вооруженных линкоров всех времен и народов, способных вступать в бой с меньшими судами."
 ship_hull_cruiser_submarine:0 "Подводный крейсер"
 ship_hull_cruiser_submarine_desc:0 "Большая подводная лодка, приспособленная для операций на больших расстояниях. Ее можно оснастить дополнительными топливными цистернами, чтобы сделать радиус действия еще больше, или снабдить небольшим самолетом-разведчиком."
 ship_hull_fleet_submarine:0 "Эскадренная подводная лодка"
 ship_hull_fleet_submarine_desc:0 "Подводные лодки, которые благодаря большой дальности хода могут выполнять функции эскорта и поддержки надводного флота."
 ship_hull_coastal_submarine:0 "Прибрежная подводная лодка"
 ship_hull_coastal_submarine_desc:0 "Небольшая маневренная подводная лодка с малой осадкой, хорошо подходящая для плавания по прибрежным каналам и гаваням. Ограниченность пространства позволяет ей достигать районов, недоступных для более крупных подводных лодок, и быть более сложной для обнаружения."
