 modern_small_airframe:0 "$small_plane_airframe_4$"
 modern_small_airframe_desc:0 "$small_plane_airframe_4_desc$"
 sp_land_reward_option_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc:0 "[Character.GetName] совершает важное открытие в области сообщения импульса. Благодаря этому нам удалось значительно увеличить скорость полета и мощность снарядов орудия «[SpecialProject.GetName]». Такое открытие не только открыло новые перспективы применения этого орудия на поле боя, но и приблизило нас к завершению проекта."
 tank_heavy_machine_gun:0 "Тяжелый пулемет"
 tank_heavy_machine_gun_desc:0 "Пулемет обеспечивает хорошую защиту от пехоты при небольших затратах. Даже со специальными бронебойными патронами он слабоэффективен против бронетехники."
 sp_land_generic_reward_option_artillery_tech_bonus_name:0 "Экспериментальные исследования в области артиллерии"
 naval_doctrine:0 "Морская доктрина"
 battlefield_support:0 "Боевая поддержка с воздуха"
 battlefield_support_desc:0 "Тактическим бомбардировщикам трудно атаковать цели там, где ведут бой наши сухопутные войска, поскольку бомбометание с горизонтального полета не такое точное, как в пикировании. Однако дополнительная подготовка и взаимодействие с наземными наблюдателями помогут решить эту проблему."
 lc_command_center:0 "Командный центр"
 lc_command_center_desc:0 "Полностью интегрированный командный центр, превращающий сухопутный крейсер в мобильный штаб. Оборудован улучшенной системой связи для координации масштабных военных операций."
 OWNER:0 "Владелец"
 hq_medium_armor:0 "Охрана штаба из средней бронетехники"
