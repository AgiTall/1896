 category_helicopter_support_companies:0 "Вертолетные роты обеспечения"
 tank_gas_turbine_engine:0 "Газовая турбина"
 tank_gas_turbine_engine_desc:0 "Турбина, разработанная на основе реактивного двигателя. Высокий расход топлива, но при этом максимальная скорость при данном объеме."
 fighter_baiting:0 "Ложные действия"
 fighter_baiting_desc:0 "Притворившись уязвимыми, наши истребители могут заманить противника в ловушку."
 lc_assault_gun:0 "Штурмовое орудие"
 lc_assault_gun_desc:0 "Спроектировано для ближних городских боев и подрыва бункеров. Стреляет мощными фугасными снарядами, зачищая пехотные позиции и уничтожая укрепленные цели."
