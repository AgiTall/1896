 ship_armor_armored_cruiser_2_short:0 "Бронирование броненосного крейсера II"
 ship_armor_armored_cruiser_2_desc:0 "TODO"
 ship_armor_light_cruiser_1:0 "50-мм пояс/40-мм палуба"
 ship_armor_light_cruiser_1_short:0 "Бронирование крейсера I"
 ship_armor_light_cruiser_1_desc:0 "Схема защиты, обеспечивающая крейсеру некоторое преимущество над эсминцами и прочими легкобронированными судами."
 ship_armor_light_cruiser_2:0 "100-мм пояс/30-мм палуба"
 ship_armor_light_cruiser_2_short:0 "Бронирование крейсера II"
 ship_armor_light_cruiser_2_desc:0 "Более толстый бронепояс дает крейсеру надежную защиту от огня старых легких крейсеров и малых кораблей."
 ship_armor_light_cruiser_3:0 "120-мм пояс/50-мм палуба"
 ship_armor_light_cruiser_3_short:0 "Бронирование крейсера III"
 ship_armor_light_cruiser_3_desc:0 "Эта схема бронирования использует принципы, используемые в линкорах, и разработана в ответ на относительное увеличение мощности корабельных орудий."
 ship_armor_light_cruiser_4:0 "150-мм пояс/60-мм палуба"
 ship_armor_light_cruiser_4_short:0 "Бронирование крейсера IV"
 ship_armor_light_cruiser_4_desc:0 "В этой схеме бронирования элементы, которые критически важны для функционирования корабля, получили более серьезную защиту за счет всех остальных частей."
 ship_armor_protected_cruiser_1:0 "38-мм палуба"
 ship_armor_protected_cruiser_1_short:0 "Бронирование бронепалубного крейсера I"
 ship_armor_protected_cruiser_1_desc:0 "Концепция брони, защищающая жизненно важные части корабля с помощью изогнутой броневой палубы, дополняющей боковую защиту угольными контейнерами вместо пояса. Как ранняя, экспериментальная концепция, ее компоновка менее эффективна по весу и менее оптимизирована, чем более поздние, более совершенные проекты."
 ship_armor_protected_cruiser_2:0 "50-мм палуба"
 ship_armor_protected_cruiser_2_short:0 "Бронирование бронепалубного крейсера II"
 ship_armor_protected_cruiser_2_desc:0 "Усовершенствованная концепция бронепалубного крейсера, основанная на предыдущем опыте эксплуатации. Благодаря продуманной и оптимизированной компоновке, эта схема бронирования обеспечивает значительно большую защиту при заданном весе."
 ship_armor_coastal_defense_ship:0 "240-мм пояс/30-мм палуба"
 ship_armor_coastal_defense_ship_short:0 "Бронирование корабля береговой обороны"
 ship_armor_coastal_defense_ship_desc:0 "Специализированная схема брони для кораблей береговой обороны, отличающаяся исключительно толстым поясом, сравнимым с линкором. Такая защита предназначена для отражения сильного огня во время ближних боев в прибрежной зоне."
 ship_armor_carrier_deck:0 "90-мм палуба"
 ship_armor_carrier_deck_short:0 "Бронирование летной палубы"
 ship_armor_carrier_deck_desc:0 "Тяжелые бронелисты защищают ангары от налетов бомбардировщиков, но при этом уменьшают их рабочий объем."
