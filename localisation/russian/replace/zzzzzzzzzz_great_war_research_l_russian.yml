 mass_motorization_desc:0 "Еще больший упор на моторизированную пехоту."
 hq_light_armor:0 "Охрана штаба из лёгкой бронетехники"
 hq_light_armor_desc:0 "Батальоны бронетехники позволяют штабу быстрее перемещаться по полю и дольше продержаться в бою, если того потребуют обстоятельства."
 sp_rocket_submarine_eq_bonus_stealth:0 "Ракетная подлодка — упор на скрытность"
 supersonic_fighter_equipment_1:0 "$supersonic_fighter1$"
 DOCTRINE_TRACK_COMBAT_SUPPORT:0 "Артиллерия и поддержка"
 reinforced_wings_mothership:0 "Усиленные крылья материнского самолета"
 reinforced_wings_mothership_desc:0 "Без своего материнского самолета истребители просто застрянут в небе, что серьезно ограничит их оперативную эффективность. Усиление воздушных крыльев материнского самолета — наиболее экономически выгодная стратегия для повышения выживаемости всей эскадрильи."
 sp_modern_carrier_eq_bonus_light_attack:0 "Современный авианосец: сдерживание легких кораблей"
 sp_land_generic_reward_test_failure_1:0 "Неубедительное испытание"
 light_tank_chassis_1:0 "Базовый легкий танк"
 FRA_ww1_mechanized_effort:0 "Усилие на механизацию"
 FRA_ww1_mechanized_effort_desc:0 "Позиционная война знаменует собой золотой век пулемётов и артиллерии. Наши солдаты уязвимы для такого оружия, и наши нынешние средства не позволяют нам противостоять этому злу. С помощью достаточно бронированной машины с длинными гусеницами, возможно, удастся пересечь укрепления, не опасаясь огня пехоты."
 SUBDOCTRINE_ASSAULT_INFANTRY_DESC:0 "Организуйте армию, применив общевойсковой подход к бою, и интегрируйте средства огневой поддержки вплоть до самых малых тактических подразделений."
 tank_medium_cannon:0 "Средняя пушка"
 tank_medium_cannon_desc:0 "Орудие общего назначения, используемое для широкого круга задач. Не достигает исключительной эффективности ни в борьбе с пехотой, ни в сражениях с танками, но обеспечивает боевой машине большую гибкость применения."
 CLOSE:0 "Закрыть"
 SUBDOCTRINE_FLYING_BATTERIES_DESC:0 "Общеармейская инициатива по повышению мобильности вспомогательных родов войск, чтобы они могли не отставать во время стремительного наступления моторизированных подразделений, быстро вступая в бой для оказания поддержки."
 sp_land_reward_option_land_cruiser_track_reduce_armor:0 "Уменьшить бронирование."
 improved_radio:0 "Улучшенная радиостанция"
 improved_radio_desc:0 "Благодаря повышению мощности сигнала теперь радиостанции могут передавать информацию на более дальние расстояния."
 convoy_interdiction_ti:0 "Перехват конвоев"
 convoy_interdiction_ti_desc:0 "Улучшенная координация действий наших подводных лодок позволяет им перехватывать конвои в пути. Нарушив маршруты снабжения противника, мы получим стратегическое преимущество."
 tactic_counterattack:0 "Контратака"
 helicopter_brigade:0 "Вертолетная бригада"
 helicopter_brigade_desc:0 "Бригада вертолетной поддержки общего назначения, способная оказывать мобильную помощь в различных областях."
 auto_loader:0 "Автозарядник"
 auto_loader_desc:0 "Автоматический механизм, заряжающий снаряды и позволяющий танку долго поддерживать высокую скорострельность."
 sp_land_reward_land_cruiser_engine:0 "Недостаточно мощный двигатель"
 sp_land_reward_land_cruiser_engine_desc:0 "Ранние испытания проекта «[SpecialProject.GetName]» показали, что его массивный каркас создает слишком большую нагрузку на двигатель, делая машину медленной и неповоротливой. Инженеры предлагают два варианта: разработать более мощный двигатель или же попытаться увеличить мощность имеющегося, что может привести к его поломке."
 lc_wet_ammunition_storage:0 "Влажное хранилище боеприпасов"
 lc_wet_ammunition_storage_desc:0 "Специальное хранилище, заполненное охлаждающей жидкостью. Минимизирует риск подрыва боезапаса от обстрела противником и значительно повышает безопасность экипажа."
 WE:0 "Мы"
 SUBDOCTRINE_CARRIER_STRIKES_DESC:0 "Почти вся мировая промышленность, в том числе ключевая военная, находится в пределах дальности полета от берега. Взлетающие с наших авианосцев самолеты могут наносить удары по тылам противника."
 sp_naval_generic_reward_scientist_xp_2:0 "Погружение в креативность"
 tactic_defender_hb_hold:0 "Удерживать мост"
 modern_carrier:0 "$ship_hull_carrier_modern$"
 modern_carrier_desc:0 "$ship_hull_carrier_modern_desc$"
 helicopter_recon:0 "Разведка с вертолетов"
 helicopter_recon_desc:0 "Специально обученные наблюдатели, способные быстро разведать местность на вертолетах независимо от рельефа и при необходимости нанести точечные удары."
 SUBDOCTRINE_SUBMARINE_CAPITAL_HUNTERS_DESC:0 "Главная задача подводной лодки в современной войне — не отвлекаться на мелкую добычу, а в первую очередь топить вражеские крупные корабли."
 convoy_interdiction_bs:0 "Перехват конвоев"
 convoy_interdiction_bs_desc:0 "Улучшенная координация действий наших подводных лодок позволяет им перехватывать конвои в пути. Нарушив маршруты снабжения противника, мы получим стратегическое преимущество."
 flying_fortress:0 "Летающая крепость"
 flying_fortress_desc:0 "Если оснастить наши высотные бомбардировщики пулеметами и достаточным количеством брони, они смогут выжить в схватке и вернуться домой."
 cv_small_plane_airframe_1:0 "Базовый корпус палубного самолета"
 cv_small_plane_airframe_1_desc:0 "Этот корпус воплощает в себе новые технологии, разработанные для самолетов наземного базирования, и потому обладает не меньшими возможностями, но позволяет самолету взлетать с палубы авианосца."
 escort_relay_system:0 "Посменный эскорт"
 escort_relay_system_desc:0 "Бомбардировщики в сопровождении истребителей улучшают нашу способность реагировать на вражеские атаки."
 sp_naval_generic_reward_scientist_xp_3:0 "Эврика!"
 SUBDOCTRINE_ARMORED_RAIDERS:0 "Бронированные рейдеры"
 large_plane_airframe_2:0 "Улучшенный корпус большого самолета"
 large_plane_airframe_2_desc:0 "Поскольку концепция стратегического бомбардировщика доказала право на существование, этот корпус был разработан для повышения нагрузки и дальности полета, при этом сохранив потенциал для дальнейшего развития."
 floating_airfield_ti:0 "Плавучая авиабаза"
 floating_airfield_ti_desc:0 "Улучшенная интеграция авианосцев в наш флот позволяет нам наносить удары с моря и воздуха. Это — ключ к обеспечению превосходства в воздухе везде, где бы мы ни были."
 central_planning:0 "Центральное планирование"
 central_planning_desc:0 "Теперь в планировании операции участвуют офицеры всех родов войск, что позволяет добиться максимальной эффективности."
 construction_tech:0 "Технология строительства"
 MOBILE_WARFARE_DOCTRINE:0 "Маневренная война"
 SUBDOCTRINE_LIGHT_TASK_FORCES_DESC:0 "Авианосцы — мощные, но уязвимые в прямом бою корабли. Чтобы палубная авиация стала серьезной силой, необходимо позаботиться о живучести несущих ее судов."
 tungsten_desc:0 "Вольфрам — редкий, прочный металл. Чаще всего его используют в производстве противотанковых снарядов, а также для станков и специальных типов запчастей."
 pioneer_support:0 "Инженеры"
 pioneer_support_desc:0 "Инженеры обучены укреплять плацдармы и осуществлять общие инженерные работы."
 amphibious_tank_chassis:0 "Танк-амфибия"
 amphibious_tank_chassis_desc:0 "Небольшое шасси для танка-амфибии. В связи с необходимостью обеспечивать плавучесть обладает строгими ограничениями на размер оружия и толщину брони."
 sp_land_reward_multi_charge_large_caliber_gun_test_failure:0 "Ужасный взрыв"
 sp_land_reward_multi_charge_large_caliber_gun_test_failure_desc:0 "Контрольное испытание было прервано мощным взрывом, сотрясшим полигон. Он не только уничтожил орудие, но и значительно повредил объекты инфраструктуры. Группа, которой руководит [Character.GetName], изучает причины взрыва и занимается устранением последствий, среди которых излишнее внимание общественности и необходимость перенести сроки выполнения проекта."
 medium_plane_airframe_0:0 "Корпус среднего самолета межвоенных лет"
 medium_plane_airframe_0_desc:0 "Несмотря на способность нести значительную нагрузку на большие расстояния, потенциал для развития этого корпуса сильно ограничен."
 SUBDOCTRINE_TACTICAL_BATTLEFIELD_SUPPORT_DESC:0 "Эскадры легких бомбардировщиков осыпают вражеские опорные пункты градом бомб, позволяя продвинуться наземным войскам."
 helicopter_transport:0 "Грузовые вертолеты"
 helicopter_transport_desc:0 "Вертолеты с улучшенной грузоподъемностью или оснащенные подъемным устройством с тросом, которые могут быстро доставить оборудование в нужное место, независимо от рельефа местности."
 support_tech:0 "Технология поддержки"
 tactic_tw_defend:0 "Отступление"
 sp_tag_radar:0 "Проекты радаров"
 SUBDOCTRINE_MOBILE_RECON_AND_ASSAULT:0 "Мобильные разведывательно-штурмовые отряды"
 SUBDOCTRINE_OPERATIONAL_AIR_SUPPORT_DESC:0 "Эта доктрина сосредоточена на завоевании господства на оперативном просторе за счет постоянных атак силами надежных средних самолетов."
 water_shallow_sea:0 "Мелководное море"
 water_shallow_sea_desc:0 ""
 sp_land_generic_reward_major_progress_1:0 "Многообещающий прототип"
 heavy_tank_destroyer_brigade:0 "Тяжелая ПТ-установка"
 heavy_tank_destroyer_brigade_desc:0 "Тяжелая противотанковая установка не имеет башни, зато несет тяжелое орудие, закрепленное в корпусе."
 super_heavy_artillery_desc:0 "Крупнокалиберные гаубицы, разработанные для одной цели — разрушения вражеских укреплений и фортификационных сооружений."
 sp_midget_submarine_eq_bonus_reliability:0 "Сверхмалая подводная лодка — упор на надежность"
 armored_spearhead:0 "Танковый прорыв"
 armored_spearhead_desc:0 "Полный потенциал танков нельзя раскрыть, если они все время оказывают поддержку пехоте. Вместо этого их следует объединить в быстрые, действующие независимо части, способные возглавить наступление.\n\n"
 militia:0 "Ополчение"
 militia_desc:0 "Добровольческое ополчение"
 anti_tank:0 "Поддержка ПТО"
 anti_tank_desc:0 ""
 land_doctrine_folder:0 "Сухопутная доктрина"
 land_doctrine_folder_desc:0 "Сухопутная доктрина, определяющая, как должны вести бой ваши наземные войска."
 SUBDOCTRINE_GUERILLA_WAR_DESC:0 "Изматывайте превосходящие силы противника постоянными атаками на его пути сообщения, подрывая его волю к продолжению борьбы. Избегайте крупных спланированных сражений, чтобы сохранить собственные ограниченные силы."
 motorized:0 "Моторизированная пехота"
 motorized_desc:0 "Пехота, оснащенная такими средствами транспортировки, как грузовики и мотоциклы."
 maintenance_company:0 "Ремонтная рота"
 maintenance_company_desc:0 "Выполняет различные виды ремонта, предотвращая поломки техники."
 sp_land_reward_option_land_cruiser_communication_redesign:0 "Переработать внутреннюю компоновку."
 SIK:0 "Синьцзян"
 sp_naval_midget_submarine_unique_reward_a:0 "Загрузить побольше"
 sp_naval_midget_submarine_unique_reward_a_desc:0 "Инженеры считают, что мы можем улучшить некоторые характеристики наших сверхмалых подводных лодок, однако место ограниченно, поэтому придется отдать приоритет чему-то одному."
 operational_destruction:0 "Операционное разрушение"
 operational_destruction_desc:0 "Атаки на вражеские пути снабжения мешают противнику перемещать силы между полями сражений. Это наделяет нашу сухопутную армию преимуществом в районах, где мы достигли превосходства в воздухе."
 sp_land_flamethrower_tank:0 "Огнеметный танк"
 sp_land_flamethrower_tank_desc:0 "Бронемашина, оснащенная смертоносным вооружением малой дальности и способная заливать вражеские позиции потоками огня."
 ICE:0 "Исландия"
 naval_strike_torpedo_tactics_oi:0 "Торпедный удар по надводным целям"
 naval_strike_torpedo_tactics_oi_desc:0 "Обучив пилотов более точно запускать торпеды, мы повысим эффективность наших налетов на вражеские корабли."
 tank_medium_two_man_tank_turret:0 "Двухместное орудие"
 tank_medium_two_man_tank_turret_desc:0 "Башня, в которой могут разместиться два члена экипажа, делящие между собой задачи по управлению орудием и наблюдению за обстановкой. Даже такая башня не дает эффективно распределить усилия между членами экипажа."
 tactic_sf_mouse_holing:0 "Партизанская борьба"
 category_all_armor:0 "Варианты бронетехники"
 sp_naval_torpedo_cruiser:0 "Торпедный крейсер"
 sp_naval_torpedo_cruiser_desc:0 "Согласно разработанной в прошлом веке концепции «Молодая школа», мы можем воспользоваться торпедными крейсерами, чтобы нанести значительный урон самым важным и дорогим кораблям наших врагов."
 RAN:0 "Рейхскомиссариат Анды"
 infiltration_assault:0 "Проникающий штурм"
 infiltration_assault_desc:0 "В начале атаки пехота должна найти слабые места во вражеской обороне, чтобы изолировать и обойти более укрепленные секции, которые потом будут уничтожены основной наступательной группой."
 sp_land_reward_option_stronghold_network_communication_system_overhaul_standardize:0 "Стандартизировать системы связи"
 fighter_veteran_initiative:0 "Программа поддержки ветеранов-истребителей"
 fighter_veteran_initiative_desc:0 "Упор на долгосрочное выживание за счет грамотной тактики и перевода опытных пилотов на учебную работу позволит летчикам передать свои знания новому поколению."
 floating_harbor_equipment_1:0 "Плавучая гавань"
 floating_harbor_equipment_1_desc:0 "Набор понтонов и готовых бетонных построек, которые можно перемещать по воде и собирать за считаные часы, создавая укрытые платформы для выгрузки припасов."
 medium_tank_destroyer_brigade:0 "Средняя ПТ-установка"
 medium_tank_destroyer_brigade_desc:0 "Самоходные противотанковые установки представляют собой танки с крупнокалиберными орудиями, закрепленными в корпусе, а не в башне. Средние ПТ-установки используют шасси средних танков, благодаря чему достаточно мобильны и несут внушительное вооружение."
 light_tank_aa_chassis_1:0 "Базовая легкая ЗСУ"
 category_divisional_support_battalions:0 "Дивизионные роты обеспечения"
 small_plane_airframe:0 "$fighter_equipment$"
 small_plane_airframe_desc:0 "Недостаток полезной нагрузки этот небольшой одно- или двухмоторный самолет искупает скоростью и маневренностью."
 floating_harbor_equipment:0 "Плавучая гавань"
 floating_harbor_equipment_desc:0 "Набор понтонов и готовых бетонных построек, которые можно перемещать по воде и собирать за считаные часы, создавая укрытые платформы для выгрузки припасов."
 light_battery_advice_tt:0 "\n\nУстановка модулей §YЛегкая батарея§! на §Yлегкие корабли§! и §Yкрейсеры§! усиливает §Yобстрел из легких орудий§!, что помогает этим малым кораблям топить вражеские §Yкорабли охранения§!. При этом §Yлегкие батареи§!, как правило, малоэффективны против бронированных кораблей, таких как §Yкрейсеры§! и §Yтяжелые корабли§!."
 GRAND_DOCTRINE_MOBILE_WARFARE_DESC:0 "Нанесите удар там, где они не ждут. Доктрина маневренной войны направлена на преодоление окопного застоя Первой мировой войны и включает в себя стремительное передвижение с целью упреждения и дезорганизации действий противника."
 medium_tank_chassis_1:0 "Базовый средний танк"
 communism:0 "Социализм"
 communism_desc:0 "Социалистический режим"
 tank_radio_1:0 "Базовая радиостанция"
 tank_radio_1_desc:0 "Базовая двунаправленная радиостанция позволяет танкам координировать свои тактические маневры в малом масштабе."
 sp_naval_super_heavy_battleship_preference_c_a:0 "Отдать приоритет легким орудиям"
 SUBDOCTRINE_TACTICAL_FLEXIBILITY_DESC:0 "Упор на наступательные воздушные сражения с целью завоевать контроль над воздушным пространством."
 synthetic_refinery:0 "Нефтеперерабатывающий завод"
 synthetic_refinery_desc:0 "Это сооружение производит в регионе"
 sp_midget_submarine_eq_bonus_range:0 "Сверхмалая подводная лодка — увеличенная дальность действия"
 tactic_infantry_charge:0 "Проникающий штурм"
 mechanized_wave:0 "Механизированная волна"
 mechanized_wave_desc:0 "Механизированные боевые части идеально подходят для быстрого наступления, необходимого при правильном использовании прорывов: они и поддерживают танковые части, и прикрывают фланги по линии прохода."
 industry:0 "Промышленность"
 SUBDOCTRINE_CARRIER_STRIKES:0 "Авиаудары с моря по берегу"
 SUBDOCTRINE_OPEN_OCEAN_AIR_PATROL:0 "Воздушное патрулирование открытого океана"
 hq_engineer:0 "Инженерный персонал"
 hq_engineer_desc:0 "Занимается вопросами фортификации, обеспечением мобильности войск и борьбой с мобильными группами противника."
 home_defence:0 "Гражданская оборона"
 home_defence_desc:0 "Наблюдатели на земле, а также пункты раннего обнаружения, действующие в унисон с нашими ВВС, позволяют отслеживать и уничтожать самолеты противника."
 sp_naval_cruiser_submarine_preference_a:0 "Дальность для нас важнее."
