 transport:0 "Транспортный корабль"
 transport_desc:0 "Корабли, созданные только для переброски войск, у них нет оборонительных возможностей."
 landing_craft:0 "Плавучая гавань"
 landing_craft_desc:0 "Судно, специально разработанное для высадки на вражескую территорию, слегка упростит задачу."
 tank_landing_craft:0 "Улучшенные десантные суда"
 tank_landing_craft_desc:0 "Улучшенные десантные суда позволят нашим парням быстрее достичь берега и эффективнее действовать во время вторжения."
