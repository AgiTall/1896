 TITLE_FLEET_IN_BEING:0 "Воздействие флотом"
 sp_land_generic_reward_option_army_xp_desc:0 "[Character.GetName] и специально отобранная группа офицеров провели встречу, где обсудили потенциал проекта «[SpecialProject.GetName]». В ходе обсуждений были выработаны новые методы применения этой технологии для войны на суше. Благодаря этому выросла наша военная мощь, и мы будем гораздо лучше подготовлены к предстоящим сражениям."
 sp_naval_modern_carrier:0 "Современный авианосец"
 sp_naval_modern_carrier_desc:0 "Благодаря последним достижениям кораблестроителей мы сможем построить авианосцы нового поколения, значительно более крупные и боеспособные."
 support_folder:0 "Роты обеспечения"
 support_folder_desc:0 "Разведчики, инженеры, полевые госпитали и другие роты обеспечения."
 dive_bombing:0 "Пикирование"
 dive_bombing_desc:0 "Пикирование позволяет увеличить точность стрельбы, но для достижения результата нужны особые модели самолетов, которые могут замедлить свое пикирование и без труда выйти из него."
 tank_anti_air_cannon_2:0 "Улучшенное зенитное орудие"
 tank_anti_air_cannon_2_desc:0 "Скорострельное автоматическое орудие для борьбы с самолетами. Обладает ограниченной возможностью применения к наземным целям для поддержки огнем."
 coastal_bunker:0 "Береговое укрепление"
 coastal_bunker_desc:0 "Это сооружение накладывает штраф на атакующую сторону в морском бою — $VALUE|+%0$ за каждый уровень укрепления."
