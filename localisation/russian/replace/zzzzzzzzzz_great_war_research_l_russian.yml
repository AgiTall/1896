 sp_naval_fleet_submarine_unique_reward_a:0 "Принципы проектирования"
 sp_naval_fleet_submarine_unique_reward_a_desc:0 "Нам стоит решить, на чем лучше сосредоточить усилия при разработке нового типа подводных лодок большой дальности. Мы можем сделать наши подлодки бесшумными и смертоносными хищниками или же обеспечить им повышенную прочность и надежность."
 cat_heavy_fighter:0 "Модели тяжелых истребителей"
 sp_naval_modern_carrier_preference_a_a:0 "Улучшить способность к обнаружению противника"
 cat_torpedoes:0 "Торпеды"
 tank_medium_three_man_tank_turret:0 "Трехместное орудие"
 tank_medium_three_man_tank_turret_desc:0 "Башня, достаточно большая, чтобы вместить трех членов экипажа, которые разделят между собой задачи по заряжанию и наведению главного орудия, а также наблюдению за боевой обстановкой."
 mio_cat_all_cas_and_modules:0 "Все технологии штурмовиков"
 secondary_turret_small_cannon:0 "Малая пушка"
 secondary_turret_small_cannon_desc:0 "Малая пушка — вспомогательное орудие боевой машины. Размещение башни ограничивает сектор обстрела, снижая эффективность, но зато позволяет танку атаковать больше целей, что особенно полезно при наступлении."
 mtgnavalfolder:0 "Флот"
