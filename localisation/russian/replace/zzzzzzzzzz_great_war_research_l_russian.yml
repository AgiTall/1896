 arms_factory:0 "Военный завод"
 arms_factory_desc:0 "Это сооружение снабжает регион новой военной техникой. При необходимости его можно превратить в завод по выпуску мирной продукции."
 naval_doctrine_folder:0 "Морская доктрина"
 naval_doctrine_folder_desc:0 "Морская доктрина, определяющая, как должен сражаться ваш флот."
 GRAND_DOCTRINE_OPERATIONAL_INTEGRITY:0 "Оперативное взаимодействие"
 GZC:0 "Гуйчжоу"
 sp_naval_cruiser_submarine_unique_reward_a:0 "Протокол рейдов"
 sp_naval_cruiser_submarine_unique_reward_a_desc:0 "Условия Лондонского морского договора сейчас практически не соблюдаются, поэтому в реальности ограничения на палубное вооружение подводных лодок не действуют. Однако при выборе вооружения возникает вопрос, следует ли нам отдавать приоритет соображениям престижа или же дальности действия?"
 GRAND_DOCTRINE_STRATEGIC_DESTRUCTION:0 "Стратегическое разрушение"
 close_combat:0 "Ближний бой"
 tactic_shock:0 "Натиск"
 sp_naval_nuclear_torpedo_unique_reward_a:0 "Доработка торпед"
 sp_naval_nuclear_torpedo_unique_reward_a_desc:0 "Разработка ядерных торпед уже практически завершена, но мы еще можем внести некоторые изменения."
 armored_signal:0 "Бронетанковая рота связи"
 armored_signal_desc:0 "Эти подразделения располагают специализированными транспортными средствами, которые обеспечивают координацию на поле боя, а также оснащены передовыми системами связи для управления операциями на передовой."
 tactical_withdrawal:0 "Тактическое отступление"
 tactic_banzai_charge:0 "Отчаянная атака"
 engines_2:0 "Двигатели II"
 engines_2_desc:0 "Быстрое увеличение размеров самолетов требует соответствующего роста мощности двигателей."
 sp_air_generic_reward_scientist_xp_1:0 "Ценные соображения"
 SUBDOCTRINE_DEEP_BATTLE:0 "Глубокий бой"
 dd_tech:0 "Модели эсминцев"
 damaged_secondaries:0 "Вспомогательные орудия повреждены"
 sp_land_reward_option_land_cruiser_chassis_lighter_materials:0 "Использовать более легкие материалы."
 ship_hull_midget_submarine:0 "Сверхмалая подводная лодка"
 ship_hull_midget_submarine_desc:0 "Небольшая подлодка, управляемая малым экипажем. Сниженная дальность действия и объем вооружения компенсируются высокими темпами производства."
 sp_land_reward_stronghold_network_structural_weakness_discovered:0 "Обнаружена слабость конструкции"
 infantry_folder:0 "Пехота"
 infantry_folder_desc:0 "Техника и оружие для пехоты."
 SUBDOCTRINE_FIGHTER_BOMBERS_DESC:0 "Когда поблизости нет самолетов противника, наши истребители могут атаковать наземные цели, чтобы поддержать сухопутные войска."
 mobile_warfare:0 "Маневренная война"
 mobile_warfare_desc:0 "Маневренная война делает упор на скорость и маневренность, чтобы отрезать противника от основных сил и расстроить его боевые порядки.\n\n"
 sp_land_reward_option_land_cruiser_track_current:0 "Оставить текущие гусеницы."
 sp_naval_nuclear_submarine_preference_b:0 "Придерживаться плана"
 cat_synth_oil:0 "Синтетическое топливо"
 masterful_blitz:0 "Умелый блиц"
 masterful_blitz_desc:0 "Пусть стратегию блицкрига изобрели не мы, но мы разовьем и улучшим ее так, что даже самые укрепленные вражеские линии обороны не выдержат натиска нашей славной армии."
 GRAND_DOCTRINE_FLEET_IN_BEING_DESC:0 "Общество больших орудий: традиционалистский упор на морскую артиллерию и прочную броню с расчетом сокрушить вражеский флот, обрушив на него стальную бурю."
 continuous_offensive:0 "Непрерывное наступление"
 continuous_offensive_desc:0 "Несмотря на всю эффективность грамотно осуществленного прорыва, рано или поздно нападающая сторона истощит ресурсы, и защитники смогут реорганизоваться, создав новые линии обороны. Однако при достаточном количестве резервов и правильной организации наступление можно сделать гораздо более глубоким и нанести сокрушительный удар по врагу."
 antitank2:0 "ПТО II"
 antitank2_desc:0 "Большинство противотанковых орудий являются малокалиберными. Нам нужен крупный калибр, способный пробивать толстую и наклонную броню тяжелых танков."
 sp_armored_engineer_tech:0 "Бронетанковая инженерная рота"
 sp_armored_engineer_tech_desc:0 "Инженерные подразделения танковых войск специализируются на расчистке препятствий и поддержке наступления на передовой под сильным огнем противника."
 sp_air_bouncing_bomb_type_of_explosives_reward:0 "Разновидности взрывчатки"
 sp_air_bouncing_bomb_type_of_explosives_reward_desc:0 "Заменив тротил на торпекс, мы сможем значительно уменьшить размер бомбы, не жертвуя при этом ее мощностью."
 jet_engine_axial_1x:0 "Реактивный двигатель с 1 осью"
