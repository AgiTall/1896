 basic_heavy_armor_scheme:0 "Схема бронирования с наклонным бронепоясом"
 basic_heavy_armor_scheme_desc:0 "Размещенный под углом бронепояс гораздо сложнее пробить при той же массе и толщине брони.\n\nУстановка этого модуля на §Yтяжелые корабли§! улучшает способность §Yпротивостоять урону, наносимому врагом§!. §YЛинкоры§! и §Yлинейные крейсеры§! определяются разными §Yсхемами бронирования§!."
 improved_heavy_armor_scheme:0 "Схема бронирования «Все или ничего»"
 improved_heavy_armor_scheme_desc:0 "В такой схеме бронирования упор делается на защиту только самых важных частей корабля.\n\nУстановка этого модуля на §Yтяжелые корабли§! улучшает их способность §Yпротивостоять урону, наносимому врагом§!. §YЛинкоры§! и §Yлинейные крейсеры§! определяются по разным §Yсхемам бронирования§!."
