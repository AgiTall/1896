 tactic_gas_masks:0 "Оборона в противогазах"
 tactic_tw_intercept:0 "Перехват"
 SUBDOCTRINE_BOMBER_INTERCEPTION:0 "Тяжелые перехватчики"
 modern_medium_airframe:0 "$medium_plane_airframe_4$"
