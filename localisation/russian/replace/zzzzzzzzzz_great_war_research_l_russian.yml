 damaged_heavy_guns:0 "Башня главного калибра повреждена"
 sp_naval_cruiser_submarine_free_design:0 "Подводный крейсер"
 SUBDOCTRINE_MISSION_TYPE_TACTICS:0 "Оперативная тактика"
 sp_naval_nuclear_torpedo_preference_a:0 "Увеличить мощность боеголовок"
 heavy_cruiser:0 "Тяжелый крейсер"
 heavy_cruiser_desc:0 "Крупный бронированный крейсер, способный решать различные задачи. Хороший выбор для стран, которые не в состоянии строить более крупные корабли."
 sp_tag_helicopter:0 "Проекты вертолетов"
 sp_air_generic_reward_major_progress_3:0 "Гениальная идея"
 tank_modern_tank_turret:0 "Современное орудие"
 tank_modern_tank_turret_desc:0 "Удачно спроектированная башня позволяет трем членам экипажа эффективно управляться с главным орудием и следить за боевой обстановкой."
 sp_land_generic_reward_artillery_bonus_3:0 "Усовершенствованная конструкция дула"
 DOCTRINE_TRACK_STRIKE_AIRCRAFT:0 "Штурмовики"
 computing_tech:0 "Вычислительные технологии"
 SUBDOCTRINE_SUBMARINE_FLEET_OPERATIONS_DESC:0 "Массовое включение подводных лодок в состав главного флота позволит нам вести разведку и атаковать вражеские корабли из засады во время генерального сражения."
 mio_cat_eq_only_light_fighter:0 "Истребитель и палубный истребитель"
 tactic_guerrilla_tactics:0 "Партизанские методы"
 sp_land_multi_charge_large_caliber_gun:0 "Многозарядное крупнокалиберное орудие"
 sp_land_multi_charge_large_caliber_gun_desc:0 "Благодаря многозарядной системе и крупному калибру это орудие способно вести обстрел на огромном расстоянии и с невероятной мощностью."
 mountaineers:0 "Горно-стрелковые войска"
 mountaineers_desc:0 "Боевые действия в горах сопряжены с высокой опасностью для пехоты, но порой их не избежать. Проведя среди наших солдат специальную подготовку для ведения боя в горах, мы минимизируем риск."
 unyielding_defender:0 "Несокрушимый защитник"
 unyielding_defender_desc:0 "§LОб отступлении не может быть и речи.§!"
 sp_land_generic_reward_major_progress_3:0 "Ключевое открытие"
 sp_land_reward_option_land_cruiser_engine_new_bonus_name:0 "Переработанный двигатель"
 lc_internal_fuel_tanks:0 "Внутренние баки с горючим"
 lc_internal_fuel_tanks_desc:0 "Расширенные топливные баки в корпусе. Повышают дальность действия техники и снижают потребность в остановках для дозаправки в дальних походах."
 paratrooper:0 "ВДВ"
 paratrooper_desc:0 "Используя воздушно-десантные войска, мы можем вторгаться в прежде недоступные районы и размещать там ключевые силы, что открывает новые тактические возможности."
 tactic_delay:0 "Сдерживание"
 SUBDOCTRINE_CARRIER_AIRFIELDS:0 "Плавучие аэродромы"
 SUBDOCTRINE_COASTAL_AIR_PATROL:0 "Прибрежные воздушные патрули"
 heavy_sp_anti_air_brigade:0 "Тяжелая ЗСУ"
 capital_ship_raiders:0 "Рейды крупных боевых кораблей"
 capital_ship_raiders_desc:0 "Теперь, когда охотой на вражеские конвои занимаются наши самые мощные корабли, противника не спасет даже численное преимущество. Ему останется лишь молиться, чтобы мы его не нашли."
 sp_air_scientist_xp_generic_reward:0 "Новые открытия"
 sp_air_scientist_xp_generic_reward_desc:0 "При работе над последним прототипом наши ученые совершили несколько новых открытий."
 seize_bridge:0 "Захватить мост"
 empty:0 ""
 small_plane_cas_airframe:0 "$CAS_equipment$"
 small_plane_cas_airframe_desc:0 "$small_plane_airframe_desc$"
 advanced_submarine_warfare:0 "Современная подводная война"
 advanced_submarine_warfare_desc:0 "Резкое улучшение связи между нашими подводными лодками позволяет им идеально синхронизировать нападения. Когда противник нас заметит, его корабль уже будет идти ко дну."
 tank_heavy_cannon_2:0 "Улучшенная тяжелая пушка"
 tank_heavy_cannon_2_desc:0 "Орудие, стреляющее крупнокалиберными снарядами. Обладает исключительной бронебойностью и высоко эффективно против слабобронированных целей; недостатки — большой размер и высокая стоимость, невозможность установить на большинство видов техники, за исключением той, что разработана специально под это орудие."
 tactic_cc_attack:0 "Ближний бой: атака"
 tank_christie_suspension:0 "Подвеска Кристи"
 tank_christie_suspension_desc:0 "Эта подвеска, разработанная американским изобретателем, позволяет развивать исключительно высокую скорость."
 tactic_attacker_hb_rush:0 "Стремительная атака на мост"
 armored_car_recon:0 "Легкобронированная разведрота"
 armored_car_recon_desc:0 "Разведрота, снабжённая бронемашинами, может навязывать бой врагу и не давать вражеским разведчикам собирать ценную информацию."
 sp_land_generic_reward_artillery_bonus_1:0 "Улучшенная точность дальнего боя"
 lc_medium_naval_guns:0 "Средние корабельные орудия"
 lc_medium_naval_guns_desc:0 "Сбалансированная комбинация скорострельности и огневой мощи. Эти орудия эффективны против легкой техники и небронированных целей."
 nd_conscription:0 "Неограниченный призыв"
 nd_conscription_desc:0 "В армию забирают даже калек и инвалидов; гражданских в принципе быть не может."
 light_tank_recon:0 "Бронированная разведрота"
 light_tank_recon_desc:0 "Используя для разведки лёгкие танки, мы можем проводить разведку боем и лучше оценивать силы противника."
 sp_land_reward_option_stronghold_network_leadership_approach_oversee_work_personally:0 "Контролировать работу лично"
 sp_tag_submarine:0 "Проекты подводных лодок"
 logistics_tech:0 "Рота обеспечения"
 sp_air_political_interference_generic_reward:0 "Вмешательство политиков"
 sp_air_political_interference_generic_reward_desc:0 "Из-за вмешательства политиков, лезущих не в свое дело, уже законченные этапы работы пришлось выполнять заново — по совершенно абсурдным причинам."
 DOCTRINE_TRACK_FIGHTER_AIRCRAFT:0 "Истребители"
 country:0 "Государство"
 large_plane_airframe_1:0 "Базовый корпус большого самолета"
 large_plane_airframe_1_desc:0 "Этот корпус был разработан, чтобы испытать возможность создания настоящего стратегического бомбардировщика, способного атаковать промышленные объекты в глубине вражеской территории, не подвергая опасности экипаж."
 sp_naval_modern_carrier_unique_reward_a:0 "Современный авианосец: приоритеты"
 sp_naval_modern_carrier_unique_reward_a_desc:0 "В ходе разработки нового поколения авианосцев мы можем повысить их эффективность в конкретных ситуациях. Какие характеристики корабля для нас важнее?"
 sp_land_super_heavy_howitzer:0 "Сверхтяжелая гаубица"
 sp_land_super_heavy_howitzer_desc:0 "Мощное крупнокалиберное артиллерийское орудие, которое способно уничтожать оборонительные позиции противника с невиданной прежде разрушительной силой."
 deep_operations:0 "Глубокие операции"
 deep_operations_desc:0 "Концепция глубоких операций или глубокого боя, предписывает осуществить прорыв вражеской обороны в нескольких точках, уничтожить его боевые резервы и оперативную глубину обороны и закрепиться на как можно большей стратегической глубине."
 sp_cruiser_submarine_eq_bonus_raiding:0 "Подводный крейсер — эффективность перехвата"
 jet_engine_3x:0 "3 реактивных двигателя"
 jet_engine_3x_desc:0 "$engine_1_3x_desc$"
 light_sp_anti_air_brigade:0 "Легкая ЗСУ"
 sp_naval_underway_replenishment_unique_reward_a:0 "Масштаб снабжения"
 sp_naval_underway_replenishment_unique_reward_a_desc:0 "Мы все еще работаем над улучшением системы снабжения, и надо принять еще одно решение: изменять наши первоначальные расчеты или нет?"
 motorized_rocket_equipment_1:0 "Моторизированная реактивная артиллерия"
 motorized_rocket_equipment_1_desc:0 "Реактивные установки доставляют снаряды к цели быстрее, чем это способна сделать традиционная артиллерия, но менее точны и гораздо дольше заряжаются. При установке на грузовик способны поменять позицию после выстрела быстрее, чем противник сможет отреагировать."
 sp_tag_jet:0 "Проекты реактивных самолетов"
 sp_land_generic_reward_major_progress_2:0 "Успешное завершение контрольного испытания"
 tactic_blitz:0 "Блицкриг"
 armored_operations:0 "Танковые операции"
 armored_operations_desc:0 "Танки и другая бронетехника позволяют доставить пехоту на поле боя и оказать ей непосредственную поддержку."
 marine_tech:0 "Технология морской пехоты"
 night_assault_tactics:0 "Тактика ночного штурма"
 night_assault_tactics_desc:0 "Солдаты, привыкшие воевать ночью, могут либо заранее занять позиции перед наступлением, либо атаковать ничего не подозревающего противника."
 mio_cat_eq_all_destroyer:0 "Все эсминцы"
 marine:0 "Морская пехота"
 marine_desc:0 "Войска, специализирующиеся на морских десантных операциях, становятся все более незаменимыми. Импровизированные тактические приемы и снаряжение уходят в прошлое — наша морская пехота теперь проходит специальную подготовку и оснащена специальными десантными кораблями."
 oil_desc:0 "Нефть нужна для работы наземной техники, самолетов и кораблей."
 jet_fighter_equipment_1:0 "Реактивный истребитель I"
 jet_fighter_equipment_1_desc:0 "Реактивный двигатель позволяет истребителю развивать ранее невиданную скорость. Ранние образцы не очень эффективны, но обычным истребителям за ними не угнаться."
 bicycle_battalion:0 "Велосипедный батальон"
 bicycle_battalion_desc:0 "Мясо для мясорубки, но с вкраплениями металла."
 sp_cruiser_submarine_eq_bonus_range:0 "Подводный крейсер — увеличенная дальность действия"
 cv_small_plane_airframe_2:0 "Улучшенный корпус палубного самолета"
 cv_small_plane_airframe_2_desc:0 "Этот корпус был создан, чтобы идти в ногу с развитием авиации наземного базирования, и использует новые технологии для увеличения дальности полета и эффективности."
 strategic_destruction:0 "Стратегическое разрушение"
 strategic_destruction_desc:0 "Наши пилоты могут добраться до стратегических целей быстрее, чем флот и наземные войска. Поскольку противнику будет нечем оснащать своих новобранцев, мы быстро задавим его числом."
 category_marines:0 "Все морские пехотинцы"
 sp_naval_torpedo_cruiser_preference_b:0 "Повысить эффективность против эсминцев"
 SND:0 "Шаньдун"
 GRAND_DOCTRINE_CONVOY_RAIDING_DESC:0 "Каперы нашего века: непрямой подход к войне на море с упором на стремление задушить морскую торговлю и лишить врага ресурсов, необходимых для боевых действий."
 category_special_forces_leg_infantry:0 "Пехота войск спец. назначения"
 floating_airfield:0 "Плавучая авиабаза"
 floating_airfield_desc:0 "Улучшенная интеграция авианосцев в наш флот позволяет нам наносить удары с моря и воздуха. Это — ключ к обеспечению превосходства в воздухе везде, где бы мы ни были."
 wet_ammo_storage:0 "Влажное хранилище боеприпасов"
 wet_ammo_storage_desc:0 "Кожухи с водой, укрывающие стойки с боеприпасами, значительно уменьшают риск подрыва боезапаса при попадании в танк. Экипаж оценит такую заботу."
 sp_modern_carrier_eq_bonus_anti_torpedo:0 "Современный авианосец — повышенная защита от торпед"
 formation_flying:0 "Летный боевой порядок"
 formation_flying_desc:0 "Совершая полет в боевом порядке, самолеты оказывают поддержку друг другу и сообща атакуют противника."
 NZL:0 "Новая Зеландия"
 sp_land_reward_land_cruiser_communication:0 "Проблема с системой связи"
 sp_land_reward_land_cruiser_communication_desc:0 "[SpecialProject.GetName] настолько огромен, что для координации работы экипажа требуется сложная внутренняя система связи. Текущая система не справляется с задачей: команды либо поступают с задержкой, либо просто теряются. Группа инженеров предлагает изменить внутреннюю компоновку танка, чтобы улучшить передачу сигналов, или же установить более продвинутую, но еще неиспытанную систему связи."
 SUBDOCTRINE_DIVE_BOMBERS_DESC:0 "Авиаудары по целям на передовой во время наземных сражений опасны: самолет может подвергнуться огню с земли или задеть собственные войска, однако эффект от таких ударов поразителен."
 SUPERIOR_FIREPOWER_DOCTRINE:0 "Превосходство огневой мощи"
 GRAND_DOCTRINE_MASS_ASSAULT_DESC:0 "Наше самопожертвование гарантирует нам победу. Массированный штурм направлен на концентрацию численного превосходства для осуществления прорыва в выбранное время и в выбранном месте."
 SUBDOCTRINE_INFILTRATION_TACTICS_DESC:0 "Вместо того чтобы наносить удары по вражеским позициям в их наиболее укрепленных точках, мы будем обтекать их, как вода, устремляясь вперед и вынуждая противника отступать под угрозой окружения."
 sp_naval_rocket_launching_submarine:0 "Ракетная подлодка"
 sp_naval_rocket_launching_submarine_desc:0 "Оснастив подводные лодки ракетами и системами запуска, мы сможем поражать стратегические цели откуда угодно и совершенно неожиданно для врага."
 sp_naval_nuclear_submarine_preference_a:0 "Упростить конструкцию"
 CAR:0 "Центральноафриканская Республика"
 bomber_veteran_initiative:0 "Программа поддержки бомбардировщиков-ветеранов"
 bomber_veteran_initiative_desc:0 "Политика, по которой пилоты-ветераны передают свой опыт и знания молодым летчикам, увеличит шансы новобранцев на выживание."
 bc_tech:0 "Модели линейных крейсеров "
 naval_minesweeping:0 "Технология траления мин флотом"
 sp_land_reward_option_land_cruiser_communication_new_bonus_name:0 "Продвинутая система связи"
 medium_plane_airframe_4:0 "Корпус современного среднего самолета"
 medium_plane_airframe_4_desc:0 "Осознав, что будущее за самолетами с реактивным двигателем, инженеры начинают разрабатывать корпуса для самолетов с учетом реактивной тяги."
 supersonic_fighter1:0 "Сверхзвуковой истребитель"
 decryption_tech:0 "Методы дешифрования"
 mio_cat_eq_all_battleship:0 "Все линкоры"
 armor_skirts:0 "Бронеюбки"
 armor_skirts_desc:0 "Тонкие металлические пластины, подвешиваемые к бортам боевой машины. Дают дополнительную защиту от противотанковых ружей и кумулятивных зарядов."
 idea_army_restrictions:0 "Армейские ограничения"
 idea_army_restrictions_desc:0 "После поражения в Великой войне, [ROOT.GetAdjective]ая армия была сокращена и не имеет права расширяться."
 convoy_sailing_bs:0 "Конвоирование"
 convoy_sailing_bs_desc:0 "С введением обязательных конвоев стало легче обнаруживать корабли противника и вовремя реагировать на их появление. Безопаснее действовать сообща."
 sp_super_heavy_battleship_eq_bonus_speed:0 "Сверхтяжелый линкор — улучшенные двигатели"
 mio_cat_all_naval_bomber_and_modules:0 "Все технологии морских бомбардировщиков"
 mechanised_offensive:0 "Механизированное наступление"
 mechanised_offensive_desc:0 "Моторизированная пехота всем хороша, но возглавлять наступление должна пехота, которая перемещается на бронетранспортерах, оснащенных тяжелым вооружением."
 steel_desc:0 "Сталь — основной металл, необходимый для создания большинства видов военной техники, будь то танки или корабли."
 tank_medium_howitzer_2:0 "Улучшенная средняя гаубица"
 tank_medium_howitzer_2_desc:0 "Средняя полевая гаубица, предназначенная для установки в машину. Ее основное предназначение — непрямой огонь по слабобронированным целям, но при необходимости гаубица может применяться и для стрельбы прямой наводкой. Снабжается ограниченным количеством бронебойных снарядов и слабо применима для борьбы с танками."
 tactic_attacker_hb_attack:0 "Атака"
 fighter_ace_initiative:0 "Программа поддержки асов-истребителей"
 fighter_ace_initiative_desc:0 "Выдавая награды и звания пилотам, получившим статус асов за пять сбитых самолетов противника, мы поощряем рискованные действия и наделяем их чувством принадлежности к элите. Правда, это значит, что опытные пилоты продолжат совершать боевые вылеты."
 BEL_outdated_military:0 "Устаревшая армия"
 BEL_outdated_military_desc:0 "Бельгийская армия практически не изменилась с 1830 года, форма и тактика остались прежними, а снаряжение полностью устарело. У армии очень мало пушек, нет пулеметов и некомпетентная система командования."
 SUBDOCTRINE_CARPET_BOMBING_DESC:0 "Попытка поразить малоразмерную цель с высоты 10 000 метров — обычно пустая трата бомб. Полет колонной вплотную с попутным сбросом бомб — более надежный способ уничтожить... хоть что-нибудь."
 SUBDOCTRINE_NIGHT_BOMBING:0 "Ночные стратегические бомбардировки"
 sp_naval_super_heavy_battleship_preference_a_a:0 "Отдать приоритет тяжелым орудиям"
 sp_naval_nuclear_missile_submarine:0 "Подлодка с ядерными ракетами"
 sp_naval_nuclear_missile_submarine_desc:0 "Благодаря подводной лодке, способной всплыть, выпустить ракеты с ядерными зарядами и снова погрузиться, наша возможность наносить превентивные удары станет практически безграничной."
 heavy_tank_artillery_chassis:0 "Тяжелая САУ"
 heavy_tank_artillery_chassis_desc:0 "Большая боевая машина. Основная роль — огневая поддержка наступающей пехоты."
 midget_submarine:0 "$ship_hull_midget_submarine$"
 midget_submarine_desc:0 "$ship_hull_midget_submarine_desc$"
 miniature_fighters:0 "Истребители малого размера"
 miniature_fighters_desc:0 "Уменьшив размеры истребителей, мы сможем использовать больше этих боевых единиц в бою, не слишком сильно теряя в огневой мощи, а также снизим нагрузку на материнский самолет."
 HOL:0 "Нидерланды"
 stronghold_network:0 "Цепь укреплений"
 tactic_basic_defend:0 "Оборона"
 convoy_escorts:0 "Корабли сопровождения"
 convoy_escorts_desc:0 "Быстрые надводные корабли, входящие в состав наших конвоев, позволяют вовремя обнаруживать вражеские подводные лодки и реагировать на их появление. Чтобы избавиться от надоедливых подлодок, нужно своевременно их замечать."
 GRAND_DOCTRINE_STRATEGIC_DESTRUCTION_DESC:0 "Массовая бомбардировка фабрик, нефтеперерабатывающих заводов и транспортной инфраструктуры в глубине вражеской территории c целью уничтожить военное производство противника."
 mass_destruction:0 "Масштабное уничтожение"
 mass_destruction_desc:0 "Бомбардировщики несут большое количество самых разрушительных видов оружия. Результат гарантирован, даже если только часть пилотов сможет пробиться к цели."
 sp_naval_anechoic_tiles_preference_c:0 "Снизить стоимость корпусов"
 guerilla_warfare:0 "Партизанская война"
 guerilla_warfare_desc:0 "Враг наступает, мы отступаем. Враг разбивает лагерь, мы докучаем набегами. Враг устает, мы нападаем. Враг отступает, мы его преследуем."
 battlefield_support_tree:0 "Доктрина поддержки с воздуха"
 UNLOCK_DIVISION_TEMPLATE:0 "Открывает бесплатный §Hшаблон дивизии§!"
 engine_tech_3_tt:0 "Открывает значения в 15 и выше для улучшения двигателя."
 SUBDOCTRINE_ARMORED_INFANTRY_SUPPORT:0 "Поддержка механизированной пехоты"
 GSM:0 "Ганьсу"
 JAP:0 "Япония"
 XSM:0 "Цинхай"
 mass_assault:0 "Массированный штурм"
 mass_assault_desc:0 "Не стоит гоняться за «идеальным» оружием; много «достаточно хорошего» оружия – вот путь к победе!\n\n"
 direct_ground_support:0 "Непосредственная наземная поддержка"
 direct_ground_support_desc:0 "Координируя действия штурмовиков с наземными наблюдателями, мы сможем наносить точечные удары, помогая сухопутным войскам в бою."
 tank_heavy_howitzer:0 "Тяжелая гаубица"
 tank_heavy_howitzer_desc:0 "Тяжелая полевая гаубица, предназначенная для установки в машину. Ее основное предназначение — непрямой огонь по слабобронированным целям, но при необходимости гаубица может применяться и для стрельбы прямой наводкой. Снабжается ограниченным количеством бронебойных снарядов и слабо применима для борьбы с танками."
 fleet_in_being:0 "Воздействие флотом"
 fleet_in_being_desc:0 "Корабли остаются в порту, где находятся в большей безопасности, и атакуют противника лишь в удачные моменты. Присутствие наших кораблей отобьет желание у противника захватывать порты.\n\n"
 sp_naval_aip_engine_preference_a:0 "Повысить бесшумность двигателей"
 land_doctrine:0 "Сухопутная доктрина"
 medium_tank_destroyer_chassis:0 "Средняя ПТ-установка"
 medium_tank_destroyer_chassis_desc:0 "Хорошо сбалансированная боевая машина с мощным орудием для уничтожения вражеской бронетехники."
 cavalry:0 "Кавалерия"
 cavalry_desc:0 "Пехота верхом на лошадях. Более дорогая, зато более мобильная."
 sp_air_bouncing_bomb_backspin_mechanism_reward:0 "Механизм обратной раскрутки"
 sp_air_bouncing_bomb_backspin_mechanism_reward_desc:0 "Наши ученые изобрели остроумный способ стабилизации сброшенной бомбы: механизм начинает раскручивать ее в обратном направлении, тем самым удерживая бомбу над целью."
 helicopter_field_hospital:0 "Медицинская эвакуация на вертолете"
 helicopter_field_hospital_desc:0 "Внимание всему персоналу! Прибывают отряды с ранеными! Эвакуационные вертолеты способны доставить раненых с поля боя гораздо быстрее, чем обычная машина скорой помощи."
 GRAND_DOCTRINE_MOBILE_WARFARE:0 "Маневренная война"
 SUBDOCTRINE_HEAVY_AIRCRAFT_FOCUS:0 "Упор на многоцелевые тяжелые самолеты"
 tank_heavy_three_man_tank_turret:0 "Трехместное орудие"
 tank_heavy_three_man_tank_turret_desc:0 "Башня, достаточно большая, чтобы вместить трех членов экипажа, которые разделят между собой задачи по заряжанию и наведению главного орудия, а также наблюдению за боевой обстановкой."
 sp_naval_midget_submarine_preference_c:0 "Повысить дальность"
 panzer_leader:0 "Лидер бронетехники"
 panzer_leader_desc:0 "§LЕстественно, с бронетехникой и танками.§!"
 tp_tech:0 "Модели транспортных кораблей"
 battlefleet_concentration_ti:0 "Фокус на линейном флоте"
 battlefleet_concentration_ti_desc:0 "Вызов находящихся рядом кораблей сразу при обнаружении врага. Скоординированный огонь быстро выведет корабли противника из строя, и их можно будет уничтожить поодиночке."
 SUBDOCTRINE_FLYING_BATTERIES:0 "Летучие батареи"
 offensive_formations:0 "Наступательный боевой порядок"
 offensive_formations_desc:0 "Научившись соблюдать наступательный боевой порядок, наши пилоты станут эффективнее в бою."
 combined_operations_raiding:0 "Совместные нападения на конвои"
 combined_operations_raiding_desc:0 "Все ресурсы направлены на охоту за вражескими торговыми конвоями. Координация действий нашего основного флота и подводных лодок позволяет им находиться в постоянной готовности. Ни один корабль не проскользнет незамеченным в наших водах."
 tactic_basic_attack:0 "Атака"
 sp_naval_ice_carrier:0 "Пайкеритовый авианосец"
 sp_naval_ice_carrier_desc:0 "Чтобы установить господство в воздухе над океанами, нам нужны авианосцы, с которых могли бы взлетать не только палубные самолеты, но и обычные самолеты с большой дальностью полета."
 sup_delay:0 "Сдерживание"
 sup_delay_desc:0 "Даже когда в битве нельзя победить, бывает полезно замедлить наступление противника с помощью засад и сдерживающих действий."
 mio_cat_tech_all_carrier_and_modules:0 "Все технологии авианосцев"
 sp_super_heavy_battleship_eq_bonus_anti_air:0 "Сверхтяжелый линкор — улучшенные зенитные орудия"
 armor_tech_2_tt:0 "Открывает значения в 10 и выше для улучшения брони."
 large_plane_airframe:0 "$strat_bomber_equipment$"
 large_plane_airframe_desc:0 "Крупный корпус с отличной вместимостью. На него можно установить до шести двигателей. Способен переносить большую полезную нагрузку на дальние расстояния."
 sloped_armor:0 "Наклонная броня"
 sloped_armor_desc:0 "Броня, размещенная под углом к траектории снаряда, обладает гораздо большей толщиной на срезе, чем такая же броня, размещенная вертикально. Еще эта броня повышает шанс отскока снаряда. Тем не менее применение такой брони требует изменений в конструкции танка, что затрудняет сборку."
 GER:0 "Германия"
 SUBDOCTRINE_LAST_STAND:0 "Отчаянная оборона"
 SUBDOCTRINE_SCREEN_CONVOY_ESCORT_DESC:0 "Основная задача легких кораблей — обеспечивать морскую торговлю, без которой невозможна война. Всё остальное второстепенно."
 pathfinder_groups:0 "Группы наведения"
 pathfinder_groups_desc:0 "Пилоты-ветераны оснащены самыми лучшими инструментами для подсветки целей. Ни дым, ни плохая погода не помешают бомбардировщикам выполнить задание."
 sp_land_generic_reward_option_test_failure_desc:0 "Испытания закончились не совсем удачно: в прототипе, разработчиком которого является [Character.GetName], были неожиданно выявлены технические неисправности. Нам потребовалось пересмотреть подход к работе и усовершенствовать ее методы. Ход работ замедлился, однако в долгосрочной перспективе эти уроки пошли лишь на пользу проекту."
 category_self_propelled_artillery:0 "Самоходная артиллерия"
 air_defence:0 "Воздушная оборона"
 air_defence_desc:0 "Научив наших пилотов соблюдать предельную внимательность даже тогда, когда опасности нет, мы увеличим их шансы перехватить вражеский самолет."
 SUBDOCTRINE_ESCORT_FIGHTER_DESC:0 "Чтобы ударные самолеты могли действовать безнаказанно, необходимо обеспечить им постоянное прикрытие истребителями — охотниками на вражеские летательные аппараты."
 cv_small_plane_airframe:0 "$cv_fighter_equipment$"
 cv_small_plane_airframe_desc:0 "Этот небольшой оснащенный тормозным крюком и усиленным шасси корпус позволяет создавать самолеты, способные действовать с палубы авианосца."
 SUBDOCTRINE_BATTLESHIP_ANTIAIR_SCREEN_DESC:0 "На палубе линкора можно разместить достаточно внушительное вооружение. В первую очередь надо оснастить линкоры орудиями ПВО, чтобы прикрывать оперативные группы от вражеских самолетов."
 sp_land_generic_reward_scientist_xp_1:0 "Новые наработки"
 tactic_gas_cylinder_poisonous:0 "Высвобождение баллонов с ядовитым газом"
 sp_naval_generic_reward_artillery_tech_2:0 "Развитие корабельных орудий"
 prepared_defense:0 "Подготовленная оборона"
 prepared_defense_desc:0 "Более масштабная система полевых укреплений заметно улучшает обороноспособность боевой части."
 snorkel_advice_tt:0 "\nУстановка §Yшноркелей§! на §Yподводные лодки§! сильно снижает их §Yзаметность§!, из-за чего их сложнее обнаружить вражеским кораблям."
 GER_finance_rheinmetall:0 "Финансирование Rheinmetall"
 GER_finance_rheinmetall_desc:0 "Корпорация Rheinmetall обратилась к нам с просьбой о предоставлении кредита, который может быть легко предоставлен. С его помощью компания еще больше расширит свою производственную базу для армии."
 offensive_doctrine:0 "Мастер наступления"
 offensive_doctrine_desc:0 "§LСильнее прочих склонен к наступлению.§!"
 rocket_artillery:0 "Поддержка РСЗО"
 rocket_artillery_desc:0 ""
 infrastructure_destruction:0 "Разрушение инфраструктуры"
 infrastructure_destruction_desc:0 "Обучив наших пилотов самым эффективным методам уничтожения таких инфраструктурных объектов, как мосты и железные дороги, мы повысим эффективность тактических бомбардировок."
 secondary_battery_advice_tt:0 "\n§YВспомогательная батарея§! позволяет §Yкрейсерам§! и §Yтяжелым кораблям§! атаковать вражеские §Yкорабли охранения§! как дополнительные цели, нанося при этом урон другой цели."
 cat_ship_medium_battery:0 "Средние батареи"
 sp_land_generic_reward_option_engine_bonus_desc:0 "Приступить к производству доработанных двигателей!"
 jet_engine_axial_4x:0 "Реактивный двигатель с 4 осями"
 jet_engine_axial_4x_desc:0 "$engine_1_4x_desc$"
 sp_naval_super_heavy_battleship_preference_b_a:0 "Отдать приоритет скорости"
 SUBDOCTRINE_ARMORED_RAIDERS_DESC:0 "Корабли сопровождения конвоев занимаются в основном противолодочной борьбой. Их капитаны сильно удивятся, когда неожиданно увидят в своем строю тяжеловооруженный крупный корабль — он будет подобен волку на пастбище."
