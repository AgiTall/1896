 SUBDOCTRINE_FLYING_ARTILLERY_DESC:0 "Универсальный подход к очерёдности целей: внеплановые цели поражаются повсюду — от линии фронта до оперативной глубины."
 tank_super_heavy_cannon:0 "Сверхтяжелая пушка"
 tank_super_heavy_cannon_desc:0 "Абсурдно большое орудие с несравненной эффективностью. Способно уничтожить почти все, а что не способно, то все равно не будет стрелять по танку."
 super_heavy_tank_aa_chassis:0 "Тяжелая ЗСУ"
 super_heavy_tank_aa_chassis_desc:0 "Гигантская боевая машина, способная нести самую тяжелую броню и самое крупнокалиберное орудие, но из-за этого медленная и ненадежная."
