 HUN_tac_bomber_equipment_0_desc:0 "AEG G.II - биплан-бомбардировщик, созданный на основе AEG G.I, с более мощными двигателями. Обычно G.II вооружен тремя пулеметами и 200 кг бомбами. Бомбардировщик страдает от проблем с устойчивостью, поэтому многие G.II оснащены дополнительными вертикальными хвостовыми поверхностями."
