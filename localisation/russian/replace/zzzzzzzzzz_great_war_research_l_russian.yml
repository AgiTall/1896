 GRAND_DOCTRINE_BASE_STRIKE:0 "Удар по базам"
 sp_naval_anechoic_tiles:0 "Звукопоглощающее покрытие"
 sp_naval_anechoic_tiles_desc:0 "Специальное резиновое плиточное покрытие для подводных лодок с небольшими промежутками между плитками. Это покрытие затрудняет работу вражеских гидролокаторов."
 tank_heavy_cannon:0 "Базовая тяжелая пушка"
 tank_heavy_cannon_desc:0 "Орудие, стреляющее крупнокалиберными снарядами. Обладает исключительной бронебойностью и высоко эффективно против слабобронированных целей; недостатки — большой размер и высокая стоимость, невозможность установить на большинство видов техники, за исключением той, что разработана специально под это орудие."
 engine_tech_1_tt:0 "Открывает значения в 5 и выше для улучшения двигателя."
 sp_modern_carrier_eq_bonus_speed:0 "Современный авианосец — повышенная скорость"
