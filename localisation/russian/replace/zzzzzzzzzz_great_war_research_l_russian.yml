 gas_cylinder_equipment_desc:0 "Большое количество слезоточивого газа перевозилось в больших бочках, которые прокалывались и высвобождали продукт в сторону вражеских линий. Чувствительные к изменениям ветра и не смертельные, эти химикаты стали первыми экспериментами в полевых условиях."
