 advanced_heavy_art_desc:0 "Развитие военных технологий и промышленности."
 super_heavy_tank:0 "Ранний сверхтяжелый танк"
 super_heavy_tank_desc:0 "Развитие военных технологий и промышленности."
 super_heavy_art:0 "Сверхтяжелая САУ"
 super_heavy_art_desc:0 "Развитие военных технологий и промышленности."
 basic_light_tank_chassis:0 "Шасси раннего легкого танка"
 basic_light_tank_chassis_desc:0 "Из-за технологического развития проекты послевоенных лет фактически устарели. Современная война требует новых проектов боевых машин, где используются последние достижения в металлургии и оформлении."
 improved_light_tank_chassis:0 "Базовый легкий танк"
 improved_light_tank_chassis_desc:0 "Это шасси — следующий цикл развития, основанный на предыдущих моделях легких танков. Отличается повышенной надежностью и ремонтопригодностью."
 advanced_light_tank_chassis:0 "Улучшенный легкий танк"
 advanced_light_tank_chassis_desc:0 "Центральную роль в сражениях все чаще играют средние танки, легким же танкам в основном отводится роль поддержки. Нам нужно новое шасси, которое будет учитывать эти роли."
 basic_heavy_tank_chassis:0 "Шасси раннего тяжелого танка"
 basic_heavy_tank_chassis_desc:0 "Подробный анализ Великой войны показал потребность в тяжелых боевых машинах, которые прорываются через вражеские траншеи и прокладывают путь пехоте. Такая машина должна быть тяжелобронирована и хорошо вооружена, но не обязана быть очень быстрой."
 improved_heavy_tank_chassis:0 "Базовый тяжелый танк"
 improved_heavy_tank_chassis_desc:0 "Хотя природа военных действий изменилась, на поле боя по-прежнему нужна тяжелая боевая машина с толстой броней для прорыва вражеского фронта или создания укреплений против вражеских атак."
 advanced_heavy_tank_chassis:0 "Улучшенный тяжелый танк"
 advanced_heavy_tank_chassis_desc:0 "Учитывая современное развитие брони и огневой мощи, современный танк, чтобы быть эффективным, должен обладать толстой броней и крупнокалиберным орудием."
 basic_medium_tank_chassis:0 "Шасси раннего среднего танка"
 basic_medium_tank_chassis_desc:0 "В прошлом легкие танки формировали костяк механизированных соединений, но сейчас ясно, что их потенциал роста подходит к концу. В будущем нам понадобятся более крупные боевые машины, сохраняющие высокую степень мобильности."
 improved_medium_tank_chassis:0 "Базовый средний танк"
 improved_medium_tank_chassis_desc:0 "Исходя из опыта эксплуатации предыдущих поколений средних танков, ясно, что сейчас будет актуальна новая модель с повышенной вместимостью."
 advanced_medium_tank_chassis:0 "Улучшенный средний танк"
 advanced_medium_tank_chassis_desc:0 "Быстрый прирост веса оружейных систем и толщины брони требует в этой категории еще более крупных танковых шасси размера ранних тяжелых танков."
 super_heavy_tank_chassis:0 "Раннее шасси сверхтяжелого танка"
 super_heavy_tank_chassis_desc:0 "Гигантская боевая машина, способная нести самую тяжелую броню и самое крупнокалиберное орудие, но из-за этого медленная и ненадежная."
 engine_tech_1:0 "Базовый двигатель"
 engine_tech_1_desc:0 "Танки Великой войны были тяжелыми и неповоротливыми, но современному танку для победы необходимы скорость и мобильность."
 engine_tech_2:0 "Улучшенный двигатель"
 engine_tech_2_desc:0 "Теперь, когда орудия стали крупнее, а броня тяжелее, новому поколению танков для сохранения мобильности требуется более мощный двигатель."
 engine_tech_3:0 "Модернизированный двигатель"
 engine_tech_3_desc:0 "Механизированная война требует быстрого принятия решений и быстрой переброски войск и припасов. Если наши танки будут нести достаточно современное вооружение и броню, чтобы выжить на поле боя, им понадобятся мощные двигатели, чтобы не отставать от мотопехоты."
 engine_tech_4:0 "Современный двигатель"
 engine_tech_4_desc:0 "Многочисленные нововведения для танков, продиктованные современной войной, значительно увеличивают их вес. Чтобы перемещать тяжелую боевую машину, нам понадобятся очень мощные двигатели."
 armor_tech_1:0 "Базовая броневая защита"
 armor_tech_1_desc:0 "В Великой войне танкам нужно было защищаться лишь от выстрелов пехотного оружия, и потому они могли обходиться относительно тонкой броней. Новое поколение противотанкового оружия сделало поле боя куда более опасным для бронетехники, и теперь ей нужна более мощная защита."
 armor_tech_2:0 "Улучшенная броневая защита"
 armor_tech_2_desc:0 "Теперь, когда по всему миру вводится в эксплуатацию все более мощное и тяжелое противотанковое вооружение, следующему поколению танков понадобится еще более усиленная броня."
 armor_tech_3:0 "Модернизированная броневая защита"
 armor_tech_3_desc:0 "Теперь, когда, кажется, достигнут предел развития противотанковых орудий, новое поколение танков будет нести более эффективное вооружение, способное пробить любую броню с большой дистанции."
 armor_tech_4:0 "Современная броневая защита"
 armor_tech_4_desc:0 "Опасности для танков на поле боя умножились: от вражеских танков, противотанковых орудий, специальной противотанковой техники до современного пехотного оружия, стреляющего кумулятивными зарядами, способными пробить даже тяжелую броню. Мы должны разрабатывать новые методы защиты, чтобы уберечь танки от новых угроз."
 stronghold_network_tech:0 "Stronghold Network Tech"
 stronghold_network_tech_desc:0 "Развитие военных технологий и промышленности."
 tech_support_desc:0 "Развитие военных технологий и промышленности."
 tech_engineers:0 "Сапёрная рота I"
 tech_engineers_desc:0 "Инженеры, занимающиеся возведением укреплений и защиты от прорывов, незаменимы на поле боя. Поскольку они универсальны, их можно использовать в самых разных ситуациях."
 tech_engineers2:0 "Сапёрная рота II"
 tech_engineers2_desc:0 "Оснащенные современным оборудованием и мощной взрывчаткой, наши инженеры выполняют не только привычные для них задания. Они могут удивить противника своими находками как на земле, так и на море."
 tech_engineers3:0 "Сапёрная рота III"
 tech_engineers3_desc:0 "Военные инженерные проекты становятся все более масштабными. Создание современной инфраструктуры позволит проводить операции, для которых нужны ресурсы, недоступные на поле боя."
 tech_engineers4:0 "Сапёрная рота IV"
 tech_engineers4_desc:0 "Сохраняя локальную мобильность и создавая то, что раньше считалось бы постоянными укреплениями и системами снабжения, инженерные войска будущего обеспечат наших солдат защитой везде, где бы их ни атаковали."
 tech_recon:0 "Разведрота I"
 tech_recon_desc:0 "Отправив небольшой отряд бойцов на разведку, прежде чем выдвинуть основную группу войск, мы получим информацию о количестве и расположении вражеских частей."
 tech_recon2:0 "Разведрота II"
 tech_recon2_desc:0 "Разведывательные операции смертельно опасны. Если мы научим наши патрули быстро перемещаться и отступать и оснастим средствами для устранения препятствий, созданных противником, то увеличим их шансы на успешное возвращение."
 tech_recon3:0 "Разведрота III"
 tech_recon3_desc:0 "Новейшие разработки в области радио изменили метод ведения разведопераций — теперь можно быстро передать полученные сведения."
 tech_recon4:0 "Разведрота IV"
 tech_recon4_desc:0 "Разведоперации в глубоком тылу, совмещающие шпионаж, партизанскую борьбу и диверсионные действия, расширят наши тактические возможности и позволят быстрее принимать решения."
 tech_military_police:0 "Военная полиция I"
 tech_military_police_desc:0 "Регулярные части могут короткое время поддерживать порядок на оккупированной территории, но они в первую очередь солдаты. Если мы внедрим военную полицию в нашу армию, то получим специалистов, способных реагировать на действия сопротивления и расследовать диверсии."
 tech_military_police2:0 "Военная полиция II"
 tech_military_police2_desc:0 "Взяв на себя обязанности обычной полиции на оккупированных территориях, такие как регулирование уличного движения и поддержание правопорядка, наша военная полиция сможет минимизировать хаос и сумятицу, которые так нравятся партизанам."
 tech_military_police3:0 "Военная полиция III"
 tech_military_police3_desc:0 "Сотрудничая с местными агентурными сетями и информаторами, внедренными до начала оккупации, наша военная полиция сможет заранее узнавать о готовящихся акциях сопротивления."
 tech_military_police4:0 "Военная полиция IV"
 tech_military_police4_desc:0 "Поддержание порядка на оккупированной территории означает в равной мере и возврат к обычной жизни, и безжалостное уничтожение сопротивления. Наша военная полиция должна своевременно начинать этот процесс, чтобы обеспечить безопасность и для мирных граждан, и для солдат."
 tech_maintenance_company:0 "Ремонтная рота I"
 tech_maintenance_company_desc:0 "Обслуживание, починка и полный ремонт обеспечивают надежную, безопасную эксплуатацию военной техники. Чтобы уделить должное внимание этой проблеме, необходимо создать специальные роты."
 tech_maintenance_company2:0 "Ремонтная рота II"
 tech_maintenance_company2_desc:0 "Регулярный техосмотр уменьшает вероятность поломки техники и заранее выявляет детали, которые нужно заменить."
 tech_maintenance_company3:0 "Ремонтная рота III"
 tech_maintenance_company3_desc:0 "Обеспечив войска наиболее востребованными ресурсами для стандартного ремонта, мы покончим с практикой использования сломанной техники."
 tech_maintenance_company4:0 "Ремонтная рота IV"
 tech_maintenance_company4_desc:0 "Опыт создания техники с нагруженным резервом, накопленный в Великую войну, можно применить, чтобы упростить процедуру ремонта более современной техники."
 tech_field_hospital:0 "Полевой госпиталь I"
 tech_field_hospital_desc:0 "«Потеря» еще не означает, что боец погиб. Экстренная медицинская помощь раненым, доставленным в тыл, — первый шаг на пути к спасению жизни."
 tech_field_hospital2:0 "Полевой госпиталь II"
 tech_field_hospital2_desc:0 "Используя передвижные госпитали и оказывая помощь там, где она нужнее всего, мы предотвратим немало лишних смертей и неизлечимых травм."
 tech_field_hospital3:0 "Полевой госпиталь III"
 tech_field_hospital3_desc:0 "Хирургическое вмешательство — самая распространенная врачебная операция на поле боя. Необходимые средства для их проведения должны быть ближе к линии фронта, и мы должны сделать так, чтобы среди военных медиков были опытные хирурги."
 tech_field_hospital4:0 "Полевой госпиталь IV"
 tech_field_hospital4_desc:0 "Несмотря на достижения военно-полевой медицины, многие изобретения сделаны наскоро, и у нас нет общей доктрины. Накопив достаточно опыта, мы можем точнее очертить круг задач этих частей и сделать временные улучшения постоянными."
 tech_logistics_company:0 "Рота обеспечения I"
 tech_logistics_company_desc:0 "Если у нас есть специальный офицер по вопросам тыла, то сеть снабжения будет функционировать эффективнее."
 tech_logistics_company2:0 "Рота обеспечения II"
 tech_logistics_company2_desc:0 "Адаптировав нашу систему анализа рисков к новым условиям войны, мы сможем лучше обезопасить систему снабжения."
 tech_logistics_company3:0 "Рота обеспечения III"
 tech_logistics_company3_desc:0 "Непрерывный статистический анализ потребностей наших войск позволит добиться более эффективного расходования ресурсов."
 tech_logistics_company4:0 "Рота обеспечения IV"
 tech_logistics_company4_desc:0 "Разработка стандартной номенклатуры для ресурсов уменьшит путаницу и сделает планирование более эффективным."
 tech_signal_company:0 "Рота связи I"
 tech_signal_company_desc:0 "Для установления и поддержания связи на поле боя всегда требовались особые навыки. С возникновением новых средств связи и обнаружения в ходе Великой войны открылись новые практические возможности."
 tech_signal_company2:0 "Рота связи II"
 tech_signal_company2_desc:0 "Роты связи, обеспечивающие обмен данными между разными родами войск, помогают сухопутным войскам наладить координацию с морскими и воздушными силами и быстрее планировать свои действия."
 tech_signal_company3:0 "Рота связи III"
 tech_signal_company3_desc:0 "Новые портативные устройства связи можно переносить в рюкзаке. Необходимо использовать эту улучшенную мобильность рот связи."
 basic_train:0 "Гражданский поезд"
 basic_train_desc:0 "Развитие военных технологий и промышленности."
 railway_gun:0 "Железнодорожное орудие"
 wartime_train:0 "Военный поезд"
 wartime_train_desc:0 "Развитие военных технологий и промышленности."
 armored_train:0 "Бронепоезд"
 armored_train_desc:0 "Развитие военных технологий и промышленности."
 hq_motorized:0 "Моторизованная охрана штаба"
 hq_motorized_desc:0 "Моторизированная пехота, ускоряющая передвижение штаба."
 sp_tag_rocket:0 "Проекты ракетной техники"
 street_fighting:0 "Уличные бои"
 sp_naval_modern_battleship_preference_a_a:0 "Повысить огневую мощь"
 tactic_attacker_hb_storm:0 "Штурм моста"
 infiltration_in_depth:0 "Глубокое проникновение"
 infiltration_in_depth_desc:0 "Наши войска теперь умеют обходить и изолировать вражеские укрепрайоны гораздо глубже. В идеале они не остановятся, пока не доберутся до вражеского тыла и не отрежут его от основной группировки войск."
 bb_tech:0 "Модели линкоров"
 assault_breakthrough:0 "Тактика прорыва"
 assault_breakthrough_desc:0 "Иногда эффективнее не начинать массированное наступление по всей линии фронта, а сосредоточить усилия в одной или нескольких ее точках и осуществить там прорыв."
 SUBDOCTRINE_EXPEDITIONARY_WARFARE_DESC:0 "Вся боевая мощь мира ничего не значит, если ее невозможно применить в бою. Мы сосредоточимся на возможности проецирования нашей силы для достижения стратегических целей."
 naval_minelaying:0 "Технология установки мин флотом"
 cat_operational_integrity:0 "Доктрина оперативного взаимодействия"
 tactic_gas_cylinder_failing:0 "Случайное высвобождение газа"
 sp_naval_modern_battleship_preference_c_b:0 "Повысить защиту от торпед"
 cat_heavy_armor:0 "Модели тяжелых танков"
 SUBDOCTRINE_FIGHTER_CENTRAL_FIELD_DESC:0 "Самолет — самое действенное оружие современной эпохи. Благодаря авианосцам мы сможем наносить удары по всему миру."
 sp_naval_fleet_submarine_preference_b:0 "Укрепить подлодки"
 sp_air_earthshaker_bomb:0 "Сейсмическая бомба"
 sp_air_earthshaker_bomb_desc:0 "Тяжелая бомба, которая пробивает поверхность земли и взрывается под землей. Такой взрыв производит сильнейшие разрушения."
 sp_land_generic_reward_engine_bonus_1:0 "Экономичные двигатели"
 sp_land_generic_reward_engine_bonus_1_desc:0 "Благодаря последним доработкам экспериментального двигателя для прототипа проекта «[SpecialProject.GetName]» нам удалось значительно повысить его эффективность. [Character.GetName] и его команда открывают новые горизонты для наших конструкторов. Если мы сможем внедрить эти разработки в производство обычных танковых двигателей, их возможности заметно возрастут."
 sp_air_generic_reward_test_failure_2:0 "Разрушительная бомба"
 armor_tech_4_tt:0 "Открывает значения в 18 и выше для улучшения брони."
 SUBDOCTRINE_THEATER_INTERDICTION_DESC:0 "Наши бомбардировщики могут, не опасаясь задеть собственные войска, беспрепятственно сеять хаос в тылу врага и тем самым косвенно помогать солдатам на фронте."
 sp_naval_generic_reward_navy_xp_2:0 "Волна идей"
 antitank1:0 "Модернизация ПТО I"
 antitank1_desc:0 "Важность эффективных противотанковых орудий была доказана еще во время Великой войны. C появлением новых моделей танков необходимо разработать следующее поколение средств ПТО."
 additional_machine_guns:0 "Дополнительные пулеметы"
 additional_machine_guns_desc:0 "Дополнительные пулеметы на боковых выступах и специальных вертлюгах повышают эффективность обороны машины от атак пехоты на малой дистанции."
 category_tank_destroyers:0 "Противотанковые орудия"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02:0 "$sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01$"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02_desc:0 "Новый метод укрепления сооружений, обнаруженный одним из младших инженеров, был передан другой научной группе для дальнейшего изучения. Хотя результаты анализа еще не готовы, этот метод вполне можно использовать в текущем проекте, если в этом будет необходимость."
 OR:0 "или"
 small_plane_airframe_4:0 "Корпус современного маленького самолета"
 small_plane_airframe_4_desc:0 "Этот корпус был разработан специально, чтобы воспользоваться преимуществом больших скоростей, предоставляемых современными двигателями. Его конструкция позволяет решить ряд структурных проблем, возникающих при полетах на высокой дозвуковой скорости."
 AMC_desc:0 "Armored Motor Car Company."
 tactic_handmade_gas_masks:0 "Отступление в противогазах ручной работы"
 SUBDOCTRINE_NAVAL_TORPEDO_TACTICS_DESC:0 "Враг может уклониться от двух или трех торпед, но от дюжины ко дну пойдет даже самый прочный корабль."
 USA_maneuver_divison:0 "Маневры"
 sp_land_reward_option_multi_charge_large_caliber_gun_successful_test_firing_desc:0 "Успешно завершилось испытание орудия «[SpecialProject.GetName]». Во время стрельб оно показало впечатляющие дальность и точность ведения огня. Такой результат воодушевил весь научный коллектив, а также привлек внимание высокопоставленных чиновников. Проект набирает ход, а ученые теперь не сомневаются в его успешном завершении."
 damaged_light_guns:0 "Легкая батарея повреждена"
 floating_fortress_bs:0 "Плавучая крепость"
 floating_fortress_bs_desc:0 "Линкоры находятся в состоянии повышенной готовности и ответят на любую попытку врага проникнуть в наши воды. Любому флоту нужен прочный фундамент, а линкор не знает себе равных по мощи."
 firebrigades:0 "Пожарный корпус"
 firebrigades_desc:0 "«Пожарными корпусами» называли наспех собранные части в случае вражеского прорыва или других экстренных ситуаций.\n\n"
 plains:0 "Равнины"
 plains_desc:0 ""
 sp_naval_modern_battleship_unique_reward_a:0 "Современный линкор: надежда"
 sp_naval_modern_battleship_unique_reward_a_desc:0 "Говорят, что эпоха линкоров прошла, однако мы считаем, что они еще могут проявить себя в бою. Есть надежда, что этот корабль обеспечит нам превосходство на море. На чём нам лучше сосредоточить усилия, чтобы воплотить эту мечту в реальность?"
 jet_technology:0 "Технология реактивной тяги"
 delay:0 "Сдерживание"
 delay_desc:0 "Даже когда в битве нельзя победить, бывает полезно замедлить наступление противника с помощью засад и сдерживающих действий."
 sp_land_generic_reward_option_armor_bonus_desc:0 "Использовать этот сплав в наших производственных линиях."
 sp_naval_super_heavy_battleship_unique_reward_a:0 "Вопрос приоритета: боевой потенциал"
 sp_naval_super_heavy_battleship_unique_reward_a_desc:0 "В ходе разработки нового класса линкоров мы можем сосредоточить усилия на повышении боевой эффективности корабля. Как нам лучше поступить?"
 heavy_armor_advice_tt:0 "\nУстановка улучшенного модуля §YБроня§! на §Yтяжелые корабли§! повышает их способность противостоять урону. §YЛинкоры§! и §Yлинейные крейсеры§! определяются разными §Yсхемами бронирования§!. Линейные крейсеры обычно бронированы хуже."
 sp_air_generic_reward_test_failure_3:0 "Творческая катастрофа"
 undersea_blockade:0 "Подводная блокада"
 undersea_blockade_desc:0 "Подводные лодки — идеальное средство, позволяющее прервать поставки важного сырья противнику. Мы уничтожим всю промышленность и возьмем его измором."
 category_anti_tank:0 "Вся противотанковая артиллерия"
 sp_land_reward_option_land_cruiser_communication_redesign_bonus_name:0 "Переработанная система связи"
 tank_small_cannon:0 "Малая пушка"
 tank_small_cannon_desc:0 "Небольшая и дешевая пушка, способная вести огонь как шрапнельными, так и бронебойными снарядами. Малый калибр ограничивает ее эффективность."
 sp_torpedo_cruiser_eq_bonus_light_attack:0 "Торпедный крейсер — улучшения легких орудий"
 SUBDOCTRINE_OPEN_OCEAN_AIR_PATROL_DESC:0 "Дальность действия современных самолетов такова, что они способны выполнять задачи по поиску вражеских морских сил и нанесению ударов по ним еще до того, как те достигнут наших берегов."
 sp_land_reward_option_stronghold_network_collapse_01_continue_without_delay:0 "Продолжить работу как можно скорее."
 SUBDOCTRINE_SCREEN_PATROL_BOATS_DESC:0 "Дешевые и быстрые ударные корабли, вооруженные торпедами, — действенное средство борьбы с традиционными флотилиями тяжелых кораблей, особенно в прибрежных водах, где можно наносить удары из засады."
 extra_ammo_storage:0 "Дополнительное хранилище боеприпасов"
 extra_ammo_storage_desc:0 "Дополнительный боезапас позволяет танку дольше вести бой без необходимости восполнять запасы — но, если в бою у танка пробьют броню, результаты могут быть самыми плачевными. Особенно это стоит учитывать при атаке."
 cv_tech:0 "Модели авианосцев"
 sp_armored_advanced_flamethrower_tech:0 "Улучшенный огнемет"
 sp_armored_advanced_flamethrower_tech_desc:0 "$advanced_flamethrower_desc$"
 tactic_gas_artillery_tear:0 "Артиллерийский залп слезоточивым газом"
 cat_medium_armor:0 "Модели средних танков"
 category_anti_air:0 "Батальоны ПВО"
 mio_cat_tech_all_armor_and_modules:0 "Все технологии бронетехники"
 sp_super_heavy_battleship_eq_bonus_light_attack:0 "Сверхтяжелый линкор — улучшения легких орудий"
 specialization_nuclear:0 "Ядерные исследования"
 GRAND_DOCTRINE_MASS_ASSAULT:0 "Массированный штурм"
 GRAND_DOCTRINE_GRAND_BATTLEPLAN_DESC:0 "Должная подготовка помогает преодолеть любые преграды. Большой план операции включает в себя взвешенную и тщательную подготовку всех родов войск как в наступлении, так и в обороне."
 SUBDOCTRINE_FIRE_CONCENTRATION:0 "Концентрация огня"
 field_hospital:0 "Полевой госпиталь"
 field_hospital_desc:0 "Обеспечивает экстренную медицинскую помощь раненым солдатам на поле боя."
 desert:0 "Пустыня"
 desert_desc:0 ""
 mio_cat_tech_all_capital_ship_and_modules:0 "Все технологии крупных кораблей"
 air_techs_folder:0 "Авиация"
 air_techs_folder_desc:0 "Самолеты и их разновидности."
 werwolf_guerillas:0 "Партизаны-оборотни"
 werwolf_guerillas_desc:0 "«Оборотни» были заранее подготовленной группой немецкого сопротивления для борьбы с оккупантами на случай поражения в войне."
 sp_naval_underway_replenishment_preference_c:0 "Найти баланс"
 sp_naval_generic_reward_armor_tech_1:0 "Изучение новой брони"
 tactic_defender_sb_retake_bridge:0 "Повторный захват моста"
 subsidiary_carrier_role_ti:0 "Вспомогательная роль авианосцев"
 subsidiary_carrier_role_ti_desc:0 "Авианосцы оказывают поддержку линкорам, повышая их скорость переключения с обороны на наступление. Авианосец, совмещающий функции разведчика и мощной ударной группы, отлично дополняет более медлительные линкоры."
 unrestricted_submarine_warfare:0 "Неограниченная подводная война"
 unrestricted_submarine_warfare_desc:0 "Наши подводные лодки будут уничтожать любой корабль без предупреждения, будь то гражданский или боевой. Некоторые назовут такой подход нарушением правил войны, но оспаривать его эффективность бессмысленно."
 sp_land_generic_reward_major_progress_1_desc:0 "[Character.GetName] добивается нового, достаточно серьезного прорыва, тем самым значительно продвигая ход работ над проектом. Научный коллектив, вдохновленный профессионализмом руководителя, взялся за дело с удвоенным рвением. Проект стал ближе к завершению, а [Character.GetName] навсегда войдет в историю как новатор."
 SUBDOCTRINE_SUBMARINE_WOLFPACKS:0 "Волчьи стаи"
 SAF:0 "Южная Африка"
 gw_tank_equipment:0 "Танк Первой мировой"
 gw_tank_equipment_desc:0 "Танки периода Первой мировой войны разрабатывались одновременно и независимо друг от друга Великобританией и Францией, чтобы переломить ход окопной войны. Само слово «танк» («цистерна») было принято британцами в самом начале разработки с целью скрыть ее истинное назначение. Ранние танки были медлительны, вооружены пулеметами и пушками малого калибра, а их броня могла защитить только от стрелкового вооружения."
 armor:0 "Технология бронетехники"
 ZHC:0 "Чжили"
 convoy_interdiction:0 "Перехват конвоев"
 convoy_interdiction_desc:0 "Улучшенная координация действий наших подводных лодок позволяет им перехватывать конвои в пути. Нарушив маршруты снабжения противника, мы получим стратегическое преимущество."
 recon_tech:0 "Разведывательная рота"
 YUN:0 "Юньнань"
 USA:0 "Америка"
 has_invested_in_schneider:0 "Шнейдер проинвестирован"
 backhand_blow:0 "Удар в тыл"
 backhand_blow_desc:0 "Вместо того чтобы бороться за каждый клочок земли, в основном можно игнорировать вклинивания врага до тех пор, пока он не продвинется слишком глубоко — тогда его можно отрезать и уничтожить в ходе контрнаступления."
 lc_helipad:0 "Вертолетная площадка"
 lc_helipad_desc:0 "Платформа для запуска вертолетов. Предназначена для обеспечения доскональной воздушной разведки и повышения осведомленности о боевой обстановке."
 heavy_tank_flame_chassis:0 "Тяжелый огнеметный танк"
 heavy_tank_flame_chassis_desc:0 "Большая боевая машина с огнеметом в башне для атаки укреплений и зданий."
 infantry_tech:0 "Технология пехоты"
 DOCTRINE_TRACK_HEAVY_AIRCRAFT:0 "Тяжелая авиация"
 medium_plane_airframe_3:0 "Усовершенствованный корпус среднего самолета"
 medium_plane_airframe_3_desc:0 "Разработанный с целью достичь оптимальной эффективности при несении большой нагрузки, этот корпус представляет собой наилучшую модель для самолетов с механическим двигателем."
 supply_node:0 "Узел снабжения"
 supply_node_desc:0 "Узел снабжения — точка на железной дороге вне городов, в которой можно получить снабжение."
 antitank3:0 "Улучшенная ПТО: модернизация I"
 antitank3_desc:0 "Бризантные снаряды, применяемые в противотанковой артиллерии, компенсируют ее ограниченную дульную скорость."
 ship_anechoic_tile:0 "Звукопоглощающее покрытие"
 ship_anechoic_tile_desc:0 "Защитное покрытие из резиновой плитки сокращает расстояние, на котором корабли могут быть обнаружены как активным, так и пассивным гидролокатором."
 tank_light_fixed_superstructure_turret:0 "Легкая фиксированная надстройка"
 tank_light_fixed_superstructure_turret_desc:0 "Фиксированная надстройка сильно ограничивает угол поворота главного орудия, но позволяет установить орудие более крупного калибра на относительно небольшую боевую машину, что делает эту машину идеально подходящей для засад."
 medium_battery_advice_tt:0 "\n\nУстановка модулей §YЛегкая средняя батарея§! или §YСредняя батарея§! на §Yкрейсеры§! усиливает §Yобстрел из легких орудий§! или §Yобстрел из тяжелых орудий§!, что позволяет сражаться с вражескими §Yкораблями охранения§! и §Yкрупными кораблями§!. Установка §Yсредней батареи§! любого вида делает корабль §Yтяжелым крейсером§!, установка же только §Yлегкой средней батареи§! делает его §Yлегким крейсером§!."
 modern_large_airframe:0 "$large_plane_airframe_4$"
 modern_large_airframe_desc:0 "$large_plane_airframe_4_desc$"
 SUBDOCTRINE_LINE_OF_BATTLE:0 "Строй кораблей"
 sp_naval_nuclear_torpedo:0 "Атомная торпеда"
 sp_naval_nuclear_torpedo_desc:0 "В наступающую эпоху царствования тактических боеголовок малой мощности хорошо себя проявят торпеды дальнего действия, оснащенные такими боеголовками. В теории вооружить ими можно будет любую обычную подлодку."
 ss_tech:0 "Модели подводных лодок"
 FRA_land_army_restrictions:0 "Ограничения французской армии"
 SUBDOCTRINE_EXPEDITIONARY_WARFARE:0 "Экспедиционная война"
 sp_land_reward_option_land_cruiser_engine_modify_bonus_name:0 "Улучшенный двигатель"
 tac_bomber_equipment_0:0 "Межвоенный бомбардировщик"
 tac_bomber_equipment_0_desc:0 "Есть мнение, что для победы в следующей войне достаточно бомбить врага до полного уничтожения. Необходимо начать разработку самолета, способного доставлять тяжелые бомбы с приемлемой скоростью."
 sp_naval_fleet_submarine_preference_a:0 "Повысить боевую эффективность подлодок."
 anti_air:0 "Поддержка ПВО"
 anti_air_desc:0 ""
 modern_battleship:0 "$ship_hull_heavy_modern$"
 amphibious_mechanized:0 "Батальон амфибий"
 amphibious_mechanized_desc:0 "Подразделение механизированной пехоты в машинах-амфибиях."
 sp_land_reward_option_land_cruiser_suspension_full:0 "Полная гидропневматическая подвеска"
 mio_cat_eq_all_small_plane:0 "Все малые самолеты и палубная авиация"
 sp_naval_proximity_fuze:0 "Дистанционный взрыватель"
 sp_naval_proximity_fuze_desc:0 "Благодаря развитию радиотехники мы можем разработать новые виды взрывателей, которые будут срабатывать, просто находясь в непосредственной близости от цели."
 nuclear_submarine:0 "$ship_hull_nuclear_submarine$"
 nuclear_submarine_desc:0 "$ship_hull_nuclear_submarine_desc$"
 stabilizer:0 "Стабилизатор"
 stabilizer_desc:0 "Механическое устройство, предназначенное для сохранения наводки орудия при движении танка. Хоть оно не настолько совершенно, чтобы обеспечивать точную стрельбу на ходу, стабилизатор позволяет стрелку вести прицельную стрельбу при коротких остановках без необходимости наводиться на цель заново."
 SUBDOCTRINE_LARGE_UNIT_TACTICS_DESC:0 "Применяя метод массированных действий на узком фронте, мы сможем создать локальное превосходство, а затем подавить противника в точке приложения основных усилий и осуществить прорыв."
 SUBDOCTRINE_MOBILE_INFANTRY_DESC:0 "Сосредоточьте внимание пехоты на мобильности, чтобы поддерживать темп продвижения и не увязнуть в кровопролитных позиционных боях."
 fuel_silo:0 "Топливное хранилище"
 fuel_silo_desc:0 "Это здание расширяет возможности вашего государства по хранению §Hгорючего§!."
 tactic_ambush:0 "Засада"
 sp_land_reward_option_land_cruiser_turret_redesign_bonus_name:0 "Переработанные башни"
 sp_land_reward_option_land_cruiser_ammunition_simplified:0 "Использовать упрощенную систему"
 SUBDOCTRINE_MOBILE_INFANTRY:0 "Моторизированная пехота"
 mio_cat_tech_all_destroyer_and_modules:0 "Все технологии эсминцев"
 rocket_submarine:0 "Ракетная подлодка"
 rocket_submarine_desc:0 "Новое поколение подводных лодок, оснащенных ракетами и пусковыми установками, которые позволяют нам наносить неожиданные удары по стратегическим целям противника"
 ITA_italian_tankettes:0 "Итальянские танкетки"
 ITA_italian_tankettes_desc:0 "Пока другие страны проектируют всё более крупные и тяжелые танки в поисках такого супертанка, который сделает устаревшими все остальные, мы знаем, что лучший танк — это тот, который воюет. Он должен быть достаточно быстрым, чтобы вовремя добираться туда, где он нужен, а брони ему достаточно такой, чтобы защищала от винтовочной пули. Эти машины можно производить быстро и дешево."
 heavy_tank_chassis_1:0 "Базовый тяжелый танк"
 armored_engineer:0 "Бронетанковая инженерная рота"
 armored_engineer_desc:0 "Эти подразделения располагают универсальной техникой, предназначенной для возведения укреплений, расчистки препятствий и повышения мобильности в боевых условиях."
 SUBDOCTRINE_GUERILLA_WAR:0 "Партизанская война"
 cat_base_strike:0 "Доктрина ударов по базам"
 naval_air:0 "Морская авиация"
 tank_rocket_launcher_2:0 "Улучшенная реактивная установка"
 tank_rocket_launcher_2_desc:0 "Эта установка отличается повышенной точностью стрельбы, но основное ее преимущество — увеличенное количество ракет."
 convoy_sailing_ti:0 "Конвоирование"
 convoy_sailing_ti_desc:0 "С введением обязательных конвоев стало легче обнаруживать корабли противника и вовремя реагировать на их появление. Безопаснее действовать сообща."
 cat_air_guns:0 "Авиационные орудия"
 sp_air_supersonic_jet:0 "Сверхзвуковой реактивный самолет"
 sp_air_supersonic_jet_desc:0 "Благодаря труду конструкторов реактивных двигателей вскоре появится возможность строить самолеты, способные достигать скорости звука и даже превышать ее."
 ship_torpedo_sub_nuclear:0 "Атомная торпеда"
 ship_torpedo_sub_nuclear_desc:0 "Торпеды, оснащенные ядерной боеголовкой, являются высокоэффективным оружием против кораблей противника, но при их использовании повышается вероятность катастрофы."
 branch_interoperation:0 "Взаимодействие войск"
 branch_interoperation_desc:0 "Более тесная координация действий между разными родами войск повышает их эффективность при проведении совместных операций."
 sp_land_reward_stronghold_network_underground_rail_systems:0 "Подземная железнодорожная сеть"
 medium_tank_aa_chassis:0 "Средняя ЗСУ"
 medium_tank_aa_chassis_desc:0 "Хорошо сбалансированная боевая машина с зенитным орудием для обороны от вражеской авиации."
 tactic_gas_mask_charge_attack:0 "Атака в противогазах"
 bouncing_bomb_release:0 "Механизм сброса прыгающей бомбы"
 bouncing_bomb_release_desc:0 "Держатель для перевозки и сброса особых прыгающих бомб, совершающих несколько прыжков по поверхности воды перед взрывом. Этот механизм перед сбросом раскручивает бомбу в обратном направлении, повышая таким образом вероятность поражения заданной цели."
 aggressive_assaulter:0 "Агрессивный нападающий"
 aggressive_assaulter_desc:0 "§LНаступление – лучший способ защиты.§!"
 tank_torsion_bar_suspension:0 "Торсионная подвеска"
 tank_torsion_bar_suspension_desc:0 "Относительно надежная система подвески из металлических балок, прикрепленных к шасси боевой машины. Сглаживает неровности лучше, чем подвески других типов."
 category_special_forces:0 "Войска специального назначения"
 SUBDOCTRINE_SUBMARINE_COASTAL_MINELAYING:0 "Минирование прибрежных вод"
 tactic_tw_evade:0 "Уклонение"
 sp_land_reward_land_cruiser_chassis:0 "Перегрузка шасси"
 sp_land_reward_land_cruiser_chassis_desc:0 "В ходе испытаний проекта «[SpecialProject.GetName]» выяснилось, что его шасси не способно выдержать столь огромный вес и попросту ломается под давлением. Команда конструкторов рассматривает два возможных решения: усилить шасси, что еще больше увеличит вес машины, либо использовать более легкие материалы, что может снизить ее прочность."
 sp_air_generic_reward_air_xp_2:0 "Новые веяния"
 c3i_theory:0 "Командование, управление, связь и разведка"
 c3i_theory_desc:0 "Эффективные действия штабных офицеров обеспечивают регулярный обмен приказами, информацией и разведданными между командующим и его боевыми частями."
 sp_torpedo_cruiser_eq_bonus_torpedo:0 "Торпедный крейсер: увеличенный запас торпед"
 sp_land_reward_self_propelled_super_heavy_howitzer_focus_preference:0 "$sp_land_reward_super_heavy_howitzer_focus_preference$"
 sp_land_reward_self_propelled_super_heavy_howitzer_focus_preference_desc:0 "$sp_land_reward_super_heavy_howitzer_focus_preference_desc$"
 sp_modern_battleship_eq_bonus_light_attack:0 "Современный линкор — улучшения легких орудий"
 cas_veteran_initiative:0 "Программа поддержки штурмовиков-ветеранов"
 cas_veteran_initiative_desc:0 "Политика, по которой пилоты-ветераны передают свой опыт и знания молодым летчикам, увеличит шансы новобранцев на выживание."
 floating_airfield_bs:0 "Плавучая авиабаза"
 floating_airfield_bs_desc:0 "Улучшенная интеграция авианосцев в наш флот позволяет нам наносить удары с моря и воздуха. Это — ключ к обеспечению превосходства в воздухе везде, где бы мы ни были."
 tactic_defender_sb_reckless_assault:0 "Отчаянный штурм"
 floating_fortress_ti:0 "Плавучая крепость"
 floating_fortress_ti_desc:0 "Линкоры находятся в состоянии повышенной готовности и ответят на любую попытку врага проникнуть в наши воды. Любому флоту нужен прочный фундамент, а линкор не знает себе равных по мощи."
 tactic_sf_defense:0 "Защищать город"
 helicopter_equipment_1:0 "Вертолет"
 helicopter_equipment_1_desc:0 "Летательный аппарат, который использует не крылья, а быстро вращающиеся винты. Он может зависать на месте и легко меняет высоту полёта."
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology:0 "Прорыв в области сообщения силы"
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc:0 "[Character.GetName] совершает важное открытие в области сообщения импульса. Благодаря этому нам удалось значительно увеличить скорость полета и мощность снарядов орудия «[SpecialProject.GetName]». Такое открытие не только открывает новые перспективы применения этого орудия на поле боя, но и приближает нас к завершению проекта."
 cat_production:0 "Производство"
 sp_naval_midget_submarine_preference_b:0 "Повысить надежность"
 tactic_attacker_sb_hold:0 "Удерживать мост"
 sp_rocket_submarine_eq_bonus_reliability:0 "Ракетная подлодка: приоритет надежности"
 large_plane_airframe_0:0 "Корпус большого самолета межвоенных лет"
 large_plane_airframe_0_desc:0 "В этом очень большом корпусе предостаточно места для размещения бомб или топливных баков, но уже сейчас очевидно, что потенциал для его развития сильно ограничен. На горизонте уже маячат новые поколения стратегических бомбардировщиков."
 JXC:0 "Цзянси"
 engine_tech_2_tt:0 "Открывает значения в 10 и выше для улучшения двигателя."
 GMJ:0 "Гоминьцзюнь"
 sp_naval_rocket_launching_submarine_unique_reward_a:0 "Проблема с поражением целей"
 sp_naval_rocket_launching_submarine_unique_reward_a_desc:0 "Инженеры не могут решить один важный вопрос: как добиться того, чтобы наши ракеты, запущенные с подводных лодок, гарантированно достигали своих целей?"
 FOR:0 "Тайвань"
 coordination_bonus_desc:0 "Координация повышает количество урона, наносимого основной цели в бою. Другой урон распределяется по всем прочим целям."
 attritional_containment:0 "Истощающее сдерживание"
 attritional_containment_desc:0 "Если мы не можем начать наступление на вражескую позицию и уничтожить ее, то должны хотя бы постоянно терзать ее короткими выпадами. Противник понесет потери и не сможет подготовить свою атаку."
 ITA:0 "Италия"
 assault_engineer:0 "Инженерно-штурмовая рота"
 assault_engineer_desc:0 "Инженерно-штурмовые подразделения специализируются на прорыве укрепленных позиций. Они обладают опытом использования взрывчатых веществ, а также могут сооружать укрепления в самых неблагоприятных условиях."
 sp_naval_modern_battleship_preference_b_b:0 "Усилить зенитные орудия"
 SUBDOCTRINE_MOUNTED_INFANTRY:0 "Мобильная пехота"
 sp_tag_artillery:0 "Проекты артиллерийских орудий"
 sp_tag_tank:0 "Проекты танков"
 sp_armored_motorized_military_police_tech:0 "Моторизированная военная полиция"
 sp_armored_motorized_military_police_tech_desc:0 "Эти подразделения, оснащенные военными мотоциклами, способны поддерживать порядок в тылу, сопровождать колонны и вести патрулирование. Благодаря высокой мобильности они могут быстро реагировать на любые ситуации и даже проводить разведку в зоне боевых действий."
 sp_land_reward_option_stronghold_network_collapse_01:0 "Обрушение при прокладке тоннеля"
 sp_land_reward_option_stronghold_network_collapse_01_desc:0 "Тоннель под одним из основных бункеров неожиданно обрушился, в результате чего старший ученый [Character.GetName] и несколько рабочих оказались под завалами. Необходимо срочно спасти застрявших сотрудников, однако эта ситуация в любом случае скажется на ходе работ."
 sp_naval_cruiser_submarine:0 "Подводный крейсер"
 sp_naval_cruiser_submarine_desc:0 "Подводная лодка с увеличенной дальностью хода, разработанная специально для преодоления больших расстояний без дополнительного снабжения, — отличный охотник на корабли вражеского торгового флота."
 convoy_defense_tree:0 "Доктрина защиты конвоев"
 dead_reckoning_bombing:0 "Точные бомбардировки"
 dead_reckoning_bombing_desc:0 "Измеряя скорость, вектор движения и смещение относительно предыдущих позиций, мы обеспечим точное бомбометание даже ночью."
 lc_flamethrower_turret:0 "Огнеметная батарея"
 lc_flamethrower_turret_desc:0 "Башня, выстреливающая струей огня. Идеально подходит для зачистки укрепленных позиций, пехотных точек и засадных позиций. Максимально эффективна в ближнем бою в плотной городской застройке."
 cat_mechanized_equipment:0 "Модели бронетранспортёров"
 sp_land_reward_option_land_cruiser_ammunition_current:0 "Оставить текущую систему"
 sp_naval_modern_battleship_preference_c_a:0 "Повысить точность"
 SUBDOCTRINE_FIELD_ENGINEERING:0 "Полевые инженерные работы"
 mothership:0 "Самолет-матка"
 small_plane_airframe_2:0 "Улучшенный корпус маленького самолета"
 small_plane_airframe_2_desc:0 "Благодаря улучшенной аэродинамике и более надежной конструкции этот корпус представляет собой значительный шаг вперед по сравнению с основной моделью."
 dispersed_support:0 "Рассредоточенная поддержка"
 dispersed_support_desc:0 "Рассредоточив наши отряды поддержки по большей площади и не выводя их при этом на линию огня, вы получите дивизии с более высокими оборонительными качествами.\n\n"
 SUBDOCTRINE_BATTLESHIP_ANTIAIR_SCREEN:0 "Линкоры ПВО"
 cat_fleet_in_being:0 "Доктрина воздействия флотом"
 mio_cat_eq_only_strategic_bomber:0 "Тяжелый бомбардировщик"
 tactic_breakthrough:0 "Прорыв"
 specialization:0 "Специализация (специализации)"
 AST:0 "Австралия"
 tank_close_support_gun:0 "Орудие непосредственной поддержки"
 tank_close_support_gun_desc:0 "Небольшое орудие, спроектированное для стрельбы фугасными снарядами по полевым укреплениям противника и поддержки атакующей пехоты. Способно атаковать бронетехнику, но короткий ствол и ограниченный боезапас делают его непригодным для борьбы с мощными танками."
 tank_medium_fixed_superstructure_turret:0 "Средняя фиксированная надстройка"
 tank_medium_fixed_superstructure_turret_desc:0 "Фиксированная надстройка сильно ограничивает угол поворота главного орудия, но позволяет установить орудие более крупного калибра на относительно небольшую боевую машину, что делает эту машину идеально подходящей для засад."
 category_rocket_artillery:0 "Вся ракетная артиллерия"
 SP_UNLOCK_BUILDING_ICON_DESC:0 "Открывает сооружение: $BUILDING|Y$ \n\n£GFX_buildings_strip|$ICON_FRAME$ \n\n$BUILDING_DESCRIPTION$"
 sp_land_generic_reward_test_failure_2:0 "Дефект в конструкции"
 category_support_battalions:0 "Все роты обеспечения"
 sp_naval_anechoic_tiles_unique_reward_a:0 "Новые наработки: строительство корпуса подлодки"
 sp_naval_anechoic_tiles_unique_reward_a_desc:0 "В ходе создания звукопоглощающей плитки мы обнаружили, что наши наработки можно адаптировать для существующих проектов подводных лодок, чтобы повысить их скрытность, или немного сэкономить на их стоимости, удовлетворившись нынешним уровнем заметности."
 medium_tank_artillery_chassis:0 "Средняя САУ"
 medium_tank_artillery_chassis_desc:0 "Хорошо сбалансированная боевая машина. Основная роль — огневая поддержка наступающей пехоты."
 sp_land_reward_land_cruiser_overheating:0 "Перегрев во время испытаний"
 BASE:0 "Базовое значение:"
 SUBDOCTRINE_SCREEN_ANTI_AIRCRAFT_CRUISERS_DESC:0 "Легким крейсерам не хватает живучести, чтобы долго оставаться в боевом порядке, но их можно оснастить зенитными орудиями для прикрытия флота от вражеских самолетов."
 sp_naval_generic_failure_nuclear_accident:0 "Локализованная ядерная авария"
 sp_naval_aip_engine:0 "Воздухонезависимая силовая установка"
 sp_naval_aip_engine_desc:0 "Новая двигательная установка, способная устранить главную слабость подлодок — необходимость всплывать для подзарядки батарей и пополнения запасов воздуха."
 small_plane_airframe_5:0 "Корпус маленького сверхзвукового самолета"
 small_plane_airframe_5_desc:0 "Этот современный корпус способен достигать скорости 1 мах и олицетворяет вершину человеческой инженерной мысли"
 electronics:0 "Электроника"
 FRA_ww1_the_french_miracle:0 "Французское чудо"
 FRA_ww1_the_french_miracle_desc:0 "Есть одна вещь, которой никогда не будет у бошей, — французская изобретательность. Наш народ, от Карла Великого до Наполеона, способен на невероятные подвиги. Мы приложим все наши усилия к созданию единой модели танка, быстрой, с вращающейся башней и короткой быстро перезаряжаемой пушкой, разместим двигатель сзади, поднимем гусеницы и сделаем его легендарным."
 ship_hull_cruiser_coastal_defense_ship:0 "Корабль береговой обороны"
 ship_hull_cruiser_coastal_defense_ship_desc:0 "Эти относительно дешевые корабли слишком малы для полноценных океанических сражений. Они жертвуют дальностью хода ради тяжелого вооружения и брони."
 sp_land_reward_option_land_cruiser_chassis_redesign:0 "Полностью переработать шасси."
 mio_cat_all_light_aircraft_and_modules:0 "Все технологии легкой авиации"
 sp_land_generic_reward_option_armor_tech_desc:0 "Во время работы над проектом «[SpecialProject.GetName]», которым руководит [Character.GetName], мы добились серьезных успехов в смежных областях. Эти достижения совершили, без преувеличения, революцию в военном деле: теперь мы сможем разработать более эффективные методы ведения боевых действий."
 super_heavy_armor:0 "Сверхтяжелый танк"
 super_heavy_armor_desc:0 "Сверхтяжёлые танки ещё медленнее и неповоротливее тяжёлых танков, но обладают большей огневой мощью и защищённостью."
 lc_aircraft_catapult:0 "Авиационная катапульта"
 lc_aircraft_catapult_desc:0 "Система запуска небольших самолетов-разведчиков. Позволяет сухопутному крейсеру разведывать окрестности и собирать данные в реальном времени."
 naval_armor:0 "Корабельная броня"
 sp_naval_fleet_submarine:0 "Эскадренная подводная лодка"
 sp_naval_fleet_submarine_desc:0 "Подводная лодка большой дальности плавания, способная сопровождать флотилии и при этом лишенная конструктивных недостатков старых крейсерских подлодок."
 sp_naval_generic_failure_torpedo_accident:0 "Взрыв торпеды"
 SUBDOCTRINE_LIGHT_TASK_FORCES:0 "Легкие оперативные соединения"
 sp_land_reward_stronghold_network_communication_system_overhaul:0 "Обновление систем связи"
 sp_land_reward_stronghold_network_communication_system_overhaul_desc:0 "Во время проверки внутренней системы связи испытательного центра инженеры выявили некоторые недостатки. Устранив их, мы сможем улучшить и другие подобные системы, используемые в укреплениях."
 signal_company:0 "Рота связи"
 signal_company_desc:0 "Отвечает за работоспособность локальной связи внутри дивизии."
 SUBDOCTRINE_ARMORED_INFANTRY_SUPPORT_DESC:0 "Благодаря своей огневой мощи и защите танки могут быстро выводить из строя пулеметы и другое вооружение, препятствующее продвижению пехоты. Взаимодействие танков и пехоты должно быть непрерывным."
 mot_recon:0 "Моторизированная разведрота"
 mot_recon_desc:0 "Используя лёгкие грузовики и мотоциклы, разведроты могут действовать на большем расстоянии и покрывать больший радиус, защищая фланги."
 mio_cat_eq_all_artillery:0 "Вся артиллерия"
 ship_modules_tech:0 "Корабельные модули"
 cat_light_armor:0 "Модели легких танков"
 tactic_planned_attack:0 "Хорошо спланированная атака"
 sp_modern_carrier_eq_bonus_armor:0 "Современный авианосец — современная бронепалуба"
 radar_station:0 "Радарная станция"
 radar_station_desc:0 "Радар предоставляет вам данные о вражеских войсках в ближайших регионах.\nЧем выше его уровень, тем больше радиус действия.\nТакже он позволяет эффективнее обнаруживать вражескую авиацию в регионе, повышая шансы на успех ваших летчиков.\nКроме того, радары улучшают обнаружение вражеских флотов."
 carrier_battlegroups:0 "Боевые формирования авианосцев"
 carrier_battlegroups_desc:0 "Авианосцы способны поражать вражеские цели на гораздо большем расстоянии, чем любые другие корабли, а самолеты не дадут врагу застать нас врасплох. Авианосные группировки — это грозная сила."
 SUBDOCTRINE_DOGFIGHTING_MASTERY_DESC:0 "Пилоты истребителей сражаются в одиночку, что почти неслыханно на современной войне. Необходимо, чтобы каждый летчик-истребитель довел свое мастерство до совершенства."
 sp_super_heavy_battleship_eq_bonus_heavy_attack:0 "Сверхтяжелый линкор — улучшения тяжелых орудий"
 SUBDOCTRINE_FLEXIBLE_FIRE_SUPPORT:0 "Координация сухопутных и морских сил"
 infantry:0 "Пехота"
 infantry_desc:0 "Мясо для мясорубки."
 LUX_london_treaty:0 "Treaty of London"
 LUX_london_treaty_desc:0 "Under the Treaty of London of 1867, Luxembourg is considered a neutral state and is not allowed to have an army. The local police force is the only military force the country has, making it a defenseless nation."
 advanced_firebases:0 "Усовершенствованные базы огневой поддержки"
 advanced_firebases_desc:0 "Артиллерия может быть развернута недалеко от линии фронта на укрепленных базах, чтобы обеспечить максимально возможную поддержку наступающим войскам."
 sonar_advice_tt:0 "\nУстановка модуля §YСонар§! на §Yлегкие корабли§! и §Yкрейсеры§! даст возможность обнаруживать вражеские §Yподводные лодки§!."
 multialtitude_flying:0 "Полет на разных высотах"
 multialtitude_flying_desc:0 "Воздушный бой происходит в трех измерениях, но большинству пилотов трудно отслеживать самолеты, находящиеся под или над ними. Мы можем воспользоваться этой особенностью, расположив наши боевые порядки по вертикали."
 jet_engine_axial_6x:0 "Реактивный двигатель с 6 осями"
 jet_engine_axial_6x_desc:0 "$engine_1_6x_desc$"
 ocean:0 "Океан"
 ocean_desc:0 ""
 light_fighter:0 "Модели истребителей"
 rail_way:0 "Железная дорога"
 rail_way_desc:0 "Железные дороги соединяют узлы снабжения, позволяя распределять припасы вдали от столицы."
 sp_land_reward_option_land_cruiser_turret_simplify_bonus_name:0 "Упрощенные башни"
 SUBDOCTRINE_SIEGE_ARTILLERY:0 "Осадная артиллерия"
 tactic_sf_storm:0 "Уличные бои"
 SUBDOCTRINE_LARGE_UNIT_TACTICS:0 "Тактика крупных подразделений"
 mio_cat_eq_all_ships_no_convoys:0 "Все военные корабли"
 category_artillery:0 "Поддержка и орудия артиллерии"
 sp_land_reward_option_land_cruiser_engine_leave:0 "Оставить всё как есть."
 sp_naval_modern_battleship_preference_a_b:0 "Укрепить корпус"
 earthshaker_bomb_release:0 "Механизм сброса сейсмической бомбы"
 earthshaker_bomb_release_desc:0 "Держатель для перевозки и сброса огромных сейсмических бомб, пробивающих землю и взрывающихся под поверхностью. Такой взрыв почти полностью сносит поражаемую конструкцию."
 sp_multi_product_supply_ships:0 "Многопрофильный корабль снабжения"
 sp_multi_product_supply_ships_desc:0 "Благодаря использованию новых судов снабжения мы сможем обеспечить бесперебойную переброску снаряжения, топлива и припасов."
 armour_folder:0 "Бронетехника"
 MASS_ASSAULT_DOCTRINE:0 "Массированный штурм"
 anti_tank_battery:0 "Противотанковая батарея"
 anti_tank_battery_desc:0 ""
 category_self_propelled_anti_air:0 "Самоходные орудия ПВО"
 lc_radio_2:0 "$tank_radio_2$"
 lc_radio_2_desc:0 "$tank_radio_2_desc$"
 sp_land_super_heavy_railway_gun:0 "Сверхтяжелое железнодорожное орудие"
 sp_land_super_heavy_railway_gun_desc:0 "Исполинское орудие с невероятной мощью и точностью. Свидетельство военного превосходства любой страны, способной его применять."
 sp_mega_carrier_eq_bonus_weather:0 "Пайкеритовый авианосец — повышенная сопротивляемость погодным условиям"
 DOCTRINE_TRACK_MEDIUM_AIRCRAFT:0 "Средняя авиация"
 on_fire:0 "Сильный пожар"
 volkssturm:0 "Фольксштурм"
 volkssturm_desc:0 "Фольксштурм, или народное ополчение, состояло из мужчин, которые были негодны к военной службе по возрасту или другим причинам.\n\n"
 category_carrier_nav_bomber:0 "Палубные бомбардировщики"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01:0 "Прорыв в области усиления бетона"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc:0 "Один из младших инженеров обнаружил новый метод укрепления, который можно применять при строительстве оборонительных сооружений. Если мы запишем данные об этом открытии, в дальнейшем это упростит работу наших ученых."
 breakthrough_priority:0 "Приоритет прорыва"
 breakthrough_priority_desc:0 "В дополнение к оперативной концентрации все запросы фронтовых частей становятся менее приоритетными, чем подготовка к прорыву. Локальные поражения не столь критичны, как один решающий удар."
 SUBDOCTRINE_SUBMARINE_COASTAL_DEFENSE_DESC:0 "Малые подводные лодки, действующие около побережья, будут доставлять немало трудностей любому захватчику."
 big_ship_deck_space:0 "ВПП плавучей авиабазы"
 big_ship_deck_space_desc:0 "Открытая площадка, на которой можно обслуживать и заправлять самолеты, а также готовить их к выполнению боевых заданий. Позволяет размещать и использовать самолеты, не предназначенные для авианосцев."
 bunker:0 "Укрепление"
 bunker_desc:0 "Это сооружение накладывает штраф на атакующую сторону в сухопутном бою — $VALUE|+%0$ за каждый уровень укрепления. Атаки с разных направлений снижают эффект укреплений."
 SUBDOCTRINE_HEAVY_AIRCRAFT_FOCUS_DESC:0 "Благодаря своим размерам и грузоподъемности крупные самолеты способны нести самое разнообразное вооружение, а значит — выполнить любое задание."
 SUBDOCTRINE_LINE_OF_BATTLE_DESC:0 "Кильватерные колонны наших величественных кораблей — лучший способ доказать миру, что морями всё еще правят большие орудия и мощные бортовые залпы."
 sp_land_generic_reward_resource_scarcity_desc:0 "[Character.GetName] и его команда разработчиков столкнулись с нехваткой дефицитных материалов для работы над проектом «[SpecialProject.GetName]». Из-за этого им пришлось найти альтернативные источники и разработать новые технологии производства."
 irregular_infantry:0 "Нерегулярная пехота"
 irregular_infantry_desc:0 "Вооруженное местное ополчение"
 defensive_doctrine:0 "Мастер обороны"
 defensive_doctrine_desc:0 "§LОсобенно силен в организации обороны.§!"
 modern_blitzkrieg:0 "Современный блицкриг"
 modern_blitzkrieg_desc:0 "Современный блицкриг — венец маневренной войны, он включает в себя все последние технологические достижения и уроки, извлеченные из предыдущих доктрин."
 ENG:0 "Британия"
 hills:0 "Холмы"
 hills_desc:0 ""
 jet_engine_4x:0 "4 реактивных двигателя"
 jet_engine_4x_desc:0 "$engine_1_4x_desc$"
 sp_naval_ice_carrier_preference_b:0 "Войска противника"
 tactic_cc_local_strong_point:0 "Ближний бой: укрепленный пункт"
 cat_armored_cars:0 "Бронемашины"
 sp_land_reward_land_cruiser_turret:0 "Сложный механизм башен"
 sp_land_reward_land_cruiser_turret_desc:0 "Громоздкая конструкция с несколькими башнями создает трудности при выравнивании и прицеливании, из-за чего мы вынуждены отложить установку вооружения. Конструкторы рекомендуют упростить компоновку башен для повышения надежности, однако это снизит огневую мощь проекта «[SpecialProject.GetName]»."
 encryption_tech:0 "Методы шифрования"
 light_tank_artillery_chassis:0 "Легкая САУ"
 light_tank_artillery_chassis_desc:0 "Небольшая и компактная боевая машина. Основная роль — огневая поддержка наступающей пехоты."
 rudder_jammed:0 "Заклинило руль"
 sp_air_bouncing_bomb_training_accidents_reward:0 "Несчастные случаи на учениях"
 sp_air_bouncing_bomb_training_accidents_reward_desc:0 "К сожалению, при попытках зайти на посадку с малой высоты мы потеряли несколько самолетов. Нужно уделить максимум внимания технике безопасности и ужесточить программу подготовки."
 SP_UNLOCK_PROJECT:0 "Открывает специальный проект: $PROJECT|Y$"
 sp_land_reward_land_cruiser_assembly:0 "Точная сборка"
 sp_land_reward_land_cruiser_assembly_desc:0 "На этапе сборки инженеры успешно применили метод точной центровки при установке крупных компонентов, таких как погон башни и обшивка корпуса, что позволило значительно снизить риск механических повреждений. Мы можем использовать этот инновационный метод в дальнейшей работе над проектом «[SpecialProject.GetName]», чтобы повысить общую надежность конструкции. Как его лучше применять?"
 DOCTRINE_TRACK_SCREENS:0 "Охранение"
 hq_military_police:0 "Персонал военной полиции"
 hq_military_police_desc:0 "Поддерживает порядок и регулирует движение дивизий в зоне действия армии."
 lc_obstacle_clearance_gear:0 "Приспособление для устранения препятствий"
 lc_obstacle_clearance_gear_desc:0 "Прочные приспособления, такие как массивные бульдозерные отвалы и краны, предназначенные для уборки обломков, расчистки пути на пересеченной местности и помощи в окапывании."
 heavy_air:0 "Тяжелая авиация"
 SUBDOCTRINE_DEEP_BATTLE_DESC:0 "Дальность и ударная мощь современного оружия позволяют преодолеть оборону противника, поражая ее на всю глубину одновременно всеми имеющимися в нашем распоряжении видами оружия."
 AUS:0 "Австрия"
 grand_battlefleet:0 "Армада"
 grand_battlefleet_desc:0 "Развитые лидерские навыки помогают капитанам наших кораблей сохранять спокойствие в разгар боя, даже когда они командуют целой армадой. Наш флот сокрушит любого врага."
 lc_rocket_launcher:0 "Реактивная установка"
 lc_rocket_launcher_desc:0 "Модульная ракетная система, установленная на сухопутном крейсере. Выстреливает мощными ракетными залпами, подавляя оборону противника и рассеивая его крупные построения."
 tank_radio_2:0 "Улучшенная радиостанция"
 tank_radio_2_desc:0 "Улучшенная радиостанция позволяет командирам эффективно управлять более крупными танковыми формированиями и организовывать крупномасштабные маневры."
 explosive_ammo_equipment_1:0 "$mega_gun_emplacement$"
 explosive_ammo_equipment_1_desc:0 "Осколочно-фугасный снаряд для стрельбы из крупнокалиберного многозарядного орудия. Способен поражать цели на огромном расстоянии."
 cas_ace_initiative:0 "Программа поддержки асов-штурмовиков"
 cas_ace_initiative_desc:0 "Официальное признание заслуг асов-штурмовиков поощряет их отвагу и инициативу."
 TITLE_TRADE_INTERDICTION:0 "Заграждение морских путей"
 sp_refined_pykrete:0 "Улучшенный пайкерит"
 sp_refined_pykrete_desc:0 "Благодаря развитию технологии производства пайкерита мы сможем обеспечить гораздо лучшую изоляцию и защиту наших самолетов на борту авианосца, построенного из льда."
 sp_land_generic_reward_option_major_breakthrough_desc:0 "[Character.GetName] добивается нового, достаточно серьезного прорыва, тем самым значительно продвигая ход работ над проектом. Научный коллектив, вдохновленный профессионализмом руководителя, взялся за дело с удвоенным рвением. Проект приблизился к завершению, а [Character.GetName] навсегда войдет в историю как новатор."
 category_mobile_anti_tank:0 "Подвижная противотанковая артиллерия"
 lc_medium_cannon_turret:0 "Спаренная средняя пушка"
 lc_medium_cannon_turret_desc:0 "Стандартная орудийная башня, способная обстреливать пехоту и легкую технику. Благодаря компактности хорошо подходит для ближнего боя и вспомогательного применения."
 motorized_rocket_brigade:0 "Моторизированная ракетная артиллерия"
 motorized_rocket_brigade_desc:0 "Реактивная артиллерия позволяет использовать более крупные установки со множеством ракет, которые могут быстро сменить дислокацию после нанесения удара."
 TRA:0 "Трансильвания"
 SUBDOCTRINE_NAVAL_STRIKE_TACTICS_DESC:0 "Палубные самолеты не могут беспрепятственно сбрасывать бомбы на цели: им противостоят истребители и средства ПВО. Мы обучим летчиков упорству и умению сохранять самолеты в целости, чтобы они доводили атаки до конца."
 carrier_primacy:0 "Приоритет авианосцев"
 carrier_primacy_desc:0 "Современные самолеты лучше корабельных орудий по дальности действия и точности. Интегрируйте авианосцы в наш флот и покорите море с неба."
 category_heavy_fighter:0 "Тяжелый истребитель"
 bomber_ace_initiative:0 "Программа поддержки асов-бомбардировщиков"
 bomber_ace_initiative_desc:0 "Официальное признание заслуг асов-бомбардировщиков поощряет их отвагу и инициативу."
 hold_bridge:0 "Удерживать мост"
 super_heavy_tank_destroyer_chassis:0 "Сверхтяжелая ПТ-установка"
 super_heavy_tank_destroyer_chassis_desc:0 "Гигантская боевая машина, способная нести самую тяжелую броню и самое крупнокалиберное орудие, но из-за этого медленная и ненадежная."
 nuclear_reactor:0 "Ядерный реактор"
 nuclear_reactor_desc:0 "Это сооружение производит в регионе обогащенный уран для использования в атомном оружии."
 category_carrier_fighter:0 "Палубный истребитель"
 sp_naval_generic_reward_navy_xp_3:0 "Цунами инноваций!"
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_use_in_current_project:0 "Использовать метод в текущем проекте."
 heavy_battery_advice_tt:0 "\n\nУстановка модулей §YТяжелая батарея§! усиливает у §Yтяжелого корабля§! характеристику §YОбстрел из тяжелых орудий§!, позволяя атаковать и топить вражеские §Yкрупные корабли§!. §YТяжелые батареи§! обычно малоэффективны против небольших кораблей, таких как §Yлегкие корабли§! и §Yлегкие крейсеры§!."
 sp_air_generic_reward_air_xp_3:0 "Ветер перемен"
 HNC:0 "Хунань"
 sp_land_reward_option_land_cruiser_track_reinforce_track:0 "Усилить гусеницы."
 cat_ship_heavy_battery:0 "Тяжелые батареи"
 mega_gun_emplacement:0 "Многозарядное крупнокалиберное орудие"
 mega_gun_emplacement_desc:0 "Эта крупнокалиберное орудие, работающее по принципу многозарядной силовой установки, обладает беспрецедентной дальностью обстрела. Используя ряд подземных туннелей, оно разгоняет снаряды до сверхзвуковой скорости, прежде чем запустить их по отдаленным целям."
 lc_heavy_naval_guns:0 "Тяжелые корабельные орудия"
 lc_heavy_naval_guns_desc:0 "Стандартное основное вооружение для крупной бронетехники. Эти мощные флотские орудия приспособлены для прямых столкновений, они бьют с ужасающей эффективностью как по бронированным, так и по укрепленным целям."
 tank_heavy_fixed_superstructure_turret:0 "Тяжелая фиксированная надстройка"
 tank_heavy_fixed_superstructure_turret_desc:0 "Фиксированная надстройка сильно ограничивает угол поворота главного орудия, но позволяет установить орудие более крупного калибра на относительно небольшую боевую машину, что делает эту машину идеально подходящей для засад."
 GRAND_DOCTRINE_BENEFIT_DESCRIPTION:0 "§gНазначьте главную доктрину, чтобы получить доступ к ряду §Hвторостепенных доктрин§!. Развивайте второстепенные доктрины, зарабатывая очки £doctrine_mastery §Hосвоения§!, когда ваши отряды сражаются. Завершайте второстепенные доктрины, чтобы достигать §Hрубежей§! и развивать главную доктрину.§!"
 SUBDOCTRINE_FIELD_ENGINEERING_DESC:0 "Основная задача военных инженеров — наводить мосты и устанавливать мины, а также уничтожать вражеские переправы и заграждения. Если мы обеспечим им надлежащее снаряжение и подготовку, чтобы избежать лишних потерь, победа будет за нами."
 water_deep_ocean:0 "Глубокие океаны"
 water_deep_ocean_desc:0 ""
 aerial_hangars:0 "Воздушные ангары"
 aerial_hangars_desc:0 "Оснастив материнский самолет ангарами, мы сможем размещать на его верхней части еще больше истребителей малого размера и тем самым повысим нашу боевую мощь и дальность проведения воздушных операций."
 sp_modern_battleship_eq_bonus_anti_air:0 "Современный линкор — современные зенитные орудия"
 sp_air_bouncing_bomb_aircraft_modifications_reward:0 "Модернизация самолетов"
 sp_air_bouncing_bomb_aircraft_modifications_reward_desc:0 "Во время последних испытаний мы наконец установили, как именно следует доработать фюзеляж, чтобы правильно закрепить механизм сброса."
 shbb_tech:0 "Модели сверхтяжелых линкоров"
 tank_light_one_man_tank_turret:0 "Одноместное орудие"
 tank_light_one_man_tank_turret_desc:0 "Маленькая башня, еле вмещающая одного члена экипажа, в задачи которого входят наведение и заряжание главного орудия, а также обнаружение целей и угроз."
 armored_maintenance:0 "Бронетанковая ремонтная рота"
 armored_maintenance_desc:0 "Эти подразделения располагают специализированной техникой, предназначенной для эвакуации и ремонта поврежденных танков и другой бронетехники."
 cat_grand_battle_plan:0 "Доктрина крупномасштабного планирования"
 sp_modern_carrier_eq_bonus_anti_air:0 "Современный авианосец — современная ПВО"
 ship_hull_carrier_3:0 "Модернизированный авианосец"
 ship_hull_carrier_3_desc:0 "Общее улучшение конструкции и специализированные разработки, наподобие бортовых подъемников, повышают эффективность авианосцев."
 sp_air_mothership_aircraft:0 "Самолет-матка"
 sp_air_mothership_aircraft_desc:0 "Огромный самолет, который доставляет истребители в зону боевых действий и позволяет выполнять задания по сопровождению вглубь вражеской территории. Истинный повелитель небес."
 tank_medium_one_man_tank_turret:0 "Одноместное орудие"
 tank_medium_one_man_tank_turret_desc:0 "Маленькая башня, еле вмещающая одного члена экипажа, в задачи которого входят наведение и заряжание главного орудия, а также обнаружение целей и угроз."
 jet_fighter_equipment_2:0 "Реактивный истребитель II"
 jet_fighter_equipment_2_desc:0 "Стреловидное крыло и легкие материалы позволили нам еще больше увеличить скорость, а заодно и дальность действия истребителей."
 sp_land_reward_option_stronghold_network_collapse_02:0 "$sp_land_reward_option_stronghold_network_collapse_01$"
 sp_land_reward_option_stronghold_network_collapse_02_desc:0 "Тоннель под одним из основных бункеров неожиданно обрушился, в результате чего несколько рабочих оказались под завалами. Необходимо срочно спасти застрявших сотрудников, однако эта ситуация в любом случае скажется на ходе работ."
 tactic_relentless_assault:0 "Непрерывная атака"
 ship_hull_mega_carrier:0 "Авианосец-ледокол"
 ship_hull_mega_carrier_desc:0 "Гигантский авианосец, построенный из экспериментальных композитных материалов, содержащих лёд, — таких как пайкерит. На нем могут базироваться обычные самолеты, что увеличивает дальность полета нашей морской авиации."
 large_front_offensive:0 "Наступление на широком фронте"
 large_front_offensive_desc:0 "Используя или угрожая использовать тактику массированного боя на разных участках фронта, мы не позволим противнику сосредоточить все силы на сдерживании какого-либо одного наступления."
 sp_land_reward_option_land_cruiser_assembly_key:0 "Только при установке ключевых компонентов."
 sp_land_reward_option_stronghold_network_communication_system_overhaul_further_study:0 "Изучить этот вопрос более подробно"
 SUBDOCTRINE_ANTI_TANK_FRONT_DESC:0 "Единый подход к противотанковой обороне на всех уровнях тактического звена. Защита флангов своих прорывающихся войск и направление атак бронетехники противника в заранее спланированные зоны поражения."
 trench_warfare:0 "Позиционная война"
 trench_warfare_desc:0 "Лопата подчас является лучшим оружием пехоты. Бойцы знают, что окапываться надо на любой позиции, которую занял."
 sp_air_axial_jet_engine:0 "Осевой реактивный двигатель"
 sp_air_axial_jet_engine_desc:0 "Первые реактивные двигатели оказались неспособны эффективно сжимать воздух. Чтобы усилить тягу, можно попробовать разместить несколько компрессоров последовательно."
 SUBDOCTRINE_DEFENSIVE_POSTURES_DESC:0 "Сосредоточьтесь на оборонительной тактике, чтобы упорно удерживать позиции, тем самым нанося противнику урон и сдерживая его продвижение."
 AND:0 "и "
 super_heavy_tank_artillery_chassis:0 "Тяжелая САУ"
 super_heavy_tank_artillery_chassis_desc:0 "Гигантская боевая машина, способная нести самую тяжелую броню и самое крупнокалиберное орудие, но из-за этого медленная и ненадежная."
 category_nav_bomber:0 "Морские бомбардировщики"
 tactic_cc_defend:0 "Ближний бой: оборона"
 regimental_combat_teams:0 "Полковые боевые группы"
 regimental_combat_teams_desc:0 "Полковая боевая группа — пехотный полк, тесно интегрированный с такими отрядами поддержки, как артиллерия, танки и разведподразделения. Вместе они образуют небольшую самодостаточную боевую единицу, способную более гибко действовать в нападении."
 GRAND_DOCTRINE_CONVOY_RAIDING:0 "Заграждение морских путей"
 SUBDOCTRINE_FIGHTER_CENTRAL_FIELD:0 "Морская авиация"
 tactic_elastic_defense:0 "Гибкая оборона"
 night_bombing:0 "Ночная бомбардировка"
 night_bombing_desc:0 "Ночью вражеская оборона слабее, а наши бомбардировщики укрыты темнотой. Теперь мы можем круглосуточно атаковать противника. Покажем ему, какие мы упорные.\n\n"
 urban:0 "Город"
 urban_desc:0 ""
 sp_naval_midget_submarine:0 "Сверхмалая подводная лодка"
 sp_naval_midget_submarine_desc:0 "В нашем флоте есть незаполненная ниша. Закрыть ее мы планируем с помощью легкой, дешевой и универсальной подводной лодки, которая сможет выполнять множество задач — от диверсий в портах до нападений на конвои."
 hq_logistics:0 "Персонал логистики и обслуживания"
 hq_logistics_desc:0 "Перераспределяет припасы и топливо в армии, определяет приоритеты этого распределения."
 sp_land_reward_option_land_cruiser_assembly_bonus_name:0 "Точная сборка"
 sp_naval_aip_engine_preference_c:0 "Снизить расход топлива двигателей"
 CHI:0 "Китай"
 tactic_backhand_blow:0 "Удар в тыл"
 military_police_tech:0 "Технология «Военная полиция»"
 engine_tech_4_tt:0 "Открывает значения в 18 и выше для улучшения двигателя."
 operational_concentration:0 "Оперативная концентрация"
 operational_concentration_desc:0 "Залогом успеха любой боевой операции является обеспечение локального превосходства. Вместо того чтобы добиваться превосходства по всей линии фронта, вы ослабляете некоторые ее участки, чтобы сосредоточить войска там, где они нужны."
 cat_trade_interdiction:0 "Доктрина заграждения морских путей"
 sp_naval_ice_carrier_unique_reward_a:0 "Укрепление пайкеритового авианосца"
 sp_naval_ice_carrier_unique_reward_a_desc:0 "Мы потратили огромное количество времени на постройку этого гигантского авианосца и должны быть уверены, что он обладает лучшей защитой из возможных. Каков главный фактор опасности?"
 naval_artillery:0 "Корабельная артиллерия"
 tank_high_velocity_cannon_3:0 "Модернизированная скорострельная пушка"
 tank_high_velocity_cannon_3_desc:0 "Пушка, специально спроектированная для достижения высокой дульной скорости. При использовании специальных боеприпасов обладает отличными бронебойными характеристиками, но при этом страдает эффективность против слабобронированных целей."
 sp_air_bouncing_bomb_training_accidents_reward_option:0 "Очень досадно"
 sp_air_bouncing_bomb_backspin_mechanism_reward_option:0 "Отлично"
 mtgnavalsupportfolder:0 "Флотская поддержка"
 mtgnavalsupportfolder_desc:0 "Вооружение и специальное оборудование для кораблей. Исследуйте новые модули, чтобы модифицировать свои корабли."
 SUBDOCTRINE_NAVAL_STRIKE_TACTICS:0 "Высокоточное морское бомбометание"
 sp_naval_modern_carrier_preference_b_a:0 "Повысить скорость и устойчивость к погоде"
 large_front_operations:0 "Операции на широком фронте"
 large_front_operations_desc:0 "В операциях на широком фронте сосредоточены усилия множества боевых частей, находящихся далеко друг от друга. Это операционный, а не тактический уровень управления.\n\n"
 superior_firepower:0 "Превосходство огневой мощи"
 superior_firepower_desc:0 "Эта доктрина делает упор на забрасывание врага снарядами, а не пушечным мясом. Наши люди — на вес золота, а пули — нет.\n\n"
 lc_super_heavy_howitzer:0 "Сверхтяжелая гаубица"
 lc_super_heavy_howitzer_desc:0 "Массивная гаубица для уничтожения укреплений и городских оборонительных рубежей. Этот вариант стреляет фугасными снарядами, идеально подходящими для зачистки окопов и разрушения укрепленных построек."
 FNG:0 "Фэнтянь"
 SUBDOCTRINE_SCREEN_JEUNE_ECOLE:0 "Новая школа"
 light_armor:0 "Легкий танк"
 light_armor_desc:0 "Танки с легкой броней."
 water_fjords:0 "Фьорды и архипелаги"
 water_fjords_desc:0 ""
 SUBDOCTRINE_INFILTRATION_TACTICS:0 "Тактика внедрения"
 SUBDOCTRINE_SCREEN_HUNTER_KILLERS_DESC:0 "Вражеские подводные лодки — серьезная угроза нашей военной экономике, но мы знаем, как из жертвы стать охотником: нам помогут хорошо организованные и агрессивно действующие группы сопровождения, включающие эсминцы."
 motorbike_equipment_1:0 "Военный мотоцикл"
 mobile_defence:0 "Активная оборона"
 mobile_defence_desc:0 "Мобильные части могут оказать поддержку защитникам там, где враг планирует нанести удар."
 category_front_line:0 "Все фронтовые батальоны"
 SUBDOCTRINE_SCREEN_ANTI_AIRCRAFT_CRUISERS:0 "Крейсеры ПВО"
 tank_half_track_suspension:0 "Полугусеничный ход"
 tank_half_track_suspension_desc:0 "Гибрид колесной и гусеничной ходовой части. Спереди на машине установлена пара колес для руления, а задняя ось приводит в движение гусеницы, что повышает проходимость на пересеченной местности. Такая ходовая часть ограничена в грузоподъемности, но обходится дешевле, чем полностью гусеничная."
 sp_armored_lc_high_impact_obliterator_cannon_tech:0 "Мощная пушка «Уничтожитель»"
 sp_armored_lc_high_impact_obliterator_cannon_tech_desc:0 "$lc_high_impact_obliterator_cannon_desc$"
 carousel_bombing:0 "Карусельное бомбометание"
 carousel_bombing_desc:0 "Бомбардировщики чаще всего стараются поскорее сбросить все свои бомбы по прибытии в район цели и вернуться домой. Этот способ работает при площадном бомбометании, но когда нужно поразить небольшую цель, лучше задержаться над ней подольше и сбрасывать боезапас по частям, дабы обеспечить максимальную точность."
 formation_fighting:0 "Групповой бой"
 formation_fighting_desc:0 "Соблюдая правильный боевой порядок, наши пилоты смогут прикрыть мертвое пространство друг друга, что позволит лучше обнаруживать вражеские самолеты."
 sp_tag_guided_bomb:0 "Проекты управляемых бомб"
 para_tech:0 "Десантная технология"
 light_tank_destroyer_chassis:0 "Легкая ПТ-установка"
 light_tank_destroyer_chassis_desc:0 "Небольшая и компактная боевая машина с мощным орудием для уничтожения вражеской бронетехники."
 SUBDOCTRINE_AERIAL_RECONNAISSANCE:0 "Разведка с воздуха"
 recon:0 "Отряд конной разведки"
 recon_desc:0 "Отправив небольшой отряд на разведку перед тем как выдвинуть туда основную группу войск, мы получим информацию о количестве и расположении врагов."
 sp_land_generic_reward_armor_bonus_2:0 "Улучшения баллистической стойкости"
 SUBDOCTRINE_MASSED_CARRIER_FLEET_DESC:0 "Успех морских операций зависит, как и в сражениях на суше, от возможности сосредоточить как можно больше ударной мощи на одной критически важной точке. Разделение сил ведет к поражению."
 cat_air_engine:0 "Самолетные двигатели"
 experimental_rockets:0 "Экспериментальные ракеты"
 experimental_rockets_desc:0 "Усовершенствование ракет за счет увеличения радиуса их действия и повышения надежности ракет на жидком топливе улучшило наше понимание технологий и позволило создавать стартовые площадки для более современных моделей."
 sp_armored_lc_specialized_field_manuals_tech:0 "Специальные уставы"
 sp_armored_lc_specialized_field_manuals_tech_desc:0 "Для сухопутных крейсеров можно разработать специальные уставы, где будут описаны особый порядок работы и обслуживания, а также продвинутая тактика ведения боя. Это позволит экипажам более эффективно управлять этими гигантскими боевыми машинами."
 hq_air_liaison:0 "Передовой авиадиспетчер"
 hq_air_liaison_desc:0 "Группы диспетчеров и другие соединения организуют тесное сотрудничество между авиацией и поддерживаемыми наземными войсками."
 combat_unit_destruction:0 "Уничтожение боевых единиц"
 combat_unit_destruction_desc:0 "Обучив наших пилотов штурмовиков непрерывно атаковать одну и ту же цель, пока она не будет уничтожена, мы сможем гарантировать, что цель накроют после близкого промаха."
 tank_welded_armor:0 "Сварная броня"
 tank_welded_armor_desc:0 "Бронепластины привариваются к шасси. Этот процесс быстрее литья и при этом все равно обеспечивает хорошую защиту."
 depth_charges_advice_tt:0 "\nУстановка модуля §YГлубинная бомба§! на §Yлегкие корабли§! и §Yкрейсеры§! даст возможность атаковать вражеские §Yподводные лодки§!."
 category_regimental_support_battalions:0 "Полковые роты обеспечения"
 sp_tag_aircraft:0 "Проекты самолетов"
 GRE_mountain_training_effect:0 "Откроет доступ к §HПодготовке к войне в горах§!\n§HПехота\n    Горы§!\n      Защита: §G+5%§!\n      Скорость перемещения: §G+5%§!\n§HМорская пехота\n    Горы§!\n      Атака: §G+5%§!\n      Скорость перемещения: §G+10%§!\n§HГорно-стрелковые войска\n    Горы§!\n      Атака: §G+5%§!\n      Защита: §G+5%§!\n      Скорость перемещения: §G+10%§!\n§HВоздушный десант\n    Горы§!\n      Атака: §G+5%§!\n      Скорость перемещения: §G+10%§!\n"
 concentrated_fire_plans:0 "План концентрированного огня"
 concentrated_fire_plans_desc:0 "Синхронизировав огонь разных батарей, можно нанести противнику гораздо более серьезный урон.\n\n"
 cat_mass_assault:0 "Доктрина массированного штурма"
 mio_cat_tech_heavy_armor_and_modules:0 "Технологии тяжелой бронетехники"
 sp_rockets_ballistic_missile:0 "Баллистическая ракета"
 sp_rockets_ballistic_missile_desc:0 "Управляемая баллистическая ракета, способная нести боевой заряд на огромные расстояния с феноменальной скоростью и точностью."
 SUBDOCTRINE_FLYING_FORTRESSES:0 "Летающие крепости"
 SUBDOCTRINE_PEOPLES_WAR_DESC:0 "Воля народа к сопротивлению, мобилизованная и направляемая государством, гарантирует нашу окончательную победу над империализмом и контрреволюцией."
 sp_tag_bomb:0 "Проекты бомб"
 SUBDOCTRINE_FLEXIBLE_FIRE_SUPPORT_DESC:0 "Скорость и дальность действия наших ударных самолетов позволяют им как поддерживать сухопутные войска, так и атаковать вражеские суда на море."
 category_scout_plane:0 "Самолет-разведчик"
 SUBDOCTRINE_DOGFIGHTING_MASTERY:0 "Рыцари воздуха"
 sp_naval_torpedo_cruiser_unique_reward_a:0 "Второй шанс: торпедный крейсер"
 sp_naval_torpedo_cruiser_unique_reward_a_desc:0 "Возрождение концепции торпедных крейсеров вынуждает нас пересмотреть их роль в нашем флоте. Мы можем попытаться извлечь максимальную пользу из их торпедного вооружения либо повысить их эффективность в бою с эсминцами."
 high_level_bombing:0 "Бомбометание с больших высот"
 high_level_bombing_desc:0 "Проводя бомбометание с больших высот, мы можем избежать стычек с самолетами противника и огня ПВО. Это более безопасный метод, но он требует более высокой точности."
 sp_land_generic_reward_armor_bonus_3:0 "Улучшенные броневые сплавы"
 sp_land_reward_option_self_propelled_super_heavy_howitzer_focus_preference_balance:0 "$sp_land_reward_option_super_heavy_howitzer_focus_preference_balance$"
 SUBDOCTRINE_SCREEN_PATROL_BOATS:0 "Патрульные катера"
 sp_air_bouncing_bomb_completion_tt:0 "Открывает §Y$raid_type_dam_bombing_raid$§! и §Y$raid_type_lock_bombing_raid$§!"
 SP_UNLOCK_TECH_WITH_EXTRA_TECH:0 "В сочетании с технологией «$EXTRA_TECH|Y$» открывает технологию: $TECH|Y$."
 sp_land_generic_reward_engine_bonus_2:0 "Повышенная надежность двигателя"
 sp_land_reward_option_land_cruiser_ammunition_new:0 "Внедрить новую систему хранения"
 lc_super_heavy_railway_gun:0 "Сверхтяжелое железнодорожное орудие"
 lc_super_heavy_railway_gun_desc:0 "Это массивное орудие, изначально созданное для железнодорожных платформ, способно обстреливать цели с огромного расстояния, нанося невероятный урон."
 plane_modules_tech:0 "Самолетные модули"
 SUBDOCTRINE_CARRIER_BATTLEGROUPS_DESC:0 "Слава крейсеров постепенно уходит в прошлое. Еще немного — и авианосцы станут главным морским оружием современности. Именно авианосец должен быть основным элементом нашего флота."
 dispersed_industry_category:0 "Технологии «Рассредоточенная промышленность»"
 tactic_tw_chase:0 "Преследование"
 squeezebore_adaptor:0 "Конусный адаптер"
 squeezebore_adaptor_desc:0 "Специальный адаптер, надеваемый на дуло орудия, снижает его диаметр и обжимает снаряд, уменьшая его. Это значительно повышает дульную скорость снаряда и, следовательно, пробивную способность орудия, но требует особых снарядов, изготовленных из редких материалов."
 sp_naval_proximity_fuzes_unique_reward_a:0 "Точность или эффективность"
 sp_naval_proximity_fuzes_unique_reward_a_desc:0 "Дистанционные взрыватели значительно сокращают количество снарядов, необходимое для поражения вражеского самолета. Мы готовимся применять их в своей подвижной зенитной артиллерии, что позволит снизить объемы снабжения боеприпасами при сохранении эффективности."
 tank_heavy_cannon_3:0 "Усовершенствованное тяжелое орудие"
 tank_heavy_cannon_3_desc:0 "Орудие, стреляющее крупнокалиберными снарядами. Обладает исключительной бронебойностью и высоко эффективно против слабобронированных целей; недостатки — большой размер и высокая стоимость, невозможность установить на большинство видов техники, за исключением той, что разработана специально под это орудие."
 sp_armored_signal_tech:0 "Бронетанковая рота связи"
 sp_armored_signal_tech_desc:0 "Снабдив наши подразделения штабными машинами, мы сможем обеспечить безопасную и надежную связь на поле боя и координацию действий бронетанковой дивизии."
 SUBDOCTRINE_PEOPLES_WAR:0 "Народное ополчение"
 logistics_company:0 "Рота обеспечения"
 logistics_company_desc:0 "Занимается планированием, заказами и распределением ресурсов для дивизии."
 sp_land_reward_super_heavy_howitzer_focus_preference:0 "Приоритеты производства"
 sp_land_reward_super_heavy_howitzer_focus_preference_desc:0 "По мере технического развития мы должны принять важное решение: мы можем отдать приоритет быстрому производству и орудиям меньшего калибра или же мы можем инвестировать в более крупные и тяжелые орудия, пожертвовав эффективностью производства ради непревзойденной огневой мощи и разрушительного воздействия."
 unknown:0 "Неизвестн."
 unknown_desc:0 ""
 light_tank_destroyer_brigade:0 "Легкая ПТ-установка"
 light_tank_destroyer_brigade_desc:0 "Самоходные противотанковые установки представляют собой танки с крупнокалиберными орудиями, закрепленными в корпусе, а не в башне. Легкие ПТ-установки используют шасси легких танков, благодаря чему достаточно мобильны, но несут не слишком мощное вооружение по сравнению с более тяжелыми образцами."
 GRAND_DOCTRINE_SUPERIOR_FIREPOWER:0 "Превосходство огневой мощи"
 improved_large_airframe:0 "$large_plane_airframe_2$"
 improved_large_airframe_desc:0 "$large_plane_airframe_2_desc$"
 sp_naval_proximity_fuzes_preference_a:0 "Изменить объемы снабжения боеприпасами"
 dispersed_fighting:0 "Рассредоточенная атака"
 dispersed_fighting_desc:0 "Используя более рассредоточенный боевой порядок, мы можем охватить больший район тем же количеством самолетов."
 SUBDOCTRINE_RAPID_DOMINATION_DESC:0 "Установление полного превосходства над противником делает его дальнейшее сопротивление физически и психологически невозможным."
 super_heavy_railway_gun:0 "$super_heavy_railway_gun_equipment$"
 super_heavy_railway_gun_desc:0 "$super_heavy_railway_gun_equipment_desc$"
 keypoint_bombing:0 "Бомбардировка ключевых целей"
 keypoint_bombing_desc:0 "Точная бомбардировка по ключевым целям на поле боя здорово поможет нашим сухопутным войскам одержать верх."
 wolfpacks:0 "«Волчьи стаи»"
 wolfpacks_desc:0 "Теперь, когда наши подводные лодки объединены в «стаи», они гораздо лучше координируют действия. Обнаружив противника, подлодка ждет прибытия остальных. Нападают они лишь тогда, когда шансы на победу — в нашу пользу."
 flamethrower:0 "Огнемет"
 flamethrower_desc:0 "Устройство для выплескивания струи горящей жидкости. Очень полезно в городских боях и против укреплений, но неэффективно против брони и требует отдельной специально обученной команды."
 SUBDOCTRINE_GREAT_WAR_INFANTRY:0 "Пехота Великой войны"
 submarine_doctrine:0 "Доктрины действий подводных лодок"
 sp_naval_generic_reward_artillery_tech_1:0 "Наработки в области корабельной артиллерии"
 DOCTRINE_TRACK_SUBMARINES:0 "Подводные лодки"
 sp_land_generic_reward_artillery_bonus_2:0 "Новые системы снижения отдачи"
 specialization_air:0 "Аэродинамика и авионика"
 cv_small_plane_airframe_3:0 "Усовершенствованный корпус палубного самолета"
 cv_small_plane_airframe_3_desc:0 "Строгие требования к палубным самолетам ограничивают размеры и возможности их корпуса. Этот корпус представляет собой наилучшую модель для самолетов с механическим двигателем."
 lc_high_velocity_cannon_turret:0 "Спаренная скорострельная пушка"
 lc_high_velocity_cannon_turret_desc:0 "Башня со скорострельным орудием для обстрела вражеской бронетехники. Небольшой размер позволяет обеспечивать быструю огневую поддержку против легкобронированных целей."
 SUBDOCTRINE_SUBMARINE_COASTAL_DEFENSE:0 "Оборона побережья"
 rangers_support:0 "Рейнджеры-разведчики"
 rangers_support_desc:0 "Рейнджеры-разведчики — элитные войска, специализирующиеся на проникновении на территорию врага, разведке и ближнем бое."
 tactic_gas_projector_tear:0 "Газометный обстрел слезоточивым газом"
 aluminium_desc:0 "Алюминий незаменим в производстве особых видов техники и самолетов."
 sp_naval_midget_submarine_free_design:0 "Сверхмалая подводная лодка"
 overwhelming_firepower:0 "Огонь на подавление"
 overwhelming_firepower_desc:0 "Использовав все доступные отряды поддержки, вы можете подавить цель огнем или, что еще лучше, сорвать планы врага."
 sp_naval_generic_reward_major_progress_1:0 "Крупный прорыв!"
 trait_engineer:0 "Инженер"
 trait_engineer_desc:0 "§LМастер по форсированию рек и строительству полевых укреплений.§!"
 asw_tech:0 "Технология противолодочной обороны"
 sp_naval_midget_submarine_preference_a:0 "Повысить незаметность"
 sp_naval_nuclear_submarine_free_design:0 "Атомная подлодка"
 sp_naval_nuclear_missile_submarine_preference_a:0 "Нужно залечь на дно"
 sp_naval_anechoic_tiles_preference_b:0 "Повысить бесшумность"
 electronics_folder:0 "Машиностроение"
 electronics_folder_desc:0 "Машиностроение, радары, шифрование и разработка новейших технологий."
 ZHE:0 "Чжэцзян"
 sp_land_reward_option_stronghold_network_leadership_approach_office_planning:0 "Заняться планированием"
 SUBDOCTRINE_NAVAL_TORPEDO_TACTICS:0 "Тактика роя торпед"
 KHM:0 "Тунганистан"
 day_bombing:0 "Дневные бомбардировки"
 day_bombing_desc:0 "Масштабные бомбардировки в светлое время суток чреваты большими потерями из-за заметности самолетов. Зато мы можем показать противнику свою мощь.\n\n"
 sp_air_generic_reward_major_progress_1:0 "Взлет проекта"
 sup_mechanized_offensive:0 "Механизированное наступление"
 sup_mechanized_offensive_desc:0 "Моторизированная пехота всем хороша, но возглавлять наступление должна пехота, которая перемещается на бронетранспортерах, оснащенных тяжелым вооружением."
 cat_mobile_warfare:0 "Доктрина маневренной войны"
 sp_rocket_submarine_eq_bonus_range_increase:0 "Ракетная подлодка — увеличенная дальность действия"
 mio_cat_eq_all_large_plane:0 "Все большие самолеты"
 GRAND_DOCTRINE_GRAND_BATTLEPLAN:0 "Большой план операции"
 base_strike_main:0 "Доктрина удара по базам"
 air_superiority:0 "Превосходство в воздухе"
 air_superiority_desc:0 "Обеспечив превосходство в воздухе, мы усложним задачу вражеских бомбардировщиков и сможем эффективно использовать свои."
 category_tanks:0 "Танки"
 cv_small_plane_airframe_4:0 "Корпус современного палубного самолета"
 cv_small_plane_airframe_4_desc:0 "Этот корпус был разработан, чтобы сполна воспользоваться преимуществами реактивных двигателей и принести их в морскую авиацию."
 sp_naval_underway_replenishment:0 "Пополнение на ходу"
 sp_naval_underway_replenishment_desc:0 "Главный фактор, ограничивающий действия флота, — это проблема снабжения кораблей вдали от порта приписки. Поскольку наши флотилии действуют на предельных расстояниях, необходимо разработать метод подвоза припасов для них."
 mio_cat_tech_all_motorized_mechanized:0 "Все технологии моторизованной пехоты и бронетранспортеров"
 SUBDOCTRINE_SUBMARINE_WOLFPACKS_DESC:0 "Охота — раздельно, удары — совместно. Наши подводные лодки будут рассредотачиваться и прочесывать океан; как только одна из них обнаружит добычу, она подаст сигнал остальным, и те соберутся в стаю, чтобы нанести удар."
 lc_stabilizers:0 "Стабилизаторы"
 lc_stabilizers_desc:0 "Механические устройства, снижающие отдачу и поддерживающие наведение орудия при стрельбе. Помогают быстрее навестись на цель и повышают точность стрельбы на коротких остановках."
 massed_strikes:0 "Массированные удары"
 massed_strikes_desc:0 "Пилоты, обученные совершать вылеты с авианосцев, позволяют нормально функционировать даже перегруженному авианосцу — они давят противника числом и очень эффективно действуют в морских сражениях. Авианосец должен работать как часы, где каждый механизм четко выполняет свою роль."
 SUBDOCTRINE_SCREEN_TORPEDO_PRIMACY_DESC:0 "Агрессивные и дерзкие торпедные атаки с участием эсминцев прикрытия способны ослабить вражеские боевые порядки еще до начала основного сражения."
 category_line_artillery:0 "Линейная артиллерия"
 mobile_infantry:0 "Моторизированная пехота"
 mobile_infantry_desc:0 "Обычная пехота подчас слишком медлительна, чтобы не отставать от быстрой бронетехники, реагировать на ее действия или отступать от нее. Проблему решает моторизированная или механизированная пехота, идущая в ногу с темпами современной войны.\n\n"
 EQUIPMENT_DESIGNER_SAVE:0 "Сохранить £$XPICON$ $XPCOST|Y0$"
 sp_super_heavy_battleship_eq_bonus_anti_torpedo:0 "Сверхтяжелый линкор — улучшенные противоторпедные меры"
 category_mobile_and_mobile_combat_sup:0 "Подвижные батальоны и боевая поддержка"
 tactic_human_wave_tactics:0 "Массированная атака"
 heavy_tank_chassis_3:0 "Усовершенствованный тяжелый танк"
 sp_land_generic_reward_test_failure_3:0 "Незначительный сбой во время испытания"
 tactic_gas_masks_retreat:0 "Отступление в противогазах"
 undersea_blockade_bs:0 "Подводная блокада"
 undersea_blockade_bs_desc:0 "Подводные лодки — идеальное средство, позволяющее прервать поставки важного сырья противнику. Мы уничтожим всю промышленность и возьмем его измором."
 scientist_trait_bright:0 "Талантливый"
 scientist_trait_bright_desc:0 "Ученый с острым умом, отлично схватывающий новые концепции и эффективно применяющий их."
 sp_naval_nuclear_submarine_preference_c:0 "Обеспечить наивысшее качество"
 medium_plane_airframe_2:0 "Улучшенный корпус среднего самолета"
 medium_plane_airframe_2_desc:0 "Благодаря преимуществам современных производственных технологий этот корпус позволяет самолету перевозить существенно больший груз на еще более дальние расстояния."
 super_heavy_sp_artillery_brigade:0 "Сверхтяжелая САУ"
 air_doctrine:0 "Воздушная доктрина"
 mio_cat_eq_all_tank_destroyers:0 "Все моторизованные установки ПТО"
 empty_space_tt:0 " \n"
 XKC:0 "Чуаньбянь"
 sp_land_reward_option_land_cruiser_communication_current:0 "Оставить текущую систему."
 vast_offensives:0 "Обширное наступление"
 vast_offensives_desc:0 "Если вам удалось осуществить прорыв, его следует использовать как можно активнее. Обширное наступление вглубь территории противника усложнит его задачу по удержанию линии фронта либо сделает ее невыполнимой."
 PRC:0 "Китай"
 ground_support_integration:0 "Интеграция наземной поддержки"
 ground_support_integration_desc:0 "Полная интеграция наших тактических бомбардировщиков с наземными наблюдателями повышает их точность и позволяет напрямую поддерживать наши сухопутные силы в бою."
 scientist_trait_fast_learner:0 "Легкообучаемый"
 scientist_trait_fast_learner_desc:0 "Быстро приспосабливается к новым испытаниям, учится быстрее других и достигает больших успехов в разных научных отраслях."
 human_wave_offensive:0 "Массированный бой"
 human_wave_offensive_desc:0 "Массированный бой — тактика пехотных войск, в ходе которой атакующие части ведут прямое наступление на вражескую линию обороны плотно сосредоточенными отрядами пехоты, чтобы смять ее и вступить в рукопашный бой."
 nuclear_missile_submarine:0 "Подлодка с ядерными ракетами"
 nuclear_missile_submarine_desc:0 "Подводные лодки, способные иметь на вооружении ядерные ракеты и запускать их по нашим целям. Они могут нести смерть и уничтожать целые города — и никто даже не успеет понять, что произошло."
 sp_artillery_purpose_built_gun_motor_carriages_tech:0 "Самоходные артиллерийские установки специального назначения"
 sp_artillery_purpose_built_gun_motor_carriages_tech_desc:0 "Специализированные транспортные средства, предназначенные для транспортировки и поддержки сверхтяжелых гаубиц, обеспечивающие мобильность и простоту развертывания на поле боя."
 SUBDOCTRINE_AERIAL_RECONNAISSANCE_DESC:0 "Военная авиация изначально создавалась именно для ведения разведки. Знание, где находятся силы противника и как он собирается их применить, во все времена было сильнее любого оружия."
 tank_petrol_electric_engine:0 "Бензиново-электрический двигатель"
 tank_petrol_electric_engine_desc:0 "Комбинация бензинового двигателя и электродвигателя, получающего от него энергию. Такой мотор сложен, дорог и ненадежен, но превосходит любые другие по производительности в тактических маневрах."
 sp_naval_nuclear_submarine_unique_reward_a:0 "Чрезмерная стоимость"
 sp_naval_nuclear_submarine_unique_reward_a_desc:0 "Поскольку мы разрабатываем совершенно новый тип подводных лодок, инженеры опасаются, что в конечном итоге стоимость их производства будет слишком высокой. Как нам лучше подойти к проектированию?"
 fort:0 "Укрепление"
 ca_tech:0 "Модели крейсеров"
 sp_armored_lc_transmission_improvements_tech:0 "Улучшения трансмиссии"
 sp_armored_lc_transmission_improvements_tech_desc:0 "Оптимизация передаточных чисел, механизмов сцепления и гидротрансформаторов позволяет создавать более эффективные трансмиссии, способные не только выдерживать колоссальный вес сухопутных крейсеров, но и повышать их мобильность и надежность."
 TITLE_BATTLEFIELD_SUPPORT:0 "Боевая поддержка с воздуха"
 TITLE_OPERATIONAL_INTEGRITY:0 "Оперативное взаимодействие"
 jet_engine_1x:0 "1 реактивный двигатель"
 jet_engine_1x_desc:0 "Благодаря совершенно иному подходу к самолетостроению этот сложный и капризный двигатель все же существенно увеличивает тягу и скорость летательных аппаратов."
 hq_naval_liaison:0 "Флотский связной"
 hq_naval_liaison_desc:0 "Обеспечивает сотрудничество армии и флота во время десантных операций."
 rubber_desc:0 "Резина необходима для производства большинства видов техники."
 sp_land_reward_option_land_cruiser_chassis_redesign_bonus_name:0 "Переработанное шасси"
 medium_plane_scout_plane_airframe:0 "$scout_plane_equipment$"
 medium_plane_scout_plane_airframe_desc:0 "$medium_plane_airframe_desc$"
 heavy_tank_aa_chassis:0 "Тяжелая ЗСУ"
 heavy_tank_aa_chassis_desc:0 "Большая боевая машина с зенитным орудием для обороны от вражеской авиации."
 sp_naval_modern_carrier_preference_c_a:0 "Сдерживание легких кораблей"
 SUBDOCTRINE_THEATER_INTERDICTION:0 "Заграждение ТВД"
 peoples_army:0 "Народная армия"
 peoples_army_desc:0 "Концепция народной армии предполагает превосходство человека над оружием, а мощной мотивации — над слабой технологией. Она пользуется широкой поддержкой у населения.\n\n"
 DOCTRINE_TRACK_OPERATIONS:0 "Операции"
 elastic_defence:0 "Гибкая оборона"
 elastic_defence_desc:0 "Гибкая оборона не концентрирует все силы на линии фронта, а создает более «глубокий» слой обороны. Он дает защитникам время отреагировать и пойти в контрнаступление, пока атакующие рассредоточены, а их продвижение замедлилось."
 tank_radio_3:0 "Модернизированная радиостанция"
 tank_radio_3_desc:0 "Эта радиостанция отличается усиленным передатчиком и улучшенным приемом; она позволяет держать связь на расстоянии в десятки километров, несмотря на вражеские глушилки."
 sp_land_generic_reward_artillery_tech_2:0 "$sp_land_generic_reward_armor_tech_2$"
 trade_interdiction:0 "Заграждение морских путей"
 trade_interdiction_desc:0 "Чем раньше мы обнаружим вражеские суда, тем быстрее сможем их уничтожить. Мы уничтожим корабли и скроемся прежде, чем противник успеет отреагировать.\n\n"
 tank_wheeled_suspension:0 "Колесный ход"
 tank_wheeled_suspension_desc:0 "Эта ходовая часть, созданная на основании шасси грузовика, сильно ограничена в грузоподъемности и слабо пригодна для езды по пересеченной местности, зато очень дешева в производстве."
 integrated_convoy_defence:0 "Интегрированная оборона конвоев"
 integrated_convoy_defence_desc:0 "Более тесная координация усилий авиации и флота позволяет нам атаковать врагов задолго до того, как они приблизятся к нашим торговым судам. Это резко повышает эффективность кораблей сопровождения."
 GER_propose_joint_military_exercises:0 "Совместные военные учения"
 GER_propose_joint_military_exercises_desc:0 "Двойстенный альянс — основа нашей безопасности. Чтобы обеспечить нашим армиям возможность сражаться как единая, сплочённая сила, мы должны координировать наши доктрины через проведение совместных учений. Делясь нашими \nновейшими военными исследованиями, мы гарантируем технологическое превосходство Центральных Держав."
 signal_company_tech:0 "Технология «Рота связи»"
 night_vision:0 "Приборы ночного видения I"
 night_vision_desc:0 "Возможность видеть врага, оставаясь при этом незамеченными, — залог успеха ночной операции. С появлением инфракрасных датчиков мы можем укомплектовать нашу армию устройствами, которые делают это возможным (пусть и громоздкими)."
 sp_land_stronghold_network_collapse_workers_drafted:0 "Срочный набор рабочих"
 sp_land_stronghold_network_collapse_workers_drafted_desc:0 "Большое количество рабочих перенаправлено на спасательные операции и работы по восстановлению, что заметно замедляет обычное строительство, ремонт и добычу ресурсов."
 SUBDOCTRINE_SUBMARINE_COASTAL_MINELAYING_DESC:0 "Подводные лодки — скрытные и проворные корабли, превосходно подходящие для минирования морских путей и ограничения вражеского судоходства."
 GRAND_DOCTRINE_BATTLEFIELD_SUPPORT_DESC:0 "Техники взаимодействия наземных и военно-воздушных сил, а также обучение таковым. Авиаудары выступают в качестве «воздушной артиллерии» и прокладывают путь стремительно продвигающимся наземным войскам."
 ship_armor_ice_carrier_deck_1:0 "Укрепление ВПП из пайкерита"
 ship_armor_ice_carrier_deck_1_desc:0 "Дополнительное укрепление, повышающее прочность конструкции, а также ее устойчивость к погодным условиям."
 mio_cat_eq_all_carrier:0 "Все авианосцы"
 QZC:0 "Цюнъя"
 kampfgruppe:0 "Боевые группы"
 kampfgruppe_desc:0 "Боевая группа — специальное формирование, созданное для выполнения особой задачи."
 jet_strat_bomber_equipment:0 "Реактивный стратегический бомбардировщик"
 jet_strat_bomber_equipment_desc:0 "Стратегические бомбардировщики атакуют сооружения и инфраструктуру противника, уничтожая промышленность."
 tank_anti_air_cannon_3:0 "Модернизированное зенитное орудие"
 tank_anti_air_cannon_3_desc:0 "Скорострельное автоматическое орудие для борьбы с самолетами. Обладает ограниченной возможностью применения к наземным целям для поддержки огнем."
 low_echelon_support:0 "Эшелонированная огневая поддержка"
 low_echelon_support_desc:0 "Прикрепляя штурмовиков напрямую к небольшим группам сухопутных войск, мы обеспечим их постоянным прикрытием с воздуха даже вне зоны действия артиллерии."
 super_heavy_tank_destroyer_brigade:0 "Сверхтяжелая ПТ-установка"
 super_heavy_tank_destroyer_brigade_desc:0 "Шасси сверхтяжелого танка с крупнокалиберным орудием, закрепленным в корпусе вместо башни."
 JLN:0 "Гирин"
 sp_naval_fleet_submarine_free_design:0 "Эскадренная подводная лодка"
 rocket_artillery_brigade:0 "Ракетная артиллерия"
 rocket_artillery_brigade_desc:0 ""
 GRAND_DOCTRINE_SUPERIOR_FIREPOWER_DESC:0 "Воюйте снарядами, а не людьми. Используйте превосходящую огневую мощь, чтобы нанести сокрушительный удар по врагу и помочь маневренным подразделениям продвинуться вперед и захватить территорию противника."
 sp_naval_proximity_fuzes_preference_b:0 "Сохранить текущие объемы снабжения боеприпасами"
 sp_land_generic_reward_critical_failure:0 "Полный провал"
 human_infantry_offensive:0 "Пехотное наступление"
 human_infantry_offensive_desc:0 "Наступательный дух пехоты — ключевой фактор, решающий исход боя. Наши бойцы должны вести всех за собой."
 SUBDOCTRINE_DEEP_AIR_RAIDS_DESC:0 "Хорошо подготовленные пилоты за штурвалом подходящей техники смогут поражать цели даже в самой глубине вражеской территории. Пусть противник знает, что ему негде будет укрыться от наших бомб."
 sp_naval_modern_battleship:0 "Современный линкор"
 sp_naval_modern_battleship_desc:0 "Некоторые считают, что судьбу морских сражений будут решать авианосцы. Мы намерены убедить их в обратном."
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_scientist:0 "Попытаться спасти старшего ученого."
 sp_armored_lc_weapon_fire_control_tech:0 "Система управления огнем"
 sp_armored_lc_weapon_fire_control_tech_desc:0 "Внедрение продвинутой оптики, дальномеров и гиростабилизаторов позволит повысить точность и координацию стрельбы, благодаря чему экипажи смогут эффективнее поражать цели, несмотря на мощную отдачу и неповоротливость орудий."
 sp_land_generic_reward_army_xp_3:0 "Адаптированная полевая тактика"
 tactic_hold_bridge:0 "Удерживать мост"
 sp_land_reward_land_cruiser_suspension:0 "Гидропневматическая подвеска"
 sp_land_reward_land_cruiser_suspension_desc:0 "Инженеры завершили работу над передовой гидропневматической системой подвески для проекта «[SpecialProject.GetName]». Она способна выдерживать колоссальный вес машины, при этом обеспечивая ее устойчивость и снижая нагрузку на гусеницы даже при движении по пересеченной местности. [Character.GetName] считает, что эту систему уже можно внедрять в конструкцию танка, чтобы повысить его эффективность на поле боя."
 sp_super_heavy_battleship_eq_bonus_armor:0 "Сверхтяжелый линкор — более прочный корпус и броня"
 sp_naval_generic_reward_major_progress_3:0 "Невероятный прогресс!"
 fleet_in_being_tree:0 "Доктрины воздействия флотом"
 grand_mechanized_offensive:0 "Механизированное наступление"
 grand_mechanized_offensive_desc:0 "Моторизированная пехота всем хороша, но возглавлять наступление должна пехота, которая перемещается на бронетранспортерах, оснащенных тяжелым вооружением.\n\n"
 concentrated_industry_category:0 "Технологии «Концентрированная промышленность»"
 sp_naval_generic_reward_armor_tech_3:0 "Глубокое понимание брони будущего"
 specialization_naval:0 "Военно-морская техника"
 CAM:0 "Камбоджа"
 rocket_interceptor_equipment:0 "Реактивный перехватчик"
 rocket_interceptor_equipment_desc:0 "Перехватчик малой дальности, использующий химический ракетный двигатель."
 jet_engine_2x:0 "2 реактивных двигателя"
 jet_engine_2x_desc:0 "$engine_1_2x_desc$"
 SUBDOCTRINE_CARRIER_AIRFIELDS_DESC:0 "Самая дорогая собственность на планете — это палуба авианосца. На то, чтобы заполнить ее мощной авиацией, не следует жалеть никаких сил и средств."
 light_sp_artillery_brigade:0 "Легкая САУ"
 lc_heavy_anti_air_battery:0 "Тяжелая батарея ЗСУ"
 lc_heavy_anti_air_battery_desc:0 "Зенитная батарея с крупнокалиберными орудиями для обстрела скоростных и высотных самолетов. Обеспечивает своеобразный защитный «пузырь»."
 subsidiary_carrier_role:0 "Вспомогательная роль авианосцев"
 subsidiary_carrier_role_desc:0 "Авианосцы оказывают поддержку линкорам, повышая их скорость переключения с обороны на наступление. Авианосец, совмещающий функции разведчика и мощной ударной группы, отлично дополняет более медлительные линкоры."
 cv_fighter_equipment_0:0 "Межвоенный палубный истребитель"
 cv_fighter_equipment_0_desc:0 "Ранний истребитель, модифицированный для взлета с и посадки на авианосец."
 air_skirmish:0 "Воздушная схватка"
 air_skirmish_desc:0 "К сожалению, нам не всегда удается сбить все вражеские самолеты в нашем небе, но мы можем выматывать их с самого обнаружения до того момента, когда они покинут нашу территорию."
 category_vehicle_infantry:0 "Моторизированная и механизированная пехота"
 sp_land_generic_reward_artillery_tech_1:0 "$sp_land_generic_reward_armor_tech_1$"
 tank_auto_cannon_2:0 "Улучшенное автоматическое орудие"
 tank_auto_cannon_2_desc:0 "Это орудие, сделанное по образцу скорострельной зенитной пушки, способно буквально уничтожать слабобронированные цели чередой снарядов. Небольшой калибр не снижает бронебойность."
 urban_assault_specialist:0 "Мастер городского боя"
 urban_assault_specialist_desc:0 "§LСпециалист по схваткам в домах и на улицах.§!"
 cv_small_plane_airframe_0:0 "Корпус палубного самолета межвоенных лет"
 cv_small_plane_airframe_0_desc:0 "Этот оснащенный тормозным крюком и усиленным шасси корпус позволяет создавать самолеты, способные действовать с палубы авианосца."
 infantry_offensive:0 "Пехотное наступление"
 infantry_offensive_desc:0 "Наступательный дух пехоты — ключевой фактор, решающий исход боя. Наши бойцы должны вести всех за собой.\n\n"
 tank_heavy_two_man_tank_turret:0 "Двухместное орудие"
 tank_heavy_two_man_tank_turret_desc:0 "Башня, в которой могут разместиться два члена экипажа, делящие между собой задачи по управлению орудием и наблюдению за обстановкой. Даже такая башня не дает эффективно распределить усилия между членами экипажа."
 ballast_tanks_inoperable:0 "Балластные цистерны выведены из строя"
 integrated_convoy_defence_bs:0 "Интегрированная оборона конвоев"
 integrated_convoy_defence_bs_desc:0 "Более тесная координация усилий авиации и флота позволяет нам атаковать врагов задолго до того, как они приблизятся к нашим торговым судам. Это резко повышает эффективность кораблей сопровождения."
 train_tech:0 "Поезда и железные дороги"
 schwerpunk:0 "Главный удар"
 schwerpunk_desc:0 "В любой операции следует определить точку главного удара, где нужно сосредоточить максимум сил и одержать там победу."
 cat_ship_light_battery:0 "Легкие батареи"
 sp_naval_aip_engine_unique_reward_a:0 "Параллельные разработки"
 sp_naval_aip_engine_unique_reward_a_desc:0 "Наши ученые, занятые разработкой новой технологии, поделились своими открытиями с коллегами, которые работают над улучшением обычных двигателей. Возможно, они смогут извлечь из этих знаний какую-то пользу."
 tactic_sf_fortify:0 "Заблаговременная оборона"
 sp_naval_super_heavy_battleship_preference_b_b:0 "Усилить зенитные орудия"
 small_plane_naval_bomber_airframe:0 "$nav_bomber_equipment$"
 small_plane_naval_bomber_airframe_desc:0 "$small_plane_airframe_desc$"
 helicopter_equipment:0 "Вертолет"
 helicopter_equipment_desc:0 "Летательный аппарат, который использует не крылья, а быстро вращающиеся винты. Он может зависать на месте и легко меняет высоту полёта."
 air_base:0 "Авиабаза"
 air_base_desc:0 "Это сооружение позволяет размещать в регионе ваши военно-воздушные силы."
 excavation_tech:0 "Технологии добычи ресурсов"
 sp_land_reward_land_cruiser_track:0 "Перегрузка гусениц"
 sp_land_reward_land_cruiser_track_desc:0 "Гусеницы явно не выдерживают вес машины, что приводит к постоянным поломкам во время испытаний проекта «[SpecialProject.GetName]». Мы можем укрепить гусеницы, что потребует их значительной доработки, или уменьшить бронирование танка, чтобы снизить нагрузку."
 sp_land_generic_reward_option_resource_scarcity_desc:0 "[Character.GetName] и его команда разработчиков столкнулись с нехваткой дефицитных материалов для работы над проектом «[SpecialProject.GetName]». Из-за этого им пришлось найти альтернативные источники и разработать новые технологии производства."
 SUBDOCTRINE_MASSED_CARRIER_FLEET:0 "Сосредоточенный флот авианосцев"
 land_cruiser_chassis_1:0 "Шасси сухопутного крейсера"
 marsh:0 "Болото"
 marsh_desc:0 ""
 medium_air:0 "Средняя авиация"
 logistical_bombing:0 "Удар по инфраструктуре"
 logistical_bombing_desc:0 "Больший упор на воздушные удары по вражеским путям снабжения обеспечит преимуществом наши сухопутные войска в этом регионе."
 sp_naval_rocket_launching_submarine_preference_a:0 "Сосредоточиться на дальности"
 heavy_armor:0 "Тяжелый танк"
 heavy_armor_desc:0 "Самые прочные танки с толстой броней и мощными орудиями, но медленные и негибкие в плане тактики."
 amphibious_drive:0 "Устройство для плавания"
 amphibious_drive_desc:0 "Набор устройств для плавания и небольшой винт позволяют этому танку двигаться по воде, высаживаясь с корабля на берег или пересекая реку."
 tank_medium_howitzer:0 "Средняя гаубица"
 tank_medium_howitzer_desc:0 "Средняя полевая гаубица, предназначенная для установки в машину. Ее основное предназначение — непрямой огонь по слабобронированным целям, но при необходимости гаубица может применяться и для стрельбы прямой наводкой. Снабжается ограниченным количеством бронебойных снарядов и слабо применима для борьбы с танками."
 combined_arms:0 "Взаимодействие родов войск"
 combined_arms_desc:0 "Бронетехника, пехота и отряды обеспечения, работающие сообща в хорошо организованных группах, гораздо эффективнее, чем поодиночке."
 sp_naval_generic_reward_option_armor_tech_bonus_name:0 "Исследование экспериментальной корабельной брони"
 self_propelled_super_heavy_artillery:0 "Самоходная сверхтяжелая артиллерия"
 self_propelled_super_heavy_artillery_desc:0 "Гаубицы огромного калибра на самодвижущемся шасси. Сочетание невероятной огневой мощи и увеличенной подвижности позволяет наносить мощнейшие удары по вражеской обороне."
 sp_air_bouncing_bomb_aircraft_modifications_reward_option:0 "Главное, что все получилось"
 jet_engine_6x:0 "6 реактивных двигателей"
 jet_engine_6x_desc:0 "$engine_1_6x_desc$"
 medium_tank_chassis:0 "Средний танк"
 medium_tank_chassis_desc:0 "Сбалансированное шасси среднего размера. Отличается гибкостью применения, подходит для большого ассортимента боевых машин."
 tank_gasoline_engine:0 "Бензиновый двигатель"
 tank_gasoline_engine_desc:0 "Двигатель, работающий на бензине, будет быстрее при равном объеме, но сам бензин при этом сильнее подвержен возгоранию."
 specialization_land:0 "Война на суше"
 SUBDOCTRINE_SUBMARINE_CAPITAL_HUNTERS:0 "Охотники на крупные корабли"
 sp_tag_nuclear_power:0 "Проекты ядерной энергетики"
 armor_tech_3_tt:0 "Открывает значения в 15 и выше для улучшения брони."
 tank_light_two_man_tank_turret:0 "Двухместное орудие"
 tank_light_two_man_tank_turret_desc:0 "Башня, в которой могут разместиться два члена экипажа, делящие между собой задачи по управлению орудием и наблюдению за обстановкой. Даже такая башня не дает эффективно распределить усилия между членами экипажа."
 TITLE_BASE_STRIKE:0 "Удар по базам"
 sp_land_generic_reward_engine_bonus_3:0 "Улучшенная работа двигателя"
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing:0 "Успешное огневое испытание"
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing_desc:0 "Только что успешно завершилось испытание орудия «[SpecialProject.GetName]». Во время стрельб оно показало впечатляющие дальность и точность ведения огня. Такой результат воодушевил весь научный коллектив, а также привлек внимание высокопоставленных чиновников. Проект набирает ход, а ученые теперь не сомневаются в его успешном завершении."
 air_offense:0 "Эскорты из истребителей"
 air_offense_desc:0 "Сделав упор на бомбардировки в дневное время, мы должны беречь наши бомбардировщики от вражеских перехватчиков. Пройдя обучение по совместной работе с бомбардировщиками, пилоты истребителей смогут эффективнее защищать их во вражеском воздушном пространстве."
 mio_cat_eq_only_tactical_bomber:0 "Легкий бомбардировщик"
 sp_land_reward_option_super_heavy_howitzer_focus_preference_firepower:0 "Акцент на огневую мощь"
 tactic_prepare_gas_attack:0 "Подготовка газа"
 sp_naval_generic_reward_test_failure_2:0 "Легкое затруднение!"
 sp_naval_generic_reward_scientist_xp_1:0 "Идеи захлестывают"
 tactic_urban_defense:0 "Оборона в городской застройке"
 light_air:0 "Легкая авиация"
 chromium_desc:0 "Хром — металл, использующийся при создании современных двигателей."
 SUBDOCTRINE_SCREEN_JEUNE_ECOLE_DESC:0 "В рамках этой доктрины — ответа устаревшим представлениям о морской войне как состязании калибров — упор делается на удары силами многочисленных малых кораблей, торпедные атаки и непрямую торговую войну."
 tank_anti_air_cannon:0 "Базовое зенитное орудие"
 tank_anti_air_cannon_desc:0 "Скорострельное автоматическое орудие для борьбы с самолетами. Обладает ограниченной возможностью применения к наземным целям для поддержки огнем."
 FIN:0 "Финляндия"
 SUBDOCTRINE_SCREEN_INTEGRATED_OPERATIONS_DESC:0 "Корабли прикрытия не могут похвастать той же огневой мощью, что и крупные корабли, но благодаря высокой скорости они могут быть полезны даже в тяжелом бою."
 sp_modern_battleship_eq_bonus_anti_torpedo:0 "Современный линкор — улучшенные противоторпедные меры"
 SUBDOCTRINE_SCREEN_TORPEDO_PRIMACY:0 "Торпедное превосходство"
 broken_propeller:0 "Поломка винта"
 hunt_and_destroy:0 "Поиск и уничтожение"
 hunt_and_destroy_desc:0 "Помимо непосредственной огневой поддержки, штурмовики могут самостоятельно отыскивать цели и зачастую проводить внезапные атаки по вражеским сухопутным войскам, приближающимся к линии фронта."
 RAA:0 "Рейхскомиссариат Австралазия"
 hunter_killer_groups:0 "Противолодочные группы"
 hunter_killer_groups_desc:0 "Противолодочные корабли объединяются в группы для охоты на вражеские подлодки. Совместные усилия по их поиску и уничтожению дают отличные результаты."
 sp_land_reward_option_land_cruiser_track_reinforce_track_bonus_name:0 "Усиленные гусеницы"
 lc_radio_1:0 "$tank_radio_1$"
 lc_radio_1_desc:0 "$tank_radio_1_desc$"
 escort_patrols:0 "Патрули сопровождения"
 escort_patrols_desc:0 "Улучшенные средства обнаружения делают наши корабли сопровождения заметно опаснее для подлодок. Им негде спрятаться, а значит, они не представляют реальной угрозы."
 sp_land_reward_option_land_cruiser_engine_new:0 "Разработать новый двигатель."
 GDC:0 "Гуандун"
 tactic_gas_cylinder_tear:0 "Высвобождение баллонов со слезоточивым газом"
 sp_nuclear_missile_submarine_eq_bonus_strength:0 "Подлодка с ядерными ракетами: повышенная живучесть"
 SUBDOCTRINE_SCREEN_CONVOY_ESCORT:0 "Сопровождение конвоев"
 SUBDOCTRINE_SCREEN_HUNTER_KILLERS:0 "Противолодочные группы"
 lc_high_impact_obliterator_cannon:0 "Мощная пушка «Уничтожитель»"
 lc_high_impact_obliterator_cannon_desc:0 "Это орудие создано для пробивания особо толстой брони, и его высокая кинетическая энергия делает его грозным оружием против других сверхтяжелых танков."
 SIC:0 "Сычуань"
 anti_tank_brigade:0 "ПТО"
 anti_tank_brigade_desc:0 ""
 naval_strike_tactics:0 "Тактика удара по надводным целям"
 naval_strike_tactics_desc:0 "Обучив пилотов предсказывать маршрут кораблей и координировать действия, мы повысим эффективность наших налетов на вражеские корабли."
 sp_air_generic_reward_test_failure_1:0 "Безуспешный эксперимент"
 sp_artillery_rocket_assisted_projectiles_tech:0 "Активно-реактивные снаряды"
 sp_artillery_rocket_assisted_projectiles_tech_desc:0 "Усовершенствованные снаряды для сверхтяжелых гаубиц, предназначенные для увеличения дальности стрельбы и повышения ударной силы за счет ракетной тяги."
 military_police:0 "Военная полиция"
 military_police_desc:0 "Поддерживает порядок и подавляет сопротивление на оккупированных территориях."
 assault_concentration:0 "Подготовка артиллерии"
 assault_concentration_desc:0 "Перед атакой подразделения первого эшелона выполняют тщательную подготовку и занимают передовые позиции, чтобы в первые минуты наступления обеспечить максимальный натиск."
 tactical_control:0 "Тактическое управление"
 tactical_control_desc:0 "Офицеры, знакомые с методикой взаимодействия родов войск на передовых позициях, могут напрямую управлять действиями этой боевой части."
 sp_land_land_cruiser:0 "Сухопутный крейсер"
 sp_land_land_cruiser_desc:0 "Перед этим бронированным исполином стоит только одна задача: завоевывать господство на поле боя. Никакой другой танк не может похвастать такими же размерами и боевой мощью."
 sp_land_reward_option_land_cruiser_engine_modify:0 "Переработать двигатель."
 SUBDOCTRINE_DEEP_AIR_RAIDS:0 "Глубокие воздушные рейды"
 cat_air_bombs:0 "Авиабомбы"
 sp_naval_rocket_launching_submarine_preference_b:0 "Сосредоточиться на надежности"
 tactic_cc_storm:0 "Ближний бой: штурм"
 SUBDOCTRINE_LAST_STAND_DESC:0 "Когда мы загнаны в угол, а на карту поставлено выживание нации, единственный выход — ожесточенное, фанатичное сопротивление всего населения, превращающее каждый дом, улицу и город в поле боя."
 sp_air_generic_reward_major_progress_2:0 "Умелая посадка"
 hq_field_hospital:0 "Медицинский персонал"
 hq_field_hospital_desc:0 "Распределяет медикаменты, занимается эффективной эвакуацией и лечением раненных в зоне действия армии."
 special_forces:0 "Войска специального назначения"
 special_forces_desc:0 "Нам необходимы элитные войска; приоритетной задачей должно стать создание горно-стрелковых и воздушно-десантных подразделений."
 sp_naval_modern_battleship_preference_b_a:0 "Повысить маневренность"
 SUBDOCTRINE_RAPID_DOMINATION:0 "Быстрое преобладание"
 tactic_cc_withdraw:0 "Ближний бой: отступление"
 SUBDOCTRINE_MOUNTED_INFANTRY_DESC:0 "Чтобы модернизировать нашу кавалерию для XX века, нам нужно освоить оперативную мобильность на пересеченной местности в конном строю, а также научиться вести бой в пешем строю, используя быстрое, современное тяжелое вооружение для поддержки."
 small_plane_airframe_0:0 "Корпус маленького самолета межвоенных лет"
 small_plane_airframe_0_desc:0 "Авиация прошла долгий пусть с первых дней Великой войны. Этот корпус демонстрирует лучшие достижения инженерной мысли своей эпохи, но потенциал для его развития достаточно ограничен."
 sp_land_reward_option_land_cruiser_communication_new:0 "Установить продвинутую систему."
 convoy_escorts_bs:0 "Корабли сопровождения"
 convoy_escorts_bs_desc:0 "Быстрые надводные корабли, входящие в состав наших конвоев, позволяют вовремя обнаруживать вражеские подводные лодки и реагировать на их появление. Чтобы избавиться от надоедливых подлодок, нужно своевременно их замечать."
 sp_land_generic_reward_armor_tech_1:0 "Новаторские методы"
 sp_land_generic_reward_armor_tech_1_desc:0 "Во время работы над проектом «[SpecialProject.GetName]», которым руководит [Character.GetName], мы добились серьезных успехов в смежных областях. Эти достижения совершили, без преувеличения, революцию в военном деле: теперь мы сможем разработать более эффективные методы ведения боевых действий."
 lc_hull_mounted_railway_gun:0 "Установленное на корпусе железнодорожное орудие"
 lc_hull_mounted_railway_gun_desc:0 "Переработанное железнодорожное орудие, установленное прямо в корпус для обеспечения максимальной стабильности. Обеспечивает мощную огневую поддержку и может с большой точностью поражать удаленные цели."
 submarine_operations:0 "Операции подводных лодок"
 submarine_operations_desc:0 "Нам необязательно вступать в открытое сражение с вражескими кораблями, чтобы победить в войне. Можно наносить удары по чужим торговым судам и уходить на глубину прежде, чем противник опомнится. Трудно воевать с тем, что не видишь."
 tank_super_heavy_three_man_tank_turret:0 "Трехместное орудие"
 tank_super_heavy_three_man_tank_turret_desc:0 "Башня, достаточно большая, чтобы вместить трех членов экипажа, которые разделят между собой задачи по заряжанию и наведению главного орудия, а также наблюдению за боевой обстановкой."
 sp_modern_battleship_eq_bonus_armor:0 "Современный линкор — укрепленный корпус и броня"
 tactic_gas_mask_charge:0 "Атака в противогазах"
 motorized_rocket_equipment:0 "Моторизированная реактивная артиллерия"
 motorized_rocket_equipment_desc:0 "Реактивные установки доставляют снаряды к цели быстрее, чем это способна сделать традиционная артиллерия, но менее точны и гораздо дольше заряжаются. При установке на грузовик способны поменять позицию после выстрела быстрее, чем противник сможет отреагировать."
 tactic_masterful_blitz:0 "Опель «Блиц»"
 air_land_battle:0 "Воздушно-наземный бой"
 air_land_battle_desc:0 "Интеграция авиации предусматривает тщательную координацию действий между наземными и воздушными войсками, что позволяет объединить сушу и воздух в единое поле боя."
 RUS:0 "Россия"
 GRAND_DOCTRINE_BASE_STRIKE_DESC:0 "Бить надо первым: последние достижения в области морской авиации открывают заманчивую возможность наносить удары по врагу из-за горизонта — еще до того, как противник поймет, что боевые действия начались."
 centralized_fire_control:0 "Централизованный контроль артиллерии"
 centralized_fire_control_desc:0 "Система централизованного контроля артиллерии позволяет обрабатывать все запросы на ведение артиллерийского огня в едином командном пункте. При необходимости вся огневая мощь дивизий может быть сосредоточена на одной цели вместо того, чтобы боевая единица запрашивала огонь лишь у прикрепленного к ней артиллерийского расчета.\n\n"
 nuclear:0 "Атомная технология"
 strat_bomber_intercontinental_equipment_1:0 "Межконтинентальный бомбардировщик"
 strat_bomber_intercontinental_equipment_1_desc:0 "Огромный самолет, специально разработанный для сверхдальних полётов. Позволяет осуществлять стратегические бомбардировки по всему континенту."
 sp_naval_anechoic_tiles_preference_a:0 "Приспособить корпуса к агрессивному патрулированию"
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_apply_and_document_discovery:0 "Использовать метод и задокументировать его."
 cv_small_plane_naval_bomber_airframe:0 "$cv_nav_bomber_equipment$"
 cv_small_plane_naval_bomber_airframe_desc:0 "$cv_small_plane_airframe_desc$"
 sp_air_intercontinental_bomber:0 "Межконтинентальный бомбардировщик"
 sp_air_intercontinental_bomber_desc:0 "Огромный самолет, нагруженный бомбами и топливом. Разработан специально для высотных полетов на дальние расстояния и способен пересекать океаны и континенты."
 sp_land_reward_option_multi_charge_large_caliber_gun_test_failure_desc:0 "Контрольное испытание было прервано мощным взрывом, сотрясшим полигон. Он не только уничтожил орудие, но и значительно повредил объекты инфраструктуры. Группа, которой руководит [Character.GetName], была вынуждена заняться изучениями причин взрыва, а заодно устранением последствий, среди которых излишнее внимание общественности и необходимость перенести сроки выполнения проекта."
 blitzkrieg:0 "Блицкриг"
 blitzkrieg_desc:0 "Блицкриг — стратегия использования быстрых танковых частей при поддержке моторизированной пехоты и авиации, чтобы прорваться сквозь оборонительные порядки противника, дезорганизовать и окружить его."
 FRA_victors_of_wwi:0 "Победители Великой войны"
 FRA_victors_of_wwi_desc:0 "Выйдя победителем в Великой войне, армия страны приобрела опасную привычку мирно почивать на лаврах, неохотно внедряя новшества, что замедляет стратегическое развитие."
 SUBDOCTRINE_FIGHTER_HOMELAND_DEFENSE:0 "Противовоздушная оборона родины"
 GRAND_BATTLEPLAN_DOCTRINE:0 "Большой план операции"
 SUBDOCTRINE_BOMBER_INTERCEPTION_DESC:0 "Тяжелые истребители неповоротливы, а потому уязвимы перед легкими самолетами, зато их орудия крайне опасны для бомбардировщиков."
 MAN:0 "Маньчжурия"
 sp_land_generic_reward_army_xp_2:0 "Оперативная аналитика"
 SUBDOCTRINE_BATTLECRUISER_SUPREMACY_DESC:0 "В мире, где у каждого есть большие пушки, быстрые крупные корабли незаменимы: мы сможем выбирать, в какой бой вступить, а от какого — уйти подальше."
 large_plane_airframe_4:0 "Корпус современного большого самолета"
 large_plane_airframe_4_desc:0 "Реактивная тяга обеспечивает многократный скачок в мощности по сравнению с предыдущими двигателями. Этот корпус был разработан, чтобы сполна воспользоваться таким преимуществом."
 sp_midget_submarine_eq_bonus_stealth:0 "Сверхмалая подводная лодка — упор на скрытность"
 sp_land_reward_option_land_cruiser_turret_redesign:0 "Переработать конструкцию башен."
 cat_anti_air:0 "ПВО"
 sp_naval_rocket_launching_submarine_preference_c:0 "Сосредоточиться на незаметности"
 sp_naval_nuclear_submarine:0 "Атомная подлодка"
 sp_naval_nuclear_submarine_desc:0 "Нам вполне по силам сконструировать компактный атомный реактор, который поместится в подлодку особой конструкции. Так мы не только значительно увеличим дальность хода, но и сделаем лодку бесшумной."
 category_cavalry:0 "Мобильная пехота "
 sp_land_generic_reward_army_xp_1_desc:0 "[Character.GetName] и специально отобранная группа офицеров провели встречу, где обсудили потенциал проекта «[SpecialProject.GetName]». В ходе обсуждений были выработаны новые методы применения этой технологии для войны на суше. Благодаря этому выросла наша военная мощь, и мы будем гораздо лучше подготовлены к предстоящим сражениям."
 sp_land_reward_stronghold_network_integration_of_anti_blast_doors:0 "Установка взрывостойких дверей"
 naval_bomber:0 "Модели морских бомбардировщиков"
 pocket_defence:0 "Оборона в окружении"
 pocket_defence_desc:0 "Может случиться, что наши обороняющиеся войска окажутся в «котле». В этом случае они должны продержаться до тех пор, пока их не вытащат оттуда в ходе неизбежного контрнаступления."
 mio_cat_eq_all_medium_tank:0 "Все средние танки"
 SUBDOCTRINE_COASTAL_AIR_PATROL_DESC:0 "Оборона побережья непосредственно у воды — неэффективный и затратный метод. Быстрые и подвижные самолеты способны лучше прикрывать берега от захватчиков."
 tactic_barrage:0 "Подавляющий огневой вал"
 category_fighter:0 "Истребитель"
 SUBDOCTRINE_ANTI_TANK_FRONT:0 "Противотанковый фронт"
 ship_hull_carrier_conversion_bb_desc:0 "После многих лет экспериментов авианосец постепенно превратился в самостоятельный класс. Эти корабли способны нести всё более эффективную авиацию и со временем грозят занять первое место по важности в составе флотов."
 infiltration_bombing:0 "Бомбардировки тыла"
 infiltration_bombing_desc:0 "Идея примкнуть к вражеской группе или проследить ее путь до авиабазы кажется безумной. Но, набравшись опыта, можно сделать и такое."
 SUBDOCTRINE_TACTICAL_FLEXIBILITY:0 "Господство в воздушном пространстве"
 mountaineers_tech:0 "Технологии горно-стрелковых войск"
 sp_land_reward_option_land_cruiser_chassis_reinforce_bonus_name:0 "Усиленное шасси"
 mio_cat_tech_all_screen_ship_and_modules:0 "Все технологии кораблей охранения"
 sp_land_reward_land_cruiser_ammunition:0 "Решение для хранения боеприпасов"
 sp_land_reward_land_cruiser_ammunition_desc:0 "Во время испытаний возникли трудности с хранением и перемещением крупнокалиберных снарядов для проекта «[SpecialProject.GetName]»: стандартные стойки попросту не выдерживают вес столь крупных боеприпасов. Конструкторы предложили разработать новую систему хранения с разделением на отсеки, где будут использоваться усиленные перегородки и гидропогрузчики, что обеспечит безопасное обращение со снарядами и ускорит заряжание в боевых условиях."
 mio_cat_tech_all_cruiser_and_modules:0 "Все технологии крейсеров"
 light_tank_chassis_3:0 "Модернизированный легкий танк"
 heavy_fighter:0 "Тяжелый истребитель"
 forest:0 "Лес"
 forest_desc:0 ""
 mio_cat_all_heavy_aircraft_and_modules:0 "Все технологии тяжелой авиации"
 GENERIC:0 "Общее"
 convoy_sailing:0 "Конвоирование"
 convoy_sailing_desc:0 "С введением обязательных конвоев стало легче обнаруживать корабли противника и вовремя реагировать на их появление. Безопаснее действовать сообща."
 armored_car:0 "Бронемашина"
 armored_car_desc:0 ""
 sp_land_generic_reward_armor_tech_3:0 "Экспериментальная методология"
 ship_hull_carrier_modern:0 "Современный авианосец"
 ship_hull_carrier_modern_desc:0 "Самые крупные и передовые авианосцы, разработанные с использованием самых современных технологий. Их можно оснастить новейшим вооружением и оборудованием."
 rocket_site:0 "Ракетная площадка"
 rocket_site_desc:0 "Это сооружение позволяет размещать в регионе произведенные вами ракеты."
 SUBDOCTRINE_ESCORT_FIGHTER:0 "Авиация сопровождения средней дальности"
 cv_small_plane_cas_airframe:0 "$cv_CAS_equipment$"
 cv_small_plane_cas_airframe_desc:0 "$cv_small_plane_airframe_desc$"
 sp_modern_battleship_eq_bonus_heavy_attack:0 "Современный линкор — улучшения тяжелых орудий"
 sp_naval_super_heavy_battleship:0 "Сверхтяжелый линкор"
 sp_naval_super_heavy_battleship_desc:0 "Гонка морских вооружений в последнее время охватывает всё новые сферы, однако не восхищаться великолепием линкоров — и возможностью построить еще более внушительные суда — просто невозможно."
 sp_nuclear_submarine_eq_bonus_quality:0 "Атомная подлодка — упор на качество"
 sp_naval_generic_reward_option_artillery_tech_bonus_name:0 "Исследование экспериментальной корабельной артиллерии"
 sp_naval_modern_carrier_unique_reward_b:0 "Современный авианосец: безопасность"
 sp_naval_modern_carrier_unique_reward_b_desc:0 "Становится очевидно, что авианосцы незаменимы в морском бою, поэтому мы должны как следует защитить их от вражеских атак. На чём лучше сосредоточить усилия?"
 motorized_equipment_0_desc:0 "Во время Великой войны в войсках начали использовать обычные гражданские грузовики для перевозки припасов и снаряжения. С тех пор такие грузовики стали неотъемлемой частью большинства армий."
 SUBDOCTRINE_COMMANDOS:0 "Превосходство каждого"
 medium_tank_chassis_3:0 "Модернизированный средний танк"
 tank_medium_cannon_2:0 "Улучшенная средняя пушка"
 tank_medium_cannon_2_desc:0 "Орудие общего назначения, используемое для широкого круга задач. Не достигает исключительной эффективности ни в борьбе с пехотой, ни в сражениях с танками, но обеспечивает боевой машине большую гибкость применения."
 has_flame_tank_units:0 "Есть огнеметный танк"
 cat_special_forces_generic:0 "Войска специального назначения"
 sp_air_generic_major_breakthrough_reward_option:0 "Отлично!"
 tank_small_cannon_2:0 "Улучшенная малая пушка"
 tank_small_cannon_2_desc:0 "Небольшая и дешевая пушка, способная вести огонь как шрапнельными, так и бронебойными снарядами. Малый калибр ограничивает ее эффективность."
 heavy_tank_chassis_2:0 "Улучшенный тяжелый танк"
 sp_land_generic_reward_artillery_tech_3:0 "$sp_land_generic_reward_armor_tech_3$"
 sp_naval_super_heavy_battleship_unique_reward_b:0 "Вопрос приоритета: защита"
 sp_naval_super_heavy_battleship_unique_reward_b_desc:0 "Командующие флотом поставили перед нами невыполнимую задачу: сделать этот линкор неуязвимым. Хоть это и недостижимая цель, мы можем попытаться усилить защиту корабля. Чему стоит отдать приоритет?"
 tactic_attacker_sb_skillful_defence:0 "Оборона моста"
 mio_cat_eq_all_heavy_tank:0 "Все тяжелые танки"
 stronghold_network_desc:0 "Обширная оборонительная система из массивных бункеров и сильно укрепленных позиций, которая была возведена, чтобы отражать наступление противника и обеспечивать безопасность ключевых стратегических районов."
 SUBDOCTRINE_FIRE_CONCENTRATION_DESC:0 "Благодаря централизации управления средствами огневой поддержки наша армия сможет сосредоточить огневую мощь в критической точке, а не распылять ее по нескольким направлениям."
 interbellum:0 "§YИнтербеллум§!"
 sp_land_stronghold_network:0 "Цепь укреплений"
 sp_land_stronghold_network_desc:0 "Обширная система из укрепленных бункеров и опорных пунктов, способная выдержать наступление противника и обеспечить безопасность стратегически важных районов."
 tank_high_velocity_cannon_2:0 "Улучшенная скорострельная пушка"
 tank_high_velocity_cannon_2_desc:0 "Пушка, специально спроектированная для достижения высокой дульной скорости. При использовании специальных боеприпасов обладает отличными бронебойными характеристиками, но при этом страдает эффективность против слабобронированных целей."
 GRAND_DOCTRINE_OPERATIONAL_INTEGRITY_DESC:0 "Завоевание и поддержание господства в воздухе с целью обеспечить многоцелевым средним бомбардировщикам возможность наносить оперативные удары."
 sp_land_reward_stronghold_network_leadership_approach:0 "Подход к управлению"
 sp_land_reward_stronghold_network_leadership_approach_desc:0 "Работа над проектом идет полным ходом, и [Character.GetName] начинает размышлять о своей роли в его дальнейшей реализации. [Character.GetSheHeCap] может лично руководить процессом, чтобы обеспечить точное выполнение плана, или же остаться у себя в отделе и сосредоточиться на стратегии и планировании."
 technology:0 "Технологии"
 motorbike_equipment:0 "Военный мотоцикл"
 motorbike_equipment_desc:0 "Военные мотоциклы часто оснащаются колясками и пулеметами. Благодаря скорости и универсальности их можно использовать для разведки, а также для подразделений связи и быстрого реагирования."
 tactic_sf_ambush:0 "Тактика городских засад"
 tactic_overwhelming_fire:0 "Огонь на подавление"
 supersonic_small_airframe:0 "$small_plane_airframe_5$"
 supersonic_small_airframe_desc:0 "$small_plane_airframe_5_desc$"
 tactic_seize_bridge:0 "Захватить мост"
 artillery_desc:0 ""
 easy_maintenance:0 "Простота в обслуживании"
 easy_maintenance_desc:0 "Лючки в боевой машине дают доступ ко многим ее важным компонентам и облегчают экипажу выполнение даже сложных регламентных работ."
 mio_cat_eq_all_light_tank:0 "Все легкие танки"
 mountain:0 "Горы"
 mountain_desc:0 ""
 cruiser_armor_advice_tt:0 "\nУстановка улучшенного модуля §YБроня§! на §Yкрейсеры§! повышает их способность противостоять урону."
 paratroopers:0 "ВДВ I"
 paratroopers_desc:0 "Используя воздушно-десантные войска, мы можем вторгаться в прежде недоступные районы и размещать там ключевые силы, что открывает новые тактические возможности."
 sp_land_generic_reward_scientist_xp_2:0 "Улучшенная разработка"
 great_war:0 "§YВеликая война§!"
 mio_cat_eq_all_cv_aircraft:0 "Вся палубная авиация"
 category_infantry_and_bicycle:0 "Пехота"
 category_mountaineers:0 "Все горные стрелки"
 secondary_turret_hmg:0 "Тяжелый пулемет"
 secondary_turret_hmg_desc:0 "Тяжелый пулемет — вспомогательное орудие боевой машины. Размещение башни ограничивает сектор обстрела, снижая эффективность, но зато позволяет танку атаковать больше целей, что особенно полезно при наступлении."
 ship_hull_heavy_modern:0 "Современный линкор"
 rocket_artillery_equipment:0 "Буксируемая реактивная артиллерия"
 rocket_artillery_equipment_desc:0 "Реактивная артиллерия менее точна и скорострельна, чем традиционные орудия, однако все недостатки окупаются эффектом от попадания ракетного залпа в цель."
 heavy_tank_chassis:0 "Тяжелый танк"
 heavy_tank_chassis_desc:0 "Крупное шасси, на которое можно установить тяжелое орудие, толстую броню или и то и другое."
 floating_fortress:0 "Плавучая крепость"
 floating_fortress_desc:0 "Линкоры находятся в состоянии повышенной готовности и ответят на любую попытку врага проникнуть в наши воды. Любому флоту нужен прочный фундамент, а линкор не знает себе равных по мощи."
 tactic_defender_hb_skillful_defence:0 "Оборона моста"
 armor_tech_1_tt:0 "Открывает значения в 5 и выше для улучшения брони."
 mio_cat_all_medium_aircraft_and_modules:0 "Все технологии средней авиации"
 tactic_gas_projector_poisonous:0 "Газометный обстрел ядовитым газом"
 lc_light_anti_air_battery:0 "Легкая батарея ЗСУ"
 lc_light_anti_air_battery_desc:0 "Легкая зенитная батарея для обстрела низколетящих самолетов и защиты техники от атак с бреющего полета и пикирующих бомбардировщиков."
 tank_bogie_suspension:0 "Балансирная подвеска"
 tank_bogie_suspension_desc:0 "Простой и относительно дешевый тип подвески, в котором катки закреплены отдельно, что облегчает их замену при повреждении."
 TITLE_STRATEGIC_DESTRUCTION:0 "Стратегическое разрушение"
 base_strike:0 "Удар по базам"
 base_strike_desc:0 "Удар по вражескому порту помешает противнику восстановить флот. Мы же при этом получим численное преимущество на море.\n\n"
 sp_naval_nuclear_torpedo_preference_b:0 "Обеспечить безопасное хранение боеприпасов"
 light_tank_chassis_2:0 "Улучшенный легкий танк"
 sp_land_reward_option_land_cruiser_assembly_all:0 "На всех этапах сборки."
 escort_carriers:0 "Авианосцы сопровождения"
 escort_carriers_desc:0 "В районе, где действует авианосец, гораздо проще обеспечивать охрану торговых кораблей. Крайне важно обеспечить непрерывную поставку ресурсов."
 sp_shock_hardening_techniques:0 "Защита от ударного воздействия"
 sp_shock_hardening_techniques_desc:0 "Используя различные методы повышения ударопрочности и применяя компенсаторы напряжения для наших компонентов, мы снизили частоту преждевременных детонаций. Теперь наши снаряды стали более надежными и эффективными."
 heavy_flame_tank:0 "Тяжелая огнеметная танковая рота"
 heavy_flame_tank_desc:0 "Рота тяжелых огнеметных боевых машин для поддержки при штурме городов и укреплений."
 SUBDOCTRINE_GRAND_ASSAULT:0 "Массированный штурм"
 SUBDOCTRINE_TACTICAL_BATTLEFIELD_SUPPORT:0 "Тактическая поддержка на поле боя"
 sp_land_reward_option_super_heavy_howitzer_focus_preference_production:0 "Акцент на быстрое производство"
 lc_smoke_generators:0 "Дымогенераторы"
 lc_smoke_generators_desc:0 "Система для постановки густой дымовой завесы, скрывающей передвижение техники и снижающей ее заметность как на земле, так и с воздуха."
 battlefield_destruction:0 "Разрушение поля боя"
 battlefield_destruction_desc:0 "Самолеты способны наносить удары по находящимся далеко странам, но они с не меньшей пользой могут помочь сухопутным войскам в сражении."
 sp_naval_generic_reward_artillery_tech_3:0 "Глубокое понимание корабельных батарей"
 sp_naval_modern_carrier_preference_c_b:0 "Защита от вражеских торпед"
 DOCTRINE_TRACK_INFANTRY:0 "Пехота"
 medium_plane_airframe_1:0 "Базовый корпус среднего самолета"
 medium_plane_airframe_1_desc:0 "Благодаря ряду разработанных в последнее время новых технологий этот корпус обладает значительно большими возможностями, чем более ранние самолеты сходного размера."
 sp_land_generic_reward_test_failure_1_desc:0 "Испытания закончились не совсем удачно: у прототипа, разработчиком которого является [Character.GetName], были неожиданно выявлены технические неисправности. Теперь потребуется пересмотреть подход к работе и усовершенствовать ее методы. Ход работ замедлился, однако в долгосрочной перспективе эти уроки пойдут лишь на пользу проекту."
 jet_engine_axial_2x:0 "Реактивный двигатель с 2 осями"
 jet_engine_axial_2x_desc:0 "$engine_1_2x_desc$"
 ship_hull_carrier_conversion_ca_desc:0 "После многих лет экспериментов авианосец постепенно превратился в самостоятельный класс. Эти корабли способны нести всё более эффективную авиацию и со временем грозят занять первое место по важности в составе флотов."
 category_light_infantry:0 "Обычная пехота"
 sp_air_generic_discoveries_reward:0 "Новые смежные разработки"
 sp_air_generic_discoveries_reward_desc:0 "Проводя научные исследования, наши ученые подали несколько идей, которые могут пригодиться в других обстоятельствах."
 ship_hull_nuclear_submarine:0 "Атомная подводная лодка"
 ship_hull_nuclear_submarine_desc:0 "Благодаря ядерным реакторам наши подводные лодки смогут долгое время действовать под водой, сохраняя при этом высокую скорость. Это сделает их особенно смертоносным оружием в нашем арсенале."
 sp_land_reward_option_land_cruiser_suspension_rear:0 "Использовать систему только в задней ходовой части"
 SUBDOCTRINE_BATTLECRUISER_SUPREMACY:0 "Быстрые линкоры"
 tank_riveted_armor:0 "Клепаная броня"
 tank_riveted_armor_desc:0 "Бронепластины, прикрученные к раме и удерживаемые заклепками. Проверенная временем и относительно дешевая технология, но сами клепаные края брони — уязвимые места, а попадание в заклепки может ранить экипаж."
 naval_mines:0 "Технологии «Минная война»"
 grand_assault:0 "Массированный штурм"
 grand_assault_desc:0 "Когда войска накоплены в достаточном количестве, а их задачи четко определены, мощный штурм просто обязан уничтожить врага."
 sp_naval_nuclear_missile_submarine_unique_reward_a:0 "Уход от преследования"
 sp_naval_nuclear_missile_submarine_unique_reward_a_desc:0 "Если информация о нашем запланированном ядерном ударе дойдет до врагов, они моментально начнут искать наши подлодки с ядерным вооружением. Как лучше избежать обнаружения?"
 defence_in_depth:0 "Глубокая оборона"
 defence_in_depth_desc:0 "Оказав незначительное сопротивление и временно уступив часть территории, мы можем разменять пространство на время, чтобы атакующие растратили часть сил перед нашей контратакой."
 large_plane_airframe_3:0 "Усовершенствованный корпус большого самолета"
 large_plane_airframe_3_desc:0 "Этот оптимизированный для полетов на огромные расстояния корпус предназначен для полетов на большой высоте и способен нести значительный груз глубоко в сердце вражеской территории."
 cat_battlefield_support:0 "Доктрина поддержки с воздуха"
 engineer:0 "Сапёрная рота"
 engineer_desc:0 "Инженеры, занимающиеся возведением укреплений и защиты от прорывов, незаменимы на поле боя. Поскольку они универсальны, их можно использовать в самых разных ситуациях."
 line:0 "--------------------------------------------------"
 SUBDOCTRINE_MOBILE_RECON_AND_ASSAULT_DESC:0 "Благодаря общевойсковому подходу с внедрением повсеместной моторизации мы можем обнаруживать противника с помощью разведывательных подразделений, а затем быстро его уничтожать мобильным тяжелым вооружением."
 sp_land_generic_reward_armor_bonus_1_desc:0 "[Character.GetName] представляет поразительные результаты перспективных исследований: благодаря новым сплавам мы сможем произвести настоящий переворот в технологиях бронирования танков. Именно такие ученые, как [Character.GetName], определяют облик бронетанковых войск завтрашнего дня."
 CAN:0 "Канада"
 air_doctrine_folder:0 "Воздушная доктрина"
 air_doctrine_folder_desc:0 "Воздушная доктрина, определяющая, как должна сражаться ваша авиация."
 tactic_gas_artillery_poisonous:0 "Артиллерийский залп ядовитым газом"
 self_propelled_super_heavy_artillery_equipment_1:0 "Самоходная сверхтяжелая гаубица"
 self_propelled_super_heavy_artillery_equipment_1_desc:0 "$sp_land_super_heavy_howitzer_desc$"
 heavy_bombs:0 "Тяжелые бомбы"
 heavy_bombs_desc:0 "Современные боевые действия требуют сброса на противника все более тяжелых авиабомб. Сегодня бомбометание — неоспоримо важный аспект воздушной войны."
 SUBDOCTRINE_COMMANDOS_DESC:0 "Каждый боец — император. Все наши солдаты без исключения обязаны уметь справляться со сложными, подчас невыполнимыми задачами, и вносить личный вклад в общее дело. От того, насколько хорошо мы их подготовим, будет зависеть успех на фронте."
 sp_naval_ice_carrier_free_design:0 "Пайкеритовый авианосец"
 lc_heavy_anti_air_platform:0 "Площадка с тяжелой ЗСУ"
 lc_heavy_anti_air_platform_desc:0 "Крупнокалиберные зенитные орудия на платформе. Предназначены для защиты сухопутного крейсера от вражеских бомбардировщиков и разведывательных самолетов."
 land_cruiser:0 "Сухопутный крейсер"
 land_cruiser_desc:0 "Колоссальная военная машина. Снабжена вооружением крейсерского масштаба и самой тяжелой броней, но при этом крайне тихоходна и требует огромного количества ресурсов."
 sp_naval_cruiser_submarine_preference_b:0 "У наших подлодок должно быть лучшее вооружение"
 nsb_armour_folder:0 "Броня"
 sp_armored_maintenance_tech:0 "Бронетанковая ремонтная рота"
 sp_armored_maintenance_tech_desc:0 "Использование бронированных ремонтно-эвакуационных машин позволяет нашим ремонтным подразделениям выполнять эвакуацию и ремонт всех видов техники, обеспечивая максимальную боевую готовность на поле боя."
 coal_desc:0 "Уголь — ресурс, используемый для обеспечения энергией промышленного производства."
 sp_land_generic_reward_option_scientist_xp:0 "Знание — сила!"
 sp_land_generic_reward_option_scientist_xp_desc:0 "[Character.GetName] добивается нового прорыва, закрепляя за собой репутацию первопроходца в области разработок современного вооружения."
 tank_diesel_engine:0 "Дизельный двигатель"
 tank_diesel_engine_desc:0 "Дизельный двигатель надежнее бензинового, но при одинаковом объеме с ним техника развивает меньшую скорость."
 mechanized:0 "Механизированная пехота"
 mechanized_desc:0 "Пехота, оснащенная легкобронированными средствами транспортировки."
 category_recon:0 "Разведчики"
 lc_radar:0 "Радар"
 lc_radar_desc:0 "Система раннего обнаружения, повышающая осведомленность о передвижениях авиации и ближайших сил противника. Позволяет сухопутному крейсеру подготовиться к потенциальным угрозам с земли или воздуха."
 tank_super_heavy_four_man_tank_turret:0 "Четырехместное орудие"
 tank_super_heavy_four_man_tank_turret_desc:0 "Огромная башня с дополнительным местом для второго заряжающего, обслуживающего главное орудие."
 naval_strike_torpedo_tactics:0 "Торпедный удар по надводным целям"
