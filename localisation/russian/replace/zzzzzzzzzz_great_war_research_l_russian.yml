 mio_cat_eq_all_cruiser:0 "Все крейсеры"
 sp_land_generic_reward_scientist_xp_1_desc:0 "[Character.GetName] добивается нового прорыва, закрепляя за собой репутацию первопроходца в области разработок современного вооружения и значительно ускоряя ход работ. Каждое новое открытие приумножает возможности этого талантливого человека и определяет облик военной техники будущего."
