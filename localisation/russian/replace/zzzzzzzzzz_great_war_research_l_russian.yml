 GER_light_cruiser_1:0 "Gazelle Class"
 GER_light_cruiser_2:0 "Dresden Class"
 GER_light_cruiser_2_desc:0 "Типичный немецкий защищенный крейсер начала XX века. «Dresden» мог служить разведчиком или рейдером, а также прикрывать эскадру кораблей от вражеских эсминцев. Он обладал высокой для своего времени скоростью и очень хорошей защитой. По сравнению с большинством вражеских крейсеров, он был оснащен многочисленными, но менее эффективными орудиями."
 GER_light_cruiser_3:0 "Magdeburg Class"
 GER_light_cruiser_4:0 "Königsberg Class"
 GER_armored_cruiser_1:0 "Fürst Bismarck Class"
 GER_armored_cruiser_2:0 "Blücher Class"
 GER_armored_cruiser_3:0 "Lützow Class"
 GER_armored_cruiser_4:0 "Admiral Hipper Class"
 GER_battle_cruiser_1:0 "Von der Tann Class"
 GER_battle_cruiser_2:0 "Derfflinger Class"
 GER_battleship_0:0 "Deutschland Class"
 GER_battleship_0_desc:0 "Линкоры типа «Deutschland» были последними додредноутами, построенными Императорским флотом Германии. Эти корабли, хотя и отличались надежным бронированием, хорошей торпедной защитой и мощной вторичной батареей, быстро устарели с появлением дредноута и его принципом «только большие пушки». Они были вооружены 28-см (11 дюймов) орудиями, которые, несмотря на высокую эффективность, не могли сравниться по дальнобойности с крупнокалиберными главными батареями современных дредноутов."
 GER_battleship_1:0 "Nassau Class"
 GER_battleship_1_desc:0 "Первая серия дредноутов Императорского флота Германии. Этот линкор отличался надежным бронированием, хорошей торпедной защитой и мощной вторичной батареей. Он нес 283-мм орудия, которые по многим параметрам не уступали орудийным системам большего калибра, принятым на вооружение другими флотами мира."
 GER_battleship_2:0 "König Class"
 GER_battleship_2_desc:0 "Этот военный корабль был создан на основе линкоров типа «Kaiser». Он унаследовал от своих предшественников очень мощную броню. Главные башни были расположены более рационально, что позволяло кораблю вести широкий огонь из всех орудий главной батареи."
 GER_battleship_3:0 "Bayern Class"
 GER_battleship_3_desc:0 "Военный корабль принадлежал к последней серии линкоров, построенных для Императорского флота Германии. Его отличали мощные 380-мм главные орудия с очень хорошей баллистикой снарядов и скорострельностью, которая была довольно высокой среди аналогичных орудийных систем."
 GER_battleship_4:0 "L 20e alpha-class"
