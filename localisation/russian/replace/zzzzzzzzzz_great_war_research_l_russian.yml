 sp_aip_engine_improved_tech_desc:0 "Благодаря дальнейшему развитию технологии производства воздухонезависимых энергетических установок производительность двигателей улучшилась, а потребление ресурсов, необходимых для их работы, снизилось."
 mio_cat_eq_all_infantry_and_support_equipment:0 "Всё пехотное и вспомогательное снаряжение"
 forward_observers:0 "Передовые наблюдатели"
 forward_observers_desc:0 "Передовые наблюдатели занимают позиции, откуда они могут напрямую видеть точность и результативность артиллерийского огня, и передают данные в расчеты для корректировки."
 tank_rocket_launcher:0 "Реактивная установка"
 tank_rocket_launcher_desc:0 "Многоствольная пусковая установка для стрельбы неуправляемыми фугасными реактивными снарядами. Большая площадь накрытия делает ее эффективной при работе по небронированным целям, но против бронированных она неэффективна даже при прямом попадании."
 sp_modern_carrier_eq_bonus_detection:0 "Современный авианосец — улучшенная способность к обнаружению"
 sp_centrifugal_jet_tech:0 "Центробежный реактивный двигатель"
 sp_centrifugal_jet_tech_desc:0 "В центробежных реактивных двигателях для создания тяги используется одноступенчатый компрессор, сжимающий всасываемый воздух перед его выбросом. Такие двигатели компактны и легко обслуживаются."
 river:0 "Река"
 medium_tank_flame_chassis:0 "Средний огнеметный танк"
 medium_tank_flame_chassis_desc:0 "Средняя боевая машина с огнеметом в башне для атаки укреплений и зданий."
 category_carrier_cas:0 "Палубный штурмовик"
