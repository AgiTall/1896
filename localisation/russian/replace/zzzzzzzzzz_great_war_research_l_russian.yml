 tactic_tactical_withdrawal:0 "Тактическое отступление"
 grand_battle_plan:0 "Стратегическое планирование"
 grand_battle_plan_desc:0 "Тщательные планирование и подготовка перед началом боя — залог успеха.\n\n"
 light_tank_flame_chassis:0 "Легкий огнеметный танк"
 light_tank_flame_chassis_desc:0 "Небольшая боевая машина с огнеметом в башне для атаки укреплений и зданий."
