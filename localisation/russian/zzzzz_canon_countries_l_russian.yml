 PZ_OTHER_COUNTRIES_DESC:0 "§YДругие берега, другие судьбы§!\n\nЗа пределами великих держав живут республики, султанаты и союзы общин. Выберите страну на карте или в списке: у каждого острова своя история в мире Песни."
