 PAZ_prophet_advisor:0 "Пророк Пятого Солнца"
 A03_naval_commander_name:0 "Адмирал Ито"
 A03_PACIFIC_START_DESC:0 "§YИмперия Южных морей§!\n\nИз Токио император Мэйдзи правит державой, чью силу олицетворяет флот адмирала Ито. Северная Армия Сайго удерживает Хоккайдо, а Ивасаки правит торговой Осакой. Манила занята, но покорить Филиппины оказалось труднее, чем захватить порт. Для новой экспансии нужна нефть — и взгляды флота обращены к Борнео.\n\n§YНа пороге 1893 года: §!Обеспечить флот топливом и решить судьбу расколотого архипелага."
 A02_CANON_START_DESC:0 "§YКорона над морями§!\n\nЛондон остался по ту сторону Песни. На Мальте Виктория хранит достоинство империи, а адмирал Фишер удерживает её разрозненные владения силой флота. От Гибралтара до Новой Зеландии британские гавани живут торговлей, долгами и надеждой на возвращение.\n\n§YНа пороге 1893 года: §!Удержать морские пути и найти дорогу домой."
 A06_CANON_START_DESC:0 "§YНовый Петербург§!\n\nВ Исландии сохранились император, двор и имя погибшей державы. Александр III ищет будущее для русского изгнания, но Победоносцев видит в модернизации угрозу вере и порядку. Пока спорят о трудах Теслы, нехватка людей становится опаснее любого внешнего врага.\n\n§YНа пороге 1893 года: §!Примирить веру и науку, сохранив народ в изгнании."
 A07_CANON_START_DESC:0 "§YПоследний материк§!\n\nАвстралия пережила гибель старого мира и стала убежищем для тех, кто успел уйти морем. Генри Парксу предстоит связать далёкие поселения в единое государство. Британия остаётся близкой, но японская экспансия и спор с Батавией за Новую Гвинею требуют собственного курса.\n\n§YНа пороге 1893 года: §!Укрепить доминион и защитить его северные рубежи."
 A08_CANON_START_DESC:0 "§YСеверная клятва§!\n\nНа Хоккайдо армия Сайго Такамори хранит собственное представление о судьбе Японии. Военная дисциплина и синтоистская вера противопоставлены власти южного флота и торговых домов Осаки. Архипелаг разделён, но ни один из его правителей не считает раскол окончательным.\n\n§YНа пороге 1893 года: §!Определить место Севера в будущем японском единстве."
 A09_CANON_START_DESC:0 "§YЗолото Осаки§!\n\nВ Осаке власть принадлежит торговле. Ивасаки Яносукэ ведёт республику между императорским флотом и Северной Армией, пока долги Мицубиси сужают свободу выбора. Заводы и морские связи дают силу, но сохранить независимость одним золотом будет трудно.\n\n§YНа пороге 1893 года: §!Превратить торговое влияние в надёжное будущее."
 A05_CANON_START_DESC:0 "§YЖелезная гавань§!\n\nИзгнанники с погибшего американского севера нашли новую опору в Гаване. Адмирал Грейвс держит Железный Союз военной дисциплиной, но Куба разделена между непримиримыми наследниками старого мира. Здесь борьба за острова уже стала войной.\n\n§YНа пороге 1893 года: §!Выстоять в карибской войне и удержать Гавану."
 PCF_CANON_START_DESC:0 "§YПоследние плантации§!\n\nВ центральной Кубе сенатор Борегар собирает наследников американского Юга. Их власть опирается на плантации и старые привилегии, но вокруг сражаются Железный Союз и последователи Пятого Солнца. Спасение от Песни не принесло мира.\n\n§YНа пороге 1893 года: §!Сохранить владения среди враждующих карибских держав."
 PAZ_CANON_START_DESC:0 "§YВ ожидании Пятого Солнца§!\n\nЭрнандес объединил мексиканских изгнанников обещанием возрождения. На востоке Кубы и Эспаньолы военная власть опирается на проповедь Пророка Пятого Солнца. Соседи видят в новом движении угрозу; его последователи — начало иной эпохи.\n\n§YНа пороге 1893 года: §!Удержать союз армии и веры в карибской войне."
 PHR_CANON_START_DESC:0 "§YГолоса Урагана§!\n\nВ Гаити Маман Бриджит ведёт общины, пережившие гибель континентов. Вера связывает их крепче старых законов, но карибская война не оставляет безопасных берегов. За проливами стоят армии, для которых остров — следующая добыча.\n\n§YНа пороге 1893 года: §!Защитить общины и сохранить власть над островом."
 A10_CANON_START_DESC:0 "§YОстрова перед выбором§!\n\nМанила, Батаан и северный Лусон находятся под японской оккупацией. Только Кавите безоговорочно признаёт центральную власть. На остальных островах местные правительства требуют самостоятельности.\n\n§YНа пороге 1893 года: §!Создать конфедерацию республик с общей армией или единую федерацию. Дождаться войны Японии с Нидерландами и вернуть Лусон."
 PLS_CANON_START_DESC:0 "§YВера в горах§!\n\nПосле падения Манилы в горах северного Лусона возникла Католическая Республика. Эмилио Агинальдо ищет силы для борьбы с японскими гарнизонами. Конфедерация может стать союзником, но общая опасность ещё не означает согласия о будущем островов.\n\n§YНа пороге 1893 года: §!Сохранить оплот сопротивления и найти союзников."
 PSL_CANON_START_DESC:0 "§YМежду великими флотами§!\n\nСултан Джамалул Кирам II правит островами, где морские пути важнее сухопутных границ. Сулу не спешит доверять ни Конфедерации, ни Японии. Чужое покровительство обещает защиту, но его цена может оказаться выше военной угрозы.\n\n§YНа пороге 1893 года: §!Сохранить самостоятельность на перекрёстке морских путей."
 PHW_CANON_START_DESC:0 "§YКорона посреди океана§!\n\nКоролевство Калакауа стоит на пересечении тихоокеанских путей. Для великих держав гавайские гавани — желанные опорные пункты; для жителей островов — основа независимой жизни. Далёкие войны всё ближе подходят к этому убежищу.\n\n§YНа пороге 1893 года: §!Сохранить королевство среди соперничающих морских держав."
 PZ_british_admiralty:0 "Корона и Адмиралтейство"
 PZ_british_admiralty_desc:0 "Виктория сохраняет корону, но фактическая власть принадлежит адмиралу Джону Фишеру. Мальта стала убежищем монархов и центром борьбы за морские пути."
 PZ_russian_dual_power:0 "Император и Победоносцев"
 PZ_russian_dual_power_desc:0 "Александр III правит империей в изгнании. Константин Победоносцев оспаривает курс на модернизацию и осуждает исследования Теслы. Их конфликт ещё не разрешён."
 PZ_aztec_prophecy:0 "Пятое Солнце"
 PZ_aztec_prophecy_desc:0 "Генералиссимус Эрнандес опирается на Пророка Пятого Солнца. Военная власть и религиозная проповедь объединяют мексиканских изгнанников."
 PZ_philippine_confederation:0 "Федерация в становлении"
 PZ_philippine_confederation_desc:0 "Правительство в изгнании стремится объединить острова против Японии. Себу и Панай сохраняют собственную власть; Сулу не доверяет центральному правительству."
 A04_CANON_START_DESC:0 "§YЦена спасения§!\n\nУ Всемирной торговой палаты нет империи на карте — её власть записана в долговых книгах. Из Фуншала директор Ламберт связывает острова кредитами, складами и торговыми договорами. Каждая новая война угрожает морским путям; каждая новая технология может обесценить старые долги.\n\n§YНа пороге 1893 года: §!Сохранить влияние в мире, который готовится измениться."
 PSY_CANON_START_DESC:0 "§YЗанзибар в изгнании§!\n\nНаследник Баргаша перенёс султанскую власть на Сейшелы. Океан защитил новый двор от Песни, но отрезал его от прежних владений. Между торговлей и памятью об утраченном доме предстоит найти опору для будущего.\n\n§YНа пороге 1893 года: §!Укрепить островное убежище султаната."
 PCB_CANON_START_DESC:0 "§YГавань торговых домов§!\n\nСовет торговых домов Себу ценит открытые гавани и собственную власть. Конфедерация зовёт остров под общее знамя, а японское продвижение угрожает привычным торговым связям. Нейтралитет становится всё более дорогим выбором.\n\n§YНа пороге 1893 года: §!Сохранить торговлю и определить отношения с Конфедерацией."
 PPN_CANON_START_DESC:0 "§YСоюз общин§!\n\nНа Панае совет касиков удерживает союз аграрных общин. Здесь не желают менять местную свободу на распоряжения далёкой столицы, но море уже не гарантирует безопасности. Будущее Конфедерации зависит и от решения этого острова.\n\n§YНа пороге 1893 года: §!Защитить общины и их право на собственный путь."
