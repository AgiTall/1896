l_russian:
 A01_crown.1.t:0 "Последний ультиматум Большого совета"
 A01_crown.1.d:0 "За закрытыми дверями адмиралы и островные вельможи требуют права блокировать указы и назначать министров. Гвардия ждёт приказа Королевы. От сегодняшнего решения зависит, станет ли монархия договором с Советом или властью нового двора."
 A01_crown.1.a:0 "Признать право Совета на назначения"
 A01_crown.1.b:0 "Заключить соглашение о разделении власти"
 A01_crown.1.c:0 "Гвардия напомнит им, кому они присягали"
 A01_crown.2.t:0 "Петиции Большого совета"
 A01_crown.2.d:0 "Совет задерживает новые назначения и требует уступок по бюджету. Двор предлагает обойти его прямым обращением к населению. Пока основной закон не принят, спор о власти будет возвращаться."
 A01_crown.2.a:0 "Дать Совету место за столом"
 A01_crown.2.b:0 "Обратиться к подданным напрямую"
 A01_crown.3.t:0 "Заговор в коридорах дворца"
 A01_crown.3.d:0 "Влияние двора стало почти безграничным. Несколько членов Совета тайно обсуждают отстранение королевских министров. Можно отступить ради соглашения или поручить гвардии арестовать заговорщиков, заплатив за это политическим кризисом."
 A01_crown.3.a:0 "Вернуть Совету часть полномочий"
 A01_crown.3.b:0 "Арестовать заговорщиков"
 A01_crown_struggle_desc:0 "Уравновесьте двор и Совет для Конституции (−40%…+40%) либо добейтесь 60% влияния Королевы для полной власти. Сильный Совет блокирует управление; чрезмерная власть двора грозит заговором."
 A01_crown_audiences_desc:0 "Публичные аудиенции: +15 пунктов влияния Королевы, +2% стабильности. Повтор через 60 дней."
 A01_council_concessions_desc:0 "Согласование бюджета: −15 пунктов влияния Королевы. Часть политических расходов вернётся."
 A01_guard_oaths_desc:0 "Присяга гвардии: +20 пунктов влияния Королевы и 10 опыта армии, но −2% стабильности."
 A01_crown_compromise_desc:0 "Комиссия сдвинет баланс на 20 пунктов к центру и даст +3% стабильности."
 A10_japanese_settlement:0 "Мир с Японией"
 A10_offer_archipelago_peace:0 "Предложить мир: свободный архипелаг"
 A10_offer_archipelago_peace_desc:0 "Япония вытеснена с архипелага. Предложить признание освобождения её владений, включая Манилу, Батаан, северный Лусон и Палаван. Контроль наших участников Конфедерации учитывается. Япония может отказать."
 A10_offer_manila_peace:0 "Предложить мир: Манильский компромисс"
 A10_offer_manila_peace_desc:0 "Мы удерживаем Манилу, а северный Лусон и Батаан остаются под японским контролем. Предложить мир с передачей Манилы; северный Лусон, Батаан и остальные японские владения останутся Японии."
 A10_settlement.1.t:0 "Филиппинское мирное предложение"
 A10_settlement.1.d:0 "Наши гарнизоны вытеснены с Филиппинского архипелага. Правительство островов предлагает прекратить войну и признать передачу освобождённых японских владений тем, кто их удерживает. Это предложение касается только филиппинского фронта."
 A10_settlement.2.t:0 "Предложение Манильского компромисса"
 A10_settlement.2.d:0 "Филиппинцы удерживают Манилу и предлагают мир в обмен на признание её освобождения. Северный Лусон, Батаан и прочие владения останутся за Японией."
 A10_settlement.accept:0 "Принять условия"
 A10_settlement.reject:0 "Продолжить войну"
 A10_settlement.3.t:0 "Архипелаг свободен"
 A10_settlement.3.d:0 "Япония признала освобождение своих филиппинских владений. Мир подписан, а участники Конфедерации сохраняют освобождённые ими области."
 A10_settlement.3.a:0 "Острова отстояли свободу"
 A10_settlement.4.t:0 "Манильский компромисс"
 A10_settlement.4.d:0 "Манила признана свободной, и война окончена. Северный Лусон и Батаан остаются за Японией — тяжёлая цена за сегодняшний мир."
 A10_settlement.4.a:0 "Сохранить достигнутое"
 A10_settlement.5.t:0 "Япония отклонила условия"
 A10_settlement.5.d:0 "Токио отказалось подписать договор. Война продолжается. Новое предложение можно направить после окончания дипломатической паузы."
 A10_settlement.5.a:0 "Продолжить борьбу"
