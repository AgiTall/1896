 rosantism_1:0 "Свободный Розантизм"
 rosantism_1_desc:0 "Это морская идеология свободы, возникшая среди капитанов, изгнанников и островных народов, отказавшихся подчиняться торговым союзам и морским монополиям. Сторонники розантизма считают, что ни одна держава не должна владеть морями, а острова и гавани должны быть свободны от внешнего господства. Красная Роза для них является символом сопротивления и взаимной помощи между свободными портами, а её капитаны — союзниками, но не правителями. Их цель — разрушить торговые монополии и создать сеть независимых морских государств, где власть принадлежит местным общинам и капитанам."
 
 rosantism_2:0 "Императорский Розантизм"
 rosantism_2_desc:0 "Имперский розантизм утверждает, что свобода морей может существовать только под защитой сильной власти. После долгих лет борьбы сторонники этой идеи пришли к выводу, что разрозненные флотилии не способны противостоять крупным торговым державам. Поэтому капитаны Красной Розы признают верховную власть Императора Розы — правителя и верховного командующего объединённого флота. Под его знаменем островные государства и флотилии объединяются в единый союз, целью которого является уничтожение торговых монополий и установление нового порядка на морях."

