l_russian:
 A10D_workshop_islands:0 "Островки ремесла"
 A10D_workshop_islands_desc:0 "Малые мастерские спасли ремёсла после Исхода, но общих чертежей, запасных частей и устойчивых заказов пока нет."
 A10D_separate_quartermasters:0 "Провинциальные интенданты"
 A10D_separate_quartermasters_desc:0 "Местные склады снабжают свои гарнизоны. Соседний полк часто получает чужой калибр и не знает расписания судов."
 A10D_shipping_shortage:0 "Перебои островного снабжения"
 A10D_shipping_shortage_desc:0 "Резерв перевозок ниже 20. Недостаток сухих складов, лодок и рисовых запасов задерживает военные и гражданские грузы. Почтовые паромы, амбары и решения о доставке риса восстановят сообщение."
 A10D_strained_shipping:0 "Перегруженные паромные линии"
 A10D_strained_shipping_desc:0 "Резерв перевозок от 20 до 49. Любая поломка парохода задерживает рис, почту и армейские грузы. При резерве 50 задержки прекратятся."
 A10D_reliable_shipping:0 "Надёжное островное сообщение"
 A10D_reliable_shipping_desc:0 "При резерве не ниже 80 острова располагают запасными командами, сухими складами и судами на случай шторма."
 A10D_workshop_network:0 "Сеть провинциальных мастерских"
 A10D_workshop_network_desc:0 "Чертежи и взаимные заказы соединяют провинциальные мастерские, сохраняя местное ремесло."
 A10D_abaca_exports:0 "Канат для океанских флотов"
 A10D_abaca_exports_desc:0 "Кооперативы абаки обеспечивают канатные дворы сырьём и получают устойчивую долю экспортного дохода."
 A10D_sugar_standards:0 "Честные сахарные весы"
 A10D_sugar_standards_desc:0 "Единый вес и проверенное качество облегчают торговлю, а сохранённые рисовые поля защищают общины от неурожая."
 A10D_granary_network:0 "Общественные рисовые амбары"
 A10D_granary_network_desc:0 "Сухие общественные амбары позволяют пережить задержку судов без немедленного голода."
 A10D_district_medicine:0 "Уездная медицина"
 A10D_district_medicine_desc:0 "Небольшие лечебницы готовят санитаров и возвращают раненых в строй."
 A10D_public_health:0 "Чистая вода островов"
 A10D_public_health_desc:0 "Водозаборы, карантины и обученные санитары уменьшают потери от болезней в семьях и гарнизонах."
 A10D_teacher_colleges:0 "Провинциальные учительские семинарии"
 A10D_teacher_colleges_desc:0 "Учителя объясняют счёт и грамоту на языках общин и готовят учеников к техническому образованию."
 A10D_island_telegraph:0 "Телеграф между пристанями"
 A10D_island_telegraph_desc:0 "Сигнальные посты и местные кабели быстро передают распоряжения, цены и предупреждения о штормах."
 A10D_polytechnic:0 "Островной политехникум"
 A10D_polytechnic_desc:0 "Училище готовит мастеров, химиков и землемеров для самостоятельного островного хозяйства."
 A10D_common_market:0 "Рынок тысячи пристаней"
 A10D_common_market_desc:0 "Надёжное сообщение и общие меры связывают местные рынки, не уничтожая их многообразия."
 A10D_standard_stores:0 "Упорядоченные полковые склады"
 A10D_standard_stores_desc:0 "Общие ведомости и разделённые по системам винтовок склады уменьшают потери боеприпасов."
 A10D_pilot_stations:0 "Лоцманские станции проливов"
 A10D_pilot_stations_desc:0 "Знание течений и сигнальные огни помогают кораблям держать строй у родных берегов."
 A10D_coastal_defence:0 "Укрытые береговые батареи"
 A10D_coastal_defence_desc:0 "Береговые расчёты держат под наблюдением подходы к важнейшим пристаням."
 A10D_pack_columns:0 "Вьючные колонны гарнизонов"
 A10D_pack_columns_desc:0 "Подготовленные тропы, мулы и лодки доставляют грузы через горы и мангровые заросли."
 A10D_staff_school:0 "Штабная школа островов"
 A10D_staff_school_desc:0 "Офицеры учатся согласовывать марш, приливы и разгрузку запасов."
 A10D_ammunition_contracts:0 "Круглогодичные оружейные заказы"
 A10D_ammunition_contracts_desc:0 "Мастерские выполняют постоянные заказы на патроны и запасные части вместо лихорадочных закупок перед каждой тревогой."
 A10D_escort_service:0 "Служба прибрежных конвоев"
 A10D_escort_service_desc:0 "Дозорные флотилии прикрывают паромные линии и вовремя предупреждают о появлении крупных сил."
 A10D_landing_staff:0 "Штаб островных высадок"
 A10D_landing_staff_desc:0 "Совместные учения научили штаб рассчитывать ограниченную высадку и снабжение первого эшелона."
 A10D_monsoon_damage:0 "Повреждённые тайфуном пристани"
 A10D_monsoon_damage_desc:0 "Шторм повредил склады и причалы. Срочная починка пристаней сократит перебои, а обычные работы завершат восстановление за сезон."
 A10D_evening_classes:0 "Вечерние занятия при мастерских"
 A10D_evening_classes_desc:0 "Учителя и мастера ведут временные вечерние курсы для учеников, занятых днём на производстве."
 A10D_tools_programme:0 "Провинциальная закупка инструментов"
 A10D_tools_programme_desc:0 "Оплаченная партия инструментов помогает мастерским освоить новые заказы."
 A10D_volunteer_orderlies:0 "Добровольные санитарные дружины"
 A10D_volunteer_orderlies_desc:0 "Общины оплатили материалы и подготовку добровольных санитаров на ближайший сезон."
 A10D_war_collections:0 "Общинные военные сборы"
 A10D_war_collections_desc:0 "Сборы для семей призванных укрепляют поддержку войны, но требуют части гражданского выпуска."
 A10D_development:0 "Хозяйство и оборона архипелага"
 A10D_development_desc:0 "Резерв островных перевозок: §Y[?A10D_supply|0]/100§!.\nНиже §Y20§! — тяжёлые перебои; §Y20–49§! — перегруженные линии; §Y50–79§! — обычное сообщение; от §Y80§! — надёжные резервные маршруты.\nРезерв учитывает лодки, сухие склады, экипажи и рис для рейсов. Работы, закупки и учения меняют его отдельно от государственного долга перед ВТП."
 A10D_hire_coastal_boats:0 "Нанять прибрежные лодки"
 A10D_hire_coastal_boats_desc:0 "Трёхнедельный договор с рыбаками и лодочниками восстановит малые рейсы. После завершения работ резерв перевозок вырастет на 12."
 A10D_buy_reserve_rice:0 "Закупить рис для паромных линий"
 A10D_buy_reserve_rice_desc:0 "Оплатим продовольствие для команд и складов, временно отвлекая часть гражданских товаров. Через 21 день резерв перевозок вырастет на 12."
 A10D_repair_typhoon_quays:0 "Восстановить штормовые пристани"
 A10D_repair_typhoon_quays_desc:0 "Направим плотников и плавучие краны в пострадавшие гавани. Через 35 дней повреждённые пристани вернутся в строй, а резерв перевозок вырастет на 20."
 A10D_export_rope_contract:0 "Выполнить канатный контракт"
 A10D_export_rope_contract_desc:0 "Кооперативы займут часть перевозок экспортным грузом: резерв сразу снизится на 10. Через месяц выручка в 65 политической власти пополнит общественные кассы."
 A10D_purchase_provincial_tools:0 "Оплатить инструменты провинциям"
 A10D_purchase_provincial_tools_desc:0 "Закупка и доставка потребуют 10 резерва перевозок. Через 45 дней мастерские получат инструменты и на 120 дней ускорят освоение производства."
 A10D_evening_literacy:0 "Провести вечерние занятия"
 A10D_evening_literacy_desc:0 "Учителя выедут в портовые мастерские. Доставка пособий потребует 5 резерва; через 35 дней начнутся курсы, помогающие исследованиям в течение 120 дней."
 A10D_garrison_field_drills:0 "Провести гарнизонные учения"
 A10D_garrison_field_drills_desc:0 "Учебные стрельбы израсходуют 150 винтовок и 5 резерва перевозок на износ оружия и снабжение. Через 21 день офицеры принесут 8 опыта армии."
 A10D_train_volunteer_orderlies:0 "Подготовить санитарные дружины"
 A10D_train_volunteer_orderlies_desc:0 "Материалы и поездки потребуют 5 резерва. Через месяц санитарные дружины будут помогать возвращать раненых в строй в течение 120 дней."
 A10D_collect_for_soldiers_families:0 "Организовать сбор для семей солдат"
 A10D_collect_for_soldiers_families_desc:0 "Помощь семьям призванных требует 10 резерва и на 90 дней отвлекает гражданские товары. Через 35 дней поддержка войны вырастет на 4 процентных пункта."
 A10D_emergency_shipping_levy:0 "Объявить чрезвычайный найм судов"
 A10D_emergency_shipping_levy_desc:0 "Срочный наём частных судов вызовет недовольство торговцев: стабильность сразу снизится на 2 процентных пункта. Через месяц флот получит 8 транспортов, а резерв вырастет на 20."
 A10D_restore_peacetime_routes:0 "Вернуть мирные расписания"
 A10D_restore_peacetime_routes_desc:0 "Вернём почтовые паромы к гражданским рейсам, проверим склады и отремонтируем лодки. Через 45 дней резерв вырастет на 15, стабильность — на 1 процентный пункт."
 A10D_development.1.t:0 "Сколько лодок между островами?"
 A10D_development.1.d:0 "На стол съезда легли три несовпадающие ведомости судов. В одной считают только пароходы, в другой — лодки сборщиков пошлин, в третьей — всё, что когда-либо вышло из гавани. За каждой ошибкой стоят недоставленный мешок риса и гарнизон, напрасно ждущий патроны. Капитаны предлагают начать с оплаченной проверки рейсов."
 A10D_development.1.a:0 "Оплатить проверку рейсов"
 A10D_development.1.b:0 "Пусть общины сверят списки"
 A10D_development.2.t:0 "Тайфун над паромными линиями"
 A10D_development.2.d:0 "Утренние донесения принесли вести о сорванных кровлях, затопленных рисовых складах и нескольких выброшенных на берег лодках. Самые важные пристани уцелели, но почтовые рейсы отменены. Провинциальные плотники просят прислать инструменты до следующего прилива."
 A10D_development.2.a:0 "Выделить средства плотникам"
 A10D_development.2.b:0 "Ввести временные рисовые пайки"
 A10D_development.3.t:0 "Ведомость трёх пристаней"
 A10D_development.3.d:0 "Переписчики вернулись с неожиданным выводом: одни и те же лодки записаны на трёх разных пристанях, зато целые рыбацкие поселения отсутствуют в ведомостях. Теперь у съезда есть основа для расписаний и перечень общин, которым первой понадобится помощь при шторме."
 A10D_development.3.a:0 "Начать с рисовых складов"
 A10D_development.3.b:0 "Обнародовать полную ведомость"
 A10D_development.4.t:0 "Санитар с соседнего острова"
 A10D_development.4.d:0 "Первая лечебница прислала благодарность паромной команде: санитар успел к началу лихорадки, а не после похорон. В небольших палатах ещё не хватает коек, но лекари уже договариваются о курсах для добровольцев и единых карантинных свидетельствах."
 A10D_development.4.a:0 "Поддержать добровольные курсы"
 A10D_development.4.b:0 "Сначала обеспечить чистую воду"
 A10D_development.5.t:0 "Капитаны просят письменный договор"
 A10D_development.5.d:0 "Список судов резерва готов. Капитаны согласны перевозить солдат и припасы, но напоминают: на тех же судах острова получают рис. Они просят заранее определить вознаграждение и оставить часть расписания гражданским рейсам."
 A10D_development.5.a:0 "Закрепить гражданские рейсы в договоре"
 A10D_development.5.b:0 "Оплатить дополнительные учебные рейсы"
 A10D_development.6.t:0 "Первый общий торговый сезон"
 A10D_development.6.d:0 "Сахар и абака дошли до покупателей без прежних недельных задержек. В портовых лавках появились инструменты из соседних провинций, а школьные тетради привезли тем же рейсом, что и запасные части для мельницы. Местные газеты впервые пишут об общем хозяйстве островов как о повседневном деле."
 A10D_development.6.a:0 "Укрепить общественные запасы"
 A10D_development.6.b:0 "Оплатить новые производственные заказы"
 A10D_rifle_studies:0 "Полковые оружейные ведомости"
 A10D_light_vessels:0 "Опыт канонерских команд"
 A10D_export_bureau:0 "Островное экспортное бюро"
 A10D_export_bureau_desc:0 "Общие весовые ведомости и телеграфные сводки позволяют договариваться с покупателями от имени нескольких портов. Экспортное бюро сведёт разрозненные заказы и закрепит за торговыми рейсами место в островном расписании."
 A10D_island_industry:0 "Промышленность архипелага"
 A10D_island_industry_desc:0 "Мастерские, технические училища и общий рынок больше не существуют порознь. Острова могут строить собственные предприятия, готовить инженеров и снабжать гарнизоны без ожидания каждой новой партии заморских изделий."
 A10D_mountain_infantry:0 "Пехота гор и джунглей"
 A10D_mountain_infantry_desc:0 "Жители горных селений знают тропы, которых нет на штабных картах. Добровольцы научат полки передвигаться по склонам и влажному лесу, беречь порох и не отрываться от вьючных колонн."
 A10D_signal_corps:0 "Корпус связи архипелага"
 A10D_signal_corps_desc:0 "Полевые связисты соединят штабные карты с телеграфом пристаней. Согласованные сигналы, курьеры и кабельные посты помогут командирам вовремя узнавать о задержках судов и движении соседних частей."
 A10D_war_fleet:0 "Флот для защиты островов"
 A10D_war_fleet_desc:0 "Верфи, морские школы и десантный штаб должны работать по одному плану. Опираясь на собственную промышленность, Конфедерация сможет готовить эскортные команды и перевозить войска под защитой военных судов."
 A10D_jungles:0 "Опыт горных и лесных отрядов"
