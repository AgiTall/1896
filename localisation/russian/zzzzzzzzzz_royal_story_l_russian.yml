l_russian:
 A01_sultans_at_the_palace:0 "Султаны у дворцового стола"
 A01_sultans_at_the_palace_desc:0 "Султаны готовы признать корону, но не нового генерал-губернатора под другим именем. Их делегации требуют ответа: кто собирает налоги, назначает судей и командует гарнизонами?"
 A01_indonesian_petition:0 "Петиция индонезийцев"
 A01_indonesian_petition_desc:0 "Учителя, портовые рабочие и ветераны требуют места рядом с князьями. Государство не удержится на договоре только с наследственными дворами."
 A01_equal_subjects:0 "Подданные становятся гражданами"
 A01_equal_subjects_desc:0 "Отменить отдельные гражданские разряды и открыть государственную службу индонезийцам. Придётся оплатить школы переводчиков и защитить реформу от колониальных собственников."
 A01_princely_guarantees:0 "Гарантии наследственных дворов"
 A01_princely_guarantees_desc:0 "Местное право и престолонаследие остаются за султанами; общий суд защищает жителей от произвольных поборов. Султаны получат влияние, но лишатся права закрывать дорогу гражданскому представительству."
 A01_island_compact:0 "Договор короны и архипелага"
 A01_island_compact_desc:0 "Земли, остающиеся под нашим управлением, получат согласованное устройство. Можно выпустить султанаты как автономных союзников или сохранить единую администрацию с местными хартиями. Японские владения и концессии договор не отменяет."
 A01_royal_commission:0 "Королевская комиссия по поражению"
 A01_royal_commission_desc:0 "Кто приказал оставить склады без прикрытия? Почему контракты получили родственники адмиралов? Открытое следствие даст доказательства, но Совет может приказать уничтожить архивы."
 A01_win_the_captains:0 "Отделить капитанов от Совета"
 A01_win_the_captains_desc:0 "Мы выступаем против политического диктата, а не против морской службы. Гарантируем жалованье, пенсии и продвижение офицерам, которые признают гражданский контроль."
 A01_admirals_on_trial:0 "Адмиралы перед судом"
 A01_admirals_on_trial_desc:0 "Предъявить доказательства парламентским юристам и добиться персональных приговоров. Медленное следствие сохранит флот, но потребует трёх комплектов доказательств и поддержки капитанов."
 A01_purge_the_admiralty:0 "Ночь закрытых адмиралтейств"
 A01_purge_the_admiralty_desc:0 "Гвардия займёт министерство и арестует руководителей Совета. Двух лояльных групп капитанов хватит, чтобы удержать гавани; массовые отстранения временно нарушат работу флота."
 A01_admirals_retirement:0 "Пенсия вместо политического вето"
 A01_admirals_retirement_desc:0 "Купить согласие на роспуск Совета гарантиями пенсий и неприкосновенности. Уходящие адмиралы сохранят связи в закупках: договор ещё придётся пересмотреть."
 A01_civilian_admiralty:0 "Морское министерство вместо Совета"
 A01_civilian_admiralty_desc:0 "Министр отвечает за бюджет перед гражданской властью, штаб занимается операциями. Победить адмиралов недостаточно: нужно создать учреждение, которое не станет новым Советом."
 A01_guard_academy:0 "Академия королевской гвардии"
 A01_guard_academy_desc:0 "Совместная подготовка голландских и индонезийских офицеров превратит дворцовую охрану в профессиональный корпус. Присяга связывает его с государством и короной."
 A01_royal_academies:0 "Королевские институты архипелага"
 A01_royal_academies_desc:0 "Учредить инженерный институт, школу гражданской службы и службу переводов. Учебные места откроются жителям островов, а не только семьям администрации."
 A01_capital_of_two_worlds:0 "Столица двух миров"
 A01_capital_of_two_worlds_desc:0 "В изгнании столица стала домом короны. Построим правительственный квартал и предложим городу имя Новый Амстердам. Городской совет вправе сохранить Батавию или выбрать двойное название."
 A01_electoral_act:0 "Избирательный закон архипелага"
 A01_electoral_act_desc:0 "Определить устройство выборов: территориальный компромисс с князьями или равное гражданское представительство. Обе системы дадут парламенту право утверждать премьер-министра."
 A01_first_royal_election:0 "Первые выборы при короне"
 A01_first_royal_election_desc:0 "Начинается 90-дневная кампания. Конституционный союз, партия порядка и индонезийская коалиция борются за большинство. Поддержка дворов и гражданские права повлияют на исход; агитация доступна в решениях."
 A01_responsible_cabinet:0 "Премьер-министр отвечает парламенту"
 A01_responsible_cabinet_desc:0 "Королева утверждает выбранного парламентом главу кабинета. Министры получают бюджетную ответственность, оппозиция — право запросов. Программа правительства зависит от победителя выборов."
 A01_reform_procurement:0 "Разорвать адмиральские контракты"
 A01_reform_procurement_desc:0 "Открытые тендеры заменят семейные соглашения. Пенсионный договор будет исполнен, но бывший Совет утратит контроль над закупками."
 A01_island_officer_commissions:0 "Офицерские патенты для островитян"
 A01_island_officer_commissions_desc:0 "Откроем высшие командные должности индонезийцам. Султанские отряды и КНИЛ получат общую программу подготовки без ликвидации местных армий."
 A01_royal_development_bank:0 "Королевский банк развития"
 A01_royal_development_bank_desc:0 "Совместные займы оплатят дороги и училища. Инвестиции поступят в земли короны и автономные султанаты; японские владения останутся за пределами программы."
 A01_crown_provincial_diets:0 "Провинциальные собрания при короне"
 A01_crown_provincial_diets_desc:0 "Даже указу нужна обратная связь. Создадим совещательные собрания островов с выборными гражданскими делегатами. Они не назначают кабинет, но могут оспаривать действия чиновников."
 A01_renew_the_fleet:0 "Флот после политической бури"
 A01_renew_the_fleet_desc:0 "Вернуть профессиональные экзамены, подготовить новых штабистов и закрыть вакансии. Реабилитация невиновных восстановит доверие; политические полномочия Совета не вернутся."
 A01_open_seas_kingdom:0 "Королевство открытых морей"
 A01_open_seas_kingdom_desc:0 "Будущее Нидерландов — торговое содружество, а не вечный реванш. Гарантируем автономным дворам рынки и морскую защиту, направив средства на мирное развитие."
 A01_homeland_in_exile:0 "Нидерланды живут в изгнании"
 A01_homeland_in_exile_desc:0 "Сохранить память о потерянной метрополии, поддержать беженцев и готовить флот возвращения. Освобождение потребует сил и подходящего момента: один указ не вернёт родину."
 A01_archipelago_great_power:0 "Держава архипелага"
 A01_archipelago_great_power_desc:0 "Признать, что будущее страны находится на островах. Общая оборона и равный доступ к командованию дадут опору новой тихоокеанской державе, но военный бюджет потребует жертв."
 A01_admiralty_obstruction:0 "Обструкция адмиралов"
 A01_admiralty_obstruction_desc:0 "Закупки задерживаются, капитаны получают противоречивые приказы. Завершите борьбу через суд, чистку или соглашение."
 A01_purged_fleet:0 "Флот после чистки"
 A01_purged_fleet_desc:0 "Отстранения оставили штабные вакансии. Через год флот восстановится; специальный фокус может ускорить восстановление."
 A01_admiralty_pensions:0 "Цена адмиральской отставки"
 A01_admiralty_pensions_desc:0 "Бывшие адмиралы получают пенсии и сохраняют закупочные связи. Парламент может пересмотреть контракты."
 A01_civilian_justice:0 "Гражданский суд над властью"
 A01_civilian_justice_desc:0 "Личная ответственность офицеров установлена судом, а не массовыми отстранениями."
 A01_civilian_navy_ministry:0 "Королевское морское министерство"
 A01_civilian_navy_ministry_desc:0 "Военный штаб отделён от гражданского бюджета. Адмиральского политического вето больше нет."
 A01_equal_citizenship_royal:0 "Общее гражданство"
 A01_equal_citizenship_royal_desc:0 "Голландцы и индонезийцы получают равный доступ к гражданской службе и командованию."
 A01_princely_compact:0 "Договор с княжескими дворами"
 A01_princely_compact_desc:0 "Корона гарантирует местное право и престолонаследие, а дворы признают общий суд."
 A01_island_discontent:0 "Острова ждут ответа"
 A01_island_discontent_desc:0 "Петиция отложена. Снять недовольство можно общим гражданством или представительством."
 A01_guard_academy_idea:0 "Школа королевской гвардии"
 A01_guard_academy_idea_desc:0 "Общий офицерский корпус готовит голландских и индонезийских кадетов."
 A01_royal_academies_idea:0 "Королевские институты"
 A01_royal_academies_idea_desc:0 "Инженеры, переводчики и гражданские служащие получают образование в самом архипелаге."
 A01_island_commissions:0 "Общий офицерский корпус"
 A01_island_commissions_desc:0 "Доступ к командованию определяется подготовкой, а не происхождением."
 A01_development_bank:0 "Банк развития архипелага"
 A01_development_bank_desc:0 "Общие кредиты финансируют дороги, школы и местные предприятия."
 A01_responsible_cabinet_idea:0 "Ответственный кабинет"
 A01_responsible_cabinet_idea_desc:0 "Королева назначает премьер-министра по парламентскому большинству. Бюджет требует одобрения депутатов."
 A01_open_procurement:0 "Открытые государственные заказы"
 A01_open_procurement_desc:0 "Общественный контроль ограничивает семейные флотские контракты."
 A01_provincial_diets:0 "Провинциальные собрания"
 A01_provincial_diets_desc:0 "Гражданские делегаты контролируют чиновников при сохранении королевского кабинета."
 A01_open_seas_idea:0 "Корона торговых морей"
 A01_open_seas_idea_desc:0 "Торговля, гражданское строительство и договорные отношения определяют курс королевства."
 A01_exile_mission:0 "Миссия королевства в изгнании"
 A01_exile_mission_desc:0 "Беженцы сохраняют институты потерянной родины; верфи готовят флот возвращения."
 A01_archipelago_power:0 "Тихоокеанская корона"
 A01_archipelago_power_desc:0 "Общая оборона островов стала главным делом государства."
 A01_pm_constitutional:0 "Маттейс ван Рейн — Конституционный союз"
 A01_pm_constitutional_desc:0 "Кабинет торговых городов и юристов: открытый бюджет, инженерные школы и гражданская служба."
 A01_pm_order:0 "Хендрик ван дер Велде — Партия порядка"
 A01_pm_order_desc:0 "Кабинет умеренных монархистов и княжеских делегатов: местные гарантии и морская безопасность."
 A01_pm_indonesian:0 "Раден Сурья — Индонезийская коалиция"
 A01_pm_indonesian_desc:0 "Кабинет гражданских делегатов островов: училища, равные назначения и развитие внутренних округов."
 A01_royal_story.1.t:0 "Четыре двора и одна корона"
 A01_royal_story.1.d:0 "За столом лежат разные проекты хартий. Султанские послы требуют местных налогов и неприкосновенности престолов. Министры предлагают общий бюджет обороны. Эмма замечает, что договор должен защищать не только дворцы, но и тех, кто платит налоги. Можно обещать широкое самоуправление или начать с общей таможни."
 A01_royal_story.1.a:0 "Гарантировать местное самоуправление."
 A01_royal_story.1.b:0 "Сначала общий бюджет и таможня."
 A01_royal_story.2.t:0 "Кто представляет Индонезию?"
 A01_royal_story.2.d:0 "На ступенях дворца учитель читает петицию на малайском, затем переводит её на голландский. Подписанты не просят новых князей: они хотят суд, школу и право стать офицером. Султанские делегаты опасаются, что гражданская палата вытеснит их дворы. Короне предстоит признать обе стороны или отложить решение."
 A01_royal_story.2.a:0 "Гражданские делегаты получат места."
 A01_royal_story.2.b:0 "Сначала договоримся с дворами."
 A01_royal_story.3.t:0 "Подписи под островным договором"
 A01_royal_story.3.d:0 "На столе два приложения. Первое учреждает автономные султанаты с собственной администрацией и общей обороной под короной. Второе сохраняет единую страну, но закрепляет местное право, гражданское представительство и налоговые гарантии. Передавать можно только земли, которыми мы владеем. Японские права на Борнео сохраняются."
 A01_royal_story.3.a:0 "Автономные султанаты под общей короной."
 A01_royal_story.3.b:0 "Единая страна, гарантированные хартии."
 A01_royal_story.4.t:0 "Архив, который приказали сжечь"
 A01_royal_story.4.d:0 "Секретарь морского ведомства приносит копии контрактов и приказ о сожжении оригиналов. Адмиралы называют документы подделкой. Публичное слушание убедит гражданских делегатов; тайная проверка поможет защитить свидетелей. Обоим путям нужны дополнительные доказательства."
 A01_royal_story.4.a:0 "Открыть слушания."
 A01_royal_story.4.b:0 "Сначала защитить свидетелей."
 A01_royal_story.5.t:0 "Приговор не должен стать местью"
 A01_royal_story.5.d:0 "Суд установил ответственность руководителей Совета за сокрытие контрактов и вмешательство в гражданское управление. Капитаны ждут решения о рядовых офицерах. Ограниченные приговоры сохранят опыт; расширенное следствие усилит корону, но потребует ещё одной перестройки штаба."
 A01_royal_story.5.a:0 "Наказывать только доказанные преступления."
 A01_royal_story.5.b:0 "Проверить весь высший штаб."
 A01_royal_story.6.t:0 "Утро без Совета"
 A01_royal_story.6.d:0 "Гвардия опечатала адмиралтейства. Арестованные руководители лишены политических должностей, но под подозрение попали десятки капитанов. Одни требуют немедленного суда, другие — бесконечной проверки лояльности. Флоту уже не хватает штабистов."
 A01_royal_story.6.a:0 "Ограничить чистку руководителями заговора."
 A01_royal_story.6.b:0 "Продолжить проверку лояльности."
 A01_royal_story.7.t:0 "Кому принадлежит победа?"
 A01_royal_story.7.d:0 "Адмиральское политическое вето отменено. Но гвардия, гражданские делегаты и султанские дворы по-разному понимают новый порядок. Королева может закрепить разграничение полномочий или опереться на личную присягу. Это решение задаст условия конституционного либо абсолютного пути."
 A01_royal_story.7.a:0 "Победа закона: подготовить конституцию."
 A01_royal_story.7.b:0 "Победа короны: министры служат королеве."
 A01_royal_story.8.t:0 "Как зовётся столица?"
 A01_royal_story.8.d:0 "Новый правительственный квартал открыт. Придворные предлагают Новый Амстердам — память о потерянной родине. Городской совет напоминает о торговцах, кварталах и языках, для которых Батавия давно стала домом. Корона может выбрать новое имя, сохранить старое или признать оба."
 A01_royal_story.8.a:0 "Новый Амстердам — столица короны."
 A01_royal_story.8.b:0 "Батавия — имя нашего общего города."
 A01_royal_story.8.c:0 "Новый Амстердам — Батавия."
 A01_NEW_AMSTERDAM:0 "Новый Амстердам"
 A01_DUAL_CAPITAL:0 "Новый Амстердам — Батавия"
 A01_royal_story.9.t:0 "Острова считают голоса"
 A01_royal_story.9.d:0 "Княжеские делегаты требуют территориальных гарантий, иначе малые острова потеряются за населением Явы. Гражданская коалиция требует равного голоса. Конституционный союз предлагает компромисс. Выбранный закон изменит начальную поддержку партий; агитация сможет изменить результат."
 A01_royal_story.9.a:0 "Территориальные гарантии и гражданская палата."
 A01_royal_story.9.b:0 "Равное гражданское представительство."
 A01_royal_story.10.t:0 "Кампания без адмиральского вето"
 A01_royal_story.10.d:0 "Газеты печатают программы трёх блоков. Конституционный союз обещает открытый бюджет, Партия порядка — гарантии дворам и сильный флот, Индонезийская коалиция — школы и равные назначения. До голосования 90 дней. В решениях можно поддержать кампанию; каждый блок доступен для агитации раз в 30 дней."
 A01_royal_story.10.a:0 "Пусть избиратели решат."
 A01_royal_story.11.t:0 "Королева принимает премьер-министра"
 A01_royal_story.11.d:0 "Премьер-министр — §Y[Root.GetA01RoyalPremier]§!. Председатель палаты приносит результаты выборов. Победивший блок получил право сформировать кабинет; его программа показана отдельным национальным духом. Королева утверждает назначение и требует соблюдения конституции. Следующая кампания начнётся через два года. При равной поддержке преимущество получает индонезийская коалиция, затем партия порядка — правило согласовано избирательной комиссией заранее."
 A01_royal_story.11.a:0 "Назначить кабинет и открыть сессию."
 A01_royal_story.12.t:0 "Корона на торговых путях"
 A01_royal_story.12.d:0 "Новая доктрина ставит безопасность перевозок и развитие островов выше походов за престижем. Дворы получают рынки, граждане — рабочие места. Военные предупреждают, что этот выбор уменьшит общественную готовность к войне."
 A01_royal_story.12.a:0 "Море должно соединять."
 A01_royal_story.13.t:0 "Родина на картах школьных классов"
 A01_royal_story.13.d:0 "Беженцы открывают архив и училище потерянной метрополии. В правительстве подчёркивают: память не даёт права отнять будущее у индонезийцев. Флот возвращения будет строиться за счёт открытого бюджета, без обещаний лёгкой победы."
 A01_royal_story.13.a:0 "Сохранить родину и построить будущее."
 A01_royal_story.14.t:0 "Государство, обращённое к Тихому океану"
 A01_royal_story.14.d:0 "Морские карты теперь начинаются с Явы. Дворы, гражданские делегаты и военное министерство подписывают общий план обороны. Новая держава зависит от сотрудничества народов архипелага, а не только от голландского имени."
 A01_royal_story.14.a:0 "Наше будущее здесь."
 A01_royal_story.15.t:0 "Совет выигрывает время"
 A01_royal_story.15.d:0 "Срок следствия истёк, но Совет ещё держит ведомство. Это не конец королевского пути: парламентские юристы требуют новой сессии. Продление расследования обойдётся политическим капиталом, а капитаны станут осторожнее. Следующий срок — 180 дней."
 A01_royal_story.15.a:0 "Продлить следствие за счёт двора."
 A01_royal_story.15.b:0 "Выступить перед страной."
 A01_royal_institutions:0 "Корона, адмиралы и острова"
 A01_royal_institutions_desc:0 "Доказательства: §Y[?A01_admiralty_evidence|0]§! / 3. Лояльность капитанов: §Y[?A01_fleet_loyalty|0]§! / 2. Доверие дворов: §Y[?A01_sultan_confidence|0]§!.\nСуд требует доказательств и капитанов; чистка требует гвардии и капитанов. Островной договор требует не менее 3 доверия дворов."
 A01_royal_ballot:0 "Выборы премьер-министра"
 A01_royal_ballot_desc:0 "Действующий премьер-министр: §Y[Root.GetA01RoyalPremier]§!.\nПоддержка блоков: Конституционный союз §Y[?A01_vote_constitutional|0]§!, Партия порядка §Y[?A01_vote_order|0]§!, Индонезийская коалиция §Y[?A01_vote_indonesian|0]§!.\nПобеждает блок с наибольшей поддержкой. При равенстве: индонезийская коалиция, затем партия порядка."
 A01_audit_naval_contracts:0 "Проверить флотские контракты"
 A01_audit_naval_contracts_desc:0 "Проверка счетов добавит один комплект доказательств."
 A01_secure_witnesses:0 "Защитить свидетелей"
 A01_secure_witnesses_desc:0 "Охрана семей позволит капитанам выступить против Совета. +1 лояльности."
 A01_pay_the_captains:0 "Выплатить жалованье капитанам"
 A01_pay_the_captains_desc:0 "Гарантировать жалованье вместо раздачи политических должностей. +2 лояльности."
 A01_meet_princely_envoys:0 "Принять послов султанатов"
 A01_meet_princely_envoys_desc:0 "Обсудить сбор налогов и правосудие. +1 доверия дворов."
 A01_admiralty_deadline:0 "Совет затягивает следствие"
 A01_admiralty_deadline_desc:0 "За 180 дней нужно завершить суд, чистку или договор об отставке. Просрочка потребует новой политической уступки, но не закроет ветку."
 A01_campaign_constitutional:0 "Агитация: Конституционный союз"
 A01_campaign_constitutional_desc:0 "Поддержка блока вырастет на 2. Решение доступно раз в 30 дней."
 A01_campaign_order:0 "Агитация: Партия порядка"
 A01_campaign_order_desc:0 "Поддержка блока вырастет на 2. Решение доступно раз в 30 дней."
 A01_campaign_indonesian:0 "Агитация: Индонезийская коалиция"
 A01_campaign_indonesian_desc:0 "Поддержка блока вырастет на 2. Решение доступно раз в 30 дней."
 A01_royal_election_campaign:0 "90 дней до голосования"
 A01_royal_election_campaign_desc:0 "После окончания кампании избирательная комиссия определит победивший блок по поддержке."
 A01_royal_election_term:0 "Срок полномочий кабинета"
 A01_royal_election_term_desc:0 "Через 720 дней начнётся следующая кампания. Действующий кабинет работает до объявления нового результата."
 A01_cabinet_open_budget:0 "Открытый бюджет ван Рейна"
 A01_cabinet_open_budget_desc:0 "Государственные расходы станут предметом открытого парламентского отчёта. Кабинет направит средства в гражданские предприятия и королевские инженерные школы."
 A01_cabinet_princely_budget:0 "Морской бюджет ван дер Велде"
 A01_cabinet_princely_budget_desc:0 "Партия порядка сочетает гарантии султанским дворам с заказами верфям. Капитаны получат средства, но политическое вето Совета не вернётся."
 A01_cabinet_island_schools:0 "Островные училища Радена Сурьи"
 A01_cabinet_island_schools_desc:0 "Коалиция направит средства на подготовку учителей и инженеров. Королевские и султанские земли получат общую школьную программу при сохранении местных языков."
 A01_premier_van_rijn:0 "Маттейс ван Рейн"
 A01_premier_van_der_velde:0 "Хендрик ван дер Велде"
 A01_premier_raden_surya:0 "Раден Сурья"
 A01_premier_pending:0 "Кабинет ещё не избран"
 A01_open_seas_convention:0 "Конвенция общего торгового моря"
 A01_open_seas_convention_desc:0 "Согласовать портовые правила султанатов и короны. Вклады в гражданские предприятия дадут одну фабрику в столице и политическую поддержку автономных партнёров. Доступно один раз."
 A01_exile_volunteer_register:0 "Открыть реестр добровольцев изгнания"
 A01_exile_volunteer_register_desc:0 "Архивы беженцев помогут найти подготовленных добровольцев. Государство получит 6000 людских ресурсов и 20 армейского опыта; эта программа проводится один раз."
 A01_archipelago_naval_exercises:0 "Общие манёвры архипелага"
 A01_archipelago_naval_exercises_desc:0 "Штаб короны и султанские командиры отработают защиту проливов. Мы получим 20 морского опыта, каждый автономный султанат — 10. Доступно один раз."
 A01_review_charter_courts:0 "Совместная ревизия островных судов"
 A01_review_charter_courts_desc:0 "Проверить исполнение хартий гражданскими и княжескими судьями. Устранение произвольных поборов укрепит стабильность страны и автономных султанатов. Доступно один раз."
