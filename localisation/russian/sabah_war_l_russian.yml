l_russian:
 sabah_war.1.t:0 "Японский флот у берегов Сабаха"
 sabah_war.1.d:0 "Разведчики с Таваупа сообщают о дыме на горизонте: японские крейсера и миноносцы прошли к северу от Джессельтона. Портовые офицеры требуют усилить береговые батареи, пока орудийный огонь не накрыл гавань."
 sabah_war.1.a:0 "Укрепить береговую оборону Джессельтона."
 sabah_war.1.b:0 "Объявить дополнительный призыв среди местного населения."

 sabah_war.2.t:0 "Столкновение у Джессельтона"
 sabah_war.2.d:0 "Японская лёгкая эскадра прорывается сквозь заслоны нидерландских подводных лодок и занимает позиции для прикрытия высадки. Морской штаб докладывает: путь на Сабах практически свободен."
 sabah_war.2.a:0 "Эскадра прорвалась — начинаем высадку."
 sabah_war.2.b:0 "Голландские субмарины вынудили нас отойти. Перестраиваем маршрут."

 sabah_war.3.t:0 "Морские пехотинцы Нанкая высаживаются на Сабахе!"
 sabah_war.3.d:0 "Транспорты под огневым прикрытием тяжёлых крейсеров входят в бухту Сандакан. Первые отряды Нанкай Токубэцу Рикусэнтай уже на берегу. Наши цели — порты Джессельтона и Сандакана. Сабах должен стать нашим."
 sabah_war.3.a:0 "Гнать подкрепления! Времени терять нельзя."
 sabah_war.3.b:0 "Сначала закрепить плацдарм, потом наступать."

 sabah_war.4.t:0 "Сабах пал!"
 sabah_war.4.d:0 "Японские морские пехотинцы заняли Джессельтон и Сандакан. Нидерландский гарнизон оказывал сопротивление несколько суток, но без подкреплений был сломлен. Северный Борнео теперь под японским флагом. Батавия в трауре."
 sabah_war.4.a:0 "Мобилизовать резервы — Сабах нужно вернуть!"
 sabah_war.4.b:0 "Принять утрату — удержать Бруней любой ценой."

 sabah_war.6.t:0 "Море Сулу под японским контролем"
 sabah_war.6.d:0 "Имперский флот установил господство в море Сулу. Сабах и Бруней в наших руках, нидерландские суда вытеснены из этих вод. Южная стратегия приносит плоды — Борнео становится японской сферой влияния."
 sabah_war.6.a:0 "Закрепить победу — двигаться на юг."
