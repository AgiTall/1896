l_russian:
 A01_future_contest:0 "Спор о будущем Нидерландов"
 A01_motion_to_dismiss_ludolf:0 "Рассмотрение вопроса о смещении Людольфа"
 A01_motion_to_dismiss_ludolf_desc:0 "Совет рассматривает ответственность Людольфа за поражение. «Кабинет после поражения» открывает выбор политического курса. На пути Людольфа автономия султанатов приведёт к событию с просьбой дать ему ещё один шанс. Если слушания затянутся на 240 дней, состоится решающее заседание."
 A01_hear_island_delegates:0 "Принять делегатов островов"
 A01_hear_island_delegates_desc:0 "Выслушать общины и усилить гражданскую сторону в споре с адмиралами."
 A01_back_admiralty_inquiry:0 "Поддержать расследование Совета"
 A01_back_admiralty_inquiry_desc:0 "Передать новые материалы военной комиссии, усилив позиции адмиралов."
 A01_extend_cabinet_hearings:0 "Продлить слушания о кабинете"
 A01_extend_cabinet_hearings_desc:0 "Один раз отложить решающее заседание на 60 дней. Промедление даст время реформам, но усилит усталость общества."
 A01_future_of_netherlands:0 "В чьих руках будущее Нидерландов"
 A01_future_of_netherlands_desc:0 "Поражение уничтожило уверенность в прежнем порядке. Адмиралы требуют ответственности, индонезийские общины — свободы, а Людольф пытается сохранить государство, которое больше нельзя удержать одними приказами. Решение о его смещении станет спором о том, кому принадлежит страна."
 A01_equal_citizenship:0 "Равное федеральное гражданство"
 A01_equal_citizenship_desc:0 "Отменим правовое разделение нидерландцев и индонезийцев. Дух расового раскола удаляется, стабильность +3%."
 A01_elected_civil_service:0 "Ответственное гражданское правительство"
 A01_elected_civil_service_desc:0 "Заменим временный мандат постоянными правилами гражданской службы. Прирост политической власти +5%; стоимость армейских советников −5%."
 A01_democratic_federation:0 "Демократическая Федерация Нидерландов и Индонезии"
 A01_democratic_federation_desc:0 "Создадим общее демократическое государство. Собственные автономные султанаты войдут в федерацию; чужие и японские территории не передаются. Избирательная система потребует отдельных реформ."
 A01_purge_civil_service:0 "Чистка гражданского аппарата"
 A01_purge_civil_service_desc:0 "Отстранить чиновников, связанных с прежним кабинетом, и назначить военных уполномоченных. Комиссии будут судить не только о служебных ошибках, но и о политической благонадёжности."
 A01_purge_officer_corps:0 "Чистка офицерского корпуса"
 A01_purge_officer_corps_desc:0 "Потребовать от командиров личной присяги Совету. Сомневающихся и сторонников гражданского контроля отстранят от должностей. Утрата опыта временно ослабит армию и флот."
 A01_military_state:0 "Государство военной элиты"
 A01_military_state_desc:0 "Подчинить Совету министерства, суды, бюджет и назначения. Чистки закончатся созданием системы, в которой все государственные аппараты принадлежат военной элите, а право возражать считается угрозой обороне."
 A01_crown_above_factions:0 "Корона над спором кабинетов"
 A01_crown_above_factions_desc:0 "Предложение королевы-матери открывает третий выход из послевоенного кризиса. При равновесии гражданского кабинета и адмиралов Эмма примет регентство. Завершение этого фокуса передаст ей власть."
 A01_royal_island_charter:0 "Хартия короны и островов"
 A01_royal_island_charter_desc:0 "Подтвердить автономные права и созвать представителей архипелага. Корона должна опираться на договор с островами, а не на возвращение к неограниченной власти губернатора."
 A01_wilhelmina_comes_of_age:0 "Совершеннолетие Вильгельмины"
 A01_wilhelmina_comes_of_age_desc:0 "Завершить регентство Эммы и передать власть Вильгельмине. Обычно это возможно с 31 августа 1898 года. Если в разговоре с матерью Вильгельмина настояла на своём, коронация может состояться досрочно."
 A01_royal_constitution:0 "Конституция короны и архипелага"
 A01_royal_constitution_desc:0 "После устранения политической власти адмиралов корона примет конституцию. Парламент утвердит избирательный закон и изберёт премьер-министра."
 A01_demands_for_freedom:0 "Требования свободы"
 A01_demands_for_freedom_desc:0 "Поражение лишило колониальную администрацию прежнего авторитета. В портах и деревнях требуют самоуправления и права участвовать в решениях."
 A01_federal_transition:0 "Мандат на федерацию"
 A01_federal_transition_desc:0 "Султанаты поддержали Людольфа в обмен на реальные изменения. Подготовка общего гражданства и выборных учреждений требует времени и политических средств."
 A01_democratic_federation_idea:0 "Общее гражданство и выборные советы"
 A01_democratic_federation_idea_desc:0 "Индонезийские общины и автономные султанаты участвуют в выборе государственных служащих и работе федеральных органов власти."
 A01_military_directorate:0 "Директория Совета адмиралов"
 A01_military_directorate_desc:0 "Гражданский кабинет смещён. Решения о власти, бюджете и обороне переходят к военной элите."
 A01_purged_administration:0 "Обезглавленные учреждения"
 A01_purged_administration_desc:0 "Аресты и увольнения лишили учреждения опытных сотрудников. Военные уполномоченные устанавливают контроль, но дела и строительство задерживаются."
 A01_purged_officers:0 "Офицерские чистки"
 A01_purged_officers_desc:0 "Политическая присяга стала важнее опыта. Армия и флот теряют командиров, пока Совет формирует лояльный корпус."
 A01_total_military_state:0 "Вся власть военной элите"
 A01_total_military_state_desc:0 "Все государственные аппараты подчинены Совету. Мобилизация ресурсов ускорилась, политическая свобода исчезла."
 A01_royal_arbitration:0 "Регентство Эммы"
 A01_royal_arbitration_desc:0 "Королева-мать удерживает равновесие между гражданскими учреждениями, султанскими дворами и военными."
 A01_island_charter:0 "Хартия островов"
 A01_island_charter_desc:0 "Автономия и участие местных представителей защищены соглашением с короной."
 A01_constitutional_crown:0 "Корона в рамках конституции"
 A01_constitutional_crown_desc:0 "Монарх обеспечивает преемственность, гражданские органы ведут управление, а флот подчиняется общим законам."
 A01_future.1.t:0 "Один отсчёт для двух берегов"
 A01_future.1.d:0 "Разведка сообщает о японской подготовке на юге. В Батавии и Токио теперь считают дни до одной и той же развязки: укрепления, снабжение и дипломатические уступки определят, с чем стороны встретят войну.\n\nВ адмиралтействе спорят о том, можно ли ещё выиграть время. Фабиус предупреждает: перестановка министров в Токио не отменит ресурсных требований. Вирата просит объяснить населению, почему его снова готовят к службе. Касемброот требует заняться береговыми батареями. На столе лежит календарь; никакая торжественная речь не добавит к нему дней."
 A01_future.1.a:0 "Начать подготовку."
 A01_future.2.t:0 "После поражения заговорили острова"
 A01_future.2.d:0 "Перед закрытыми воротами резиденции читают условия соглашения с Японией. Из толпы спрашивают, почему людям предлагают платить за войну, в решении о которой они не участвовали. Хасан держит список погибших грузчиков. Сити принесла письмо деревенского собрания: если Батавия не может защитить острова, пусть хотя бы перестанет решать за них всё.\n\nОдни требуют автономии, другие — выборов, третьи — немедленного конца колониальной власти. Людольф предлагает преобразования. Совет отвечает, что проигравший губернатор не вправе обещать новую страну. Общество уже не согласится вернуться к прежней тишине."
 A01_future.2.a:0 "Мы должны ответить им."
 A01_future.3.t:0 "Кабинет остаётся. Пока"
 A01_future.3.d:0 "Совет принимает заявление о рассмотрении ответственности Людольфа. Касемброот требует передать дела военной комиссии; Фабиус возражает против смены правительства одним приказом. «Если мы судим за потерянные берега, придётся выслушать и тех, кто отдавал приказы флоту».\n\nЛюдольф остаётся на посту на время слушаний. Он получает 240 дней, чтобы представить новый порядок управления и найти ему поддержку. На улицах это называют отсрочкой, в адмиралтействе — последней возможностью объясниться. Губернатор просит пригласить представителей островов. Протоколист впервые оставляет для их подписей отдельное место."
 A01_future.3.a:0 "Открыть слушания."
 A01_future.4.t:0 "Кому принадлежит право решать?"
 A01_future.4.d:0 "В зале заседаний сталкиваются два ответа на поражение. Совет требует единого командования: министры спорили, пока японские транспорты шли к берегу. Делегаты островов отвечают, что командование не становится правым лишь потому, что умеет отдавать приказы.\n\nЛюдольф признаёт собственную ответственность, но просит не подменять расследование захватом власти. «Нельзя вернуть доверие, просто сменив вывеску над резиденцией». Касемброот спрашивает, на чью поддержку он рассчитывает. Губернатор смотрит на ещё пустые места султанских делегатов. Теперь каждое назначение, хартия и выступление станет частью борьбы за будущее Нидерландов."
 A01_future.4.a:0 "Пусть страна услышит обе стороны."
 A01_future.5.t:0 "Решающее заседание"
 A01_future.5.d:0 "Срок слушаний истёк. Папки комиссии больше не помещаются на столе: донесения, жалобы семей, проекты хартий и требования отставки. Фабиус просит закончить спор решением, которое можно будет исполнить.\n\nПредставители султанатов, если они получили автономию, предлагают сохранить Людольфа ради федеративных преобразований. Совет считает, что второй шанс станет оправданием поражения, и требует передачи власти военным. Продолжать временное правление уже невозможно. Сегодня речь идёт не только об одном человеке: участники заседания выбирают, кто получит право назначать служащих, распоряжаться казной и говорить от имени страны."
 A01_future.5.a:0 "Дать Людольфу федеральный мандат."
 A01_future.6.t:0 "Одна строка в законе"
 A01_future.6.d:0 "Писарь читает отменяемые ограничения, и зал постепенно замолкает. Прежде эти строки решали, чья жалоба заслуживает рассмотрения и чья кандидатура даже не попадёт в список. Теперь происхождение перестаёт быть законным основанием для отстранения от гражданского участия.\n\nСити спрашивает, кто проверит исполнение на островах. Людольф отвечает, что одного распоряжения недостаточно: следующим шагом должны стать местные выборные учреждения. Европейские чиновники опасаются потерять привычные места; молодые делегаты опасаются, что старые правила вернут под другим названием. Хасан забирает копию закона. «Теперь у нас будет бумага, с которой можно прийти в ваш суд»."
 A01_future.6.a:0 "Гражданство не определяется происхождением."
 A01_future.7.t:0 "Имя в списке назначений"
 A01_future.7.d:0 "Окружной совет отклоняет предложенного Батавией начальника порта и выдвигает местного служащего. Его фамилия вызывает раздражение в ведомстве; его отчёты оказываются лучше отчётов прежнего начальника. Людольф утверждает решение совета, несмотря на письмо влиятельной компании.\n\nСултанские делегаты требуют участия своих территорий в федеральных назначениях. Индонезийские представители настаивают, чтобы право голоса не принадлежало только дворцам. После спора утверждают открытые слушания, выдвижение от окружных советов и совместное рассмотрение центральных должностей. Первая процедура проходит медленно. Но впервые задержка вызвана необходимостью получить согласие людей, которыми собираются управлять."
 A01_future.7.a:0 "Учреждения должны отвечать перед жителями."
 A01_future.8.t:0 "Подписи под общей страной"
 A01_future.8.d:0 "Под конституцией стоят подписи гражданского кабинета, выборных представителей островов и автономных султанатов. Не все голосовали за неё; никто не получил всего, чего хотел. Общины добились участия в управлении, султаны — гарантий самоуправления, центральное правительство — общих правил обороны и бюджета.\n\nЛюдольф произносит короткую речь. Когда он говорит о сохранённом государстве, Хасан поправляет: «О государстве, в котором мы наконец появились». Губернатор принимает поправку. На следующем заседании уже придётся отвечать на вопросы о выборах и расходах. Федерация начинается с права задавать эти вопросы вслух."
 A01_future.8.a:0 "Нидерланды становятся общим делом."
 A01_future.9.t:0 "Печати меняют хозяев"
 A01_future.9.d:0 "Военные уполномоченные входят в министерства с перечнями отстранённых. Одним предлагают подписать присягу Совету, другим не дают собрать вещи. Архивы опечатывают, заседания местных советов отменяют до проверки благонадёжности.\n\nЧлены комиссии спорят, где заканчивается расследование ошибок и начинается устранение противников. Ответ приходит в новом приказе: несогласие с курсом Совета само становится основанием для увольнения. Людольф остаётся в заключении; обращения о его освобождении подшивают к материалам о неблагонадёжных. Учреждения работают хуже, но теперь в каждом кабинете точно знают, чьё решение считается последним."
 A01_future.9.a:0 "Назначения переходят к военным."
 A01_future.10.t:0 "Присяга перед закрытой дверью"
 A01_future.10.d:0 "Командиров вызывают по одному. На столе лежат послужной список и текст личной присяги Совету. Победы, ранения и знание проливов больше не гарантируют сохранения должности. Комиссия ищет связи с прежним кабинетом и сомнения в новом порядке.\n\nОфицер спрашивает, можно ли обжаловать решение. Ему отвечают, что жалоба будет передана тем же людям, которые проводят проверку. На кораблях появляются новые командиры; часть знает экипажи хуже, зато обладает безупречными рекомендациями. Штаб отмечает временное падение слаженности. Совет считает цену приемлемой: следующую войну должны вести люди, которые не станут спорить о власти."
 A01_future.10.a:0 "Лояльность станет условием службы."
 A01_future.11.t:0 "Регентша входит без свиты"
 A01_future.11.d:0 "Эмма просит убрать со стола заранее подготовленные заявления о победе одной из сторон. «Я пришла не подписывать чужую капитуляцию». Адмиралы не смогли окончательно вытеснить кабинет, Людольф не сумел получить устойчивого большинства; равновесие угрожало превратиться в распад управления.\n\nКоролева-мать принимает регентство. Людольф передаёт полномочия, Совет сохраняет командование флотом и лишается претензии на исключительную власть. Делегаты островов требуют подтверждения хартий. Эмма соглашается обсуждать их отдельным актом. У каждого в зале есть причина быть недовольным — и причина признать арбитра, которого не назначил его противник."
 A01_future.11.a:0 "Регентство должно удержать страну."
 A01_future.12.t:0 "Хартия, которую читают на островах"
 A01_future.12.d:0 "Султанские посланцы требуют заверить каждый экземпляр хартии. Индонезийские делегаты просят закрепить участие общин, чтобы автономия не стала лишь свободой местного двора от Батавии. Эмма поручает вписать обе гарантии.\n\nКасемброот предупреждает, что раздельные обязательства осложнят оборону. Регентша оставляет флот общим, но требует обсуждать бюджет с представителями островов. После заседания Сити спрашивает, переживёт ли документ смену монарха. «Иначе это было бы обещание женщины, а не обязательство короны», — отвечает Эмма."
 A01_future.12.a:0 "Хартия связывает и будущего монарха."
 A01_future.13.t:0 "Вильгельмина принимает полномочия"
 A01_future.13.d:0 "Регентские бумаги закрывают отдельной лентой. Вильгельмина достигла совершеннолетия и принимает власть, которую её мать удерживала между спорящими кабинетами, адмиралами и островными делегациями.\n\nЭмма передаёт ей не только государственную печать, но и копии хартий. «Эти подписи удержали больше, чем многие приказы». Молодая королева выслушивает представителей султанатов прежде, чем начинает торжественное заседание. Военные ждут подтверждения морской программы, гражданские учреждения — конституционных гарантий. Регентство закончилось; необходимость договариваться осталась."
 A01_future.13.a:0 "Да здравствует королева Вильгельмина."
 A01_future.14.t:0 "Корона и закон"
 A01_future.14.d:0 "В новой конституции нет должности, которая позволяла бы одному ведомству владеть всей страной. Монарх обеспечивает преемственность, гражданские учреждения ведут управление, военное командование отвечает за оборону. Представительство островов и автономные хартии становятся частью общего порядка.\n\nСовет добивается ясного определения командных полномочий, делегаты — порядка рассмотрения жалоб. Вильгельмина подписывает текст после последнего чтения. Эмма наблюдает за церемонией без регентской печати. Страна получила ответ на спор о верховной власти; теперь ей предстоит научиться жить по этому ответу."
 A01_future.14.a:0 "Ни один приказ не стоит выше конституции."
 A01_future.15.t:0 "Государство становится штабом"
 A01_future.15.d:0 "Министерские таблички сохраняют названия, но за ними теперь стоят военные назначения. Бюджет проходит через Совет, судьи получают утверждение директории, местные учреждения отчитываются перед уполномоченными. Независимая политическая деятельность запрещена.\n\nЧистки заканчиваются не оправданием обвинённых, а исчезновением необходимости кого-либо обвинять публично. Людольф остаётся в тюрьме как символ наказанного поражения. На верфях ускоряются заказы; на площадях замолкают собрания. Совет объявляет, что государство наконец обрело единую волю. Тем, чья воля с ней не совпадает, места в учреждениях больше нет."
 A01_future.15.a:0 "Все аппараты подчинены Совету."
 A01_future.16.t:0 "Письмо без герба на конверте"
 A01_future.16.d:0 "Вечером Фабиусу передают письмо королевы-матери. Эмма не предлагает вернуть старые порядки: она спрашивает, осталось ли в Батавии место для власти, которую признают обе стороны. Совет не может собрать решающего большинства, гражданский кабинет тоже держится лишь на чужом страхе перед соперником.\n\nВ письме предлагается регентство, подтверждение островных хартий и разграничение гражданской и военной власти. Фабиус читает его Людольфу без свидетелей. Тот долго смотрит на последние строки. Принять предложение означает уйти; отвергнуть — продолжить борьбу, исход которой всё ещё не решён."
 A01_future.16.a:0 "Рассмотреть монархический выход из кризиса."
 A01_future.5.b:0 "Передать власть Совету и арестовать Людольфа."
 A01_future.16.b:0 "Продолжить спор без вмешательства короны."
