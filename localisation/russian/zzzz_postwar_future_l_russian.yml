 A01_real_militia_tt:0 "Будут сформированы §Y12 дивизий индонезийского ополчения§!, каждая из §Y3 батальонов ополчения§!. Это временные части: после окончания кризиса с Японией они будут распущены."
 A01_future.17.t:0 "Людольф получает время на реформы"
 A01_future.17.d:0 "Послевоенный кабинет сохраняет гражданский курс. Людольф остаётся на посту, но не получает прощения за поражение. Совет требует результатов, а делегаты островов — ответа на требования свободы.\n\nФабиус предлагает начать с открытой комиссии. Вирата настаивает, что жители должны увидеть перемены за пределами Батавии. Людольф поручает готовить автономные хартии. Когда султанаты появятся, именно их представители смогут обратиться к Совету с просьбой дать губернатору второй шанс."
 A01_future.17.a:0 "Приступить к гражданским реформам."
