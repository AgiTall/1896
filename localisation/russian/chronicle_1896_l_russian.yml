 ch96.23.t:0 "Совет Корон"
 ch96.23.d:0 "10.12.1896. Определить правовое положение Совета корон как политического объединения. Действующие кабинеты, строй и суверенитет стран сохраняются."
 ch96.23.a:0 "Легальный Совет корон"
 ch96.23.news_a:0 "В Британии разрешено политическое объединение Совета корон. Иностранные дворы получают приглашения, а не новое правительство."
 ch96.23.b:0 "Раздельные дворы"
 ch96.23.news_b:0 "Дворы сохранили отдельные политические представительства. Война этим решением не объявляется."
 ch96.23.inactive:0 "Обстановка изменилась: прежний план не исполнен. Действующие решения кабинета сохраняются."
 ch96.23.absent:0 "10.12.1896. Участник эпизода больше не существует как отдельная держава. Историческая развилка утратила актуальность."
 ch96.24.t:0 "Итоги года"
 ch96.24.d:0 "31.12.1896. Начинается гонка за Гренландию. Новый конфликт вспыхивает на Борнео."
 ch96.24.a:0 "Холодная война"
 ch96.24.news_a:0 "31.12.1896. Решение: «Холодная война». Начинается гонка за Гренландию."
 ch96.24.b:0 "Горячая война"
 ch96.24.news_b:0 "31.12.1896. Решение: «Горячая война». Новый конфликт вспыхивает на Борнео."
 ch96.24.inactive:0 "31.12.1896. Изменение обстановки сделало этот план неосуществимым. Решение не было исполнено."
 ch96.24.absent:0 "31.12.1896. Участник эпизода больше не существует как отдельная держава. Историческая развилка утратила актуальность."
