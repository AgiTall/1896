 ch95.8.t:0 "Исполнение Сингапурского договора"
 ch95.8.d:0 "22.04.1895. Пересмотреть портовые договорённости 1894 года: продлить соглашение или ввести силовой контроль. Речь идёт о порядке в порту, а не передаче его территории."
 ch95.8.a:0 "Договор"
 ch95.8.news_a:0 "Продлены договорённости о торговле и портовом надзоре в Сингапуре."
 ch95.8.b:0 "Зачистка"
 ch95.8.news_b:0 "22.04.1895. Решение: «Зачистка». Британский флот бомбардирует кварталы триад."
 ch95.8.inactive:0 "Обстановка изменилась: прежний план не исполнен. Действующие решения кабинета сохраняются."
