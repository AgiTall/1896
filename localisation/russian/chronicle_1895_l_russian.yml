 ch95.7.t:0 "Финансовый коллапс Мицубиси"
 ch95.7.d:0 "08.04.1895. Император спасает дзайбацу за счет казны. Мицубиси распадается, флот теряет финансирование."
 ch95.7.a:0 "Государственная гарантия"
 ch95.7.news_a:0 "08.04.1895. Решение: «Государственная гарантия». Император спасает дзайбацу за счет казны."
