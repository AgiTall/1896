 ch95.16.t:0 "Собор в Рейкьявике"
 ch95.16.d:0 "15.08.1895. Победоносцев объявляет Теслу и его глушители ересью. Александр III запрещает церкви вмешиваться в науку."
 ch95.16.d_after:0 "15.08.1895. Новый собор рассматривает глушители Теслы. Во время болезни Победоносцева его сторонники требуют анафемы, но Александр III может запретить вмешательство церкви в науку."
 ch95.16.a:0 "Анафема"
 ch95.16.news_a:0 "15.08.1895. Решение: «Анафема». Сторонники Победоносцева добиваются осуждения Теслы и его глушителей."
 ch95.16.b:0 "Тишина"
 ch95.16.news_b:0 "15.08.1895. Решение: «Тишина». Александр III запрещает церкви вмешиваться в науку."
