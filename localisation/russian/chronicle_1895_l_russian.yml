 ch95.10.t:0 "Ранние глушители для кораблей и баз"
 ch95.10.d:0 "20.05.1895. Выбрать установку малого радиуса для корабля или стационарную башню. Участие требует раннего прототипа и доступа к Тесле."
 ch95.10.a:0 "Мобильный глушитель"
 ch95.10.news_a:0 "Для ранней программы выбрана корабельная установка малого радиуса."
 ch95.10.b:0 "Стационарная башня"
 ch95.10.news_b:0 "Для ранней программы выбрана стационарная башня."
 ch95.10.inactive:0 "Для установки ещё нет испытанного раннего глушителя или доступа к Тесле. Программа ждёт подготовки лаборатории."
 ch95.10.absent:0 "20.05.1895. Участник этого эпизода больше не существует как отдельная держава. Историческая развилка утратила актуальность."
