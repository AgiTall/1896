 ch95.6.t:0 "Русский флот в Исландии"
 ch95.6.d:0 "15.03.1895. Александр III модернизирует флот с помощью британских инженеров. Победоносцев запрещает любые иностранные технологии."
 ch95.6.d_after:0 "15.03.1895. Александр III рассматривает модернизацию флота с британской помощью. Во время болезни Победоносцева его сторонники продолжают выступать против иностранных технологий."
 ch95.6.a:0 "Реформа"
 ch95.6.news_a:0 "15.03.1895. Решение: «Реформа». Александр III модернизирует флот с помощью британских инженеров."
 ch95.6.b:0 "Застой"
 ch95.6.news_b:0 "15.03.1895. Решение: «Застой». Консервативные церковные круги выступают против иностранных технологий."
