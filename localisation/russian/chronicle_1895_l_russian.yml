 ch95.4.t:0 "Гавайский конституционный пересмотр"
 ch95.4.d:0 "Правительство Гавайев проверяет порядок преемственности после смерти Калакауа в апреле 1894 года. Пересмотр укрепляет действующие учреждения и не заменяет выбранную власть."
 ch95.4.continued_t:0 "Гавайский конституционный пересмотр"
 ch95.4.continued_d:0 "После прошлогодней преемственности Гавайи уточняют полномочия совета и бюджетные правила. Принятый политический путь сохраняется."
 ch95.4.a:0 "Подтвердить действующую конституцию"
 ch95.4.news_a:0 "Гавайское правительство завершило конституционный пересмотр, сохранив избранный порядок власти."
 ch95.4.b:0 "Уточнить полномочия действующего совета"
 ch95.4.news_b:0 "На Гавайях уточнены полномочия действующего совета без новой смены режима."
