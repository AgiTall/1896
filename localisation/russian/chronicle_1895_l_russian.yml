 ch95.3.t:0 "Реформа KNIL"
 ch95.3.d:0 "10.02.1895. Людольф разрешает индонезийцам командовать ротами. Офицерский корпус остается закрытым для местных."
 ch95.3.a:0 "Местные офицеры"
 ch95.3.news_a:0 "10.02.1895. Решение: «Местные офицеры». Людольф разрешает индонезийцам командовать ротами."
 ch95.3.b:0 "Только голландцы"
