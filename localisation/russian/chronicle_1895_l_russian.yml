 ch95.17.t:0 "Болезнь Победоносцева"
 ch95.17.d:0 "Победоносцев тяжело болен. Совет генералов забирает управление, Александр III остаётся символом власти."
 ch95.17.continued_t:0 "Совет генералов"
 ch95.17.continued_d:0 "Победоносцев болен. Генералы закрепляют полномочия при номинальном императоре."
 ch95.17.a:0 "Совет генералов"
 ch95.17.news_a:0 "Болезнь Победоносцева ускоряет переход власти к совету генералов. Царь остаётся символом."
 ch95.17.b:0 "Власть Синода"
 ch95.17.news_b:0 "Синод пытается сохранить влияние больного Победоносцева."
