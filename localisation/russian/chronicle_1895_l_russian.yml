 ch95.5.t:0 "Битва при Кучинге"
 ch95.5.d:0 "05.03.1895. Голландцы отбивают город у японцев. Японцы удерживают Кучинг, но несут потери."
 ch95.5.a:0 "Победа"
 ch95.5.news_a:0 "05.03.1895. Решение: «Победа». Голландцы отбивают город у японцев."
