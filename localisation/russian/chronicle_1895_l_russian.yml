 ch95.9.t:0 "Рейды Сулу"
 ch95.9.d:0 "05.05.1895. Сулу соглашаются действовать по плану Мабини. Пираты топят всех без разбора."
 ch95.9.a:0 "Координация"
 ch95.9.news_a:0 "05.05.1895. Решение: «Координация». Сулу соглашаются действовать по плану Мабини."
