l_russian:
 MLT_CANON_START_DESC:0 "Мальта обрела самостоятельность после переноса британского двора на Бермуды. Государственный совет управляет островом из Валлетты, опираясь на гавань и морскую торговлю. Малому государству предстоит сохранить независимость среди соперничающих морских держав."
 AVC_CANON_START_DESC:0 "Из Мельбурна Уильям Шилс управляет одной из самых развитых австралийских колоний. Промышленность и оживлённый порт дают Виктории вес среди соседей, но торговое соперничество мешает сближению. Колонии предстоит укрепить хозяйство и определить своё место в будущем Австралии."
 AQL_CANON_START_DESC:0 "Правительство Сэмюэла Гриффита управляет Квинслендом из Брисбена. Прибрежные поселения отделены большими расстояниями, а развитие севера требует дорог, портов и рабочих рук. Британская защита сохраняет морские связи, но будущее колонии зависит от собственного хозяйства."
 ASA_CANON_START_DESC:0 "Джон Даунер управляет Южной Австралией из Аделаиды. Власть колонии простирается до Северной территории, содержание которой ложится тяжёлым бременем на казну. Торговля и развитие путей сообщения должны связать далёкие поселения и укрепить положение колонии среди соседей."
 AWA_CANON_START_DESC:0 "Правительство Джона Форреста управляет Западной Австралией из Перта. Огромные расстояния отделяют колонию от восточных соседей, а новые поселения нуждаются в снабжении и сообщении. Разработка месторождений обещает рост, если удастся связать побережье с внутренними районами."
 ATA_CANON_START_DESC:0 "Генри Добсон возглавляет правительство Тасмании в Хобарте. Островная колония живёт морской торговлей, сельским хозяйством и связями с материком. Ограниченные средства заставляют беречь казну, а споры о сближении австралийских колоний требуют осторожного выбора."

 A11_CANON_START_DESC:0 "Султанат Кутай сохраняет местную власть и собственные интересы в раздробленном мире. Морская торговля и отношения с соседями определят будущее государства."
