l_russian:
 A01_ludolf_sloot_van_de_beele_name:0 "Людольф Слут ван де Беле"
 A01_council_of_admirals_name:0 "Совет Адмиралов"
 A01_wilhelmina:0 "Королева Вильгельмина"
 A01_wilhelmina_desc:0 "Королева Вильгельмина остаётся живым символом единства нидерландской короны и вдохновляет подданных на защиту государства."
 A01_racial_divide:0 "Расовый раскол"
 A01_racial_divide_desc:0 "Отношения между голландской администрацией и индонезийским населением постоянно меняются под давлением войны, репрессий и компромиссов. Последствия раскола теперь отражают текущий курс правительства."
 A01_racial_divide_hardened_desc:0 "Военное положение окончательно превратило расовое неравенство в систему открытого принуждения. Индонезийцы уклоняются от службы, саботируют приказы и всё чаще помогают подполью."
 A01_racial_divide_mitigated_desc:0 "Страховые гарантии ВТП смягчили самые тяжёлые последствия расового раскола. Неравенство сохраняется, но часть индонезийцев вновь готова сотрудничать с администрацией."
 A01_indonesian_refusal_to_serve:0 "Отказ индонезийцев служить"
 A01_indonesian_refusal_to_serve_desc:0 "Военное положение вызвало массовое уклонение от призыва и дезертирство среди индонезийского населения."
 A01_wtc_insured_loyalty:0 "Застрахованная лояльность"
 A01_wtc_insured_loyalty_desc:0 "Страхование жизни и имущества убедило часть индонезийцев, что их семьи не останутся ни с чем в случае войны."
 A01_wtc_internal_leverage:0 "Рычаги ВТП в Батавии"
 A01_wtc_internal_leverage_desc:0 "Новые концессии и портовые инспекторы позволяют Всемирной Торговой Палате всё сильнее влиять на внутренние решения Батавии."
 A01_colonial_police_mobilized:0 "Мобилизованная колониальная полиция"
 A01_colonial_police_mobilized_desc:0 "Дополнительные полицейские части укрепляют оборону, но их снабжение отнимает ресурсы у промышленности."
 A01_sultans_council_stability:0 "Совет султанов"
 A01_sultans_council_stability_desc:0 "Временное соглашение с местными правителями снизило напряжённость и укрепило порядок в колониях."
 A01_oil_dependency:0 "Нефтяная зависимость"
 A01_oil_dependency_desc:0 "Мы поставили всё на переработку нефти из Суматры и Борнео. Новые покупатели постепенно снижают издержки отрасли, поэтому последствия зависимости меняются вместе с доступом к мировому рынку."
 A01_oil_dependency_research_tt:0 "Темпы исследований синтетических ресурсов: §G+20.00%§!"
 A01_admirals_council:0 "Власть Совета Адмиралов"
 A01_admirals_council_desc:0 "В Батавии правит Военно-морская коллегия. Обычно адмиралы блокируют пересмотр законов о призыве, экономике и торговле, однако конституционные поправки могут временно изменить полномочия самого Совета."
 A01_admirals_council_laws_locked_tt:0 "Смена законов о призыве, экономике и торговле: £trigger_no"
 A01_admirals_council_laws_status_tt:0 "[Root.GetA01AdmiralsLawsStatus]"
 A01_admirals_council_laws_locked_status:0 "£trigger_no  Изменять законы о призыве\n£trigger_no  Изменять законы об экономике\n£trigger_no  Изменять законы о торговле"
 A01_admirals_council_laws_allowed_status:0 "£trigger_yes  Изменять законы о призыве\n£trigger_yes  Изменять законы об экономике\n£trigger_yes  Изменять законы о торговле"
 A01_can_change_conscription_law_tt:0 "Изменять закон о призыве"
 A01_can_change_trade_law_tt:0 "Изменять закон о торговле"
 A01_can_change_economy_law_tt:0 "Изменять закон об экономике"
 A01_constitutional_amendments_window:0 "Действие конституционных поправок"
 A01_constitutional_amendments_window_desc:0 "Совет Адмиралов вынужден временно подчиниться новым конституционным нормам. До истечения срока правительство может свободно пересмотреть основные законы государства."
 A01_constitutional_amendments_window_tt:0 "\n«§YВласть Совета адмиралов§W»§! §Wизменится на:\n£trigger_yes  Изменять законы о призыве\n£trigger_yes  Изменять законы об экономике\n£trigger_yes  Изменять законы о торговле"
 A01_oil_dependency_first_buyers:0 "Нефтяная зависимость: первые покупатели"
 A01_oil_dependency_first_buyers_desc:0 "Контакт с Всемирной Торговой Палатой привёл первых покупателей нашей нефти и каучука. Экспорт пока не решил всех проблем, но содержание добывающей отрасли уже обходится заметно дешевле."
 A01_ludolfs_civilian_control:0 "Гражданский контроль Людольфа"
 A01_ludolfs_civilian_control_desc:0 "Инженеры и промышленники поддержали Людольфа, обеспечив гражданскому правительству устойчивость и приток технических знаний."
 A01_admirals_stratocracy:0 "Морская стратократия"
 A01_admirals_stratocracy_desc:0 "Совет Адмиралов подчинил государство интересам флота. Верфи расширяются, а общество готовят к неизбежной борьбе за океан."
 A01_direct_naval_rule:0 "Прямое управление флота"
 A01_direct_naval_rule_desc:0 "После роспуска парламента приказы флотского командования исполняются без гражданских обсуждений и судебных задержек."
 A01_direct_naval_rule_suppression_tt:0 "§GОблегчит§! прохождение будущей ветки жёсткого подавления индонезийского населения."
 A01_government_course:0 "Морская стратократия"
 A01_government_course_desc:0 "Совет Адмиралов подчинил государственный аппарат интересам флота. Этот национальный дух усиливается по мере отстранения гражданских учреждений от управления Батавией."
 A01_wtc_presence:0 "Присутствие ВТП в Батавии"
 A01_wtc_presence_desc:0 "Контракты, страховые гарантии, концессии и портовые инспекторы Всемирной Торговой Палаты образуют единую систему влияния. Её последствия будут меняться по мере усиления или ослабления ВТП."
 A01_colonial_security_policy:0 "Колониальная политика безопасности"
 A01_colonial_security_policy_desc:0 "Военное положение, мобилизация полиции и будущие меры против подполья теперь накапливаются в одном изменяемом национальном духе."
 A01_batavian_congress_category:0 "Батавский съезд"
 A01_batavian_congress_category_desc:0 "Раз в два года Военно-морская коллегия созывает представителей колониальной администрации для пересмотра законов о призыве, экономике и торговле. Съезд завершится после выбора одного из трёх курсов; следующий созыв состоится через два года."
 A01_congress_tighten_laws:0 "Ужесточить законы"
 A01_congress_tighten_laws_desc:0 "Рост мировой угрозы или опасный уровень сопротивления дают адмиралам основание перевести колонии на военные рельсы.\n\n§YТребуется одно из условий:§!\n— мировая напряжённость выше §Y25%§!;\n— сопротивление хотя бы в одном нашем регионе выше §Y15%§!.\n\n§YПосле принятия решения:§!\n— закон о призыве: §YОграниченный призыв§!;\n— закон об экономике: §YЧастичная мобилизация§!;\n— закон о торговле: §YОграниченный экспорт§!;\n— следующий Батавский съезд состоится через §Y2 года§!."
 A01_congress_maintain_laws:0 "Сохранить действующий курс"
 A01_congress_maintain_laws_desc:0 "Совет не станет нарушать сложившееся равновесие между флотом, промышленниками и колониальной администрацией.\n\n§YПосле принятия решения:§!\n— действующие законы о призыве, экономике и торговле останутся без изменений;\n— следующий Батавский съезд состоится через §Y2 года§!."
 A01_congress_loosen_laws:0 "Ослабить законы"
 A01_congress_loosen_laws_desc:0 "Спокойная международная обстановка позволяет сократить военные расходы и вернуть торговцам прежнюю свободу.\n\n§YТребуется:§! мировая напряжённость не выше §Y25%§! и отсутствие регионов с сопротивлением выше §Y15%§!.\n\n§YПосле принятия решения:§!\n— закон о призыве: §YТолько добровольцы§!;\n— закон об экономике: §YГражданская экономика§!;\n— закон о торговле: §YСвободная торговля§!;\n— следующий Батавский съезд состоится через §Y2 года§!."
