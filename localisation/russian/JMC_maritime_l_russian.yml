l_russian:
 JMC_maritime_programme:0 "Порты и морские пути"
 JMC_maritime_programme_desc:0 "Суда связывают уцелевшие острова, но каждый порт по-своему учитывает уголь, мастерские и свободные причалы. Адмиралтейство и торговые дома должны свести эти сведения в общий порядок: наладить ремонт, подготовить запасы и договориться о назначении эскортных сил."
 JMC_port_register:0 "Составить реестр гаваней"
 JMC_port_register_desc:0 "Соберём портовые ведомости, проверим глубины у причалов и выясним, какие мастерские способны принимать паровые суда. Капитанам нужны сведения, которым можно доверять после выхода в море."
 JMC_repair_contracts:0 "Согласовать ремонтные контракты"
 JMC_repair_contracts_desc:0 "Верфи спорят о чертежах, а корабли неделями ждут деталей, которые можно изготовить в соседнем порту. Общие условия приёмки и согласованные заказы позволят мастерам работать без таких задержек."
 JMC_coaling_stations:0 "Подготовить угольные склады"
 JMC_coaling_stations_desc:0 "Для парового флота дальность плавания начинается на берегу. Осмотрим угольные площадки, защитим топливо от дождя и согласуем доставку к причалам, чтобы корабли не зависели от случайных закупок в каждом порту."
 JMC_escort_rehearsal:0 "Провести учения конвоев"
 JMC_escort_rehearsal_desc:0 "Торговые капитаны и командиры охранения пользуются разными сигналами и по-разному понимают порядок сбора. Совместные выходы помогут им держать строй, замечать отставшие суда и возвращаться к каравану после тревоги."
 JMC_sailing_conference:0 "Созвать совещание о дальних походах"
 JMC_sailing_conference_desc:0 "Реестр портов, ремонтные договоры и угольные запасы дают основу для дальнего плавания. Теперь капитанам и адмиралтейству предстоит решить, чему служить прежде всего: постоянному охранению торговых путей или подготовке экспедиционных соединений."
 JMC_replenish_reserves:0 "Пополнить морские резервы"
 JMC_replenish_reserves_desc:0 "Выделим средства на фрахт судов и погрузим запасное оборудование, такелаж и припасы. Подготовленные грузы помогут поддерживать морское сообщение, пока гавани собирают следующую партию снабжения."
 JMC_yard_coordination:0 "Согласованные заказы верфям"
 JMC_yard_coordination_desc:0 "Общие чертежи и порядок приёмки позволяют верфям распределять заказы и заранее готовить детали. Мастера меньше времени тратят на переделки и ожидание соседних цехов."
 JMC_coaling_network:0 "Сеть угольных станций"
 JMC_coaling_network_desc:0 "Исправные склады и согласованная доставка угля связывают отдельные гавани в сеть. Корабли могут уходить дальше от домашних причалов, не расходуя лишнее время и силы на поиски топлива."
 JMC_escort_training:0 "Выучка конвойных команд"
 JMC_escort_training_desc:0 "Капитаны торговых судов знают сигналы охранения, а командиры эскорта учитывают ход самых медленных пароходов. Караваны собираются и меняют строй по общему порядку."
 JMC_merchant_plan:0 "Охранение торговых путей"
 JMC_merchant_plan_desc:0 "За караванными маршрутами закреплены согласованные силы охранения. Торговые капитаны и флотские штабы сообща составляют расписания, чтобы эскорт встречал суда там, где они в нём нуждаются."
 JMC_expedition_plan:0 "Порядок дальних экспедиций"
 JMC_expedition_plan_desc:0 "Штабы заранее согласуют состав соединений, погрузку и сбор транспортов. Эскадры готовятся действовать вместе вдали от своих баз и высаживать войска по единому плану."
 JMC_ready_stores:0 "Запасы для морских переходов"
 JMC_ready_stores_desc:0 "Запасные части, такелаж и припасы погружены по общим ведомостям. Экипажам легче поддерживать корабли в море, не запрашивая каждую недостающую мелочь отдельным рейсом."
 jmc_maritime.1.t:0 "Что скрывают портовые ведомости"
 jmc_maritime.1.d:0 "На столе лежат списки гаваней, но одинаковые графы скрывают разные вещи. Где-то под мастерской понимают верфь с токарными станками, где-то — сарай корабельного плотника. Уголь, обещанный нескольким капитанам, записан в одном и том же складе. Портовые гильдии предлагают сверить записи через своих представителей; флотские интенданты готовы провести собственную проверку."
 jmc_maritime.1.merchant:0 "Поручить сверку портовым гильдиям"
 jmc_maritime.1.navy:0 "Пусть ведомости проверят флотские интенданты"
 jmc_maritime.2.t:0 "Детали по общему чертежу"
 jmc_maritime.2.d:0 "На верфи поступила партия деталей из соседней гавани. Прежде приёмщики начали бы спор о размерах и ответственности; теперь рядом с грузом лежат согласованный чертёж и подписанная ведомость. Подрядчики ещё торгуются о новых заказах, но кораблям уже не приходится ждать окончания каждого спора. Мастера просят сохранить принятый порядок."
 jmc_maritime.2.a:0 "Пусть верфи работают по согласованным заказам"
 jmc_maritime.3.t:0 "Уголь под крышей"
 jmc_maritime.3.d:0 "Смотрители прислали первые сверенные сведения: топливо укрыто, подходы к причалам расчищены, подвоз согласован со складскими командами. Капитаны получили перечень гаваней, где можно пополнить бункеры без торга у каждого угольного двора. На картах дальние переходы теперь подкреплены записью о настоящем запасе на берегу."
 jmc_maritime.3.a:0 "Разослать сведения капитанам"
 jmc_maritime.4.t:0 "Караван возвращается в гавань"
 jmc_maritime.4.d:0 "Последний пароход вошёл в гавань под вечер. Во время учений один транспорт отстал, а сигнальщики приняли поворот эскорта за приказ всему каравану. Ошибки разобрали ещё на рейде. В итоговой записи капитаны согласовали сигналы сбора, порядок движения и действия при потере соседа из виду. Следующий выход начнётся с общей проверки этих правил."
 jmc_maritime.4.a:0 "Сохранить общий порядок сигналов"
 jmc_maritime.5.t:0 "Куда направить подготовленный флот"
 jmc_maritime.5.d:0 "На совещании разложены реестр гаваней, ремонтные договоры и донесения с учений. Торговые капитаны просят закрепить охранение за регулярными караванами. Офицеры экспедиционных штабов предлагают свести транспорты и боевые корабли в заранее подготовленные соединения. Оба предложения требуют постоянной совместной работы. Адмиралтейство должно определить, какой порядок станет основой дальнейших выходов в море."
 jmc_maritime.5.merchant:0 "Поставить во главу угла охранение караванов"
 jmc_maritime.5.expedition:0 "Согласовать порядок дальних экспедиций"
