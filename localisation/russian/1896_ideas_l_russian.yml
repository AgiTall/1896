l_russian:
 A01_accountable_civil_service:0 "Ответственная гражданская служба"
 A01_accountable_civil_service_desc:0 "Постоянная гражданская администрация отвечает за бюджет и назначения. Профессиональная служба обеспечивает преемственность управления при смене министров."
 A01_admiralty_obstruction:0 "Обструкция адмиралов"
 A01_admiralty_obstruction_desc:0 "Закупки задерживаются, капитаны получают противоречивые приказы. Завершите борьбу через суд, чистку или соглашение."
 A01_admiralty_pensions:0 "Цена адмиральской отставки"
 A01_admiralty_pensions_desc:0 "Бывшие адмиралы получают пенсии и сохраняют закупочные связи. Парламент может пересмотреть контракты."
 A01_agrarian_labour_transition:0 "Аграрное общество: трудовая повинность"
 A01_agrarian_labour_transition_desc:0 "Рабочих направляют на фабрики по обязательным квотам. Экономика ещё зависит от деревни, но промышленная нехватка рабочих сокращается."
 A01_agrarian_schooling:0 "Аграрное общество: первые школы"
 A01_agrarian_schooling_desc:0 "Начальное образование создаёт основу для перехода от сельского хозяйства к фабричному труду. Аграрные ограничения ещё действуют."
 A01_agrarian_society:0 "Аграрное общество"
 A01_agrarian_society_desc:0 "Большинство жителей занято на небольших хозяйствах и плантациях. Промышленных рабочих, инженеров и местных подрядчиков не хватает; оборудование приходится ввозить, а казна зависит от экспортных доходов. Массовый призыв лишил бы сельское хозяйство рабочих рук. Стране нужны предприятия и подготовленные специалисты, но их создание требует средств и согласия разобщённых общин."
 A01_archipelago_power:0 "Тихоокеанская корона"
 A01_archipelago_power_desc:0 "Общая оборона островов стала главным делом государства."
 A01_army_transition:0 "Армия в переходный период"
 A01_army_transition_desc:0 "Демобилизация нарушила привычный порядок службы. Армии нужны новые правила подготовки и офицеры, способные объединить оставшиеся части в устойчивые соединения."
 A01_borneo_australian_commitments:0 "Гарантии по Новой Гвинее"
 A01_borneo_australian_commitments_desc:0 "В обмен на материалы и специалистов Батавия обязалась отказаться от укреплений, направленных против Австралии. Соглашение сближает соседей, но ограничивает свободу оборонного планирования."
 A01_borneo_australian_defence:0 "Австралийский проект обороны"
 A01_borneo_australian_defence_desc:0 "Австралийские специалисты помогли связать береговые позиции с портовыми складами. Защитники Борнео получили подготовленные рубежи и надёжное снабжение."
 A01_borneo_british_commitments:0 "Британская инженерная миссия"
 A01_borneo_british_commitments_desc:0 "Влияние Британии: [?A01_british_influence|0]. Потеря суверенитета: [?A01_sovereignty_loss|0]."
 A01_borneo_british_defence:0 "Британский проект обороны"
 A01_borneo_british_defence_desc:0 "Бетонные позиции, построенные при участии британских инженеров, прикрывают подходы к портам и затрудняют японскую высадку."
 A01_borneo_debt_service:0 "Обслуживание оборонного займа"
 A01_borneo_debt_service_desc:0 "После окончания войны сохраняются выплаты по займу и обязательства перед подрядчиками."
 A01_borneo_fortification_directorate:0 "Управление укреплений Борнео"
 A01_borneo_fortification_directorate_desc:0 "Военные инженеры согласуют чертежи, поставки материалов и работу строительных команд. Единое руководство ускорит возведение береговых и сухопутных укреплений у портов Борнео."
 A01_borneo_humiliation:0 "Борнейское унижение"
 A01_borneo_humiliation_desc:0 "Утрата северного Борнео и японские концессии подрывают доверие к Батавии."
 A01_borneo_local_commitments:0 "Сотрудничество с индонезийскими общинами"
 A01_borneo_local_commitments_desc:0 "Участие островных общин в обороне укрепило доверие к Батавии и облегчило набор добровольцев. Адмиралы недовольны уступками местным правителям и растущей самостоятельностью их отрядов."
 A01_borneo_local_defence:0 "Местная система обороны"
 A01_borneo_local_defence_desc:0 "Земляные валы, скрытые тропы и заграждения позволяют защитникам использовать знание местности против японского десанта."
 A01_borneo_self_build:0 "Государственная программа укреплений"
 A01_borneo_self_build_desc:0 "Собственные укрепления прикрывают побережье от японского десанта. Их строительство отвлекает средства от гражданских предприятий, а выплаты по займу продолжатся и после завершения кампании."
 A01_borneo_state_loan:0 "Заём ВТП на оборону"
 A01_borneo_state_loan_desc:0 "Оборонный заём позволил начать строительство, но связал казну обязательствами перед ВТП. Выплаты по нему продолжатся и после завершения боёв, пока правительство не погасит задолженность."
 A01_chamber_democrats:0 "Демократия торговых советов"
 A01_chamber_democrats_desc:0 "Демократизация при опоре на Палату усиливает влияние кредиторов."
 A01_civilian_justice:0 "Гражданский суд над властью"
 A01_civilian_justice_desc:0 "Личная ответственность офицеров установлена судом, а не массовыми отстранениями."
 A01_civilian_naval_compact:0 "Гражданско-морской компромисс"
 A01_civilian_naval_compact_desc:0 "Совет признал гражданское руководство в обмен на выполнение согласованной морской программы."
 A01_civilian_navy_ministry:0 "Королевское морское министерство"
 A01_civilian_navy_ministry_desc:0 "Военный штаб отделён от гражданского бюджета. Адмиральского политического вето больше нет."
 A01_civilian_reform_mandate:0 "Гражданский мандат Людольфа"
 A01_civilian_reform_mandate_desc:0 "Заменяется ответственной гражданской службой."
 A01_coerced_service:0 "Принудительная мобилизация"
 A01_coerced_service_desc:0 "Полиция вернула часть призывников, но принуждение не восстановило доверия. Сохраняются уклонение, организационные проблемы и политическая напряжённость."
 A01_colonial_administration:0 "Колониальная администрация"
 A01_colonial_administration_desc:0 "Колониальная администрация: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A01_constitutional_crown:0 "Корона в рамках конституции"
 A01_constitutional_crown_desc:0 "Монарх обеспечивает преемственность, гражданские органы ведут управление, а флот подчиняется общим законам."
 A01_crown_commonwealth_idea:0 "Королевское содружество"
 A01_crown_commonwealth_idea_desc:0 "Королевское содружество."
 A01_crown_dialogue:0 "Корона ведёт диалог"
 A01_crown_dialogue_desc:0 "Корона ведёт диалог."
 A01_crown_parliament_idea:0 "Парламент при короне"
 A01_crown_parliament_idea_desc:0 "Парламент при короне."
 A01_crown_resolve:0 "Решающее слово короны"
 A01_crown_resolve_desc:0 "Решающее слово короны."
 A01_crown_secret_police:0 "Тайная полиция короны"
 A01_crown_secret_police_desc:0 "Тайная полиция короны."
 A01_demands_for_freedom:0 "Требования свободы"
 A01_demands_for_freedom_desc:0 "Поражение лишило колониальную администрацию прежнего авторитета. В портах и деревнях требуют самоуправления и права участвовать в решениях."
 A01_democratic_federation_idea:0 "Общее гражданство и выборные советы"
 A01_democratic_federation_idea_desc:0 "Индонезийские общины и автономные султанаты участвуют в выборе государственных служащих и работе федеральных органов власти."
 A01_development_bank:0 "Банк развития архипелага"
 A01_development_bank_desc:0 "Общие кредиты финансируют дороги, школы и местные предприятия."
 A01_direct_royal_rule:0 "Прямое правление короны"
 A01_direct_royal_rule_desc:0 "Прямое правление короны."
 A01_dutch_primary_schooling:0 "Обязательная нидерландская школа"
 A01_dutch_primary_schooling_desc:0 "Чтение, счёт и нидерландский язык становятся основой подготовки фабричной рабочей силы."
 A01_emmas_caution:0 "Осторожность регентши"
 A01_emmas_caution_desc:0 "Осторожность регентши."
 A01_equal_citizenship_royal:0 "Общее гражданство"
 A01_equal_citizenship_royal_desc:0 "Голландцы и индонезийцы получают равный доступ к гражданской службе и командованию."
 A01_escort_coordination:0 "Координация морского охранения"
 A01_escort_coordination_desc:0 "Общие маршруты и порядок взаимодействия улучшают организацию флота."
 A01_european_overture:0 "Европейская демократическая идея"
 A01_european_overture_desc:0 "Первая программа сближения с Британией; переговоры об объединении ещё впереди."
 A01_exile_mission:0 "Миссия королевства в изгнании"
 A01_exile_mission_desc:0 "Беженцы сохраняют институты потерянной родины; верфи готовят флот возвращения."
 A01_factory_workforce:0 "Подготовленная фабричная рабочая сила"
 A01_factory_workforce_desc:0 "Выпускники начальных школ и переселённые сельские семьи образуют постоянную промышленную рабочую силу."
 A01_federal_constitution_idea:0 "Федеральная конституция"
 A01_federal_constitution_idea_desc:0 "Конституция закрепляет равноправие народов и ответственность правительства перед парламентом. Споры о власти должны решаться по закону, а не приказом эскадры."
 A01_federal_defence_command_idea:0 "Федеральное оборонное командование"
 A01_federal_defence_command_idea_desc:0 "Армия, флот и островные гарнизоны подчиняются общему оборонному плану. Единый штаб согласует перевозки и распределяет запасы между ведомствами."
 A01_federal_transition:0 "Мандат на федерацию"
 A01_federal_transition_desc:0 "Султанаты поддержали Людольфа в обмен на реальные изменения. Подготовка общего гражданства и выборных учреждений требует времени и политических средств."
 A01_guard_academy_idea:0 "Школа королевской гвардии"
 A01_guard_academy_idea_desc:0 "Общий офицерский корпус готовит голландских и индонезийских кадетов."
 A01_indonesian_refusal:0 "Массовый отказ от службы"
 A01_indonesian_refusal_desc:0 "До завершения переговоров и выступлений призывные участки пустуют, а доверие в частях падает."
 A01_indonesian_volunteers:0 "Индонезийские добровольцы"
 A01_indonesian_volunteers_desc:0 "Три временные дивизии защищают острова под местным командованием. Они будут распущены после войны с Японией."
 A01_industrial_power_grid:0 "Промышленная энергосеть"
 A01_industrial_power_grid_desc:0 "Согласованное развитие паровых электростанций и фабричных округов ускоряет новое строительство."
 A01_island_charter:0 "Хартия островов"
 A01_island_charter_desc:0 "Автономия и участие местных представителей защищены соглашением с короной."
 A01_island_commissions:0 "Общий офицерский корпус"
 A01_island_commissions_desc:0 "Доступ к командованию определяется подготовкой, а не происхождением."
 A01_island_defence:0 "Оборона архипелага"
 A01_island_defence_desc:0 "Оборона архипелага: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A01_island_discontent:0 "Острова ждут ответа"
 A01_island_discontent_desc:0 "Петиция отложена. Снять недовольство можно общим гражданством или представительством."
 A01_island_representation_idea:0 "Представительство островов"
 A01_island_representation_idea_desc:0 "При создании федерации представительство становится постоянным государственным институтом."
 A01_joint_officer_corps:0 "Общий офицерский корпус"
 A01_joint_officer_corps_desc:0 "Нидерландцы и индонезийцы получили равный доступ к офицерской карьере. Общая подготовка помогает командирам действовать согласованно и быстрее обучать пополнение."
 A01_knil_field_training:0 "КНИЛ: островные гарнизоны"
 A01_knil_field_training_desc:0 "КНИЛ — Королевская нидерландская ост-индская армия, регулярные сухопутные войска колонии. Общая подготовка и гарнизонная служба повышают организацию и оборону этих частей."
 A01_knil_professional:0 "КНИЛ: подготовленный командный состав"
 A01_knil_professional_desc:0 "КНИЛ — регулярная ост-индская армия. Местные сержанты обеспечивают связь между командирами и солдатами и закрепляют результаты реформ."
 A01_knil_reformed:0 "КНИЛ: полевые реформы"
 A01_knil_reformed_desc:0 "Полевые наставления и единое снабжение регулярной колониальной армии повышают организацию, ускоряют подготовку и снижают расход припасов."
 A01_knil_training:0 "Подготовка колониальной армии (КНИЛ)"
 A01_knil_training_desc:0 "КНИЛ — Королевская нидерландская ост-индская армия (KNIL), регулярные сухопутные войска архипелага. Общие программы подготовки делают гарнизоны и полевые части более организованными. Это кадровая армия; временное добровольческое ополчение формируется отдельно."
 A01_local_armaments:0 "Островные оружейные заказы"
 A01_local_armaments_desc:0 "Местные заказы и единые стандарты вооружения укрепляют оружейное производство."
 A01_marine_training:0 "Подготовка морских бригад"
 A01_marine_training_desc:0 "Единые программы подготовки расширяют возможности содержания специализированных частей."
 A01_military_directorate:0 "Директория Совета адмиралов"
 A01_military_directorate_desc:0 "Гражданский кабинет смещён. Решения о власти, бюджете и обороне переходят к военной элите."
 A01_naval_staff:0 "Штаб Адмиралтейства"
 A01_naval_staff_desc:0 "Штаб Адмиралтейства: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A01_open_procurement:0 "Открытые государственные заказы"
 A01_open_procurement_desc:0 "Общественный контроль ограничивает семейные флотские контракты."
 A01_open_seas_idea:0 "Корона торговых морей"
 A01_open_seas_idea_desc:0 "Торговля, гражданское строительство и договорные отношения определяют курс королевства."
 A01_pm_constitutional:0 "Маттейс ван Рейн — Конституционный союз"
 A01_pm_constitutional_desc:0 "Кабинет торговых городов и юристов: открытый бюджет, инженерные школы и гражданская служба."
 A01_pm_indonesian:0 "Раден Сурья — Индонезийская коалиция"
 A01_pm_indonesian_desc:0 "Кабинет гражданских делегатов островов: училища, равные назначения и развитие внутренних округов."
 A01_pm_order:0 "Хендрик ван дер Велде — Партия порядка"
 A01_pm_order_desc:0 "Кабинет умеренных монархистов и княжеских делегатов: местные гарантии и морская безопасность."
 A01_postwar_budget_burden:0 "Расходы послевоенного восстановления"
 A01_postwar_budget_burden_desc:0 "Снимается государственным фондом или погашением через ВТП."
 A01_postwar_destruction:0 "Разрушенные порты и мастерские"
 A01_postwar_destruction_desc:0 "Повреждённые причалы и мастерские задерживают восстановление островов. Казна должна оплатить ремонт собственными средствами или договориться о финансировании с Палатой."
 A01_princely_compact:0 "Договор с княжескими дворами"
 A01_princely_compact_desc:0 "Корона гарантирует местное право и престолонаследие, а дворы признают общий суд."
 A01_provincial_diets:0 "Провинциальные собрания"
 A01_provincial_diets_desc:0 "Гражданские делегаты контролируют чиновников при сохранении королевского кабинета."
 A01_purged_administration:0 "Обезглавленные учреждения"
 A01_purged_administration_desc:0 "Аресты и увольнения лишили учреждения опытных сотрудников. Военные уполномоченные устанавливают контроль, но дела и строительство задерживаются."
 A01_purged_fleet:0 "Флот после чистки"
 A01_purged_fleet_desc:0 "Отстранения оставили штабные вакансии и нарушили привычные связи между командирами. Подготовка новых офицеров и обновление флота помогут восстановить управление."
 A01_purged_officers:0 "Офицерские чистки"
 A01_purged_officers_desc:0 "Политическая присяга стала важнее опыта. Армия и флот теряют командиров, пока Совет формирует лояльный корпус."
 A01_reconstruction_cabinet:0 "Кабинет восстановления"
 A01_reconstruction_cabinet_desc:0 "Новый кабинет согласует восстановление портов и отношения с автономными правителями."
 A01_recovery_investment_idea:0 "Инвестиции после восстановления"
 A01_recovery_investment_idea_desc:0 "Погашенные обязательства освободили средства для строительства. Казна может поддерживать новые предприятия, не откладывая каждый заказ ради старых кредиторов."
 A01_responsible_cabinet_idea:0 "Ответственный кабинет"
 A01_responsible_cabinet_idea_desc:0 "Королева назначает премьер-министра по парламентскому большинству. Бюджет требует одобрения депутатов."
 A01_restored_port_network:0 "Восстановленная портовая сеть"
 A01_restored_port_network_desc:0 "Восстановленные гавани и склады позволяют доставлять грузы без прежних потерь и задержек. Торговцы и гарнизоны вновь полагаются на регулярное сообщение между островами."
 A01_revanchism_organised:0 "Программа национального восстановления"
 A01_revanchism_organised_desc:0 "Реваншистские настроения направлены на восстановление флота и оборонной промышленности."
 A01_revanchism_simmering:0 "Зреющий реваншизм"
 A01_revanchism_simmering_desc:0 "Общество требует вернуть потерянные земли, но общей программы восстановления пока нет."
 A01_royal_absolutism:0 "Королевский абсолютизм"
 A01_royal_absolutism_desc:0 "Королевский абсолютизм."
 A01_royal_academies_idea:0 "Королевские институты"
 A01_royal_academies_idea_desc:0 "Инженеры, переводчики и гражданские служащие получают образование в самом архипелаге."
 A01_royal_arbitration:0 "Регентство Эммы"
 A01_royal_arbitration_desc:0 "Королева-мать удерживает равновесие между гражданскими учреждениями, султанскими дворами и военными."
 A01_royal_guard_loyalty:0 "Королевская гвардия"
 A01_royal_guard_loyalty_desc:0 "Королевская гвардия."
 A01_royal_militarism:0 "Военная монархия"
 A01_royal_militarism_desc:0 "Военная монархия."
 A01_royal_naval_loyalty:0 "Флот на службе короны"
 A01_royal_naval_loyalty_desc:0 "Флот на службе короны."
 A01_service_compromise:0 "Договор о колониальной службе"
 A01_service_compromise_desc:0 "Гарантии жалованья и помощи семьям смягчили конфликт. Уклонение уменьшилось, однако полного согласия ещё нет."
 A01_standardised_industry:0 "Единые промышленные стандарты"
 A01_standardised_industry_desc:0 "Общие чертежи и нормы обучения позволяют фабрикам быстрее осваивать производство и эффективнее использовать оборудование."
 A01_sultanate_federation:0 "Договор с султанатами"
 A01_sultanate_federation_desc:0 "Автономные администрации сохраняют общий оборонный договор с Батавией."
 A01_sultans_council_stability:0 "Совет султанов"
 A01_sultans_council_stability_desc:0 "Временное соглашение с местными правителями снизило напряжённость и укрепило порядок в колониях."
 A01_total_military_state:0 "Вся власть военной элите"
 A01_total_military_state_desc:0 "Все государственные аппараты подчинены Совету. Мобилизация ресурсов ускорилась, политическая свобода исчезла."
 A01_unpaid_families:0 "Невыплаченные компенсации семьям"
 A01_unpaid_families_desc:0 "Семьи погибших и искалеченных военнослужащих всё ещё ждут обещанной помощи. Выплаты из казны или соглашение с кредиторами позволят исполнить обязательства перед ними."
 A01_war_production:0 "Оборонные заказы"
 A01_war_production_desc:0 "Оборонные заказы повышают выпуск заводов ценой дополнительных потребительских расходов. Программа начинается до войны с Японией, действует во время неё и снимается после заключения мира."
 A01_wilhelmina:0 "Королева Вильгельмина"
 A01_wilhelmina_desc:0 "Королева Вильгельмина остаётся живым символом единства нидерландской короны и вдохновляет подданных на защиту государства."
 A01_wtc_concessions:0 "Зависимость от ВТП"
 A01_wtc_concessions_desc:0 "Компания требует долю доходов и вмешивается в решения кабинета. Снизьте влияние ниже 50 аудитом контрактов."
 A01_wtc_credit:0 "Кредит ВТП на восстановление"
 A01_wtc_credit_desc:0 "Финансирование ускоряет строительство гражданской промышленности."
 A01_wtc_recovery_guarantees:0 "Коммерческие гарантии ВТП"
 A01_wtc_recovery_guarantees_desc:0 "За помощь в восстановлении ВТП получила временные коммерческие гарантии. Приоритет её контрактов ограничивает свободу промышленных заказов до окончания соглашения."
 A01_young_queens_resolve:0 "Решимость юной королевы"
 A01_young_queens_resolve_desc:0 "Решимость юной королевы."
 A03_army_reform:0 "Армейская реформа"
 A03_army_reform_desc:0 "Армейская реформа: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A03_civil_government:0 "Гражданский кабинет"
 A03_civil_government_desc:0 "Гражданские министры предлагают укрепить империю через устойчивые финансы и торговлю. Военные сохранят влияние, но не будут определять каждый государственный заказ."
 A03_commercial_network:0 "Тихоокеанская торговая сеть"
 A03_commercial_network_desc:0 "Тихоокеанская торговая сеть: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A03_expeditionary_staff:0 "Экспедиционный штаб"
 A03_expeditionary_staff_desc:0 "Заморская операция начинается с расчёта грузов и маршрутов. Экспедиционный штаб согласует перевозки, высадку и снабжение войск."
 A03_industrial_contracts:0 "Промышленные контракты"
 A03_industrial_contracts_desc:0 "Промышленные контракты: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A03_island_supply:0 "Островные конвои"
 A03_island_supply_desc:0 "Снабжение дальних гарнизонов требует точного расписания рейсов и запасных складов. Организуем постоянную службу островных конвоев."
 A03_landing_force:0 "Императорские десантные силы"
 A03_landing_force_desc:0 "Императорские десантные силы: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
 A03_naval_academy:0 "Морская академия"
 A03_naval_academy_desc:0 "Офицерам необходимы общие знания навигации, артиллерии и управления соединениями. Академия введёт единые стандарты подготовки флота."
 A03_naval_government:0 "Морской кабинет"
 A03_naval_government_desc:0 "Морское ведомство берёт на себя руководство кабинетом. Безопасность проливов и снабжение заморских баз станут главными государственными задачами."
 A03_resource_commission:0 "Императорская ресурсная комиссия"
 A03_resource_commission_desc:0 "Промышленности нужен точный учёт запасов и поставок. Ресурсная комиссия согласует потребности заводов с возможностями торгового флота."
 A03_southern_blitz:0 "Стремительная южная кампания"
 A03_southern_blitz_desc:0 "В начале кампании десантные силы получают первоочередное снабжение и поддержку тяжёлых кораблей. Адмиралтейство рассчитывает добиться успеха прежде, чем чрезвычайное напряжение истощит экипажи и склады."
 A10_common_army:0 "Общая армия островов"
 A10_federal_administration:0 "Федеральная администрация"
 A10_separatism:0 "Островной сепаратизм"
 A10_separatism_desc:0 "Местные советы опасаются, что общее правительство повторит порядки прежних завоевателей. Печать Кавите ещё не заменяет доверия островов."
 JPA_borneo_escorts:0 "Главные силы у Борнео"
 JPA_borneo_escorts_desc:0 "Флот сохраняет готовность ценой более тяжёлой службы на Лусоне."
 JPA_forced_guarantees:0 "Гарантии, продиктованные Осакой"
 JPA_forced_guarantees_desc:0 "Спешные заимствования поставили казну в зависимость от условий Мицубиси. Пересмотр государственных гарантий позволит избавиться от навязанных обязательств."
 JPA_hasty_orders:0 "Приказы в последний момент"
 JPA_hasty_orders_desc:0 "Ультиматум предъявлен без согласованного плана действий флота."
 JPA_manila_escorts:0 "Манила получает охранение"
 JPA_manila_escorts_desc:0 "Гарнизон разгружен, но борнейская эскадра работает меньшими силами."
 JPA_unwritten_neutrality:0 "Односторонний северный нейтралитет"
 JPA_unwritten_neutrality_desc:0 "Сайго объявил условия сам. Завершить Северный протокол, чтобы заменить диктат договором."
 JPC_bad_loans:0 "Филиппинские векселя"
 JPC_bad_loans_desc:0 "Мицубиси оплатила захват Манилы. Доходы не покрывают гарнизонных расходов; новые суда строятся в долг."
 JPC_credit:0 "Обеспеченный кредит ВТП"
 JPC_credit_desc:0 "Палата оплачивает доставку, но требует обслуживание долга. Кредит можно погасить после войны."
 JPC_exhaustion:0 "Цена затяжной войны"
 JPC_exhaustion_desc:0 "Обещанная короткая экспедиция стала чередой конвоев, госпиталей и новых займов."
 JPC_guarantees:0 "Нефть, которой ещё нет"
 JPC_guarantees_desc:0 "Ивасаки согласился снабжать флот под государственную гарантию монополии на борнейскую нефть. Банкротство отсрочено, обязательства остались."
 JPC_joint_staff:0 "Временный штаб Ито"
 JPC_joint_staff_desc:0 "Сухопутные офицеры и адмиралы согласовали порядок снабжения. Это рабочий компромисс, а не примирение фракций."
 JPC_luzon:0 "Манила — ещё не Лусон"
 JPC_luzon_desc:0 "Порт занят, горы не покорены. Оккупационные расходы поглощают людей и снабжение."
 JPC_monopoly:0 "Борнейская монополия Мицубиси"
 JPC_monopoly_desc:0 "Государство исполняет обещание февраля 1893 года. Добыча растёт, но нефтяные доходы прежде всего обслуживают корпоративный долг."
 JPC_neutral_ports:0 "Нейтральные угольные станции"
 JPC_neutral_ports_desc:0 "Гавайи разрешили коммерческое обслуживание. Договор не даёт баз, территорий или права втянуть королевство в войну."
 JPC_north_neutral:0 "Нейтралитет Хоккайдо"
 JPC_north_neutral_desc:0 "Сайго получает обещанные поставки с Хонсю и не вмешивается в южную войну. Его солдат Токио не получит."
 JPC_pacific_watch:0 "Тихоокеанская тревога"
 JPC_pacific_watch_desc:0 "Японская экспансия заставляет порты готовить береговую оборону и проверять маршруты снабжения."
 JPC_paper_victory:0 "Пиррова победа"
 JPC_paper_victory_desc:0 "На карте прибавился север Борнео. В казне прибавились долги, в семьях — похоронные письма. Сайго и Ивасаки снова предъявят свои счета."
 JPC_recovery:0 "Демобилизация по частям"
 JPC_recovery_desc:0 "Гарнизоны остаются на островах, но часть военных расходов наконец удаётся сократить."
 JPC_returned_split:0 "Раскол возвращается"
 JPC_returned_split_desc:0 "Внешний враг перестал связывать совет. Север требует свободы действий, Осака — выплат, флот — новых кораблей."
 JPC_three_heads:0 "Три головы одной империи"
 JPC_three_heads_desc:0 "Печать Мэйдзи скрепляет приказы, но не примиряет Ито, Сайго и Ивасаки. Каждый распоряжается своей частью державы."
 JPC_two_fronts:0 "Два моря, один флот"
 JPC_two_fronts_desc:0 "Ито делит корабли между Манилой и Борнео. Победа в одном море не освобождает от обязанностей в другом."
 JPD_industrial_economy:0 "Развитая национальная промышленность"
 JPD_industrial_economy_desc:0 "Инженерная база и устойчивое финансирование поддерживают рост производства и исследований."
 JPD_oceanic_service:0 "Океанская служба флота"
 JPD_oceanic_service_desc:0 "Согласованные правила службы и снабжения позволяют эскадрам действовать вдали от метрополии."
 JPD_permanent_staff:0 "Объединённый генеральный штаб"
 JPD_permanent_staff_desc:0 "Армия и флот согласуют планы через постоянное командование."
 JPD_professional_supply:0 "Профессиональная служба снабжения"
 JPD_professional_supply_desc:0 "Постоянные интенданты и общие правила доставки укрепляют армию."
 JPD_settled_government:0 "Урегулированный императорский кабинет"
 JPD_settled_government_desc:0 "Полномочия двора и ведомств определены; чрезвычайный раскол трёх сил завершён."
 JPD_standardized_industry:0 "Единые производственные стандарты"
 JPD_standardized_industry_desc:0 "Общие требования к заводам и верфям сокращают потери между заказом и готовой продукцией."
 JPD_sustainable_finance:0 "Устойчивые государственные финансы"
 JPD_sustainable_finance_desc:0 "После урегулирования военных долгов казна планирует расходы на постоянной основе."
 JPF_budget_mistrust:0 "Недоверие вкладчиков"
 JPF_budget_mistrust_desc:0 "Доверие ниже 30: новые обещания кабинета теряют вес."
 JPF_cash_freeze:0 "Кассовый разрыв"
 JPF_cash_freeze_desc:0 "Кредитные обещания не заменяют деньги для текущих платежей."
 JPF_civilian_retrenchment:0 "Сокращённые гражданские заказы"
 JPF_civilian_retrenchment_desc:0 "Казначейство высвобождает средства, откладывая гражданские проекты."
 JPF_coal_contracts:0 "Уголь для действующих эскадр"
 JPF_coal_contracts_desc:0 "Поставки закреплены за военными рейсами."
 JPF_debt_distress:0 "Счета без покрытия"
 JPF_debt_distress_desc:0 "Давление от 75: поставщики замедляют исполнение заказов."
 JPF_delivery_arrears:0 "Задолженность рабочим верфей"
 JPF_delivery_arrears_desc:0 "Невыплаченное жалованье срывает производственный график."
 JPF_excise_collection:0 "Чрезвычайный акциз"
 JPF_excise_collection_desc:0 "Кредиторам платят за счёт потребления городов."
 JPF_families_arrears:0 "Отложенные выплаты семьям"
 JPF_families_arrears_desc:0 "Флот получил платёж раньше семей моряков."
 JPF_treasury_ledger:0 "Чрезвычайная книга казначейства"
 JPF_treasury_ledger_desc:0 "Долговое давление и доверие определяют ежемесячное обслуживание и доступность решений."
 JPF_verified_accounts:0 "Проверенные счета"
 JPF_verified_accounts_desc:0 "Реформа отчётности и доверие от 65 возвращают предсказуемость заказам."
 JPF_yard_retrenchment:0 "Отложенные заказы верфям"
 JPF_yard_retrenchment_desc:0 "Экономия сегодня означает меньше готовых кораблей завтра."
 JPI_airship_service:0 "Небесные верфи"
 JPI_airship_service_desc:0 "Серийные эллинги снижают стоимость дирижаблей на 15%, отвлекая мощности от надводного флота."
 JPI_coal_bunkers:0 "Угольная программа Кюсю"
 JPI_coal_bunkers_desc:0 "Пароходы и новые верфи опираются на угольную сеть. Её обслуживание требует дополнительного морского снабжения."
 JPI_exposed_orders:0 "Раскрытые закупки"
 JPI_exposed_orders_desc:0 "Противник знает часть приготовлений. Эскадре приходится менять планы и способы связи."
 JPI_heavy_yards:0 "Стапели Курэ"
 JPI_heavy_yards_desc:0 "Корабельные заказы получают лучших специалистов; производственная стоимость авиации повышена на 10%."
 JPI_oil_shortage:0 "Переоснащение нефтяной промышленности"
 JPI_oil_shortage_desc:0 "На 180 дней специалисты отвлечены от текущего выпуска к будущей нефтепереработке. Уголь остаётся топливной основой флота."
 JPI_portable_towers:0 "Испытанные береговые станции"
 JPI_portable_towers_desc:0 "Японский переносной образец прошёл береговые испытания. Электрическое поле прикрывает первый плацдарм от Песни."
 JPI_rough_industry:0 "Самостоятельные мастерские"
 JPI_rough_industry_desc:0 "Собственные заводы строятся быстро, но разнородное оборудование ограничивает эффективность."
 JPI_scarlet_iron_coal:0 "Железные алые паруса"
 JPI_scarlet_iron_coal_desc:0 "Тяжёлые алые корабли прикрывают десант: прочные корпуса, мощный огонь и захватные «щупальца». Угольная сеть Кюсю даёт запас хода и упорядоченное снабжение."
 JPI_scarlet_iron_copies:0 "Железные алые паруса"
 JPI_scarlet_iron_copies_desc:0 "Тяжёлые алые корабли прикрывают десант: прочные корпуса, мощный огонь и захватные «щупальца». Собственные образцы улучшают надёжность техники; источник решений остаётся непризнанным."
 JPI_scarlet_iron_machines:0 "Железные алые паруса"
 JPI_scarlet_iron_machines_desc:0 "Тяжёлые алые корабли прикрывают десант: прочные корпуса, мощный огонь и захватные «щупальца». Купленные станки ускоряют выпуск, но списки закупок известны Палате."
 JPI_scarlet_iron_oil:0 "Железные алые паруса"
 JPI_scarlet_iron_oil_desc:0 "Тяжёлые алые корабли прикрывают десант: прочные корпуса, мощный огонь и захватные «щупальца». Средства вложены в будущее: нефтепереработка получает постоянный исследовательский приоритет."
 JPI_scarlet_sky_coal:0 "Алые небеса"
 JPI_scarlet_sky_coal_desc:0 "Дирижабли дальней разведки ведут десант к берегу; надводный флот уступил им часть промышленной базы. Угольная сеть Кюсю даёт запас хода и упорядоченное снабжение."
 JPI_scarlet_sky_copies:0 "Алые небеса"
 JPI_scarlet_sky_copies_desc:0 "Дирижабли дальней разведки ведут десант к берегу; надводный флот уступил им часть промышленной базы. Собственные образцы улучшают надёжность техники; источник решений остаётся непризнанным."
 JPI_scarlet_sky_machines:0 "Алые небеса"
 JPI_scarlet_sky_machines_desc:0 "Дирижабли дальней разведки ведут десант к берегу; надводный флот уступил им часть промышленной базы. Купленные станки ускоряют выпуск, но списки закупок известны Палате."
 JPI_scarlet_sky_oil:0 "Алые небеса"
 JPI_scarlet_sky_oil_desc:0 "Дирижабли дальней разведки ведут десант к берегу; надводный флот уступил им часть промышленной базы. Средства вложены в будущее: нефтепереработка получает постоянный исследовательский приоритет."
 JPI_selective_imports:0 "Торговля на японских условиях"
 JPI_selective_imports_desc:0 "Чужие знания ускоряют исследования. Импортная зависимость повышает цену снабжения и штраф при нехватке сырья; Палата видит списки заказов."
 JPI_shipboard_power:0 "Корабельная электрическая сеть"
 JPI_shipboard_power_desc:0 "Генераторы уменьшают морской расход снабжения на 8% и ускоряют подготовку морских вторжений на 10%."
 JPI_workshop_network:0 "Сеть флотских мастерских"
 JPI_workshop_network_desc:0 "Распределённые мастерские ускоряют строительство верфей на 5%. Разработка оплачена дополнительными долговыми обязательствами."
 JPL_accountable_occupation:0 "Подотчётная манильская управа"
 JPL_accountable_occupation_desc:0 "Закупки и довольствие проходят проверку; горы Лусона остаются непокорёнными."
 JPL_escorts_diverted:0 "Эскорты у Манилы"
 JPL_escorts_diverted_desc:0 "Охранение занято филиппинскими рейсами и теряет готовность для Борнео."
 JPL_exhausted_rotations:0 "Гарнизон на пределе"
 JPL_exhausted_rotations_desc:0 "Усталость от 85: служба в тропиках стала бессрочной."
 JPL_garrison_emergency:0 "Чрезвычайное снабжение Манилы"
 JPL_garrison_emergency_desc:0 "Нагрузка от 70: гарнизон поглощает ресурсы южной кампании."
 JPL_hospital_service:0 "Госпитальная служба"
 JPL_hospital_service_desc:0 "Медицинская эвакуация восстанавливает людей ценой гражданских ресурсов."
 JPL_limited_garrison:0 "Ограниченный манильский гарнизон"
 JPL_limited_garrison_desc:0 "Нагрузка ниже 40. Оккупация всё ещё требует снабжения."
 JPL_overloaded_garrison:0 "Перегруженный гарнизон"
 JPL_overloaded_garrison_desc:0 "Нагрузка от 40: порт не успевает обслуживать войска."
 JPL_perimeter_order:0 "Сокращённый периметр"
 JPL_perimeter_order_desc:0 "Меньше маршрутов снабжения, больше изоляции и усталости."
 JPL_repair_network:0 "Фронтовая ремонтная сеть"
 JPL_repair_network_desc:0 "Полевой ремонт снижает расход снабжения армии на 5%."
 JPL_worn_rotations:0 "Изношенные ротации"
 JPL_worn_rotations_desc:0 "Усталость от 60 подрывает восстановление частей."
 JPN_north_broken_protocol:0 "Сорванный протокол"
 JPN_north_broken_protocol_desc:0 "Поставки и арбитраж должны восстановить рабочие отношения."
 JPN_north_civilian_charters:0 "Гражданские северные караваны"
 JPN_north_civilian_charters_desc:0 "Гражданские суда разгружают военные маршруты за дополнительную плату."
 JPN_north_closed_warehouses:0 "Закрытые северные склады"
 JPN_north_closed_warehouses_desc:0 "Доверие ниже 35: Сайго ограничивает доступ столичных чиновников."
 JPN_north_fleet_appropriation:0 "Компенсация адмиралтейству"
 JPN_north_fleet_appropriation_desc:0 "Новые деньги примиряют Ито с расходами на Север."
 JPN_north_fleet_grievance:0 "Ропот адмиралтейства"
 JPN_north_fleet_grievance_desc:0 "Раздражение от 60: Ито считает, что Север живёт за счёт флота."
 JPN_north_limited_compact:0 "Ограниченный северный компакт"
 JPN_north_limited_compact_desc:0 "Постоянные гражданские обязательства заменяют кризисные переговоры. Военный нейтралитет сохраняется."
 JPN_north_obligation:0 "Цена северного нейтралитета"
 JPN_north_obligation_desc:0 "Хоккайдо получает довольствие, но не посылает дивизий на Борнео."
 JPN_north_unfinished_peace:0 "Незавершённый северный мир"
 JPN_north_unfinished_peace_desc:0 "Борнео больше не оправдывает отсрочки. Север снова требует ответа."
 JPT_arctic_crisis:0 "Гренландский дипломатический кризис"
 JPT_arctic_crisis_desc:0 "Экспедиция Сайго вызвала протесты Дании, Британии и России. Арктический спор угрожает расширить тихоокеанскую войну."
 JPT_iwasaki_dependence:0 "Казна на гарантиях Ивасаки"
 JPT_iwasaki_dependence_desc:0 "Спасение Мицубиси и Партии Золотой Середины оплачено зависимостью казны от конгломерата."
 JPT_mitsubishi_collapse:0 "Крах Мицубиси"
 JPT_mitsubishi_collapse_desc:0 "Просроченные векселя заморозили военные поставки. Реформируйте займы и завершите чрезвычайную реструктуризацию."
 JPT_northern_front:0 "Север снова стал фронтом"
 JPT_northern_front_desc:0 "Гражданская война поглощает снабжение и средства, предназначенные для южного рывка. Штраф исчезает после покорения Хоккайдо."
 JPT_osaka_distrust:0 "Недоверие купечества Осаки"
 JPT_osaka_distrust_desc:0 "Казна контролирует долги, но торговые дома сокращают вложения и военные заказы."
 JPX_kami_mandate:0 "Круг будущего Совета Ками"
 JPX_kami_mandate_desc:0 "Священнослужители предлагают освятить решения трона и объединить страну вокруг живого божества. Их круг ещё не стал Советом Ками, но содержание святилищ уже требует средств. Личная власть Мэйдзи и власть жрецов от его имени — разные будущие."
 JPX_land_mandate:0 "Проповедь возвращения"
 JPX_land_mandate_desc:0 "Сайго нужен путь на Хонсю, открытый словом, а не штыком. Его сторонники ищут союз офицеров, крестьян и жрецов вокруг возвращения на континент. Флот воспринимает проповедь как покушение на свой бюджет."
 JPX_sea_mandate:0 "Пакт трона и адмиралтейства"
 JPX_sea_mandate_desc:0 "Ито предлагает двору соглашение, а не переворот: император сохраняет трон, адмиралтейство получает право определять южный курс. Кредиторы ещё потребуют своего, а северные офицеры запомнят, чьими интересами пожертвовали."
 JPX_throne_mandate:0 "Личный мандат Мэйдзи"
 JPX_throne_mandate_desc:0 "Мэйдзи требует прямых докладов, минуя посредников трёх фракций. Это первый шаг к личному правлению, а не передача власти жрецам. Ведомства сопротивляются проверкам; гвардию и новую бюрократию ещё нужно построить."
 JPX_trade_mandate:0 "Кредит доверия Осаке"
 JPX_trade_mandate_desc:0 "Ивасаки просит политический мандат искать договор вместо победы. Директора обещают оживить оборот, военные видят готовность уступить. Перемирия пока нет: сначала нужно выяснить, кто оплатит его цену."
 PZ_aztec_prophecy:0 "Пятое Солнце"
 PZ_aztec_prophecy_desc:0 "Генералиссимус Эрнандес опирается на Пророка Пятого Солнца. Военная власть и религиозная проповедь объединяют мексиканских изгнанников."
 PZ_british_admiralty:0 "Корона и Адмиралтейство"
 PZ_british_admiralty_desc:0 "Виктория сохраняет корону, но фактическая власть принадлежит адмиралу Джону Фишеру. Бермуды стали убежищем монархов и центром борьбы за морские пути."
 PZ_philippine_confederation:0 "Федерация в становлении"
 PZ_philippine_confederation_desc:0 "Правительство в изгнании стремится объединить острова против Японии. Себу и Панай сохраняют собственную власть; Сулу не доверяет центральному правительству."
 PZ_russian_dual_power:0 "Император и Победоносцев"
 PZ_russian_dual_power_desc:0 "Александр III правит империей в изгнании. Константин Победоносцев оспаривает курс на модернизацию и осуждает исследования Теслы. Их конфликт ещё не разрешён."
 WTC_blacklist:0 "Чёрный список Палаты"
 WTC_blacklist_desc:0 "При долге выше 90 британское прикрытие позволяет ВТП отлучать должника от торговых контрактов."
 WTC_british_dependence:0 "Британский щит Мадейры"
 WTC_british_dependence_desc:0 "У Палаты нет регулярной армии. Стражи Проливов — наёмники, британские флот и разведка обеспечивают дальнее принуждение."
 WTC_cable_blackout:0 "Телеграфное отлучение"
 WTC_cable_blackout_desc:0 "Палата задерживает коммерческие и дипломатические сообщения должника."
 WTC_cable_contract:0 "Кабели Мадейры"
 WTC_cable_contract_desc:0 "Приоритет телеграфной связи по договору ВТП. Контроль кабеля остаётся у кредитора."
 WTC_local_receivership:0 "Местная долговая администрация"
 WTC_local_receivership_desc:0 "При долге 100 кредиторы сменили кабинет. Территория остаётся под местным управлением; Палата собирает платежи через него."
 WTC_pirate_channels:0 "Тайные лоцманские договоры"
 WTC_pirate_channels_desc:0 "Пиратам платят за безопасные коридоры. Покровительство тайного департамента дорого обходится репутации."
 WTC_port_concession:0 "Портовая концессия ВТП"
 WTC_port_concession_desc:0 "Портовые сборы направляются на погашение долга Палате. Местная администрация сохраняет власть над гаванью, но распоряжаться всей её выручкой больше не может."
 WTC_silver_convoy:0 "«Серебряный Конвой»"
 WTC_silver_convoy_desc:0 "Страхование доступно только через Палату. Подписка оплачивает аварийные службы, но подчиняет судовладельцев единому страховщику."
 WTC_technocratic_credit:0 "Лабораторные контракты Палаты"
 WTC_technocratic_credit_desc:0 "Молодые технократы оплачивают приборы и связь в обмен на доступ к разработкам."
 WTC_unprotected_routes:0 "Страховщик без эскорта"
 WTC_unprotected_routes_desc:0 "Британское прикрытие потеряно. Чёрный список не действует, долговой переворот срывается; кабельное давление остаётся."
 pacific_trade_accord_idea:0 "Батавская торговая конвенция"
 pacific_trade_accord_idea_desc:0 "Батавская торговая конвенция: постоянная программа, обеспечивающая подготовку кадров и согласованную работу государственных служб."
