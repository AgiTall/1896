l_russian:
 blv_story.1.t:0 "Порядок прохода через Малакку"
 blv_story.1.d:0 "Подтвердить свободу прохода или распорядиться о блокаде. После утверждения приказ поступит капитанам и портовым службам."
 blv_story.1.a:0 "Свободный проход"
 blv_story.1.b:0 "Блокада"
 blv_story.2.t:0 "Патенты раннего глушителя"
 blv_story.2.d:0 "Чертежи ранней установки можно оставить закрытыми или предложить Палате ограниченную лицензию. Дальний глушитель сюда не входит."
 blv_story.2.a:0 "Закрытый архив"
 blv_story.2.b:0 "Предложить лицензию"
 blv_story.4.t:0 "Ранние установки для флота"
 blv_story.4.d:0 "Выбрать корабельную установку малого радиуса или стационарную башню. Технология 1895 года не заменяет дальний опыт 1900 года."
 blv_story.4.a:0 "Корабельная установка"
 blv_story.4.b:0 "Стационарная башня"
 blv_story.5.t:0 "Программа дирижаблей"
 blv_story.5.d:0 "Назначить разведывательную или ударную роль программе. От решения зависят подготовка экипажей и распределение средств."
 blv_story.5.a:0 "Разведывательная служба"
 blv_story.5.b:0 "Ударная программа"
 blv_story.6.t:0 "Мандат северной экспедиции"
 blv_story.6.d:0 "Подготовить закрытый поход или пригласить партнёров. Их участие потребует согласия, а раскопки начнутся отдельно с 1898 года."
 blv_story.6.a:0 "Закрытая экспедиция"
 blv_story.6.b:0 "Пригласить партнёров"
 blv_story.8.t:0 "Правовое положение Совета корон"
 blv_story.8.d:0 "Совет может стать легальным политическим объединением изгнанных дворов. Он не заменяет действующий кабинет и не получает чужие государства."
 blv_story.8.a:0 "Легальное объединение"
 blv_story.8.b:0 "Раздельные дворы"
 blv_story.3.t:0 "Лицензия британского Адмиралтейства"
 blv_story.3.d:0 "Британия предлагает ранние чертежи за 75 политического влияния. Покупка не передаёт Теслу и не даёт артефакт."
 blv_story.3.a:0 "Приобрести лицензию"
 blv_story.3.b:0 "Отказаться"
 blv_story.7.t:0 "Приглашение в северную экспедицию"
 blv_story.7.d:0 "Британия приглашает наблюдателей. Согласие не передаёт артефакт и не списывает средства без нашего решения."
 blv_story.7.a:0 "Направить наблюдателей"
 blv_story.7.b:0 "Не участвовать"
 blv_story.9.t:0 "Объединение изгнанных корон"
 blv_story.9.d:0 "Предлагается участие в политическом Совете корон. Наше правительство, правящий строй и суверенитет сохраняются."
 blv_story.9.a:0 "Присоединить делегацию"
 blv_story.9.b:0 "Сохранить отдельный двор"
