l_russian:
 A01_abolish_admirals_council:0 "Упразднить Совет адмиралов"
 A01_abolish_admirals_council_desc:0 "Совет лишится права ограничивать гражданское правительство. Морские офицеры сохраняют военную службу."
 A01_admirals_council_coup: "Переворот Совета Адмиралов"
 A01_admirals_council_coup_desc: "Совет Адмиралов больше не намерен терпеть слабость гражданского правительства. Людольф будет отстранён, а Батавия станет морской стратократией."
 A01_admirals_on_trial:0 "Адмиралы перед судом"
 A01_admirals_on_trial_desc:0 "Предъявить доказательства парламентским юристам и добиться персональных приговоров. Медленное следствие сохранит флот, но потребует трёх комплектов доказательств и поддержки капитанов."
 A01_admirals_retirement:0 "Пенсия вместо политического вето"
 A01_admirals_retirement_desc:0 "Купить согласие на роспуск Совета гарантиями пенсий и неприкосновенности. Уходящие адмиралы сохранят связи в закупках: договор ещё придётся пересмотреть."
 A01_admiralty_diplomacy:0 "Дипломатия канонерок"
 A01_admiralty_diplomacy_desc:0 "Адмиралы уверены, что усиленный флот заставит Японию считаться с Батавией. Предложим торговые гарантии с позиции силы, сохранив готовность защищать Борнео."
 A01_admiralty_shipyards:0 "Верфи Адмиралтейства"
 A01_admiralty_shipyards_desc:0 "Адмиральский режим направит казённые средства на расширение верфей Сурабаи. Контроль над морем потребует постоянного пополнения флота."
 A01_archipelago_command:0 "Единое командование архипелага"
 A01_archipelago_command_desc:0 "Армия и флот должны защищать один архипелаг, а не собственные ведомственные интересы. Единое командование объединит планы обороны."
 A01_archipelago_great_power:0 "Держава архипелага"
 A01_archipelago_great_power_desc:0 "Признать, что будущее страны находится на островах. Общая оборона и равный доступ к командованию дадут опору новой тихоокеанской державе, но военный бюджет потребует жертв."
 A01_autonomous_sultanates:0 "Соглашение с султанатами"
 A01_autonomous_sultanates_desc:0 "Признаем местное самоуправление и договоримся об участии султанатов в будущей федерации. Действующий механизм создаёт автономные субъекты; позднее они смогут войти в общее государство."
 A01_batavia_docks:0 "Доковый комплекс Батавии"
 A01_batavia_docks_desc:0 "Углубление гаваней и новые сухие доки позволят обслуживать эскадру в Батавии. Повреждённым кораблям больше не придётся искать ремонт за пределами наших вод."
 A01_blame_the_military:0 "Закон власти: позор на армию"
 A01_blame_the_military_desc:0 "Проиграв войну, образованный политик и философ Людольф осознает главный закон власти: позор поражения должен пасть на армию, а не на правительство. Все стратегические провалы, нехватка снабжения и тактическая слепота будут возложены на Совет адмиралов, спасая гражданский кабинет."
 A01_british_raj_model:0 "Опыт Британской Индии"
 A01_british_raj_model_desc:0 "Вместо силового переламывания местного населения через колено Нидерланды берут на вооружение британский колониальный опыт: не прямое насилие, а гибкое лавирование, автономия и взаимные выгоды."
 A01_build_bornean_fortifications:0 "Инспекция укреплений"
 A01_build_bornean_fortifications_desc:0 "Проверка береговых позиций укрепит доверие к правительству. После инспекции выберем государственное строительство или проект внешних специалистов."
 A01_cabinet_island_schools:0 "Островные училища Радена Сурьи"
 A01_cabinet_island_schools_desc:0 "Коалиция направит средства на подготовку учителей и инженеров. Королевские и султанские земли получат общую школьную программу при сохранении местных языков."
 A01_cabinet_open_budget:0 "Открытый бюджет ван Рейна"
 A01_cabinet_open_budget_desc:0 "Государственные расходы станут предметом открытого парламентского отчёта. Кабинет направит средства в гражданские предприятия и королевские инженерные школы."
 A01_cabinet_princely_budget:0 "Морской бюджет ван дер Велде"
 A01_cabinet_princely_budget_desc:0 "Партия порядка сочетает гарантии султанским дворам с заказами верфям. Капитаны получат средства, но политическое вето Совета не вернётся."
 A01_capital_of_two_worlds:0 "Столица двух миров"
 A01_capital_of_two_worlds_desc:0 "В изгнании столица стала домом короны. Построим правительственный квартал и предложим городу имя Новый Амстердам. Городской совет вправе сохранить Батавию или выбрать двойное название."
 A01_civilian_admiralty:0 "Морское министерство вместо Совета"
 A01_civilian_admiralty_desc:0 "Министр отвечает за бюджет перед гражданской властью, штаб занимается операциями. Победить адмиралов недостаточно: нужно создать учреждение, которое не станет новым Советом."
 A01_civilian_defence_ministry:0 "Гражданское министерство обороны"
 A01_civilian_defence_ministry_desc:0 "Передадим бюджет и назначения гражданскому министру."
 A01_coastal_watch:0 "Береговая наблюдательная служба"
 A01_coastal_watch_desc:0 "Сведём наблюдение за побережьями и островную оборону в единый порядок."
 A01_conservative_victory:0 "Победа Консерваторов"
 A01_conservative_victory_desc:0 "Победившая партия принимает мандат избирателей."
 A01_constitution: "Поправки к Конституции 1854 года"
 A01_constitution_desc: "Принятие поправок временно ограничит вмешательство Совета Адмиралов. В течение двух недель правительство сможет бесплатно менять законы о призыве, экономике и торговле."
 A01_crown_above_factions:0 "Корона над спором кабинетов"
 A01_crown_above_factions_desc:0 "Предложение королевы-матери открывает третий выход из послевоенного кризиса. При равновесии гражданского кабинета и адмиралов Эмма примет регентство."
 A01_crown_absolute_rule:0 "Абсолютная власть короны"
 A01_crown_absolute_rule_desc:0 "Упразднить политическую власть Совета адмиралов и подчинить министров королеве."
 A01_crown_commonwealth:0 "Королевское содружество"
 A01_crown_commonwealth_desc:0 "Закрепить равноправие народов и договорное устройство содружества с Индонезией."
 A01_crown_island_council:0 "Совет островов при короне"
 A01_crown_island_council_desc:0 "Представители островов получат право обсуждать бюджет и обращаться к регентше напрямую."
 A01_crown_legal_guarantees:0 "Гарантии королевских судов"
 A01_crown_legal_guarantees_desc:0 "Закрепить порядок рассмотрения жалоб на военную администрацию и защиту островных хартий."
 A01_crown_militarism:0 "Военная монархия"
 A01_crown_militarism_desc:0 "Направить средства на верфи и мобилизацию ценой гражданского снабжения."
 A01_crown_parliament:0 "Парламент при короне"
 A01_crown_parliament_desc:0 "Собрать голландских и индонезийских представителей под властью конституционной короны."
 A01_crown_provincial_diets:0 "Провинциальные собрания при короне"
 A01_crown_provincial_diets_desc:0 "Даже указу нужна обратная связь. Создадим совещательные собрания островов с выборными гражданскими делегатами. Они не назначают кабинет, но могут оспаривать действия чиновников."
 A01_defence_in_depth:0 "Оборона в глубину"
 A01_defence_in_depth_desc:0 "Удержать каждую бухту невозможно. Подготовленные рубежи и резервы позволят сдержать противника после высадки и выиграть время для контрудара."
 A01_demobilise_colonial_army:0 "Демобилизация и возвращение домой"
 A01_demobilise_colonial_army_desc:0 "Завершим принудительный военный призыв и введём переходный порядок службы."
 A01_democratic_federation:0 "Демократическая Федерация Нидерландов и Индонезии"
 A01_democratic_federation_desc:0 "Создадим общее демократическое государство. Собственные автономные султанаты войдут в федерацию; чужие и японские территории не передаются. Избирательная система потребует отдельных реформ."
 A01_direct_naval_rule: "Прямое управление флота"
 A01_direct_naval_rule_desc: "Гражданский парламент будет распущен, а государственный аппарат перейдёт под прямой контроль флота. Мобилизация ускорится, и колониальная администрация получит больше возможностей для жёсткого подавления сопротивления."
 A01_direct_rivalry:0 "Прямое соперничество"
 A01_direct_rivalry_desc:0 "Батавия открыто оспорит японское господство. Этот курс не запускает и не сбрасывает независимый японский отсчёт."
 A01_domestic_debt_redemption:0 "Выкупить долговые обязательства"
 A01_domestic_debt_redemption_desc:0 "Погасим оборонные займы собственными средствами. Казна избавится от прежних платежей, не принимая новых условий Всемирной торговой палаты."
 A01_dutch_literacy:0 "Нидерландская грамотность"
 A01_dutch_literacy_desc:0 "Обязательное обучение чтению, счёту и нидерландскому языку готовит крестьян к фабричной работе. Аграрное общество ослабляется, а обязательная нидерландская школа ускоряет освоение производства."
 A01_elected_civil_service:0 "Ответственное гражданское правительство"
 A01_elected_civil_service_desc:0 "Заменим временный мандат постоянными правилами гражданской службы."
 A01_electoral_act:0 "Избирательный закон архипелага"
 A01_electoral_act_desc:0 "Определить устройство выборов: территориальный компромисс с князьями или равное гражданское представительство. Обе системы дадут парламенту право утверждать премьер-министра."
 A01_electoral_commission:0 "Избирательная комиссия"
 A01_electoral_commission_desc:0 "Составим общие списки избирателей и гарантируем доступ островных общин к голосованию."
 A01_emma_and_daughter:0 "Эмма и её дочь"
 A01_emma_and_daughter_desc:0 "Решить спор о сроках передачи власти от регентши к королеве."
 A01_equal_citizenship:0 "Равное федеральное гражданство"
 A01_equal_citizenship_desc:0 "Отменим правовое разделение нидерландцев и индонезийцев."
 A01_equal_subjects:0 "Подданные становятся гражданами"
 A01_equal_subjects_desc:0 "Отменить отдельные гражданские разряды и открыть государственную службу индонезийцам. Придётся оплатить школы переводчиков и защитить реформу от колониальных собственников."
 A01_european_democratic_unity:0 "Объединение европейской демократии"
 A01_european_democratic_unity_desc:0 "Начать путь сближения и возможного объединения с Британией. Делегация проверит готовность Лондона, демократические круги получат поддержку."
 A01_factory_resettlement:0 "Переход к фабричному труду"
 A01_factory_resettlement_desc:0 "Постоянное переселение, жильё при фабриках и обучение на рабочем месте превращают трудовую повинность в новый уклад."
 A01_families_compensation:0 "Пенсии семьям погибших"
 A01_families_compensation_desc:0 "Установим выплаты вдовам, детям и инвалидам войны."
 A01_federal_constitution:0 "Конституция двух народов"
 A01_federal_constitution_desc:0 "Закрепим равные права, полномочия островов и ответственность правительства перед парламентом."
 A01_federal_defence_command:0 "Единое федеральное командование"
 A01_federal_defence_command_desc:0 "Объединим штаб армии, флота и островных гарнизонов под гражданским контролем."
 A01_first_federal_election:0 "Первые федеральные выборы"
 A01_first_federal_election_desc:0 "Острова впервые изберут общий парламент. Победившая партия получит право сформировать правительство и проводить программу, поддержанную избирателями."
 A01_first_royal_election:0 "Первые выборы при короне"
 A01_first_royal_election_desc:0 "Начинается 90-дневная кампания. Конституционный союз, партия порядка и индонезийская коалиция борются за большинство. Поддержка дворов и гражданские права повлияют на исход; агитация доступна в решениях."
 A01_fleet_of_recovery:0 "Флот под надзором Совета"
 A01_fleet_of_recovery_desc:0 "Восстановить верфи и передать адмиральскому штабу руководство морской программой. Совет использует новые назначения, чтобы собрать опору для собственного правительства."
 A01_fortify_australian_frontier: "Укрепить австралийский рубеж"
 A01_fortify_australian_frontier_desc: "Вместо рискованного сухопутного коридора мы превратим границу с австралийскими владениями в самостоятельный оборонительный пояс. Укреплённые пункты в Мерауке и Лаэ прикроют южный фланг колоний и не позволят японскому десанту закрепиться на подступах к Новой Гвинее."
 A01_general_amnesty:0 "Всеобщая амнистия"
 A01_general_amnesty_desc:0 "Чтобы не ввергнуть колонию в бесконечную вендетту, правительство объявляет амнистию рядовым офицерам и матросам, сложившим оружие. Арестованы только зачинщики хунты; общество умиротворено."
 A01_golden_bridges:0 "Золотые мосты для офицеров"
 A01_golden_bridges_desc:0 "Понимая, что лобовое столкновение со всем офицерским корпусом чревато мятежом, Людольф раскалывает военную элиту «золотыми мостами»: умеренные капитаны получают места в будущем парламенте, флотские оклады и почётные назначения."
 A01_guard_academy:0 "Академия королевской гвардии"
 A01_guard_academy_desc:0 "Совместная подготовка голландских и индонезийских офицеров превратит дворцовую охрану в профессиональный корпус. Присяга связывает его с государством и короной."
 A01_homeland_in_exile:0 "Нидерланды живут в изгнании"
 A01_homeland_in_exile_desc:0 "Сохранить память о потерянной метрополии, поддержать беженцев и готовить флот возвращения. Освобождение потребует сил и подходящего момента: один указ не вернёт родину."
 A01_implement_fortification_project:0 "Реализация проекта"
 A01_implement_fortification_project_desc:0 "Выполним выбранный план и свяжем порты Сабаха железной дорогой."
 A01_improve_bornean_fortifications:0 "Борнейский оборонительный пояс"
 A01_improve_bornean_fortifications_desc:0 "После собственного строительства или реализации выбранного проекта завершим оборону Джесселтона, Сандакана и Тавау: береговые форты уровня 2 и сухопутные уровня 1. Более сильные укрепления сохраняются. Работы требуют принадлежности Сабаха и контроля соответствующего порта."
 A01_indonesian_petition:0 "Петиция индонезийцев"
 A01_indonesian_petition_desc:0 "Учителя, портовые рабочие и ветераны требуют места рядом с князьями. Государство не удержится на договоре только с наследственными дворами."
 A01_island_compact:0 "Договор короны и архипелага"
 A01_island_compact_desc:0 "Земли, остающиеся под нашим управлением, получат согласованное устройство. Можно выпустить султанаты как автономных союзников или сохранить единую администрацию с местными хартиями. Японские владения и концессии договор не отменяет."
 A01_island_delegation:0 "Делегация островов"
 A01_island_delegation_desc:0 "Представители островов получают постоянное место в обсуждении государственных дел."
 A01_island_garrisons:0 "Гарнизоны островов"
 A01_island_garrisons_desc:0 "Введём единый порядок подготовки островных гарнизонов КНИЛ — регулярной колониальной армии."
 A01_island_officer_commissions:0 "Офицерские патенты для островитян"
 A01_island_officer_commissions_desc:0 "Откроем высшие командные должности индонезийцам. Султанские отряды и КНИЛ получат общую программу подготовки без ликвидации местных армий."
 A01_island_representation:0 "Представительство островов"
 A01_island_representation_desc:0 "Учредим представительство Явы, Суматры и автономных островов."
 A01_java_development:0 "План развития Явы"
 A01_java_development_desc:0 "Государственные заказы свяжут мастерские Батавии и предприятия Явы. Новые фабрики обеспечат архипелаг собственными промышленными товарами."
 A01_java_steam_power:0 "Паровая энергетика Явы"
 A01_java_steam_power_desc:0 "Объединим паровые электростанции и снабжение фабричных округов. Промышленная энергосеть ускорит строительство, а инфраструктура Батавии и Восточной Явы улучшится."
 A01_joint_officer_schools:0 "Совместные офицерские училища"
 A01_joint_officer_schools_desc:0 "Откроем офицерскую карьеру нидерландцам и индонезийцам."
 A01_jungle_supply:0 "Островная служба снабжения"
 A01_jungle_supply_desc:0 "Полевые инструкции и общее снабжение улучшат дух КНИЛ — регулярной ост-индской армии: организация возрастёт, подготовка ускорится, расход припасов снизится."
 A01_knil_reform:0 "Реформа КНИЛ — колониальной армии"
 A01_knil_reform_desc:0 "КНИЛ — Королевская нидерландская ост-индская армия — объединяет регулярные гарнизоны и полевые части архипелага. Введём общие правила подготовки, командования и снабжения. Добровольческое ополчение останется отдельной поддержкой на время войны."
 A01_last_chance_to_negotiate: "Последний шанс договориться"
 A01_last_chance_to_negotiate_desc:0 "Предложим Японии соглашение, пока спор о Борнео не перерос в войну. Уступки могут успокоить жителей островов, но противники Людольфа назовут их слабостью. Пока дипломаты ведут переговоры, японский флот продолжает приготовления."
 A01_legalise_federal_parties:0 "Легализовать федеральные партии"
 A01_legalise_federal_parties_desc:0 "Либералы, консерваторы и Народная партия получат равные права на участие в выборах."
 A01_liberal_victory:0 "Победа Либералов"
 A01_liberal_victory_desc:0 "Победившая партия принимает мандат избирателей."
 A01_local_nco_schools:0 "Местные сержантские школы"
 A01_local_nco_schools_desc:0 "Подготовить местных сержантов для КНИЛ — Королевской нидерландской ост-индской армии. Это регулярные сухопутные части архипелага. Армейский дух будет улучшен, а инспекция колониальной армии станет доступна в качестве начальника армии."
 A01_local_rifles:0 "Местное производство винтовок"
 A01_local_rifles_desc:0 "Оружейные контракты Сурабаи обеспечат винтовки и постоянную программу местных заказов. Она ускорит строительство военных заводов и повысит предельную эффективность производства."
 A01_lone_wolf_path: "Путь Одинокого Волка"
 A01_lone_wolf_path_desc: "Батавия не станет разменивать суверенитет на обещания чужой защиты. Мы откажемся от союзов и будем самостоятельно определять свою судьбу."
 A01_ludolf_retirement_navy:0 "Людольф во главе ВМФ"
 A01_ludolf_retirement_navy_desc:0 "Выполнив свою историческую миссию и сокрушив хунту, Людольф готовит себе безнаказанную отставку: он оставляет пост генерал-губернатора и переходит на почётную должность командующего ВМФ, открывая дорогу конституционному транзиту или регентству королевы-матери Эммы."
 A01_ludolf_survives:0 "Мандат на гражданские реформы"
 A01_ludolf_survives_desc:0 "Людольф сохраняет власть ради перехода от колониального режима к федерации. Гражданский мандат смягчит трудности переходного правительства."
 A01_marine_brigades:0 "Морские бригады"
 A01_marine_brigades_desc:0 "Для возвращения потерянных портов нужны части, способные высадиться с моря. Морские бригады будут обучаться вместе с корабельными командами."
 A01_military_industry:0 "Военные предприятия"
 A01_military_industry_desc:0 "Прямые заказы администрации позволят расширить яванские оружейные мастерские. Военные предприятия получат приоритет при распределении материалов."
 A01_military_state:0 "Государство военной элиты"
 A01_military_state_desc:0 "Подчинить Совету министерства, суды, бюджет и назначения. Чистки закончатся созданием системы, в которой все государственные аппараты принадлежат военной элите, а право возражать считается угрозой обороне."
 A01_naval_general_staff:0 "Морской генеральный штаб"
 A01_naval_general_staff_desc:0 "Разрозненные эскадры нуждаются в едином плане. Морской генеральный штаб согласует разведку, ремонт и боевое развёртывание."
 A01_negotiated_resignation:0 "Приход Совета адмиралов"
 A01_negotiated_resignation_desc:0 "Передать власть Совету сразу после формирования послевоенного кабинета. Адмиралы сместят и арестуют Людольфа за поражение, начнут чистки и подчинят государственные учреждения военной элите."
 A01_northern_memory:0 "Кто ответит за потерянные берега?"
 A01_northern_memory_desc:0 "Публикация списков потерь превращает горе в политический вопрос. Военная комиссия утверждает, что страну погубило гражданское вмешательство. Семьи погибших требуют выяснить, почему командование не смогло защитить острова."
 A01_open_papuan_road: "Открыть Папуасскую дорогу"
 A01_open_papuan_road_desc: "Австралийские власти готовы передать нам партию винтовок, но морской путь может быть перерезан японским флотом. Расчистив старые тропы и проложив дорогу к Мерауке, мы создадим сухопутный коридор снабжения через Папуа."
 A01_open_seas_kingdom:0 "Королевство открытых морей"
 A01_open_seas_kingdom_desc:0 "Будущее Нидерландов — торговое содружество, а не вечный реванш. Гарантируем автономным дворам рынки и морскую защиту, направив средства на мирное развитие."
 A01_own_fortifications:0 "Собственные укрепления"
 A01_own_fortifications_desc:0 "Будет построена железная дорога между портами Сабаха."
 A01_pacific_settlement:0 "Кабинет после поражения"
 A01_pacific_settlement_desc:0 "Поражение поставило под сомнение право прежнего кабинета управлять островами. Людольф ищет поддержку для гражданских реформ, Совет адмиралов требует власти, а двор предлагает посредничество короны. Созовём заседание, которое определит новый порядок управления."
 A01_postwar_admiralty_shipyards:0 "Верфи под контролем Совета"
 A01_postwar_admiralty_shipyards_desc:0 "Объединить ремонтные заказы и подготовку экипажей перед восстановлением флота."
 A01_princely_guarantees:0 "Гарантии наследственных дворов"
 A01_princely_guarantees_desc:0 "Местное право и престолонаследие остаются за султанами; общий суд защищает жителей от произвольных поборов. Султаны получат влияние, но лишатся права закрывать дорогу гражданскому представительству."
 A01_production_standardisation:0 "Единые фабричные стандарты"
 A01_production_standardisation_desc:0 "Единые чертежи, размеры деталей и нормы обучения заменят разрозненные порядки мастерских."
 A01_public_recovery_fund:0 "Государственный фонд восстановления"
 A01_public_recovery_fund_desc:0 "Завершим финансирование восстановления собственными средствами. Снимается бюджетная нагрузка, но долг ВТП сохраняется до отдельного погашения."
 A01_purge_civil_service:0 "Чистка гражданского аппарата"
 A01_purge_civil_service_desc:0 "Отстранить чиновников, связанных с прежним кабинетом, и назначить военных уполномоченных. Комиссии будут судить не только о служебных ошибках, но и о политической благонадёжности."
 A01_purge_officer_corps:0 "Чистка офицерского корпуса"
 A01_purge_officer_corps_desc:0 "Потребовать от командиров личной присяги Совету. Сомневающихся и сторонников гражданского контроля отстранят от должностей. Утрата опыта временно ослабит армию и флот."
 A01_purge_the_admiralty:0 "Ночь закрытых адмиралтейств"
 A01_purge_the_admiralty_desc:0 "Гвардия займёт министерство и арестует руководителей Совета. Двух лояльных групп капитанов хватит, чтобы удержать гавани; массовые отстранения временно нарушат работу флота."
 A01_reconstruction_commission:0 "Опись разрушений и обязательств"
 A01_reconstruction_commission_desc:0 "Комиссия сведёт расходы на восстановление, выплаты семьям и долги в единый реестр. Это откроет государственное финансирование и переговоры с ВТП."
 A01_recovery_investment:0 "От восстановления к развитию"
 A01_recovery_investment_desc:0 "Когда прежние обязательства будут погашены, казна сможет вложиться в расширение производства на Яве. Восстановление уступит место строительству новых предприятий."
 A01_reform_procurement:0 "Разорвать адмиральские контракты"
 A01_reform_procurement_desc:0 "Открытые тендеры заменят семейные соглашения. Пенсионный договор будет исполнен, но бывший Совет утратит контроль над закупками."
 A01_renew_the_fleet:0 "Флот после политической бури"
 A01_renew_the_fleet_desc:0 "Вернуть профессиональные экзамены, подготовить новых штабистов и закрыть вакансии. Реабилитация невиновных восстановит доверие; политические полномочия Совета не вернутся."
 A01_repair_ports:0 "Восстановить порты и мастерские"
 A01_repair_ports_desc:0 "Восстановим повреждённые причалы, мастерские и портовые склады. Исправные гавани вернут островам торговлю и избавят гарнизоны от перебоев снабжения."
 A01_request_fortification_project:0 "Запросить проект"
 A01_request_fortification_project_desc:0 "Рассмотрим предложения британских и австралийских инженеров наряду с планом островных общин. Правительство должно выбрать подходящий проект, обеспечить его материалами и довести укрепления до готовности."
 A01_responsible_cabinet:0 "Премьер-министр отвечает парламенту"
 A01_responsible_cabinet_desc:0 "Королева утверждает выбранного парламентом главу кабинета. Министры получают бюджетную ответственность, оппозиция — право запросов. Программа правительства зависит от победителя выборов."
 A01_review_borneo_convention:0 "Пересмотр Борнейской конвенции"
 A01_review_borneo_convention_desc:0 "Восстановив управление и флот, Батавия сможет сформулировать требования о пересмотре унизительного договора. Утрата земель останется центром внешней политики."
 A01_royal_academies:0 "Королевские институты архипелага"
 A01_royal_academies_desc:0 "Учредить инженерный институт, школу гражданской службы и службу переводов. Учебные места откроются жителям островов, а не только семьям администрации."
 A01_royal_commission:0 "Королевская комиссия по поражению"
 A01_royal_commission_desc:0 "Кто приказал оставить склады без прикрытия? Почему контракты получили родственники адмиралов? Открытое следствие даст доказательства, но Совет может приказать уничтожить архивы."
 A01_royal_constitution:0 "Конституция короны и архипелага"
 A01_royal_constitution_desc:0 "После устранения политической власти адмиралов корона примет конституцию. Парламент утвердит избирательный закон и изберёт премьер-министра."
 A01_royal_development_bank:0 "Королевский банк развития"
 A01_royal_development_bank_desc:0 "Совместные займы оплатят дороги и училища. Инвестиции поступят в земли короны и автономные султанаты; японские владения останутся за пределами программы."
 A01_royal_dictatorship:0 "Полная власть Королевы"
 A01_royal_dictatorship_desc:0 "Опираясь на гвардию и верных капитанов, королева подчинит Совет своей воле. Двор получит возможность направлять промышленность и вооружённые силы без согласования с прежними соперниками."
 A01_royal_guard_corps:0 "Корпус королевской гвардии"
 A01_royal_guard_corps_desc:0 "Сформировать отдельную дивизию королевской гвардии и создать военную опору реформ. Гвардия позволит силой устранить Совет, но чистка ослабит флот."
 A01_royal_island_charter:0 "Хартия короны и островов"
 A01_royal_island_charter_desc:0 "Подтвердить автономные права и созвать представителей архипелага. Корона должна опираться на договор с островами, а не на возвращение к неограниченной власти губернатора."
 A01_royal_naval_advisors:0 "Морские советники короны"
 A01_royal_naval_advisors_desc:0 "Офицеры флота присягают короне и готовят единые правила морской службы."
 A01_royal_secret_police:0 "Тайная полиция короны"
 A01_royal_secret_police_desc:0 "Создать службу надзора. Подавление сопротивления усилится, но общество заплатит за это доверием."
 A01_rubber_processing:0 "Переработка каучука"
 A01_rubber_processing_desc:0 "Вывозить сырой каучук проще, чем развивать переработку, но прибыль остаётся за морем. Построим предприятия рядом с суматранскими плантациями."
 A01_rural_labour_duty:0 "Трудовая повинность"
 A01_rural_labour_duty_desc:0 "Администрация вводит трудовые списки и обязательные квоты для деревень."
 A01_secure_sea_lanes:0 "Защита морских коммуникаций"
 A01_secure_sea_lanes_desc:0 "Конвойные маршруты получат общие правила охранения. Координация морского охранения повысит организацию флота; торговля также получит новые транспорты."
 A01_settle_crown_crisis:0 "Установить новый порядок"
 A01_settle_crown_crisis_desc:0 "Совет устранён, а островной договор подписан. Закрепим гражданское морское министерство и определим, кому принадлежит победа: конституции или личной власти королевы."
 A01_state_loan:0 "Государственный заём"
 A01_state_loan_desc:0 "Средства позволят начать собственное строительство."
 A01_strengthen_ludolfs_power: "Укрепить власть Людольфа"
 A01_strengthen_ludolfs_power_desc: "Людольф Слут ван де Беле сохранит гражданский контроль над государством, опираясь на инженеров, промышленников и прагматичную часть администрации."
 A01_sultanates_language_guarantees:0 "Гарантии прав и языков султанатам"
 A01_sultanates_language_guarantees_desc:0 "Султанаты получают широкую внутреннюю автономию, гарантии традиционных прав и сохранение своих родных языков в обмен на лояльность и общую внешнюю оборону."
 A01_sultans_at_the_palace:0 "Султаны у дворцового стола"
 A01_sultans_at_the_palace_desc:0 "Султаны готовы признать корону, но не нового генерал-губернатора под другим именем. Их делегации требуют ответа: кто собирает налоги, назначает судей и командует гарнизонами?"
 A01_sumatran_railways:0 "Суматранские железные дороги"
 A01_sumatran_railways_desc:0 "Плантации и порты Суматры разделяют сотни километров труднопроходимой местности. Железнодорожное строительство сократит путь от склада до причала."
 A01_summon_grand_council:0 "Последний ультиматум Большого совета"
 A01_summon_grand_council_desc:0 "Совет требует права утверждать назначения и блокировать указы. Королева должна выбрать: уступить, договориться или опереться на гвардию."
 A01_surabaya_arsenal:0 "Арсенал Сурабаи"
 A01_surabaya_arsenal_desc:0 "Сурабая станет центром ремонта оружия и выпуска боеприпасов. Армия не должна зависеть от каждого транспорта, прибывающего из Европы."
 A01_technical_college:0 "Батавский технический институт"
 A01_technical_college_desc:0 "Высшее техническое образование свяжет верфи и фабрики с подготовкой инженеров. Добавляется исследовательская ячейка и становится доступен инженерный совет Батавии."
 A01_town_hall_crisis:0 "Штурм адмиралтейской ратуши"
 A01_town_hall_crisis_desc:0 "Лишившись поддержки умеренных офицеров, радикалы из Совета адмиралов баррикадируются в ратуше и пытаются навязать стране военное правление. Верные кабинету полки окружают здание. Правительству предстоит подавить мятеж, прежде чем к нему присоединятся портовые гарнизоны."
 A01_wartime_industry:0 "Мобилизация промышленности"
 A01_wartime_industry_desc:0 "Мирные контракты уступят место срочным оборонным заказам. Дополнительный выпуск оружия потребует отвлечь рабочих и материалы от гражданских нужд."
 A01_wilhelmina_comes_of_age:0 "Совершеннолетие Вильгельмины"
 A01_wilhelmina_comes_of_age_desc:0 "Завершить регентство Эммы и передать власть Вильгельмине. Обычно это возможно с 31 августа 1898 года. Если в разговоре с матерью Вильгельмина настояла на своём, коронация может состояться досрочно."
 A01_win_the_captains:0 "Отделить капитанов от Совета"
 A01_win_the_captains_desc:0 "Мы выступаем против политического диктата, а не против морской службы. Гарантируем жалованье, пенсии и продвижение офицерам, которые признают гражданский контроль."
 A01_wtc_oil_and_rubber_offer:0 "Предложение для ВТП"
 A01_wtc_oil_and_rubber_offer_desc: "Всемирная Торговая Палата заинтересована в поставках нефти и каучука из наших владений. Запуск официального контакта с Палатой привлечёт первых покупателей, даст средства на новую фабрику и немного усилит демократическое влияние."
 A01_wtc_recovery_agreement:0 "Соглашение о восстановлении с ВТП"
 A01_wtc_recovery_agreement_desc:0 "Ранее предложенные нефть и каучук станут основой соглашения о финансировании ремонта, компенсаций и погашения займа."
 A01_wtc_settlement:0 "Погасить обязательства через ВТП"
 A01_wtc_settlement_desc:0 "Заключим с ВТП окончательное соглашение о погашении оборонного займа, ремонте портов и выплатах семьям. Палата предоставит средства под ранее обещанные коммерческие гарантии."
 A01_wtc_strengthening_path:0 "Усиление Всемирной торговой палаты"
 A01_wtc_strengthening_path_desc:0 "Начать демократизацию через торговые советы и соглашение с Мадейрой. Приоритет кабеля и страховка требуют нового долга."
 A10_capital_charters:0 "Манила и Батаан за общим столом"
 A10_capital_charters_desc:0 "Манильский порт и батареи Батаана должны охранять весь архипелаг. Их отдельные хартии не позволят столице поглотить голоса остальных республик."
 A10_coastal_arsenals:0 "Береговые арсеналы"
 A10_coastal_arsenals_desc:0 "Защита островов начинается с сухого склада, исправного затвора и собственного оружейника. Береговые мастерские получат станки и запас винтовок для будущих гарнизонов."
 A10_confederation:0 "Договор свободных республик"
 A10_confederation_desc:0 "Висайи и Самар сохранят свои собрания и казну. Взамен они признают общий конгресс, обязуются оборонять соседей и направлять делегатов в Кавите."
 A10_equal_citizenship:0 "Единое гражданство"
 A10_equal_citizenship_desc:0 "Гражданин одной провинции получит те же права в другой. Общий паспорт и равный доступ к государственной службе завершат спор о людях первого и второго разряда."
 A10_federal_reconstruction:0 "Восстановить островные гавани"
 A10_federal_reconstruction_desc:0 "Мир не соединит острова, если пароходы не могут войти в гавань. Общие средства пойдут на причалы, карантинные станции и ремонтные мастерские."
 A10_federation:0 "Провозгласить федерацию"
 A10_federation_desc:0 "Делегаты принимают федеральную конституцию. Присоединение республик остаётся предметом отдельных ратификаций; чужое молчание не будет считаться согласием."
 A10_gendarmerie:0 "Федеральная служба порядка"
 A10_gendarmerie_desc:0 "Служба порядка получит общий устав и запрет коллективных наказаний. Ей предстоит защищать дороги и суды, а не подменять собой местные советы."
 A10_island_congress:0 "Конгресс в Кавите"
 A10_island_congress_desc:0 "Манила потеряна, но делегаты островов продолжают прибывать в Кавите. Временный конгресс должен решить, кому подчиняются казна, порты и республиканские отряды."
 A10_landing_plans:0 "Планы островных высадок"
 A10_landing_plans_desc:0 "Высадка начинается с пресной воды, приливной таблицы и лодки для разгрузки, а не с приказа наступать. Армия и флот отработают ограниченные операции, оставив решение о войне гражданской или военной власти."
 A10_local_administration:0 "Выборные провинциальные советы"
 A10_local_administration_desc:0 "Федеральные чиновники будут работать вместе с избранными советами. Право распоряжаться школами и дорогами останется близко к тем, кто ими пользуется."
 A10_luzon_charter:0 "Хартия Северного Лусона"
 A10_luzon_charter_desc:0 "Освобождение не даёт Кавите права назначать северу хозяев. Местное собрание получит республиканскую хартию и место среди равных союзников."
 A10_mindanao_compact:0 "Две республики Минданао"
 A10_mindanao_compact_desc:0 "Север и юг Минданао не согласны уступать власть далёкой столице. Гарантии местного права и вера в общую оборону могут привести их за один стол."
 A10_strike_japan:0 "Вернуть северные гавани"
 A10_strike_japan_desc:0 "Пока императорские корабли связаны на юге, появляется возможность вернуть гавани Лусона. Штаб готовит переправы, а правительство принимает ответственность за войну."
 A10_united_command:0 "Общий штаб республик"
 A10_united_command_desc:0 "Командиры сохранят свои знамёна, но морские переправы, склады и распоряжения штаба станут общими. Спор о старшинстве не должен решать исход боя."
 A10_visayan_compact:0 "Хартии Себу и Паная"
 A10_visayan_compact_desc:0 "Себуанские купцы требуют открытого судоходства, Панай — защиты земледельцев. Отдельные хартии объединят эти требования в обязательства республик."
 JSM_council:0 "Совет императорской политики"
 JSM_council_desc:0 "Промышленная основа готова. Совет определит последовательность предложений о протекторате."
 JSM_north:0 "Северный договор"
 JSM_north_desc:0 "Открывает переговоры о подчинении северного соседа. Решение стоит 100 политической власти и занимает 30 дней."
 JSM_ocean:0 "Порядок южных морей"
 JSM_ocean_desc:0 "Открывает переговоры с Нидерландской Индией. Отказ даст цель войны на подчинение."
 JSM_shipyards:0 "Верфи Нагасаки"
 JSM_shipyards_desc:0 "Две новые верфи обеспечат морскую опору будущих договоров. 105 дней."
 JSM_south:0 "Посольство на Филиппины"
 JSM_south_desc:0 "Открывает предложение японского протектората Филиппинам."
 JSM_steel:0 "Сталь для новой Японии"
 JSM_steel_desc:0 "Казённые инвестиции в металлургию дадут три гражданские фабрики в столичной области. 140 дней."
 JSM_workshops:0 "Императорские мастерские"
 JSM_workshops_desc:0 "Стандартизация станков и оружейных заказов: три военных завода в Осаке. 140 дней."
