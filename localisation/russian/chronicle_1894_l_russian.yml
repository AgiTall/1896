 ch94.12.t:0 "Смерть Калакауа"
 ch94.12.d:0 "30 апреля 1894 года умер Калакауа. Выбранные ранее учреждения определяют преемственность: конституционная корона сохраняется при совете, морское правительство передаёт власть капитанам. Без принятого курса возможно провозглашение республики."
 ch94.12.a:0 "Подтвердить гражданскую преемственность"
 ch94.12.news_a:0 "После смерти Калакауа на Гавайях подтверждён гражданский порядок. Конституционная корона сохраняется, если её хартия принята; иначе действует республиканский совет."
 ch94.12.b:0 "Передать преемственность морскому совету"
 ch94.12.news_b:0 "После смерти Калакауа власть на Гавайях принимает морской совет. Положение легионеров не меняет суверенитет архипелага."
 ch94.12.inactive:0 "30.04.1894. Смерть короля Калакауа. Изменение военной обстановки сделало эту операцию неактуальной. Боевые действия по этому плану не проводились."
 ch94.12.absent:0 "30.04.1894. Участник события больше не существует как отдельная держава."
 ch94.13.t:0 "Осада Манилы"
 ch94.13.d:0 "10.05.1894. Агинальдо бросает все силы на город. Конфедерация берет город в кольцо, ожидая голода."
 ch94.13.a:0 "Штурм"
 ch94.13.news_a:0 "10.05.1894. Осада Манилы. Решение: «Штурм». Агинальдо бросает все силы на город."
