 ch94.20.t:0 "Эксперимент Теслы"
 ch94.20.d:0 "20.07.1894. Проверить ранний глушитель отдельного объекта. Участие Британии требует приборной службы и доступа к Тесле; без них опыт откладывается."
 ch94.20.a:0 "Успех"
 ch94.20.news_a:0 "Проверен ранний глушитель отдельного объекта. Это не дальний прототип и не разрешение заселять материки."
 ch94.20.b:0 "Отложить или остановить опыт"
 ch94.20.news_b:0 "Ранний опыт приостановлен; дальнейшая работа потребует подготовки и доступа к лаборатории."
 ch94.20.inactive:0 "Британская приборная служба или доступ к Тесле ещё не подготовлены. Опыт отложен до восстановления необходимых условий."
