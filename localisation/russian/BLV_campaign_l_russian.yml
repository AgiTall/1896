l_russian:
 BLV_leviathan:0 "Империя после Исхода"
 BLV_leviathan_desc:0 "Лондон потерян, но флот, корона и колониальные станции уцелели. Правительство на Бермудах должно решить, какую Британию оно сохраняет."
 BLV_audit:0 "Гроссбух уцелевшей империи"
 BLV_audit_desc:0 "Свести расходы флота, запасы станций и обязательства перед Палатой. Запасы и связность империи станут основой дальнейших решений."
 BLV_hamilton:0 "Совещание в Гамильтоне"
 BLV_hamilton_desc:0 "Адмиралы, двор и делегаты колоний спорят о полномочиях. Начинается шестимесячный конституционный спор; поддержку групп можно менять решениями."
 BLV_commission:0 "Королевская комиссия о снабжении"
 BLV_commission_desc:0 "Двор получит проверенные отчёты о станциях. Комиссия усиливает корону, но её материалы доступны любому будущему кабинету."
 BLV_admiralty:0 "Мандат адмирала Фишера"
 BLV_admiralty_desc:0 "Фишер получает власть над морским бюджетом. Корона остаётся символом, а решения принимают профессиональные морские ведомства."
 BLV_constitution:0 "Ответственный кабинет империи"
 BLV_constitution_desc:0 "Представители станций и колоний получат контроль бюджета. Компромисс укрепляет империю, но требует расходов на местные гарантии."
 BLV_crown:0 "Чрезвычайные полномочия короны"
 BLV_crown_desc:0 "Корона подчинит себе соперничающие ведомства. Приказы станут исполняться быстрее, но удержание колоний потребует постоянных затрат."
 BLV_naval_cabinet:0 "Кабинет морских специалистов"
 BLV_naval_cabinet_desc:0 "Подчинить закупки единому профессиональному ведомству."
 BLV_merit:0 "Назначения по службе"
 BLV_merit_desc:0 "Открыть подготовку офицеров способным выходцам из станций."
 BLV_strategic_reserve:0 "Стратегический резерв Адмиралтейства"
 BLV_strategic_reserve_desc:0 "Выделить запасы для дальних операций вместо расширения придворных расходов."
 BLV_naval_state:0 "Государство морской службы"
 BLV_naval_state_desc:0 "Закрепить власть профессионального кабинета и постоянный порядок снабжения."
 BLV_imperial_budget:0 "Бюджет под парламентским контролем"
 BLV_imperial_budget_desc:0 "Публичные сметы уменьшат влияние посредников и двора."
 BLV_rights:0 "Хартии островных граждан"
 BLV_rights_desc:0 "Гарантировать местным жителям доступ к суду и оплачиваемой службе."
 BLV_delegates:0 "Постоянная конференция колоний"
 BLV_delegates_desc:0 "Связать ответственность кабинета с голосами колониальных делегатов."
 BLV_maritime_commonwealth:0 "Содружество свободных морей"
 BLV_maritime_commonwealth_desc:0 "Сделать добровольные соглашения основой империи. Австралийская федерация получит поддержку, но не будет создана без местных голосований."
 BLV_royal_secretariat:0 "Единый королевский секретариат"
 BLV_royal_secretariat_desc:0 "Поставить переписку станций под единый надзор короны."
 BLV_crown_guard:0 "Морская гвардия короны"
 BLV_crown_guard_desc:0 "Сформировать одну подготовленную морскую пехотную часть на Бермудах."
 BLV_loyal_governors:0 "Присяга губернаторов"
 BLV_loyal_governors_desc:0 "Лояльность местных кабинетов придётся подкреплять снабжением."
 BLV_imperial_prerogative:0 "Сохранить имперскую прерогативу"
 BLV_imperial_prerogative_desc:0 "Закрепить право короны сопротивляться отделению. Дипломатические решения остаются за игроком; чужие правительства не присоединяются автоматически."
 BLV_rationing:0 "Снабжать флот каждый месяц"
 BLV_rationing_desc:0 "Составить постоянные сметы вместо чрезвычайных сборов. Это уменьшит ежемесячный расход запасов."
 BLV_bermuda_workshops:0 "Мастерские Гамильтона"
 BLV_bermuda_workshops_desc:0 "Разместить безопасное производство рядом с правительством."
 BLV_coal_depots:0 "Угольные склады дальних станций"
 BLV_coal_depots_desc:0 "Создать распределённый запас топлива. Склады пополняют имперский резерв каждый месяц."
 BLV_machine_tools:0 "Станки для островной промышленности"
 BLV_machine_tools_desc:0 "Поддержать инженерную школу и обслуживание оборудования."
 BLV_ordnance:0 "Островные оружейные заказы"
 BLV_ordnance_desc:0 "Обеспечить гарнизоны местными винтовками."
 BLV_nz_industry:0 "Новозеландские мастерские"
 BLV_nz_industry_desc:0 "Перенести часть гражданских заказов на безопасные острова Новой Зеландии."
 BLV_cable_school:0 "Школа кабельных инженеров"
 BLV_cable_school_desc:0 "Снизить зависимость от иностранных специалистов связи."
 BLV_island_economy:0 "Промышленность океанской державы"
 BLV_island_economy_desc:0 "Объединить островные предприятия общими стандартами и заказами."
 BLV_credit_audit:0 "Цена полиса Ламберта"
 BLV_credit_audit_desc:0 "Британия начинает с тяжёлым долгом ВТП. Проверить обязательства без обнуления существующей задолженности."
 BLV_chamber_desk:0 "Представительство Палаты при казне"
 BLV_chamber_desk_desc:0 "Открыть обычные соглашения ВТП; Палата сохраняет право отказать."
 BLV_independent_accounts:0 "Собственный морской расчёт"
 BLV_independent_accounts_desc:0 "Оплатить сокращение долга и подготовить собственные расчёты. Этот путь не создаёт флот из ничего и не отменяет существующих долгов."
 BLV_lambert_compact:0 "Договор флота и Палаты"
 BLV_lambert_compact_desc:0 "Поддержать морскую охрану Палаты в обмен на договорное обслуживание. Кредитные соглашения заключаются через существующие переговоры."
 BLV_insurance:0 "Адмиралтейское страховое бюро"
 BLV_insurance_desc:0 "Собственная страховка уменьшает уязвимость транспорта. Учреждение бюро потребует средств и не простит старые долги."
 BLV_revoke_cover:0 "Отозвать морское прикрытие Палаты"
 BLV_revoke_cover_desc:0 "Отозвать британское прикрытие взысканий ВТП. Это изменит действующую мировую систему санкций и ухудшит наши отношения с кредитором."
 BLV_service_contracts:0 "Договоры обслуживания станций"
 BLV_service_contracts_desc:0 "Использовать договорные поставки, не передавая Палате суверенитет."
 BLV_debt_settlement:0 "Свести имперские обязательства"
 BLV_debt_settlement_desc:0 "Погасить часть задолженности за счёт бюджетных средств. Регулярные платежи остаются доступны отдельными решениями."
 BLV_fleet_register:0 "Перепись уцелевших эскадр"
 BLV_fleet_register_desc:0 "Свести Атлантическую и Восточную эскадры в общий реестр. Стартовые корабли выдаются один раз и не дублируются этим фокусом."
 BLV_bermuda_dock:0 "Доковый комплекс Бермуд"
 BLV_bermuda_dock_desc:0 "Расширить ремонтную базу Атлантической эскадры."
 BLV_engine_rooms:0 "Реформа машинных команд"
 BLV_engine_rooms_desc:0 "Сократить простои и обучить механиков парового флота."
 BLV_battle_line:0 "Сосредоточенная линия броненосцев"
 BLV_battle_line_desc:0 "Ставка на решающее сражение усиливает тяжёлые корабли, но связывает часть снабжения."
 BLV_cruiser_routes:0 "Крейсеры на торговых путях"
 BLV_cruiser_routes_desc:0 "Распределённые крейсерские силы защищают снабжение вместо концентрации всего флота."
 BLV_naval_staff:0 "Единый морской оперативный штаб"
 BLV_naval_staff_desc:0 "Штаб согласует действия эскадр обеих доктрин."
 BLV_convoy_service:0 "Океанская служба конвоев"
 BLV_convoy_service_desc:0 "Выделить транспорты и обучить службы сопровождения."
 BLV_singapore_docks:0 "Сингапурский ремонтный узел"
 BLV_singapore_docks_desc:0 "Развивать базу только при действительном британском контроле Сингапура."
 BLV_fleet_logistics:0 "Флот, который может оставаться в море"
 BLV_fleet_logistics_desc:0 "Согласовать ремонт, уголь и пополнение запасов."
 BLV_garrison_audit:0 "Гарнизоны без смены"
 BLV_garrison_audit_desc:0 "Проверить службу в Гибралтаре, Сингапуре и Гонконге. Песнь делает постоянную ротацию необходимостью."
 BLV_rotation:0 "Регулярная смена гарнизонов"
 BLV_rotation_desc:0 "Оплатить безопасное возвращение заболевших и подготовку смен."
 BLV_marines:0 "Морская пехота дальних станций"
 BLV_marines_desc:0 "Создать одну морскую пехотную группу и общую программу подготовки."
 BLV_field_hospitals:0 "Госпитали эвакуационного флота"
 BLV_field_hospitals_desc:0 "Связать передовые перевязочные пункты с безопасными островными госпиталями."
 BLV_colonial_service:0 "Оплачиваемая колониальная служба"
 BLV_colonial_service_desc:0 "Готовить местных специалистов снабжения и офицеров."
 BLV_amphibious_staff:0 "Штаб экспедиционных операций"
 BLV_amphibious_staff_desc:0 "Научить штабы снабжать небольшой десант, а не обещать мгновенное покорение континента."
 BLV_station_census:0 "Голоса дальних станций"
 BLV_station_census_desc:0 "Выслушать кабинеты и гарнизоны, от которых зависит морская сеть."
 BLV_australian_dossier:0 "Австралийское досье"
 BLV_australian_dossier_desc:0 "Шесть правительств требуют разных гарантий. Британия должна отвечать на их проекты, а не создавать федерацию за них."
 BLV_dominion_charters:0 "Разрешить договорную федерацию"
 BLV_dominion_charters_desc:0 "Открыто поддержать австралийскую хартию. Местные референдумы и решения Сиднея сохраняются."
 BLV_nz_ports:0 "Новозеландские порты империи"
 BLV_nz_ports_desc:0 "Поддержать самостоятельное снабжение британских владений в Новой Зеландии."
 BLV_pacific_stations:0 "Станции Фиджи и Новой Гвинеи"
 BLV_pacific_stations_desc:0 "Согласовать ротацию и снабжение дальних гарнизонов."
 BLV_colonial_red_line:0 "Предел колониальных уступок"
 BLV_colonial_red_line_desc:0 "Отказаться от автоматической поддержки новых хартий. Британский игрок по-прежнему сможет принять конкретное предложение Австралии."
 BLV_australia_sovereignty:0 "Признать самостоятельное Содружество"
 BLV_australia_sovereignty_desc:0 "Признать существующую австралийскую федерацию, если она ещё является нашим подданным. Соседние колонии не освобождаются и не присоединяются без согласия."
 BLV_reconquest:0 "Планы возвращения мятежного доминиона"
 BLV_reconquest_desc:0 "Подготовить повод к войне против независимой Австралии после избрания жёсткого курса. Войну объявляет игрок."
 BLV_malacca:0 "Порядок судоходства в Малакке"
 BLV_malacca_desc:0 "Оформить решение о судоходстве, принятое на совещании 28 ноября 1893 года. Капитаны должны получить единый порядок прохода через пролив."
 BLV_batavia_oil:0 "Нефтяной договор с Батавией"
 BLV_batavia_oil_desc:0 "Предложить Людольфу договор поставок. Голландское правительство может отказаться; поставки зависят от сохранения нефтяного региона."
 BLV_philippine_mission:0 "Миссия на Филиппины"
 BLV_philippine_mission_desc:0 "Предложить взаимный военный доступ филиппинскому правительству. Это не вступление в его войны."
 BLV_pacific_deterrent:0 "Тихоокеанское сдерживание"
 BLV_pacific_deterrent_desc:0 "Согласовать действия Восточной эскадры и береговых постов."
 BLV_japanese_note:0 "Нота японскому Адмиралтейству"
 BLV_japanese_note_desc:0 "Потребовать гарантий свободного судоходства. Токио может согласиться или отвергнуть требование."
 BLV_war_plans:0 "Планы войны на восточных морях"
 BLV_war_plans_desc:0 "Подготовить кампанию за Манилу, если Япония всё ещё владеет ею и отвергла нашу ноту. Это повод к войне, а не автоматическое объявление."
 BLV_eastern_supply:0 "Снабжение Восточной эскадры"
 BLV_eastern_supply_desc:0 "Подготовить уголь, ремонт и пополнение к длительному походу."
 BLV_song_records:0 "Закрытые журналы Песни"
 BLV_song_records_desc:0 "Сопоставить отчёты гарнизонов, сохраняя разведывательные сведения в британском архиве."
 BLV_instruments:0 "Приборы островных лабораторий"
 BLV_instruments_desc:0 "Оснастить измерительную службу на Бермудах. Это не переносит Теслу с Мальты и не создаёт второго учёного."
 BLV_malta_license:0 "Договор с лабораторией Святого Ангела"
 BLV_malta_license_desc:0 "Запросить научную переписку у действительного хранителя лаборатории Теслы. Её хозяин может отказать."
 BLV_ungudja:0 "Папка Унгуджи"
 BLV_ungudja_desc:0 "Разведка представит закрытый доклад. Другим странам останется известно лишь карантинное объяснение."
 BLV_clinical_rules:0 "Правила работы с невосприимчивыми"
 BLV_clinical_rules_desc:0 "Учредить контроль над обращением с Альфа. Политика сыворотки будет выбрана отдельно."
 BLV_serum_contract:0 "Лицензированный Фонд Дюбуа"
 BLV_serum_contract_desc:0 "Утвердить лицензированный контракт или пересмотреть прежний отказ. Казна сверит условия поставок, а врачебный надзор установит порядок применения сыворотки."
 BLV_ethical_research:0 "Независимая врачебная комиссия"
 BLV_ethical_research_desc:0 "Пересмотреть июньские решения о Фонде Дюбуа и запретить принудительный сбор крови. В дальнейшем поставки Палаты не смогут отменить этот запрет."
 BLV_calibration:0 "Калибровка глушителей"
 BLV_calibration_desc:0 "Завершить ранний опыт, назначенный на 20 июля 1894 года. При отсутствии доступа к Тесле работа откладывается. Это глушитель отдельного объекта, а не дальний прототип 1900 года."
 BLV_research_school:0 "Адмиралтейская школа измерений"
 BLV_research_school_desc:0 "Наладить непрерывную подготовку специалистов, пока Тесла и артефакт сохраняют собственную судьбу."
 BLV_greenland_watch:0 "Датская администрация Гренландии"
 BLV_greenland_watch_desc:0 "Сохранить формальную датскую администрацию и британское снабжение. Гренландия уже находится под британским контролем на карте мода."
 BLV_arctic_depots:0 "Полярные склады и зимовки"
 BLV_arctic_depots_desc:0 "Подготовить зимнюю одежду, уголь и сменные команды."
 BLV_russian_note:0 "Гренландская нота Рейкьявику"
 BLV_russian_note_desc:0 "Предложить обмен наблюдениями России. Согласие даст научное сотрудничество, а не право на русские земли."
 BLV_scientific_cargo:0 "Охрана научного груза"
 BLV_scientific_cargo_desc:0 "Подготовить охрану и хранение, прежде чем трогать неизвестное устройство."
 BLV_polar_mandate:0 "Мандат полярной экспедиции"
 BLV_polar_mandate_desc:0 "Исполнить мандат совещания 5 августа 1896 года: подготовить закрытую экспедицию или согласовать участие иностранных наблюдателей. Раскопки начнутся отдельно с 1898 года."
 BLV_archive:0 "Архив резонансных частот"
 BLV_archive_desc:0 "Сохранить полученные данные независимо от дальнейшей судьбы предмета. Получение артефакта и его расшифровка выполняются отдельными проектами."
 BLV_remember_home:0 "Родина за горизонтом"
 BLV_remember_home_desc:0 "Собрать карты и реестры изгнанников, не объявляя мёртвые земли безопасными."
 BLV_coastal_trials:0 "Испытания у мёртвого берега"
 BLV_coastal_trials_desc:0 "Снарядить измерительные рейсы. Континент не становится пригодным для жизни от одного фокуса."
 BLV_long_range:0 "Глушитель дальнего действия"
 BLV_long_range_desc:0 "К 1900 году артефакт и доступ к Тесле позволяют поставить долгий опыт. Нужны научная база и сохранившиеся спектральные данные."
 BLV_pioneer_station:0 "Первая станция возвращения"
 BLV_pioneer_station_desc:0 "После успешного прототипа подготовить небольшой береговой узел. Проект требует времени, приборов и ротации; вся Британия не передаётся нам автоматически."
 BLV_admiralty_spirit:0 "Кабинет Фишера"
 BLV_admiralty_spirit_desc:0 "Морское ведомство руководит государственными расходами."
 BLV_constitution_spirit:0 "Ответственный имперский кабинет"
 BLV_constitution_spirit_desc:0 "Ответственность бюджета укрепляет согласие станций."
 BLV_crown_spirit:0 "Королевский чрезвычайный совет"
 BLV_crown_spirit_desc:0 "Корона принимает на себя прямую ответственность за империю."
 BLV_procurement_spirit:0 "Адмиралтейские закупки"
 BLV_procurement_spirit_desc:0 "Единые заказы сокращают производственные задержки."
 BLV_naval_state_spirit:0 "Государство морской службы"
 BLV_naval_state_spirit_desc:0 "Постоянная служба поддерживает боеспособность."
 BLV_island_rights_spirit:0 "Хартии островных граждан"
 BLV_island_rights_spirit_desc:0 "Местные жители получают гарантии суда и службы."
 BLV_maritime_commonwealth_spirit:0 "Содружество свободных морей"
 BLV_maritime_commonwealth_spirit_desc:0 "Добровольные соглашения укрепляют морскую сеть."
 BLV_royal_secretariat_spirit:0 "Королевский секретариат"
 BLV_royal_secretariat_spirit_desc:0 "Единая переписка сокращает ведомственные задержки."
 BLV_imperial_prerogative_spirit:0 "Имперская прерогатива"
 BLV_imperial_prerogative_spirit_desc:0 "Удержание станций требует расходов на гарнизоны."
 BLV_island_industry_spirit:0 "Островная промышленная сеть"
 BLV_island_industry_spirit_desc:0 "Общие стандарты ускоряют расширение предприятий."
 BLV_insurance_spirit:0 "Адмиралтейское страховое бюро"
 BLV_insurance_spirit_desc:0 "Собственная страховка уменьшает зависимость перевозок."
 BLV_engine_rooms_spirit:0 "Обученные машинные команды"
 BLV_engine_rooms_spirit_desc:0 "Подготовленные механики поддерживают организацию флота."
 BLV_battle_line_spirit:0 "Линия броненосцев"
 BLV_battle_line_spirit_desc:0 "Сосредоточение усиливает боевые корабли."
 BLV_cruiser_routes_spirit:0 "Крейсерское прикрытие путей"
 BLV_cruiser_routes_spirit_desc:0 "Распределённые силы улучшают охранение."
 BLV_naval_staff_spirit:0 "Морской оперативный штаб"
 BLV_naval_staff_spirit_desc:0 "Штаб координирует дальние эскадры."
 BLV_escorts_spirit:0 "Океанская служба конвоев"
 BLV_escorts_spirit_desc:0 "Сопровождение поддерживает регулярность поставок."
 BLV_fleet_logistics_spirit:0 "Согласованное снабжение флота"
 BLV_fleet_logistics_spirit_desc:0 "Службы запасов уменьшают расход снабжения."
 BLV_rotation_spirit:0 "Смена гарнизонов"
 BLV_rotation_spirit_desc:0 "Ротация уменьшает истощение передовых частей."
 BLV_field_hospitals_spirit:0 "Эвакуационные госпитали"
 BLV_field_hospitals_spirit_desc:0 "Дальняя медицинская служба возвращает людей в строй."
 BLV_expedition_staff_spirit:0 "Штаб экспедиционных операций"
 BLV_expedition_staff_spirit_desc:0 "Специалисты готовят снабжение малых десантов."
 BLV_pacific_deterrent_spirit:0 "Восточная система сдерживания"
 BLV_pacific_deterrent_spirit_desc:0 "Станции и эскадры действуют по общему плану."
 BLV_medical_commission_spirit:0 "Независимая врачебная комиссия"
 BLV_medical_commission_spirit_desc:0 "Медицинские гарантии укрепляют доверие к исследованиям."
 BLV_measurement_school_spirit:0 "Адмиралтейская школа измерений"
 BLV_measurement_school_spirit_desc:0 "Постоянная подготовка инженеров поддерживает исследования."
 BLV_supply_crisis_spirit:0 "Станции без запасов"
 BLV_supply_crisis_spirit_desc:0 "Истощённые запасы нарушают работу эскадр."
 BLV_imperial_strain_spirit:0 "Империя теряет связность"
 BLV_imperial_strain_spirit_desc:0 "Невыполненные обязательства ослабляют общий кабинет."
 BLV_oil_contract_spirit:0 "Договорные поставки Батавии"
 BLV_oil_contract_spirit_desc:0 "Поставки действуют лишь пока партнёр удерживает нефтяной регион и не воюет с нами."
 BLV_serum_spirit:0 "Временная сыворотка Дюбуа"
 BLV_serum_spirit_desc:0 "Короткий курс помогает полевой группе, но не делает материк безопасным."
 BLV_prototype_spirit:0 "Испытанный дальний глушитель"
 BLV_prototype_spirit_desc:0 "Прототип защищает отдельный узел. Развёртывание требует оборудования и постоянного обслуживания."
 BLV_coastal_station_spirit:0 "Опытная береговая станция"
 BLV_coastal_station_spirit_desc:0 "Небольшой узел сохраняется за счёт непрерывного снабжения и смены людей."
 blv_campaign.1.t:0 "Кому отвечает Адмиралтейство"
 blv_campaign.1.d:0 "Фишер требует единого морского бюджета, двор — верховного контроля, делегаты — ответственного кабинета. Первый выбор усиливает одну из групп. Окончательное решение принимается политическим фокусом."
 blv_campaign.1.a:0 "Фишер знает нужды флота"
 blv_campaign.1.b:0 "Корона должна связать ведомства"
 blv_campaign.1.c:0 "Бюджет требует представительства"
 blv_campaign.2.t:0 "Совещание требует решения"
 blv_campaign.2.d:0 "Спор затянулся. Ни одна сторона не должна превращать нехватку поддержки в мгновенный переворот: можно продлить переговоры, заплатив потерей доверия."
 blv_campaign.2.a:0 "Продолжить переговоры"
 blv_campaign.4.t:0 "Станции требуют снабжения"
 blv_campaign.4.d:0 "На складах почти не осталось резервов. Срочная закупка за политическое влияние поддержит эскадры; урезание обязательств сбережёт бюджет, но ударит по доверию станций."
 blv_campaign.4.a:0 "Оплатить срочную закупку"
 blv_campaign.4.b:0 "Сократить дальние обязательства"
 blv_campaign.5.t:0 "Нефтяной договор с Левиафаном"
 blv_campaign.5.d:0 "Британия предлагает оплачиваемые поставки топлива. Договор действует, пока мы удерживаем Баликпапан и не воюем с британцами."
 blv_campaign.5.a:0 "Принять ограниченное соглашение"
 blv_campaign.5.b:0 "Отклонить предложение"
 blv_campaign.6.t:0 "Британская миссия на Филиппинах"
 blv_campaign.6.d:0 "Левиафан предлагает взаимный доступ к военным базам. Мы не становимся его подданными и не вступаем автоматически в новые войны."
 blv_campaign.6.a:0 "Принять ограниченное соглашение"
 blv_campaign.6.b:0 "Отклонить предложение"
 blv_campaign.7.t:0 "Британская нота о судоходстве"
 blv_campaign.7.d:0 "Британия требует гарантий для торговых судов. Принятие снизит напряжение; отказ даст британцам основание готовить конфликт. Территории этим соглашением не передаются."
 blv_campaign.7.a:0 "Принять ограниченное соглашение"
 blv_campaign.7.b:0 "Отклонить предложение"
 blv_campaign.8.t:0 "Обмен полярными наблюдениями"
 blv_campaign.8.d:0 "Британские наблюдатели предлагают обмен данными. Артефакт и территории не передаются."
 blv_campaign.8.a:0 "Принять ограниченное соглашение"
 blv_campaign.8.b:0 "Отклонить предложение"
 blv_campaign.9.t:0 "Лицензия для британских инженеров"
 blv_campaign.9.d:0 "Адмиралтейство просит научную переписку с лабораторией Теслы. Передаются записи и право сотрудничества, а не сам учёный."
 blv_campaign.9.a:0 "Открыть научную переписку"
 blv_campaign.9.b:0 "Сохранить закрытый порядок"
 blv_campaign.10.t:0 "Унгуджа — только для Адмиралтейства"
 blv_campaign.10.d:0 "Закрытый доклад: около семи процентов наблюдавшихся жителей сохраняют необычную устойчивость к Песни. Известие нельзя включать в открытые бюллетени. Мир продолжает видеть британский карантин, а не разведывательные выводы."
 blv_campaign.10.a:0 "Хранить доклад под грифом"
 BLV_excavation:0 "Вскрыть гренландское хранилище"
 BLV_excavation_desc:0 "Работать 60 дней подо льдом, сохраняя контроль Гренландии. Артефакт может быть найден только один раз."
 BLV_decode:0 "Расшифровать полярные записи"
 BLV_decode_desc:0 "Потратить 90 дней на расшифровку при сохранении доступа к артефакту и Тесле."
 BLV_prototype:0 "Испытать дальний глушитель"
 BLV_prototype_desc:0 "Девяностодневное испытание потребует 100 комплектов вспомогательного оборудования и доступа к обоим источникам знаний."
 BLV_station:0 "Снарядить береговую станцию"
 BLV_station_desc:0 "За 90 дней подготовить небольшой береговой узел с постоянным питанием. Это не массовое заселение и не автоматическая аннексия Британских островов."
 blv_campaign.11.t:0 "Предмет из гренландского льда"
 blv_campaign.11.d:0 "Артефакт найден, но он не выключает Песнь. Его необходимо охранять и расшифровать. Можно открыть спектральные данные миру или сохранить закрытый архив. Сам предмет остаётся единственным."
 blv_campaign.11.a:0 "Сохранить закрытый архив"
 blv_campaign.11.b:0 "Поделиться проверенными данными"
 BLV_support_admiralty:0 "Поддержка капитанов"
 BLV_support_admiralty_desc:0 "Поднять влияние группы на один пункт. Для выбора её политического пути требуется четыре пункта."
 BLV_support_crown:0 "Поддержка двора"
 BLV_support_crown_desc:0 "Поднять влияние группы на один пункт. Для выбора её политического пути требуется четыре пункта."
 BLV_support_delegates:0 "Поддержка делегатов"
 BLV_support_delegates_desc:0 "Поднять влияние группы на один пункт. Для выбора её политического пути требуется четыре пункта."
 BLV_supply_purchase:0 "Закупить запасы для станций"
 BLV_supply_purchase_desc:0 "Расходовать политическое влияние на пополнение общего резерва."
 BLV_station_grants:0 "Выплатить жалованье дальним гарнизонам"
 BLV_station_grants_desc:0 "Передать 10 пунктов запаса станциям и укрепить связность на 10 пунктов."
 BLV_license_again:0 "Возобновить переговоры с лабораторией"
 BLV_license_again_desc:0 "Повторить запрос действительному хранителю Теслы."
 BLV_oil_again:0 "Возобновить переговоры с Батавией"
 BLV_oil_again_desc:0 "Повторить ограниченное дипломатическое предложение; адресат может отказать."
 BLV_navigation_again:0 "Повторить ноту Токио"
 BLV_navigation_again_desc:0 "Повторить ограниченное дипломатическое предложение; адресат может отказать."
 BLV_serum_purchase:0 "Приобрести короткий курс сыворотки"
 BLV_serum_purchase_desc:0 "Израсходовать 8 пунктов запаса на семь дней поддержки полевой группы."
 BLV_field_rotation:0 "Сменить полевые команды"
 BLV_field_rotation_desc:0 "Снизить накопленное воздействие Песни на 25 пунктов, потратив 5 пунктов резерва."
 BLV_research:0 "Исследования Адмиралтейства"
 BLV_imperial_government:0 "Правительство Левиафана"
 BLV_imperial_government_desc:0 "Запасы станций: [?BLV_reserve|0]/100\nСвязность империи: [?BLV_cohesion|0]/100\n\nВлияние — Адмиралтейство: [?BLV_admiralty|0], корона: [?BLV_crown|0], делегаты: [?BLV_delegates|0]. Для выбора пути нужно 4 пункта.\n\nНаука: [?SEN_science|0], готовность экспедиций: [?SEN_readiness|0], охрана: [?SEN_security|0], воздействие Песни: [?SEN_exposure|0]."
 BLV_council_tt:0 "Откроется спор о власти на 180 дней. Влияние групп видно в решениях."
 BLV_arctic_tt:0 "Мандат и событие 5 августа 1896 года имеют общий исход. Раскопки доступны с 1898 года при контроле Гренландии."
 BLV_prototype_tt:0 "Откроется отдельный проект на 90 дней. Доступ к артефакту и Тесле проверяется повторно."
 BLV_station_tt:0 "Откроется опытный проект береговой станции с 1901 года. Британские острова автоматически не передаются."
 BLV_tesla_patents:0 "Патенты раннего глушителя"
 BLV_tesla_patents_desc:0 "Рассмотреть порядок хранения или лицензирования ранних чертежей после 25 октября 1894 года. Палата сама решает, покупать ли лицензию."
 BLV_ship_suppressors:0 "Глушители для кораблей и баз"
 BLV_ship_suppressors_desc:0 "После опыта 20 мая 1895 года выбрать корабельную установку малого радиуса или стационарную башню. Это не дальний глушитель."
 BLV_airship_service:0 "Адмиралтейская служба дирижаблей"
 BLV_airship_service_desc:0 "Исполнить решения совещания 20 мая 1896 года: подготовить экипажи и имущество для разведывательной или ударной программы дирижаблей."
 BLV_crowns_council:0 "Совет корон в изгнании"
 BLV_crowns_council_desc:0 "С 10 декабря 1896 года определить правовое положение Совета корон. Это политическое объединение, которое не заменяет кабинет и не объявляет войну России."
