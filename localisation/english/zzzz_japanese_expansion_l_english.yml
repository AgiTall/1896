l_english:
 A01_inevitable_conflict_category:0 "Japanese Expansion"
 A01_japanese_invasion_countdown:0 "Japanese Expansion: Preparations"
 A01_begin_island_defence:0 "Begin the Defence of the Island"
 A01_japanese_expansion:0 "Japanese Expansion"
 A03_japanese_expansion:0 "Japanese Expansion"
 A03_japanese_invasion_countdown:0 "Japanese Expansion: Preparations"
 A01_lease_brunei:0 "Lease Brunei for Six Months"
 A01_lease_brunei_desc:0 "Transfer Brunei (1023) to Japanese administration for §Y180 days§!, extending both preparation timers by §G180 days§!. The state then returns to the Netherlands. An early war postpones its return until peace; a Japanese victory makes the transfer permanent under the Convention."
 A01_rubber_concession:0 "Offer a Temporary Rubber Concession"
 A01_rubber_concession_desc:0 "Grant Japan rubber rights in eastern Kalimantan (1055) for §Y180 days§!, extending both preparation timers by §G60 days§!. Permanent rights granted by a later Borneo Convention will be preserved."
 A01_supply_concession:0 "Concede a Shipment of Small Arms"
 A01_supply_concession_desc:0 "Transfer §Y1,000 infantry equipment§! to Japan, extending both preparation timers by §G30 days§!."
 expansion.1.a:0 "The islands remain ours."
 expansion.2.t:0 "The Borneo Expedition Fails"
 expansion.2.a:0 "Acknowledge the expedition's failure."
 expansion.3.a:0 "Begin reconstruction."
 expansion.10.t:0 "The Brunei Lease Expires"
 expansion.10.d:0 "Japan's temporary administration has completed its work. Brunei has returned to Batavia in accordance with the lease."
 expansion.10.a:0 "Restore our administration."
 expansion.11.t:0 "A Six-Month Lease of Brunei"
 expansion.11.d:0 "Batavia has granted Japan administration of Brunei for 180 days. In exchange, both preparation timers have been extended by 180 days. The state must be returned when the lease expires."
 expansion.11.a:0 "Honour the temporary agreement."
 A01_begin_island_defence_desc:0 "Begin preparing the defence of Borneo. Both countries receive a shared §Y180-day§! countdown to war. Japanese preparations shorten it; Dutch concessions extend it. Japan then has §Y180 days§! to establish a foothold in at least one Borneo province."
 A01_inevitable_conflict_category_desc:0 "Japanese preparations proceed independently of our focuses. A hidden opening phase is followed by a shared 288-day countdown. Japanese preparations shorten it; concessions extend it. Agreement cancels the invasion. Rejecting an ultimatum means immediate war."
 A01_japanese_expansion_desc:0 "If Japan controls §Rat least one province on Borneo§! at the deadline, the Borneo Convention takes effect. A §GDutch victory§! requires removing every Japanese foothold from the island. Full occupation of Sabah is unnecessary.\n\n$A01_occupation_balance_tt$"
 A01_japanese_invasion_countdown_desc:0 "Independent hidden preparations are followed by a shared §Y288-day§! countdown. Concessions extend it; Japanese preparations shorten it. Agreement cancels the invasion. Japan then has §Y180 days§! of war to hold at least one Borneo province."
 A03_japanese_expansion_desc:0 "Hold §Yat least one province on Borneo§! at the deadline to win and enforce the Borneo Convention. Without a foothold on the island, Japan loses and ends the war without gains. The result is decided when the shared campaign timer expires."
 A03_japanese_invasion_countdown_desc:0 "Independent opening preparations are followed by a §Y288-day§! countdown. Military preparations shorten it; Dutch concessions extend it. Agreement cancels the invasion."
 expansion.1.d:0 "The Japanese campaign deadline has expired. No Japanese foothold remains on Borneo, forcing Tokyo to end its offensive. Peace preserves our territories and strengthens Ludolf and his standing with the navy."
 expansion.1.t:0 "Borneo Holds — Expansion Stopped"
 expansion.2.d:0 "The campaign deadline has expired without a single Borneo province under our control. Japan recognises the expedition as a failure and ends the war without territorial gains. Public support for the cabinet and the war has weakened."
 expansion.3.d:0 "Japan retains a foothold on Borneo at the campaign deadline. Batavia must accept the Borneo Convention. The war ends, while northern territorial transfers and resource concessions weaken the governor."
 expansion.3.t:0 "A Japanese Foothold on Borneo"
