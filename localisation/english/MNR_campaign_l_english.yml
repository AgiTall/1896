 MNR_PBT_economy2:0 "Peninsula Food Reserve"
 MNR_PBT_economy2_desc:0 "Secure local economic specialisation through a national spirit."
 MNR_PBT_defence0:0 "Bataan Territorial Units"
 MNR_PBT_defence0_desc:0 "Unlock a two-battalion infantry template, 200 rifles and 5 army XP. Recruit divisions normally."
 MNR_PBT_defence1:0 "Manila Approach Watchers"
 MNR_PBT_defence1_desc:0 "Spend 5 reserves on a year of local defence watches."
 MNR_PBT_defence2:0 "Peninsula Arsenal"
 MNR_PBT_defence2_desc:0 "Build an arms workshop in the owned and controlled capital."
 MNR_PBT_contacts:0 "Talks with Our Neighbours"
 MNR_PBT_contacts_desc:0 "Open two bilateral proposals. Partners may decline; local insurance offers an alternative for the final objective."
 MNR_PBT_chamber:0 "Our Own Chamber Desk"
 MNR_PBT_chamber_desc:0 "Open the existing Chamber contract network, preserving previous debt and agreements."
 MNR_PBT_civic:0 "Bataan Municipal Charter"
 MNR_PBT_civic_desc:0 "Accountability improves stability and builds confidence during peace."
 MNR_PBT_civic_law:0 "Public Local Accounts"
 MNR_PBT_civic_law_desc:0 "Strengthen the chosen system: +6 confidence and +30 political power."
 MNR_PBT_civic_settlement:0 "Charter of Stable Government"
 MNR_PBT_civic_settlement_desc:0 "Ratify a local charter: +5% stability and +10 reserves."
 MNR_PBT_command:0 "Peninsula Defence Command"
 MNR_PBT_command_desc:0 "Territorial command improves troop training but costs community confidence."
 MNR_PBT_command_law:0 "Territorial Muster Rolls"
 MNR_PBT_command_law_desc:0 "Audit muster rolls: +8 army XP and +5% war support."
 MNR_PBT_command_settlement:0 "Armed Readiness Mandate"
 MNR_PBT_command_settlement_desc:0 "Gain a war goal against the rival government if independent and outside its faction. Declaring war remains a separate choice."
 MNR_PBT_projects:0 "National Project Plan"
 MNR_PBT_projects_desc:0 "Drill the Peninsula Defence Force. Unlock the paid project decision, with its duration and costs listed there."
 MNR_PBT_specialists:0 "Train Local Specialists"
 MNR_PBT_specialists_desc:0 "Unlock support equipment production and receive 50 sets for surveyors, laboratories and supply services. Manufacture further equipment for repeated projects."
 MNR_PBT_goal:0 "Bataan with Its Own Charter"
 MNR_PBT_goal_desc:0 "Complete three national projects, secure confidence and reserves, choose a political route, and meet the additional conditions shown below. Reward: 100 political power, 5% stability and a research slot."
 MNR_PBT_project:0 "Drill the Peninsula Defence Force"
 MNR_PBT_project_desc:0 "45 days; 35 political power, 6 reserves, 100 rifles. Reward: 0 reserves, 6 confidence, 1 completed project; 5 army XP. Requires an owned, controlled capital. Maximum three projects."
 mnr_campaign.222.t:0 "A Dispute over Local Priorities"
 mnr_campaign.222.d:0 "The local council demands accounts of supplies and community rights. A compact strengthens trust; emergency rule empowers the garrison."
 mnr_campaign.222.a:0 "Fund an Agreed Settlement"
 mnr_campaign.222.b:0 "Issue Emergency Orders"
 mnr_campaign.322.t:0 "Drill the Peninsula Defence Force: Report"
 mnr_campaign.322.d:0 "The first project is complete. Two more require fresh resources. Repeating projects does not create free buildings."
 mnr_campaign.322.a:0 "Continue the Work"
 mnr_campaign.422.t:0 "Bataan with Its Own Charter"
 mnr_campaign.422.d:0 "Bataan guards Manila's approaches, but its residents need more than a garrison; defence must coexist with local livelihoods. The government now has trained services, reserves and three completed projects. Its further foreign policy remains your choice."
 mnr_campaign.422.a:0 "The Next Chapter Begins"
 MNR_A05_escort_order:0 "Order Two Coastal Escorts"
 MNR_A05_escort_order_desc:0 "After the first national project and arms workshops, spend 75 political power, 25 reserves and 50 support equipment on a coastal service. After 90 days: two light escorts and a dockyard in the original capital. Once per campaign; losing the harbour cancels the order without reward."
