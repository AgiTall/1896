l_english:
 JMC_organise_pilot_service:0 "Organise Merchant Convoy Pilotage"
 JMC_organise_pilot_service_desc:0 "Local pilots know the shoals and tides, but their records seldom leave their home harbour. We shall compile verified charts, designate escort rendezvous and distribute common signals to captains. Convoys will pass narrow waters with closer support from their escorts."
 JMC_prepare_transport_service:0 "Prepare Transport Crews"
 JMC_prepare_transport_service_desc:0 "On a distant expedition, a loading mistake may only become apparent across the sea. Quartermasters and captains must check stowage together, prepare shore parties and agree how to land supplies on an undeveloped coast."
 JMC_pilot_service:0 "Convoy Pilotage Service"
 JMC_pilot_service_desc:0 "Pilots' records have been compiled into common charts. Merchant captains know where to meet their escorts, while signal crews have agreed how to pass narrow waters and gather stragglers."
 JMC_transport_service:0 "Coordinated Transport Crews"
 JMC_transport_service_desc:0 "Transport captains, quartermasters and shore parties follow agreed manifests. Cargo is stowed in the order of unloading, and reserve landing equipment is ready for the crossing."
 jmc_operations.1.t:0 "A Pilot Comes Alongside"
 jmc_operations.1.d:0 "A pilot boat met the convoy at the entrance to the strait. The leading steamer's captain checked his chart: the depths, tide and assembly point matched the harbour's dispatch. The escort passed through alongside the transports. Back in port, the trading houses proposed retaining the common arrangements and asking experienced pilots to help prepare future voyages."
 jmc_operations.1.a:0 "Distribute the verified charts to every harbour"
 jmc_operations.2.t:0 "Cargo Ready to Land"
 jmc_operations.2.d:0 "During the landing exercise, the first boats reached the shore carrying tools and ropes. Previously these supplies might have been buried beneath crates intended for the final day of the voyage. This time the shore party received them first, marked out the unloading point and received the remaining boats. The captains amended their manifests before the transports returned to harbour."
 jmc_operations.2.a:0 "Adopt the loading and landing arrangements"
