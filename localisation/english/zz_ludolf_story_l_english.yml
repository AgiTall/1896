l_english:
 A01_ludolf_admirals_balance:0 "Power in Batavia"
 A01_admirals_side:0 "Admirals Council"
 A01_ludolf_side:0 "Ludolf Sloot van de Beele"
 A01_balance_compromise:0 "Uneasy Equilibrium"
 A01_council_influence:0 "Naval Ministry Influence"
 A01_council_pressure:0 "The Council Dictates Terms"
 A01_council_supremacy:0 "Admiralty Supremacy"
 A01_ludolf_influence:0 "Civilian Leadership"
 A01_ludolf_authority:0 "The Governor’s Authority"
 A01_ludolf_supremacy:0 "A Stable Government"
 ludolf.1.t:0 "Oil, Rubber and Guarantees"
 ludolf.1.d:0 "The World Trade Chamber has received Batavia’s proposal. Rubber and oil purchases, shipping insurance and warehouses must be agreed. The governor wants foreign capital without surrendering colonial administration."
 ludolf.1.a:0 "Dispatch a trade delegation."
 ludolf.2.t:0 "The Batavia Resource Contract"
 ludolf.2.d:0 "The East Indies offers the Chamber long-term oil and rubber deliveries. Our representatives are invited to discuss prices, port fees and insurance. This is an opportunity to expand commerce without assuming direct administration."
 ludolf.2.a:0 "Accept Batavia’s invitation."
 ludolf.10.t:0 "The Governor and the Naval Ministry"
 ludolf.10.d:0 "Rejecting outside alliances leaves Batavia alone against maritime threats. The admirals demand a voice in the budget. Ludolf retains civilian authority but must earn the officers’ respect through action.\n\nThe balance measures political control; Council respect determines its willingness to cooperate."
 ludolf.10.a:0 "Authority must be backed by trust."
 ludolf.20.t:0 "The Borneo Peace Terms"
 ludolf.20.d:0 "The naval war has drained the treasury and exposed northern Borneo. Japan offers peace: Sabah (1024), Brunei (1023), Limbang (1059) and Sarawak (333) pass to the empire; Interior Borneo (1022) is secured for Batavia. Japan receives oil and rubber rights throughout Borneo.\n\nThe Admirals Council will blame Ludolf for the humiliating treaty."
 ludolf.20.a:0 "Sign. We cannot sustain another campaign."
 ludolf.20.b:0 "Continue the war despite the Council."
 ludolf.21.t:0 "The Borneo Convention"
 ludolf.21.d:0 "Batavia has signed. The empire gains Sabah, Brunei, Limbang and Sarawak, together with exclusive oil and rubber rights across Borneo. The interior remains under East Indian administration."
 ludolf.21.a:0 "The resource question is settled."
 ludolf.30.t:0 "Government After Defeat"
 ludolf.30.d:0 "Batavia debates who will pay for the Borneo Convention. The admirals demand an inquiry and a new cabinet; local rulers demand autonomy. Ludolf proposes a reorganisation preserving common defence while giving the sultans their own governments."
 ludolf.30.a:0 "Begin with an inquiry and open accounts."
 ludolf.30.b:0 "Keep the cabinet and close the debate."
 ludolf.31.t:0 "The Sultans Ask for a Second Chance"
 ludolf.31.d:0 "The autonomous administrations have been established. Their delegates ask the council to retain Ludolf in exchange for a federal programme with active Indonesian participation. Japanese resource concessions remain in force."
 ludolf.31.a:0 "Autonomy becomes a political force."
 ludolf.32.t:0 "The Lost North Remembered"
 ludolf.32.d:0 "Officer clubs and port districts speak of recovering Sabah and Brunei. Some demand immediate revenge; others want the fleet rebuilt first. Ludolf sees a chance to unite the country around a long reconstruction programme."
 ludolf.32.a:0 "Recovery comes before revenge."
 ludolf.32.b:0 "Support the firebrands."
 ludolf.33.t:0 "The Council Demands an Account"
 ludolf.33.d:0 "The inquiry requests greater authority. Ludolf insists that the hearings must not become a predetermined transfer of power. Neither option dismisses him."
 ludolf.33.resign:0 "Agree to hand over power."
 ludolf.33.a:0 "Expand the councils inquiry."
 ludolf.33.b:0 "Defend civilian procedures."
 ludolf.33.c:0 "Reject the Council’s demands."
 ludolf.34.t:0 "Further Explanations Required"
 ludolf.34.d:0 "The admirals challenge the cabinet again. The balance of power influences the hearings but cannot remove Ludolf automatically."
 ludolf.34.a:0 "Give the commission more authority."
 ludolf.34.b:0 "Protect civilian procedures."
 ludolf.35.t:0 "Ludolf Under Arrest"
 ludolf.35.d:0 "The council dismisses and imprisons Ludolf for the lost war. Sultanate protests are rejected. The military directorate prepares purges across civilian and military institutions."
 ludolf.35.a:0 "The directorate takes control."
 ludolf.36.t:0 "A Second Chance for a Different Country"
 ludolf.36.d:0 "The sultanates and Indonesian delegates preserve Ludolfs government on condition that he creates a democratic federation with equal citizenship and participation in choosing officials. The dismissal proceedings end."
 ludolf.36.a:0 "Begin the federal transformation."
 A01_council_relations:0 "Governor and Admirals Council"
 A01_council_relations_desc:0 "§YCouncil respect: [?A01_admirals_respect|0]/100§!\n\nConcessions transfer authority to the admirals but improve cooperation. Exercises, open accounts and fulfilled promises build respect. After defeat, a low balance can force Ludolf’s resignation."
 A01_concede_naval_budget:0 "Concede a Share of the Budget"
 A01_concede_naval_budget_desc:0 "The navy gains control over orders. Council respect +15; balance shifts 10% toward the admirals."
 A01_honour_naval_officers:0 "Recognise Naval Service"
 A01_honour_naval_officers_desc:0 "The governor will personally honour distinguished crews. Respect +10; balance shifts 5% toward Ludolf."
 A01_joint_naval_exercises:0 "Hold Joint Naval Exercises"
 A01_joint_naval_exercises_desc:0 "A joint inspection and exercises demonstrate commitment to defence. Respect +10; balance shifts 10% toward Ludolf."
 A01_open_admiralty_accounts:0 "Open the Admiralty Accounts"
 A01_open_admiralty_accounts_desc:0 "Transparent procurement reduces mutual suspicion. Respect +8; a small gain in civilian control."
 A01_accept_naval_appointments:0 "Accept Council Appointments"
 A01_accept_naval_appointments_desc:0 "Admirals gain administrative posts. Respect +20; balance shifts 15% toward the Council."
 A01_postwar_reconstruction:0 "Reorganising the East Indies"
 A01_postwar_reconstruction_desc:0 "The Borneo Convention changed borders without resolving tensions between governor, navy and local rulers. Autonomous sultanates remain under Batavia and retain Japanese resource concessions."
 A01_charter_A11:0 "Grant a Charter: Kutai"
 A01_charter_A11_desc:0 "The sultanate receives its own administration and army while remaining subordinate to Batavia. Japanese oil and rubber rights remain in force."
 A01_charter_A12:0 "Grant a Charter: Pontianak"
 A01_charter_A12_desc:0 "The sultanate receives its own administration and army while remaining subordinate to Batavia. Japanese oil and rubber rights remain in force."
 A01_charter_A13:0 "Grant a Charter: Banjar"
 A01_charter_A13_desc:0 "The sultanate receives its own administration and army while remaining subordinate to Batavia. Japanese oil and rubber rights remain in force."
 A01_fund_widows:0 "Support Bereaved Families"
 A01_fund_widows_desc:0 "Payments to sailors’ families ease bitterness in the ports. Respect +5, stability +3%."
 A01_borneo_humiliation:0 "The Borneo Humiliation"
 A01_borneo_humiliation_desc:0 "The loss of northern Borneo and Japanese concessions undermine confidence in Batavia."
 A01_revanchism_simmering:0 "Simmering Revanchism"
 A01_revanchism_simmering_desc:0 "The public demands the lost territories back, but there is no common reconstruction programme."
 A01_revanchism_organised:0 "National Reconstruction Programme"
 A01_revanchism_organised_desc:0 "Revanchist sentiment is channelled into rebuilding the fleet and defence industry."
 A01_reconstruction_cabinet:0 "Reconstruction Cabinet"
 A01_reconstruction_cabinet_desc:0 "The new cabinet coordinates port reconstruction and relations with autonomous rulers."
 A01_sultanate_federation:0 "The Sultanate Compact"
 A01_sultanate_federation_desc:0 "Autonomous administrations retain a common defence compact with Batavia."
 A01_civilian_naval_compact:0 "Civilian-Naval Compact"
 A01_civilian_naval_compact_desc:0 "The Council recognises civilian leadership in exchange for an agreed naval programme."
 A01_reconstruction_commission:0 "Audit Damage and Obligations"
 A01_reconstruction_commission_desc:0 "Audit reconstruction costs, family compensation and existing loans before choosing a funding route."
 A01_autonomous_sultanates:0 "Agreement with the Sultanates"
 A01_autonomous_sultanates_desc:0 "Recognise local self-government and negotiate entry into the future federation. Autonomous subjects can later join the common state."
 A01_northern_memory:0 "Who Answers for the Lost Shores?"
 A01_northern_memory_desc:0 "Who Answers for the Lost Shores?. Establish the institutions and guarantees of this political settlement."
 A01_federal_defence_compact:0 "The Sultans Ask for Another Chance"
 A01_federal_defence_compact_desc:0 "The Sultans Ask for Another Chance. Establish the institutions and guarantees of this political settlement."
 A01_fleet_of_recovery:0 "The Council Oversees the Fleet"
 A01_fleet_of_recovery_desc:0 "The Council Oversees the Fleet. Establish the institutions and guarantees of this political settlement."
 A01_ludolf_survives:0 "Mandate for Civilian Reform"
 A01_ludolf_survives_desc:0 "Ludolf retains office to lead the transition from colonial rule to federation. A civilian mandate eases the transitional government’s burdens."
 A01_negotiated_resignation:0 "The Admirals Council Takes Power"
 A01_negotiated_resignation_desc:0 "Transfer power to the council directly from the postwar cabinet. Ludolf is dismissed and imprisoned; purges and military control follow."
 A01_review_borneo_convention:0 "Review the Borneo Convention"
 A01_review_borneo_convention_desc:0 "With government and fleet restored, Batavia can formulate demands to revise the humiliating convention. Recovering the lost territories will remain central to foreign policy."
 A01_pacific_settlement:0 "The Post-defeat Cabinet"
 A01_pacific_settlement_desc:0 "The key postwar fork: preserve Ludolfs civilian government and pursue reform, or bring the Admirals Council to power. Dismissal hearings begin, but there is no automatic removal."
