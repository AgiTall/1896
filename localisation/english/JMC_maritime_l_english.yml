l_english:
 JMC_maritime_programme:0 "Harbours and Sea Lanes"
 JMC_maritime_programme_desc:0 "Ships connect the surviving islands, yet every port keeps its own accounts of coal, workshops and free berths. The Admiralty and the trading houses must bring these records into a common order: coordinate repairs, prepare reserves and agree on the duties of the escort forces."
 JMC_port_register:0 "Compile a Harbour Register"
 JMC_port_register_desc:0 "Collect the port ledgers, check depths alongside the quays and establish which workshops can receive steam vessels. Captains need records they can trust once they put to sea."
 JMC_repair_contracts:0 "Coordinate Repair Contracts"
 JMC_repair_contracts_desc:0 "Shipyards dispute the drawings while vessels wait weeks for parts that a neighbouring port could supply. Common acceptance standards and coordinated orders will let the workshops proceed without these delays."
 JMC_coaling_stations:0 "Prepare the Coal Depots"
 JMC_coaling_stations_desc:0 "For a steam fleet, a long voyage begins ashore. Inspect the coal yards, protect the fuel from rain and arrange delivery to the quays so that ships no longer depend on improvised purchases at every port."
 JMC_escort_rehearsal:0 "Hold Convoy Exercises"
 JMC_escort_rehearsal_desc:0 "Merchant captains and escort commanders use different signals and different assembly procedures. Joint sailings will teach them to keep formation, notice stragglers and return to the convoy after an alarm."
 JMC_sailing_conference:0 "Convene a Conference on Distant Voyages"
 JMC_sailing_conference_desc:0 "The harbour register, repair agreements and coal reserves provide a foundation for distant voyages. The captains and the Admiralty must now decide their first priority: regular protection of the trade routes or preparations for expeditionary formations."
 JMC_replenish_reserves:0 "Replenish Maritime Reserves"
 JMC_replenish_reserves_desc:0 "Allocate funds to charter vessels and load spare equipment, rigging and provisions. Prepared cargoes will help sustain shipping while the harbours assemble the next consignment of supplies."
 JMC_yard_coordination:0 "Coordinated Shipyard Orders"
 JMC_yard_coordination_desc:0 "Common drawings and acceptance procedures allow shipyards to distribute orders and prepare parts in advance. Craftsmen spend less time reworking deliveries or waiting for neighbouring shops."
 JMC_coaling_network:0 "The Coaling Station Network"
 JMC_coaling_network_desc:0 "Serviceable depots and coordinated coal deliveries connect separate harbours into a network. Ships can venture farther from home without wasting effort searching for fuel."
 JMC_escort_training:0 "Trained Convoy Crews"
 JMC_escort_training_desc:0 "Merchant captains know the escort signals, and escort commanders account for the speed of the slowest steamers. Convoys assemble and change formation under common procedures."
 JMC_merchant_plan:0 "Guarding the Trade Routes"
 JMC_merchant_plan_desc:0 "Coordinated escort forces are assigned to the convoy routes. Merchant captains and naval staffs prepare sailing schedules together so that escorts meet the ships where they are needed."
 JMC_expedition_plan:0 "The Expeditionary Sailing Plan"
 JMC_expedition_plan_desc:0 "Staffs agree in advance on formation strength, loading and transport assembly. Squadrons prepare to operate together far from their bases and land troops under a common plan."
 JMC_ready_stores:0 "Stores for the Sea Passage"
 JMC_ready_stores_desc:0 "Spare parts, rigging and provisions have been loaded against common manifests. Crews can maintain their ships at sea without requesting a separate voyage for every missing item."
 jmc_maritime.1.t:0 "What the Port Ledgers Conceal"
 jmc_maritime.1.d:0 "The harbour lists are on the table, but identical headings conceal different things. One workshop is a shipyard with machine tools; another is a shipwright’s shed. Coal promised to several captains appears in the same depot account. The port guilds propose reconciling the ledgers through their representatives; naval quartermasters are ready to conduct their own inspection."
 jmc_maritime.1.merchant:0 "Entrust the review to the port guilds"
 jmc_maritime.1.navy:0 "Have the naval quartermasters check the ledgers"
 jmc_maritime.2.t:0 "Parts from a Common Drawing"
 jmc_maritime.2.d:0 "A consignment of parts has arrived from the neighbouring harbour. Once, the inspectors would have disputed dimensions and responsibility; now an agreed drawing and a signed manifest accompany the cargo. Contractors still bargain over new orders, but the ships no longer wait for every dispute to end. The craftsmen ask that the new procedures be retained."
 jmc_maritime.2.a:0 "Let the yards work to coordinated orders"
 jmc_maritime.3.t:0 "Coal under Cover"
 jmc_maritime.3.d:0 "The depot keepers have sent their first reconciled reports: fuel is covered, the approaches to the quays are clear and deliveries have been agreed with the store crews. Captains have received a list of harbours where they can replenish their bunkers without bargaining at every coal yard. The distant passages marked on their charts now rest on records of real stocks ashore."
 jmc_maritime.3.a:0 "Circulate the records to the captains"
 jmc_maritime.4.t:0 "The Convoy Returns to Harbour"
 jmc_maritime.4.d:0 "The last steamer entered the harbour towards evening. During the exercise, one transport fell behind, while signallers mistook an escort’s turn for an order to the entire convoy. The mistakes were reviewed in the roadstead. The captains agreed on assembly signals, sailing order and procedures when a neighbouring vessel vanished from view. Their next sailing will begin with a joint review of those rules."
 jmc_maritime.4.a:0 "Retain the common signal procedures"
 jmc_maritime.5.t:0 "Where to Send the Prepared Fleet"
 jmc_maritime.5.d:0 "The harbour register, repair agreements and exercise reports lie before the conference. Merchant captains ask for escorts assigned to regular convoys. Expeditionary staff officers propose arranging transports and warships into formations prepared in advance. Both proposals demand continuing cooperation. The Admiralty must decide which system will guide future sailings."
 jmc_maritime.5.merchant:0 "Make convoy protection the first priority"
 jmc_maritime.5.expedition:0 "Adopt a plan for distant expeditions"
