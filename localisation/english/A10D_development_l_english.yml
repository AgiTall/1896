l_english:
 A10D_workshop_islands:0 "Islands of Craft"
 A10D_workshop_islands_desc:0 "Small workshops preserved the trades after the Exodus, but shared drawings, spare parts and reliable orders are still lacking."
 A10D_separate_quartermasters:0 "Separate Provincial Quartermasters"
 A10D_separate_quartermasters_desc:0 "Local stores provision their own garrisons. A neighbouring regiment too often receives the wrong cartridges and no sailing timetable."
 A10D_shipping_shortage:0 "Island Provisioning Shortage"
 A10D_shipping_shortage_desc:0 "The provisioning reserve is below 20. Too few dry stores, boats and grain reserves delay military and civilian cargo. Mail ferries, granaries and rice delivery programmes can restore the service."
 A10D_strained_shipping:0 "Overburdened Ferry Lines"
 A10D_strained_shipping_desc:0 "The provisioning reserve is between 20 and 49. Every steamer breakdown delays grain, mail and military cargo. A reserve of 50 will clear the bottleneck."
 A10D_reliable_shipping:0 "Reliable Island Shipping"
 A10D_reliable_shipping_desc:0 "With a provisioning reserve of at least 80, the islands have reserve crews, dry warehouses and vessels for the storm season."
 A10D_workshop_network:0 "The Provincial Workshop Network"
 A10D_workshop_network_desc:0 "Shared drawings and mutual orders connect provincial workshops while preserving local craftsmanship."
 A10D_abaca_exports:0 "Rope for the Ocean Fleets"
 A10D_abaca_exports_desc:0 "Abaca cooperatives supply the ropewalks and receive a reliable share of export earnings."
 A10D_sugar_standards:0 "Honest Sugar Scales"
 A10D_sugar_standards_desc:0 "Common weights and inspected grades support commerce, while preserved rice fields protect communities from harvest failure."
 A10D_granary_network:0 "Public Rice Granaries"
 A10D_granary_network_desc:0 "Dry communal granaries allow households to survive shipping delays without immediate hunger."
 A10D_district_medicine:0 "District Medicine"
 A10D_district_medicine_desc:0 "Small clinics train orderlies and return wounded soldiers to service."
 A10D_public_health:0 "Clean Water for the Islands"
 A10D_public_health_desc:0 "Clean water intakes, quarantine rules and trained orderlies reduce sickness in households and garrisons."
 A10D_teacher_colleges:0 "Provincial Teacher Colleges"
 A10D_teacher_colleges_desc:0 "Teachers explain arithmetic and literacy in community languages and prepare pupils for technical study."
 A10D_island_telegraph:0 "The Quayside Telegraph"
 A10D_island_telegraph_desc:0 "Signal stations and local cables quickly carry orders, prices and storm warnings."
 A10D_polytechnic:0 "The Island Polytechnic"
 A10D_polytechnic_desc:0 "The college trains foremen, chemists and surveyors for a self-sustaining island economy."
 A10D_common_market:0 "The Market of a Thousand Quays"
 A10D_common_market_desc:0 "Reliable shipping and common measures connect local markets without erasing their diversity."
 A10D_standard_stores:0 "Standardised Regimental Stores"
 A10D_standard_stores_desc:0 "Common manifests and stores separated by rifle system reduce wasted ammunition."
 A10D_pilot_stations:0 "Straits Pilot Stations"
 A10D_pilot_stations_desc:0 "Local current charts and signal lights help ships keep station near their own coasts."
 A10D_coastal_defence:0 "Sheltered Shore Batteries"
 A10D_coastal_defence_desc:0 "Shore gun crews keep watch over the approaches to the principal landing stages."
 A10D_pack_columns:0 "Garrison Pack Columns"
 A10D_pack_columns_desc:0 "Prepared trails, mules and boats carry stores through mountains and mangroves."
 A10D_staff_school:0 "The Islands Staff College"
 A10D_staff_school_desc:0 "Officers learn to coordinate marches, tides and the unloading of supplies."
 A10D_ammunition_contracts:0 "Year-Round Arsenal Orders"
 A10D_ammunition_contracts_desc:0 "Workshops fulfil steady orders for cartridges and spare parts instead of emergency purchases at every alarm."
 A10D_escort_service:0 "Coastal Escort Service"
 A10D_escort_service_desc:0 "Patrol flotillas cover the ferry routes and give early warning of major enemy forces."
 A10D_landing_staff:0 "The Island Landing Staff"
 A10D_landing_staff_desc:0 "Joint exercises have taught the staff to plan limited landings and supply their first wave."
 A10D_monsoon_damage:0 "Typhoon-Damaged Quays"
 A10D_monsoon_damage_desc:0 "The storm has damaged stores and quays. Emergency repairs can shorten the disruption; ordinary works will finish restoration within the season."
 A10D_evening_classes:0 "Workshop Evening Classes"
 A10D_evening_classes_desc:0 "Teachers and foremen run temporary evening courses for apprentices who work during the day."
 A10D_tools_programme:0 "Provincial Tool Purchasing"
 A10D_tools_programme_desc:0 "A paid consignment of tools helps workshops master their new orders."
 A10D_volunteer_orderlies:0 "Volunteer Medical Detachments"
 A10D_volunteer_orderlies_desc:0 "Communities have paid for dressings and the training of volunteer orderlies for the coming season."
 A10D_war_collections:0 "Communal War Collections"
 A10D_war_collections_desc:0 "Collections for conscripts' families strengthen support for the war but absorb some civilian output."
 A10D_development:0 "Economy and Defence of the Archipelago"
 A10D_development_desc:0 "Island provisioning reserve: §Y[?A10D_supply|0]/100§!.\nBelow §Y20§!: serious shortages; §Y20–49§!: strained routes; §Y50–79§!: normal service; §Y80§! and above: reliable reserve routes.\nThe reserve represents boats, dry warehouses, crews and grain for the voyages. Construction, purchases and exercises affect it independently of the state debt to the WTC."
 A10D_hire_coastal_boats:0 "Charter Coastal Boats"
 A10D_hire_coastal_boats_desc:0 "A three-week contract with fishermen and boatbuilders will restore short routes. When the programme ends, the provisioning reserve rises by 12."
 A10D_buy_reserve_rice:0 "Purchase Rice for the Ferry Routes"
 A10D_buy_reserve_rice_desc:0 "Pay for grain for crews and warehouses, temporarily diverting some civilian goods. After 21 days the provisioning reserve rises by 12."
 A10D_repair_typhoon_quays:0 "Repair the Storm-Damaged Quays"
 A10D_repair_typhoon_quays_desc:0 "Send carpenters and floating lifting crews to the damaged harbours. After 35 days the damaged quays return to service and the provisioning reserve rises by 20."
 A10D_export_rope_contract:0 "Fulfil a Rope Contract"
 A10D_export_rope_contract_desc:0 "The cooperatives will reserve shipping for an export cargo, immediately consuming 10 reserve. After a month, export receipts provide 65 political power for public funds."
 A10D_purchase_provincial_tools:0 "Purchase Tools for the Provinces"
 A10D_purchase_provincial_tools_desc:0 "Purchasing and delivery require 10 provisioning reserve. After 45 days the workshops receive tools and improve production efficiency growth for 120 days."
 A10D_evening_literacy:0 "Organise Evening Classes"
 A10D_evening_literacy_desc:0 "Teachers will visit the harbour workshops. Transporting the books costs 5 reserve; after 35 days the classes improve research for 120 days."
 A10D_garrison_field_drills:0 "Hold Garrison Field Exercises"
 A10D_garrison_field_drills_desc:0 "Weapons wear and exercise supply consume 150 rifles and 5 provisioning reserve. After 21 days the officers return with 8 army experience."
 A10D_train_volunteer_orderlies:0 "Train Volunteer Orderlies"
 A10D_train_volunteer_orderlies_desc:0 "Dressings and travel cost 5 reserve. After a month the trained medical detachments will aid the recovery of wounded soldiers for 120 days."
 A10D_collect_for_soldiers_families:0 "Collect for Soldiers' Families"
 A10D_collect_for_soldiers_families_desc:0 "Support for conscripts' families consumes 10 reserve and diverts civilian goods for 90 days. After 35 days war support rises by 4 percentage points."
 A10D_emergency_shipping_levy:0 "Charter Emergency Shipping"
 A10D_emergency_shipping_levy_desc:0 "Emergency chartering of private vessels angers merchants, immediately reducing stability by 2 percentage points. After a month the fleet receives 8 convoys and the reserve rises by 20."
 A10D_restore_peacetime_routes:0 "Restore Peacetime Timetables"
 A10D_restore_peacetime_routes_desc:0 "Return mail ferries to civilian routes, inspect warehouses and repair the boats. After 45 days the reserve rises by 15 and stability by 1 percentage point."
 A10D_development.1.t:0 "How Many Boats Link the Islands?"
 A10D_development.1.d:0 "Three incompatible shipping registers lie before the congress. One counts only steamers, another the customs boats, the third everything that ever left a harbour. Behind each error is an undelivered sack of rice and a garrison waiting in vain for cartridges. The captains propose a paid inspection of the routes."
 A10D_development.1.a:0 "Pay for a route inspection"
 A10D_development.1.b:0 "Let the communities compare their lists"
 A10D_development.2.t:0 "A Typhoon over the Ferry Routes"
 A10D_development.2.d:0 "The morning dispatches report torn roofs, flooded rice stores and several boats driven ashore. The principal quays have survived, but mail sailings are suspended. Provincial carpenters ask for tools before the next tide."
 A10D_development.2.a:0 "Release funds to the carpenters"
 A10D_development.2.b:0 "Introduce temporary rice rations"
 A10D_development.3.t:0 "The Register of Three Quays"
 A10D_development.3.d:0 "The enumerators have returned with an unexpected finding: the same boats appear in three different harbour registers, while entire fishing villages appear nowhere. The congress now has the foundation of a timetable and a list of communities that will need help first when storms arrive."
 A10D_development.3.a:0 "Begin with the rice stores"
 A10D_development.3.b:0 "Publish the full register"
 A10D_development.4.t:0 "An Orderly from the Next Island"
 A10D_development.4.d:0 "The first district clinic has sent its thanks to a ferry crew: its orderly arrived at the beginning of the fever, rather than after the funeral. The little wards still lack beds, but the physicians are already discussing volunteer courses and common quarantine certificates."
 A10D_development.4.a:0 "Support the volunteer courses"
 A10D_development.4.b:0 "Provide clean water first"
 A10D_development.5.t:0 "The Captains Ask for Written Terms"
 A10D_development.5.d:0 "The reserve shipping register is complete. The captains agree to carry soldiers and stores, but remind the government that the same vessels carry the islands' rice. They ask for agreed compensation and a share of the timetable reserved for civilian sailings."
 A10D_development.5.a:0 "Protect civilian sailings in the contract"
 A10D_development.5.b:0 "Pay for additional training voyages"
 A10D_development.6.t:0 "The First Common Trading Season"
 A10D_development.6.d:0 "Sugar and abaca have reached their buyers without the old week-long delays. Harbour shops stock tools made in neighbouring provinces, while school copybooks arrived on the same sailing as spare parts for the mill. For the first time, local newspapers describe a common island economy as an everyday reality."
 A10D_development.6.a:0 "Strengthen the public reserves"
 A10D_development.6.b:0 "Finance new workshop orders"
 A10D_rifle_studies:0 "Regimental Rifle Registers"
 A10D_light_vessels:0 "Gunboat Crew Experience"
 A10D_export_bureau:0 "The Island Export Bureau"
 A10D_export_bureau_desc:0 "Common weight registers and telegraph reports allow several ports to negotiate with buyers together. An export bureau will coordinate scattered orders and secure space for trading voyages in the island timetable."
 A10D_island_industry:0 "Industry of the Archipelago"
 A10D_island_industry_desc:0 "Workshops, technical schools and the common market no longer stand apart. The islands can build their own factories, train engineers and supply their garrisons without waiting for every new consignment of foreign goods."
 A10D_mountain_infantry:0 "Infantry of the Mountains and Jungles"
 A10D_mountain_infantry_desc:0 "Mountain villagers know trails that appear on no staff map. Volunteers will teach the regiments to cross slopes and wet forests, keep powder dry and remain within reach of the pack columns."
 A10D_signal_corps:0 "The Archipelago Signal Corps"
 A10D_signal_corps_desc:0 "Field signallers will connect the staff maps to the quayside telegraph. Agreed signals, couriers and cable stations will help commanders learn of delayed sailings and neighbouring troop movements in time."
 A10D_war_fleet:0 "A Fleet to Defend the Islands"
 A10D_war_fleet_desc:0 "The shipyards, naval schools and landing staff must work to a common plan. Supported by its own industry, the Confederation can train escort crews and move troops under the protection of warships."
 A10D_jungles:0 "Experience of Mountain and Jungle Detachments"
