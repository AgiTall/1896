l_english:
 BLV_leviathan:0 "An Empire After the Exodus"
 BLV_leviathan_desc:0 "London is lost. The fleet, Crown and overseas stations survive; the government in Bermuda must decide what kind of Britain to preserve."
 BLV_audit:0 "The Surviving Empire Ledger"
 BLV_audit_desc:0 "Audit fleet spending, station reserves and Chamber obligations. Reserves and imperial cohesion underpin later decisions."
 BLV_hamilton:0 "The Hamilton Conference"
 BLV_hamilton_desc:0 "Admirals, the Court and colonial delegates dispute authority. A six-month constitutional debate opens with decisions to influence each bloc."
 BLV_commission:0 "Royal Supply Commission"
 BLV_commission_desc:0 "An independent supply audit strengthens the Crown and informs any future cabinet."
 BLV_admiralty:0 "Admiral Fisher's Mandate"
 BLV_admiralty_desc:0 "Fisher controls the naval budget while the Crown retains its formal position."
 BLV_constitution:0 "A Responsible Imperial Cabinet"
 BLV_constitution_desc:0 "Representatives control the budget; local guarantees strengthen the empire but cost resources."
 BLV_crown:0 "Emergency Powers of the Crown"
 BLV_crown_desc:0 "The Crown subordinates rival departments. Orders become firmer, but colonial control remains costly."
 BLV_naval_cabinet:0 "A Cabinet of Naval Specialists"
 BLV_naval_cabinet_desc:0 "Unify procurement under a professional department."
 BLV_merit:0 "Appointments by Service"
 BLV_merit_desc:0 "Train capable officers from the overseas stations."
 BLV_strategic_reserve:0 "An Admiralty Strategic Reserve"
 BLV_strategic_reserve_desc:0 "Set aside reserves for distant operations."
 BLV_naval_state:0 "The Naval Service State"
 BLV_naval_state_desc:0 "Consolidate the naval cabinet and permanent supply administration."
 BLV_imperial_budget:0 "Parliamentary Budget Control"
 BLV_imperial_budget_desc:0 "Public estimates curb intermediaries and Court spending."
 BLV_rights:0 "Charters for Island Citizens"
 BLV_rights_desc:0 "Guarantee access to courts and paid public service."
 BLV_delegates:0 "A Standing Colonial Conference"
 BLV_delegates_desc:0 "Link cabinet accountability to colonial representation."
 BLV_maritime_commonwealth:0 "A Commonwealth of Free Seas"
 BLV_maritime_commonwealth_desc:0 "Build the empire on negotiated consent. Support Australian federation without bypassing colonial votes."
 BLV_royal_secretariat:0 "A Unified Royal Secretariat"
 BLV_royal_secretariat_desc:0 "Bring station correspondence under one royal office."
 BLV_crown_guard:0 "The Crown Marine Guard"
 BLV_crown_guard_desc:0 "Raise a trained marine battalion group in Bermuda."
 BLV_loyal_governors:0 "The Governors' Oath"
 BLV_loyal_governors_desc:0 "Back local loyalty with material support."
 BLV_imperial_prerogative:0 "Preserve Imperial Prerogative"
 BLV_imperial_prerogative_desc:0 "Preserve the Crown's right to resist secession without automatically annexing foreign governments."
 BLV_rationing:0 "Supply the Fleet Every Month"
 BLV_rationing_desc:0 "Replace emergency levies with regular estimates, reducing monthly reserve expenditure."
 BLV_bermuda_workshops:0 "Hamilton Workshops"
 BLV_bermuda_workshops_desc:0 "Establish safe production near the government."
 BLV_coal_depots:0 "Coaling Depots for Distant Stations"
 BLV_coal_depots_desc:0 "Distributed depots replenish the imperial reserve each month."
 BLV_machine_tools:0 "Machine Tools for Island Industry"
 BLV_machine_tools_desc:0 "Support engineering and equipment maintenance."
 BLV_ordnance:0 "Island Ordnance Orders"
 BLV_ordnance_desc:0 "Supply garrisons with locally made rifles."
 BLV_nz_industry:0 "New Zealand Workshops"
 BLV_nz_industry_desc:0 "Place civilian orders in safe New Zealand."
 BLV_cable_school:0 "A School of Cable Engineers"
 BLV_cable_school_desc:0 "Train domestic cable engineers."
 BLV_island_economy:0 "An Oceanic Industrial Economy"
 BLV_island_economy_desc:0 "Unify island firms through common standards and orders."
 BLV_credit_audit:0 "The Price of Lambert's Policy"
 BLV_credit_audit_desc:0 "Audit Britain's heavy Chamber debt without resetting its existing ledger."
 BLV_chamber_desk:0 "A Chamber Desk at the Treasury"
 BLV_chamber_desk_desc:0 "Open normal Chamber compacts, subject to its approval."
 BLV_independent_accounts:0 "Independent Maritime Accounts"
 BLV_independent_accounts_desc:0 "Pay down debt and develop independent accounts without cancelling the ledger."
 BLV_lambert_compact:0 "A Fleet and Chamber Compact"
 BLV_lambert_compact_desc:0 "Back Chamber shipping protection and pursue service agreements through its existing negotiations."
 BLV_insurance:0 "An Admiralty Insurance Office"
 BLV_insurance_desc:0 "Domestic insurance protects shipping but requires funds and does not forgive debt."
 BLV_revoke_cover:0 "Withdraw Chamber Naval Cover"
 BLV_revoke_cover_desc:0 "Withdraw naval cover for Chamber enforcement, changing its live global sanctions system."
 BLV_service_contracts:0 "Station Service Contracts"
 BLV_service_contracts_desc:0 "Use negotiated supply contracts without ceding sovereignty."
 BLV_debt_settlement:0 "Settle Imperial Obligations"
 BLV_debt_settlement_desc:0 "Pay down liabilities with budget funds; recurring repayments remain available."
 BLV_fleet_register:0 "Register the Surviving Squadrons"
 BLV_fleet_register_desc:0 "Unify Atlantic and Eastern squadron records. This focus does not duplicate the starting fleet."
 BLV_bermuda_dock:0 "Bermuda Dock Facilities"
 BLV_bermuda_dock_desc:0 "Expand repair facilities for the Atlantic squadron."
 BLV_engine_rooms:0 "Reform the Engine-Room Service"
 BLV_engine_rooms_desc:0 "Train steam-fleet engineers and reduce downtime."
 BLV_battle_line:0 "A Concentrated Ironclad Line"
 BLV_battle_line_desc:0 "A decisive battle doctrine strengthens capital ships but consumes reserves."
 BLV_cruiser_routes:0 "Cruisers on the Trade Routes"
 BLV_cruiser_routes_desc:0 "Dispersed cruisers protect supply routes."
 BLV_naval_staff:0 "A Joint Naval Operations Staff"
 BLV_naval_staff_desc:0 "Coordinate squadrons under either naval doctrine."
 BLV_convoy_service:0 "Ocean Convoy Service"
 BLV_convoy_service_desc:0 "Commission transports and train escort services."
 BLV_singapore_docks:0 "Singapore Repair Station"
 BLV_singapore_docks_desc:0 "Develop the base only while Singapore is owned and controlled by Britain."
 BLV_fleet_logistics:0 "A Fleet That Can Stay at Sea"
 BLV_fleet_logistics_desc:0 "Coordinate repair, coal and replenishment."
 BLV_garrison_audit:0 "Garrisons Awaiting Relief"
 BLV_garrison_audit_desc:0 "Audit Gibraltar, Singapore and Hong Kong garrisons; the Song makes rotation essential."
 BLV_rotation:0 "Regular Garrison Rotation"
 BLV_rotation_desc:0 "Fund relief crews and medical evacuation."
 BLV_marines:0 "Marines for Distant Stations"
 BLV_marines_desc:0 "Raise one marine group and standardise training."
 BLV_field_hospitals:0 "Evacuation Fleet Hospitals"
 BLV_field_hospitals_desc:0 "Link forward medical posts to safe island hospitals."
 BLV_colonial_service:0 "Paid Colonial Service"
 BLV_colonial_service_desc:0 "Train local supply specialists and officers."
 BLV_amphibious_staff:0 "Expeditionary Operations Staff"
 BLV_amphibious_staff_desc:0 "Train staff to supply limited landings rather than promise instant continental conquest."
 BLV_station_census:0 "Voices of the Distant Stations"
 BLV_station_census_desc:0 "Hear the governments and garrisons sustaining the maritime network."
 BLV_australian_dossier:0 "The Australian Dossier"
 BLV_australian_dossier_desc:0 "Six governments seek different guarantees. Britain must answer their proposals rather than create federation for them."
 BLV_dominion_charters:0 "Permit a Negotiated Federation"
 BLV_dominion_charters_desc:0 "Support the Australian charter while preserving local referendums and Sydney's decisions."
 BLV_nz_ports:0 "Imperial Ports in New Zealand"
 BLV_nz_ports_desc:0 "Support supplies to Britain's New Zealand possessions."
 BLV_pacific_stations:0 "Fiji and New Guinea Stations"
 BLV_pacific_stations_desc:0 "Coordinate relief and supply for distant garrisons."
 BLV_colonial_red_line:0 "The Limit of Colonial Concessions"
 BLV_colonial_red_line_desc:0 "Withdraw automatic support for new charters; the British player may still accept individual Australian proposals."
 BLV_australia_sovereignty:0 "Recognise a Sovereign Commonwealth"
 BLV_australia_sovereignty_desc:0 "Recognise an existing Australian federation while leaving other colonies and their votes intact."
 BLV_reconquest:0 "Plans to Recover a Breakaway Dominion"
 BLV_reconquest_desc:0 "Prepare a war goal against an independent Australia under the coercive imperial policy. The player declares war."
 BLV_malacca:0 "Navigation Rules in Malacca"
 BLV_malacca_desc:0 "Formalise the navigation settlement of 28 November 1893 and issue consistent passage orders to the captains."
 BLV_batavia_oil:0 "A Batavian Oil Agreement"
 BLV_batavia_oil_desc:0 "Offer Ludolf a supply agreement. The Dutch may refuse, and deliveries require control of the oil region."
 BLV_philippine_mission:0 "A Mission to the Philippines"
 BLV_philippine_mission_desc:0 "Offer reciprocal military access without entering Philippine wars."
 BLV_pacific_deterrent:0 "Pacific Deterrence"
 BLV_pacific_deterrent_desc:0 "Coordinate the Eastern squadron and coastwatchers."
 BLV_japanese_note:0 "A Note to the Japanese Admiralty"
 BLV_japanese_note_desc:0 "Request free-navigation guarantees; Tokyo may accept or refuse."
 BLV_war_plans:0 "Eastern Seas War Plans"
 BLV_war_plans_desc:0 "Prepare a Manila war goal while Japan owns it and has rejected the British note. War is not automatic."
 BLV_eastern_supply:0 "Supply the Eastern Squadron"
 BLV_eastern_supply_desc:0 "Prepare coal, repair and replenishment for a prolonged deployment."
 BLV_song_records:0 "Classified Song Logs"
 BLV_song_records_desc:0 "Compare garrison records while retaining classified intelligence in the British archive."
 BLV_instruments:0 "Instruments for Island Laboratories"
 BLV_instruments_desc:0 "Equip a Bermuda measurement service without moving or duplicating Tesla."
 BLV_malta_license:0 "A Saint Angelo Laboratory Agreement"
 BLV_malta_license_desc:0 "Request research correspondence from Tesla's actual host, who may refuse."
 BLV_ungudja:0 "The Unguja File"
 BLV_ungudja_desc:0 "Intelligence presents a private report; other countries receive no classified findings."
 BLV_clinical_rules:0 "Rules for Work with the Immune"
 BLV_clinical_rules_desc:0 "Regulate treatment of the immune; serum policy is chosen separately."
 BLV_serum_contract:0 "A Licensed Dubois Foundation"
 BLV_serum_contract_desc:0 "Ratify a licensed contract or revise the earlier refusal, with treasury oversight of deliveries and medical supervision of serum use."
 BLV_ethical_research:0 "An Independent Medical Commission"
 BLV_ethical_research_desc:0 "Review the June Dubois policy and prohibit coerced blood collection. Later Chamber deliveries cannot overrule the ban."
 BLV_calibration:0 "Calibrate the Suppressors"
 BLV_calibration_desc:0 "Complete the early trial scheduled for 20 July 1894. Without Tesla access it is deferred. This protects a single site, unlike the long-range prototype of 1900."
 BLV_research_school:0 "An Admiralty Measurement School"
 BLV_research_school_desc:0 "Train specialists continuously while Tesla and the artifact retain independent custody and fate."
 BLV_greenland_watch:0 "The Danish Administration of Greenland"
 BLV_greenland_watch_desc:0 "Maintain Danish civil administration and British supplies in Greenland, already represented under British ownership."
 BLV_arctic_depots:0 "Polar Depots and Winter Stations"
 BLV_arctic_depots_desc:0 "Prepare winter clothing, coal and relief crews."
 BLV_russian_note:0 "A Greenland Note to Reykjavik"
 BLV_russian_note_desc:0 "Offer Russia an exchange of observations without territorial demands."
 BLV_scientific_cargo:0 "Protect the Scientific Cargo"
 BLV_scientific_cargo_desc:0 "Prepare security and storage before disturbing an unknown device."
 BLV_polar_mandate:0 "A Polar Expedition Mandate"
 BLV_polar_mandate_desc:0 "Implement the expedition mandate of 5 August 1896, arranging a private voyage or foreign observers. Excavation is a separate operation from 1898."
 BLV_archive:0 "An Archive of Resonant Frequencies"
 BLV_archive_desc:0 "Preserve acquired knowledge independently of the object. Recovery and decoding require separate projects."
 BLV_remember_home:0 "Home Beyond the Horizon"
 BLV_remember_home_desc:0 "Gather maps and exile records without declaring dead lands safe."
 BLV_coastal_trials:0 "Trials off the Dead Coast"
 BLV_coastal_trials_desc:0 "Prepare measurement voyages; one focus cannot make the homeland habitable."
 BLV_long_range:0 "A Long-Range Suppressor"
 BLV_long_range_desc:0 "From 1900, artifact access and Tesla cooperation permit a long trial with sufficient scientific preparation."
 BLV_pioneer_station:0 "The First Return Station"
 BLV_pioneer_station_desc:0 "After a successful prototype, prepare a small coastal station. The project costs time and supplies and does not automatically transfer Britain."
 BLV_admiralty_spirit:0 "Fisher's Cabinet"
 BLV_admiralty_spirit_desc:0 "The naval cabinet directs state spending."
 BLV_constitution_spirit:0 "Responsible Imperial Cabinet"
 BLV_constitution_spirit_desc:0 "Budget accountability strengthens station consent."
 BLV_crown_spirit:0 "Royal Emergency Council"
 BLV_crown_spirit_desc:0 "The Crown assumes direct responsibility for the empire."
 BLV_procurement_spirit:0 "Admiralty Procurement"
 BLV_procurement_spirit_desc:0 "Unified orders reduce production delays."
 BLV_naval_state_spirit:0 "Naval Service State"
 BLV_naval_state_spirit_desc:0 "Permanent service supports readiness."
 BLV_island_rights_spirit:0 "Island Citizens' Charters"
 BLV_island_rights_spirit_desc:0 "Local residents receive legal and service guarantees."
 BLV_maritime_commonwealth_spirit:0 "Commonwealth of Free Seas"
 BLV_maritime_commonwealth_spirit_desc:0 "Negotiated consent sustains the maritime network."
 BLV_royal_secretariat_spirit:0 "Royal Secretariat"
 BLV_royal_secretariat_spirit_desc:0 "Unified correspondence reduces departmental delay."
 BLV_imperial_prerogative_spirit:0 "Imperial Prerogative"
 BLV_imperial_prerogative_spirit_desc:0 "Holding stations demands garrison expenditure."
 BLV_island_industry_spirit:0 "Island Industrial Network"
 BLV_island_industry_spirit_desc:0 "Shared standards speed industrial expansion."
 BLV_insurance_spirit:0 "Admiralty Insurance Office"
 BLV_insurance_spirit_desc:0 "Domestic insurance supports shipping independence."
 BLV_engine_rooms_spirit:0 "Trained Engine-Room Crews"
 BLV_engine_rooms_spirit_desc:0 "Trained engineers sustain fleet organisation."
 BLV_battle_line_spirit:0 "The Ironclad Line"
 BLV_battle_line_spirit_desc:0 "Concentration strengthens capital ships."
 BLV_cruiser_routes_spirit:0 "Cruiser Route Protection"
 BLV_cruiser_routes_spirit_desc:0 "Dispersed forces improve escorts."
 BLV_naval_staff_spirit:0 "Naval Operations Staff"
 BLV_naval_staff_spirit_desc:0 "The staff coordinates distant squadrons."
 BLV_escorts_spirit:0 "Ocean Convoy Service"
 BLV_escorts_spirit_desc:0 "Escorts sustain regular supplies."
 BLV_fleet_logistics_spirit:0 "Coordinated Fleet Logistics"
 BLV_fleet_logistics_spirit_desc:0 "Reserve services reduce supply consumption."
 BLV_rotation_spirit:0 "Garrison Rotation"
 BLV_rotation_spirit_desc:0 "Rotation reduces forward-unit exhaustion."
 BLV_field_hospitals_spirit:0 "Evacuation Hospitals"
 BLV_field_hospitals_spirit_desc:0 "Medical evacuation returns personnel to service."
 BLV_expedition_staff_spirit:0 "Expeditionary Staff"
 BLV_expedition_staff_spirit_desc:0 "Specialists prepare small landing forces."
 BLV_pacific_deterrent_spirit:0 "Eastern Deterrence System"
 BLV_pacific_deterrent_spirit_desc:0 "Stations and squadrons follow a common plan."
 BLV_medical_commission_spirit:0 "Independent Medical Commission"
 BLV_medical_commission_spirit_desc:0 "Medical safeguards strengthen trust in research."
 BLV_measurement_school_spirit:0 "Admiralty Measurement School"
 BLV_measurement_school_spirit_desc:0 "Continuing engineering training supports research."
 BLV_supply_crisis_spirit:0 "Stations Without Supplies"
 BLV_supply_crisis_spirit_desc:0 "Depleted reserves disrupt squadron operations."
 BLV_imperial_strain_spirit:0 "Imperial Cohesion Frays"
 BLV_imperial_strain_spirit_desc:0 "Unfulfilled obligations weaken the cabinet."
 BLV_oil_contract_spirit:0 "Batavian Contract Deliveries"
 BLV_oil_contract_spirit_desc:0 "Deliveries require a friendly partner controlling the oil region."
 BLV_serum_spirit:0 "Temporary Dubois Serum"
 BLV_serum_spirit_desc:0 "A brief course helps field crews but does not make the continent safe."
 BLV_prototype_spirit:0 "A Tested Long-Range Suppressor"
 BLV_prototype_spirit_desc:0 "A prototype protects a single site and requires equipment and maintenance."
 BLV_coastal_station_spirit:0 "Experimental Coastal Station"
 BLV_coastal_station_spirit_desc:0 "A small site survives through continuous supply and rotation."
 blv_campaign.1.t:0 "To Whom Does the Admiralty Answer?"
 blv_campaign.1.d:0 "Fisher wants a unified naval budget, the Court supreme control, and delegates an accountable cabinet. Back one bloc before choosing a political focus."
 blv_campaign.1.a:0 "Fisher knows the fleet"
 blv_campaign.1.b:0 "The Crown must unite departments"
 blv_campaign.1.c:0 "Spending requires representation"
 blv_campaign.2.t:0 "The Conference Demands a Settlement"
 blv_campaign.2.d:0 "The debate has dragged on. Extend talks at a cost in public confidence rather than trigger an automatic coup."
 blv_campaign.2.a:0 "Continue the talks"
 blv_campaign.4.t:0 "The Stations Demand Supplies"
 blv_campaign.4.d:0 "Depots are nearly empty. Emergency spending restores supplies; reducing commitments preserves the budget at the cost of station confidence."
 blv_campaign.4.a:0 "Pay for emergency supplies"
 blv_campaign.4.b:0 "Reduce distant commitments"
 blv_campaign.5.t:0 "An Oil Agreement with the Leviathan"
 blv_campaign.5.d:0 "Britain offers paid fuel deliveries while we control Balikpapan and remain at peace."
 blv_campaign.5.a:0 "Accept the limited agreement"
 blv_campaign.5.b:0 "Decline the proposal"
 blv_campaign.6.t:0 "A British Mission in the Philippines"
 blv_campaign.6.d:0 "The Leviathan offers reciprocal military access without subordination or automatic entry into wars."
 blv_campaign.6.a:0 "Accept the limited agreement"
 blv_campaign.6.b:0 "Decline the proposal"
 blv_campaign.7.t:0 "Britain's Navigation Note"
 blv_campaign.7.d:0 "Britain seeks merchant-shipping guarantees. Acceptance eases tensions; refusal permits British war preparations. No territory changes hands."
 blv_campaign.7.a:0 "Accept the limited agreement"
 blv_campaign.7.b:0 "Decline the proposal"
 blv_campaign.8.t:0 "An Exchange of Polar Observations"
 blv_campaign.8.d:0 "British observers offer research exchange without transferring the artifact or territory."
 blv_campaign.8.a:0 "Accept the limited agreement"
 blv_campaign.8.b:0 "Decline the proposal"
 blv_campaign.9.t:0 "A Licence for British Engineers"
 blv_campaign.9.d:0 "The Admiralty requests correspondence with Tesla's laboratory. Approval grants research cooperation, not custody of Tesla."
 blv_campaign.9.a:0 "Open research correspondence"
 blv_campaign.9.b:0 "Keep the laboratory closed"
 blv_campaign.10.t:0 "Unguja — Admiralty Eyes Only"
 blv_campaign.10.d:0 "A classified report finds unusual resistance among roughly seven percent of observed residents. Keep the intelligence out of public bulletins; outsiders know only of the quarantine."
 blv_campaign.10.a:0 "Keep the report classified"
 BLV_excavation:0 "Open the Greenland Chamber"
 BLV_excavation_desc:0 "Work for 60 days while retaining Greenland control. The artifact can be found only once."
 BLV_decode:0 "Decode the Polar Records"
 BLV_decode_desc:0 "Spend 90 days decoding while retaining artifact and Tesla access."
 BLV_prototype:0 "Test a Long-Range Suppressor"
 BLV_prototype_desc:0 "A 90-day trial requires 100 support equipment and continuing access to both sources of knowledge."
 BLV_station:0 "Equip the Coastal Station"
 BLV_station_desc:0 "Prepare a small powered coastal site over 90 days. This neither resettles nor annexes the British Isles."
 blv_campaign.11.t:0 "The Object from the Greenland Ice"
 blv_campaign.11.d:0 "The artifact is found, but does not silence the Song. It needs security and decoding. Share the data or retain a private archive; the object remains unique."
 blv_campaign.11.a:0 "Keep a private archive"
 blv_campaign.11.b:0 "Share verified data"
 BLV_support_admiralty:0 "Support Captains"
 BLV_support_admiralty_desc:0 "Raise this bloc's influence by one. Its political path requires four."
 BLV_support_crown:0 "Support the Court"
 BLV_support_crown_desc:0 "Raise this bloc's influence by one. Its political path requires four."
 BLV_support_delegates:0 "Support Delegates"
 BLV_support_delegates_desc:0 "Raise this bloc's influence by one. Its political path requires four."
 BLV_supply_purchase:0 "Buy Station Supplies"
 BLV_supply_purchase_desc:0 "Spend political power to replenish the imperial reserve."
 BLV_station_grants:0 "Pay the Distant Garrisons"
 BLV_station_grants_desc:0 "Spend 10 reserve points to gain 10 cohesion."
 BLV_license_again:0 "Renew Laboratory Talks"
 BLV_license_again_desc:0 "Repeat the request to Tesla's current host."
 BLV_oil_again:0 "Renew Batavian Talks"
 BLV_oil_again_desc:0 "Renew the limited offer; the other government may refuse."
 BLV_navigation_again:0 "Renew the Tokyo Note"
 BLV_navigation_again_desc:0 "Renew the limited offer; the other government may refuse."
 BLV_serum_purchase:0 "Purchase a Brief Serum Course"
 BLV_serum_purchase_desc:0 "Spend 8 reserve points for seven days of field support."
 BLV_field_rotation:0 "Rotate the Field Crews"
 BLV_field_rotation_desc:0 "Reduce Song exposure by 25 at a cost of 5 reserve points."
 BLV_research:0 "Admiralty Research"
 BLV_imperial_government:0 "Government of the Leviathan"
 BLV_imperial_government_desc:0 "Station reserves: [?BLV_reserve|0]/100\nImperial cohesion: [?BLV_cohesion|0]/100\n\nInfluence — Admiralty: [?BLV_admiralty|0], Crown: [?BLV_crown|0], delegates: [?BLV_delegates|0]. A political path needs 4 points.\n\nScience: [?SEN_science|0], expedition readiness: [?SEN_readiness|0], security: [?SEN_security|0], Song exposure: [?SEN_exposure|0]."
 BLV_council_tt:0 "Opens a 180-day constitutional debate; bloc influence is shown in decisions."
 BLV_arctic_tt:0 "The mandate shares its outcome with the event of 5 August 1896. Excavation opens in 1898 while Greenland is controlled."
 BLV_prototype_tt:0 "Opens a separate 90-day project; artifact and Tesla access are rechecked."
 BLV_station_tt:0 "Opens an experimental coastal-station project from 1901; the British Isles are not automatically transferred."
 BLV_tesla_patents:0 "Early Suppressor Patents"
 BLV_tesla_patents_desc:0 "Set early-patent policy after 25 October 1894. The Chamber must consent to any purchase."
 BLV_ship_suppressors:0 "Suppressors for Ships and Bases"
 BLV_ship_suppressors_desc:0 "After 20 May 1895, select a short-range ship installation or a stationary tower, distinct from a long-range suppressor."
 BLV_airship_service:0 "Admiralty Airship Service"
 BLV_airship_service_desc:0 "Implement the airship conference settlement of 20 May 1896 by preparing crews and stores for reconnaissance or strike duties."
 BLV_crowns_council:0 "A Council of Exiled Crowns"
 BLV_crowns_council_desc:0 "From 10 December 1896, settle the legal status of a political Council of Crowns without replacing cabinets or declaring war on Russia."
