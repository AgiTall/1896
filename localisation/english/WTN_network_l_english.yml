 WTN_suspend_credit:0 "Suspend New Credit Lines"
 WTN_suspend_credit_desc:0 "Stop opening new standard credits and supply offers. Existing offers backed by reserved funds remain valid until answered or expired."
 WTN_resume_credit:0 "Resume Credit Lines"
 WTN_resume_credit_desc:0 "Allow new credit offers again within the available reserve."
 WTN_world_accounts:0 "World Debt Ledger"
 WTN_world_accounts_desc:0 "Chamber reserve: §Y[?WTN_liquidity|0]/100§!\nReputation: §Y[?WTN_reputation|0]/100§!\nOutstanding principal: §Y[?WTN_principal|0]§!\nDebtor accounts: §Y[?WTN_accounts|0]§!; distressed: §R[?WTN_distressed|0]§!\nActive agreements: §Y[?WTN_partners|0]§!\nTotals refresh monthly and on account review. A credit offer reserves 10 points until answered; unaccepted offers return the reserve."
 WTN_foreign_desks:0 "Trade Delegations"
 WTN_foreign_desks_desc:0 "Our Chamber debt: §Y[?WTC_debt|0]/100§!\nFunchal credit reserve: §Y[?A04.WTN_liquidity|0]/100§!\nDeliveries, insurance and clearing require separate agreements. A proposal does not bind the other government until it responds."
 WTN_offer_credit:0 "Offer Credit: [FROM.GetName]"
 WTN_offer_credit_desc:0 "Reserve funds for transport and equipment deliveries. The recipient decides whether to accept the obligation."
 WTN_review_account:0 "[FROM.GetName] Account: [?FROM.WTC_debt|0]"
 WTN_review_account_desc:0 "Reconcile this account and update the world debt summary."
 WTN_account_report_tt:0 "[FROM.GetName] debt: §Y[?FROM.WTC_debt|0]/100§!."
 WTN_relieve_account:0 "Partial Debt Relief: [FROM.GetName]"
 WTN_relieve_account_desc:0 "Reduce debt by 12 at a cost of 8 reserve points. Further relief for this government is possible after 360 days."
 WTN_recapitalise:0 "Raise Emergency Contributions"
 WTN_recapitalise_desc:0 "Gain 20 reserve points at a cost of 3 reputation. Contributions may be raised every 180 days."
 WTN_request_credit:0 "Request a Chamber Supply Credit"
 WTN_request_credit_desc:0 "On acceptance: 15 convoys and 75 support equipment for 15 debt; additional interest accrues for six months. Funds are reserved pending a response, which must arrive within 30 days."
 WTN_request_compact:0 "Propose a Trade Services Agreement"
 WTN_request_compact_desc:0 "Propose a one-year agreement to the Chamber. Acceptance adds 5 debt; British naval services instead reduce it by 5. Services reflect our country's needs."
 WTN_terminate_compact:0 "Terminate the Chamber Agreement"
 WTN_terminate_compact_desc:0 "End the services covered by the agreement. Previously accepted debt remains, and interrupted deliveries cause discontent."
 WTN_revoke_cover:0 "Withdraw British Cover from the Chamber"
 WTN_revoke_cover_desc:0 "Withdraw naval support for credit enforcement. Without it, the Chamber cannot sustain its blacklist or impose receivership governments."
 WTN_restore_cover:0 "Restore British Naval Cover"
 WTN_restore_cover_desc:0 "Resume naval protection of Chamber routes while peace with Funchal lasts."
 WTN_open_compact_tt:0 "Unlocks a trade-services proposal in Trade Delegations. The Chamber may refuse."
 WTN_open_relations_tt:0 "Unlocks proposals for reciprocal voyage services with eligible partners. The other government may refuse."
 WTN_credit_committee_tt:0 "Unlocks targeted credit offers in the World Debt Ledger."
 WTN_arbitration_tt:0 "Unlocks targeted debt relief funded from the Chamber's reserve."
 wtn_network.1.t:0 "An Offer from Funchal"
 wtn_network.1.d:0 "The Chamber's agent offers to fund transport charters and equipment deliveries. In return, our treasury must recognise a new obligation, serviced through our accounts in Funchal. Our cabinet has yet to sign."
 wtn_network.1.a:0 "Sign the delivery terms"
 wtn_network.1.b:0 "Decline the new obligation"
 wtn_network.3.t:0 "A Trade Delegation from [FROM.GetName]"
 wtn_network.3.d:0 "The delegation proposes coordinating voyage services and settlements with the Chamber. Its delegates insist that their cabinet remains independent and that the agreement covers only the specified trade services."
 wtn_network.3.a:0 "Agree terms with the delegates"
 wtn_network.3.b:0 "Decline to conclude an agreement"
 wtn_network.4.t:0 "The Chamber Confirms the Agreement"
 wtn_network.4.d:0 "Signed statements have arrived from Funchal. Chamber delegates have agreed voyage services and settlement procedures; our harbour services have received the arrangements for the coming season."
 wtn_network.5.t:0 "Talks End without an Agreement"
 wtn_network.5.d:0 "Our envoys have closed their correspondence with Funchal without confirmed terms. The cabinet must rely on its own maritime services and reassess the agents' proposals."
 wtn_network.ack:0 "Acknowledge the report"
