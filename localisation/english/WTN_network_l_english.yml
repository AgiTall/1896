 WTN_guard_settlement_charter:0 "Order of Secured Obligations"
 WTN_guard_settlement_charter_desc:0 "Creditors will retain their claims to collateral, with disputes settled under a common charter."
 WTN_tech_charter:0 "Technocrats' Mandate"
 WTN_tech_charter_desc:0 "Engineers propose investing in communications and measurement before new discoveries leave the Chamber behind."
 WTN_cable_survey:0 "Survey the Cable Network"
