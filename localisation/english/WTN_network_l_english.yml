 WTN_PAZ_own_resources:0 "Levies of the Subject Communities"
 WTN_PAZ_own_resources_desc:0 "Local levies will reduce obligations to overseas creditors at the cost of postponed orders."
 WTN_PAZ_chamber_channel:0 "Envoys to the Insurance Houses"
 WTN_PAZ_chamber_channel_desc:0 "Delegates will discuss a limited voyage-services agreement with Funchal."
 WTN_PAZ_local_service:0 "Eastern Cuban Coastal Workshops"
 WTN_PAZ_local_service_desc:0 "Workshops will repair equipment and store provisions for the settlements."
 WTN_PAZ_programme_1:0 "Talks beyond the Caribbean"
 WTN_PAZ_programme_1_desc:0 "Trade delegates will discuss supplies with outside powers separately from military demands."
 WTN_PAZ_programme_2:0 "Common Supply Records"
 WTN_PAZ_programme_2_desc:0 "Staffs and coastal headmen will reconcile records of delivered cargo."
 WTN_PAZ_programme_3:0 "Reliable Island Services"
