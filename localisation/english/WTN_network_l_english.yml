 WTN_AUS_programme_2:0 "Recognise Trading Documents"
 WTN_AUS_programme_2_desc:0 "We will agree on manifests so cargo is not delayed at every neighbouring wharf."
 WTN_AUS_programme_3:0 "Repair Local Transport"
 WTN_AUS_programme_3_desc:0 "Workshops will maintain the equipment linking the harbour to the colony's settlements."
 WTN_AUS_programme_4:0 "Conference of Equal Cabinets"
 WTN_AUS_programme_4_desc:0 "Common trading rules can be discussed without transferring authority over the colonies to a single government."
 WTN_SUL_council:0 "Council of Court and Harbour"
 WTN_SUL_council_desc:0 "The court will hear the merchants and communities whose ships connect the sultanate with neighbouring islands."
 WTN_SUL_accounts:0 "Register of Harbour Obligations"
 WTN_SUL_accounts_desc:0 "We will inspect agents' claims before they become grounds for fresh demands upon the court."
 WTN_SUL_own_resources:0 "Dues under Court Supervision"
 WTN_SUL_own_resources_desc:0 "Local dues will settle older accounts while their records remain in the court's hands."
 WTN_SUL_chamber_channel:0 "An Agent in Funchal"
 WTN_SUL_chamber_channel_desc:0 "The sultanate's representative will discuss insurance and settlement with the Chamber on the court's own behalf."
 WTN_SUL_local_service:0 "Keepers of Coastal Stores"
 WTN_SUL_local_service_desc:0 "Communities will prepare stores against interruptions to sea traffic."
 WTN_SUL_programme_1:0 "Talks with Neighbouring Powers"
 WTN_SUL_programme_1_desc:0 "Envoys will discuss trade with Batavia, Tokyo and the Philippines without promising to surrender the sultan's authority."
 WTN_SUL_programme_2:0 "Local Repair Arrangements"
 WTN_SUL_programme_2_desc:0 "Craftsmen will share the work of maintaining wharves and merchant ships."
 WTN_SUL_programme_3:0 "Treaties in the Sultanate's Name"
 WTN_SUL_programme_3_desc:0 "The court will retain its own signature on trade obligations and the right to answer outside proposals."
 WTN_MLT_council:0 "Council of the Maltese Court"
 WTN_MLT_council_desc:0 "The Russian court in Malta must agree its expenditure with the communities and British naval authorities."
 WTN_MLT_accounts:0 "Laboratory Supply Statements"
