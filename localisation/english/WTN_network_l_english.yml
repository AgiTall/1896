 WTN_PCF_accounts:0 "Plantation House Obligations"
 WTN_PCF_accounts_desc:0 "We will separate genuine trading accounts from promises issued by wartime agents."
 WTN_PCF_own_resources:0 "Settle Accounts from the Harvest"
 WTN_PCF_own_resources_desc:0 "Estate revenues will settle obligations instead of funding expensive new orders."
