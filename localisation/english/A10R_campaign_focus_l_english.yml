l_english:
 A10R_provincial_rolls:0 "Credentials of the Island Councils"
 A10R_provincial_rolls_desc:0 "A seal alone does not confer a mandate. Verifying credentials will root the assembly in the towns and villages."
 A10R_emergency_council:0 "Treasury of the Exiled Government"
 A10R_emergency_council_desc:0 "Shipping receipts and emigrant donations must enter a single ledger. Even a government under siege must pay its clerks."
 A10R_common_treasury:0 "Contributions Instead of Exactions"
 A10R_common_treasury_desc:0 "Agreed contributions must replace arbitrary requisitions. Each republic shall account to the other islands for its promises."
 A10R_republican_court:0 "Court of Inter-Island Arbitration"
 A10R_republican_court_desc:0 "A customs dispute or detained steamer must cease to be a cause for armed confrontation. The common court shall bind even the powerful families."
 A10R_language_charters:0 "Languages of the Common House"
 A10R_language_charters_desc:0 "Petitions in Tagalog, Cebuano and the other island languages shall have equal standing. Interpreters can unite delegates better than prohibitions."
 A10R_tenant_guarantees:0 "A Covenant with the Tenants"
 A10R_tenant_guarantees_desc:0 "The village detachments fight for more than flags. Limits on debt seizures and written leases shall give their families reason to trust the republics."
 A10R_civilian_inspectors:0 "Civilian Commissioners to the Staff"
 A10R_civilian_inspectors_desc:0 "The joint staff answers to congress. Commissioners shall inspect supply rolls and village complaints without assuming command of regiments."
 A10R_assembly_of_islands:0 "Assembly of All the Islands"
 A10R_assembly_of_islands_desc:0 "The provisional compact has survived its first trials. Delegates now dispute whether a treaty of republics is enough or the people require federal law."
 A10R_republics_forever:0 "Union of Equal Republics"
 A10R_republics_forever_desc:0 "The republics shall retain sovereign assemblies, common defence and a voice in the union budget. Trust between islands shall sustain the state."
 A10R_rotating_presidency:0 "A Rotating Presidency"
 A10R_rotating_presidency_desc:0 "No island shall hold the union presidency forever. Rotation shall give the smaller republics an effective voice."
 A10R_customs_union:0 "A Single Customs Frontier"
 A10R_customs_union_desc:0 "Internal duties shall disappear between union ports. External customs revenues shall be divided through a ledger open to every republic."
 A10R_republican_compact_end:0 "Sun over the Nine Republics"
 A10R_republican_compact_end_desc:0 "A common oath need not impose identical laws on every island. The union gains enduring institutions while preserving its many local voices."
 A10R_federal_convention:0 "The Federal Convention"
 A10R_federal_convention_desc:0 "Federalists propose common citizenship and responsible government. No republic shall enter the new order without its own consent."
 A10R_bill_of_rights:0 "An Entrenched Bill of Island Rights"
 A10R_bill_of_rights_desc:0 "Local languages, elected councils and freedom of worship must be protected against future majorities. Only then can the federal project earn trust."
 A10R_federal_parliament:0 "The First Federal Parliament"
 A10R_federal_parliament_desc:0 "A population chamber and an island chamber shall begin their work. The cabinet will answer to elected representatives and the army to the law."
 A10R_civilian_commonwealth:0 "A Civil Commonwealth of Islands"
 A10R_civilian_commonwealth_desc:0 "Universities, provincial councils and parliament shall sustain the common state. Authority born in war learns to live by the trust of its citizens."
 A10R_luzon_relief:0 "The Luzon Relief Committee"
 A10R_luzon_relief_desc:0 "Boatmen, couriers and refugee families know the coast better than any staff. Their committee shall connect local detachments with republican depots."
 A10R_war_accounts:0 "Accounts of the War"
 A10R_war_accounts_desc:0 "Burned warehouses, bereaved families and unpaid receipts remain after the guns fall silent. Reconstruction shall begin with an open accounting of the losses."
 A10R_veterans_land:0 "Land and Pensions for Veterans"
 A10R_veterans_land_desc:0 "Returning soldiers need shelter, work and care for their wounds. Land commissions shall examine their claims without expelling farming families."
 A10R_peace_generation:0 "A Generation of Peace"
 A10R_peace_generation_desc:0 "Children raised among garrisons and refugees must learn another life. The islands shall turn to schools, trade and the reunion of divided families."
 A10D_island_census:0 "The Island Household Census"
 A10D_island_census_desc:0 "Customs collectors can count bales, but not hungry households. A census of boats, wells and cultivated land will show which provinces can actually feed their neighbours."
 A10D_municipal_roads:0 "Municipal Roads"
 A10D_municipal_roads_desc:0 "The road from a field to its landing stage matters more than promises of a grand railway. Communities will receive tools and wages for paving, bridges and drainage ditches."
 A10D_mail_ferries:0 "The Mail Ferries"
 A10D_mail_ferries_desc:0 "Sailing vessels connect the islands on incompatible timetables. Agreements with their captains will unite mail, visiting doctors and grain deliveries in one service."
 A10D_abaca_cooperatives:0 "Abaca Cooperatives"
 A10D_abaca_cooperatives_desc:0 "The world's ships need Manila hemp rope. Shared warehouses and a standard bale weight will let small growers bargain with merchants without ruinous advances."
 A10D_sugar_inspectors:0 "Scales on the Sugar Quays"
 A10D_sugar_inspectors_desc:0 "Provincial inspectors will verify sugar weights and grades, while contracts preserve land for rice. Export earnings must not leave families hungry during the storm season."
 A10D_timber_and_slipways:0 "Sawmills on the Straits"
 A10D_timber_and_slipways_desc:0 "Seasoning sheds, sawmills and managed cutting will supply boatbuilders and carpenters. Cebu will receive the contracts if it remains within our association; otherwise accessible member workshops will take them."
 A10D_provincial_workshops:0 "Provincial Workshops"
 A10D_provincial_workshops_desc:0 "The provinces need not surrender their lathes to the capital. Shared drawings and purchases of drive belts will link small workshops through mutual orders."
 A10D_rice_granaries:0 "Communal Rice Granaries"
 A10D_rice_granaries_desc:0 "Every community will reserve part of its harvest in a dry public granary. Elected custodians will keep the accounts so that a typhoon cannot turn a steamer shortage into famine."
 A10D_district_clinics:0 "District Clinics"
 A10D_district_clinics_desc:0 "Boiled water, clean dressings and a trained midwife save more lives than magnificent hospitals in the capital. District clinics will also train orderlies for the island garrisons."
 A10D_normal_schools:0 "Teacher Training Colleges"
 A10D_normal_schools_desc:0 "A teacher must explain arithmetic, a pump and an official letter in the language of the community. New colleges will prepare such teachers for coastal towns and upland villages."
 A10D_cable_cooperatives:0 "Cable Cooperatives"
 A10D_cable_cooperatives_desc:0 "A local telegraph cannot replace the Chamber's ocean cables, but it can carry storm warnings and market prices without a week's delay. Fishing cooperatives will provide shore crews, and workshops the wire and insulators."
 A10D_sanitary_commission:0 "The Islands Sanitary Commission"
 A10D_sanitary_commission_desc:0 "Quarantine should stop fever rather than commerce. Doctors will agree on port regulations, establish clean water intakes and teach ferry crews to recognise the first signs of disease."
 A10D_island_polytechnic:0 "The Island Polytechnic"
 A10D_island_polytechnic_desc:0 "Engine drivers, surveyors and chemists need a college of their own. The polytechnic will bring provincial teachers and refugees from the old continents together around the practical problems of island life."
 A10D_national_market:0 "The Market of a Thousand Quays"
 A10D_national_market_desc:0 "Ferry timetables, honest scales, trade schools and healthy ports are finally becoming one economy. Each island will keep its character while its goods find a reliable passage to its neighbours."
 A10D_rifle_inspections:0 "The Regimental Rifle Inspection"
 A10D_rifle_inspections_desc:0 "On neighbouring islands the same word for cartridge can mean different calibres. Gunsmiths will catalogue each system, condemn unsafe barrels and return serviceable rifles to the ranks."
 A10D_coastal_boatyards:0 "Coastal Boatyards"
 A10D_coastal_boatyards_desc:0 "A small country needs repair slips before ocean-going battleships. Boatbuilders and boiler makers will begin with simple cargo vessels and the maintenance of coastal steamers."
 A10D_common_calibres:0 "One Calibre for the Supply Columns"
 A10D_common_calibres_desc:0 "We need not rearm every soldier at once. Separate stores by rifle system, standardise the ammunition boxes and stop sending units cartridges they cannot fire."
 A10D_chart_the_straits:0 "Sound the Straits"
 A10D_chart_the_straits_desc:0 "Fishermen know reefs missing from the admirals' charts. Hydrographers will record that knowledge, establish signal lights and organise pilots for passages in darkness and storms."
 A10D_field_batteries:0 "Field Batteries"
 A10D_field_batteries_desc:0 "Infantry needs light field guns and a few old howitzers that can be broken down for pack transport. Their crews will learn to choose jungle positions and conserve imported shells."
 A10D_harbour_defences:0 "Harbour Batteries"
 A10D_harbour_defences_desc:0 "An old naval gun on a shore mounting can still threaten a landing barge. Sheltered magazines and observation posts will help defend the harbours without an unaffordable race against Japanese battleships."
 A10D_sappers_and_pack_trains:0 "Sappers and Pack Trains"
 A10D_sappers_and_pack_trains_desc:0 "Mules, rafts and portable footbridges can carry ammunition where wagons fail. Sappers will prepare trails before the supply columns arrive, rather than after the first losses to hunger."
 A10D_merchant_reserve:0 "The Merchant Shipping Reserve"
 A10D_merchant_reserve_desc:0 "Shipowners will know the charter terms in advance, and the army the capacity of every vessel. Reserve crews will keep mobilisation from bringing the rice trade to an immediate halt."
 A10D_staff_college:0 "The Islands Staff College"
 A10D_staff_college_desc:0 "A staff must calculate the tide as confidently as a battalion's strength. The college will put field officers, pilots and quartermasters around the same map table."
 A10D_gunboat_school:0 "The Gunboat Crews School"
 A10D_gunboat_school_desc:0 "Future commanders will serve in gunboats, torpedo craft and armed steamers. They will begin with boiler practice, gunnery targets and the escort of slow transports."
 A10D_ammunition_toolrooms:0 "Arsenal Toolrooms"
 A10D_ammunition_toolrooms_desc:0 "New toolrooms will make cartridge cases, springs and spare parts to shared tolerances. The order is modest, but it can be filled all year without waiting for another insured convoy."
 A10D_patrol_flotillas:0 "Patrol Flotillas"
 A10D_patrol_flotillas_desc:0 "Small patrols will cover the ferry approaches and warn the garrisons. Their task is to preserve shipping and withdraw from superior forces while the harbour batteries prepare for action."
 A10W_oath:0 "Oath to the Chamber"
 A10W_oath_desc:0 "The island council offers fidelity to the Chamber’s contracts in return for credit, insurance and recognition. The oath does not surrender sovereignty: every concession requires a separate seal. Madeira’s reply will set the price of association, while silence will force us to open our own treasury."
 A10W_creditors_register:0 "Reconcile the Debt Books"
 A10W_creditors_register_desc:0 "Manila’s bills, Cebu’s receipts and provincial treasury obligations rarely agree on a single total. A common register will separate legitimate debt from duplicate claims. The Chamber will receive transparent accounts, and the islands will gain grounds to challenge its agents."
 A10W_bonded_warehouses:0 "Warehouses under Two Seals"
 A10W_bonded_warehouses_desc:0 "No shipment of abaca should disappear between quay and customs house. A local collector and an insurer’s agent will seal the warehouses together, and a share of the fees will support harbour works. Merchants gain reliable trade at the cost of dearer storage."
 A10W_silver_convoy:0 "The Silver Convoy Policy"
 A10W_silver_convoy_desc:0 "The old guard’s signature opens the insurance book without turning merchantmen into ironclads. We will pay for a limited policy and prepare a local reserve should the application fail. Losses must still be counted beneath the costliest flag."
 A10W_cable_priority:0 "Cable and Harbour Watch"
 A10W_cable_priority_desc:0 "A cable to Madeira is useless if an enemy captures the telegraph station first. The cable agreement will be paired with quay patrols, signal posts and drills for island companies. The Chamber sells access to information; our own people must defend the shore."
 A10W_harbour_survey:0 "Survey the Quays and Lights"
 A10W_harbour_survey_desc:0 "The agents demand a map of revenues, while shipowners require a map of shoals. One survey will produce both by inspecting channels, lights and warehouses. New works are paid through bills: every quay must earn more than its upkeep."
 A10W_local_shareholding:0 "Shares for Island Houses"
 A10W_local_shareholding_desc:0 "If every dividend sails to Madeira, the oath will remain a foreign bargain. We will reserve shares for island trading houses, dockers’ cooperatives and provincial treasuries. Their delegates may examine the accounts, though large holders already dispute the voting rules."
 A10W_charter_congress:0 "Congress beneath Two Seals"
 A10W_charter_congress_desc:0 "The congress has two drafts before it: an island colonial charter under Chamber protection, and a sovereign metropole of its eastern network. Neither removes disputes over labour, taxation and representation. Before choosing the keeper of the ledger, we must decide who may read it."
 A10W_colonial_charter:0 "Draft a Colonial Charter"
 A10W_colonial_charter_desc:0 "The protection party will entrust foreign agreements to the Chamber while retaining island courts and a local constabulary. Until both sides ratify a convention, the document remains an internal charter. Even the most detailed charter grants Madeira no authority without its consent."
 A10W_resident_council:0 "The Resident’s Council"
 A10W_resident_council_desc:0 "The resident must know the islands through appointed local delegates as well as exporters’ accounts. Provinces will receive seats on the council, while the treasury seal remains central. Such authority works faster than congress and attracts suspicion from those losing their final say."
 A10W_revenue_covenant:0 "Apportion the Port Dues"
 A10W_revenue_covenant_desc:0 "We will establish how much of each due supports quays, the island treasury and creditors. Published shares can reduce old obligations without transferring land. Assigning revenues lightens debt today and constrains construction in the coming months."
 A10W_charter_constabulary:0 "The Island Charter Constabulary"
 A10W_charter_constabulary_desc:0 "The Chamber will not send an army for every customs dispute. Island companies with regular pay will guard warehouses, bridges and telegraphs. The constabulary will answer to local officers, and its upkeep will appear in the charter budget."
 A10W_export_estates:0 "Abaca, Sugar and Leaseholds"
 A10W_export_estates_desc:0 "Export houses offer road funding in return for long leases. Local courts will verify boundaries and record the rates in a common register. Revenues will expand the economy, though cultivators fear foreign bills may prove stronger than their rights."
 A10W_debt_conversion:0 "Convert the Debt into Long Bonds"
 A10W_debt_conversion_desc:0 "Short notes threaten a treasury crisis whenever a ship departs. We will replace them with long bonds secured against agreed dues and public accounts. The external balance will fall, while future budgets continue paying for the present respite."
 A10W_colony:0 "Ratify the Island Colony"
 A10W_colony_desc:0 "We will send Madeira the final convention: the Chamber receives paramount protection, while the islands retain local administration and armed guards. Acceptance will turn the charter into actual dependency. Refusal leaves our cabinet in office and allows a renewed negotiation after an interval."
 A10W_port_welfare:0 "Hospitals beside the Quays"
 A10W_port_welfare_desc:0 "Regular funding for water, hospitals and dockers’ families costs more than occasional charity. An epidemic or accident need no longer close the harbour each time. The charter council will meet these obligations regardless of the Chamber’s response."
 A10W_metropolitan_charter:0 "Draft a New Metropole"
 A10W_metropolitan_charter_desc:0 "Why must the books cross the world when the principal traffic passes our shores? Island houses propose their own directorate and an eastern clearing centre. Madeira will receive an invitation to become an autonomous Atlantic office, never an order to surrender its land."
 A10W_island_registries:0 "Island Commercial Registers"
 A10W_island_registries_desc:0 "A new metropole begins with recognized signatures, standard measures and reliable custody of contracts. Clerks will bring the port books under common rules. No office acquires authority over another shore merely by entering it in an atlas."
 A10W_merchant_assembly:0 "Assembly of Merchant Houses"
 A10W_merchant_assembly_desc:0 "Island houses will fund a common secretariat if decisions do not remain confined to a handful of families. Seats will be apportioned among ports, with hearings for major contracts. The assembly will raise funds more readily, though dividend disputes remain part of its life."
 A10W_duplicate_cables:0 "Copies over Two Cables"
 A10W_duplicate_cables_desc:0 "A severed line must not deprive the islands of every quotation and order. Signal schools will staff reserve stations, while important books are stored in several ports. Technocrats will receive equipment orders rather than the right to suppress information."
 A10W_secretariat_rules:0 "Bind the Secret Secretariat"
 A10W_secretariat_rules_desc:0 "Commerce needs confidential correspondence, but the secret department readily turns secrecy into a separate power. Emergency instructions will require two signatures, with private audits of expenditure. Some agents will depart, but the island council will know the cost of its own secrets."
 A10W_escrow_exchange:0 "Exchange of Secured Obligations"
 A10W_escrow_exchange_desc:0 "Our notes must rest on real warehouses and verified revenues. The exchange will establish escrow accounts, published tariffs and a court for commercial disputes. Returns may be more modest than grand promises, but fewer houses will collapse when a single schooner disappears."
 A10W_new_metropole:0 "The Manila Convention"
 A10W_new_metropole_desc:0 "We will invite Madeira to place the principal clearing centre in the islands while retaining broad autonomy as the Atlantic office. This change requires its voluntary signature. Until Manila is recovered, the directorate will sit at a provisional island exchange; Madeira’s refusal will not close its doors."
 A10W_oceanic_covenant:0 "Covenant of Two Oceans"
 A10W_oceanic_covenant_desc:0 "A common covenant will connect insurance reserves, signal schools and convoy protection. Each office bears its own losses and hires guards by contract; the island army remains under island command. The new network can grow through agreed bargains, with every guarantee’s cost recorded in its books."
