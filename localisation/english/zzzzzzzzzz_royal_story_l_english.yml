l_english:
 A01_sultans_at_the_palace:0 "The Sultans at the Palace"
 A01_sultans_at_the_palace_desc:0 "The sultans will recognise a crown, not another governor with a new title. Their delegates demand answers about taxes, judges and garrisons."
 A01_indonesian_petition:0 "The Indonesian Petition"
 A01_indonesian_petition_desc:0 "Teachers, dockworkers and veterans demand seats alongside the princes. A settlement with hereditary courts alone cannot sustain the state."
 A01_equal_subjects:0 "Subjects Become Citizens"
 A01_equal_subjects_desc:0 "Abolish separate civil categories and open public service to Indonesians. Interpreter schools and opposition from colonial property owners make equality costly."
 A01_princely_guarantees:0 "Guarantees to the Princely Courts"
 A01_princely_guarantees_desc:0 "Local law and succession remain with the sultans, while a common court protects residents against arbitrary taxation. Princes gain influence without a veto over civic representation."
 A01_island_compact:0 "Crown and Archipelago Compact"
 A01_island_compact_desc:0 "Choose autonomous sultanates or a unified administration under local charters. The treaty covers only land we hold and does not cancel Japanese ownership or concessions."
 A01_royal_commission:0 "Royal Commission on the Defeat"
 A01_royal_commission_desc:0 "Who left the depots undefended, and why did admirals’ relatives receive contracts? A public inquiry can build a case before the Council destroys its archives."
 A01_win_the_captains:0 "Win Over the Captains"
 A01_win_the_captains_desc:0 "Guarantee pay, pensions and merit promotion to officers who accept civilian control. The fleet must choose between its profession and the Council."
 A01_admirals_on_trial:0 "Admirals before the Court"
 A01_admirals_on_trial_desc:0 "Secure individual convictions through civilian courts. Preserve the fleet, but first gather three dossiers and two points of captain loyalty through decisions."
 A01_purge_the_admiralty:0 "The Night of Sealed Admiralties"
 A01_purge_the_admiralty_desc:0 "The Guard will seize the ministry and arrest the Council. Two loyal captain groups can hold the harbours, but mass dismissals will disrupt the fleet for a year."
 A01_admirals_retirement:0 "Pensions instead of a Political Veto"
 A01_admirals_retirement_desc:0 "Trade pensions and immunity for dissolution. Retiring admirals retain procurement connections that a later civilian government must reform."
 A01_civilian_admiralty:0 "A Navy Ministry instead of the Council"
 A01_civilian_admiralty_desc:0 "The minister answers to civilian government for budgets; the naval staff plans operations. Replace personal authority with accountable institutions."
 A01_guard_academy:0 "Royal Guard Academy"
 A01_guard_academy_desc:0 "Train Dutch and Indonesian officers together and turn palace guards into a professional corps sworn to the state and Crown."
 A01_royal_academies:0 "Royal Institutes of the Archipelago"
 A01_royal_academies_desc:0 "Found an engineering institute, civil service school and translation bureau with places for island residents."
 A01_capital_of_two_worlds:0 "Capital of Two Worlds"
 A01_capital_of_two_worlds_desc:0 "Build a government district and propose New Amsterdam as the capital’s name. The city council may retain Batavia or choose a dual name."
 A01_electoral_act:0 "Archipelago Electoral Act"
 A01_electoral_act_desc:0 "Choose territorial compromise with the princes or equal civic representation. Under either system parliament will approve the prime minister."
 A01_first_royal_election:0 "The First Election under the Crown"
 A01_first_royal_election_desc:0 "A 90-day campaign pits the Constitutional Union, Order Party and Indonesian Coalition against one another. Court guarantees and civic rights affect the vote; campaign through decisions."
 A01_responsible_cabinet:0 "A Prime Minister Answerable to Parliament"
 A01_responsible_cabinet_desc:0 "The Queen appoints parliament’s chosen premier. Ministers become accountable for budgets and the opposition gains questioning rights. The winning party determines the cabinet programme."
 A01_reform_procurement:0 "Break the Admirals’ Contracts"
 A01_reform_procurement_desc:0 "Open tenders replace family contracts. Pensions will be honoured, but the former Council loses its hold over procurement."
 A01_island_officer_commissions:0 "Officer Commissions for Islanders"
 A01_island_officer_commissions_desc:0 "Open senior commissions to Indonesians and coordinate KNIL training with the sultanates without dissolving their armies."
 A01_royal_development_bank:0 "Royal Development Bank"
 A01_royal_development_bank_desc:0 "Joint loans fund roads and schools in Crown lands and autonomous sultanates, excluding Japanese possessions."
 A01_crown_provincial_diets:0 "Provincial Diets under the Crown"
 A01_crown_provincial_diets_desc:0 "Even decrees require feedback. Establish island assemblies with elected civic delegates who can challenge officials, although they cannot appoint the cabinet."
 A01_renew_the_fleet:0 "The Fleet after the Political Storm"
 A01_renew_the_fleet_desc:0 "Restore professional examinations, train staff officers and fill vacancies. Rehabilitate innocent officers without restoring the Council’s political privileges."
 A01_open_seas_kingdom:0 "Kingdom of Open Seas"
 A01_open_seas_kingdom_desc:0 "Choose a trading commonwealth rather than permanent revanche. Guarantee markets and naval protection to autonomous partners and invest in civilian growth."
 A01_homeland_in_exile:0 "The Netherlands Endure in Exile"
 A01_homeland_in_exile_desc:0 "Support refugees, preserve the lost homeland’s institutions and prepare a fleet for return. Liberation will require strength and opportunity."
 A01_archipelago_great_power:0 "A Great Power of the Archipelago"
 A01_archipelago_great_power_desc:0 "Recognise that the nation’s future lies in the islands. Shared defence and equal access to command support a Pacific power at the cost of a heavier military budget."
 A01_admiralty_obstruction:0 "Admiralty Obstruction"
 A01_admiralty_obstruction_desc:0 "Procurement stalls and captains receive conflicting orders. Resolve the struggle through trial, purge or agreement."
 A01_purged_fleet:0 "The Purged Fleet"
 A01_purged_fleet_desc:0 "Dismissals leave staff vacancies. Recovery takes a year or the fleet renewal focus."
 A01_admiralty_pensions:0 "The Price of Admiralty Retirement"
 A01_admiralty_pensions_desc:0 "Retired admirals receive pensions and retain procurement connections until parliamentary reform."
 A01_civilian_justice:0 "Civilian Justice"
 A01_civilian_justice_desc:0 "Courts established individual responsibility without mass dismissals."
 A01_civilian_navy_ministry:0 "Royal Navy Ministry"
 A01_civilian_navy_ministry_desc:0 "Operational command is separated from civilian budgeting. The admirals no longer hold a political veto."
 A01_equal_citizenship_royal:0 "Common Citizenship"
 A01_equal_citizenship_royal_desc:0 "Dutch and Indonesian citizens share access to public service and military commissions."
 A01_princely_compact:0 "Compact with the Princely Courts"
 A01_princely_compact_desc:0 "The Crown guarantees local law and succession; the courts recognise common justice."
 A01_island_discontent:0 "The Islands Await an Answer"
 A01_island_discontent_desc:0 "The petition was postponed. Common citizenship or representation can settle the grievance."
 A01_guard_academy_idea:0 "Royal Guard School"
 A01_guard_academy_idea_desc:0 "A joint officer school trains Dutch and Indonesian cadets."
 A01_royal_academies_idea:0 "Royal Institutes"
 A01_royal_academies_idea_desc:0 "Engineers, translators and civil servants train in the archipelago."
 A01_island_commissions:0 "Joint Officer Corps"
 A01_island_commissions_desc:0 "Training, rather than ancestry, determines access to command."
 A01_development_bank:0 "Archipelago Development Bank"
 A01_development_bank_desc:0 "Shared credit funds roads, schools and local enterprises."
 A01_responsible_cabinet_idea:0 "Responsible Cabinet"
 A01_responsible_cabinet_idea_desc:0 "The Queen appoints the parliamentary majority’s premier. Deputies approve the budget."
 A01_open_procurement:0 "Open Public Procurement"
 A01_open_procurement_desc:0 "Public oversight curbs family procurement contracts."
 A01_provincial_diets:0 "Provincial Diets"
 A01_provincial_diets_desc:0 "Civic delegates scrutinise officials while the Crown retains its cabinet."
 A01_open_seas_idea:0 "Crown of the Trading Seas"
 A01_open_seas_idea_desc:0 "Trade, civilian construction and negotiated partnership define the kingdom."
 A01_exile_mission:0 "Mission of the Exiled Kingdom"
 A01_exile_mission_desc:0 "Refugees preserve the lost homeland’s institutions while shipyards prepare the fleet of return."
 A01_archipelago_power:0 "Pacific Crown"
 A01_archipelago_power_desc:0 "Shared island defence is the state’s principal mission."
 A01_pm_constitutional:0 "Matthijs van Rijn — Constitutional Union"
 A01_pm_constitutional_desc:0 "A cabinet of trading cities and lawyers: transparent budgets, engineering schools and public service."
 A01_pm_order:0 "Hendrik van der Velde — Order Party"
 A01_pm_order_desc:0 "Moderate monarchists and princely delegates favour local guarantees and maritime security."
 A01_pm_indonesian:0 "Raden Surya — Indonesian Coalition"
 A01_pm_indonesian_desc:0 "Island civic delegates prioritise schools, equal appointments and inland development."
 A01_royal_story.1.t:0 "Four Courts and One Crown"
 A01_royal_story.1.d:0 "The envoys demand local taxation and secure succession. Ministers propose a shared defence budget. Emma insists that the compact protect taxpayers as well as palaces. Broad self-government and a customs-first agreement offer different starting points."
 A01_royal_story.1.a:0 "Guarantee local self-government."
 A01_royal_story.1.b:0 "Start with a common budget and customs."
 A01_royal_story.2.t:0 "Who Represents Indonesia?"
 A01_royal_story.2.d:0 "A teacher reads the petition in Malay, then Dutch. Its signatories ask for courts, schools and officer commissions. Princely envoys fear a civic chamber will displace them. The Crown must recognise both claims or postpone an answer."
 A01_royal_story.2.a:0 "Give civic delegates seats."
 A01_royal_story.2.b:0 "Reach an agreement with the courts first."
 A01_royal_story.3.t:0 "Signatures on the Island Compact"
 A01_royal_story.3.d:0 "One annex establishes autonomous sultanates with local administrations and common defence. The other preserves a unified state with local law, civic representation and tax guarantees. Only Crown-owned land can be transferred; Japanese rights on Borneo remain."
 A01_royal_story.3.a:0 "Autonomous sultanates under one Crown."
 A01_royal_story.3.b:0 "One state with guaranteed charters."
 A01_royal_story.4.t:0 "The Archive Ordered Burned"
 A01_royal_story.4.d:0 "A clerk brings contract copies and an order to burn the originals. The admirals call them forgeries. Public hearings convince civic delegates; a confidential inquiry protects witnesses. Further evidence is needed either way."
 A01_royal_story.4.a:0 "Open the hearings."
 A01_royal_story.4.b:0 "Protect the witnesses first."
 A01_royal_story.5.t:0 "A Verdict Must Not Become Revenge"
 A01_royal_story.5.d:0 "The court finds Council leaders responsible for concealing contracts and interfering in civilian government. Captains await the fate of junior officers. Limited sentences preserve experience; wider investigations strengthen the Crown but disrupt the staff."
 A01_royal_story.5.a:0 "Punish proven offences only."
 A01_royal_story.5.b:0 "Investigate the entire senior staff."
 A01_royal_story.6.t:0 "The Morning without the Council"
 A01_royal_story.6.d:0 "The Guard seals the admiralty offices. Council leaders lose their political offices, but dozens of captains also face suspicion. Some demand trials, others endless loyalty checks. The fleet already lacks staff officers."
 A01_royal_story.6.a:0 "Confine the purge to conspiracy leaders."
 A01_royal_story.6.b:0 "Continue the loyalty investigation."
 A01_royal_story.7.t:0 "Whose Victory Is This?"
 A01_royal_story.7.d:0 "The admirals’ political veto is gone, but guards, civic delegates and princely courts disagree about the new order. The Queen may divide powers or rely on personal allegiance. This determines access to constitutional or absolute rule."
 A01_royal_story.7.a:0 "A victory for law: prepare a constitution."
 A01_royal_story.7.b:0 "A victory for the Crown: ministers serve the Queen."
 A01_royal_story.8.t:0 "What Is the Capital Called?"
 A01_royal_story.8.d:0 "The government quarter opens. Courtiers propose New Amsterdam in memory of the lost homeland. City councillors speak for traders and neighbourhoods that call Batavia home. The Crown may rename the city, keep its name or recognise both."
 A01_royal_story.8.a:0 "New Amsterdam, capital of the Crown."
 A01_royal_story.8.b:0 "Batavia, the name of our shared city."
 A01_royal_story.8.c:0 "New Amsterdam–Batavia."
 A01_NEW_AMSTERDAM:0 "New Amsterdam"
 A01_DUAL_CAPITAL:0 "New Amsterdam–Batavia"
 A01_royal_story.9.t:0 "The Islands Count Their Votes"
 A01_royal_story.9.d:0 "Princely delegates demand territorial guarantees for small islands. Civic delegates demand equal votes. The Constitutional Union offers compromise. The electoral law changes initial party support; campaigning can still alter the result."
 A01_royal_story.9.a:0 "Territorial guarantees and a civic chamber."
 A01_royal_story.9.b:0 "Equal civic representation."
 A01_royal_story.10.t:0 "A Campaign without the Admirals’ Veto"
 A01_royal_story.10.d:0 "Three blocs publish their programmes: transparent budgets, princely guarantees and naval strength, or schools and equal appointments. Voting is in 90 days. Campaign decisions support each bloc once every 30 days."
 A01_royal_story.10.a:0 "Let the electorate decide."
 A01_royal_story.11.t:0 "The Queen Receives the Prime Minister"
 A01_royal_story.11.d:0 "The prime minister is §Y[Root.GetA01RoyalPremier]§!. The speaker delivers the results. The winning bloc forms the cabinet, whose programme appears as a separate national spirit. The Queen confirms its appointment under the constitution. The next campaign begins in two years. Pre-agreed ties favour the Indonesian Coalition, then the Order Party."
 A01_royal_story.11.a:0 "Appoint the cabinet and open the session."
 A01_royal_story.12.t:0 "A Crown on the Trade Routes"
 A01_royal_story.12.d:0 "Shipping security and island development take priority over prestige campaigns. Courts gain markets and citizens gain jobs, while public willingness to fight declines."
 A01_royal_story.12.a:0 "The sea should connect us."
 A01_royal_story.13.t:0 "A Homeland on Classroom Maps"
 A01_royal_story.13.d:0 "Refugees establish an archive and school for the lost homeland. Ministers insist that remembrance must not consume Indonesia’s future. A fleet of return will require an openly funded budget and offers no easy victory."
 A01_royal_story.13.a:0 "Preserve the homeland and build a future."
 A01_royal_story.14.t:0 "A State Facing the Pacific"
 A01_royal_story.14.d:0 "Naval maps now begin with Java. Courts, civic delegates and the military ministry sign a common defence plan. The new power rests on cooperation among the archipelago’s peoples."
 A01_royal_story.14.a:0 "Our future is here."
 A01_royal_story.15.t:0 "The Council Buys Time"
 A01_royal_story.15.d:0 "The inquiry deadline expires while the Council still holds the ministry. The royal route remains open, but another 180-day session costs political capital and makes captains more cautious."
 A01_royal_story.15.a:0 "Fund another session from the court."
 A01_royal_story.15.b:0 "Appeal to the country."
 A01_royal_institutions:0 "Crown, Admirals and Islands"
 A01_royal_institutions_desc:0 "Evidence: §Y[?A01_admiralty_evidence|0]§! / 3. Captain loyalty: §Y[?A01_fleet_loyalty|0]§! / 2. Court confidence: §Y[?A01_sultan_confidence|0]§!.\nTrial needs evidence and captains; purge needs the Guard and captains. The island compact requires at least 3 court confidence."
 A01_royal_ballot:0 "Election of the Prime Minister"
 A01_royal_ballot_desc:0 "Incumbent prime minister: §Y[Root.GetA01RoyalPremier]§!.\nBloc support: Constitutional Union §Y[?A01_vote_constitutional|0]§!, Order Party §Y[?A01_vote_order|0]§!, Indonesian Coalition §Y[?A01_vote_indonesian|0]§!.\nHighest support wins. Ties favour the Indonesian Coalition, then the Order Party."
 A01_audit_naval_contracts:0 "Audit Naval Contracts"
 A01_audit_naval_contracts_desc:0 "Account audits add one evidence dossier."
 A01_secure_witnesses:0 "Protect Witnesses"
 A01_secure_witnesses_desc:0 "Family protection encourages captains to testify. +1 loyalty."
 A01_pay_the_captains:0 "Pay the Captains"
 A01_pay_the_captains_desc:0 "Guarantee pay rather than political offices. +2 loyalty."
 A01_meet_princely_envoys:0 "Receive Princely Envoys"
 A01_meet_princely_envoys_desc:0 "Discuss taxation and justice. +1 court confidence."
 A01_admiralty_deadline:0 "The Council Delays the Inquiry"
 A01_admiralty_deadline_desc:0 "Resolve the trial, purge or retirement within 180 days. A missed deadline forces another concession without closing the route."
 A01_campaign_constitutional:0 "Campaign: Constitutional Union"
 A01_campaign_constitutional_desc:0 "Bloc support rises by 2; available once every 30 days."
 A01_campaign_order:0 "Campaign: Order Party"
 A01_campaign_order_desc:0 "Bloc support rises by 2; available once every 30 days."
 A01_campaign_indonesian:0 "Campaign: Indonesian Coalition"
 A01_campaign_indonesian_desc:0 "Bloc support rises by 2; available once every 30 days."
 A01_royal_election_campaign:0 "90 Days until Voting"
 A01_royal_election_campaign_desc:0 "At campaign end, the electoral commission determines the winning bloc by support."
 A01_royal_election_term:0 "Cabinet Term"
 A01_royal_election_term_desc:0 "The next campaign starts after 720 days. The incumbent serves until the next result."
 A01_cabinet_open_budget:0 "Van Rijn’s Open Budget"
 A01_cabinet_open_budget_desc:0 "Public parliamentary accounts direct investment towards civilian enterprises and the royal engineering schools."
 A01_cabinet_princely_budget:0 "Van der Velde’s Naval Budget"
 A01_cabinet_princely_budget_desc:0 "The Order Party combines princely guarantees with shipyard orders while keeping the Council’s political veto abolished."
 A01_cabinet_island_schools:0 "Raden Surya’s Island Schools"
 A01_cabinet_island_schools_desc:0 "The coalition trains teachers and engineers through a shared curriculum on Crown and sultanate lands, preserving local languages."
 A01_premier_van_rijn:0 "Matthijs van Rijn"
 A01_premier_van_der_velde:0 "Hendrik van der Velde"
 A01_premier_raden_surya:0 "Raden Surya"
 A01_premier_pending:0 "Cabinet not yet elected"
 A01_open_seas_convention:0 "Common Trading Sea Convention"
 A01_open_seas_convention_desc:0 "Coordinate Crown and sultanate port rules. Civilian investment builds a capital factory and strengthens autonomous partners. Available once."
 A01_exile_volunteer_register:0 "Open the Exile Volunteer Register"
 A01_exile_volunteer_register_desc:0 "Refugee records help recruit trained volunteers. Gain 6,000 manpower and 20 army experience. Available once."
 A01_archipelago_naval_exercises:0 "Joint Archipelago Manoeuvres"
 A01_archipelago_naval_exercises_desc:0 "Crown and sultanate staffs practise strait defence. Gain 20 navy experience; autonomous sultanates gain 10 each. Available once."
 A01_review_charter_courts:0 "Joint Review of Island Courts"
 A01_review_charter_courts_desc:0 "Civic and princely judges review charter enforcement and arbitrary taxation. Improve Crown and autonomous sultanate stability. Available once."
