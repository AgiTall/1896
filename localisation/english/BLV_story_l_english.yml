 ch93.18.d:0 "28 June 1893. Consider a Dubois licence or close the blood farms. A policy already chosen by focus is preserved."
 ch93.18.news_a:0 "Britain authorised a licensed Dubois contract."
 ch93.18.b:0 "Close the blood farms"
 ch93.18.news_b:0 "A British commission banned coerced blood collection."
 ch94.9.news_a:0 "The Chamber funds deliveries under the current British contract."
 ch94.7.a:0 "Humanitarian corridors"
 ch94.7.news_a:0 "Britain secured supply corridors. This decision does not end the Borneo war."
 ch94.20.d:0 "20 July 1894. Test an early site suppressor. British participation requires instruments and Tesla access; otherwise the trial is deferred."
 ch94.20.news_a:0 "An early site suppressor has been tested; it is neither a long-range prototype nor permission to resettle continents."
 ch94.20.b:0 "Defer or stop the trial"
 ch94.20.news_b:0 "The early trial was suspended; further work requires preparation and laboratory access."
 ch94.30.news_a:0 "The early drawings were retained in a private archive."
 ch94.30.t:0 "Early Suppressor Patents"
 ch94.30.d:0 "25 October 1894. Retain early drawings or offer the Chamber a limited licence, subject to its consent."
 ch94.30.b:0 "Offer a licence"
 ch94.30.news_b:0 "Britain offered early designs to the Chamber. The purchase still requires Chamber consent."
 ch95.8.t:0 "Implementing the Singapore Settlement"
 ch95.8.d:0 "22 April 1895. Renew or replace the 1894 port settlement without transferring Singapore's territory."
 ch95.8.news_a:0 "Singapore's trade and port-supervision arrangements were renewed."
 ch95.10.t:0 "Early Suppressors for Ships and Bases"
 ch95.10.d:0 "20 May 1895. Select a short-range ship unit or stationary tower, requiring an early prototype and Tesla access."
 ch95.10.news_a:0 "The early programme selected a short-range ship installation."
 ch95.10.news_b:0 "The early programme selected a stationary tower."
 ch96.10.d:0 "20 May 1896. Approve a reconnaissance or strike airship programme; the focus and dated event share one result."
 ch96.10.news_a:0 "A reconnaissance airship programme was established."
 ch96.10.news_b:0 "A strike airship programme was established."
 ch96.12.d:0 "28 June 1896. [A07.GetName] sets its trade policy without implying union with the other Australian colonies."
 ch96.12.news_a:0 "The government of [A07.GetName] opened commercial voyages."
 ch96.12.news_b:0 "The government of [A07.GetName] restricted foreign shipping."
 ch96.15.d:0 "5 August 1896. Choose private reconnaissance or invite foreign observers. Partners must consent; no artifact is awarded."
 ch96.15.news_a:0 "Britain is reinforcing northern stations; voyage details remain undisclosed."
 ch96.15.news_b:0 "Britain invited foreign observers to its northern expedition."
 ch96.23.d:0 "10 December 1896. Settle the Council of Crowns' legal status as a political association without replacing governments or changing sovereignty."
 ch96.23.a:0 "A legal Council of Crowns"
 ch96.23.b:0 "Separate courts"
 ch96.23.news_a:0 "Britain authorised a political Council of Crowns. Foreign courts receive invitations, not replacement governments."
 ch96.23.news_b:0 "The courts retain separate political representation. This decision declares no war."

