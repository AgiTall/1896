l_english:
 blv_story.1.t:0 "Passage Through Malacca"
 blv_story.1.d:0 "Choose free passage or a blockade and issue the approved order to captains and harbour services."
 blv_story.1.a:0 "Free passage"
 blv_story.1.b:0 "Blockade"
 blv_story.2.t:0 "Early Suppressor Patents"
 blv_story.2.d:0 "Retain early designs or offer the Chamber a limited licence; this does not include the long-range suppressor."
 blv_story.2.a:0 "Private archive"
 blv_story.2.b:0 "Offer a licence"
 blv_story.4.t:0 "Early Naval Suppressors"
 blv_story.4.d:0 "Choose a short-range ship unit or a stationary tower. The 1895 design does not replace the 1900 long-range trial."
 blv_story.4.a:0 "Ship installation"
 blv_story.4.b:0 "Stationary tower"
 blv_story.5.t:0 "The Airship Programme"
 blv_story.5.d:0 "Choose reconnaissance or strike duties to determine crew training and the allocation of funds."
 blv_story.5.a:0 "Reconnaissance service"
 blv_story.5.b:0 "Strike programme"
 blv_story.6.t:0 "The Northern Expedition Mandate"
 blv_story.6.d:0 "Prepare a private voyage or invite partners. Participation needs their consent; excavation is a separate project from 1898."
 blv_story.6.a:0 "Private expedition"
 blv_story.6.b:0 "Invite partners"
 blv_story.8.t:0 "The Legal Status of the Council of Crowns"
 blv_story.8.d:0 "The Council may become a legal political association of exiled courts. It replaces no cabinet and acquires no foreign state."
 blv_story.8.a:0 "A legal association"
 blv_story.8.b:0 "Separate courts"
 blv_story.3.t:0 "An Admiralty Licence"
 blv_story.3.d:0 "Britain offers early drawings for 75 political power, without Tesla or the artifact."
 blv_story.3.a:0 "Purchase the licence"
 blv_story.3.b:0 "Decline"
 blv_story.7.t:0 "An Invitation to the Northern Expedition"
 blv_story.7.d:0 "Britain invites observers; neither artifact custody nor funds are transferred without consent."
 blv_story.7.a:0 "Send observers"
 blv_story.7.b:0 "Do not participate"
 blv_story.9.t:0 "An Association of Exiled Crowns"
 blv_story.9.d:0 "Join a political association while preserving our government, constitution and sovereignty."
 blv_story.9.a:0 "Send a delegation"
 blv_story.9.b:0 "Keep a separate court"
