 A10_integration:0 "Federal Pacification and Integration"
 A10_integration_desc:0 "Suppress resistance and build compliance. At 80% compliance a state can become a core."
 A10_confederate_member:0 "Philippine Confederate Member"
 A10_confederate_member_desc:0 "Self-government under a common military command: units deploy to the Confederation and members must answer calls to war."
 A10_separatism:0 "Island Separatism"
 A10_separatism_desc:0 "Island governments demand self-rule. Only Cavite accepts central authority unconditionally."
 A10_federal_administration:0 "Federal Administration"
 A10_common_army:0 "Common Army of the Islands"
 A10_FED:0 "Federation of the Philippine Islands"
 A10_FED_DEF:0 "Federation of the Philippine Islands"
 A10_FED_neutrality:0 "Federation of the Philippine Islands"
 A10_FED_neutrality_DEF:0 "Federation of the Philippine Islands"
 A10_FED_ADJ:0 "Philippine"
 A10_island_congress_desc:0 "Cavite holds the islands together through a fragile agreement. Congress must choose between self-governing republics and a united federation."
 A10_confederation_desc:0 "Recognise self-rule in the central Visayas and Samar. Both become confederate members under a common army, obliged to answer calls to war."
 A10_visayan_compact_desc:0 "Give Cebu and Panay their own governments under the common military command."
 A10_mindanao_compact_desc:0 "Establish Mindanao and North Mindanao as two republics whose troops serve the common defence."
 A10_united_command_desc:0 "Island republics retain their councils and laws while a joint staff in Cavite directs training and defence."
 A10_federation_desc:0 "Reject secession. Federal administration reduces resistance and improves compliance growth. At 80%, a decision makes a state a core."
 A10_gendarmerie_desc:0 "Establish a permanent gendarmerie. Controlled non-core states gain 10 compliance and lose 10 resistance."
 A10_local_administration_desc:0 "Replace competing councils with a common local administration. Controlled non-core states gain 10 compliance and lose 10 resistance."
 A10_equal_citizenship_desc:0 "Common rights bind the islands together. Gain another 10 compliance; regional decisions continue the integration effort."
 A10_coastal_arsenals_desc:0 "Expand Cavite workshops and equip the defenders before the offensive."
 A10_landing_plans_desc:0 "Prepare the staff and routes for a return to occupied Luzon."
 A10_strike_japan_desc:0 "Launch a preventive strike while Japan is fighting the Dutch. This focus directly declares war and requires completion of the chosen political branch."
 A10_luzon_charter_desc:0 "After liberating northern Luzon, establish a secular republic as a new confederate member."
 A10_capital_charters_desc:0 "Liberated Manila and Bataan become separate republics under the common military command."
 A10_federal_reconstruction_desc:0 "The return of Manila opens reconstruction. Gain 10 compliance in controlled non-core states and expand Cavite industry."