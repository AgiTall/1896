l_english:
 A10M_coup:0 "The Night of Locked Doors"
 A10M_coup_desc:0 "Guards will seal the approaches to the island congress. Colonel Mateo Sandoval will declare the republics' freedom a cover for impotence and place power in an emergency military command. Delegates will leave only after taking its oath."
 A10M_martial_law:0 "The Emergency Proclamation"
 A10M_martial_law_desc:0 "Military commandants will control ports, telegraphs and movement after dark. Behind every promise of order stands a family forced to request permission for ordinary life."
 A10M_recall_charters:0 "Revoke the Island Charters"
 A10M_recall_charters_desc:0 "Commandants will replace councils wherever the congress is still obeyed. Republics subordinate to us will return troops and institutions to the common command; an order alone cannot cross foreign frontiers."
 A10M_censor_cables:0 "Silence on the Wires"
 A10M_censor_cables_desc:0 "Private cable messages will pass through a censor. The regime can conceal garrison movements, but useful reports will disappear beside dangerous rumours, leaving merchants and scholars to work blind."
 A10M_officer_tribunal:0 "Tribunal of the Old Staff"
 A10M_officer_tribunal_desc:0 "Officers who guarded the congress yesterday must answer for its weakness today. Their trial will decide whether the army becomes an instrument of personal loyalty to Sandoval or retains room for professional dissent."
 A10M_rice_commissions:0 "Rice Commissions"
 A10M_rice_commissions_desc:0 "Neither a garrison nor a dockside district can be held without rice. Commissions will register stocks and household plots so that headquarters can finally see the cost of its supply demands."
 A10M_requisition:0 "The Command's Warehouse Ledgers"
 A10M_requisition_desc:0 "Deliveries will be combined into compulsory quotas. Arsenals will receive a steadier flow of material while rural landings receive demands that grow harder to fulfil."
 A10M_compensation:0 "Receipts Instead of Confiscations"
 A10M_compensation_desc:0 "Military receipts must become obligations of the treasury. Payments will burden the budget, but suppliers will be able to buy grain again instead of hiding their boats at the sight of a uniform."
 A10M_labour_battalions:0 "Labour Battalions"
 A10M_labour_battalions_desc:0 "Radicals demand that men be ordered into barracks and workshop construction. Work will accelerate, but families will lose their workers and a more implacable opposition will form behind the wire."
 A10M_cadet_schools:0 "Schools of the Military Estate"
 A10M_cadet_schools_desc:0 "Commandants will select able youths for accelerated officer courses. Education will open doors once closed by family connections while binding their future to the regime."
 A10M_levy_rolls:0 "Unified Levy Rolls"
 A10M_levy_rolls_desc:0 "Scattered island registers will be brought together. Headquarters will gain a reserve, but workshops will begin losing skilled hands; commanders must account for who can still feed the conscripts."
 A10M_medical_corps:0 "Garrison Medical Teams"
 A10M_medical_corps_desc:0 "Field infirmaries must stop losses invisible on battle maps. Medical boats and supplies will need space on every supply voyage."
 A10M_quartermasters:0 "Quartermaster Inspectorate"
 A10M_quartermasters_desc:0 "Warehouse reports must no longer depend on a commandant's mood. Inspectors will examine losses and boat allocation, depriving local commanders of part of their customary income."
 A10M_junta:0 "Rule of the Perpetual Guard"
 A10M_junta_desc:0 "Radical colonels reject the promise of temporary rule. Under their charter, civilian life will become an extension of military service and the emergency itself the foundation of the state."
 A10M_directorate:0 "Directorate of the Services"
 A10M_directorate_desc:0 "Service chiefs propose rule by a board and written orders. They will not restore the congress, but supply, fleet and land forces will each have a voice behind the closed door."
 A10M_revolutionary_command:0 "Command of National Purification"
 A10M_revolutionary_command_desc:0 "The new staff will call every dissent a continuation of the old disintegration. Officers will gain greater freedom to attack and less freedom to discuss the cost of orders."
 A10M_commissars:0 "Political Supervisors"
 A10M_commissars_desc:0 "An envoy of the junta will stand beside every commander. He will stiffen faltering units and report anyone who doubts its right to command the islands."
 A10M_islands_barracks:0 "An Archipelago of Barracks"
 A10M_islands_barracks_desc:0 "Training assemblies will encompass new age groups. Every landing will know its military chief and every household the day its worker must report for duty."
 A10M_red_seal:0 "Seal of the Supreme Commandant"
 A10M_red_seal_desc:0 "A decree will place Sandoval's personal seal above every island charter. The command will celebrate the end of the coup, though no one now promises an end to emergency rule itself."
 A10M_service_council:0 "Council of the Services"
 A10M_service_council_desc:0 "Sailors, quartermasters and army commanders will sign rules for settling disputes. A personal quarrel between colonels must no longer delay a rice barge or a garrison transfer."
 A10M_audited_budget:0 "A Budget Under Signature"
 A10M_audited_budget_desc:0 "Each service will submit its expenses to a common auditor. At least the totals must be published: without supplier confidence, power will be left with tidy orders and empty warehouses."
 A10M_professional_army:0 "Service Under Military Regulations"
 A10M_professional_army_desc:0 "Professional instructors will replace political examinations with tests of training. Instruction will take longer, but a commander can rely on a soldier's skill rather than his signature beneath a slogan."
 A10M_fixed_term:0 "Terms and Powers of Commandants"
 A10M_fixed_term_desc:0 "Military rule will retain its exceptional position, but appointments will have terms and complaints a route to a service court. This promise will not restore the congress; it will at least limit a garrison's arbitrary rule."
 A10M_coastal_observers:0 "Chain of Coastal Observers"
 A10M_coastal_observers_desc:0 "Small signal posts will link garrisons with patrol craft. Fishing boats will receive reporting instructions, and the coastal service a duty to distinguish threats from ordinary voyages."
 A10M_defence_plans:0 "Plans for Strait Defence"
 A10M_defence_plans_desc:0 "The staff will prepare withdrawal routes, depot security and cooperation between batteries and fleet. An order to defend an island must leave a garrison a route to its next position, as well as a fine final telegram."
 A10M_veteran_settlement:0 "The Debt to Soldiers' Families"
 A10M_veteran_settlement_desc:0 "Families of the dead and maimed will receive support from a common register. A fine victory speech cannot cancel this expense: without it, military rule will consume its own support."
 A10M_restore_markets:0 "Open the Markets After the Watch"
 A10M_restore_markets_desc:0 "Landings and workshops must function again without a commandant's daily intervention. Labour battalions will be disbanded and some supply powers returned to civilian administrators."
 A10M_iron_archipelago:0 "The Iron Archipelago"
 A10M_iron_archipelago_desc:0 "The military regime has weathered its first revolts and learned to count the cost of its orders. It will retain the garrisons and closed congress, but its strength now depends on functioning depots and people able to survive until the next harvest."
 A10M_mateo_sandoval_name:0 "Mateo Sandoval"
 A10M_MILITARY:0 "Philippine Military State"
 A10M_MILITARY_DEF:0 "the Philippine Military State"
 A10M_MILITARY_ADJ:0 "Philippine"
 A10M_MILITARY_neutrality:0 "Philippine Military State"
 A10M_MILITARY_neutrality_DEF:0 "the Philippine Military State"
 A10M_MILITARY_neutrality_ADJ:0 "Philippine"
 A10M_MILITARY_democratic:0 "Philippine Military State"
 A10M_MILITARY_democratic_DEF:0 "the Philippine Military State"
 A10M_MILITARY_democratic_ADJ:0 "Philippine"
 A10M_MILITARY_fascism:0 "Philippine Military State"
 A10M_MILITARY_fascism_DEF:0 "the Philippine Military State"
 A10M_MILITARY_fascism_ADJ:0 "Philippine"
 A10M_MILITARY_communism:0 "Philippine Military State"
 A10M_MILITARY_communism_DEF:0 "the Philippine Military State"
 A10M_MILITARY_communism_ADJ:0 "Philippine"
 A10M_opposition:0 "Opposition"
 A10M_repression:0 "Repression"
 A10M_strain:0 "Supply Strain"
 A10M_state_of_siege:0 "The State Under Guard"
 A10M_state_of_siege_desc:0 "Opposition: §Y[?A10M_opposition|0]/100§!\nRepression: §Y[?A10M_repression|0]/100§!\nSupply strain: §Y[?A10M_strain|0]/100§!\n\nOpposition rises by §R2§! each month. War adds §R2§! strain; peace removes §G1§!. Repression of §Y65§! or more adds another §R2§! opposition and §R2§! strain monthly. Outside the permanent junta, repression falls by §G1§! monthly. Institutions and obligations alter these totals.\n\nOpposition of §Y65§! causes strikes; strain of §Y65§! causes supply shortages. At §Y80§!, conspiracy and food crises can occur, each at most once every 150 days. Lowering a value below 65 removes its penalty."
 A10M_martial_government:0 "Emergency Military Government"
 A10M_martial_government_desc:0 "The army holds the ports and institutions, but many islanders reject its right to rule."
 A10M_censored_society:0 "Society Under Censorship"
 A10M_censored_society_desc:0 "The censor clears reports of victory and detains anything that may trouble the command."
 A10M_requisition_bureaus:0 "Requisition Bureaus"
 A10M_requisition_bureaus_desc:0 "Quotas sustain the arsenals at the expense of rural stocks. Monthly: §R+2§! supply strain."
 A10M_compensation_bonds:0 "Treasury Receipts for Suppliers"
 A10M_compensation_bonds_desc:0 "The treasury pays for requisitioned stocks. Monthly: §G−2§! supply strain."
 A10M_compulsory_labour:0 "Compulsory Labour Battalions"
 A10M_compulsory_labour_desc:0 "Military construction takes workers from families and workshops. Monthly: §R+3§! opposition and §R+2§! supply strain."
 A10M_cadet_estate:0 "The Cadet Estate"
 A10M_cadet_estate_desc:0 "The new officers owe their standing to the military state."
 A10M_military_levies:0 "Military Levy Rolls"
 A10M_military_levies_desc:0 "Common registers expand the reserve and draw workers away from production."
 A10M_field_hospitals:0 "Garrison Infirmaries"
 A10M_field_hospitals_desc:0 "Medical staff and ambulance boats receive regular supplies. Monthly: §G−1§! supply strain."
 A10M_supply_inspectorate:0 "Quartermaster Inspectorate"
 A10M_supply_inspectorate_desc:0 "Warehouse losses can no longer vanish from reports. Monthly: §G−1§! supply strain."
 A10M_permanent_junta:0 "Permanent Radical Junta"
 A10M_permanent_junta_desc:0 "The emergency has been declared the permanent foundation of power. Repression no longer declines on its own."
 A10M_political_commissars:0 "Supervisors Beside Commanders"
 A10M_political_commissars_desc:0 "Political supervision stiffens resolve and constrains initiative."
 A10M_barracks_state:0 "The Barracks State"
 A10M_barracks_state_desc:0 "New age groups prepare for the ranks while civilian construction waits for workers."
 A10M_military_directorate:0 "Military Directorate"
 A10M_military_directorate_desc:0 "The service chiefs divide powers while preserving army rule over a closed congress."
 A10M_professional_service:0 "Professional Service"
 A10M_professional_service_desc:0 "Regulations demand training and prohibit vengeance disguised as loyalty checks. Monthly: §G−1§! opposition."
 A10M_published_budget:0 "Published Military Expenditure"
 A10M_published_budget_desc:0 "An auditable estimate restores supplier confidence. Monthly: §G−1§! supply strain."
 A10M_veterans_obligations:0 "Obligations to Soldiers' Families"
 A10M_veterans_obligations_desc:0 "Family support becomes a standing budget obligation. Monthly: §G−1§! opposition and §G−2§! supply strain."
 A10M_civil_recovery:0 "Civilian Recovery"
 A10M_civil_recovery_desc:0 "Markets feed the islands again and workshops regain workers. Monthly: §G−1§! opposition and §G−1§! supply strain."
 A10M_coastal_watch:0 "Coastal Observation Service"
 A10M_coastal_watch_desc:0 "Signal posts link patrols and garrisons."
 A10M_strikes:0 "Strikes and Underground Cells"
 A10M_strikes_desc:0 "At opposition of 65 or more, depots and workshops become centres of resistance. The penalty ends when opposition falls below 65."
 A10M_rationing:0 "Food Quotas Breaking Down"
 A10M_rationing_desc:0 "At strain of 65 or more, orders outnumber rice stocks and working boats. The penalty ends when strain falls below 65."
 A10M_shattered_officer_corps:0 "Decapitated Staffs"
 A10M_shattered_officer_corps_desc:0 "Intimidation broke the opposition, but another oath cannot replace the expertise lost with it."
 A10M_iron_state:0 "The Iron Archipelago"
 A10M_iron_state_desc:0 "Garrisons hold the straits, and the state has learned to survive its own emergency measures."
 A10M_system_tt:0 "Unlocks management of §Yopposition§!, §Yrepression§! and §Ysupply strain§! through The State Under Guard decisions. Values are bounded between 0 and 100."
 A10M_recall_members_tt:0 "Annexes only our own subordinate island republics and transfers their troops back. Independent countries and foreign subjects retain their status."
 A10M_junta_tt:0 "Repression no longer falls by 1 each month. Releasing detainees remains available."
 A10M_requisition_tt:0 "Requisition bureaus add §R2§! supply strain monthly. Unlocks emergency requisitions and the later suspension of the quota system."
 A10M_compensation_tt:0 "Receipts reduce supply strain by §G2§! monthly."
 A10M_labour_tt:0 "Labour battalions add §R3§! opposition and §R2§! supply strain monthly. They can be disbanded through a separate decision."
 A10M_hospitals_tt:0 "Infirmaries reduce supply strain by §G1§! monthly."
 A10M_inspectorate_tt:0 "The inspectorate reduces supply strain by §G1§! monthly. Unlocks garrison rotations."
 A10M_budget_tt:0 "Auditing reduces supply strain by §G1§! monthly."
 A10M_professional_tt:0 "Regulated service reduces opposition by §G1§! monthly."
 A10M_settlement_tt:0 "Payments reduce opposition by §G1§! and supply strain by §G2§! monthly."
 A10M_recovery_tt:0 "Disbands labour battalions. Recovery reduces opposition and supply strain by §G1§! monthly."
 A10M_suspend_requisitions_tt:0 "Compulsory quotas stop adding 2 supply strain monthly. Individual emergency requisitions remain available."
 A10M_provincial_hearings:0 "Hear Provincial Intermediaries"
 A10M_provincial_hearings_desc:0 "Signed petitions will give the islands a way to speak without secret assemblies. Opposition: §G−12§!, repression: §G−3§!, strain: §R+3§!."
 A10M_security_sweep:0 "Order Commandant Sweeps"
 A10M_security_sweep_desc:0 "Arrests will disrupt the opposition network, but its families will remember the guards. Opposition: §G−18§!, repression: §R+12§!, strain: §R+6§!."
 A10M_release_detainees:0 "Review Detainee Lists"
 A10M_release_detainees_desc:0 "Releasing people held without charge will curb the commandants' arbitrary power. Repression: §G−15§!, opposition: §G−5§!."
 A10M_purchase_rice:0 "Buy Rice for Garrisons and Families"
 A10M_purchase_rice_desc:0 "Treasury purchases will replenish stocks before another quota ruins a landing. Strain: §G−18§!, opposition: §G−3§!."
 A10M_emergency_requisition:0 "Seize Reserve Deliveries"
 A10M_emergency_requisition_desc:0 "The depot will receive weapons at the expense of reserves intended for future work. Strain: §R+12§!, opposition: §R+8§!."
 A10M_rotate_garrisons:0 "Rotate Garrison Commands"
 A10M_rotate_garrisons_desc:0 "A change of commanders will disrupt local extortion and permit an audit. Opposition: §G−8§!, strain: §G−8§!."
 A10M_end_labour_battalions:0 "Disband the Labour Battalions"
 A10M_end_labour_battalions_desc:0 "Workers will return to their families and the treasury will recognise its obligations to suppliers. Opposition: §G−15§!, strain: §G−10§!."
 A10M_recall_officers:0 "Recall Dismissed Specialists"
 A10M_recall_officers_desc:0 "The staffs need experienced people again, even if their earlier testimony troubles the commandant. Removes the decapitated staffs penalty; opposition: §R+5§!, repression: §G−5§!."
 A10M_suspend_requisitions:0 "Suspend Compulsory Quotas"
 A10M_suspend_requisitions_desc:0 "Deliveries will return to contract purchases. Strain: §G−15§!; requisition bureaus cease operating."
 A10M.1.t:0 "The Congress's Last Bell"
 A10M.1.d:0 "At dawn the delegates were led out between guards. Colonel Sandoval received reports of occupied landings and ordered the congress seals stripped from the doors. Radicals demand immediate arrests. Quartermasters warn that without the old clerks the port cannot issue even a day's rations."
 A10M.1.a:0 "Secure power with an exemplary purge."
 A10M.1.b:0 "Keep the clerks under officers' guarantees."
 A10M.2.t:0 "Defendants in Uniform"
 A10M.2.d:0 "The tribunal has produced two lists. The first contains officers named in signed testimony. The second names every commander who ever contradicted the colonel. Young radicals already demand the vacant posts; the staff warns that the lists include its best supply organisers."
 A10M.2.a:0 "Try only the documented charges."
 A10M.2.b:0 "Burn disloyalty out of the entire staff."
 A10M.3.t:0 "Empty Sacks Under Treasury Seals"
 A10M.3.d:0 "The commandants have again reported completed quotas, yet empty sacks stand on the landings. Villages are eating seed grain and garrisons dividing short rations. The treasury can buy food urgently and reduce its demands. Radicals propose seizing remaining household reserves to supply the army at once."
 A10M.3.a:0 "Reduce the quotas and pay for rice."
 A10M.3.b:0 "Seize what remains. The army will have its share."
 A10M.4.t:0 "Conspiracy Beneath the Depot Roof"
 A10M.4.d:0 "Dock workers, provincial intermediaries and several junior officers prepared a common loading stoppage. The guards seized their correspondence, but further arrests may turn neighbouring garrisons. Intermediaries promise to halt the action in exchange for a review of detentions and treasury obligations."
 A10M.4.a:0 "Purchase a truce by revising the obligations."
 A10M.4.b:0 "Declare the conspirators enemies of the state."
 A10M.5.t:0 "The Parade and the Closed Doors"
 A10M.5.d:0 "Units of the new military state marched along the landing. Behind the reviewing stand stood the congress building, to which the delegates have never returned. The command can turn the day into another oath or receive petitions from the families of those marching before it."
 A10M.5.a:0 "The oath stands above petitions."
 A10M.5.b:0 "Receive the families and intermediaries."
 A10M.6.t:0 "Intermediaries at the Commandant's Office"
 A10M.6.d:0 "Revoking the charters has not erased the people who lived by them. Councils have sent elders asking to retain local clerks, market schedules and familiar boat services. Radicals see an attempt to outlast the coup; quartermasters see the only way to keep island life moving."
 A10M.6.a:0 "Retain local services under supervision."
 A10M.6.b:0 "Replace the intermediaries with military detachments."
