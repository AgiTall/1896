 A01_real_militia_tt:0 "Raise 12 Indonesian militia divisions, each with 3 vanilla militia battalions. These temporary units disband after the Japanese crisis."
 A01_future.17.t:0 "Ludolf Receives Time for Reform"
 A01_future.17.d:0 "The cabinet preserves civilian rule, but Ludolf has not been absolved. Open reconstruction and autonomous charters must answer the demands for freedom. Once the sultanates exist, their delegates can petition the council to give him another chance."
 A01_future.17.a:0 "Begin civilian reforms."
