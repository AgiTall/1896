l_english:
 A01_future_contest:0 "The Contest for the Netherlands"
 A01_motion_to_dismiss_ludolf:0 "Hearings on the Dismissal of Ludolf"
 A01_motion_to_dismiss_ludolf_desc:0 "The postwar cabinet opens the political fork. On Ludolfs route the autonomous sultanates petition the council through an event. Hearings expire after 240 days."
 A01_hear_island_delegates:0 "Hear the Island Delegates"
 A01_hear_island_delegates_desc:0 "Hear the Island Delegates. Establish the institutions and guarantees of this political settlement."
 A01_back_admiralty_inquiry:0 "Support the Admiralty Inquiry"
 A01_back_admiralty_inquiry_desc:0 "Support the Admiralty Inquiry. Establish the institutions and guarantees of this political settlement."
 A01_extend_cabinet_hearings:0 "Extend the Cabinet Hearings"
 A01_extend_cabinet_hearings_desc:0 "Extend the hearings once by 60 days, at a political and stability cost."
 A01_future_of_netherlands:0 "In Whose Hands Is the Future of the Netherlands?"
 A01_future_of_netherlands_desc:0 "Defeat has broken the old settlement. The council demands responsibility; Indonesian communities demand freedom. The hearings will decide who has the right to govern."
 A01_equal_citizenship:0 "Equal Federal Citizenship"
 A01_equal_citizenship_desc:0 "End the legal divide between Dutch and Indonesians. Remove the racial divide modifier and gain 3% stability."
 A01_elected_civil_service:0 "Accountable Civilian Government"
 A01_elected_civil_service_desc:0 "Replace the transitional mandate with accountable civil administration. Gain 5% political power generation and 5% cheaper army advisers."
 A01_democratic_federation:0 "Democratic Federation of the Netherlands and Indonesia"
 A01_democratic_federation_desc:0 "Found a common democratic state. Our autonomous sultanates join the federation; foreign and Japanese territories are untouched. Elections require separate preparation."
 A01_purge_civil_service:0 "Purge the Civil Service"
 A01_purge_civil_service_desc:0 "Replace civilian officials with military appointees. Political purges temporarily disrupt administration and construction."
 A01_purge_officer_corps:0 "Purge the Officer Corps"
 A01_purge_officer_corps_desc:0 "Require personal loyalty to the council. The removal of experienced officers temporarily reduces army and navy organisation."
 A01_military_state:0 "The State of the Military Elite"
 A01_military_state_desc:0 "Place ministries, courts, budgets and appointments under the military elite."
 A01_crown_above_factions:0 "The Crown Above the Factions"
 A01_crown_above_factions_desc:0 "Complete this focus to bring Emma to power while the balance lies between -10% and +10%. The private royal proposal reveals this otherwise hidden branch."
 A01_royal_island_charter:0 "A Charter for Crown and Islands"
 A01_royal_island_charter_desc:0 "A Charter for Crown and Islands. Establish the institutions and guarantees of this political settlement."
 A01_wilhelmina_comes_of_age:0 "Wilhelmina Comes of Age"
 A01_wilhelmina_comes_of_age_desc:0 "End Emma's regency and transfer power to Wilhelmina. Normally this is possible from 31 August 1898. If Wilhelmina insisted on taking power during her conversation with Mother, accession may take place earlier."
 A01_royal_constitution:0 "The Constitution of Crown and Archipelago"
 A01_royal_constitution_desc:0 "After ending admiral political rule, the Crown adopts a constitution. Parliament will pass an electoral law and elect a prime minister."
 A01_demands_for_freedom:0 "Demands for Freedom"
 A01_demands_for_freedom_desc:0 "Demands for Freedom. Establish the institutions and guarantees of this political settlement."
 A01_federal_transition:0 "A Federal Mandate"
 A01_federal_transition_desc:0 "A Federal Mandate. Establish the institutions and guarantees of this political settlement."
 A01_democratic_federation_idea:0 "Citizenship and Elected Councils"
 A01_democratic_federation_idea_desc:0 "Citizenship and Elected Councils. Establish the institutions and guarantees of this political settlement."
 A01_military_directorate:0 "The Admirals Directorate"
 A01_military_directorate_desc:0 "The Admirals Directorate. Establish the institutions and guarantees of this political settlement."
 A01_purged_administration:0 "Purged Administration"
 A01_purged_administration_desc:0 "Purged Administration. Establish the institutions and guarantees of this political settlement."
 A01_purged_officers:0 "Officer Purges"
 A01_purged_officers_desc:0 "Officer Purges. Establish the institutions and guarantees of this political settlement."
 A01_total_military_state:0 "All Power to the Military Elite"
 A01_total_military_state_desc:0 "All Power to the Military Elite. Establish the institutions and guarantees of this political settlement."
 A01_royal_arbitration:0 "Emmas Regency"
 A01_royal_arbitration_desc:0 "Emmas Regency. Establish the institutions and guarantees of this political settlement."
 A01_island_charter:0 "The Island Charter"
 A01_island_charter_desc:0 "The Island Charter. Establish the institutions and guarantees of this political settlement."
 A01_constitutional_crown:0 "A Constitutional Crown"
 A01_constitutional_crown_desc:0 "A Constitutional Crown. Establish the institutions and guarantees of this political settlement."
 A01_future.1.t:0 "A Shared Countdown"
 A01_future.1.d:0 "Japanese preparations begin. Both countries now use the same invasion deadline; diplomatic concessions and preparations can alter the shared clock."
 A01_future.1.a:0 "Prepare the islands."
 A01_future.2.t:0 "The Islands Speak After Defeat"
 A01_future.2.d:0 "Workers and village delegates gather outside the residence. They demand autonomy and a say in decisions made in their name. Ludolf promises reform; the council questions his right to lead it."
 A01_future.2.a:0 "We must answer them."
 A01_future.3.t:0 "The Cabinet Remains, for Now"
 A01_future.3.d:0 "The council opens hearings on Ludolfs responsibility. He stays in office for 240 days while presenting reforms and gathering support. Dismissal will require an explicit political settlement."
 A01_future.3.a:0 "Open the hearings."
 A01_future.4.t:0 "Who Has the Right to Decide?"
 A01_future.4.d:0 "The council demands unified military authority. Island delegates demand accountable government. Ludolf argues that replacing a cabinet cannot restore trust by itself. Every charter and appointment now shapes the future."
 A01_future.4.a:0 "Let the country hear both sides."
 A01_future.5.t:0 "The Final Hearing"
 A01_future.5.d:0 "The hearings have expired. Autonomous sultanates can sponsor a federal mandate for Ludolf; the admirals demand his dismissal and imprisonment. The temporary cabinet must give way to a lasting settlement."
 A01_future.5.a:0 "Grant Ludolf a federal mandate."
 A01_future.6.t:0 "One Line in the Law"
 A01_future.6.d:0 "Racial restrictions on citizenship and public office are repealed. Delegates insist that elected institutions must enforce the promise beyond Batavia."
 A01_future.6.a:0 "Citizenship is not ancestry."
 A01_future.7.t:0 "A Name on the Appointment List"
 A01_future.7.d:0 "A district council rejects Batavias nominee and proposes a local official. Ludolf accepts. Indonesian communities and sultanates gain a real role in nominations and public hearings."
 A01_future.7.a:0 "Officials must answer to residents."
 A01_future.8.t:0 "Signatures Under a Shared Country"
 A01_future.8.d:0 "The cabinet, island representatives and autonomous sultanates sign the federal constitution. Elections and common citizenship replace exclusive colonial appointments."
 A01_future.8.a:0 "The Netherlands becomes a shared undertaking."
 A01_future.9.t:0 "The Seals Change Hands"
 A01_future.9.d:0 "Military commissioners replace civilian officials and seal archives. Political disagreement becomes evidence of disloyalty. Administration slows as the council consolidates control."
 A01_future.9.a:0 "The military controls appointments."
 A01_future.10.t:0 "An Oath Behind Closed Doors"
 A01_future.10.d:0 "Officers must swear personal loyalty to the council. Experience no longer guarantees a command. The purges weaken coordination while building a loyal corps."
 A01_future.10.a:0 "Loyalty becomes a condition of service."
 A01_future.11.t:0 "The Regent Arrives"
 A01_future.11.d:0 "Neither the council nor the civilian cabinet could secure lasting authority. Emma accepts the regency as an arbiter, preserving naval command and opening negotiations on island rights."
 A01_future.11.a:0 "The regency must hold the country together."
 A01_future.12.t:0 "A Charter for the Islands"
 A01_future.12.d:0 "Emma confirms autonomous rights and community representation. The delegates insist that the charter must bind future monarchs as well as the regent."
 A01_future.12.a:0 "The charter binds the crown."
 A01_future.13.t:0 "Wilhelmina Takes Office"
 A01_future.13.d:0 "The adult Wilhelmina succeeds Queen Mother Emma. Alongside the state seal, she receives copies of the island charters. The regency ends; the duty to negotiate remains."
 A01_future.13.a:0 "Long live Queen Wilhelmina."
 A01_future.14.t:0 "The Crown and the Law"
 A01_future.14.d:0 "The new constitution separates the powers of the monarch, civilian institutions and military command, protecting island representation and autonomous charters."
 A01_future.14.a:0 "No order stands above the constitution."
 A01_future.15.t:0 "The State Becomes a Headquarters"
 A01_future.15.d:0 "Ministries, courts and appointments now answer to the council. Ludolf remains imprisoned. The purges end in complete control of the state by the military elite."
 A01_future.15.a:0 "Every institution answers to the council."
 A01_future.16.t:0 "An Unmarked Envelope"
 A01_future.16.d:0 "With neither faction able to prevail, Emma privately offers a regency and guarantees for the islands. Ludolf must choose between yielding to an arbiter and continuing the unresolved struggle."
 A01_future.16.a:0 "Consider a monarchical settlement."
 A01_future.5.b:0 "Transfer power to the council and imprison Ludolf."
 A01_future.16.b:0 "Continue the contest without the crown."
