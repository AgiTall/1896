l_english:
 A03_wartime_operations:0 "Sustaining the Southern Campaign"
 A03_wartime_operations_desc:0 "Reserves and mobilisation extend the shared Borneo campaign deadline for both sides."
 A03_rush_second_wave:0 "Send a Second Wave"
 A03_rush_second_wave_desc:0 "Extend both wartime missions by 45 days, provide 1,000 weapons and 5,000 reservists."
 A03_mobilize_reserves:0 "Mobilise the Reserves"
 A03_mobilize_reserves_desc:0 "Extend both wartime missions by 30 days and receive 15,000 reservists, 2,000 weapons and fuel."
 A03_imperial_press_campaign:0 "Imperial Press Campaign"
 A03_imperial_press_campaign_desc:0 "Extend both wartime missions by 20 days and rally public support for the campaign."
 A01_peace_request_category:0 "Negotiations with Japan"
 A01_peace_request_category_desc:0 "If Japan controls at least one Borneo province, offer an early peace on Japanese terms."
 A01_request_japanese_terms:0 "Request Japanese Peace Terms"
 A01_request_japanese_terms_desc:0 "Propose the Borneo Convention to Tokyo. Japan may accept or refuse. A surviving Brunei lease also counts as Japanese control."
 a01_peace_request.1.t:0 "An Appeal to Tokyo"
 a01_peace_request.1.d:0 "Batavia proposes ending the war under the Borneo Convention. The Japanese government must respond."
 a01_peace_request.1.a:0 "Await the response."
 a01_peace_request.2.t:0 "Batavia Requests Peace"
 a01_peace_request.2.d:0 "The Dutch administration is ready to accept the Borneo Convention. We can end the campaign or continue the war."
 a01_peace_request.2.accept:0 "Accept the proposal."
 a01_peace_request.2.reject:0 "Continue the campaign."
 a01_peace_request.3.t:0 "An Early Borneo Convention"
 a01_peace_request.3.d:0 "Japan has accepted. Sabah, Brunei, Limbang and Sarawak pass to Japan; the war ends under the Convention."
 a01_peace_request.3.a:0 "Begin reconstruction."
 a01_peace_request.4.t:0 "Tokyo Refuses"
 a01_peace_request.4.d:0 "The Japanese government has refused the peace request. The campaign continues."
 a01_peace_request.4.a:0 "Prepare to continue the struggle."
