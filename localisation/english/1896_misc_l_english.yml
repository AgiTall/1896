 A01_PACIFIC_START_DESC:0 "Batavia governs a wealthy but divided archipelago. The Admirals Council constrains civilian authority while inequality undermines recruitment. Ludolf must choose between an agreement with local rulers and the colonial hierarchy. To the north, Japan eyes the oil of Borneo."
