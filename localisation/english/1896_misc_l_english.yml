 A01_army_advisor_unlocked_tt:0 "Unlock the §YKNIL Inspectorate§! army chief with an army defence bonus. Appointment costs 100 political power."
 A01_army_development:0 "Military Development"
 A01_army_development_desc:0 "An evolving national spirit. Its combined effects update as reforms progress, consequences are resolved and temporary measures expire."
 A01_australian_project_tt:0 "Australian opinion: §G+10§!. New Guinea guarantees block the Australian frontier fortification focus. After implementation: §G+10%§! defence against Japan."
 A01_balance_compromise:0 "Uneasy Equilibrium"
 A01_before_japanese_war_tt:0 "The war with the Japanese Empire has not yet begun"
 A01_begin_island_defence:0 "Begin the Defence of the Island"
 A01_begin_island_defence_desc:0 "Begin preparing the defence of Borneo. Both countries receive a shared §Y180-day§! countdown to war. Japanese preparations shorten it; Dutch concessions extend it. Japan then has §Y180 days§! to establish a foothold in at least one Borneo province."
 A01_borneo_australian_cooperation:0 "Joint Defence Project"
 A01_borneo_british_exclusion:0 "Britain Excluded from the Defence Project"
 A01_british_project_tt:0 "Sovereignty loss: §R+10§! points. British influence: §R+15§! points. After implementation: §G+15%§! defence against Japan."
 A01_british_raj_model_idea:0 "Flexible Colonialism"
 A01_british_raj_model_idea_desc:0 "Indirect governance modeled on the British Raj: native rulers cooperate with Batavia for shared prosperity."
 A01_charter_A11:0 "Grant a Charter: Kutai"
 A01_charter_A11_desc:0 "The sultanate receives its own administration and army while remaining subordinate to Batavia. Japanese oil and rubber rights remain in force."
 A01_charter_A12:0 "Grant a Charter: Pontianak"
 A01_charter_A12_desc:0 "The sultanate receives its own administration and army while remaining subordinate to Batavia. Japanese oil and rubber rights remain in force."
 A01_charter_A13:0 "Grant a Charter: Banjar"
 A01_charter_A13_desc:0 "The sultanate receives its own administration and army while remaining subordinate to Batavia. Japanese oil and rubber rights remain in force."
 A01_civic_development:0 "Civil Administration"
 A01_civic_development_desc:0 "An evolving national spirit. Its combined effects update as reforms progress, consequences are resolved and temporary measures expire."
 A01_council_influence:0 "Naval Ministry Influence"
 A01_council_obstruction:0 "Council Obstruction"
 A01_council_pressure:0 "The Council Dictates Terms"
 A01_council_supremacy:0 "Admiralty Supremacy"
 A01_council_veto:0 "Council Veto"
 A01_crown_equilibrium:0 "Settlement of Powers"
 A01_crown_order:0 "The Crown’s New Order"
 A01_crown_order_desc:0 "An evolving national spirit. Its combined effects update as reforms progress, consequences are resolved and temporary measures expire."
 A01_defeat_legacy:0 "Legacy of Defeat"
 A01_defeat_legacy_desc:0 "Destruction, unpaid compensation, budget strain, humiliation, revanchism and the reconstruction cabinet are combined here. Recovery focuses remove their respective effects."
 A01_federal_defence_compact:0 "The Sultans Ask for Another Chance"
 A01_federal_defence_compact_desc:0 "The Sultans Ask for Another Chance. Establish the institutions and guarantees of this political settlement."
 A01_future_of_netherlands:0 "In Whose Hands Is the Future of the Netherlands?"
 A01_future_of_netherlands_desc:0 "Defeat has broken the old settlement. The council demands responsibility; Indonesian communities demand freedom. The hearings will decide who has the right to govern."
 A01_golden_bridges_idea:0 "Golden Bridges of the Fleet"
 A01_golden_bridges_idea_desc:0 "Moderate naval officers are integrated into parliamentary and state institutions."
 A01_grand_council_side:0 "Grand Council"
 A01_industrial_advisor_unlocked_tt:0 "Unlock the §YBatavian Engineering Council§! advisor with the §YCaptain of Industry§! trait. Appointment costs 150 political power."
 A01_japanese_preparations_reduction_tt:0 "Japanese preparations improve. The Borneo Crisis date remains unchanged."
 A01_local_project_tt:0 "Recruitable population factor: §G+15%§!. Racial stability: §G+10%§!. Admiral respect: §R−5§! points. After implementation: §G+5%§! defence against Japan."
 A01_ludolf_authority:0 "The Governor’s Authority"
 A01_ludolf_influence:0 "Civilian Leadership"
 A01_ludolf_navy_command_idea:0 "Ludolf at the Naval Helm"
 A01_ludolf_navy_command_idea_desc:0 "Ludolf oversees naval modernization, ensuring the fleet remains loyal to the new constitutional order."
 A01_ludolf_side:0 "Ludolf Sloot van de Beele"
 A01_ludolf_supremacy:0 "A Stable Government"
 A01_military_scapegoat:0 "Military Scapegoat"
 A01_military_scapegoat_desc:0 "The shame of defeat is placed upon the admiralty. The public directs its fury at the military caste, preserving civilian authority."
 A01_national_amnesty_idea:0 "National Reconciliation"
 A01_national_amnesty_idea_desc:0 "A general amnesty following the town hall crisis defuses political tension and prevents armed officer rebellions."
 A01_no_australian_guarantees_tt:0 "No commitment to Australia prohibiting New Guinea frontier fortifications."
 A01_occupation_balance_tt:0 "§RJapanese occupation reduces Ludolf's influence:§! 10 points per state, 20 for Sabah and 25 for Batavia. Each state is counted once during this war. A peaceful lease of Brunei does not count."
 A01_own_fortifications_tt:0 "Defence against Japan: §G+20%§!. British opinion: §R−10§!. Debt commitments survive the war."
 A01_premier_pending:0 "Cabinet not yet elected"
 A01_premier_raden_surya:0 "Raden Surya"
 A01_premier_van_der_velde:0 "Hendrik van der Velde"
 A01_premier_van_rijn:0 "Matthijs van Rijn"
 A01_prepare_bornean_logistics:0 "Prepare Bornean Logistics"
 A01_prepare_bornean_logistics_desc:0 "A railway linking Jesselton, Sandakan and Tawau will carry supplies and reinforcements across Sabah."
 A01_project_implementation_tt:0 "Activate the selected project’s defence bonus against Japan."
 A01_project_selected_tt:0 "One of the three defence projects has been selected."
 A01_queen_influence:0 "The Court Gains Ground"
 A01_queen_side:0 "The Queen"
 A01_queen_supremacy:0 "The Queen’s Supremacy"
 A01_real_militia_tt:0 "Raise 12 Indonesian militia divisions, each with 3 vanilla militia battalions. These temporary units disband after the Japanese crisis."
 A01_royal_reassurances:0 "Promise of Parliamentary Government"
 A01_start: "ost-india - Start"
 A01_sultanates_language_guarantees_idea:0 "Linguistic and Legal Guarantees"
 A01_sultanates_language_guarantees_idea_desc:0 "Preserving native languages and traditional rights ensures peace across the archipelago and dampens guerrilla resistance."
 A01_wtc_debt_20_tt:0 "WTC debt increases by §R20 percentage points§!."
 A01_wtc_offer_required_tt:0 "Complete An Offer for the WTC; the WTC must exist."
 A01_wtc_postwar_unlock_tt:0 "Unlocks a postwar WTC agreement for reconstruction and debt settlement."
 A02_CANON_START_DESC:0 "London lies beyond the Song. On Bermuda, Victoria preserves the dignity of the empire while Admiral Fisher holds its scattered possessions together with the fleet. From Gibraltar to New Zealand, British harbours survive on trade, debt and the hope of returning home."
 A03_PACIFIC_START_DESC:0 "Meiji’s court seeks to strengthen Japan among rival maritime powers. New factories and shipyards must underpin its foreign policy. Saigo’s army retains power in the north, resistance continues in the Philippines, and Tokyo increasingly looks towards the oil of the southern seas."
 A03_army_reorganisation:0 "Reorganise the Imperial Army"
 A03_army_reorganisation_desc:0 "Standard establishments and regular field exercises will strengthen the western prefectural army. Unit experience will shape common manuals."
 A03_asian_liberation_crusade:0 "Liberators of Asian Peoples"
 A03_asian_liberation_crusade_desc:0 "We launch sweeping propaganda presenting Japan as the shield and sword of Asian nations against Western imperialism."
 A03_asian_liberation_crusade_idea:0 "Liberators of Asia"
 A03_asian_liberation_crusade_idea_desc:0 "Anti-colonial propaganda earns the sympathy of subject populations."
 A03_batavia_convention:0 "The Batavia Convention"
 A03_batavia_convention_desc:0 "The Batavia Convention. A sustained investment in this programme will strengthen our position in the Pacific."
 A03_batavia_ultimatum:0 "The Batavia Ultimatum"
 A03_batavia_ultimatum_desc:0 "Demand access to Borneo’s resources regardless of Batavia’s political course. Dutch refusal means immediate war."
 A03_cabinet_dissolution:0 "The Power of Dissolution"
 A03_cabinet_dissolution_desc:0 "The institutional lightning rod in practice: unpopular ministers can be sacrificed at will, defusing public fury and shielding the sovereign."
 A03_combined_operations:0 "Combined Operations"
 A03_combined_operations_desc:0 "Army and naval staffs will hold joint exercises. Coordinated action is essential to exploit a successful coastal landing."
 A03_commercial_diplomacy:0 "Commercial Diplomacy"
 A03_commercial_diplomacy_desc:0 "Trading houses can open doors closed to military delegations. Permanent missions will represent our interests in the principal Pacific ports."
 A03_conscription_register:0 "The Conscription Register"
 A03_conscription_register_desc:0 "Complete service registers will allow replacements to be prepared in advance. Reservists will train before receiving operational assignments."
 A03_constitutional_debate:0 "Debate over Meiji's Sovereign Rule"
 A03_constitutional_debate_desc:0 "Tokyo is gripped by a defining political dilemma: should the Tenno rule directly, bearing the burden of every earthly failure, or does the monarch require a Prime Minister?"
 A03_continental_ambitions:0 "Continental Ambitions"
 A03_continental_ambitions_desc:0 "Modern infantry doctrine and expanded workshops channel radical army energy into disciplined imperial preparations."
 A03_continental_army_appeased:0 "Continental Army Appeased"
 A03_continental_army_appeased_desc:0 "Saigo's Northern Army receives generous funding and prepares for future continental warfare."
 A03_direct_imperial_rule:0 "Direct Imperial Rule"
 A03_direct_imperial_rule_desc:0 "Reject bureaucratic intermediaries. Meiji rules the empire and armed forces personally through unyielding sacred authority."
 A03_direct_rule_idea:0 "Direct Meiji Rule"
 A03_direct_rule_idea_desc:0 "The Emperor governs personally without intermediaries or compromise."
 A03_divine_sovereignty:0 "Divine Sovereign Authority"
 A03_divine_sovereignty_desc:0 "The sacred will of the Tenno demands total obedience; the nation is mobilized for absolute devotion."
 A03_divine_sovereignty_idea:0 "Divine Sovereign Authority"
 A03_divine_sovereignty_idea_desc:0 "Unquestioning devotion to the sacred throne."
 A03_electrical_workshops:0 "Electrical Workshops"
 A03_electrical_workshops_desc:0 "Telegraphs, generators and instruments demand new manufacturing skills. Dedicated workshops will support the growing electrical industry."
 A03_field_artillery:0 "Field Artillery"
 A03_field_artillery_desc:0 "Infantry needs reliable fire support. Expanding Shikoku arms factories will underpin artillery supply."
 A03_fleet_exercises:0 "Combined Fleet Exercises"
 A03_fleet_exercises_desc:0 "Ships must learn to operate together before war begins. Major manoeuvres will test communications, reconnaissance and squadron coordination."
 A03_grand_southern_mandate:0 "The Grand Southern Push"
 A03_grand_southern_mandate_desc:0 "The Imperial Court subordinates army and navy rivalries to a single strategic destiny: dominating the South Seas to seize Pacific raw resources."
 A03_grand_southern_mandate_idea:0 "Grand Southern Mandate"
 A03_grand_southern_mandate_idea_desc:0 "A unified expansion doctrine directs army and navy toward dominating Pacific resources."
 A03_hiroshima_arsenal:0 "Hiroshima Arsenal"
 A03_hiroshima_arsenal_desc:0 "Hiroshima workshops will receive machinery for series production. An expanded arsenal will reduce dependence on foreign arms suppliers."
 A03_imperial_authority:0 "Imperial Authority"
 A03_imperial_authority_desc:0 "Imperial authority unites the cabinet and military command."
 A03_imperial_council:0 "Three Heads of the Dragon"
 A03_imperial_council_desc:0 "Meiji appoints Ito prime minister. Iwasaki controls Mitsubishi credit, Saigo controls the North, and Ito directs the southern campaign. Settle finance, northern supply and Manila before approving the military budget. The appointment starts a 180-day Mitsubishi deadline."
 A03_imperial_predator:0 "Pacific Predator"
 A03_imperial_predator_desc:0 "Japan stands as an expansionist predator: a dazzling exterior of pan-Asian liberation powered by the ruthless engine of internal exploitation."
 A03_imperial_university:0 "Imperial Technical University"
 A03_imperial_university_desc:0 "Engineering faculties must work alongside arsenals and shipyards. A new university will provide industry with trained specialists."
 A03_industrial_power:0 "An Industrial Power"
 A03_industrial_power_desc:0 "The arsenal network must produce arms on an imperial scale. Expanding Hiroshima factories will complete the first industrial programme."
 A03_kansai_railways:0 "Kansai Railways"
 A03_kansai_railways_desc:0 "Railways will link Osaka factories with Nagoya industry. Regular transport will reduce costs and accelerate troop deployment."
 A03_kempeitai_control_idea:0 "Kempeitai Control"
 A03_kempeitai_control_idea_desc:0 "Ruthless military policing stifles partisan networks."
 A03_kempeitai_iron_fist:0 "The Iron Grip of Kempeitai"
 A03_kempeitai_iron_fist_desc:0 "Behind the glittering façade lies total military police control. Resistance, strikes, and partisan activity are suppressed without mercy."
 A03_kure_yards:0 "Kure Naval Yards"
 A03_kure_yards_desc:0 "Kure harbours are suited to a major shipbuilding centre. Expanded docks will support the growing squadron."
 A03_labor_battalions:0 "Labor Battalions"
 A03_labor_battalions_desc:0 "Forced native labor builds airfields, railways, fortifications, and naval bases under strict military discipline."
 A03_labor_battalions_idea:0 "Forced Labor Battalions"
 A03_labor_battalions_idea_desc:0 "Mobilized colonial labor rapidly constructs military infrastructure."
 A03_landing_forces:0 "Naval Landing Forces"
 A03_landing_forces_desc:0 "Island warfare requires specialised training. Landing forces will practise going ashore, seizing quays and holding bridgeheads."
 A03_manage_triple_split:0 "The Triple Split"
 A03_manage_triple_split_desc:0 "Behind Japan's monolithic exterior lies a bitter three-way struggle: the Imperial Center, the radical continental army militarists, and the maritime zaibatsu and navy. To survive, the Throne must navigate between these rival camps."
 A03_merchant_marine:0 "Merchant Marine"
 A03_merchant_marine_desc:0 "Overseas bases need merchant shipping to survive. Government orders will add tonnage and train new crews."
 A03_naval_programme:0 "Imperial Naval Programme"
 A03_naval_programme_desc:0 "Occasional purchases cannot build a strong navy. A Nagasaki construction programme will provide regular shipbuilding and repairs."
 A03_naval_zaibatsu_compromise:0 "Pact with Zaibatsu and Navy"
 A03_naval_zaibatsu_compromise_desc:0 "Mitsubishi and Osaka shipbuilders demand raw materials and state contracts. We forge an indissoluble bond between industrial capital and naval power."
 A03_naval_zaibatsu_pact:0 "Navy-Zaibatsu Alliance"
 A03_naval_zaibatsu_pact_desc:0 "The partnership between Mitsubishi and navy shipyards guarantees maritime strength."
 A03_osaka_industry:0 "The Osaka Industrial District"
 A03_osaka_industry_desc:0 "Osaka trading houses and workshops can underpin modern industry. The government will support construction of larger factories."
 A03_pacific_predator_idea:0 "Pacific Predator"
 A03_pacific_predator_idea_desc:0 "The synthesis of anti-colonial rhetoric and ruthless exploitation makes Japan the dominant power of the Pacific."
 A03_pacific_prosperity:0 "Pacific Prosperity"
 A03_pacific_prosperity_desc:0 "The Batavia agreement has secured raw material supplies. Kansai industrialists can now invest in new factories backed by reliable trade."
 A03_pacific_resource_lifeline:0 "Pacific Resource Lifeline"
 A03_pacific_resource_lifeline_desc:0 "Japanese industry depends upon Borneo oil and Indonesian rubber. Kure slipways and convoy routes guarantee the flow of strategic wealth."
 A03_pan_asian_brotherhood:0 "Pan-Asian Brotherhood"
 A03_pan_asian_brotherhood_desc:0 "Fostering local collaborationist councils co-opts native elites into serving imperial administration."
 A03_pan_asian_brotherhood_idea:0 "Pan-Asian Brotherhood"
 A03_pan_asian_brotherhood_idea_desc:0 "Collaborating native elites assist imperial control."
 A03_placate_continental_army:0 "Appeasing Continental Militarists"
 A03_placate_continental_army_desc:0 "Saigo's Northern Army demands war on the mainland. We reaffirm their continental priorities, fund arsenal expansion, and prepare officers for future mainland campaigns."
 A03_prefectural_reform:0 "Prefectural Reform"
 A03_prefectural_reform_desc:0 "Common tax and reporting rules will strengthen ties between the capital and the prefectures, funding a sustained programme of reform."
 A03_prime_minister_filter:0 "The Prime Minister as Political Filter"
 A03_prime_minister_filter_desc:0 "Instituting a Prime Minister and Cabinet creates an indispensable buffer. The Premier handles diplomacy, legislation, and taxation, insulating the divine Emperor from secular strife."
 A03_privy_council_arbiters:0 "Privy Council of Genro"
 A03_privy_council_arbiters_desc:0 "Elder statesmen serve as behind-the-scenes arbiters, quietly orchestrating cabinet dismissals without endangering the throne."
 A03_privy_council_idea:0 "Privy Council of Genro"
 A03_privy_council_idea_desc:0 "Elder statesmen provide political stability and arbitrate disputes."
 A03_sacred_shield_idea:0 "Sacred Lightning Rod of the Crown"
 A03_sacred_shield_idea_desc:0 "The Prime Minister absorbs political backlash, preserving the sacred prestige of the Emperor."
 A03_sacred_shield_monarch:0 "The Monarch's Sacred Lightning Rod"
 A03_sacred_shield_monarch_desc:0 "The Emperor is proclaimed sacred and inviolable. In times of military setback or political crisis, all public blame falls upon the Prime Minister. Cabinets can be dissolved in disgrace while the Tenno remains unblemished."
 A03_showcase_of_prosperity:0 "Showcase of Prosperity"
 A03_showcase_of_prosperity_desc:0 "Across ports and borderlands we erect showcase boulevards, model schools, and pavilions, displaying 'Japanese prosperity' to the international community."
 A03_showcase_of_prosperity_idea:0 "Showcase of Prosperity"
 A03_showcase_of_prosperity_idea_desc:0 "Model colonial boulevards conceal ruthless economic extraction."
 A03_southern_bases:0 "Southern Forward Bases"
 A03_southern_bases_desc:0 "Palau will serve as a staging base between the home islands and the southern seas. Workshops and transports will sustain a prolonged campaign."
 A03_southern_campaign:0 "The Southern Campaign"
 A03_southern_campaign_desc:0 "Prepare marines, heavy ships and supplies. Completing the programme shortens the active invasion countdown by another 15 days; war begins when that countdown expires."
 A03_southern_reconstruction:0 "Reconstruct the Southern Territories"
 A03_southern_reconstruction_desc:0 "The Borneo Convention awarded Japan the northern territories and Limbang. Restore industry in Sabah and consolidate the settlement."
 A03_southern_strategy:0 "The Southern Strategy"
 A03_southern_strategy_desc:0 "Southern sea routes lead to imperial resources and bases. The naval staff will prepare a common plan should diplomacy fail."
 A03_standard_rifles:0 "Standard Service Rifle"
 A03_standard_rifles_desc:0 "Mixed rifle types complicate regimental supply. A standard service weapon and common parts will simplify production and repair."
 A03_steel_contracts:0 "Steel Contracts"
 A03_steel_contracts_desc:0 "Long-term contracts will give steel producers confidence in future orders. Reliable metal supplies will accelerate industrial construction."
 A03_total_resource_drain:0 "Total Resource Extraction"
 A03_total_resource_drain_desc:0 "Borneo crude, Indonesian rubber, and minerals are pumped directly into the imperial war machine. Colonial exploitation is maximized."
 A03_total_resource_drain_idea:0 "Resource Drain"
 A03_total_resource_drain_idea_desc:0 "Maximum extraction of colonial raw materials fuels industrialization."
 A03_triple_split_balance:0 "Fragile Factional Balance"
 A03_triple_split_balance_desc:0 "The court expends enormous effort balancing continental army generals, naval industrialists, and Tokyo."
 A03_two_faced_colonialism:0 "Two-Faced Colonial Façade"
 A03_two_faced_colonialism_desc:0 "The Empire establishes a dual colonial system: externally, heroic liberators of Asia from European masters; internally, ruthless resource extraction."
 A04_CANON_START_DESC:0 "The World Trade Chamber has no empire on the map: its power is recorded in ledgers. From Funchal, Director Lambert binds the islands with credit, warehouses and trade agreements. Every new war threatens the sea lanes; every new technology may undermine the old debts."
 A05_CANON_START_DESC:0 "Exiles from the fallen American North have found a new foothold in Havana. Admiral Graves holds the Iron Union together through military discipline, but Cuba is divided between irreconcilable heirs of the old world. The struggle for the islands has already become a war."
 A06_CANON_START_DESC:0 "Iceland shelters the emperor, his court and the name of a fallen empire. Alexander III seeks a future for Russian exile, but Pobedonostsev sees modernisation as a threat to faith and order. While the court debates Tesla’s work, the shortage of people grows more dangerous than any foreign enemy."
 A06_pobedonostsev_advisor:0 "Konstantin Pobedonostsev"
 A07_CANON_START_DESC:0 "George Dibbs governs New South Wales from Sydney. Ports, industry and trade give the colony influence among its Australian neighbours. The British Crown retains sovereignty, but disputes over tariffs and future federation demand a policy of its own."
 A08_CANON_START_DESC:0 "On Hokkaido, Saigo Takamori’s army guards its own vision of Japan’s destiny. Military discipline and Shinto faith stand against the southern fleet and Osaka’s trading houses. The archipelago is divided, but none of its rulers considers the division final."
 A09_CANON_START_DESC:0 "In Osaka, trade holds power. Iwasaki Yanosuke steers the republic between the imperial fleet and the Northern Army as Mitsubishi’s debts narrow its choices. Factories and maritime connections provide strength, but gold alone may not preserve independence."
 A10_CANON_START_DESC:0 "Manila, Bataan and northern Luzon are occupied by Japan. Only Cavite accepts central authority unconditionally. Local governments across the other islands demand self-rule."
 A10_FED:0 "Federation of the Philippine Islands"
 A10_FED_ADJ:0 "Philippine"
 A10_FED_DEF:0 "Federation of the Philippine Islands"
 A10_FED_neutrality:0 "Federation of the Philippine Islands"
 A10_FED_neutrality_DEF:0 "Federation of the Philippine Islands"
 A10_confederate_member:0 "Philippine Confederate Member"
 A10_confederate_member_desc:0 "Self-government under a common military command: units deploy to the Confederation and members must answer calls to war."
 A10_confederation_faction:0 "Confederation of the Philippine Islands"
 A10_pacify_1026:0 "Pacification: [1026.GetName]"
 A10_pacify_1026_desc:0 "Over 30 days, gain 10 compliance and reduce resistance by 10. Requires ownership and control."
 A10_pacify_1027:0 "Pacification: [1027.GetName]"
 A10_pacify_1027_desc:0 "Over 30 days, gain 10 compliance and reduce resistance by 10. Requires ownership and control."
