 A10_pacify_628:0 "Pacification: [628.GetName]"
 A10_pacify_628_desc:0 "Over 30 days, gain 10 compliance and reduce resistance by 10. Requires ownership and control."
 JPC_1895_accounts:0 "The Protracted War Budget"
 JPC_1895_accounts_desc:0 "Revisit the war budget when the cabinet judges its old estimates inadequate. There is no calendar-year lock; the review costs focus time."
 JPC_australian_assurances:0 "Assurances to Sydney"
 JPC_australian_assurances_desc:0 "We make no demands on Australia. Sydney will decide whether this is enough while war rages on its northern approaches."
 JPC_batavia_demands:0 "Navy: Southern Campaign Plan"
 JPC_batavia_demands_desc:0 "Navy — second reform stage. Unlocked by the defence budget.\n\nSpend 35 days coordinating demands and fleet orders. The ultimatum date stays fixed; preparation prevents 120 days of hurried-order penalties. That time could instead go to Mitsubishi, the North or Manila."
 JPC_borneo_bridgehead:0 "A Foothold on Borneo"
 JPC_borneo_bridgehead_desc:0 "Ito must hold a foothold until negotiations. A landing does not make all Indonesia conquered territory."
 JPC_casualty_returns:0 "Letters from Two Fronts"
 JPC_casualty_returns_desc:0 "Publish casualty lists and support families. Triumphant communiqués cannot sustain public support indefinitely."
 JPC_convoy_budget:0 "Build Merchant Transports"
 JPC_convoy_budget_desc:0 "Admirals must postpone prestige orders. Regular voyages between bases sustain the war."
 JPC_count_the_cost:0 "Count the Cost"
 JPC_count_the_cost_desc:0 "The treaty ends the Batavian war, not the Philippine conflict. Honest accounts matter more than a victory parade."
 JPC_defeat_inquest:0 "Answer to the Throne"
 JPC_defeat_inquest_desc:0 "Investigate defeat and admit that Borneo oil cannot pay the debt. Restructuring cuts pressure by 20 and raises confidence by 5, at a 4% stability loss and 180 days of civilian retrenchment. Peace and repayment can then close the emergency ledger."
 JPC_garrison_accounts:0 "Rearm and Supply Manila"
 JPC_garrison_accounts_desc:0 "Rearm the garrison and prioritise Manila convoys. This prepares the southern theatre without granting victory over the Philippines. The military budget and Borneo campaign require this focus."
 JPC_hold_until_talks:0 "Hold Until the Conference"
 JPC_hold_until_talks_desc:0 "The WTC prepares mediation. In February 1896 actual control will decide Borneo’s fate."
 JPC_honolulu_letters:0 "A Letter to Kalakaua"
 JPC_honolulu_letters_desc:0 "Request commercial services while respecting the kingdom’s independence. Hawaii may refuse our agents."
 JPC_honshu_depots:0 "Regular Northern Supplies"
 JPC_honshu_depots_desc:0 "Build depots and establish regular Hokkaido supply. Under the peaceful protocol, stocks below three months trigger monthly shipments of 250 rifles and four convoys when available. Shortages still undermine Saigo trust."
 JPC_hospital_ships:0 "The Return Voyages"
 JPC_hospital_ships_desc:0 "Transports must bring the wounded home. Military hospitals become the rival ministries’ first shared undertaking."
 JPC_imperial_inspection:0 "The Emperor Reads the Lists"
 JPC_imperial_inspection_desc:0 "Meiji visits hospitals and demands reports stripped of triumphal phrases. National unity needs constant maintenance."
 JPC_iwasaki_accounts:0 "Open the War Ledgers"
 JPC_iwasaki_accounts_desc:0 "Iwasaki’s accounts must withstand treasury scrutiny. Auditing does not cancel debt; it helps plan the next convoy."
 JPC_manila_priority:0 "Supply Manila"
 JPC_manila_priority_desc:0 "Ito uses Manila to justify borrowing and northern compromise. Organise food, ammunition and protected shipping. This column is mandatory for the budget and the road to Borneo."
 JPC_no_short_war:0 "There Will Be No Short War"
 JPC_no_short_war_desc:0 "Acknowledge that there will be no quick settlement and open replacement programmes. The cabinet can decide during the war without waiting for 1894."
 JPC_northern_protocol:0 "Reach an Agreement with Saigo"
 JPC_northern_protocol_desc:0 "Preserve peace and Hokkaido autonomy, freeing the army for the continent. Saigo receives supplies and a non-aggression pact. His Greenland expedition continues unless recalled by a separate decision requiring trust above 54."
 JPC_nz_watch:0 "The Shadow of New Zealand"
 JPC_nz_watch_desc:0 "New Zealand is a British strongpoint. Watching its ports helps us face Leviathan’s pressure without granting bases on foreign soil."
 JPC_oil_promise:0 "Honour Iwasaki’s Promise"
 JPC_oil_promise_desc:0 "Mitsubishi presents its guarantee. The monopoly applies only to territory actually acquired and does not settle the entire debt."
 JPC_one_war_cabinet:0 "A Cabinet for One War"
 JPC_one_war_cabinet_desc:0 "Form a wartime cabinet in 35 days once war begins. Any one of the four preparations is sufficient; the others may be finished later."
 JPC_osaka_orders:0 "Industry: Honshu Factories"
 JPC_osaka_orders_desc:0 "After backing the Admiralty, develop civilian factories in Tokyo-owned Honshu to support the southern campaign. This leads to armament and dockyard programmes."
 JPC_partial_demobilisation:0 "Send Some of Them Home"
 JPC_partial_demobilisation_desc:0 "Philippine garrisons remain, but the Borneo campaign is over. Some military spending can now be reduced."
 JPC_pledged_yards:0 "Expand Japanese Dockyards"
 JPC_pledged_yards_desc:0 "Expand Japanese dockyards after developing Honshu factories to support the southern campaign. Wartime orders may generate a separate treasury invoice."
 JPC_rebuild_ports:0 "Oil Needs Ports"
 JPC_rebuild_ports_desc:0 "A victorious treaty does not repair quays. Funds go to Sabah only while it belongs to the empire."
 JPC_regional_dispatches:0 "Dispatches from Southern Ports"
 JPC_regional_dispatches_desc:0 "Sydney is alarmed, Honolulu values neutrality, and British New Zealand bases watch our routes."
 JPC_replace_losses:0 "Expand Armament Production"
 JPC_replace_losses_desc:0 "Expand armament production and order additional transports after building an armament factory. Part of the Admiralty programme; war is not required."
 JPC_state_guarantees:0 "Underwrite Tomorrow’s Oil"
 JPC_state_guarantees_desc:0 "Osaka banks and merchant houses hold Mitsubishi bills. State guarantees avert collapse and save the Golden Mean Party, but dependence on Iwasaki costs 0.10 political power daily and 3% consumer goods. These domestic bills are separate from WTC credit."
 JPC_sulu_escorts:0 "Convoys through the Sulu Sea"
 JPC_sulu_escorts_desc:0 "Piracy and the Philippine war threaten the same route. Assign escorts without claiming sovereignty over the sultanate."
 JPC_three_heads_again:0 "Three Heads Again"
 JPC_three_heads_again_desc:0 "The enemy no longer binds the council. Saigo waits, Iwasaki demands payment, Ito asks for new ships. This ends the first chapter; it does not heal the empire."
 JPC_war_workshops:0 "Build Armament Factories"
 JPC_war_workshops_desc:0 "Build an armament factory on our civilian industrial base as part of the Admiralty programme. War is not required."
 JPC_wtc_mission:0 "The Creditors of Funchal"
 JPC_wtc_mission_desc:0 "The WTC trades with both sides. Its money buys time and ties future extraction to debt payments."
 JPD_engineering_schools:0 "Train Japanese Engineers"
 JPD_engineering_schools_desc:0 "Establish engineering schools alongside factories. Local specialists will accelerate the next industrial research programmes."
 JPD_finance_resolved_tt:0 "The wartime ledger has been closed through the treasury decision."
 JPD_industrial_power:0 "An Independent Industrial Power"
 JPD_industrial_power_desc:0 "Local engineers, standardized production and sustainable finance complete the industrial reform. Improve output and production efficiency and establish an additional permanent research slot."
 JPD_integrated_staff:0 "A Permanent Joint Staff"
 JPD_integrated_staff_desc:0 "After demobilization, replace the temporary wartime arrangement with a permanent staff coordinating land and naval operations. Preserve the lessons of Borneo and Manila."
 JPD_north_settled_tt:0 "The permanent compact with Saigo has been signed."
 JPD_ocean_fleet:0 "An Ocean-Going Fleet"
 JPD_ocean_fleet_desc:0 "Combine marine training, Sulu convoy experience and intelligence on British bases into permanent fleet procedures. Improve fleet organization and reduce naval supply costs."
 JPD_professional_logistics:0 "A Professional Army Supply Service"
 JPD_professional_logistics_desc:0 "Turn the garrison supply and rotation reforms into a permanent army service. Better accounting and delivery reduce supply consumption and improve organization."
 JPD_reformed_empire:0 "The Reformed Empire"
 JPD_reformed_empire_desc:0 "Industrial reform, a settled government and permanent military institutions have transformed the provisional coalition. Consolidate the new state without erasing its oil obligations or colonial responsibilities."
 JPD_settle_three_heads:0 "Settle the Three-Headed Crisis"
 JPD_settle_three_heads_desc:0 "With military interests reconciled, imperial powers settled and Saigo's permanent compact signed, end the emergency rivalry between factions. Hokkaido remains autonomous and industrial concessions remain binding."
 JPD_standard_orders:0 "Standardize Industrial Orders"
 JPD_standard_orders_desc:0 "Coordinate factory and dockyard specifications, acceptance and delivery schedules. Separate contracts become a permanent industrial system."
 JPD_sustainable_credit:0 "Establish Sustainable Public Finance"
 JPD_sustainable_credit_desc:0 "With the wartime ledger closed and supplier payments organized, replace emergency borrowing with predictable financing. Existing oil obligations remain in force."
 JPF_bond_register:0 "Register of Promises"
 JPF_bond_register_desc:0 "Every hull has a creditor. Separate public bonds from Mitsubishi liabilities and open regular repayments."
 JPF_civil_budget:0 "A Budget After War"
 JPF_civil_budget_desc:0 "Close the emergency ledger after all wars, oil settlement, Chamber repayment and restored confidence. Solvency does not reunite the empire."
 JPF_coal_not_glory:0 "Coal Before Glory"
 JPF_coal_not_glory_desc:0 "Reserve coal for active squadrons. Lower fleet supply consumption requires another expenditure now."
 JPF_delivery_calendar:0 "Pay for Military Supplies"
 JPF_delivery_calendar_desc:0 "After borrowing reform the treasury pays military orders. Mitsubishi collapse blocks this focus until emergency restructuring finishes. Paid supplies are required for the common budget."
 JPF_excise_bargain:0 "The Excise Bargain"
 JPF_excise_bargain_desc:0 "Excises pay creditors without new borrowing, at the cost of confidence, stability and construction."
 JPF_madeira_table:0 "The Madeira Table"
 JPF_madeira_table_desc:0 "The Chamber offers bridge credit under Silver Convoy insurance: transports and two debt ledgers, or civilian retrenchment."
 JPF_public_accounts:0 "Reform State Borrowing"
 JPF_public_accounts_desc:0 "Audit private bills and state liabilities. Reform averts a future collapse even after treasury assumption, but does not remove Iwasaki dependence or Osaka distrust. An existing collapse requires the restructuring decision."
 JPF_return_small_savings:0 "Return Small Deposits"
 JPF_return_small_savings_desc:0 "Families cannot wait as long as banks. Open redemption of small deposits once debt pressure permits."
 JPF_royalty_register:0 "Royalties, Not Promises"
 JPF_royalty_register_desc:0 "Borneo oil was pledged in advance. Royalties service the debt; Mitsubishi retains its promised monopoly."
 JPF_small_subscription:0 "Mitsubishi’s Quick Advance"
 JPF_small_subscription_desc:0 "In 14 days receive 20 transports and open subscriptions: pressure +10, confidence +5. Independent audits wait until postwar redemption. Excludes public credit control."
 JPI_airship_hangars:0 "Sky Shipyards"
 JPI_airship_hangars_desc:0 "Apply known aeronautical principles to a domestic series of 24 airships. Their production cost falls by 15%; ship output falls by 10%, and the heavy reinforcement squadron is not built."
 JPI_closed_ports:0 "Reliance on Our Own Strength"
 JPI_closed_ports_desc:0 "Choose domestic industry: a military factory, an industrial research bonus and access to the Kyushu coal or oil programme choice. Resource accounting is included in this focus."
 JPI_coastal_trials:0 "Generator Sea Trials"
 JPI_coastal_trials_desc:0 "Complete shipboard power: 8% less naval supply consumption, 10% faster invasion preparation, 15 naval experience and 10 convoys. Provides technical readiness for the Southern Push. This route does not grant portable towers."
 JPI_copied_samples:0 "Japanese Machine Designs"
 JPI_copied_samples_desc:0 "Reverse-engineer samples without acknowledging their source. This takes longer; our limited intelligence network still leaves a 20% risk of exposure."
 JPI_electrical_bureau:0 "Tesla Bureau"
 JPI_electrical_bureau_desc:0 "Centralise electrical development in one bureau. Grants a 50% bonus to one industrial research. Excludes fleet workshops. Either organisation can develop portable towers or shipboard generators."
 JPI_fleet_workshops:0 "Fleet Workshops"
 JPI_fleet_workshops_desc:0 "Delegate electrical development to fleet workshops. Grants 15 naval experience and 5% dockyard construction speed, but adds 5 debt pressure. Excludes the central Tesla bureau; either organisation can choose either power programme."
 JPI_japanese_terms:0 "Dictate the Terms of Trade"
 JPI_japanese_terms_desc:0 "Acquire machinery on Japanese terms: external contracts, local tungsten and chromium, then choose proxy purchases or copied samples. Contract preparation is included in this focus."
 JPI_kure_yards:0 "Expand the Kure Shipyards"
 JPI_kure_yards_desc:0 "Expand Kure’s existing slipways and prepare a heavy squadron. Ship output rises by 10%, but transferring specialists increases aircraft production cost by 10%. The sky shipyards must go unfunded."
 JPI_kyushu_coal:0 "Kyushu Coalfields"
 JPI_kyushu_coal_desc:0 "Steam remains the squadron’s foundation. Developing Kyushu coalfields speeds dockyard construction by 15%, but maintaining the coal network increases naval supply consumption by 10%."
 JPI_leak_tt:0 "Procurement details leaked: squadron secrecy is compromised for 180 days."
 JPI_oil_hunger:0 "Black Gold of the South"
 JPI_oil_hunger_desc:0 "The fleet still burns coal, but future engines will need oil refining. Gain two 100% refining research bonuses; retooling reduces military factory output by 10% for 180 days. The southern expedition is brought forward by 30 days."
 JPI_portable_prototype:0 "Portable Towers"
 JPI_portable_prototype_desc:0 "Spend 25 political power developing portable Tesla towers. Excludes shipboard generators and unlocks coastal trials. The completed system improves fleet combat performance and provides 20 convoys."
 JPI_proxy_machines:0 "Purchases through Third Parties"
 JPI_proxy_machines_desc:0 "Front buyers deliver machinery quickly. There is a 35% chance of exposure, compromising the future squadron."
 JPI_quiet_coast:0 "Coastal Tower Trials"
 JPI_quiet_coast_desc:0 "Complete the portable tower programme: the existing electrical fleet combat spirit, 20 convoys and technical readiness for the Southern Push."
 JPI_raw_register:0 "Inventory the Empire’s Resources"
 JPI_raw_register_desc:0 "Inventory domestic supplies so mines and workshops can operate without the Chamber."
 JPI_scarlet_iron:0 "Scarlet Sails: Heavy Ships"
 JPI_scarlet_iron_desc:0 "A consequence of Japan’s chosen industrial programme."
 JPI_scarlet_sails:0 "Scarlet Sails"
 JPI_scarlet_sails_desc:0 "Combine the selected industrial, shipbuilding and electrical policies into one doctrine. Requires either tower trials or generator sea trials. Rewards depend on the resource and yard choices."
 JPI_scarlet_sky:0 "Scarlet Sails: Airships over the Coast"
 JPI_scarlet_sky_desc:0 "A consequence of Japan’s chosen industrial programme."
 JPI_ship_generators:0 "Shipboard Generators"
 JPI_ship_generators_desc:0 "Spend 15 political power developing shipboard generators and receive 5,000 fuel. Excludes portable towers. Sea trials will reduce supply consumption and speed invasion preparation."
 JPI_southern_push:0 "Operation Nanyō"
 JPI_southern_push_desc:0 "Nanyō is the Imperial Admiralty’s southern expedition. Tested electrical stations and a prepared squadron open the way to Borneo. The ultimatum is issued when preparations expire, or immediately if already overdue. The oil programme cuts another 15 days from an active countdown."
 JPI_standard_node:0 "Standardise Production"
 JPI_standard_node_desc:0 "Whatever the source of materials and machinery, our vessels need interchangeable assemblies. Any one of the four routes is sufficient."
 JPI_towers_tt:0 "Portable towers are ready. Their roughly 500 m coverage is represented by a landing bonus, not a separate map area."
 JPI_unsigned_contracts:0 "Secret Trade Agreements"
 JPI_unsigned_contracts_desc:0 "Trading houses place the orders. Tungsten and chromium reach our port; the Chamber retains copies of the manifests."
 JPL_borneo_is_not_luzon:0 "Borneo Is Not Luzon"
 JPL_borneo_is_not_luzon_desc:0 "Oil peace leaves Manila’s roads contested. Return escorts from Borneo at a fresh financial cost."
 JPL_convoy_timetable:0 "Escorts for Manila"
 JPL_convoy_timetable_desc:0 "28 days to prioritise Manila. Reduce burden now and monthly growth by 2, paying for escorts and losing fleet organisation. Excludes Borneo priority."
 JPL_forward_workshops:0 "Forward Repair Workshops"
 JPL_forward_workshops_desc:0 "Prioritise repairs and reserves: 500 rifles and a permanent 5% reduction in supply consumption. Costs 5 debt pressure and 5 garrison fatigue as rotations are postponed. Excludes medical rotation."
 JPL_limited_mandate:0 "Limits of the Manila Mandate"
 JPL_limited_mandate_desc:0 "Make the administration accountable for purchasing and pay. This reduces political costs while the Confederation war continues."
 JPL_medical_rotation:0 "No Third Tour in the Tropics"
 JPL_medical_rotation_desc:0 "Fund hospital ships and garrison rotations. Reduces fatigue, improves stability and grants experience at a political cost. Excludes forward repair workshops; either choice unlocks professional logistics."
 JPL_municipal_buyers:0 "Municipal Purchasing Agents"
 JPL_municipal_buyers_desc:0 "Local purchases cost more than requisitions and less than another expedition. Municipal contracts increase Mitsubishi debt."
 JPL_names_and_units:0 "Main Forces for Borneo"
 JPL_names_and_units_desc:0 "In 14 days reserve the main force for Borneo. Gain fleet organisation and coordination; Manila burden +8, fatigue +5. Open rotations and payroll inquiries instead of permanent escorts. Excludes Manila priority."
 JPL_payroll_inquiry:0 "The Payroll Inquiry"
 JPL_payroll_inquiry_desc:0 "Missing wages connect officials, suppliers and officers. Expose the books, reducing burden while disrupting the garrison’s patronage."
 JPL_port_and_mountains:0 "The Port and the Mountains"
 JPL_port_and_mountains_desc:0 "Manila’s port is occupied; Aguinaldo holds the mountains. Shorten the supply perimeter at the cost of fatigue and morale."
 JPL_quartermaster_school:0 "The Quartermasters’ School"
 JPL_quartermaster_school_desc:0 "Army — second reform stage. Requires the defence budget.\n\nCount losses at the pier before combat. Trained quartermasters cut monthly burden growth by another point."
 JPL_supply_board:0 "Manila Supply Board"
 JPL_supply_board_desc:0 "Army — second reform stage. Requires the defence budget.\n\nReplace competing military orders with a single port contract. Monthly burden growth falls by one."
 JPN_north_admiralty_hearing:0 "The Admiralty Hearing"
 JPN_north_admiralty_hearing_desc:0 "Ito calls neutrality a coward’s privilege. Hear his officers without demanding northern divisions."
 JPN_north_civilian_holds:0 "Bread Before Rifles"
 JPN_north_civilian_holds_desc:0 "28 days to arrange civilian charters. Opens three grain convoys with less naval resentment. Excludes postponements; northern deliveries take priority."
 JPN_north_emergency_calendar:0 "A Written Postponement"
 JPN_north_emergency_calendar_desc:0 "In 14 days authorise two wartime postponements. Naval resentment −8, northern trust −5. Excludes civilian grain charters; ships serve the southern campaign."
 JPN_north_imperial_arbitration:0 "Settle Northern Supply"
 JPN_north_imperial_arbitration_desc:0 "After agreement, reconcile civilian shipments and concessions to Saigo; after rebellion, organise the northern front. Either route opens the budget. The military route grants no automatic victory and its costs last until Hokkaido is subdued."
 JPN_north_inspection_channel:0 "Inspectors Without Soldiers"
 JPN_north_inspection_channel_desc:0 "Inspect warehouses without an occupation force. Negotiate the commission’s authority with Saigo."
 JPN_north_keep_distance:0 "Peace at a Distance"
 JPN_north_keep_distance_desc:0 "Accept the compact’s limits: no northern soldiers and no Tokyo command over its stores. Permanent obligations replace recurring ultimatums."
 JPN_north_permanent_protocol:0 "Permanent Northern Protocol"
 JPN_north_permanent_protocol_desc:0 "Trust above 54, resentment below 60 and real supplies allow a compact. Hokkaido retains neutrality, its army and government."
 JPN_north_postwar_audience:0 "The Telegram Returns"
 JPN_north_postwar_audience_desc:0 "The war is over, and the North still awaits an answer. Discuss permanent supply without Saigo’s submission."
 JPN_north_supply_register:0 "Northern Waybills"
 JPN_north_supply_register_desc:0 "Saigo’s neutrality rests on deliveries. Every crate sent north is absent from Borneo."
 JPN_north_tokyo_auditors:0 "Audit Tokyo Too"
 JPN_north_tokyo_auditors_desc:0 "Inspect the senders as well. Monthly naval resentment falls, with a limited treasury saving."
 JPR_defence_budget:0 "Politics: Defence Budget"
 JPR_defence_budget_desc:0 "The common budget requires paid military supplies, settled northern supply through either peace or war, and a rearmed Manila. Resolve any Mitsubishi collapse. Approval opens the Scarlet Sails industrial branch and its Southern Push toward Borneo."
 JPT_north_front_supply:0 "Supply the Northern Front"
 JPT_north_front_supply_desc:0 "Issue 500 rifles and organise front supply at the cost of 8 debt pressure. Opens the northern supply settlement; the army must still win the civil war."
 JPT_north_rebellion:0 "Declare the North in Rebellion"
 JPT_north_rebellion_desc:0 "Resume civil war with Hokkaido. Ito escapes concessions to Saigo, but the northern front costs 5% consumer goods, 10% supply consumption and 8% stability. Saigo’s expedition remains a threat until the North is subdued."
 JPT_north_settled_tt:0 "A permanent Saigo compact is signed or rebellious Hokkaido has been subdued."
 JPT_treasury_debts:0 "Assume Debts under the Treasury"
 JPT_treasury_debts_desc:0 "Take direct control of Mitsubishi liabilities. Iwasaki loses leverage, but Osaka distrust costs 8% civilian factory construction speed, 4% military factory output and 4% stability. Assumption alone does not avert collapse: complete borrowing reform within 180 days."
 JPX_kami:0 "Shinto Restoration"
 JPX_kami_desc:0 "Alternative route: a two-focus prologue. Further content is not implemented yet. The main campaign and its industry require backing the Admiralty.\n\nPriests offer to unite the country around a living deity. Their circle is not yet a Kami Council, but supporting shrines already costs money. Meiji’s personal rule and priestly rule in his name are different futures.\n\n§YAlternative route prologue.§! Selecting this route excludes the other four, including the main maritime campaign. Only the prologue is available; regime changes and alternative war settlements are not implemented yet. The war clock continues to run."
 JPX_kami_institution:0 "First Assembly of Shrines"
 JPX_kami_institution_desc:0 "Alternative route: a two-focus prologue. Further content is not implemented yet. The main campaign and its industry require backing the Admiralty.\n\nGather shrine representatives to discuss a future Divine Samurai Order. The assembly must decide whether to support soldiers’ families or issue only a joint proclamation.\n\nAn event offers a full programme for §Y50 political power§! or a limited first step."
 JPX_land:0 "Continental Empire"
 JPX_land_desc:0 "Alternative route: a two-focus prologue. Further content is not implemented yet. The main campaign and its industry require backing the Admiralty.\n\nSaigo needs a road to Honshu opened by preaching rather than bayonets. Officers, peasants and priests rally around a return to the continent. The fleet sees a challenge to its budget.\n\n§YAlternative route prologue.§! Selecting this route excludes the other four, including the main maritime campaign. Only the prologue is available; regime changes and alternative war settlements are not implemented yet. The war clock continues to run."
 JPX_land_institution:0 "Envoys of the Pure Land"
 JPX_land_institution_desc:0 "Alternative route: a two-focus prologue. Further content is not implemented yet. The main campaign and its industry require backing the Admiralty.\n\nReceive northern preachers and draft an appeal for a future Order of the Pure Land. Neither Hokkaido nor its army can be brought under Tokyo by a stroke of the pen.\n\nAn event offers a full programme for §Y50 political power§! or a limited first step."
 JPX_prologue_tt:0 "A political course has been chosen. This prologue does not conclude peace, transfer territory or complete a transformation of the state."
 JPX_sea:0 "Course of the Imperial Admiralty"
 JPX_sea_desc:0 "The Admiralty demands preparations for a southern expedition. After the Exodus, industrial independence is a matter of survival: known principles of electrical protection and aeronautics still need working Japanese prototypes."
 JPX_sea_institution:0 "Charter of the Sea Samurai"
 JPX_sea_institution_desc:0 "A new naval caste begins with a charter and training cadre. Drawing officers from the army can improve landing operations, but requires its own budget. The corps itself remains a future project.\n\nAn event offers a full programme for §Y50 political power§! or a limited first step."
 JPX_throne:0 "Imperial Absolutism"
 JPX_throne_desc:0 "Alternative route: a two-focus prologue. Further content is not implemented yet. The main campaign and its industry require backing the Admiralty.\n\nMeiji demands direct reports that bypass the three factions. This is a first step towards personal rule, not priestly government. Ministries resist scrutiny; a guard and loyal bureaucracy still have to be built.\n\n§YAlternative route prologue.§! Selecting this route excludes the other four, including the main maritime campaign. Only the prologue is available; regime changes and alternative war settlements are not implemented yet. The war clock continues to run."
 JPX_throne_institution:0 "Office of Personal Reports"
 JPX_throne_institution_desc:0 "Alternative route: a two-focus prologue. Further content is not implemented yet. The main campaign and its industry require backing the Admiralty.\n\nEstablish a small office accountable to the Emperor. Inspecting accounts builds confidence but consumes political capital. Calling Saigo Guardian of the North would not by itself deprive him of his army.\n\nAn event offers a full programme for §Y50 political power§! or a limited first step."
 JPX_trade:0 "Commercial Empire"
 JPX_trade_desc:0 "Alternative route: a two-focus prologue. Further content is not implemented yet. The main campaign and its industry require backing the Admiralty.\n\nIwasaki seeks a mandate to pursue agreement rather than victory. Directors promise revived trade; officers see a willingness to surrender. There is no truce yet: its price must first be calculated.\n\n§YAlternative route prologue.§! Selecting this route excludes the other four, including the main maritime campaign. Only the prologue is available; regime changes and alternative war settlements are not implemented yet. The war clock continues to run."
 JPX_trade_institution:0 "The Price of a Future Peace"
 JPX_trade_institution_desc:0 "Alternative route: a two-focus prologue. Further content is not implemented yet. The main campaign and its industry require backing the Admiralty.\n\nCollect debt ledgers and prepare terms for future talks with Batavia. A funded audit reduces domestic debt pressure. A draft peace neither stops the war nor changes Dutch demands.\n\nAn event offers a full programme for §Y50 political power§! or a limited first step."
 JSM_offer_desc:0 "Tokyo offers a protectorate. Acceptance places our country under Japan. Refusal grants Japan a puppet war goal."
 PAZ_CANON_START_DESC:0 "Hernandez has united Mexican exiles with a promise of rebirth. In eastern Cuba and Hispaniola, military power rests on the preaching of the Prophet of the Fifth Sun. Neighbours see the new movement as a threat; its followers see the beginning of another age."
 PAZ_prophet_advisor:0 "Prophet of the Fifth Sun"
 PCB_CANON_START_DESC:0 "Cebu’s council of trading houses values open harbours and its own authority. The Confederation calls the island to a common banner, while Japan’s advance threatens established trade. Neutrality becomes an increasingly costly choice."
 PCF_CANON_START_DESC:0 "In central Cuba, Senator Beauregard gathers the heirs of the American South. Their power rests on plantations and old privileges, while the Iron Union and the followers of the Fifth Sun fight around them. Escape from the Song has brought no peace."
 PHR_CANON_START_DESC:0 "In Haiti, Maman Brigitte leads communities that survived the fall of the continents. Faith binds them more tightly than old laws, but the Caribbean war leaves no safe shores. Across the straits wait armies that see the island as their next prize."
 PHW_CANON_START_DESC:0 "Kalakaua’s kingdom stands at the crossroads of the Pacific. To the great powers, Hawaiian harbours are coveted bases; to the islanders, they are the foundation of an independent life. Distant wars draw ever closer to this refuge."
 PLS_CANON_START_DESC:0 "§YFaith in the Mountains§!\n\nAfter the fall of Manila, the Catholic Republic emerged in the mountains of northern Luzon. Emilio Aguinaldo seeks the strength to fight the Japanese garrisons. The Confederation may become an ally, but a shared danger does not yet mean agreement over the islands’ future.\n\n§YOn the threshold of 1893: §!Preserve a stronghold of resistance and find allies."
 PPN_CANON_START_DESC:0 "On Panay, a council of caciques holds together a union of farming communities. The islanders are reluctant to exchange local freedom for orders from a distant capital, but the sea no longer guarantees safety. The Confederation’s future also depends on this island’s choice."
 PSL_CANON_START_DESC:0 "Sultan Jamalul Kiram II rules islands where sea routes matter more than land borders. Sulu is slow to trust either the Confederation or Japan. Foreign protection promises safety, but its price may prove greater than the military threat."
 PSY_CANON_START_DESC:0 "Barghash’s heir has brought the sultanate to the Seychelles. The ocean shielded the new court from the Song but separated it from its old possessions. Between commerce and the memory of a lost home, the exiles must find a foundation for the future."
 PZ_OTHER_COUNTRIES_DESC:0 "Beyond the great powers lie republics, sultanates and unions of communities. Choose a country on the map or in the list: every island has its own story in the world of the Song."
 SONG_EARTH_1893_DESC:0 "§Y1 January 1893§!\n\nThe continents have fallen silent. Seas have become roads, and islands humanity’s last refuges. Old crowns live in exile, new republics compete for harbours, and the World Trade Chamber holds their debts.\n\nJapan seeks Borneo’s oil. Batavia struggles to remain united. The Caribbean is already at war. Far to the north, Greenland holds a hope that could change the world’s fate.\n\n§YWhose song will rise above the ocean?§!"
 SONG_EARTH_1893_NAME:0 "1893 — Islands of Hope"
 WTC_receiver_desc:0 "A local cabinet installed by Madeira’s creditors. The Chamber controls payments without replacing state institutions."
