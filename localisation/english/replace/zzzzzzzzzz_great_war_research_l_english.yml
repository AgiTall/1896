 howitzer_equipment_1:0 "Basic Howitzer"
 howitzer_equipment_2:0 "Improved Howitzer"
 howitzer_equipment_2_desc:0 "Long-barreled howitzers were generally heavier and had a longer range than short-barreled howitzers. They were used for attacking fortified positions and for long-range support."
 howitzer_equipment_3:0 "Advanced Howitzer"
 howitzer_equipment_3_desc:0 "Long-barreled howitzers were generally heavier and had a longer range than short-barreled howitzers. They were used for attacking fortified positions and for long-range support."
