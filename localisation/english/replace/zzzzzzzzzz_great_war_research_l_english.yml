 sp_land_generic_reward_army_xp_3:0 "Adapted Field Tactics"
 tactic_hold_bridge:0 "Hold Bridge"
 sp_land_reward_land_cruiser_suspension:0 "Hydropneumatic Suspension System"
 sp_land_reward_land_cruiser_suspension_desc:0 "The team has perfected a cutting-edge hydropneumatic suspension system that balances the immense weight of the [SpecialProject.GetName], ensuring stability and reducing strain on the tracks even when traversing rough terrain. [Character.GetName] is confident that this suspension can be reliably implemented for better performance in the field."
 sp_super_heavy_battleship_eq_bonus_armor:0 "Super Heavy Battleship - Stronger Hull & Armor"
 sp_naval_generic_reward_major_progress_3:0 "Massive Progress!"
 fleet_in_being_tree:0 "Fleet in Being Doctrines"
 grand_mechanized_offensive:0 "Mechanized Offensive"
 grand_mechanized_offensive_desc:0 "Motorized troops are well and good, but to lead offensives we need Infantry that can ride into battle in armored transports which protect them and carry heavy weapons.\n\n"
