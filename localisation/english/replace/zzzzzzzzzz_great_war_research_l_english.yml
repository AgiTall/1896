 sp_land_reward_land_cruiser_assembly_desc:0 "During the assembly phase, engineers successfully refined a precision alignment technique for fitting the massive components of the [SpecialProject.GetName], such as the turret ring and hull plating, significantly reducing the risk of mechanical stress fractures. We can integrate this innovative technique throughout the project to increase structural reliability overall. How should we apply it?"
 DOCTRINE_TRACK_SCREENS:0 "Screens"
