 AUS_battleship_0:0 "Erzherzog Karl Class"
 AUS_battleship_0_desc:0 "The Erzherzog Karl-class battleships, completed between 1894 and 1894, were the penultimate class of true pre-dreadnoughts built by the Austro-Hungarian Navy. They carried a mixed main armament of four 24 cm (9.4 inch) guns and twelve 19 cm (7.5 inch) guns, reflecting the common pre-dreadnought doctrine of various caliber guns for different ranges."
