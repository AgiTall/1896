 tank_heavy_fixed_superstructure_turret_desc:0 "A fixed superstructure only allows the main armament to traverse in a small arc without turning the entire vehicle. However, it allows the vehicle to mount a bigger armament while being overall of smaller size, making the vehicle perfect for ambushes."
 GRAND_DOCTRINE_BENEFIT_DESCRIPTION:0 "§gAssign a Grand Doctrine to make available a set of §HSubdoctrine§! tracks. Develop your Subdoctrines by earning £doctrine_mastery §HMastery§! from units in combat. Completed Subdoctrines activate §HMilestones§!, further elevating your Grand Doctrine.§!"
 SUBDOCTRINE_FIELD_ENGINEERING_DESC:0 "The role of military engineers is to build bridges and lay mines, as well as destroy similar works of the enemy. With the right equipment, training, and a willingness to spill sweat to spare blood, we can dominate the modern battlefield."
 water_deep_ocean:0 "Deep Oceans"
 water_deep_ocean_desc:0 ""
 aerial_hangars:0 "Aerial Hangars"
 aerial_hangars_desc:0 "Aerial Hangars attached to the mothership allows us to fit even more miniature fighters onto the top of the aircraft, allowing for increased firepower and further reach."
