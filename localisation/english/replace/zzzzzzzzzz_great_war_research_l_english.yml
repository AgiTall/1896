 GER_light_cruiser_2:0 "Dresden Class"
 GER_light_cruiser_2_desc:0 "A typical German protected cruiser of the early 20th century. Dresden could serve as a scout or raider, or cover a ship squadron from enemy destroyers. She boasted a high speed for her time and very good protection. Compared with the majority of enemy cruisers, she was fitted with numerous yet less efficient guns."
