 lc_obstacle_clearance_gear_desc:0 "Heavy-duty attachments, such as massive bulldozer blades and cranes, designed to clear debris, create paths through difficult terrain, and assist in entrenchment operations."
 heavy_air:0 "Heavy aircraft"
 SUBDOCTRINE_DEEP_BATTLE_DESC:0 "The range and striking power of modern arms allows an enemy defense system to be overcome by striking it to its whole depth, simultaneously, with every weapon at our disposal."
