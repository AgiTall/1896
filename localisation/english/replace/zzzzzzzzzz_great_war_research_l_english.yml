 SUBDOCTRINE_NAVAL_STRIKE_TACTICS_DESC:0 "Carrier aircraft must run a gauntlet of enemy fighters and AA to deliver their payloads. Our training will emphasize survivability and tenacity in pressing home the attack."
 carrier_primacy:0 "Carrier Primacy"
 carrier_primacy_desc:0 "Modern airplanes have greater range and precision than ordinary naval guns. Integrate carriers into our fleet and dominate the seas from the sky."
 category_heavy_fighter:0 "Heavy Fighter"
 bomber_ace_initiative:0 "Bomber Ace Initiative"
 bomber_ace_initiative_desc:0 "Formally recognizing and rewarding Ace bomber pilots encourages daring and initiative."
 hold_bridge:0 "Hold bridge"
 super_heavy_tank_destroyer_chassis:0 "Super-Heavy Tank Destroyer"
 super_heavy_tank_destroyer_chassis_desc:0 "A gigantic vehicle, capable of mounting the heaviest armor and the biggest gun, but consequently fairly slow and unreliable."
