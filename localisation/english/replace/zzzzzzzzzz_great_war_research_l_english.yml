 tank_heavy_cannon_3_desc:0 "A weapon that can fire a large shell. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldy to be mounted in most vehicles not specifically designed to carry it."
 sp_armored_signal_tech:0 "Armored Signal Company"
 sp_armored_signal_tech_desc:0 "Equipping our units with command vehicles will ensure secure and reliable battlefield communications and coordination under armored protection."
