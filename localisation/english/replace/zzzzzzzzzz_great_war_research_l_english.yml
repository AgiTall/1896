 jet_engine_2x:0 "2x Jet Engine"
 jet_engine_2x_desc:0 "$engine_1_2x_desc$"
 SUBDOCTRINE_CARRIER_AIRFIELDS_DESC:0 "A carrier deck is the most expensive piece of real estate on Earth. No effort must be spared in eking out the maximum amount of possible air power from it."
 light_sp_artillery_brigade:0 "Light SP Artillery"
 lc_heavy_anti_air_battery:0 "Heavy Anti-Air Battery"
 lc_heavy_anti_air_battery_desc:0 "An anti-air battery equipped with large-caliber guns to target high-speed and high-altitude aircraft, providing a defensive bubble around the vehicle."
 subsidiary_carrier_role:0 "Subsidiary Carrier Role"
 subsidiary_carrier_role_desc:0 "Carriers support Battleships, improving their readiness in switching from defense to offense. The utility of the Carrier as both an eye in the sky and a powerful quick strike force complement the slower Battleships well."
 cv_fighter_equipment_0:0 "Inter-War Carrier Fighter"
 cv_fighter_equipment_0_desc:0 "An early fighter modified to launch from and land on aircraft carriers."
 air_skirmish:0 "Air Skirmish"
 air_skirmish_desc:0 "Regrettably, it is not always possible to destroy every single enemy plane found over our country, but it is possible to harass them from the moment they are spotted until the moment they leave, constantly wearing them down."
 category_vehicle_infantry:0 "Motorized & Mechanized Infantry"
 sp_land_generic_reward_artillery_tech_1:0 "$sp_land_generic_reward_armor_tech_1$"
 tank_auto_cannon_2:0 "Improved Automatic Cannon"
 tank_auto_cannon_2_desc:0 "Adapted from a fast-firing anti-air gun, this automatic cannon can lay down a hail of fire that is devastating to soft targets. The small caliber does limit its anti-armor performance."
 urban_assault_specialist:0 "Urban Assault Specialist"
 urban_assault_specialist_desc:0 "§LAn expert in Fighting In Someone's House and Causing Havoc In People's Streets.§!"
