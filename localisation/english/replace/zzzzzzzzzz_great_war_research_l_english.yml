 basic_mortars:0 "Basic Mortar"
 basic_mortars_desc:0 "Early mortars were used to fire from a closed position. This type of artillery is less at risk of being destroyed and is effective in disrupting the advance of enemy infantry."
 improved_mortars:0 "Improved Mortar"
 improved_mortars_desc:0 "Mortars were particularly effective in trench warfare since the vertical trajectory of their shells potentially allowed them to fall straight into enemy trenches."
 advanced_mortars:0 "Advanced Mortar"
 advanced_mortars_desc:0 "Light mortars that can be carried by infantry troops."
 ARMOUR_TITLE_ARMCAR:0 "ARMORED CARS"
 ARMOUR_TITLE_ARMCAR_desc:0 "Armored Cars - are iron cavalry. A maneuverable unit to support infantry."
