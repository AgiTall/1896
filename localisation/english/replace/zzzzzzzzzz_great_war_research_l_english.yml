 sp_land_reward_super_heavy_howitzer_focus_preference_desc:0 "As development progresses, a critical decision must be made: We can prioritize fast production and smaller-caliber guns, or we can invest in bigger and heavier guns, sacrificing production efficiency for unparalleled firepower and devastating impact."
