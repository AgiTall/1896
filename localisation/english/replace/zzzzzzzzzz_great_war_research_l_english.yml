l_english:
 fighter:0 "Fighter"
 fighter_equipment_desc:0 "Fighters are fast and nimble and can do many jobs. Everything from fighting for air superiority, protect your bombers and intercept the enemies bombers."
 cv_fighter:0 "Fighter (Carrier)"
 cv_fighter_equipment_desc:0 "Fighters are fast and nimble and can do many jobs. Everything from fighting for air superiority, protect your bombers and intercept the enemies bombers."
 jet_fighter:0 "Jet Fighter"
 jet_fighter_equipment:0 "Jet Fighter"
 jet_fighter_equipment_desc:0 "Fighters are fast and nimble and can do many jobs. Everything from fighting for air superiority, protect your bombers and intercept the enemies bombers."
 cas:0 "Ground Attack Plane"
 CAS_equipment_desc:0 "Ground Attack planes are designed to provide support in land combat."
 nav_bomber:0 "Naval Bomber"
 nav_bomber_equipment_desc:0 "Naval Bombers are able to perform attacks against enemy ships."
 seaplane:0 "Seaplane"
 seaplane_equipment_desc:0 "Seaplanes are able to perform attacks against enemy ships."
 tac_bomber:0 "Light Bomber"
 tac_bomber_equipment_desc:0 "Light Bombers are smaller fast bombers that can help out ground troops and bomb enemy buildings."
 strat_bomber:0 "Heavy Bomber"
 strat_bomber_equipment_desc:0 "Heavy Bombers attack enemy buildings and infrastructure, starving them of precious industry."
 transport_plane:0 "Transport"
 transport_plane_equipment_desc:0 "Transports passengers and air cargo."
 fighter_equipment:0 "Fighter"
 cv_fighter_equipment:0 "Carrier Fighter"
 cv_fighter_equipment_short:0 "CV Fighter"
 strat_bomber_equipment:0 "Heavy Bomber"
 scout_plane:0 "Reconnaissance Plane"
 scout_plane_short:0 "Recon Plane"
 scout_plane_equipment_desc:0 "A plane developed specifically for photo reconnaisance. Relies primarily on speed and stealth to survive and will lose in any stand-up fight."
 scout_plane_equipment:0 "Reconnaissance Plane"
 scout_plane_equipment_short:0 "Recon Plane"
 scout_plane_equipment_1:0 "Reconnaissance Plane I"
 scout_plane_equipment_1_short:0 "Recon Plane I"
 scout_plane_equipment_1_desc:0 "Gathering intelligence on enemy troop movements and providing reports of enemy naval deployments has been the original mission for airplanes since their first deployment in the Great War, and is still an important mission."
 scout_plane_equipment_2:0 "Reconnaissance Plane II"
 scout_plane_equipment_2_short:0 "Recon Plane II"
 scout_plane_equipment_2_desc:0 "By developing dedicated planes for aerial surveillance and long-range reconnaissance, we ensure that we gain and maintain an accurate picture of our opponent's intentions and capabilities."
 scout_plane_equipment_3:0 "Reconnaissance Plane III"
 scout_plane_equipment_3_desc:0 "By developing dedicated planes for aerial surveillance and long-range reconnaissance, we ensure that we gain and maintain an accurate picture of our opponent's intentions and capabilities."
 scout_plane_equipment_3_short:0 "Recon Plane III"
 aerial_bombs:0 "Aerial Bombs"
 aerial_bombs_desc:0 "A bomb can be loaded onto aeroplanes so that it can be dropped from the above and hit a ground target. Bombs can now be attached to the fuselage instead of being hand-thrown by the crew. \n$allow_bomber_techs$"
 synchronizer:0 "Synchronizer"
 synchronizer_desc:0 "A gun synchronizer or interrupter gear is a device enabling a single-engine tractor configuration aircraft to fire its forward-firing armament through the arc of its spinning propeller without bullets striking the blades. This allows the aircraft, rather than the gun, to be aimed at the target.\n$allow_fighter_and_seaplane_techs$"
 allow_fighter_and_seaplane_techs:0 "Allows to research §YFighters§! and §YSeaplanes§!."
 allow_bomber_techs:0 "Allows to research §YLight Bombers§! and §YHeavy Bombers§!."
 fighter_equipment_0:0 "Early Fighter"
 fighter_equipment_0_short:0 "Early Fighter"
 fighter_equipment_0_desc:0 "It hasn't been long since these flying machines were invented. And it hasn't been that long since we thought of taking these to war. But we guess there must be some use."
 fighter_equipment_1:0 "Fighter I"
 fighter_equipment_1_short:0 "Fighter I"
 fighter_equipment_1_desc:0 "The pace of fighter advancements is astounding, and as such, we must continue to incorporate the technology as well as improve upon existing concepts. Our new fighter must be more reliable and have better speed and mobility than other aircraft. Additionally, it must be armed properly."
 fighter_equipment_2:0 "Fighter II"
 fighter_equipment_2_short:0 "Fighter II"
 fighter_equipment_2_desc:0 "The introduction of experimental but innovative technologies such as synchronized gear and triplane design could give us an edge in fighter dogfights."
 fighter_equipment_3:0 "Fighter III"
 fighter_equipment_3_short:0 "Fighter III"
 fighter_equipment_3_desc:0 "While fighter aircraft underwent many changes through. We must begin to translate civilian technological advances into military applications."
 strat_bomber_equipment_1:0 "Heavy Bomber I"
 strat_bomber_equipment_1_short:0 "Heavy Bomber I"
 strat_bomber_equipment_1_desc:0 "We must have a bomber capable of bombing the enemy's military targets and major cities. It will need to fly high and at good speed, and it must carry a large payload. This will require a large airframe with multiple engines. It will also have some defensive capability."
 strat_bomber_equipment_2:0 "Heavy Bomber II"
 strat_bomber_equipment_2_short:0 "Heavy Bomber II"
 strat_bomber_equipment_2_desc:0 "Bombing has proven effective at reducing the enemy's capacity to wage war. More defensive weaponry and increased speed will allow a new design to avoid destruction, while increasing the payload and range will make it more effective."
 strat_bomber_equipment_3:0 "Heavy Bomber III"
 strat_bomber_equipment_3_short:0 "Heavy Bomber III"
 strat_bomber_equipment_3_desc:0 "To avoid losses to enemy fighters and ground fire, our next design will fly at great altitude. It will be larger to carry both an enormous payload and more fuel, to increase range."
 tac_bomber_equipment:0 "Light Bomber"
 tac_bomber_equipment_1:0 "Light Bomber I"
 tac_bomber_equipment_1_short:0 "Light Bomber I"
 tac_bomber_equipment_1_desc:0 "The earliest light bombers were intended to drop their bombs in level flight over a target."
 tac_bomber_equipment_2:0 "Light Bomber II"
 tac_bomber_equipment_2_short:0 "Light Bomber II"
 tac_bomber_equipment_2_desc:0 "It is widely believed that the next war will be won entirely by bombing the enemy to extinction. It is imperative that we begin designing our own bomber plane that is capable of carrying heavy payloads at adequate speed."
 tac_bomber_equipment_3:0 "Light Bomber III"
 tac_bomber_equipment_3_short:0 "Light Bomber III"
 tac_bomber_equipment_3_desc:0 "Heavier designs of tactical bombers can extend range, payload and speed while maintaining the planes' capacity to perform a wide variety of missions."
 transport_plane_equipment:0 "Transport Plane"
 transport_plane_equipment_1:0 "Transport Plane"
 transport_plane_equipment_1_short:0 "Transport"
 transport_plane_equipment_1_desc:0 "§LPlanes used to transport troops on paradrop missions.§!"
 nav_bomber_equipment:0 "Naval Bomber"
 nav_bomber_equipment_1:0 "Naval Bomber I"
 nav_bomber_equipment_1_short:0 "NAV I"
 nav_bomber_equipment_1_desc:0 "Naval aviation will be vital in the coming decade to confront new developments in naval warfare, such as the increased importance of submarines. Seaplanes with capacity to work as dive bombers and recon vehicles will be of use."
 nav_bomber_equipment_2:0 "Naval Bomber II"
 nav_bomber_equipment_2_short:0 "NAV II"
 nav_bomber_equipment_2_desc:0 "New engine technology and aerodynamically refined designs will boost the speed and diving attack capability of naval planes significantly."
 nav_bomber_equipment_3:0 "Naval Bomber III"
 nav_bomber_equipment_3_short:0 "NAV III"
 nav_bomber_equipment_3_desc:0 "All-metal designs and powerful airbrakes allow for more complex naval aeronautics. The planes of the future will demand a larger crew to operate these advanced systems, however."
 seaplane_equipment:0 "Seaplane"
 seaplane_equipment_1:0 "Seaplane I"
 seaplane_equipment_1_short:0 "Seaplane I"
 seaplane_equipment_1_desc:0 "Naval aviation will be vital in the coming decade to confront new developments in naval warfare, such as the increased importance of submarines. Seaplanes with capacity to work as recon vehicles will be of use."
 seaplane_equipment_2:0 "Seaplane II"
 seaplane_equipment_2_short:0 "Seaplane II"
 seaplane_equipment_2_desc:0 "New engine technology and aerodynamically refined designs will boost the reconnaissance capability of naval planes significantly."
 seaplane_equipment_3:0 "Seaplane III"
 seaplane_equipment_3_short:0 "Seaplane III"
 seaplane_equipment_3_desc:0 "All-metal designs and powerful airbrakes allow for more complex naval aeronautics. The planes of the future will demand a larger crew to operate these advanced systems, however."
 CAS_equipment:0 "Ground Attack Plane"
 CAS_equipment_1:0 "Ground Attack Plane I"
 CAS_equipment_1_desc:0 "The attack aircraft as a role, in support of ground forces on battlefield. Battlefield support is generally divided into close air support and battlefield air interdiction, the first requiring strict and the latter only general cooperation with friendly surface forces."
 CAS_equipment_2:0 "Ground Attack Plane II"
 CAS_equipment_2_desc:0 "Our CAS doctrine requires an aircraft capable of precision surface attack. While these aircraft carry a lesser payload compared to our larger Tactical Bombers, they are capable of attacking and destroying small targets of opportunity through strafing and dive bombing."
 CAS_equipment_3:0 "Ground Attack Plane III"
 CAS_equipment_3_desc:0 "Early war experiences have shown that increased speed, armor and maneuverability are necessary for CAS aircraft survivability against enemy fighters and ground fire. This next generation of ground attack aircraft will also utilize larger bombs, cannons and machineguns to inflict greater damage to their targets."
 cv_fighter_equipment_1:0 "Carrier Fighter I"
 cv_fighter_equipment_1_short:0 "Carrier Fighter I"
 cv_fighter_equipment_1_desc:0 "An early fighter modified to launch from and land on aircraft carriers."
 cv_fighter_equipment_2:0 "Carrier Fighter II"
 cv_fighter_equipment_2_short:0 "Carrier Fighter II"
 cv_fighter_equipment_2_desc:0 "An improved fighter modified to launch from and land on aircraft carriers."
 cv_fighter_equipment_3:0 "Carrier Fighter III"
 cv_fighter_equipment_3_short:0 "Carrier Fighter III"
 cv_fighter_equipment_3_desc:0 "An advanced fighter modified to launch from and land on aircraft carriers."
 naval_equipment:0 "Ships"
 screen_ship:0 "Screens"
 capital_ship:0 "Capital Ships"
 submarine_1:0 "Submarine I"
 submarine_2:0 "Submarine II"
 submarine_3:0 "Submarine III"
 submarine_4:0 "Submarine IV"
 cruiser_submarine:0 "$ship_hull_cruiser_submarine$"
 cruiser_submarine_desc:0 "$ship_hull_cruiser_submarine_desc$"
 fleet_submarine:0 "$ship_hull_fleet_submarine$"
 fleet_submarine_desc:0 "$ship_hull_fleet_submarine_desc$"
 coastal_submarine:0 "$ship_hull_coastal_submarine$"
 coastal_submarine_desc:0 "$ship_hull_coastal_submarine_desc$"
 submarine_1_desc:0 "Submarines are stealthy vessels designed to take out undefended convoys. The early models from the Great War pave the way for new methods of naval warfare."
 submarine_2_desc:0 "Better armed and more stable, new submarine designs are made to take advantage of advancements in naval tactics and have longer range, being able to attack distant convoy routes."
 submarine_3_desc:0 "The role of the submarine in the fleet outside of convoy attacks is still under debate. Achieving a balance between combination of speed, range and weaponry will be key to the necessary model."
 submarine_4_desc:0 "Increased test depth and efficient layouts will be features of the modern submarines, taking advantage of field experience to select appropriate armaments and engines."
 ship_hull_submarine_1_desc:0 "Submarines are stealthy vessels designed to take out undefended convoys. The early models from the Great War pave the way for new methods of naval warfare."
 ship_hull_submarine_2_desc:0 "Better armed and more stable, new submarine designs are made to take advantage of advancements in naval tactics and have longer range, being able to attack distant convoy routes."
 ship_hull_submarine_3_desc:0 "The role of the submarine in the fleet outside of convoy attacks is still under debate. Achieving a balance between combination of speed, range and weaponry will be key to the necessary model."
 ship_hull_submarine_4_desc:0 "Increased test depth and efficient layouts will be features of the modern submarines, taking advantage of field experience to select appropriate armaments and engines."
 torpedo_boat:0 "Torpedo Boat"
 gunboat:0 "Late Gunboat"
 destroyer_1:0 "Destroyer I"
 destroyer_2:0 "Destroyer II"
 destroyer_3:0 "Destroyer III"
 destroyer_4:0 "Destroyer IV"
 torpedo_boat_desc:0 "$ship_hull_torpedo_boat_desc$"
 gunboat_desc:0 "$ship_hull_gunboat_desc$"
 destroyer_1_desc:0 "To ensure the safety of convoys, the destroyers of the Great War must be repurposed and developed. Arming vessels with more torpedoes will allow more opportunities to engage."
 destroyer_2_desc:0 "Longer torpedo range and faster reload speeds, along with new types of armaments such as anti-air turrets, will allow our destroyers to remain efficient and versatile."
 destroyer_3_desc:0 "To better face threats from above and below, new destroyers must be outfitted with radar and modern anti-air and anti-submarine weaponry."
 destroyer_4_desc:0 "The modern destroyer must be fitted with a variety of different detection technologies, new depth charge deployment systems and be built at a larger scale than their predecessors."
 ship_hull_torpedo_boat_desc:0 "Small, fast vessels designed to deliver a knockout blow with torpedoes against much larger capital ships. They are cheap to produce but extremely vulnerable to any form of gunfire, relying on speed and numbers to be effective."
 ship_hull_gunboat_desc:0 "An evolution of the torpedo boat, these vessels mount a more substantial gun armament, making them less reliant on a single torpedo attack. They are better suited for coastal patrol and fleet screening duties in low-threat environments."
 ship_hull_light_1_desc:0 "The first true destroyers, these ships are larger and more seaworthy than torpedo boats. They combine a respectable gun armament with a torpedo threat and are designed to hunt enemy torpedo boats while screening the main battle fleet."
 ship_hull_light_2_desc:0 "As the Great War approaches, destroyer designs become more robust and capable. These hulls are faster, have a greater operational range, and can be fitted with an expanded array of weapons, including early depth charges and mines."
 ship_hull_light_3_desc:0 "Wartime destroyers are the workhorses of the fleet. These hulls are designed for mass production and feature increased specialisation, with more slots for anti-submarine and anti-aircraft weaponry to reflect their expanding role in naval warfare."
 ship_hull_light_4_desc:0 "The culmination of wartime development, post-war destroyer designs are significantly larger, faster, and more heavily armed than their predecessors. Incorporating the latest engine technology, their versatile hulls are designed to carry a wider array of specialised armaments, allowing them to serve as powerful and adaptable warships capable of fulfilling numerous roles in the modern fleet."
 light_cruiser_0:0 "Protected Cruiser"
 light_cruiser_1:0 "Light Cruiser I"
 light_cruiser_2:0 "Light Cruiser II"
 light_cruiser_3:0 "Light Cruiser III"
 light_cruiser_4:0 "Light Cruiser IV"
 torpedo_cruiser:0 "Torpedo Cruiser"
 torpedo_cruiser_desc:0 "Light cruisers equipped with a large number of torpedo tubes, at the cost of a smaller main battery and fewer anti-aircraft guns."
 JAP_torpedo_cruiser:0 "Kitakami-class"
 light_cruiser_1_desc:0 "Maneuverable light cruisers that can maintain a high speed will continue to be useful for scouting missions."
 light_cruiser_2_desc:0 "Post-war treaties put restrictions on cruisers, but well-armed light vessels can be developed while remaining within these limits."
 light_cruiser_3_desc:0 "Now skirting the limits of treaties, larger and more heavily armored cruisers can be built, still with light enough weaponry to be classified as light cruisers."
 light_cruiser_4_desc:0 "Tactically employed to protect larger ships, the modern generation of light cruisers can shake off most past restrictions and be better armed to handle aerial attacks."
 armored_cruiser_1:0 "Armored Cruiser I"
 armored_cruiser_2:0 "Armored Cruiser II"
 armored_cruiser_3:0 "Armored Cruiser III"
 armored_cruiser_4:0 "Armored Cruiser IV"
 armored_cruiser_1_desc:0 "The Washington Naval Treaty was set up to prevent an arms race in cruisers, among other ships, but this seems inevitable. By keeping armor light, the weapons load can be increased."
 early_armored_cruiser_desc:0 "The Washington Naval Treaty was set up to prevent an arms race in cruisers, among other ships, but this seems inevitable. By keeping armor light, the weapons load can be increased."
 armored_cruiser_2_desc:0 "Despite new efforts at treaties, refitting lighter cruisers with heavier weaponry remains efficient, although armor is still limited."
 armored_cruiser_3_desc:0 "As restrictions are increasingly ignored worldwide, more balanced heavy cruiser designs with more priority on armor can be built. Better anti-air guns allow these ships to cooperate in naval air warfare."
 armored_cruiser_4_desc:0 "Upscaled, longer and heavier designs with rapid-fire armaments are features in these final stages of heavy cruiser development."
 ship_hull_cruiser_0_desc:0 "Protected Cruisers are defined by an arched armour deck that protects their machinery. Lacking a substantial side armour belt, they are vulnerable to direct fire but serve as capable scouts and commerce raiders in an era before the dominance of the light cruiser."
 ship_hull_cruiser_1_desc:0 "Early Armoured and Light Cruisers are versatile ships designed for scouting, screening the main fleet, and protecting trade routes. They are faster than older protected cruisers and mount a more uniform battery, though they remain lightly armoured."
 ship_hull_cruiser_2_desc:0 "As naval technology advances, these cruisers become larger and faster, powered by efficient turbine engines. They offer more flexible weapon emplacements for a mix of guns, torpedoes, and early anti-air defences, making them valuable multi-purpose assets."
 ship_hull_cruiser_3_desc:0 "As cruisers around the world get more powerful and capable, new and larger hulls are needed to hold all the extra equipment needed."
 ship_hull_cruiser_4_desc:0 "The post-war generation of cruisers, these hulls are built for higher speeds and longer ranges. They can mount more extensive armament and the latest support modules, representing a significant evolution from their pre-war counterparts and forming the backbone of modern fleets."
 protected_cruiser:0 "Protected Cruiser"
 protected_cruiser_desc:0 "TODO"
 unprotected_cruiser:0 "Unprotected Cruiser"
 unprotected_cruiser_desc:0 "TODO"
 coastal_defense_ship:0 "Coastal Defense Ship"
 coastal_defense_ship_desc:0 "Too small for true ocean-going warfare, this relatively cheap vessel sacrifices range for heavy armament and armor."
 battle_cruiser_1:0 "Battlecruiser I"
 battle_cruiser_2:0 "Battlecruiser II"
 battle_cruiser_3:0 "Battlecruiser III"
 battle_cruiser_4:0 "Battlecruiser IV"
 battle_cruiser_1_desc:0 "The post-war battlecruiser arms race resulted in several heavily armed designs, sacrificing armor for speed compared to battleships."
 battle_cruiser_2_desc:0 "Rebuilt and repurposed battlecruisers continue to outrun even modern battleship designs by lighter protection, but have developed better systems for fire control, detection and aerial defenses."
 ironclad:0 "Late Ironclad"
 battleship_0:0 "Pre-Dreadnought"
 battleship_1:0 "Dreadnought I"
 battleship_2:0 "Dreadnought II"
 battleship_3:0 "Dreadnought III"
 battleship_4:0 "Dreadnought IV"
 ironclad_desc:0 "TODO"
 battleship_0_desc:0 "Considered by some to be the epitome of naval power before a revolutionary shift in design, and by others as quickly outdated relics, pre-dreadnought battleships were the dominant capital ships of the world's navies from the 1890s until the mid-1900s. While not possessing the "all-big-gun" uniformity of their dreadnought successors, these vessels were heavily armored and carried a formidable mixed armament of large and medium-caliber guns, constituting the backbone of global fleets during an intense period of naval expansion and technological evolution."
 battleship_1_desc:0 "Considered by some to be a relic of a bygone era of naval warfare, by others as the most impressive ships ever built, no one can deny that these remnants of the battleship arms race constitute some of the most heavily armed and armored vessels ever built."
 battleship_2_desc:0 "With improved stability and range, a new generation of battleships improve upon previous designs while remaining within limits stipulated by naval treaties."
 battleship_3_desc:0 "Thicker armor, stronger engines, a battery of high-caliber guns and improved anti-air capabilities can allow battleships to remain relevant, if correctly employed, in a world where naval warfare is increasingly dominated by aerial support."
 battleship_4_desc:0 "As the world sees what may be the last major battleship confrontations, the importance of heavy armaments and anti-air turrets is greater than ever."
 ship_hull_heavy_1_desc:0 "The first generation of all-big-gun battleships, these revolutionary designs feature a uniform main battery of heavy-calibre guns, rendering all previous battleships obsolete overnight. However, their early design limitations are apparent in turret layouts and relatively modest speed."
 ship_hull_heavy_2_desc:0 "Representing the 'super-dreadnought' era, these hulls feature more efficient centerline-mounted turrets, improved armour schemes, and powerful new turbine engines. They are larger, more resilient, and faster than their predecessors, setting the standard for capital ships in the Great War."
 ship_hull_heavy_3_desc:0 "A wartime design, these hulls incorporate the harsh lessons learned from early naval battles. They offer greater flexibility for improved secondary armaments and anti-air defences, along with enhanced range and survivability to meet the escalating demands of naval warfare."
 ship_hull_heavy_4_desc:0 "The pinnacle of dreadnought design, these post-war hulls are the largest and most powerful capital ships of their era. They boast superior speed, protection, and a significant number of module slots, allowing for heavy armament and the latest technologies like improved fire control."
 carrier_1:0 "Carrier I"
 carrier_2:0 "Carrier II"
 carrier_3:0 "Carrier III"
 carrier_1_desc:0 "Many military theorists believe that naval aviation is the future. Converting old capital ships and ocean liners to carry aircraft will be the first step towards utilizing these new doctrines."
 carrier_2_desc:0 "As work begins on the first keel-up carrier designs, we must ensure that these ships have the range and speed to keep up with the rest of our navy, while respecting the post-war naval treaties."
 carrier_3_desc:0 "Improved construction methods and more specialized systems like deck edge elevators allow these carriers to transport more planes more efficiently."
 ship_hull_carrier_1_desc:0 "Many military theorists believe that naval aviation is the future. Converting old capital ships and ocean liners to carry aircraft will be the first step towards utilizing these new doctrines."
 ship_hull_carrier_2_desc:0 "As work begins on the first keel-up carrier designs, we must ensure that these ships have the range and speed to keep up with the rest of our navy, while respecting the post-war naval treaties."
 SH_battleship_1:0 "Great Battleship I"
 SH_battleship_2:0 "Great Battleship II"
 SH_battleship_1_desc:0 "The current state of the world no longer has any room for abiding by naval treaties. Without these limitations, we can focus entirely on creating the heaviest, most well-armed battleships of all time, able to engage multiple lesser vessels."
 SH_battleship_2_desc:0 "An improvement on our earlier super heavy design with stronger weapons and improved fire control systems."
 ship_hull_torpedo_boat:0 "Torpedo Boat"
 ship_hull_gunboat:0 "Late Gunboat"
 ship_hull_light_1:0 "Early Destroyer"
 GER_ship_hull_light_1:0 "Early Large Torpedo Boat"
 ship_hull_light_2:0 "1896 Destroyer"
 GER_ship_hull_light_2:0 "1896 Large Torpedo Boat"
 ship_hull_light_3:0 "1902 Destroyer"
 ship_hull_light_4:0 "1908 Destroyer"
 ship_hull_cruiser:0 "Cruiser"
 ship_hull_cruiser_desc:0 "The workhorse of the fleet, cruisers take over a lot of important duties, from scouting and screening for light cruisers to supporting the battleline for heavy cruisers."
 ship_hull_cruiser_0:0 "1880 Cruiser"
 ship_hull_cruiser_1:0 "1890 Cruiser"
 ship_hull_cruiser_2:0 "1893 Cruiser"
 ship_hull_cruiser_3:0 "1896 Cruiser"
 ship_hull_cruiser_4:0 "1902 Cruiser"
 ship_hull_cruiser_5:0 "1908 Cruiser"
 ship_hull_heavy:0 "Heavy Ship"
 ship_hull_heavy_desc:0 "The ultimate symbol of naval power, these massive, heavily armored behemoths still command respect on the high seas, even as some experts question their role in the age of the airplane and the submarine."
 ship_hull_heavy_1:0 "Dreadnought"
 ship_hull_heavy_2:0 "Super-Dreadnought"
 ship_hull_heavy_3:0 "Late Dreadnought"
 ship_hull_heavy_4:0 "Post-Dreadnought"
 ship_hull_carrier:0 "Seaplane Tender"
 ship_hull_carrier_desc:0 "After years of experiments, the aircraft carrier has slowly matured into its own class of ship. Capable of supporting a growing number of ever more powerful aircraft, the aircraft carrier stands poised to become the last word in naval power projection."
 ship_hull_carrier_0:0 "Early Seaplane Tender"
 ship_hull_carrier_conversion_bb:0 "Converted Battleship"
 ship_hull_carrier_conversion_ca:0 "Converted Cruiser"
 improved_ship_hull_carrier:0 "Improved Seaplane Tender"
 ship_hull_carrier_1:0 "1902 Seaplane Tender"
 ship_hull_carrier_2:0 "1908 Seaplane Tender"
 ship_hull_submarine:0 "Submarine"
 ship_hull_submarine_desc:0 "A far cry from the crude boats of the Great War, the modern submarine is more capable than ever before and can threaten even the biggest ship for a very moderate cost."
 ship_hull_submarine_1:0 "Early Submarine"
 ship_hull_submarine_2:0 "1896 Submarine"
 ship_hull_submarine_3:0 "1902 Submarine"
 ship_hull_submarine_4:0 "1908 Submarine"
 ship_hull_ironclad:0 "Late Ironclad"
 ship_hull_ironclad_desc:0 "TODO"
 ship_hull_pre_dreadnought:0 "Pre-Dreadnought"
 ship_hull_pre_dreadnought_desc:0 "A transitional design bridging the gap between ironclads and dreadnoughts, these vessels feature a mixed-caliber main armament and are slower than true dreadnoughts. They represent the naval standard at the turn of the century but are rapidly becoming obsolete."
 ship_hull_cruiser_panzerschiff:0 "$panzerschiff$"
 ship_hull_cruiser_panzerschiff_desc:0 "$panzerschiff_desc$"
 GER_ship_hull_cruiser_panzerschiff:0 "$GER_panzerschiff$"
 panzerschiff:0 "Pocket Battleship"
 panzerschiff_desc:0 "An almost-battleship-level armament with a cruiser hull. A ship that outguns any other known cruiser, but which is also expensive, comparatively slow and relatively poorly armored."
 GER_panzerschiff:0 "Panzerschiff"
 ship_hull_super_heavy_1:0 "Great Battleship"
 ship_hull_super_heavy_1_desc:0 "The current state of the world no longer has any room for abiding by naval treaties. Without these limitations, we can focus entirely on creating the heaviest, most well-armed battleships of all time, able to engage multiple lesser vessels."
 ship_hull_cruiser_submarine:0 "Cruiser Submarine"
 ship_hull_cruiser_submarine_desc:0 "A larger submarine hull optimized for longer range. Can be equipped with additional fuel tanks for even more range, or a small scout airplane."
 ship_hull_fleet_submarine:0 "Fleet Submarine"
 ship_hull_fleet_submarine_desc:0 "Submarines that thanks to their long operational ranges can operate as surface fleet escorts and support."
 ship_hull_coastal_submarine:0 "Coastal Submarine"
 ship_hull_coastal_submarine_desc:0 "A small, maneuverable submarine with a shallow draft well suited to navigating coastal channels and harbors. Space limitations allow them to reach areas inaccessible to larger submarines, and be more difficult to detect."
