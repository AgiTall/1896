 grand_battlefleet:0 "Grand Battlefleet"
 grand_battlefleet_desc:0 "Leadership training allow our commanders to keep calm in the heat of battle even when commanding immense fleets. Our fleet will crush any opposition head on."
 lc_rocket_launcher:0 "Rocket Launcher"
 lc_rocket_launcher_desc:0 "A modular rocket system mounted on the Land Cruiser, delivering devastating rocket barrages to suppress enemy defenses and overwhelm large formations."
 tank_radio_2:0 "Improved Radio"
 tank_radio_2_desc:0 "An improved radio allows commanders effective control over larger formations of tanks, permitting large-scale operational maneuvers."
 explosive_ammo_equipment_1:0 "$mega_gun_emplacement$"
 explosive_ammo_equipment_1_desc:0 "A high-explosive projectile that can be fired from a Large Caliber Multi-Charge Gun, capable of reaching targets at very long range."
 cas_ace_initiative:0 "Ground Attack Ace Initiative"
 cas_ace_initiative_desc:0 "Formally recognizing and rewarding Ace CAS pilots encourages daring and initiative."
 TITLE_TRADE_INTERDICTION:0 "Trade Interdiction"
 sp_refined_pykrete:0 "Refined Pykrete"
