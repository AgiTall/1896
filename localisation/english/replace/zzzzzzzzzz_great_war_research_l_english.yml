 interwar_ship_hull_cruiser:0 "1908 Cruiser"
 interwar_ship_hull_cruiser_desc:0 "Development of military technology and industry."
 basic_cruiser_armor_scheme:0 "Basic Cruiser Armor Scheme"
 basic_cruiser_armor_scheme_desc:0 "An armor scheme that copies the split between belt and deck armor seen in Capital Ships and offers some protection against splinters and small-caliber guns.\n\nMounting this module on §YCruisers§! improves their ability to §Ywithstand enemy damage§!, but also §Rreduces§! their §Yspeed§!."
 improved_cruiser_armor_scheme:0 "Inclined Belt Cruiser Armor Scheme"
 improved_cruiser_armor_scheme_desc:0 "By placing the belt armor at an angle, the same weight and thickness of armor are much harder to pierce.\n\nMounting this module on §YCruisers§! improves their ability to §Ywithstand enemy damage§!, but also §Rreduces§! their §Yspeed§!."
 advanced_cruiser_armor_scheme:0 "All-or-Nothing Cruiser Armor Scheme"
 advanced_cruiser_armor_scheme_desc:0 "This scheme focuses on only protecting the most vital areas of the ship, while ignoring the unimportant parts. \n\nMounting this module on §YCruisers§! improves their ability to §Ywithstand enemy damage§!, but also §Rreduces§! their §Yspeed§!."
 ironclad_ship_hull_heavy_desc:0 "Development of military technology and industry."
