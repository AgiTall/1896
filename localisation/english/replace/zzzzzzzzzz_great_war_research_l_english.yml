 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing_desc:0 "The [SpecialProject.GetName] cannon has just successfully completed a milestone test firing, demonstrating its impressive range and accuracy. This achievement has boosted morale among the research team and garnered attention from high-ranking officials, providing momentum for the project and renewed optimism for its success."
 air_offense:0 "Fighter Escorts"
 air_offense_desc:0 "With a focus on bombing during the day we need to keep our bombers safe from intercepting fighters. Training our fighter pilots to work closely with the bombers will improve their fighting abilities when protecting the bombers in enemy airspace."
 mio_cat_eq_only_tactical_bomber:0 "Light Bomber"
