 basic_light_tank_chassis:0 "Early Light Tank Chassis"
 basic_light_tank_chassis_desc:0 "Technological advances have made the designs of the immediate post-war period effectively obsolete. The modern battlefield requires a new, clean design incorporating advances in metallurgy and interior layout."
 improved_light_tank_chassis:0 "Basic Light Tank"
 improved_light_tank_chassis_desc:0 "A further iteration based on the experiences gained with previous light tanks, this chassis allows for better reliability and maintenance."
 advanced_light_tank_chassis:0 "Improved Light Tank"
 advanced_light_tank_chassis_desc:0 "With medium tanks increasingly taking center stage in the fight, light tanks have largely been relegated to supporting roles. A new chassis design is needed that takes the needs of these roles into account."
 basic_heavy_tank_chassis:0 "Early Heavy Tank Chassis"
 basic_heavy_tank_chassis_desc:0 "A thorough analysis of the Great War has shown that there is a need for a heavy vehicle to break through the enemy trench line and open up the way for lighter forces to exploit the breakthrough. Such a vehicle should heavily armed and well armored, but doesn't have to be very fast."
 improved_heavy_tank_chassis:0 "Basic Heavy Tank"
 improved_heavy_tank_chassis_desc:0 "While the nature of warfare has changed, there is still a place for a heavy vehicle with thick armor to create a breakthrough in the enemy lines, or to shore up defenses against an enemy attack."
 advanced_heavy_tank_chassis:0 "Improved Heavy Tank"
 advanced_heavy_tank_chassis_desc:0 "With the advances in armor and firepower, a modern tank needs to carry thick armor and a large gun to be effective. This necessitates a large vehicle."
 basic_medium_tank_chassis:0 "Early Medium Tank Chassis"
 basic_medium_tank_chassis_desc:0 "While light tanks have formed the backbone of mechanized formations in past years, it is becoming clear that their growth potential is nearly exhausted. In the future, we will need a bigger vehicle, which still retains a high level of mobility."
 improved_medium_tank_chassis:0 "Basic Medium Tank"
 improved_medium_tank_chassis_desc:0 "Building on the experiences of previous generation of medium tanks, it is clear that a new design with greater carrying capacity is needed to stay relevant."
 advanced_medium_tank_chassis:0 "Improved Medium Tank"
 advanced_medium_tank_chassis_desc:0 "The rapid growth of weight in weapon systems and armor strength requires an even bigger chassis, creating a vehicle the size of earlier heavy tanks."
 super_heavy_tank_chassis:0 "Early Super-Heavy Tank Chassis"
 super_heavy_tank_chassis_desc:0 "A gigantic vehicle, capable of mounting the heaviest armor and the biggest gun, but consequently fairly slow and unreliable."
 engine_tech_1:0 "Basic Engine"
 engine_tech_1_desc:0 "Where the tanks of the Great War were slow, lumbering beasts, the modern tank relies very much on speed and mobility to achieve victory."
 engine_tech_2:0 "Improved Engine"
 engine_tech_2_desc:0 "With bigger guns and heavier armor, the new generation of tanks requires a more powerful engine to remain mobile."
 engine_tech_3:0 "Advanced Engine"
 engine_tech_3_desc:0 "Mechanized warfare is a form of combat that requires fast decision making and fast movement of troops and supplies. If our tanks are to carry modern weapons and enough armor to survive on the battlefield, they require powerful engines to keep up with the motorized infantry."
 engine_tech_4:0 "Modern Engine"
 engine_tech_4_desc:0 "The numerous new additions to tanks made necessary by modern warfare have increased the weight of the vehicle substantially. To move all that mass around, we require engines that have a lot of power behind them."
 armor_tech_1:0 "Basic Armor Protection"
 armor_tech_1_desc:0 "Tanks during the Great War only had to contend with enemy small arms. As such, they got away with fairly thin armor. A new generation of anti-tank weaponry has made the battlefield a much more dangerous place for a tank, and much heavier protection is needed."
 armor_tech_2:0 "Improved Armor Protection"
 armor_tech_2_desc:0 "With heavier and heavier anti-tank weapons being fielded around the world, the next generation of tanks will require even better protection."
 armor_tech_3:0 "Advanced Armor Protection"
 armor_tech_3_desc:0 "While the limit of deployed anti-tank guns has likely been reached, a new generation of tanks will carry more advanced weaponry, which is able to pierce any current level of protection at long range."
 armor_tech_4:0 "Modern Armor Protection"
 armor_tech_4_desc:0 "During the war, the threats faced by tanks have multiplied, from enemy tanks, anti-tank guns, dedicated tank destroyers, all the way to modern infantry weapons firing shaped charges that can penetrate even heavy armor. We must develop new protection methods to keep our own tanks alive in the face of these threats."
 stronghold_network_tech:0 "Stronghold Network Tech"
 stronghold_network_tech_desc:0 "Development of military technology and industry."
 tech_support_desc:0 "Development of military technology and industry."
 tech_engineers:0 "Engineer Company I"
 tech_engineers_desc:0 "Construction of fortifications and breaching obstacles make combat engineers vital in the field. Giving our engineers a versatile role enables us to deploy them in the diverse situations where they will be needed."
 tech_engineers2:0 "Engineer Company II"
 tech_engineers2_desc:0 "With modern equipment and high explosives, our engineers can go beyond their traditional tasks and surprise the enemy with their ingenuity, at land and sea."
 tech_engineers3:0 "Engineer Company III"
 tech_engineers3_desc:0 "Military engineering projects are approaching a larger scale. The construction of advanced infrastructural aid enables operations requiring supplies beyond what is normally available in the field."
 tech_engineers4:0 "Engineer Company IV"
 tech_engineers4_desc:0 "Maintaining local mobility while constructing what would previously have been considered permanent fortifications and supply systems, combat engineers of the future will ensure that no matter where our troops are attacked, they will be prepared."
 tech_recon:0 "Recon Company I"
 tech_recon_desc:0 "Sending smaller groups to scout ahead before moving in the main force allows us to gather intelligence about where the enemy is and how many we are facing."
 tech_recon2:0 "Recon Company II"
 tech_recon2_desc:0 "Reconnaissance missions are often dangerous and casualties are high. Preparing our patrols to move and withdraw rapidly and equipping them to clear obstacles placed by the enemy will increase their chances of coming back alive."
 tech_recon3:0 "Recon Company III"
 tech_recon3_desc:0 "Improvements in radio technology change the way reconnaissance missions can be executed, enabling rapid communication of the gathered intelligence."
 tech_recon4:0 "Recon Company IV"
 tech_recon4_desc:0 "Deep reconnaissance operations, mixing espionage, guerilla operations and commando training, will aid our tactical choices and allow us to adapt our decision-making rapidly."
 tech_military_police:0 "Military Police I"
 tech_military_police_desc:0 "Regular troops may be able to manage occupation for a shorter period of time, but they are first and foremost soldiers. Integrating military police into our forces will ensure we have people on the ground to respond to resistance and investigate sabotage."
 tech_military_police2:0 "Military Police II"
 tech_military_police2_desc:0 "By engaging in regular police duties in occupied territories, such as traffic control and maintaining public order, our military police can minimize the chaos and confusion which partisan movements thrive in."
 tech_military_police3:0 "Military Police III"
 tech_military_police3_desc:0 "Cooperating with local spy networks and informers established before occupation, our military police can proactively prepare for where resistance is likely to arise."
 tech_military_police4:0 "Military Police IV"
 tech_military_police4_desc:0 "Safely policing occupied territory is as much about returning to normalcy as it is about ruthlessly eliminating opposition. Our military police must ensure that this process starts early, to ensure safety for soldiers and civilians alike."
 tech_maintenance_company:0 "Maintenance Company I"
 tech_maintenance_company_desc:0 "Maintenance, repair and overhaul are important to keep military equipment reliable and safe to use. Having companies dedicated to this will ensure that it's given appropriate attention."
 tech_maintenance_company2:0 "Maintenance Company II"
 tech_maintenance_company2_desc:0 "Routine operational maintenance procedures minimize the risks of equipment breaking down and alerts troops to replace it before it does."
 tech_maintenance_company3:0 "Maintenance Company III"
 tech_maintenance_company3_desc:0 "Making sure that our troops always have the basic materials in the field to perform common repairs will prevent the continued use of equipment known to be damaged."
 tech_maintenance_company4:0 "Maintenance Company IV"
 tech_maintenance_company4_desc:0 "Experiences with designing for active redundancy in the Great War can be renewed to work with more modern equipment to make maintenance easier."
 tech_field_hospital:0 "Field Hospital I"
 tech_field_hospital_desc:0 "A casualty doesn't need to mean a dead soldier. Having immediate medical attention available for our wounded brought back to the rear is the first step towards ensuring this."
 tech_field_hospital2:0 "Field Hospital II"
 tech_field_hospital2_desc:0 "By establishing the use of portable hospitals, bringing the medical care to where it is needed, we can stop many unnecessary deaths and permanent injuries."
 tech_field_hospital3:0 "Field Hospital III"
 tech_field_hospital3_desc:0 "Surgery is among the most common emergency procedures needed in the field. Procedures and tools for this must be available closer to the front, and we must ensure that skilled surgeons are part of the military medical units."
 tech_field_hospital4:0 "Field Hospital IV"
 tech_field_hospital4_desc:0 "Although many improvements have been made in field medicine, many advances are improvised and we lack an established doctrine. With more experience, we can explain the role of these units more clearly and make improvised innovations permanent fixtures."
 tech_logistics_company:0 "Logistics Company I"
 tech_logistics_company_desc:0 "Having specialized Logistics Officers among our ranks will ensure that support networks are leveraged to minimize waste."
 tech_logistics_company2:0 "Logistics Company II"
 tech_logistics_company2_desc:0 "Adapting our risk analyses to the new circumstances of war will improve the safety of our logistical support."
 tech_logistics_company3:0 "Logistics Company III"
 tech_logistics_company3_desc:0 "Continued statistical evaluation of troop supply needs contribute to maximizing the utility of our resources."
 tech_logistics_company4:0 "Logistics Company IV"
 tech_logistics_company4_desc:0 "Developing standardized classifications for supplies will minimize confusion and make planning more efficient."
 tech_signal_company:0 "Signal Company I"
 tech_signal_company_desc:0 "Establishing and maintaining communications in the field has always required special skills. With the advent of new communications and detection technology in the Great War, new possibilities for the practice lie ahead."
 tech_signal_company2:0 "Signal Company II"
 tech_signal_company2_desc:0 "Signal companies focusing on communication between the different branches of the military can ensure that ground forces are able to coordinate efforts with sea and air operations and plan their movements more rapidly."
 tech_signal_company3:0 "Signal Company III"
 tech_signal_company3_desc:0 "Increasingly portable communications technology is more viable to be personally carried as a backpack. This increased mobility of signal corps must be utilized."
 basic_train:0 "Civilian Train"
 basic_train_desc:0 "Development of military technology and industry."
 railway_gun:0 "Railway Gun"
 wartime_train:0 "War Austerity Train"
 wartime_train_desc:0 "Development of military technology and industry."
 armored_train:0 "Armored Train"
 armored_train_desc:0 "Development of military technology and industry."
 hq_motorized:0 "Motorized HQ Security"
 hq_motorized_desc:0 "Infantry in motorized vehicles, allowing more rapid relocation of the HQ."
 sp_tag_rocket:0 "Rocketry Projects"
 street_fighting:0 "Street Fighting"
 sp_naval_modern_battleship_preference_a_a:0 "Raw Firepower"
 tactic_attacker_hb_storm:0 "Storm Bridge"
 infiltration_in_depth:0 "Infiltration in Depth"
 infiltration_in_depth_desc:0 "Our forces are now trained to bypass and isolate enemy strongpoints to a much greater depth, ideally our assault forces should not stop until they reach the enemy's rear areas and their forces are completely cut off."
 bb_tech:0 "Battleship models"
 assault_breakthrough:0 "Assault Breakthrough"
 assault_breakthrough_desc:0 "Rather than launching a grand assault across the entire front, it can be much more effective to concentrate the strike on only one, or a few, points of the enemy line and achieve a breakthrough there."
 SUBDOCTRINE_EXPEDITIONARY_WARFARE_DESC:0 "All the combat power in the world means little if it cannot get to the fight. We shall create an organizational emphasis on force projection capability in service of our strategic aims."
 naval_minelaying:0 "Naval Minelaying Technology"
 cat_operational_integrity:0 "Operational Integrity Doctrine"
 tactic_gas_cylinder_failing:0 "Accidental Gas Release"
 sp_naval_modern_battleship_preference_c_b:0 "Torpedo Protection"
 cat_heavy_armor:0 "Heavy Tank models"
 SUBDOCTRINE_FIGHTER_CENTRAL_FIELD_DESC:0 "Air power is the dominant weapon of the age, and the aircraft carrier allows its devastating striking potential to have a global reach."
 sp_naval_fleet_submarine_preference_b:0 "Sturdier Structure"
 sp_air_earthshaker_bomb:0 "Earthshaker Bomb"
 sp_air_earthshaker_bomb_desc:0 "A heavy bomb that is constructed in such a way that it penetrates the ground before it detonates, causing massive structural damage to the target."
 sp_land_generic_reward_engine_bonus_1:0 "Fuel Efficiency Engines"
 sp_land_generic_reward_engine_bonus_1_desc:0 "The latest tweaks on the experimental engine for the [SpecialProject.GetName] prototype have resulted in a significant improvement in tank engine performance overall. The meticulous work of [Character.GetName] and [Character.GetHerHis] team has pushed the boundaries of engineering, promising enhanced capabilities if we apply these innovations into our regular tank engines."
 sp_air_generic_reward_test_failure_2:0 "Breaking Bomb"
 armor_tech_4_tt:0 "Enables Armor Upgrade values of 18 and above."
 SUBDOCTRINE_THEATER_INTERDICTION_DESC:0 "Freed from the risk of hitting friendly troops, our bomber fleet can range unhindered in the enemy's rear areas, sowing havoc and aiding the fighting fronts indirectly."
 sp_naval_generic_reward_navy_xp_2:0 "Wave of Ideas"
 antitank1:0 "Anti-Tank Upgrade"
 antitank1_desc:0 "The importance of effective anti-tank weapons was established in the Great War. Introducing a new generation of these weapons will be necessary to combat modern tank designs."
 additional_machine_guns:0 "Additional Machineguns"
 additional_machine_guns_desc:0 "A set of machineguns in sponsons and special pintle mounts give the vehicle improved defense against close-in infantry attack."
 category_tank_destroyers:0 "Tank Destroyers"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02:0 "$sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01$"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02_desc:0 "A new reinforcement method discovered by one of the junior engineers has been forwarded to an outside research team for further evaluation. While the findings are still under review, the technique can still be applied to the current project if deemed suitable."
 OR:0 "or"
 small_plane_airframe_4:0 "Modern Small Airframe"
 small_plane_airframe_4_desc:0 "This airframe is designed to take advantage of the great speeds offered by modern engines and solve some of the structural problems that come with flying at high sub-sonic speeds."
 AMC_desc:0 "Armored Motor Car Company."
 tactic_handmade_gas_masks:0 "Handmade Gas Mask Retreat"
 SUBDOCTRINE_NAVAL_TORPEDO_TACTICS_DESC:0 "A few torpedos can be evaded. Dozens of them all at once can lay the most hardened target low through sheer volume."
 USA_maneuver_divison:0 "The Maneuver Divison"
 sp_land_reward_option_multi_charge_large_caliber_gun_successful_test_firing_desc:0 "The [SpecialProject.GetName] cannon successfully completed a milestone test firing, demonstrating its impressive range and accuracy. This achievement boosted morale among the research team and garnered attention from high-ranking officials, providing momentum for the project and renewed optimism for its success."
 damaged_light_guns:0 "Light Battery Mount Disabled"
 floating_fortress_bs:0 "Floating Fortress"
 floating_fortress_bs_desc:0 "With battleships on highest alert we will always be prepared to respond if the enemy dares threaten our waters. Any fleet needs a solid foundation and the power of the battleship is unparalleled."
 firebrigades:0 "Fire brigades"
 firebrigades_desc:0 "'Fire brigades' were hastily scrambled forces thrown together to react to enemy breakthroughs or other critical issues.\n\n"
 plains:0 "Plains"
 plains_desc:0 ""
 sp_naval_modern_battleship_unique_reward_a:0 "Modern Battleship - Hope"
 sp_naval_modern_battleship_unique_reward_a_desc:0 "While many are claiming that the age of the battleship is over, we still believe in them. This ship has a chance to become a new hope for us. Which aspect should we focus on in order to make the dream come true?"
 jet_technology:0 "Jet technology"
 delay:0 "Delay"
 delay_desc:0 "Even when a battle cannot be won, it can be advantageous to slow the progress of attacking forces with ambushes and delaying tactics."
 sp_land_generic_reward_option_armor_bonus_desc:0 "Integrate this new alloy into our production lines."
 sp_naval_super_heavy_battleship_unique_reward_a:0 "Matter of Priorities - Attack"
 sp_naval_super_heavy_battleship_unique_reward_a_desc:0 "Designing a new class of battleships allows us the opportunity to focus our efforts on improving our ability to dominate naval battlefield. What should we prioritize?"
 heavy_armor_advice_tt:0 "\nMounting a better §YArmor§! module on §YHeavy Ships§! improves their ability to withstand damage. §YBattleships§! and §YBattlecruisers§! are defined by their different §YArmor Schemes§!, with Battlecruisers generally having worse armor."
 sp_air_generic_reward_test_failure_3:0 "Creative Disaster"
 undersea_blockade:0 "Undersea Blockade"
 undersea_blockade_desc:0 "Submarines are the perfect tool for cutting of the enemy's inflow of important raw materials. We will cripple the enemy's production and win by starving them out."
 category_anti_tank:0 "All Anti-Tank Artillery"
 sp_land_reward_option_land_cruiser_communication_redesign_bonus_name:0 "Redesigned Communication System"
 tank_small_cannon:0 "Small Cannon"
 tank_small_cannon_desc:0 "A small and cheap cannon, able to fire both anti-infantry and anti-armor rounds. Its small caliber limits its usefulness."
 sp_torpedo_cruiser_eq_bonus_light_attack:0 "Torpedo Cruiser - Light Artillery Improvements"
 SUBDOCTRINE_OPEN_OCEAN_AIR_PATROL_DESC:0 "The range of modern aircraft allows for naval search and strike missions against enemy assets well before they threaten our coasts."
 sp_land_reward_option_stronghold_network_collapse_01_continue_without_delay:0 "Continue Without Delay"
 SUBDOCTRINE_SCREEN_PATROL_BOATS_DESC:0 "Cheap fast attack craft armed with torpedos are a powerful tool against a traditional battle fleet of heavy ships, particularly in coastal waters where they can strike from ambush."
 extra_ammo_storage:0 "Extra Ammunition Storage"
 extra_ammo_storage_desc:0 "Additional racks of ready ammunition allow the tank to stay in the fight much longer without resupply. However, if the armor is penetrated, the results are likely to be catastrophic. This is particularly problematic when attacking."
 cv_tech:0 "Carrier models"
 sp_armored_advanced_flamethrower_tech:0 "Advanced Flamethrower"
 sp_armored_advanced_flamethrower_tech_desc:0 "$advanced_flamethrower_desc$"
 tactic_gas_artillery_tear:0 "Tear Gas Artillery Barrage"
 cat_medium_armor:0 "Medium Tank models"
 category_anti_air:0 "Anti-Air Battalions"
 mio_cat_tech_all_armor_and_modules:0 "All Armor Technologies"
 sp_super_heavy_battleship_eq_bonus_light_attack:0 "Super Heavy Battleship - Light Artillery Improvement"
 specialization_nuclear:0 "Nuclear Research"
 GRAND_DOCTRINE_MASS_ASSAULT:0 "Mass Assault"
 GRAND_DOCTRINE_GRAND_BATTLEPLAN_DESC:0 "With sufficient preparation, no obstacle is insurmountable - Grand Battleplan is characterized by patient, meticulous preparation of all arms, in both attack and defense."
 SUBDOCTRINE_FIRE_CONCENTRATION:0 "Fire Concentration"
 field_hospital:0 "Field Hospital"
 field_hospital_desc:0 "Provides emergency medical attention to wounded soldiers in the field."
 desert:0 "Desert"
 desert_desc:0 ""
 mio_cat_tech_all_capital_ship_and_modules:0 "All Capital Ship Technologies"
 air_techs_folder:0 "Air"
 air_techs_folder_desc:0 "Aircraft and their variants."
 werwolf_guerillas:0 "Werwolf Guerrillas"
 werwolf_guerillas_desc:0 "The Werwolves were a planned German resistance group that would fight on against the occupying powers when the war was lost."
 sp_naval_underway_replenishment_preference_c:0 "Find a Balance"
 sp_naval_generic_reward_armor_tech_1:0 "New Armor Studies"
 tactic_defender_sb_retake_bridge:0 "Recapture Bridge"
 subsidiary_carrier_role_ti:0 "Subsidiary Carrier Role"
 subsidiary_carrier_role_ti_desc:0 "Carriers support Battleships, improving their readiness in switching from defense to offense. The utility of the Carrier as both an eye in the sky and a powerful quick strike force complement the slower Battleships well."
 unrestricted_submarine_warfare:0 "Unrestricted Submarine Warfare"
 unrestricted_submarine_warfare_desc:0 "Let our submarines sink any vessel without warning, civilian or not. While some consider this a breach of the rules of war, there is no denying its effectiveness."
 sp_land_generic_reward_major_progress_1_desc:0 "[Character.GetName] has achieved a major breakthrough, propelling the project significantly forward, validating [Character.GetHerHis] expertise and energizing the research team. With this progress, the project moves closer to its goal, cementing [Character.GetName]'s legacy as a trailblazer."
 SUBDOCTRINE_SUBMARINE_WOLFPACKS:0 "Wolfpacks"
 SAF:0 "South Africa"
 gw_tank_equipment:0 "Great War Tank"
 gw_tank_equipment_desc:0 "Tanks in World War I were developed separately and simultaneously by the United Kingdom and France as a means to break the deadlock of trench warfare on the Western Front. The name Tank was adopted by the British during the early stages of their development, as a security measure to conceal their purpose. Early tanks were armed with machine guns and small cannons, moved slowly, and were armored only enough to stop small arms fire."
 armor:0 "Armor technology"
 ZHC:0 "Zhili"
 convoy_interdiction:0 "Convoy Interdiction"
 convoy_interdiction_desc:0 "Improved coordination of our submarines will let them strike at trade convoys en route. Disrupting the enemy's supply lines will give us the strategic advantage."
 recon_tech:0 "Reconnaissance Company"
 YUN:0 "Yunnan"
 USA:0 "America"
 has_invested_in_schneider:0 "Has invested in Schneider"
 backhand_blow:0 "Backhand Blow"
 backhand_blow_desc:0 "Rather than fighting for every inch of ground, enemy penetrations are largely avoided until they have extended themselves, at which point they can be cut off and destroyed by counterattacks."
 lc_helipad:0 "Helipad"
 lc_helipad_desc:0 "A platform for launching helicopters, designed to provide advanced aerial reconnaissance and improved situational awareness on the battlefield."
 heavy_tank_flame_chassis:0 "Heavy Flame Tank"
 heavy_tank_flame_chassis_desc:0 "A large vehicle, carrying a flamethrower in its turret to attack fortifications and houses."
 infantry_tech:0 "Infantry technology"
 DOCTRINE_TRACK_HEAVY_AIRCRAFT:0 "Heavy Aircraft"
 medium_plane_airframe_3:0 "Advanced Medium Airframe"
 medium_plane_airframe_3_desc:0 "Engineered to maximize performance and payload, this airframe represents the pinnacle of conventionally-powered airplanes."
 supply_node:0 "Supply Hub"
 supply_node_desc:0 "A Supply Hub is a point along a railway, outside of existing cities, where supply can be drawn."
 antitank3:0 "Improved Anti-Tank Upgrade I"
 antitank3_desc:0 "HEAT (high-explosive anti-tank) rounds can be used in anti-tank artillery to make up for limited muzzle velocity."
 ship_anechoic_tile:0 "Anechoic Tiles"
 ship_anechoic_tile_desc:0 "Rubber tile coating that is designed to reduce the range at which ship can be detected by both passive and active sonar."
 tank_light_fixed_superstructure_turret:0 "Light Fixed Superstructure"
 tank_light_fixed_superstructure_turret_desc:0 "A fixed superstructure only allows the main armament to traverse in a small arc without turning the entire vehicle. However, it allows the vehicle to mount a bigger armament while being overall of smaller size, making the vehicle perfect for ambushes."
 medium_battery_advice_tt:0 "\n\nMounting §YLight Medium Battery§! or §YMedium Battery§! modules on §YCruisers§! improves their §YLight Gun Attack§! or §YHeavy Gun Attack§!, enabling them to fight enemy §YScreen Ships§! or §YCapital Ships§!. Mounting any §YMedium Battery§! will designate a ship as a §YHeavy Cruiser§!, while mounting only §YLight Medium Battery§! will designate a ship as a §YLight Cruiser§!."
 modern_large_airframe:0 "$large_plane_airframe_4$"
 modern_large_airframe_desc:0 "$large_plane_airframe_4_desc$"
 SUBDOCTRINE_LINE_OF_BATTLE:0 "Line of Battle"
 sp_naval_nuclear_torpedo:0 "Nuclear Torpedo"
 sp_naval_nuclear_torpedo_desc:0 "With the advent of low-yield tactical warheads, long-range torpedos with these warheads attached could theoretically be deployed by any conventional submarine."
 ss_tech:0 "Submarine models"
 FRA_land_army_restrictions:0 "French Army Restrictions"
 SUBDOCTRINE_EXPEDITIONARY_WARFARE:0 "Expeditionary Warfare"
 sp_land_reward_option_land_cruiser_engine_modify_bonus_name:0 "Improved Engine"
 tac_bomber_equipment_0:0 "Inter-War Bomber"
 tac_bomber_equipment_0_desc:0 "It is widely believed that the next war will be won entirely by bombing the enemy to extinction. It is imperative that we begin designing our own bomber plane that is capable of carrying heavy payloads at adequate speed."
 sp_naval_fleet_submarine_preference_a:0 "Attack Capability"
 anti_air:0 "Support Anti-Air"
 anti_air_desc:0 ""
 modern_battleship:0 "$ship_hull_heavy_modern$"
 amphibious_mechanized:0 "Amtrac Battalion"
 amphibious_mechanized_desc:0 "An armored infantry unit in amphibious vehicles."
 sp_land_reward_option_land_cruiser_suspension_full:0 "Full Hydropneumatic Suspension"
 mio_cat_eq_all_small_plane:0 "All Small and Carrier Planes"
 sp_naval_proximity_fuze:0 "Proximity Fuze"
 sp_naval_proximity_fuze_desc:0 "With improved and more reliable radio technology, we can develop new kind of fuzes, that would explode by just being in the proximity of the target, and damaging it."
 nuclear_submarine:0 "$ship_hull_nuclear_submarine$"
 nuclear_submarine_desc:0 "$ship_hull_nuclear_submarine_desc$"
 stabilizer:0 "Stabilizer"
 stabilizer_desc:0 "A mechanical device to keep the gun pointing in the same direction when the tank is moving. While not advanced enough to allow accurate firing on the move, it does allow the gunner to fire accurately during a short stop, without having to re-acquire the target."
 SUBDOCTRINE_LARGE_UNIT_TACTICS_DESC:0 "If we can master concentrated operations on a narrow front, we can create local superiority to overwhelm the enemy at the point of main effort and create a breakthrough."
 SUBDOCTRINE_MOBILE_INFANTRY_DESC:0 "Focus our infantry on mobility to keep up the pace of advances and avoid getting bogged down in costly positional fighting."
 fuel_silo:0 "Fuel Silo"
 fuel_silo_desc:0 "This building provides your nation with more room for stockpiling §HFuel§!."
 tactic_ambush:0 "Ambush"
 sp_land_reward_option_land_cruiser_turret_redesign_bonus_name:0 "Redesigned Turret Mechanism"
 sp_land_reward_option_land_cruiser_ammunition_simplified:0 "Use a Simplified Version"
 SUBDOCTRINE_MOBILE_INFANTRY:0 "Mobile Infantry"
 mio_cat_tech_all_destroyer_and_modules:0 "All Destroyer Technologies"
 rocket_submarine:0 "Missile Launching Submarine"
 rocket_submarine_desc:0 "A new generation of submarines, equipped with missiles and launch systems, providing us the opportunity to strike unexpectedly our enemies strategic targets"
 ITA_italian_tankettes:0 "Italian Tankettes"
 ITA_italian_tankettes_desc:0 "While other countries might develop ever larger and ever heavier tanks in search of the super-tank that will render all other tanks obsolete, we know that the best tank is a tank that is actually on the field. A tank must be fast enough to go wherever it is needed in time, and it really only needs armor heavy enough to withstand rifles. Such a vehicle would be cheap and quick to produce."
 heavy_tank_chassis_1:0 "Basic Heavy Tank"
 armored_engineer:0 "Armored Engineer Company"
 armored_engineer_desc:0 "Versatile vehicles equipped for constructing fortifications, clearing obstacles and enhancing battlefield mobility under combat conditions."
 SUBDOCTRINE_GUERILLA_WAR:0 "Guerilla War"
 cat_base_strike:0 "Base Strike Doctrine"
 naval_air:0 "Naval aircraft"
 tank_rocket_launcher_2:0 "Improved Rocket Launcher"
 tank_rocket_launcher_2_desc:0 "While there are a number of improvements to accuracy, the main advantage of this improved rocket launcher is that it can hold more rockets to fire at the enemy."
 convoy_sailing_ti:0 "Convoy Sailing"
 convoy_sailing_ti_desc:0 "Introducing compulsory convoy sailing will make it easier to spot enemy raids and respond in time. Safety in numbers is the way to go."
 cat_air_guns:0 "Aircraft Guns"
 sp_air_supersonic_jet:0 "Supersonic Jet"
 sp_air_supersonic_jet_desc:0 "Advancements in jet engine technology are paving the way for aircraft capable of reaching Mach 1 and breaking the sound barrier."
 ship_torpedo_sub_nuclear:0 "Nuclear Torpedo"
 ship_torpedo_sub_nuclear_desc:0 "Torpedoes that carry a nuclear warhead, providing a highly effective weapon against enemy ships, at the cost of higher risk for accidents."
 branch_interoperation:0 "Branch Inter-Operation"
 branch_interoperation_desc:0 "Increased coordination between the different branches of the armed forces allows them to work better in combined arms operations."
 sp_land_reward_stronghold_network_underground_rail_systems:0 "Underground Rail Systems"
 medium_tank_aa_chassis:0 "Medium SP Anti-Air"
 medium_tank_aa_chassis_desc:0 "A well-balanced vehicle, carrying an anti-air gun to defend against enemy planes."
 tactic_gas_mask_charge_attack:0 "Gas Mask Charge"
 bouncing_bomb_release:0 "Bouncing Bomb Release Mechanism"
 bouncing_bomb_release_desc:0 "A bomb rack for carrying and releasing special bouncing bombs, that skid across the water until they hit their targets. The mechanism sets the bomb spinning backwards during the release, making it more likely to reach its intended structural target."
 aggressive_assaulter:0 "Aggressive Assaulter"
 aggressive_assaulter_desc:0 "§LThe best defence is a strong offence.§!"
 tank_torsion_bar_suspension:0 "Torsion Bar"
 tank_torsion_bar_suspension_desc:0 "A fairly reliable suspension system of metal bars fixed to the vehicle chassis that provides a smoother ride than other suspension types."
 category_special_forces:0 "Special Forces"
