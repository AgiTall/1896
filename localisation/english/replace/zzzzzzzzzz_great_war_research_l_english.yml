 light_air:0 "Light aircraft"
 chromium_desc:0 "Chromium is a metal used for the construction of advanced engines."
 SUBDOCTRINE_SCREEN_JEUNE_ECOLE_DESC:0 "A doctrinal concept emphasizing swarms of small ships, torpedo strikes, and indirect commerce warfare as an antidote to the old notion of a big gun slugging match on the high seas."
 tank_anti_air_cannon:0 "Basic Anti-Air Gun"
 tank_anti_air_cannon_desc:0 "A fast-firing automatic gun designed to engage aircraft. It has limited potential as a fire-support weapon against ground targets."
 FIN:0 "Finland"
 SUBDOCTRINE_SCREEN_INTEGRATED_OPERATIONS_DESC:0 "Screening forces lack the firepower of capital ships, but using speed as armor, they can provide valuable service even in a pitched naval battle."
 sp_modern_battleship_eq_bonus_anti_torpedo:0 "Modern Battleship - Better Torpedo Damage Control"
