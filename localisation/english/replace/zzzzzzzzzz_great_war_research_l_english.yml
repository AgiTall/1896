 sp_land_generic_reward_option_major_breakthrough_desc:0 "[Character.GetName] achieved a major breakthrough, propelling the project significantly forward, validating [Character.GetHerHis] expertise and energizing the research team. With this progress, the project moved closer to its goal, cementing [Character.GetName]'s legacy as a trailblazer."
 category_mobile_anti_tank:0 "Mobile Anti-Tank Artillery"
 lc_medium_cannon_turret:0 "Coaxial Medium Cannon"
