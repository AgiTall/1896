 tank_designer_signal:0 "Signal (Support Company)"
 tank_designer_signal_role_disallowed:0 "Add a module that allows the §HSignal§! role to be able to switch to it."
 tank_designer_armored_car_chassis:0 "Armored Car"
 armored_car_one_man_tank_turret:0 "One Man Turret"
 armored_car_one_man_tank_turret_desc:0 "A small turret barely large enough to hold a single crew member, who is tasked with aiming and loading the main armament as well as keeping watch for targets and threats."
 armored_car_two_man_tank_turret:0 "Two Man Turret"
 armored_car_two_man_tank_turret_desc:0 "A turret that allows for two crew members to share the work of operating the armament and observing the situation. It still does not allow for an effective division of labor amongst the crew."
 armored_car_fixed_superstructure_turret:0 "Fixed Superstructure"
 armored_car_fixed_superstructure_turret_desc:0 "A fixed superstructure only allows the main armament to traverse in a small arc without turning the entire vehicle. However, it allows the vehicle to mount a bigger armament while being overall of smaller size, making the vehicle perfect for ambushes."
 armored_car_secondary_turret_hmg:0 "Machinegun Turret"
 armored_car_secondary_turret_hmg_desc:0 "A heavy machine gun in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."
 armored_car_secondary_turret_small_cannon:0 "Small Cannon"
 armored_car_secondary_turret_small_cannon_desc:0 "A small cannon in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."
 EQ_MOD_CAT_armored_car_secondary_turret_TITLE:0 "Secondary Turret"
 EQ_MOD_CAT_armored_car_turret_type_TITLE:0 "Turret"
 armored_car_truck_design:0 "Truck Design"
 armored_car_truck_design_desc:0 "The vehicle is arranged like a truck, with a high cabin with front openings leaving no room for large armament. While this method is economical and reliable, it limits the offensive capabilities of the vehicle."
 tank_double_heavy_machine_gun:0 "Double Machinegun"
 tank_double_heavy_machine_gun_desc:0 "Twin machine guns provide good performance against infantry. Unfortunately, the piercing capabilities of AP ammo are not any better."
 GRAND_DOCTRINE_INDUSTRIAL_WARFARE:0 "Industrial Warfare"
 GRAND_DOCTRINE_INDUSTRIAL_WARFARE_DESC:0 "The Franco-Prussian War has defined the totality of modern warfare, while the Russo-Japanese War has shown the importance of fortification. A big war will put many tactics to the test..."
 SUBDOCTRINE_ATTACK_IN_POSITION_WARFARE:0 "Attack in Position Warfare"
 SUBDOCTRINE_ATTACK_IN_POSITION_WARFARE_DESC:0 "In order to break the stalemate of positional warfare, infantry should be provided autonomy in decision-making at the lowest levels, making it able to infiltrate and exploit the tiniest weaknesses in the enemy's defenses."
 SUBDOCTRINE_BITE_AND_HOLD:0 "Bite and Hold"
 SUBDOCTRINE_BITE_AND_HOLD_DESC:0 "Rather than attempting large scale offensive operations, we will focus on capturing limited objectives, slowly but surely pushing the enemy out."
 SUBDOCTRINE_DEFENSE_IN_DEPTH:0 "Defense in Depth"
 SUBDOCTRINE_DEFENSE_IN_DEPTH_DESC:0 "Creation of layered defenses is vital for holding captured territory and devastating attackers with delays and counterattacks."
 SUBDOCTRINE_HURRICANE_BOMBARDMENT:0 "Hurricane Bombardment"
 SUBDOCTRINE_HURRICANE_BOMBARDMENT_DESC:0 "Rather than trying to inflict as many casualties as possible, artillery can neutralize enemy's communications and defensive positions in short intense bombardments, creating chaos on the onset of our infantry attack"
 SUBDOCTRINE_INTEGRATED_FIREPOWER:0 "Integrated Firepower"
 SUBDOCTRINE_INTEGRATED_FIREPOWER_DESC:0 "Artillery integration is imperative to ensure its ability to support the ongoing offensive or respond to infantry's calls for support."
 SUBDOCTRINE_METHODICAL_BATTLE:0 "Methodical Battle"
