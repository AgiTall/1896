 basic_submarine_snorkel_desc:0 "A simple airtube running from the engine room to the control tower. Extended, it allows the submarine to run its engines and charge its batteries while still submerged.\n\nMounting this module on §YSubmarines§! reduces their §YVisibility§!, making them harder to detect."
