 sp_naval_proximity_fuzes_preference_b:0 "Retain Current Ammo Supply"
 sp_land_generic_reward_critical_failure:0 "Critical Failure"
 human_infantry_offensive:0 "Infantry Offensive"
 human_infantry_offensive_desc:0 "The offensive spirit of the infantry is the decisive element of winning battles. Our infantry must lead the way."
 SUBDOCTRINE_DEEP_AIR_RAIDS_DESC:0 "With the right equipment and training, there is no target too deep in the enemy's hinterland to be struck. The enemy will come to know that no place is safe from our bombs."
 sp_naval_modern_battleship:0 "Modern Battleship"
 sp_naval_modern_battleship_desc:0 "Others may believe that the future of the naval combat will be dominated by the carriers, we are here to convince them that they are wrong."
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_scientist:0 "Prioritize our Lead Scientist"
 sp_armored_lc_weapon_fire_control_tech:0 "Weapon Fire Control"
