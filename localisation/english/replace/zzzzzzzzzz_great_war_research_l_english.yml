 field_gun_equipment_1:0 "Basic Field Gun"
 field_gun_equipment_2:0 "Improved Field Gun"
 field_gun_equipment_2_desc:0 "New cannon designs, taking advantage of new hydraulic recoil devices and longer barrels."
 field_gun_equipment_3:0 "Advanced Field Gun"
 field_gun_equipment_3_desc:0 "Light-weight cannon capable of being broken down for transport, making it possible to bring artillery support to areas previously difficult to reach."
 howitzer_equipment:0 "Howitzer"
 howitzer_equipment_desc:0 "The howitzer primary function is to provide effective and accurate fire support to infantry during assaults and advances across the battlefield. It's a valuable asset to infantry divisions, offering superior firepower, tactical versatility, relative mobility, and significant psychological impact."
