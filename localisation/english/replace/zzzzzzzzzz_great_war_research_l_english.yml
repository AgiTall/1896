 SUBDOCTRINE_THEATER_INTERDICTION:0 "Theater Interdiction"
 peoples_army:0 "People's Army"
 peoples_army_desc:0 "The People's Army believes in the primacy of men over weapons, with superior motivation compensating for inferior technology, and enjoys widespread support from the civilian population.\n\n"
 DOCTRINE_TRACK_OPERATIONS:0 "Operations"
 elastic_defence:0 "Elastic Defense"
 elastic_defence_desc:0 "Rather than focusing all strength on the front line, an elastic defense creates a 'deeper' layer of defenses which allows the defender more time to react and counter-attack while the attacker is spread out and bogged down."
 tank_radio_3:0 "Advanced Radio"
 tank_radio_3_desc:0 "With a more powerful transmitter and better reception, this radio allows communications over dozens of kilometers and in the face of enemy jamming."
 sp_land_generic_reward_artillery_tech_2:0 "$sp_land_generic_reward_armor_tech_2$"
 trade_interdiction:0 "Trade Interdiction"
 trade_interdiction_desc:0 "The sooner we spot the enemy ships, the sooner we can destroy them. Hit their trade convoys and escape before they have time to react.\n\n"
 tank_wheeled_suspension:0 "Wheeled Suspension"
 tank_wheeled_suspension_desc:0 "Derived from a truck chassis, this suspension is very limited in its carrying capacity and has limited cross-country performance, but has the advantage of being very cheap to make."
 integrated_convoy_defence:0 "Integrated Convoy Defense"
 integrated_convoy_defence_desc:0 "Better navy and air coordination allow us to strike at enemies from miles away before they are near our trade convoys. This will drastically increase the effectiveness of convoy sailing."
 GER_propose_joint_military_exercises:0 "Joint Military Exercises"
 GER_propose_joint_military_exercises_desc:0 "The Dual Alliance is the bedrock of our security. To ensure our armies can fight as a single, cohesive force, we must coordinate our doctrines through joint exercises. By sharing our latest arms research, we will guarantee technological superiority for the Central Powers."
 signal_company_tech:0 "Signal Company Technology"
 night_vision:0 "Night Vision I"
 night_vision_desc:0 "Being able to see the enemy without being seen is key to night operations. With the invention of infra-red technology, we can outfit our army with devices which, though unwieldy, makes this possible."
 sp_land_stronghold_network_collapse_workers_drafted:0 "Emergency Labor Draft"
 sp_land_stronghold_network_collapse_workers_drafted_desc:0 "A large number of workers have been redirected to rescue operations and immediate reconstruction efforts, significantly slowing down regular construction, repair activities, and resource extraction in the area."
 SUBDOCTRINE_SUBMARINE_COASTAL_MINELAYING_DESC:0 "With their stealth and agility, submarines are an ideal platform from which to seed the sea lanes with mines and restrict enemy freedom of movement."
 GRAND_DOCTRINE_BATTLEFIELD_SUPPORT_DESC:0 "Techniques and training for close army-air force cooperation, with air strikes acting as flying artillery to blast a path for fast-moving ground operations."
 ship_armor_ice_carrier_deck_1:0 "Pykrete Runway Reinforcements"
 ship_armor_ice_carrier_deck_1_desc:0 "Additional construction reinforcements, ensuring stronger and more resilient construction, while also providing better resistance against the elements."
 mio_cat_eq_all_carrier:0 "All Carrier Ships"
 QZC:0 "Qiongya"
 kampfgruppe:0 "Kampfgruppe"
 kampfgruppe_desc:0 "A Kampfgruppe was an ad hoc formation which was organized to carry out a specific task."
 jet_strat_bomber_equipment:0 "Jet Strategic Bomber"
 jet_strat_bomber_equipment_desc:0 "Strategic Bombers attack enemy buildings and infrastructure, starving them of precious industry."
 tank_anti_air_cannon_3:0 "Advanced Anti-Air Gun"
 tank_anti_air_cannon_3_desc:0 "A fast-firing automatic gun designed to engage aircraft. It has limited potential as a fire-support weapon against ground targets."
 low_echelon_support:0 "Low Echelon Support"
 low_echelon_support_desc:0 "By assigning CAS units directly to small ground formations it ensures they always have additional firepower to call on, even when out of range of traditional artillery."
 super_heavy_tank_destroyer_brigade:0 "Super Heavy Tank Destroyer"
 super_heavy_tank_destroyer_brigade_desc:0 "A super heavy tank chassis with an even larger gun in a fixed mount instead of a turret."
