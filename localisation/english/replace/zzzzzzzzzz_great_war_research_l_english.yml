 sp_land_generic_reward_option_resource_scarcity_desc:0 "[Character.GetName]'s team faced shortages of critical materials for the development of the [SpecialProject.GetName] project, forcing [Character.GetHerHim] to find alternative sources and to develop new manufacturing methods to meet the demands."
