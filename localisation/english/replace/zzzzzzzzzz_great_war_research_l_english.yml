 mio_cat_all_light_aircraft_and_modules:0 "All Light Aircraft Technologies"
 sp_land_generic_reward_option_armor_tech_desc:0 "Recent developments in the [SpecialProject.GetName] project, led by [Character.GetName], enabled significant advancements in related fields. These breakthroughs revolutionized military capabilities, paving the way for more effective and formidable land warfare strategies."
 super_heavy_armor:0 "Super-Heavy Tank"
