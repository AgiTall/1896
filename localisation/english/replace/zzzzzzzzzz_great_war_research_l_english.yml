 sp_artillery_rocket_assisted_projectiles_tech:0 "Rocket-Assisted Projectiles"
 sp_artillery_rocket_assisted_projectiles_tech_desc:0 "Enhanced projectiles for super-heavy howitzers, designed to extend range and improve impact through rocket propulsion."
 military_police:0 "Military Police"
 military_police_desc:0 "Maintains order and suppresses resistance in occupied territories."
 assault_concentration:0 "Assault Concentration"
 assault_concentration_desc:0 "Before an attack, the leading elements are carefully prepared and placed in forward positions, ensuring maximum force can be applied in the opening moments."
 tactical_control:0 "Tactical Control"
 tactical_control_desc:0 "Officers familiar with combined arms operations in forward positions can now directly control all branch's operations."
 sp_land_land_cruiser:0 "Land Cruiser"
 sp_land_land_cruiser_desc:0 "A massive armored behemoth designed to dominate the battlefield. With unparalleled size and firepower, this vehicle represents the pinnacle of armored warfare."
 sp_land_reward_option_land_cruiser_engine_modify:0 "Modify Current Engine"
 SUBDOCTRINE_DEEP_AIR_RAIDS:0 "Deep Air Raids"
 cat_air_bombs:0 "Aerial bombs"
 sp_naval_rocket_launching_submarine_preference_b:0 "Reliability"
 tactic_cc_storm:0 "Close Quarters Storm"
 SUBDOCTRINE_LAST_STAND_DESC:0 "When our backs are to the wall, and national survival is at stake, the only option is bitter, fanatical resistance by the entire population, turning every field, street and town into a battleground."
 sp_air_generic_reward_major_progress_2:0 "Expert Landing"
 hq_field_hospital:0 "Hospital Group Staff"
 hq_field_hospital_desc:0 "Responsible for medical administration and providing efficient casualty evacuation and treatment within the army area."
 special_forces:0 "Special Forces"
 special_forces_desc:0 "We have need of elite forces; mountain troops and paratroopers should be our priority."
 sp_naval_modern_battleship_preference_b_a:0 "Maneuverability"
 SUBDOCTRINE_RAPID_DOMINATION:0 "Rapid Domination"
 tactic_cc_withdraw:0 "Close Quarters Withdraw"
 SUBDOCTRINE_MOUNTED_INFANTRY_DESC:0 "To update our cavalry for the 20th century, we need cross-country operational mobility while mounted, and to fight dismounted with fast, modern heavy weapons in support."
 small_plane_airframe_0:0 "Inter-War Small Airframe"
 small_plane_airframe_0_desc:0 "Since the early days of the Great War, aviation has advanced in leaps and bounds. This airframe represents the culmination of these developments, but it is clear that its growth potential is limited."
 sp_land_reward_option_land_cruiser_communication_new:0 "Install New Advanced System"
 convoy_escorts_bs:0 "Convoy Escorts"
 convoy_escorts_bs_desc:0 "Fast surface ships as part of our convoys will allow us to spot enemy submarines and respond in time. Detection is the key to eliminating the submarine nuisance."
 sp_land_generic_reward_armor_tech_1:0 "Pioneering Techniques"
 sp_land_generic_reward_armor_tech_1_desc:0 "Recent developments in the [SpecialProject.GetName] project, led by [Character.GetName], have enabled significant advancements in related fields. These breakthroughs are revolutionizing military capabilities, paving the way for more effective and formidable land warfare strategies."
 lc_hull_mounted_railway_gun:0 "Hull-Mounted Railway Gun"
 lc_hull_mounted_railway_gun_desc:0 "A repurposed railway gun built directly into the hull for maximum stability, it provides heavy fire support and can engage distant targets with high precision."
 submarine_operations:0 "Submarine Operations"
 submarine_operations_desc:0 "We do not need to engage the enemy fleet head on to win the war. Strike at their trade convoys before they can react and disappear below the surface again. You cannot fight what you cannot see."
 tank_super_heavy_three_man_tank_turret:0 "Three Man Turret"
 tank_super_heavy_three_man_tank_turret_desc:0 "A turret big enough for the three crew members to divide the tasks of loading and aiming the main armament as well as staying aware of the situation around them."
 sp_modern_battleship_eq_bonus_armor:0 "Modern Battleship - Reinforced Hull and Armor"
 tactic_gas_mask_charge:0 "Gas Mask Charge"
 motorized_rocket_equipment:0 "Motorized Rocket Artillery"
 motorized_rocket_equipment_desc:0 "Multiple rocket launchers such as these deliver explosives to a target area more quickly than conventional artillery, but with lower accuracy and requiring a longer time to reload. Being mounted on trucks, this version is able to launch attacks and change positions before the enemy can return fire."
 tactic_masterful_blitz:0 "Masterful Blitz"
 air_land_battle:0 "AirLand Battle"
 air_land_battle_desc:0 "With the ground forces already operating in combined arms formations, AirLand Battle now also emphasizes close coordination between land forces and air forces, merging the Air and Land battlefields into a seamless whole."
 RUS:0 "Russia"
 GRAND_DOCTRINE_BASE_STRIKE_DESC:0 "Hit hard, hit first - The new technologies of naval aviation offer the intriguing possibility of striking the enemy from beyond the horizon, before he knows he is fighting."
 centralized_fire_control:0 "Centralized Fire Control"
 centralized_fire_control_desc:0 "A Centralized Fire Control system allows all calls for artillery support to be evaluated in one location, and if needed, a division's entire firepower to be concentrated on a target rather than a unit only being able to request fire from the artillery assigned to them.\n\n"
 nuclear:0 "Nuclear Technology"
 strat_bomber_intercontinental_equipment_1:0 "Intercontinental Bomber"
 strat_bomber_intercontinental_equipment_1_desc:0 "A giant aircraft specifically designed for ultra-long range missions, intended to enable strategic bombing across continents."
