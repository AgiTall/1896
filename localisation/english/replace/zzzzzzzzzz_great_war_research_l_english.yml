 sp_armored_motorized_military_police_tech_desc:0 "Equipped with military motorbikes, these units are tasked with maintaining order behind the lines, escorting convoys, and conducting patrols. Their speed and mobility allow them to quickly respond to disruptions and, if needed, perform reconnaissance in active combat zones."
 sp_land_reward_option_stronghold_network_collapse_01:0 "Collapse During Tunnel Construction"
 sp_land_reward_option_stronghold_network_collapse_01_desc:0 "A tunnel under one of the main bunkers collapsed unexpectedly, trapping several workers and the lead scientist, [Character.GetName], who was overseeing operations, under the rubble. Emergency measures must be taken to rescue the trapped personnel, but the incident has already caused a delay in overall progress."
 sp_naval_cruiser_submarine:0 "Cruiser Submarine"
