 nuclear_missile_submarine_desc:0 "Submarines with the capability to carry and launch nuclear missiles against our targets. They can truly be death, destroyers of worlds - and we'll never even see it coming."
 sp_artillery_purpose_built_gun_motor_carriages_tech:0 "Purpose-Built Gun Motor Carriages"
 sp_artillery_purpose_built_gun_motor_carriages_tech_desc:0 "Specialized vehicles designed to transport and support super-heavy howitzers, ensuring mobility and easiness of battlefield deployment."
 SUBDOCTRINE_AERIAL_RECONNAISSANCE_DESC:0 "The oldest form of military aviation is reconnaissance. In this, as in every age, knowing where the enemy is and what he is up to can be more powerful than any weapon."
 tank_petrol_electric_engine:0 "Petrol-Electric Engine"
 tank_petrol_electric_engine_desc:0 "A combination of a petrol-driven engine providing power to an electric motor. Complex, expensive and unreliable, it does however offer unmatched performance in tactical movements."
 sp_naval_nuclear_submarine_unique_reward_a:0 "Cost Concerns"
 sp_naval_nuclear_submarine_unique_reward_a_desc:0 "As we are working on a completely new type of submarine, there are growing concerns that the ship production costs will ultimately be too high. How should we proceed with the design? "
 fort:0 "Fort"
 ca_tech:0 "Cruiser models"
 sp_armored_lc_transmission_improvements_tech:0 "Transmission Improvements"
 sp_armored_lc_transmission_improvements_tech_desc:0 "Refined gear ratios, clutch mechanisms and torque converters to create more efficient transmissions capable of handling the extreme power and weight of Land Cruisers, improving overall mobility and reducing mechanical strain."
