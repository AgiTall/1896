 sp_naval_modern_carrier_unique_reward_a:0 "Modern Carrier - Purpose"
 sp_naval_modern_carrier_unique_reward_a_desc:0 "With the new generation of carriers we could focus on certain aspects of our ship, in order to better suit our needs. Where should we concentrate our efforts?"
 sp_land_super_heavy_howitzer:0 "Super-Heavy Howitzer"
 sp_land_super_heavy_howitzer_desc:0 "A formidable artillery piece boasting a large caliber, that can wreak havoc on enemy defenses with unprecedented destructive force."
 deep_operations:0 "Deep Operations"
 deep_operations_desc:0 "The concept of Deep Operations, or Deep Battle, is to break through the enemy's defensive lines at multiple points and destroy his operational reserves, his operational depth, and occupy as much of his strategic depth as possible."
 sp_cruiser_submarine_eq_bonus_raiding:0 "Cruiser Submarine - Raiding Efficiency"
 jet_engine_3x:0 "3x Jet Engine"
 jet_engine_3x_desc:0 "$engine_1_3x_desc$"
 light_sp_anti_air_brigade:0 "Light SP Anti-Air"
 sp_naval_underway_replenishment_unique_reward_a:0 "Scale of Resupply"
 sp_naval_underway_replenishment_unique_reward_a_desc:0 "While we are still working on making the system of underway replenishments run as smoothly as possible, we have to make one more decision - do we want to alter our original estimations or not?"
 motorized_rocket_equipment_1:0 "Motorized Rocket Artillery"
 motorized_rocket_equipment_1_desc:0 "Multiple rocket launchers such as these deliver explosives to a target area more quickly than conventional artillery, but with lower accuracy and requiring a longer time to reload. Being mounted on trucks, this version is able to launch attacks and change positions before the enemy can return fire."
 sp_tag_jet:0 "Jet Projects"
 sp_land_generic_reward_major_progress_2:0 "Critical Test Successful"
 tactic_blitz:0 "Blitz"
 armored_operations:0 "Armored Operations"
 armored_operations_desc:0 "Tanks and other armored vehicles are highly useful for delivering infantry to battlefields and offering direct support in combat."
 marine_tech:0 "Marine technology"
 night_assault_tactics:0 "Night Assault Tactics"
 night_assault_tactics_desc:0 "Soldiers who are used to moving and fighting at night can either pre-position themselves for an attack, or directly attack unsuspecting enemy forces."
 mio_cat_eq_all_destroyer:0 "All Destroyer Ship"
 marine:0 "Marines"
 marine_desc:0 "Troops specializing in amphibious warfare are growing ever more indispensable. Improvised methods and equipment become things of the past as our naval infantry is supported by specialized landing craft and training."
 oil_desc:0 "Oil is required for the effective operation of motor vehicles, planes, and ships."
 jet_fighter_equipment_1:0 "Jet Fighter I"
 jet_fighter_equipment_1_desc:0 "Previous increases in speed pale in comparison to the introduction of the first jet fighters. While we have yet to learn how to best construct planes for these engines, regular fighter planes cannot compete."
 bicycle_battalion:0 "Bicycle Battalion"
 bicycle_battalion_desc:0 "Meat for the meat grinder, but with extra bits of metal."
 sp_cruiser_submarine_eq_bonus_range:0 "Cruiser Submarine - Extended Range"
 cv_small_plane_airframe_2:0 "Improved Carrier Airframe"
 cv_small_plane_airframe_2_desc:0 "To keep pace with developments in land-based aviation, this airframe was designed with new technologies to increase range and performance."
 strategic_destruction:0 "Strategic Destruction"
 strategic_destruction_desc:0 "Our pilots can access strategic targets much faster than our naval or land forces. With no means to equip their new recruits we will soon outnumber the enemy forces."
 category_marines:0 "All Marines"
 sp_naval_torpedo_cruiser_preference_b:0 "Weakness - Destroyers"
 SND:0 "Shandong"
 GRAND_DOCTRINE_CONVOY_RAIDING_DESC:0 "Privateers for the modern age - An indirect approach to naval warfare focused on strangling maritime trade, starving the enemy of resources they need to fight the war."
 category_special_forces_leg_infantry:0 "Special Forces Leg Infantry"
 floating_airfield:0 "Floating Airfield"
 floating_airfield_desc:0 "Improved integration of Carriers into our fleet keeps us prepared to strike from both sea and air. It is key that we dominate the air wherever we go."
 wet_ammo_storage:0 "Wet Ammunition Storage"
 wet_ammo_storage_desc:0 "Water jackets added to ammunition racks dramatically reduce the risk of the ammunition exploding after the tank is hit, which is greatly appreciated by the crews."
 sp_modern_carrier_eq_bonus_anti_torpedo:0 "Modern Carrier - Increased Torpedo Damage Protection"
 formation_flying:0 "Formation Flying"
 formation_flying_desc:0 "By flying in formation planes can provide support to each other or work together to attack enemies."
 NZL:0 "New Zealand"
 sp_land_reward_land_cruiser_communication:0 "Communication System Issue"
 sp_land_reward_land_cruiser_communication_desc:0 "The sheer size of the [SpecialProject.GetName] requires a complex internal communication system to coordinate its crew. The current system is proving inadequate, with orders getting delayed or lost. The team suggests redesigning the internal layout to improve communication flow, or installing a more advanced, yet untested system."
 SUBDOCTRINE_DIVE_BOMBERS_DESC:0 "Air strikes on front line targets during an active land battle exposes aircraft to ground fire and can be risky for friendly troops, but the effects at the sharp end are dramatic."
 SUPERIOR_FIREPOWER_DOCTRINE:0 "Superior Firepower"
 GRAND_DOCTRINE_MASS_ASSAULT_DESC:0 "Our willingness to sacrifice guarantees our victory - Mass Assault focuses on concentrating numerical superiority to force a breakthrough at the chosen time and place."
 SUBDOCTRINE_INFILTRATION_TACTICS_DESC:0 "Rather than bashing against enemy lines at their strongest point, we shall flow around them like water, maintaining offensive momentum and forcing the enemy to withdraw through threat of encirclement."
 sp_naval_rocket_launching_submarine:0 "Missile Launching Submarine"
 sp_naval_rocket_launching_submarine_desc:0 "By equipping our submarines with missiles, and launch systems, we should be able to hit our enemies' strategic targets anywhere, and with no prior warning."
 sp_naval_nuclear_submarine_preference_a:0 "Cut Corners"
 CAR:0 "Central African Republic"
 bomber_veteran_initiative:0 "Bomber Veteran Initiative"
 bomber_veteran_initiative_desc:0 "A policy of having veteran pilots pass on their knowledge to new recruits greatly helps their survival prospects."
 bc_tech:0 "Battlecruiser models "
 naval_minesweeping:0 "Naval Minesweeping Technology"
 sp_land_reward_option_land_cruiser_communication_new_bonus_name:0 "Advanced Communication System"
 medium_plane_airframe_4:0 "Modern Medium Airframe"
 medium_plane_airframe_4_desc:0 "With jet-powered planes likely to become dominant, engineers are starting to figure out how to build airframes with jet propulsion in mind."
 supersonic_fighter1:0 "Supersonic Fighter"
 decryption_tech:0 "Decryption methods"
 mio_cat_eq_all_battleship:0 "All Battleship"
 armor_skirts:0 "Armor Skirts"
 armor_skirts_desc:0 "A set of thin metal plates mounted on the side of the vehicle, giving additional protection against anti-tank rifles and shaped charges."
 idea_army_restrictions:0 "Army Restrictions"
 idea_army_restrictions_desc:0 "After the defeat of in the Great War, [ROOT.GetAdjective] army was reduced and has no right to expand."
 convoy_sailing_bs:0 "Convoy Sailing"
 convoy_sailing_bs_desc:0 "Introducing compulsory convoy sailing will make it easier to spot enemy raids and respond in time. Safety in numbers is the way to go."
 sp_super_heavy_battleship_eq_bonus_speed:0 "Super Heavy Battleship - Improved Engines"
 mio_cat_all_naval_bomber_and_modules:0 "All Naval Bomber Technologies"
 mechanised_offensive:0 "Mechanized Offensive"
 mechanised_offensive_desc:0 "Motorized troops are well and good, but to lead offensives we need Infantry that can ride into battle in armored transports which protect them and carry heavy weapons."
 steel_desc:0 "Steel is the primary metal for most types of military machinery, whether it be tanks or ships."
 tank_medium_howitzer_2:0 "Improved Medium Howitzer"
 tank_medium_howitzer_2_desc:0 "A medium field howitzer adapted to be mounted in a vehicle. Its primary purpose is indirect fire support against soft targets, but it can be fired directly at a target if necessary. Carrying only a small amount of armor-piercing ammunition, it is ill-suited for anti-tank work."
 tactic_attacker_hb_attack:0 "Attack"
 fighter_ace_initiative:0 "Fighter Ace Initiative"
 fighter_ace_initiative_desc:0 "Giving special awards and status to pilots who achieve Ace status, by shooting down five enemies, incentives risk-taking and brings about a sense of eliteness in Ace pilots - although this does tend to make experienced pilots stay in combat positions."
 BEL_outdated_military:0 "Outdated Military"
 BEL_outdated_military_desc:0 "The Belgian army has basically not changed since 1830, the uniforms and tactics are the same, while the equipment is totally outdated. The army has very few cannons, no machine guns and an incompetent chain of command."
 SUBDOCTRINE_CARPET_BOMBING_DESC:0 "Trying to strike point targets from 30,000 feet is generally a waste of bombs. Flying in line abreast and creating a wide lane of destruction is a more reliable way to hit...something."
 SUBDOCTRINE_NIGHT_BOMBING:0 "Night Strategic Bombing"
 sp_naval_super_heavy_battleship_preference_a_a:0 "Heavy Guns"
 sp_naval_nuclear_missile_submarine:0 "Nuclear Missile Submarine"
 sp_naval_nuclear_missile_submarine_desc:0 "If we are able to surface a submarine, fire a missile with a nuclear charge, and then submerge again, our first-strike potential becomes almost limitless."
 heavy_tank_artillery_chassis:0 "Heavy SP Artillery"
 heavy_tank_artillery_chassis_desc:0 "A large vehicle, primarily for fire support of advancing infantry."
 midget_submarine:0 "$ship_hull_midget_submarine$"
 midget_submarine_desc:0 "$ship_hull_midget_submarine_desc$"
 miniature_fighters:0 "Miniature Fighters"
 miniature_fighters_desc:0 "With smaller fighters we will be able to carry more of them into battle without sacrificing much firepower, as well as reducing the weight of the Motherships load"
 HOL:0 "Netherlands"
 stronghold_network:0 "Stronghold Network"
 tactic_basic_defend:0 "Defend"
 convoy_escorts:0 "Convoy Escorts"
 convoy_escorts_desc:0 "Fast surface ships as part of our convoys will allow us to spot enemy submarines and respond in time. Detection is the key to eliminating the submarine nuisance."
 GRAND_DOCTRINE_STRATEGIC_DESTRUCTION_DESC:0 "Mass bombing of factories, refineries, and transport infrastructure deep in the enemy's hinterland, to cut off his warmaking potential at the source."
 mass_destruction:0 "Mass Destruction"
 mass_destruction_desc:0 "Bombers are equipped with the most devastating weapons in great quantities. Guaranteeing results even if only a few of our pilots get through."
 sp_naval_anechoic_tiles_preference_c:0 "Reduced Hull Costs"
 guerilla_warfare:0 "Guerrilla Warfare"
 guerilla_warfare_desc:0 "The enemy advances, we retreat; the enemy camps, we harass; the enemy tires, we attack; the enemy retreats, we pursue."
 battlefield_support_tree:0 "Battlefield Support Doctrine"
 UNLOCK_DIVISION_TEMPLATE:0 "Unlocks a free §HDivision Template§!"
 engine_tech_3_tt:0 "Enables Engine Upgrade values of 15 and above."
 SUBDOCTRINE_ARMORED_INFANTRY_SUPPORT:0 "Armored Infantry Support"
 GSM:0 "Gansu"
 JAP:0 "Japan"
 XSM:0 "Qinghai"
 mass_assault:0 "Mass Assault"
 mass_assault_desc:0 "'Perfect' weapons are overrated, a large number of 'good enough' weapons is the path to victory!\n\n"
 direct_ground_support:0 "Direct Ground Support"
 direct_ground_support_desc:0 "By closely coordinating CAS pilots with ground-based observers aerial firepower can be precisely directed to best help troops in battle."
 tank_heavy_howitzer:0 "Heavy Howitzer"
 tank_heavy_howitzer_desc:0 "A heavy field howitzer adapted to be mounted in a vehicle. Its primary purpose is indirect fire support against soft targets, but it can be fired directly at a target if necessary. Carrying only a small amount of armor-piercing ammunition, it is ill-suited for anti-tank work."
 fleet_in_being:0 "Fleet In Being"
 fleet_in_being_desc:0 "Ships stay in port where they are safer and only engage enemies at opportune moments. The presence of our ships will make enemies more reluctant to take our ports.\n\n"
 sp_naval_aip_engine_preference_a:0 "Quieter Engines"
 land_doctrine:0 "Land Doctrine"
 medium_tank_destroyer_chassis:0 "Medium Tank Destroyer"
 medium_tank_destroyer_chassis_desc:0 "A well-balanced vehicle, carrying a powerful gun to destroy enemy armor."
 cavalry:0 "Cavalry"
 cavalry_desc:0 "Horse mounted infantry. More expensive, but with good mobility."
 sp_air_bouncing_bomb_backspin_mechanism_reward:0 "Backspin Mechanism"
 sp_air_bouncing_bomb_backspin_mechanism_reward_desc:0 "Our scientists have come up with an ingenious solution for stabilizing the bomb once dropped. The mechanism starts a backspin, which keeps it on track to the target."
 helicopter_field_hospital:0 "Helicopter Med-Evac"
 helicopter_field_hospital_desc:0 "Attention all personnel! Incoming choppers with wounded! Med-Evac helicopters are able to get casualties off the battlefield far more quickly than a regular ambulance."
 GRAND_DOCTRINE_MOBILE_WARFARE:0 "Mobile Warfare"
 SUBDOCTRINE_HEAVY_AIRCRAFT_FOCUS:0 "Multi-Role Heavy Aircraft Focus"
 tank_heavy_three_man_tank_turret:0 "Three Man Turret"
 tank_heavy_three_man_tank_turret_desc:0 "A turret big enough for the three crew members to divide the tasks of loading and aiming the main armament as well as staying aware of the situation around them."
 sp_naval_midget_submarine_preference_c:0 "Bit Longer Range"
 panzer_leader:0 "Armour Leader"
 panzer_leader_desc:0 "§LA natural with armoured forces and tanks.§!"
 tp_tech:0 "Transport models"
 battlefleet_concentration_ti:0 "Battlefleet Concentration"
 battlefleet_concentration_ti_desc:0 "Call in nearby ships as soon as an enemy vessel is spotted. Coordinated focused fire quickly render enemy ships useless. Hunt them down one by one."
 SUBDOCTRINE_FLYING_BATTERIES:0 "Flying Batteries"
 offensive_formations:0 "Offensive Formations"
 offensive_formations_desc:0 "Training in more offensively-oriented formations make our fighters deadlier in combat."
 combined_operations_raiding:0 "Combined Operations Raiding"
 combined_operations_raiding_desc:0 "Designating all resources to hunt for enemy trade convoys. Coordination between our main fleet and submarines makes our fleet ever alert. No ship will go unnoticed in our waters."
 tactic_basic_attack:0 "Attack"
 sp_naval_ice_carrier:0 "Ice Aircraft Carrier"
 sp_naval_ice_carrier_desc:0 "In order to assert our air superiority over the vast oceans, we need carriers that could store and launch long-range regular airplanes, and not just carrier aircraft. "
 sup_delay:0 "Delay"
 sup_delay_desc:0 "Even when a battle cannot be won, it can be advantageous to slow the progress of attacking forces with ambushes and delaying tactics."
 mio_cat_tech_all_carrier_and_modules:0 "All Carrier Technologies"
 sp_super_heavy_battleship_eq_bonus_anti_air:0 "Super Heavy Battleship - Improved Anti-Air"
 armor_tech_2_tt:0 "Enables Armor Upgrade values of 10 and above."
 large_plane_airframe:0 "$strat_bomber_equipment$"
 large_plane_airframe_desc:0 "A large airframe with plenty of space, capable of mounting up to six engines and carrying large payloads over long distances."
 sloped_armor:0 "Sloped Armor"
 sloped_armor_desc:0 "Armor placed at an angle to an incoming shell has a much greater effective thickness than the same amount of armor placed vertically. It also increases the chance that the shell will simply bounce off harmlessly. However, it requires the entire tank to be designed around it, making the vehicle more difficult to assemble."
 GER:0 "Germany"
 SUBDOCTRINE_LAST_STAND:0 "Desperate Defense"
 SUBDOCTRINE_SCREEN_CONVOY_ESCORT_DESC:0 "The chief duty of light ships is to secure the maritime trade upon which all our war efforts depend. Everything else is secondary."
 pathfinder_groups:0 "Pathfinder Groups"
 pathfinder_groups_desc:0 "Veteran pilots are equipped with the best tools to illuminate target positions. No smoke or bad weather can stop the bombers from carrying out their mission."
 sp_land_generic_reward_option_test_failure_desc:0 "A minor setback occurred during testing, revealing unexpected flaws in [Character.GetName]'s prototype. This hiccup prompted a reevaluation of the approach and refinement of techniques. While temporarily delaying progress, these lessons learned contributed to a stronger and more resilient project in the long run."
 category_self_propelled_artillery:0 "Self-Propelled Artillery"
 air_defence:0 "Air Defense"
 air_defence_desc:0 "By training our pilots to be constantly on the lookout, even when there is apparently no danger, their chances of intercepting enemy planes is increased."
 SUBDOCTRINE_ESCORT_FIGHTER_DESC:0 "For our strike aircraft to operate with impunity, it is necessary that they be closely supported by fighters to sweep the skies of hostile aircraft."
 cv_small_plane_airframe:0 "$cv_fighter_equipment$"
 cv_small_plane_airframe_desc:0 "Equipped with an arrestor hook and a strengthened landing gear, this small airframe is capable of operating from carriers."
 SUBDOCTRINE_BATTLESHIP_ANTIAIR_SCREEN_DESC:0 "Battleships offer unrivaled opportunity for deck armaments. Equipping them to target enemy aircraft should be a priority to keep the skies clear for our task forces."
 sp_land_generic_reward_scientist_xp_1:0 "New Learnings"
 tactic_gas_cylinder_poisonous:0 "Poisonous Gas Cylinder Release"
 sp_naval_generic_reward_artillery_tech_2:0 "Naval Guns Innovations"
 prepared_defense:0 "Prepared Defense"
 prepared_defense_desc:0 "More extensive systems of field fortification greatly improve a unit's defense."
 snorkel_advice_tt:0 "\nMounting §YSnorkels§! on §YSubmarines§! dramatically reduces their §YVisibility§!, making them harder to see and engage for enemy ships."
 GER_finance_rheinmetall:0 "Finance Rheinmetall"
 GER_finance_rheinmetall_desc:0 "The Rheinmetall corporation has approached us with a request for a loan, something that can be easily arranged. With it the company will further expand its manufacturing base for the army."
 offensive_doctrine:0 "Offensive Doctrine"
 offensive_doctrine_desc:0 "§LMore Offensive-minded than most.§!"
 rocket_artillery:0 "Support Rocket Artillery"
 rocket_artillery_desc:0 ""
 infrastructure_destruction:0 "Infrastructure Destruction"
 infrastructure_destruction_desc:0 "Training our pilots in the best ways to attack infrastructure, like railways and bridges, makes for more effective Tactical bombing."
 secondary_battery_advice_tt:0 "\nA §YSecondary Battery§! allows §YCruisers§! and §YHeavy Ships§! to engage enemy §YScreening Ships§! as secondary targets while dealing damage to another target."
 cat_ship_medium_battery:0 "Medium Batteries"
 sp_land_generic_reward_option_engine_bonus_desc:0 "Start producing these improved engines!"
 jet_engine_axial_4x:0 "4x Axial Jet Engine"
 jet_engine_axial_4x_desc:0 "$engine_1_4x_desc$"
 sp_naval_super_heavy_battleship_preference_b_a:0 "Speed"
 SUBDOCTRINE_ARMORED_RAIDERS_DESC:0 "Convoy escorts primarily focus on anti-submarine defense. Imagine their shock when a fully-armed capital ship appears in their midst, like a wolf among sheep."
