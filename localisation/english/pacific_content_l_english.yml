l_english:
 A01_java_development:0 "The Java Development Plan"
 A01_java_development_desc:0 "State orders will connect Batavia workshops with Java enterprises. New factories will supply the archipelago with locally produced goods."
 A01_sumatran_railways:0 "Sumatran Railways"
 A01_sumatran_railways_desc:0 "Difficult terrain separates Sumatra plantations from their ports. Railway construction will shorten the journey from warehouse to quay."
 A01_surabaya_arsenal:0 "The Surabaya Arsenal"
 A01_surabaya_arsenal_desc:0 "Surabaya will become a centre for arms repair and ammunition production. The army cannot depend on every transport arriving from Europe."
 A01_batavia_docks:0 "Batavia Dockyards"
 A01_batavia_docks_desc:0 "Deeper harbours and new dry docks will service the squadron in Batavia. Damaged ships will no longer need to seek repairs abroad."
 A01_rubber_processing:0 "Rubber Processing"
 A01_rubber_processing_desc:0 "Exporting raw rubber leaves much of the profit overseas. Processing plants beside the Sumatran plantations will keep more value at home."
 A01_local_rifles:0 "Local Rifle Manufacture"
 A01_local_rifles_desc:0 "Surabaya armaments contracts will provide rifles and a lasting local procurement programme, accelerating military factory construction and raising maximum production efficiency."
 A01_technical_college:0 "Batavia Technical Institute"
 A01_technical_college_desc:0 "Higher technical education will connect the shipyards and factories with engineer training. Gain a research slot and unlock the Batavian Engineering Council."
 A01_knil_reform:0 "Reform the KNIL — Colonial Army"
 A01_knil_reform_desc:0 "KNIL stands for Koninklijk Nederlands-Indisch Leger, the Royal Netherlands East Indies Army. In the mod it is the regular land army of the archipelago, governed from Batavia.\n\nArmy focuses improve its national spirit: organisation, defence, training and supply. Indonesian volunteer militia are separate temporary formations for the war with Japan."
 A01_island_garrisons:0 "Island Garrisons"
 A01_island_garrisons_desc:0 "Introduce common training procedures for island garrisons. The KNIL spirit will gain an additional defence bonus."
 A01_marine_brigades:0 "Marine Brigades"
 A01_marine_brigades_desc:0 "Recovering a lost port requires troops trained to land from the sea. Marine brigades will exercise alongside ship crews."
 A01_jungle_supply:0 "Island Supply Service"
 A01_jungle_supply_desc:0 "Field instructions and unified supply will improve the KNIL spirit: organisation rises, training accelerates and supply consumption falls."
 A01_coastal_watch:0 "Coastal Watch Service"
 A01_coastal_watch_desc:0 "Unify coastal observation and island defence procedures. An island defence spirit will be added."
 A01_admiralty_shipyards:0 "Admiralty Shipyards"
 A01_admiralty_shipyards_desc:0 "The admiralty government will finance an expansion of Surabaya shipyards. Sea control requires a steady programme of naval construction."
 A01_naval_general_staff:0 "Naval General Staff"
 A01_naval_general_staff_desc:0 "Scattered squadrons need a common plan. A naval general staff will coordinate reconnaissance, repairs and operational deployment."
 A01_military_industry:0 "Military Workshops"
 A01_military_industry_desc:0 "Direct government orders will expand Java arms workshops. Military factories will receive priority in the allocation of materials."
 A01_defence_in_depth:0 "Defence in Depth"
 A01_defence_in_depth_desc:0 "We cannot hold every bay. Prepared positions and reserves will contain a landing and buy time for a counterattack."
 A01_archipelago_command:0 "Unified Archipelago Command"
 A01_archipelago_command_desc:0 "Army and navy defend the same archipelago. Unified command will bring their defensive plans together."
 A01_wartime_industry:0 "Industrial Mobilisation"
 A01_wartime_industry_desc:0 "Urgent defence orders will replace peacetime contracts. Increased arms output will divert labour and materials from civilian needs."
 A01_secure_sea_lanes:0 "Secure the Sea Lanes"
 A01_secure_sea_lanes_desc:0 "Convoy routes will receive common escort procedures. Maritime escort coordination will improve fleet organisation, while trade gains additional transports."
 A01_pacific_settlement:0 "A Pacific Settlement"
 A01_pacific_settlement_desc:0 "The key postwar fork: preserve Ludolfs civilian government and pursue reform, or bring the Admirals Council to power. Dismissal hearings begin, but there is no automatic removal."
 A03_imperial_council:0 "The Imperial Council"
 A03_imperial_council_desc:0 "The Imperial Council. A sustained investment in this programme will strengthen our position in the Pacific."
 A03_civil_government:0 "Civil Cabinet"
 A03_civil_government_desc:0 "Civilian ministers seek strength through sound finances and commerce. The military will retain influence without directing every government order."
 A03_naval_government:0 "Naval Cabinet"
 A03_naval_government_desc:0 "The naval ministry will lead the cabinet. Securing the straits and supplying overseas bases will become central state priorities."
 A03_prefectural_reform:0 "Prefectural Reform"
 A03_prefectural_reform_desc:0 "Common tax and reporting rules will strengthen ties between the capital and the prefectures, funding a sustained programme of reform."
 A03_commercial_diplomacy:0 "Commercial Diplomacy"
 A03_commercial_diplomacy_desc:0 "Trading houses can open doors closed to military delegations. Permanent missions will represent our interests in the principal Pacific ports."
 A03_batavia_convention:0 "The Batavia Convention"
 A03_batavia_convention_desc:0 "The Batavia Convention. A sustained investment in this programme will strengthen our position in the Pacific."
 A03_pacific_prosperity:0 "Pacific Prosperity"
 A03_pacific_prosperity_desc:0 "The Batavia agreement has secured raw material supplies. Kansai industrialists can now invest in new factories backed by reliable trade."
 A03_southern_strategy:0 "The Southern Strategy"
 A03_southern_strategy_desc:0 "Southern sea routes lead to imperial resources and bases. The naval staff will prepare a common plan should diplomacy fail."
 A03_resource_commission:0 "Imperial Resource Commission"
 A03_resource_commission_desc:0 "Industry needs reliable accounts of stocks and deliveries. A resource commission will match factory demand with merchant shipping capacity."
 A03_batavia_ultimatum:0 "The Batavia Ultimatum"
 A03_batavia_ultimatum_desc:0 "Demand access to Borneo’s resources regardless of Batavia’s political course. Dutch refusal means immediate war."
 A03_southern_bases:0 "Southern Forward Bases"
 A03_southern_bases_desc:0 "Palau will serve as a staging base between the home islands and the southern seas. Workshops and transports will sustain a prolonged campaign."
 A03_southern_campaign:0 "The Southern Campaign"
 A03_southern_campaign_desc:0 "Batavia has rejected imperial demands. The fleet must cover a landing operation aimed at the oil districts of Borneo."
 A03_southern_reconstruction:0 "Reconstruct the Southern Territories"
 A03_southern_reconstruction_desc:0 "The occupied oil districts must resume production. We will restore workshops, ports and civilian industry in East Kalimantan."
 A03_osaka_industry:0 "The Osaka Industrial District"
 A03_osaka_industry_desc:0 "Osaka trading houses and workshops can underpin modern industry. The government will support construction of larger factories."
 A03_kansai_railways:0 "Kansai Railways"
 A03_kansai_railways_desc:0 "Railways will link Osaka factories with Nagoya industry. Regular transport will reduce costs and accelerate troop deployment."
 A03_hiroshima_arsenal:0 "Hiroshima Arsenal"
 A03_hiroshima_arsenal_desc:0 "Hiroshima workshops will receive machinery for series production. An expanded arsenal will reduce dependence on foreign arms suppliers."
 A03_steel_contracts:0 "Steel Contracts"
 A03_steel_contracts_desc:0 "Long-term contracts will give steel producers confidence in future orders. Reliable metal supplies will accelerate industrial construction."
 A03_standard_rifles:0 "Standard Service Rifle"
 A03_standard_rifles_desc:0 "Mixed rifle types complicate regimental supply. A standard service weapon and common parts will simplify production and repair."
 A03_imperial_university:0 "Imperial Technical University"
 A03_imperial_university_desc:0 "Engineering faculties must work alongside arsenals and shipyards. A new university will provide industry with trained specialists."
 A03_electrical_workshops:0 "Electrical Workshops"
 A03_electrical_workshops_desc:0 "Telegraphs, generators and instruments demand new manufacturing skills. Dedicated workshops will support the growing electrical industry."
 A03_industrial_power:0 "An Industrial Power"
 A03_industrial_power_desc:0 "The arsenal network must produce arms on an imperial scale. Expanding Hiroshima factories will complete the first industrial programme."
 A03_naval_programme:0 "Imperial Naval Programme"
 A03_naval_programme_desc:0 "Occasional purchases cannot build a strong navy. A Nagasaki construction programme will provide regular shipbuilding and repairs."
 A03_kure_yards:0 "Kure Naval Yards"
 A03_kure_yards_desc:0 "Kure harbours are suited to a major shipbuilding centre. Expanded docks will support the growing squadron."
 A03_merchant_marine:0 "Merchant Marine"
 A03_merchant_marine_desc:0 "Overseas bases need merchant shipping to survive. Government orders will add tonnage and train new crews."
 A03_naval_academy:0 "Naval Academy"
 A03_naval_academy_desc:0 "Officers need common instruction in navigation, gunnery and formation command. The academy will establish consistent training standards."
 A03_island_supply:0 "Island Convoys"
 A03_island_supply_desc:0 "Distant garrisons require scheduled sailings and reserve depots. A permanent island convoy service will coordinate their supply."
 A03_fleet_exercises:0 "Combined Fleet Exercises"
 A03_fleet_exercises_desc:0 "Ships must learn to operate together before war begins. Major manoeuvres will test communications, reconnaissance and squadron coordination."
 A03_army_reorganisation:0 "Reorganise the Imperial Army"
 A03_army_reorganisation_desc:0 "Standard establishments and regular field exercises will strengthen the western prefectural army. Unit experience will shape common manuals."
 A03_conscription_register:0 "The Conscription Register"
 A03_conscription_register_desc:0 "Complete service registers will allow replacements to be prepared in advance. Reservists will train before receiving operational assignments."
 A03_landing_forces:0 "Naval Landing Forces"
 A03_landing_forces_desc:0 "Island warfare requires specialised training. Landing forces will practise going ashore, seizing quays and holding bridgeheads."
 A03_field_artillery:0 "Field Artillery"
 A03_field_artillery_desc:0 "Infantry needs reliable fire support. Expanding Shikoku arms factories will underpin artillery supply."
 A03_expeditionary_staff:0 "Expeditionary Staff"
 A03_expeditionary_staff_desc:0 "An overseas operation begins with cargo lists and routes. Expeditionary staff will coordinate transport, landings and troop supply."
 A03_combined_operations:0 "Combined Operations"
 A03_combined_operations_desc:0 "Army and naval staffs will hold joint exercises. Coordinated action is essential to exploit a successful coastal landing."
 A01_knil_training:0 "KNIL Training"
 A01_knil_training_desc:0 "The KNIL is the Royal Netherlands East Indies Army: the regular land forces of the archipelago. It is distinct from the temporary Indonesian volunteer militia."
 A01_island_defence:0 "Archipelago Defence"
 A01_island_defence_desc:0 "Archipelago Defence: a permanent programme coordinating training and government services."
 A01_colonial_administration:0 "Colonial Administration"
 A01_colonial_administration_desc:0 "Colonial Administration: a permanent programme coordinating training and government services."
 A01_naval_staff:0 "Admiralty Staff"
 A01_naval_staff_desc:0 "Admiralty Staff: a permanent programme coordinating training and government services."
 A01_war_production:0 "Defence Orders"
 A01_war_production_desc:0 "Defence orders increase factory output at the cost of additional consumer goods requirements. The program begins before the war with Japan, continues during it and ends when peace returns."
 A03_commercial_network:0 "Pacific Trading Network"
 A03_commercial_network_desc:0 "Pacific Trading Network: a permanent programme coordinating training and government services."
 A03_industrial_contracts:0 "Industrial Contracts"
 A03_industrial_contracts_desc:0 "Industrial Contracts: a permanent programme coordinating training and government services."
 A03_army_reform:0 "Army Reform"
 A03_army_reform_desc:0 "Army Reform: a permanent programme coordinating training and government services."
 A03_landing_force:0 "Imperial Landing Forces"
 A03_landing_force_desc:0 "Imperial Landing Forces: a permanent programme coordinating training and government services."
 pacific_trade_accord_idea:0 "Batavia Trade Convention"
 pacific_trade_accord_idea_desc:0 "Batavia Trade Convention: a permanent programme coordinating training and government services."
 pacific.1.t:0 "An Offer from Batavia"
 pacific.1.d:0 "Batavia offers guaranteed rubber deliveries in exchange for mutual non-aggression. Industrialists support the agreement; the naval ministry demands control of the resources."
 pacific.1.a:0 "Sign the trade agreement."
 pacific.1.b:0 "They can barely stand on their own feet."
 pacific.2.t:0 "The Convention Is Signed"
 pacific.2.d:0 "The agreement with Japan secures export markets and mutual guarantees of non-aggression. The ports are preparing for the first merchant ships."
 pacific.2.a:0 "Diplomacy has prevailed."
 pacific.3.t:0 "A Japanese Trade Mission"
 pacific.3.d:0 "Japanese representatives offer a trade convention and mutual non-aggression. Accepting will secure investment while tying our commerce to the empire."
 pacific.3.a:0 "Accept the terms."
 pacific.3.b:0 "Our ports will remain independent."
 pacific.4.t:0 "The Naval Ministry Demands"
 pacific.4.d:0 "Japan demands privileged access to Borneo’s resources. Acceptance preserves peace through economic concessions. Rejection means an immediate declaration of war."
 pacific.4.a:0 "Concede to preserve peace."
 pacific.4.b:0 "Reject the ultimatum. We will defend ourselves."
 A03_imperial_council_name:0 "Kyoto Imperial Council"
 A03_army_commander_name:0 "Western Army Headquarters"
 A01_admiralty_diplomacy:0 "Gunboat Diplomacy"
 A01_admiralty_diplomacy_desc:0 "Gunboat Diplomacy. A sustained investment in this programme will strengthen our position in the Pacific."
 A01_constitution:0 "Amend the 1854 Constitution"
 A01_constitution_desc:0 "Constitutional amendments temporarily suspend the Admirals Council restrictions. For two weeks, mobilisation, economic and trade laws may be changed without political cost."
 A01_wtc_oil_and_rubber_offer:0 "An Offer for the WTC"
 A01_wtc_oil_and_rubber_offer_desc:0 "Guaranteed oil and rubber exports will attract investment, finance a factory and establish formal contact with the World Trade Chamber."
 A01_lone_wolf_path:0 "The Lone Wolf Course"
 A01_lone_wolf_path_desc:0 "Batavia will pursue an independent course. Existing faction commitments will end, and future alliances will be ruled out."
 A01_strengthen_ludolfs_power:0 "Strengthen Ludolf\u2019s Authority"
 A01_strengthen_ludolfs_power_desc:0 "Ludolf Sloot van de Beele will retain civilian control, supported by engineers, industrialists and pragmatic officials."
 A01_last_chance_to_negotiate:0 "One Last Negotiation"
 A01_last_chance_to_negotiate_desc:0 "Offer peace: gain 5% stability at the cost of 10 points of Ludolf’s authority. Japanese preparations proceed independently of our focuses. Agreement cancels the invasion."
 A01_admirals_council_coup:0 "The Admirals Council Coup"
 A01_admirals_council_coup_desc:0 "The admirals will remove Ludolf and place Batavia under direct naval leadership. Dockyard construction and war support will receive priority."
 A01_direct_naval_rule:0 "Direct Naval Rule"
 A01_direct_naval_rule_desc:0 "The civilian parliament will give way to naval administration. Mobilisation will accelerate and the state will pursue a firmer security policy."
 A01_build_bornean_fortifications:0 "Inspect the Fortifications"
 A01_build_bornean_fortifications_desc:0 "Inspect coastal positions and gain 5% stability. Choose state construction or an outside project."
 A01_prepare_bornean_logistics:0 "Prepare Bornean Logistics"
 A01_prepare_bornean_logistics_desc:0 "A railway linking Jesselton, Sandakan and Tawau will carry supplies and reinforcements across Sabah."
 A01_improve_bornean_fortifications:0 "Bornean Defensive Belt"
 A01_improve_bornean_fortifications_desc:0 "After domestic construction or project implementation, raise coastal forts to level 2 and land forts to level 1 in Jesselton, Sandakan and Tawau. Stronger forts are preserved. Works require ownership of Sabah and control of each port."
 A01_open_papuan_road:0 "Open the Papuan Road"
 A01_open_papuan_road_desc:0 "A road through southern New Guinea will improve overland communications. A consignment of rifles will reinforce the frontier garrisons."
 A01_fortify_australian_frontier:0 "Fortify the Australian Frontier"
 A01_fortify_australian_frontier_desc:0 "Permanent positions at Merauke and Lae will protect the southern flank of our New Guinea possessions."

 A01_before_japanese_war_tt:0 "The war with the Japanese Empire has not yet begun"
 A01_wilhelmina:0 "Queen Wilhelmina"
 A01_wilhelmina_desc:0 "Queen Wilhelmina remains a living symbol of the unity of the Dutch Crown and inspires her subjects to defend the state."
 A01_sultans_council_stability:0 "Council of Sultans"
 A01_sultans_council_stability_desc:0 "A temporary agreement with local rulers has eased tensions and restored order in the colonies."
 A01_borneo_fortification_directorate:0 "Borneo Fortification Directorate"
 A01_borneo_fortification_directorate_desc:0 "Military engineers prepare port defences. Land and coastal fort construction speed increases by 15% for 180 days. The program grants no general army defence bonus."

 A01_direct_rivalry:0 "Direct Rivalry"
 A01_direct_rivalry_desc:0 "Challenge Japan openly: lose 5% stability and gain 10 points of Ludolf’s authority. This course neither starts nor resets the independent Japanese countdown."
 pacific.5.t:0 "Batavia Issues a Challenge"
 pacific.5.d:0 "The Dutch government has declared a policy of direct rivalry with Japan. The naval ministry proposes preparing a Borneo expedition in response."
 pacific.5.a:0 "They can barely stand on their own feet."

 pacific.6.t:0 "Tokyo Accepts the Challenge"
 pacific.6.d:0 "Japan has answered our declared rivalry with the threat of a naval expedition. Its preparations proceed independently of our diplomatic choices. We must prepare Borneo’s defence."

 A01_japanese_preparations_reduction_tt:0 "Japanese preparations have already shortened the shared invasion countdown by §R15 days§!. Clicking this button does not shorten it again."

 borneo_project.1.t:0 "Three Projects for Borneo"
 borneo_project.1.d:0 "Inspectors report weak coastal positions. Britain offers concrete and engineers; Australia offers materials and specialists in exchange for New Guinea guarantees. Indonesian communities propose earthworks, obstacles and hidden paths. The defence bonus begins only after project implementation."
 borneo_project.1.a:0 "British engineers and concrete."
 borneo_project.1.b:0 "Australian materials and specialists."
 borneo_project.1.c:0 "Trust the local communities."
 A01_wtc_debt_20_tt:0 "WTC debt increases by §R20 percentage points§!."
 A01_own_fortifications_tt:0 "Defence against Japan: §G+20%§!. British opinion: §R−10§!. Debt commitments survive the war."
 A01_project_selected_tt:0 "One of the three defence projects has been selected."
 A01_project_implementation_tt:0 "Activate the selected project’s defence bonus against Japan."
 A01_british_project_tt:0 "Sovereignty loss: §R+10§! points. British influence: §R+15§! points. After implementation: §G+15%§! defence against Japan."
 A01_australian_project_tt:0 "Australian opinion: §G+10§!. New Guinea guarantees block the Australian frontier fortification focus. After implementation: §G+10%§! defence against Japan."
 A01_local_project_tt:0 "Recruitable population factor: §G+15%§!. Racial stability: §G+10%§!. Admiral respect: §R−5§! points. After implementation: §G+5%§! defence against Japan."
 A01_no_australian_guarantees_tt:0 "No commitment to Australia prohibiting New Guinea frontier fortifications."
 A01_borneo_british_exclusion:0 "Britain Excluded from the Defence Project"
 A01_borneo_australian_cooperation:0 "Joint Defence Project"
 A01_state_loan:0 "State Loan"
 A01_state_loan_desc:0 "Increase WTC debt by 20 points and reduce political power gain by 10%. Unlock domestic construction."
 A01_own_fortifications:0 "Our Own Fortifications"
 A01_own_fortifications_desc:0 "Gain 20% defence against Japan. Commit an additional 5% of factories to consumer goods and pay 0.10 political power daily. British opinion falls by 10 points. Build the Sabah port railway."
 A01_request_fortification_project:0 "Request a Project"
 A01_request_fortification_project_desc:0 "Choose one British, Australian or Indonesian community proposal. Its defence bonus begins upon implementation."
 A01_implement_fortification_project:0 "Implement the Project"
 A01_implement_fortification_project_desc:0 "Complete the selected project and Sabah port railway. Defence against Japan: British 15%, Australian 10%, local 5%."
 A01_borneo_state_loan:0 "WTC Defence Loan"
 A01_borneo_state_loan_desc:0 "WTC debt increased by 20 points. Political power gain falls by 10%.\nCurrent debt: [?A01_wtc_debt|0] points."
 A01_borneo_self_build:0 "State Fortification Program"
 A01_borneo_self_build_desc:0 "Gain 20% defence against Japan. Construction and debt consume civilian and political resources. Defence expires after the campaign; debt commitments remain."
 A01_borneo_debt_service:0 "Defence Debt Service"
 A01_borneo_debt_service_desc:0 "Loan repayments and contractor obligations continue after the war."
 A01_borneo_british_commitments:0 "British Engineering Mission"
 A01_borneo_british_commitments_desc:0 "British influence rises by 15 points and sovereignty loss by 10. Foreign supervision reduces political power gain by 10%.\nBritish influence: [?A01_british_influence|0]. Sovereignty loss: [?A01_sovereignty_loss|0]."
 A01_borneo_british_defence:0 "British Defence Project"
 A01_borneo_british_defence_desc:0 "Concrete positions grant 15% defence against Japan until the campaign ends."
 A01_borneo_australian_commitments:0 "New Guinea Guarantees"
 A01_borneo_australian_commitments_desc:0 "Australian opinion improves by 10 points. Our commitment prevents taking the focus to fortify the Australian frontier."
 A01_borneo_australian_defence:0 "Australian Defence Project"
 A01_borneo_australian_defence_desc:0 "Australian materials and specialists grant 10% defence against Japan until the campaign ends."
 A01_borneo_local_commitments:0 "Indonesian Community Cooperation"
 A01_borneo_local_commitments_desc:0 "Gain 15% recruitable population factor. Racial tensions improve by 10 stability points, but admiral respect falls by 5 points."
 A01_borneo_local_defence:0 "Local Defence Network"
 A01_borneo_local_defence_desc:0 "Earthworks, obstacles and hidden paths grant 5% defence against Japan until the campaign ends."

 A01_repair_ports:0 "Restore Ports and Workshops"
 A01_repair_ports_desc:0 "Remove the destruction penalties to construction and factory output. Restored communications reduce supply consumption by 5%. Costs 40 political power."
 A01_families_compensation:0 "Pensions for Bereaved Families"
 A01_families_compensation_desc:0 "Pay widows, children and disabled veterans. Remove unpaid compensation penalties and gain 3% stability. Costs 35 political power."
 A01_wtc_settlement:0 "Settle Obligations through the WTC"
 A01_wtc_settlement_desc:0 "Settle WTC debt, reconstruction costs and family compensation. Remove financial and destruction penalties, including defence loan servicing, and clear all three account balances."
 A01_domestic_debt_redemption:0 "Redeem the Debt Domestically"
 A01_domestic_debt_redemption_desc:0 "Redeem existing loans without a new WTC agreement. Remove defence loan penalties and clear the debt balance. Costs 75 political power."
 A01_recovery_investment:0 "From Recovery to Development"
 A01_recovery_investment_desc:0 "After settling obligations, invest in development: one civilian factory in Java and 5% construction speed."
 A01_demobilise_colonial_army:0 "Demobilisation and Homecoming"
 A01_demobilise_colonial_army_desc:0 "End coercive wartime service and begin military retraining. Transitional organisation penalty: 5%. War support falls by 3%."
 A01_joint_officer_schools:0 "Joint Officer Schools"
 A01_joint_officer_schools_desc:0 "Open officer careers to Dutch and Indonesians. Remove the transition penalty; gain 5% organisation, 5% faster training and 15 army experience."
 A01_civilian_defence_ministry:0 "Civilian Defence Ministry"
 A01_civilian_defence_ministry_desc:0 "Transfer budgets and appointments to a civilian minister. Gain 25 political power; admiral respect falls by 5 points."
 A01_federal_defence_command:0 "Unified Federal Command"
 A01_federal_defence_command_desc:0 "Unify army, fleet and island garrison command under civilian control. Supply consumption falls by 5%; naval organisation rises by 5%."
 A01_abolish_admirals_council:0 "Abolish the Council of Admirals"
 A01_abolish_admirals_council_desc:0 "End the Council’s authority over civilian government. Remove its national modifier and gain 3% stability. Naval officers retain their military commissions."
 A01_federal_constitution:0 "Constitution of Two Peoples"
 A01_federal_constitution_desc:0 "Guarantee equal rights, island powers and parliamentary accountability. Gain 5% stability and 0.05 daily political power."
 A01_legalise_federal_parties:0 "Legalise Federal Parties"
 A01_legalise_federal_parties_desc:0 "Give liberals, conservatives and the People’s Party equal electoral rights. Gain 25 political power."
 A01_first_federal_election:0 "First Federal Election"
 A01_first_federal_election_desc:0 "Hold the first federal election. The event selects the winning party and head of government; only that party’s branch becomes available."
 A01_liberal_victory:0 "Liberal Victory"
 A01_liberal_victory_desc:0 "The victorious party accepts its electoral mandate. Gain 25 political power. Further party focuses will be developed later."
 A01_conservative_victory:0 "Conservative Victory"
 A01_conservative_victory_desc:0 "The victorious party accepts its electoral mandate. Gain 25 political power. Further party focuses will be developed later."
 A01_peoples_party_victory:0 "People’s Party Victory"
 A01_peoples_party_victory_desc:0 "The victorious party accepts its electoral mandate. Gain 25 political power. Further party focuses will be developed later."
 A01_wtc_offer_required_tt:0 "Complete An Offer for the WTC; the WTC must exist."
 A01_postwar_destruction:0 "Damaged Ports and Workshops"
 A01_postwar_destruction_desc:0 "Reconstruction liabilities: [?A01_reconstruction_costs|0] points. Removed by port repairs or WTC financing."
 A01_unpaid_families:0 "Unpaid Family Compensation"
 A01_unpaid_families_desc:0 "Family compensation liabilities: [?A01_family_compensation_costs|0] points. Removed by pensions or WTC financing."
 A01_postwar_budget_burden:0 "Postwar Recovery Costs"
 A01_postwar_budget_burden_desc:0 "Reconstruction and social obligations require 5% more consumer goods factories and 0.10 daily political power. Removed by the public fund or WTC settlement."
 A01_civilian_reform_mandate:0 "Ludolf’s Civilian Mandate"
 A01_civilian_reform_mandate_desc:0 "A temporary civilian mandate grants 0.05 daily political power during reform. Replaced by accountable civil service."
 A01_restored_port_network:0 "Restored Port Network"
 A01_restored_port_network_desc:0 "Repaired harbours and warehouses reduce supply consumption by 5%."
 A01_wtc_recovery_guarantees:0 "WTC Commercial Guarantees"
 A01_wtc_recovery_guarantees_desc:0 "Commercial guarantees to the WTC reduce the production efficiency cap by 5% for 365 days, then expire automatically."
 A01_recovery_investment_idea:0 "Post-Recovery Investment"
 A01_recovery_investment_idea_desc:0 "Settled obligations release funds for development: construction speed +5%."
 A01_army_transition:0 "Army in Transition"
 A01_army_transition_desc:0 "Demobilisation and retraining temporarily reduce army organisation by 5%. Removed by joint officer schools."
 A01_joint_officer_corps:0 "Joint Officer Corps"
 A01_joint_officer_corps_desc:0 "Equal access to officer careers strengthens the professional army: organisation +5%, training time −5%."
 A01_federal_defence_command_idea:0 "Federal Defence Command"
