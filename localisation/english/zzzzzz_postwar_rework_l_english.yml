l_english:
 A01_postwar.1.t:0 "В чьих руках власть Нидерландов?"
 A01_postwar.1.d:0 "Поражение разрушило прежний порядок. Людольф предлагает гражданские реформы, Совет адмиралов требует передачи власти, а корона готова стать арбитром при равновесии сторон. Сегодня кабинет должен определить, кто поведёт страну дальше."
 A01_postwar.1.a:0 "Людольф получит мандат на реформы."
 A01_postwar.1.b:0 "Власть переходит Совету адмиралов."
 A01_postwar.1.c:0 "Передать власть короне: регентше Эмме от имени Вильгельмины."
 A01_pacific_settlement_desc:0 "Созвать послевоенный кабинет и выбрать власть одним событием. Людольф доступен при балансе не ниже −10%; Совет — всегда; корона — только при неустойчивом равновесии от −10% до +10%. Выбор открывает соответствующую ветку."
 A01_reconstruction_commission:0 "Audit Damage and Obligations"
 A01_reconstruction_commission_desc:0 "Audit reconstruction costs, family compensation and existing loans before choosing a funding route."
 A01_autonomous_sultanates_desc:0 "Recognise local self-government and negotiate entry into the future federation. Autonomous subjects can later join the common state."
 A01_elected_civil_service:0 "Accountable Civilian Government"
 A01_elected_civil_service_desc:0 "Replace the transitional mandate with accountable civil administration. Gain 5% political power generation and 5% cheaper army advisers."
 A01_democratic_federation:0 "Democratic Federation of the Netherlands and Indonesia"
 A01_democratic_federation_desc:0 "Found a common democratic state. Our autonomous sultanates join the federation; foreign and Japanese territories are untouched. Elections require separate preparation."
 A01_postwar.2.t:0 "Президент вместо губернатора"
 A01_postwar.2.d:0 "Учредительное собрание вводит президентскую должность и общее избирательное право. Партия либералов выступает за свободную торговлю, консерваторы — за постепенные перемены, Народная партия индонезийцев — за равное представительство островов. Каждая партия выставит кандидата на первых выборах."
 A01_postwar.2.a:0 "Открыть регистрацию партий и избирателей."
 A01_postwar.3.t:0 "First Federal Election"
 A01_postwar.3.d:0 "Dutch and Indonesians vote together for the first time. Liberals promise to continue Ludolf’s reforms, conservatives defend order and local government, and the People’s Party campaigns for social guarantees and equal representation. The electoral commission announces the winner:"
 A01_postwar.3.a:0 "Партия либералов — Людольф."
 A01_postwar.3.b:0 "Партия консерваторов — Хендрик ван дер Велде."
 A01_postwar.3.c:0 "People’s Party — Raden Surya."
 A01_postwar.4.t:0 "Скандал при формировании кабинета"
 A01_postwar.4.d:0 "На переговорах о министерских постах один из политиков не сдерживается: «Мы действительно собираемся допустить индонезийцев к управлению государством?» Реплику слышат журналисты. Индонезийская делегация требует публичного ответа президента: равное гражданство должно действовать и за дверями министерств."
 A01_postwar.4.a:0 "Потребовать извинений и сохранить равное представительство."
 A01_postwar.4.b:0 "Договориться о коалиции за закрытыми дверями."
 A01_postwar.4.c:0 "Уступить противникам индонезийских министров."
 A01_liberals:0 "Партия либералов"
 A01_conservatives:0 "Партия консерваторов"
 A01_indonesian_party:0 "People’s Party"
 A01_postwar_conservative_name:0 "Хендрик ван дер Велде"
 A01_postwar_indonesian_name:0 "Раден Сурья"
 A14:0 "Ачех"
 A14_DEF:0 "Султанат Ачех"
 A14_ADJ:0 "Ачехск."
 A01_new_republic:0 "Новая политика Людольфа"
 A01_new_republic_desc:0 "Реформы требуют денег и общественного доверия. Влияние ВТП: §Y[?A01_wtc_influence|0]/100§!. При 50 и выше компания получает экономические уступки: растут потребительские расходы и падает политический ресурс правительства."
 A01_wtc_postwar_unlock_tt:0 "Unlocks a postwar WTC agreement for reconstruction and debt settlement."
 A01_wtc_credit:0 "Кредит ВТП на восстановление"
 A01_wtc_credit_desc:0 "Финансирование ускоряет строительство гражданской промышленности."
 A01_wtc_concessions:0 "Зависимость от ВТП"
 A01_wtc_concessions_desc:0 "Компания требует долю доходов и вмешивается в решения кабинета. Снизьте влияние ниже 50 аудитом контрактов."
 A01_wtc_reconstruction_credit:0 "Кредит ВТП на восстановление"
 A01_wtc_reconstruction_credit_desc:0 "75 политической власти: получить 100 и поддержку промышленности; влияние ВТП +20. Повтор через 90 дней."
 A01_wtc_port_concession:0 "Портовая концессия ВТП"
 A01_wtc_port_concession_desc:0 "Компания построит гражданскую фабрику в столице в обмен на концессию. Влияние ВТП +30. Повтор через 120 дней."
 A01_audit_wtc_contracts:0 "Проверить договоры ВТП"
 A01_audit_wtc_contracts_desc:0 "Пересмотреть условия и снизить влияние компании на 15. Стабильность +1%."
 A01_veterans_register:0 "Единый реестр семей погибших"
 A01_veterans_register_desc:0 "Расширить выплаты и устранить двойные списки. Стабильность и поддержка войны +2%."
 A01_bilingual_ballots:0 "Бюллетени на местных языках"
 A01_bilingual_ballots_desc:0 "Помочь островным округам участвовать в выборах. Стабильность +2%, политическая власть +15."
 A01_coalition_roundtable:0 "Круглый стол трёх партий"
 A01_coalition_roundtable_desc:0 "Договориться о представительстве индонезийцев и урегулировать скандал. Стабильность +3%."
 A01_sultanate_conference:0 "Совещание автономных султанатов"
 A01_sultanate_conference_desc:0 "Согласовать оборону и бюджет с местными правителями. Стабильность +2%, политическая власть +15."
 A01_postwar.4.liberal_d:0 "При обсуждении министерских назначений депутат Партии либералов возмущается: «Индонезийцы в правительстве? Кто дал им право управлять нами?» Журналисты записывают реплику. Народная партия индонезийцев требует ответа президента: распространяется ли равное гражданство на министерские кресла?"
 A01_postwar.4.conservative_d:0 "При обсуждении министерских назначений депутат Партии консерваторов возмущается: «Индонезийцы в правительстве? Кто дал им право управлять нами?» Журналисты записывают реплику. Народная партия индонезийцев требует ответа президента: распространяется ли равное гражданство на министерские кресла?"
 A01_island_representation:0 "Representation of the Islands"
 A01_island_representation_desc:0 "Establish representation for Java, Sumatra and autonomous islands. Gain 25 political power and 3% stability."
 A01_public_recovery_fund:0 "Public Recovery Fund"
 A01_public_recovery_fund_desc:0 "Finance reconstruction domestically and remove the postwar budget burden. WTC loans require separate repayment. Costs 50 political power."
 A01_wtc_recovery_agreement:0 "WTC Recovery Agreement"
 A01_wtc_recovery_agreement_desc:0 "The earlier oil and rubber offer unlocks reconstruction financing and debt settlement. Accept one year of commercial guarantees: −5% production efficiency cap."
 A01_electoral_commission:0 "Electoral Commission"
 A01_electoral_commission_desc:0 "Compile shared electoral rolls and guarantee island communities access to voting. Gain 2% stability."
 A01_postwar_admiralty_shipyards:0 "Верфи под контролем Совета"
 A01_postwar_admiralty_shipyards_desc:0 "Объединить ремонтные заказы и подготовку экипажей перед восстановлением флота."
 A01_crown_island_council:0 "Совет островов при короне"
 A01_crown_island_council_desc:0 "Представители островов получат право обсуждать бюджет и обращаться к регентше напрямую."
 A01_crown_legal_guarantees:0 "Гарантии королевских судов"
 A01_crown_legal_guarantees_desc:0 "Закрепить порядок рассмотрения жалоб на военную администрацию и защиту островных хартий."
