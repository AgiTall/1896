l_english:
 A01_dutch_literacy:0 "Dutch Literacy"
 A01_dutch_literacy_desc:0 "Compulsory reading, arithmetic and Dutch classes prepare peasants for factory work. The agrarian society is weakened, while compulsory Dutch schooling improves production learning. First reform stage: 35 days."
 A01_rural_labour_duty:0 "Compulsory Labour Service"
 A01_rural_labour_duty_desc:0 "The administration introduces labour registers and compulsory village quotas. Peasants are assigned to factory settlements: agrarian constraints ease, but stability falls by 5 percentage points. Second reform stage: 35 days."
 A01_factory_resettlement:0 "The Transition to Factory Labour"
 A01_factory_resettlement_desc:0 "Permanent resettlement, factory housing and workplace training turn compulsory service into a new economic order. The agrarian national spirit is removed entirely and a trained factory workforce emerges. Stability falls by another 5 percentage points. Final reform stage: 70 days."
 A01_production_standardisation:0 "Unified Factory Standards"
 A01_production_standardisation_desc:0 "Common blueprints, component dimensions and training standards will replace fragmented workshop practices. The factory workforce spirit will improve, increasing output, efficiency growth and maximum production efficiency."
 A01_java_steam_power:0 "Steam Power for Java"
 A01_java_steam_power_desc:0 "Coordinate steam power stations and factory district supply. An industrial power grid will accelerate construction, while Batavia and East Java gain infrastructure."
 A01_local_nco_schools:0 "Local NCO Schools"
 A01_local_nco_schools_desc:0 "Train local NCOs for the KNIL, the Royal Netherlands East Indies Army. The army spirit improves and the colonial army inspectorate becomes available as an army chief."
 A01_agrarian_schooling:0 "Agrarian Society: The First Schools"
 A01_agrarian_schooling_desc:0 "Primary education lays the foundation for a transition from farming to factory labour. Agrarian constraints remain in force."
 A01_agrarian_labour_transition:0 "Agrarian Society: Compulsory Labour"
 A01_agrarian_labour_transition_desc:0 "Compulsory quotas assign workers to factories. The economy still depends on the countryside, but the industrial labour shortage is easing."
 A01_factory_workforce:0 "Trained Factory Workforce"
 A01_factory_workforce_desc:0 "Primary school graduates and resettled rural families provide a permanent industrial workforce. The agrarian national spirit has been removed."
 A01_standardised_industry:0 "Unified Industrial Standards"
 A01_standardised_industry_desc:0 "Common blueprints and training standards help factories learn production faster and use machinery more efficiently."
 A01_industrial_power_grid:0 "Industrial Power Grid"
 A01_industrial_power_grid_desc:0 "Coordinated development of steam power stations and factory districts accelerates new construction."
 A01_knil_field_training:0 "KNIL: Island Garrisons"
 A01_knil_field_training_desc:0 "The KNIL is the regular Royal Netherlands East Indies Army. Common training strengthens the organisation and defence of its island garrisons."
 A01_knil_reformed:0 "KNIL: Field Reforms"
 A01_knil_reformed_desc:0 "Field manuals and unified supply improve organisation, accelerate training and reduce supply consumption."
 A01_knil_professional:0 "KNIL: Trained Command Cadres"
 A01_knil_professional_desc:0 "Local NCOs improve the command structure of the KNIL, the regular colonial land army."
 A01_marine_training:0 "Marine Brigade Training"
 A01_marine_training_desc:0 "Common training programmes expand capacity for specialised formations."
 A01_local_armaments:0 "Island Armaments Contracts"
 A01_local_armaments_desc:0 "Local contracts and common armament standards strengthen weapons production."
 A01_escort_coordination:0 "Maritime Escort Coordination"
 A01_escort_coordination_desc:0 "Common routes and coordination procedures improve fleet organisation."
 A01_dutch_primary_schooling:0 "Compulsory Dutch Schooling"
 A01_dutch_primary_schooling_desc:0 "Reading, arithmetic and Dutch form the basis of industrial workforce training."
 A01_industrial_advisory_council_name:0 "Batavian Engineering Council"
 A01_industrial_advisory_council:0 "Batavian Engineering Council"
 A01_knil_inspectorate_name:0 "Colonial Army Inspectorate (KNIL)"
 A01_knil_inspectorate:0 "Colonial Army Inspectorate (KNIL)"
 A01_industrial_advisor_unlocked_tt:0 "Unlock the §YBatavian Engineering Council§! advisor with the §YCaptain of Industry§! trait. Appointment costs 150 political power."
 A01_army_advisor_unlocked_tt:0 "Unlock the §YKNIL Inspectorate§! army chief with an army defence bonus. Appointment costs 100 political power."
