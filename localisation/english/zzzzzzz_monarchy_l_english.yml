l_english:
 A01_monarchy.0.t:0 "Wilhelmina's Diary"
 A01_monarchy.0.d:0 "Young Wilhelmina writes that she refuses to be an ornament. She sees the Council and admirals ruin the country and wants responsibility for its future. Will we support the Crown in the postwar contest?"
 A01_monarchy.0.a:0 "She is still a child."
 A01_monarchy.0.b:0 "She is our hope."
 A01_monarchy.1.t:0 "A Conversation with Mother"
 A01_monarchy.1.d:0 "Emma of Waldeck and Pyrmont calls her daughter to her study. The mother speaks of duty, caution and a country unprepared for a child ruler. The daughter argues that delay is ruining the country. Their conversation lasts all night."
 A01_monarchy.1.a:0 "Yield to Mother."
 A01_monarchy.1.b:0 "Insist on taking the throne."
 A01_monarchy.3.t:0 "Parliament under the Crown"
 A01_monarchy.3.d:0 "Wilhelmina opens the first parliament of the Netherlands and Indonesia. Merchants, island civic delegates and princely envoys debate the budget and electoral law. The Admiralty Council no longer holds a veto. The Queen promises to appoint a premier who commands the chamber’s confidence."
 A01_monarchy.3.a:0 "Let them speak."
 A01_monarchy.3.b:0 "The Crown guarantees the constitution."
 A01_monarchy.4.t:0 "A Commonwealth of Two Shores"
 A01_monarchy.4.d:0 "The Commonwealth Charter recognises equal rights for the people of the Netherlands and Indonesia. Sultanates retain local laws and representation; shared affairs go before the Crown Parliament. One crown unites a partnership founded on agreement."
 A01_monarchy.4.a:0 "One crown, many peoples."
 A01_monarchy.5.t:0 "Royal Dictatorship"
 A01_monarchy.5.d:0 "After defeating the Council, Wilhelmina establishes personal rule. The Guard swears allegiance to the Crown and ministers answer to her. No parliamentary cabinet is formed. Island charters remain binding: victory over the admirals does not cancel treaties with the sultanates."
 A01_monarchy.5.a:0 "It must be done."
 A01_monarchy.5.b:0 "We will return to parliament someday."
 A01_monarchy.6.t:0 "Rule by Royal Decree"
 A01_monarchy.6.d:0 "The Admiralty Council loses its right to interfere in civilian affairs. Ministers answer to the Queen while the armed forces remain in state service. The Crown now bears responsibility for every decision."
 A01_monarchy.6.a:0 "The Crown accepts responsibility."
 A01_monarchy.7.t:0 "Crown and Sword"
 A01_monarchy.7.d:0 "Shipyards and mobilisation offices adopt military priorities. The Royal Navy becomes the foundation of power across the islands. Civilian supply must give way to armaments."
 A01_monarchy.7.a:0 "Serve the Crown."
 A01_emma_and_daughter:0 "Emma and Her Daughter"
 A01_emma_and_daughter_desc:0 "Resolve the dispute over the transfer of power from the Regent to the Queen."
 A01_royal_guard_corps:0 "Royal Guard Corps"
 A01_royal_guard_corps_desc:0 "Raise a Royal Guard division to support reform. The Guard enables forcible dissolution of the Council, at the cost of fleet disruption."
 A01_royal_naval_advisors:0 "Royal Naval Advisers"
 A01_royal_naval_advisors_desc:0 "Naval officers pledge loyalty to the Crown and develop common service standards."
 A01_island_delegation:0 "Island Delegation"
 A01_island_delegation_desc:0 "Island representatives gain a permanent voice in affairs of state."
 A01_royal_dictatorship:0 "Royal Dictatorship"
 A01_royal_dictatorship_desc:0 "Backed by the Guard and Navy, the Queen rejects constitutional limits on her power."
 A01_crown_parliament:0 "Crown Parliament"
 A01_crown_parliament_desc:0 "Bring Dutch and Indonesian representatives together under a constitutional Crown."
 A01_crown_commonwealth:0 "Royal Commonwealth"
 A01_crown_commonwealth_desc:0 "Establish equal rights and a charter-based commonwealth with Indonesia."
 A01_crown_absolute_rule:0 "Absolute Crown Rule"
 A01_crown_absolute_rule_desc:0 "End the Admiralty Council's political power and make ministers accountable to the Queen."
 A01_crown_militarism:0 "Military Monarchy"
 A01_crown_militarism_desc:0 "Prioritise dockyards and mobilisation at the expense of civilian supply."
 A01_royal_secret_police:0 "Crown Secret Police"
 A01_royal_secret_police_desc:0 "Establish a surveillance service. Resistance will be suppressed at the cost of public trust."
