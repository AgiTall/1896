 wtn_relations.title:0 "Delegates from [FROM.GetName]"
 wtn_relations.desc:0 "The visiting delegates propose exchanging harbour records, checking ship rendezvous and coordinating merchant cargo handovers. They are prepared to sign a limited voyage-services agreement leaving political questions outside the treaty."
 wtn_relations.decline:0 "We cannot accept these terms at present"
 wtn_relations.accept:0 "Coordinate our voyage services"
 wtn_relations.accepted.t:0 "Voyage Services Agreed"
 wtn_relations.accepted.d:0 "Our envoys have sent confirmed terms. Harbour crews of both governments can coordinate voyages and exchange verified records."
 wtn_relations.declined.t:0 "The Proposal Yields No Agreement"
 wtn_relations.declined.d:0 "Our delegates have returned without confirmed terms. Our maritime services must sustain voyages from their own resources and seek other opportunities to agree."
