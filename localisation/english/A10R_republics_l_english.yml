 A10R_request_defensive_armistice:0 "Propose a Defensive Armistice"
 A10R_request_defensive_armistice_desc:0 "If the islands are exhausted, propose an end to hostilities without territorial concessions. Japan may refuse. Acceptance will seriously damage the government’s prestige."
 A10_japanese_settlement_desc:0 "Peace terms depend on the harbours liberated. A full settlement requires liberation of the Japanese archipelago possessions; a Manila compromise leaves northern Luzon and Bataan to Japan. Severe exhaustion permits a separate armistice request."
 A10R_congress.40.t:0 "An Envoy from Cavite"
 A10R_congress.40.d:0 "A Philippine envoy proposes an end to hostilities and the withdrawal of troops behind the old borders. Manila’s officers call it a lost victory; the treasury calls it an opportunity to reduce expenses. The islanders offer no new concessions."
 A10R_congress.40.o0:0 "Accept the ceasefire."
 A10R_congress.40.o1:0 "Continue the campaign."
 A10R_congress.41.t:0 "A Bitter Silence"
 A10R_congress.41.d:0 "Peaceful cargo returns to the quays, but the northern harbours remain under a foreign flag. The government speaks of lives saved. Returning soldiers remain silent. Reconstruction and a long argument over the price of peace lie ahead."
 A10R_congress.41.o0:0 "Preserve what we managed to hold."
 A10R_provisional_compact:0 "Provisional Republican Compact"
 A10R_provisional_compact_desc:0 "Common institutions remain fragile, but the islands have sealed their first mutual obligations."
 A10R_common_treasury_spirit:0 "An Open Union Treasury"
 A10R_common_treasury_spirit_desc:0 "The republics can see where their contributions go and hold the treasurers accountable."
 A10R_arbitration:0 "Inter-Island Arbitration"
 A10R_arbitration_desc:0 "A common court, rather than republican detachments, settles disputes between councils."
 A10R_tenant_rights:0 "Village Guarantees"
 A10R_tenant_rights_desc:0 "Written leases and debt reviews protect village families against arbitrary exactions."
 A10R_confederal_covenant:0 "Union of Sovereign Republics"
 A10R_confederal_covenant_desc:0 "A permanent compact, common defence and mutual responsibility bind the islands."
 A10R_customs_union_spirit:0 "Common External Customs"
 A10R_customs_union_spirit_desc:0 "Open harbours and agreed external duties have replaced internal tariffs."
 A10R_republican_solidarity:0 "Republican Solidarity"
 A10R_republican_solidarity_desc:0 "Different banners no longer impede the common defence of the islands."
 A10R_bill_of_rights_spirit:0 "Federal Charter Guarantees"
 A10R_bill_of_rights_spirit_desc:0 "Common law protects local languages, councils and faiths."
 A10R_federal_citizenship:0 "Common Island Citizenship"
 A10R_federal_citizenship_desc:0 "Birthplace no longer determines a person’s rights before federal law."
 A10R_responsible_cabinet:0 "A Cabinet Answerable to Parliament"
 A10R_responsible_cabinet_desc:0 "Ministers must justify their decisions before both chambers."
 A10R_fractured_council:0 "Divided Island Councils"
 A10R_fractured_council_desc:0 "Delegates distrust the common treasury while commanders dispute their supplies."
 A10R_trusted_council:0 "Trust of the Islands"
 A10R_trusted_council_desc:0 "Councils carry out common decisions because they took part in making them."
 A10R_emergency_concessions:0 "Emergency Republican Concessions"
 A10R_emergency_concessions_desc:0 "Part of union revenue has temporarily returned to local councils to preserve agreement."
 A10R_reconstruction:0 "Reconstruction Obligations"
 A10R_reconstruction_desc:0 "Quays, roads and bereaved families require support from the common treasury."
 A10R_island_recovery:0 "The Islands Recover"
 A10R_island_recovery_desc:0 "Workshops reopen, families return and schools welcome their pupils."
 A10R_bitter_armistice:0 "A Bitter Armistice"
 A10R_bitter_armistice_desc:0 "The war is over, but the promise to recover all northern harbours remains unfulfilled."
 A10R_council:0 "Council of the Republics"
 A10R_council_desc:0 "Island cohesion: [?A10R_cohesion|0]/100. War tests the union; an open treasury and meetings of delegates build trust."
 A10R_federal_ratification:0 "Federal Ratifications"
 A10R_federal_ratification_desc:0 "Republican approvals: [?A10R_federal_votes|0]. Proclamation requires three approvals, or all remaining republics if fewer than three, and cohesion of at least 40. Accession requires peace, ratification and equal citizenship; local national territories are retained."
 A10R_ratification_tt:0 "Separate ratification negotiations open with subject republics. Each may accept or refuse."
 A10R_convene_delegates:0 "Convene the Island Delegates"
 A10R_convene_delegates_desc:0 "Hear republican grievances and agree a common supply order."
 A10R_emergency_contributions:0 "Request Emergency Contributions"
 A10R_emergency_contributions_desc:0 "The republics can release local rifle stocks, but the request will test their trust."
 A10R_publish_accounts:0 "Publish the Union Accounts"
 A10R_publish_accounts_desc:0 "Open ledgers will show councils that their contributions are not disappearing into private pockets."
 A10R_federal_presidency_name:0 "Federal Civilian Cabinet"
 A10R_federal_presidency_desc:0 "An elected government answerable to the population chamber and the island chamber."
 A10R_confederal_presidency_name:0 "Council of Island Republics"
 A10R_confederal_presidency_desc:0 "A union presidency answerable to delegates of the sovereign island republics."
 A10_federal_administration_desc:0 "A common statute connects provincial services with elected councils. Trust in the new institutions grows gradually and requires their promised rights to be honoured."
 A10_common_army_desc:0 "The republics maintain their own detachments, but depots, crossings and staff orders follow a common arrangement."
