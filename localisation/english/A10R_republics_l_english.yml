l_english:
 A10R_congress.1.t:0 "Tables beneath the Awning"
 A10R_congress.1.d:0 "Cavite has no hall large enough for the delegates. Beneath a canvas awning, some demand weapons for Luzon while others demand written guarantees of island liberty. The chairman asks them first to hear those who crossed the Japanese patrol lines."
 A10R_congress.1.o0:0 "First make our promises binding."
 A10R_congress.1.o1:0 "Open the depots first."
 A10R_congress.2.t:0 "The Seals of Mindanao"
 A10R_congress.2.d:0 "The Mindanao envoys bring two different seals and one list of demands. They will defend the islands, but refuse imposed judges and tax collectors. Officers urge haste; the interpreters ask that the elders be allowed to finish."
 A10R_congress.2.o0:0 "Confirm local law."
 A10R_congress.2.o1:0 "Common defence requires common contributions."
 A10R_congress.3.t:0 "The Landowners’ Promissory Notes"
 A10R_congress.3.d:0 "Congress receives a tenant’s notebook: a seed debt has survived two harvests and a change of government. The landowner demands respect for property; village delegates demand an end to endless collections. The decision will travel far beyond this village."
 A10R_congress.3.o0:0 "Review the debts in open court."
 A10R_congress.3.o1:0 "Redeem the disputed obligations."
 A10R_congress.4.t:0 "Compact or Constitution"
 A10R_congress.4.d:0 "The future of the union divides old comrades. Some see a common government as protection against another conqueror; others remember how capitals made temporary powers permanent. Two drafts lie on the table, and both promise liberty."
 A10R_congress.4.o0:0 "Debate both drafts on the islands."
 A10R_congress.5.t:0 "No Silent Ratifications"
 A10R_congress.5.d:0 "The convention sends its draft federal law to the republics. Delegates insist that silence shall not mean consent and military necessity shall not annul local votes. The secretary leaves a separate page for every seal."
 A10R_congress.5.o0:0 "Send the draft to the republican assemblies."
 A10R_congress.6.t:0 "A Federation Still to Be Joined"
 A10R_congress.6.d:0 "The federal constitution is proclaimed. Delegates who approved it remain at the table; the others return to their voters. The government must now honour its guarantees and conclude each accession, rather than declare all islands subordinate to one seal."
 A10R_congress.6.o0:0 "One law, voluntary accession."
 A10R_congress.7.t:0 "Names in the Parish Registers"
 A10R_congress.7.d:0 "The reconstruction commission compares army rolls with parish registers. Where the staff counted lost rifles, villages name lost breadwinners. The common ledger must include ruined workshops and families with no home to return to."
 A10R_congress.7.o0:0 "Begin with bereaved families."
 A10R_congress.7.o1:0 "Restore livelihoods first."
 A10R_congress.8.t:0 "Nine Places beneath the Sun"
 A10R_congress.8.d:0 "The union flag rises above the assembly. A republic represented by one delegate votes beside the populous ports. The chairman reads the covenant: mutual defence, open harbours and a duty to attempt words before taking up arms."
 A10R_congress.8.o0:0 "The republics keep their word."
 A10R_congress.9.t:0 "The Cabinet before the Chambers"
 A10R_congress.9.d:0 "The ministers take their seats before both chambers. Former couriers, teachers and coastal workshop owners sit among the deputies. Officers attend as guests: for the first time since Manila fell, the budget is decided without a staff order."
 A10R_congress.9.o0:0 "Open the first sitting."
 A10R_congress.10.t:0 "The Delegates’ Empty Seats"
 A10R_congress.10.d:0 "Several island delegations have walked out. They accuse the treasury of hiding contributions and the staff of favouring certain ports. One dispute will not dissolve the union, but silence will deepen the next rupture."
 A10R_congress.10.o0:0 "Fund a conciliation commission."
 A10R_congress.10.o1:0 "Return part of the contributions."
 A10R_local_vote_PVI:0 "Local Assembly: Visayan Republic"
 A10R_local_vote_PVI_desc:0 "Convene local representatives in the liberated territory to debate the federal charter. Integration will require their consent, equal civil rights and trust in the new administration."
 A10R_request_PVI:0 "Ratification: Visayan Republic"
 A10R_request_PVI_desc:0 "Submit the constitution to the local assembly. The republic may refuse; negotiations can resume after a new round of discussion."
 A10R_accession_PVI:0 "Accession: Visayan Republic"
 A10R_accession_PVI_desc:0 "With republican consent and equal citizenship, its institutions may join the federation. A vote conveys no right to seize territory held by foreign armies."
 A10R_congress.20.t:0 "Federal Draft: Visayan Republic"
 A10R_congress.20.d:0 "Cavite’s envoy presents a common constitution promising local councils, equal citizenship and island representation. The assembly must decide whether it trusts these guarantees. Refusal will preserve the republic within the existing union."
 A10R_congress.20.o0:0 "Ratify with local rights preserved."
 A10R_congress.20.o1:0 "Preserve the republican compact."
