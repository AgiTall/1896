 auc_campaign.1.t:0 "A British Charter for Australia"
 auc_campaign.1.d:0 "Sydney requests permission to unite consenting colonies under the Crown, retaining British sovereignty."
 auc_campaign.1.a:0 "Approve a negotiated federation"
 auc_campaign.1.b:0 "Preserve separate colonies"
 auc_campaign.2.t:0 "Reply to the Federation Bill"
 auc_campaign.2.d:0 "Federation decisions show the result. After refusal, retry in six months or seek sovereignty."
 auc_campaign.2.a:0 "Continue"
 auc_campaign.3.t:0 "Australia Requests Sovereignty"
 auc_campaign.3.d:0 "The Commonwealth demands an independent foreign policy. Refusal preserves colonial status and opens an independence war path."
 auc_campaign.3.a:0 "Recognise Australian sovereignty"
 auc_campaign.3.b:0 "Reject the demand"
 auc_campaign.4.t:0 "Our Powers and the Crown"
 auc_campaign.4.d:0 "The British reply determines whether Australia is free or must choose renewed talks or an armed break."
 auc_campaign.4.a:0 "Report to Parliament"
 auc_campaign.40.t:0 "A Colonial Vote Returns"
 auc_campaign.40.d:0 "A colony has authorised joining. Federation decisions show current approvals and ratification requirements."
 auc_campaign.40.a:0 "Receive the protocol"
 auc_campaign.5.t:0 "An Australian Armistice Proposal"
 auc_campaign.5.d:0 "Australia has held its territory for six months and proposes recognition of independence. Acceptance ends the war and permits the negotiated union of consenting colonies."
 auc_campaign.5.a:0 "Recognise an independent Australia"
 auc_campaign.5.b:0 "Continue the war"
 auc_campaign.6.t:0 "Britain Recognises Independence"
 auc_campaign.6.d:0 "The armistice recognises Australian independence and permits the admission of colonies that separately approve federation."
 auc_campaign.6.a:0 "Ratify peace"
