l_english:
 A01_abolish_admirals_council:0 "Abolish the Council of Admirals"
 A01_abolish_admirals_council_desc:0 "End the Council’s authority over civilian government. Remove its national modifier and gain 3% stability. Naval officers retain their military commissions."
 A01_admirals_council_coup:0 "The Admirals Council Coup"
 A01_admirals_council_coup_desc:0 "The admirals will remove Ludolf and place Batavia under direct naval leadership. Dockyard construction and war support will receive priority."
 A01_admirals_on_trial:0 "Admirals before the Court"
 A01_admirals_on_trial_desc:0 "Secure individual convictions through civilian courts. Preserve the fleet, but first gather three dossiers and two points of captain loyalty through decisions."
 A01_admirals_retirement:0 "Pensions instead of a Political Veto"
 A01_admirals_retirement_desc:0 "Trade pensions and immunity for dissolution. Retiring admirals retain procurement connections that a later civilian government must reform."
 A01_admiralty_diplomacy:0 "Gunboat Diplomacy"
 A01_admiralty_diplomacy_desc:0 "Gunboat Diplomacy. A sustained investment in this programme will strengthen our position in the Pacific."
 A01_admiralty_shipyards:0 "Admiralty Shipyards"
 A01_admiralty_shipyards_desc:0 "The admiralty government will finance an expansion of Surabaya shipyards. Sea control requires a steady programme of naval construction."
 A01_archipelago_command:0 "Unified Archipelago Command"
 A01_archipelago_command_desc:0 "Army and navy defend the same archipelago. Unified command will bring their defensive plans together."
 A01_archipelago_great_power:0 "A Great Power of the Archipelago"
 A01_archipelago_great_power_desc:0 "Recognise that the nation’s future lies in the islands. Shared defence and equal access to command support a Pacific power at the cost of a heavier military budget."
 A01_autonomous_sultanates:0 "Agreement with the Sultanates"
 A01_autonomous_sultanates_desc:0 "Recognise local self-government and negotiate entry into the future federation. Autonomous subjects can later join the common state."
 A01_batavia_docks:0 "Batavia Dockyards"
 A01_batavia_docks_desc:0 "Deeper harbours and new dry docks will service the squadron in Batavia. Damaged ships will no longer need to seek repairs abroad."
 A01_blame_the_military:0 "Law of Power: Blame the Military"
 A01_blame_the_military_desc:0 "Having lost the war, the educated philosopher-statesman Ludolf recognizes the supreme law of power: the disgrace of defeat must fall upon the military, not the government. All strategic blunders, logistical shortages, and tactical arrogance are laid at the feet of the Admirals' Council, shielding the civilian cabinet."
 A01_british_raj_model:0 "The British Raj Model"
 A01_british_raj_model_desc:0 "Instead of brutally breaking the native population by force, the Netherlands adopts the British colonial blueprint: flexible indirect rule, treaties, and mutual commercial interest."
 A01_build_bornean_fortifications:0 "Inspect the Fortifications"
 A01_build_bornean_fortifications_desc:0 "Inspect coastal positions and gain 5% stability. Choose state construction or an outside project."
 A01_cabinet_island_schools:0 "Raden Surya’s Island Schools"
 A01_cabinet_island_schools_desc:0 "The coalition trains teachers and engineers through a shared curriculum on Crown and sultanate lands, preserving local languages."
 A01_cabinet_open_budget:0 "Van Rijn’s Open Budget"
 A01_cabinet_open_budget_desc:0 "Public parliamentary accounts direct investment towards civilian enterprises and the royal engineering schools."
 A01_cabinet_princely_budget:0 "Van der Velde’s Naval Budget"
 A01_cabinet_princely_budget_desc:0 "The Order Party combines princely guarantees with shipyard orders while keeping the Council’s political veto abolished."
 A01_capital_of_two_worlds:0 "Capital of Two Worlds"
 A01_capital_of_two_worlds_desc:0 "Build a government district and propose New Amsterdam as the capital’s name. The city council may retain Batavia or choose a dual name."
 A01_civilian_admiralty:0 "A Navy Ministry instead of the Council"
 A01_civilian_admiralty_desc:0 "The minister answers to civilian government for budgets; the naval staff plans operations. Replace personal authority with accountable institutions."
 A01_civilian_defence_ministry:0 "Civilian Defence Ministry"
 A01_civilian_defence_ministry_desc:0 "Transfer budgets and appointments to a civilian minister. Gain 25 political power; admiral respect falls by 5 points."
 A01_coastal_watch:0 "Coastal Watch Service"
 A01_coastal_watch_desc:0 "Unify coastal observation and island defence procedures. An island defence spirit will be added."
 A01_conservative_victory:0 "Conservative Victory"
 A01_conservative_victory_desc:0 "The victorious party accepts its electoral mandate. Gain 25 political power. Further party focuses will be developed later."
 A01_constitution:0 "Amend the 1854 Constitution"
 A01_constitution_desc:0 "Constitutional amendments temporarily suspend the Admirals Council restrictions. For two weeks, mobilisation, economic and trade laws may be changed without political cost."
 A01_crown_above_factions:0 "The Crown Above the Factions"
 A01_crown_above_factions_desc:0 "Complete this focus to bring Emma to power while the balance lies between -10% and +10%. The private royal proposal reveals this otherwise hidden branch."
 A01_crown_absolute_rule:0 "Absolute Crown Rule"
 A01_crown_absolute_rule_desc:0 "End the Admiralty Council's political power and make ministers accountable to the Queen."
 A01_crown_commonwealth:0 "Royal Commonwealth"
 A01_crown_commonwealth_desc:0 "Establish equal rights and a charter-based commonwealth with Indonesia."
 A01_crown_island_council:0 "The Crown’s Island Council"
 A01_crown_island_council_desc:0 "Island representatives will gain the right to debate the budget and petition the regent directly."
 A01_crown_legal_guarantees:0 "Guarantees of the Royal Courts"
 A01_crown_legal_guarantees_desc:0 "Establish procedures for hearing complaints against the military administration and protecting island charters."
 A01_crown_militarism:0 "Military Monarchy"
 A01_crown_militarism_desc:0 "Prioritise dockyards and mobilisation at the expense of civilian supply."
 A01_crown_parliament:0 "Crown Parliament"
 A01_crown_parliament_desc:0 "Bring Dutch and Indonesian representatives together under a constitutional Crown."
 A01_crown_provincial_diets:0 "Provincial Diets under the Crown"
 A01_crown_provincial_diets_desc:0 "Even decrees require feedback. Establish island assemblies with elected civic delegates who can challenge officials, although they cannot appoint the cabinet."
 A01_defence_in_depth:0 "Defence in Depth"
 A01_defence_in_depth_desc:0 "We cannot hold every bay. Prepared positions and reserves will contain a landing and buy time for a counterattack."
 A01_demobilise_colonial_army:0 "Demobilisation and Homecoming"
 A01_demobilise_colonial_army_desc:0 "End coercive wartime service and begin military retraining. Transitional organisation penalty: 5%. War support falls by 3%."
 A01_democratic_federation:0 "Democratic Federation of the Netherlands and Indonesia"
 A01_democratic_federation_desc:0 "Found a common democratic state. Our autonomous sultanates join the federation; foreign and Japanese territories are untouched. Elections require separate preparation."
 A01_direct_naval_rule:0 "Direct Naval Rule"
 A01_direct_naval_rule_desc:0 "The civilian parliament will give way to naval administration. Mobilisation will accelerate and the state will pursue a firmer security policy."
 A01_direct_rivalry:0 "Direct Rivalry"
 A01_direct_rivalry_desc:0 "Challenge Japan openly: lose 5% stability and gain 10 points of Ludolf’s authority. This course neither starts nor resets the independent Japanese countdown."
 A01_domestic_debt_redemption:0 "Redeem the Debt Domestically"
 A01_domestic_debt_redemption_desc:0 "Redeem existing loans without a new WTC agreement. Remove defence loan penalties and clear the debt balance. Costs 75 political power."
 A01_dutch_literacy:0 "Dutch Literacy"
 A01_dutch_literacy_desc:0 "Compulsory reading, arithmetic and Dutch classes prepare peasants for factory work. The agrarian society is weakened, while compulsory Dutch schooling improves production learning. First reform stage: 35 days."
 A01_elected_civil_service:0 "Accountable Civilian Government"
 A01_elected_civil_service_desc:0 "Replace the transitional mandate with accountable civil administration. Gain 5% political power generation and 5% cheaper army advisers."
 A01_electoral_act:0 "Archipelago Electoral Act"
 A01_electoral_act_desc:0 "Choose territorial compromise with the princes or equal civic representation. Under either system parliament will approve the prime minister."
 A01_electoral_commission:0 "Electoral Commission"
 A01_electoral_commission_desc:0 "Compile shared electoral rolls and guarantee island communities access to voting. Gain 2% stability."
 A01_emma_and_daughter:0 "Emma and Her Daughter"
 A01_emma_and_daughter_desc:0 "Resolve the dispute over the transfer of power from the Regent to the Queen."
 A01_equal_citizenship:0 "Equal Federal Citizenship"
 A01_equal_citizenship_desc:0 "End the legal divide between Dutch and Indonesians. Remove the racial divide modifier and gain 3% stability."
 A01_equal_subjects:0 "Subjects Become Citizens"
 A01_equal_subjects_desc:0 "Abolish separate civil categories and open public service to Indonesians. Interpreter schools and opposition from colonial property owners make equality costly."
 A01_european_democratic_unity:0 "Union of European Democracy"
 A01_european_democratic_unity_desc:0 "Begin rapprochement and possible union with Britain. A delegation tests London’s willingness and strengthens democratic circles. This opening excludes Lone Wolf and the Chamber course."
 A01_factory_resettlement:0 "The Transition to Factory Labour"
 A01_factory_resettlement_desc:0 "Permanent resettlement, factory housing and workplace training turn compulsory service into a new economic order. The agrarian national spirit is removed entirely and a trained factory workforce emerges. Stability falls by another 5 percentage points. Final reform stage: 70 days."
 A01_families_compensation:0 "Pensions for Bereaved Families"
 A01_families_compensation_desc:0 "Pay widows, children and disabled veterans. Remove unpaid compensation penalties and gain 3% stability. Costs 35 political power."
 A01_federal_constitution:0 "Constitution of Two Peoples"
 A01_federal_constitution_desc:0 "Guarantee equal rights, island powers and parliamentary accountability. Gain 5% stability and 0.05 daily political power."
 A01_federal_defence_command:0 "Unified Federal Command"
 A01_federal_defence_command_desc:0 "Unify army, fleet and island garrison command under civilian control. Supply consumption falls by 5%; naval organisation rises by 5%."
 A01_first_federal_election:0 "First Federal Election"
 A01_first_federal_election_desc:0 "Hold the first federal election. The event selects the winning party and head of government; only that party’s branch becomes available."
 A01_first_royal_election:0 "The First Election under the Crown"
 A01_first_royal_election_desc:0 "A 90-day campaign pits the Constitutional Union, Order Party and Indonesian Coalition against one another. Court guarantees and civic rights affect the vote; campaign through decisions."
 A01_fleet_of_recovery:0 "The Council Oversees the Fleet"
 A01_fleet_of_recovery_desc:0 "The Council Oversees the Fleet. Establish the institutions and guarantees of this political settlement."
 A01_fortify_australian_frontier:0 "Fortify the Australian Frontier"
 A01_fortify_australian_frontier_desc:0 "Permanent positions at Merauke and Lae will protect the southern flank of our New Guinea possessions."
 A01_general_amnesty:0 "General Amnesty"
 A01_general_amnesty_desc:0 "To prevent endless vendettas and pacify the fleet, the government proclaims a broad amnesty for rank-and-file officers and sailors who lay down their arms. The junta ringleaders are imprisoned; public peace is restored."
 A01_golden_bridges:0 "Golden Bridges for Officers"
 A01_golden_bridges_desc:0 "Recognizing that cornering the entire officer corps invites open mutiny, Ludolf fractures the military elite with golden bridges: moderate captains receive promised seats in the future parliament, naval pensions, and honorable commands."
 A01_guard_academy:0 "Royal Guard Academy"
 A01_guard_academy_desc:0 "Train Dutch and Indonesian officers together and turn palace guards into a professional corps sworn to the state and Crown."
 A01_homeland_in_exile:0 "The Netherlands Endure in Exile"
 A01_homeland_in_exile_desc:0 "Support refugees, preserve the lost homeland’s institutions and prepare a fleet for return. Liberation will require strength and opportunity."
 A01_implement_fortification_project:0 "Implement the Project"
 A01_implement_fortification_project_desc:0 "Complete the selected project and Sabah port railway. Defence against Japan: British 15%, Australian 10%, local 5%."
 A01_improve_bornean_fortifications:0 "Bornean Defensive Belt"
 A01_improve_bornean_fortifications_desc:0 "After domestic construction or project implementation, raise coastal forts to level 2 and land forts to level 1 in Jesselton, Sandakan and Tawau. Stronger forts are preserved. Works require ownership of Sabah and control of each port."
 A01_indonesian_petition:0 "The Indonesian Petition"
 A01_indonesian_petition_desc:0 "Teachers, dockworkers and veterans demand seats alongside the princes. A settlement with hereditary courts alone cannot sustain the state."
 A01_island_compact:0 "Crown and Archipelago Compact"
 A01_island_compact_desc:0 "Choose autonomous sultanates or a unified administration under local charters. The treaty covers only land we hold and does not cancel Japanese ownership or concessions."
 A01_island_delegation:0 "Island Delegation"
 A01_island_delegation_desc:0 "Island representatives gain a permanent voice in affairs of state."
 A01_island_garrisons:0 "Island Garrisons"
 A01_island_garrisons_desc:0 "Introduce common training procedures for island garrisons. The KNIL spirit will gain an additional defence bonus."
 A01_island_officer_commissions:0 "Officer Commissions for Islanders"
 A01_island_officer_commissions_desc:0 "Open senior commissions to Indonesians and coordinate KNIL training with the sultanates without dissolving their armies."
 A01_island_representation:0 "Representation of the Islands"
 A01_island_representation_desc:0 "Establish representation for Java, Sumatra and autonomous islands. Gain 25 political power and 3% stability."
 A01_java_development:0 "The Java Development Plan"
 A01_java_development_desc:0 "State orders will connect Batavia workshops with Java enterprises. New factories will supply the archipelago with locally produced goods."
 A01_java_steam_power:0 "Steam Power for Java"
 A01_java_steam_power_desc:0 "Coordinate steam power stations and factory district supply. An industrial power grid will accelerate construction, while Batavia and East Java gain infrastructure."
 A01_joint_officer_schools:0 "Joint Officer Schools"
 A01_joint_officer_schools_desc:0 "Open officer careers to Dutch and Indonesians. Remove the transition penalty; gain 5% organisation, 5% faster training and 15 army experience."
 A01_jungle_supply:0 "Island Supply Service"
 A01_jungle_supply_desc:0 "Field instructions and unified supply will improve the KNIL spirit: organisation rises, training accelerates and supply consumption falls."
 A01_knil_reform:0 "Reform the KNIL — Colonial Army"
 A01_knil_reform_desc:0 "KNIL stands for Koninklijk Nederlands-Indisch Leger, the Royal Netherlands East Indies Army. In the mod it is the regular land army of the archipelago, governed from Batavia.\n\nArmy focuses improve its national spirit: organisation, defence, training and supply. Indonesian volunteer militia are separate temporary formations for the war with Japan."
 A01_last_chance_to_negotiate:0 "One Last Negotiation"
 A01_last_chance_to_negotiate_desc:0 "Offer peace: gain 5% stability at the cost of 10 points of Ludolf’s authority. Japanese preparations proceed independently of our focuses. Agreement cancels the invasion."
 A01_legalise_federal_parties:0 "Legalise Federal Parties"
 A01_legalise_federal_parties_desc:0 "Give liberals, conservatives and the People’s Party equal electoral rights. Gain 25 political power."
 A01_liberal_victory:0 "Liberal Victory"
 A01_liberal_victory_desc:0 "The victorious party accepts its electoral mandate. Gain 25 political power. Further party focuses will be developed later."
 A01_local_nco_schools:0 "Local NCO Schools"
 A01_local_nco_schools_desc:0 "Train local NCOs for the KNIL, the Royal Netherlands East Indies Army. The army spirit improves and the colonial army inspectorate becomes available as an army chief."
 A01_local_rifles:0 "Local Rifle Manufacture"
 A01_local_rifles_desc:0 "Surabaya armaments contracts will provide rifles and a lasting local procurement programme, accelerating military factory construction and raising maximum production efficiency."
 A01_lone_wolf_path:0 "The Lone Wolf Course"
 A01_lone_wolf_path_desc:0 "Batavia will pursue an independent course. Existing faction commitments will end, and future alliances will be ruled out."
 A01_ludolf_retirement_navy:0 "Ludolf Takes Command of the Navy"
 A01_ludolf_retirement_navy_desc:0 "Having fulfilled his grand maneuver and shattered the junta, Ludolf orchestrates an unpunished exit: stepping down as Governor-General to assume supreme command of the Royal Navy, opening the path for constitutional transit or the Regency of Queen-Mother Emma."
 A01_ludolf_survives:0 "Mandate for Civilian Reform"
 A01_ludolf_survives_desc:0 "Ludolf retains office to lead the transition from colonial rule to federation. A civilian mandate eases the transitional government’s burdens."
 A01_marine_brigades:0 "Marine Brigades"
 A01_marine_brigades_desc:0 "Recovering a lost port requires troops trained to land from the sea. Marine brigades will exercise alongside ship crews."
 A01_military_industry:0 "Military Workshops"
 A01_military_industry_desc:0 "Direct government orders will expand Java arms workshops. Military factories will receive priority in the allocation of materials."
 A01_military_state:0 "The State of the Military Elite"
 A01_military_state_desc:0 "Place ministries, courts, budgets and appointments under the military elite."
 A01_naval_general_staff:0 "Naval General Staff"
 A01_naval_general_staff_desc:0 "Scattered squadrons need a common plan. A naval general staff will coordinate reconnaissance, repairs and operational deployment."
 A01_negotiated_resignation:0 "The Admirals Council Takes Power"
 A01_negotiated_resignation_desc:0 "Transfer power to the council directly from the postwar cabinet. Ludolf is dismissed and imprisoned; purges and military control follow."
 A01_northern_memory:0 "Who Answers for the Lost Shores?"
 A01_northern_memory_desc:0 "Who Answers for the Lost Shores?. Establish the institutions and guarantees of this political settlement."
 A01_open_papuan_road:0 "Open the Papuan Road"
 A01_open_papuan_road_desc:0 "A road through southern New Guinea will improve overland communications. A consignment of rifles will reinforce the frontier garrisons."
 A01_open_seas_kingdom:0 "Kingdom of Open Seas"
 A01_open_seas_kingdom_desc:0 "Choose a trading commonwealth rather than permanent revanche. Guarantee markets and naval protection to autonomous partners and invest in civilian growth."
 A01_own_fortifications:0 "Our Own Fortifications"
 A01_own_fortifications_desc:0 "Gain 20% defence against Japan. Commit an additional 5% of factories to consumer goods and pay 0.10 political power daily. British opinion falls by 10 points. Build the Sabah port railway."
 A01_pacific_settlement:0 "The Post-defeat Cabinet"
 A01_pacific_settlement_desc:0 "Convene the postwar cabinet and settle the question of power. Ludolf can take office when the balance is at least −10%; the Council is always available; the Crown can intervene only when the balance lies between −10% and +10%. The settlement opens the corresponding political path."
 A01_postwar_admiralty_shipyards:0 "Shipyards under Council Control"
 A01_postwar_admiralty_shipyards_desc:0 "Coordinate repair orders and crew training before rebuilding the fleet."
 A01_princely_guarantees:0 "Guarantees to the Princely Courts"
 A01_princely_guarantees_desc:0 "Local law and succession remain with the sultans, while a common court protects residents against arbitrary taxation. Princes gain influence without a veto over civic representation."
 A01_production_standardisation:0 "Unified Factory Standards"
 A01_production_standardisation_desc:0 "Common blueprints, component dimensions and training standards will replace fragmented workshop practices. The factory workforce spirit will improve, increasing output, efficiency growth and maximum production efficiency."
 A01_public_recovery_fund:0 "Public Recovery Fund"
 A01_public_recovery_fund_desc:0 "Finance reconstruction domestically and remove the postwar budget burden. WTC loans require separate repayment. Costs 50 political power."
 A01_purge_civil_service:0 "Purge the Civil Service"
 A01_purge_civil_service_desc:0 "Replace civilian officials with military appointees. Political purges temporarily disrupt administration and construction."
 A01_purge_officer_corps:0 "Purge the Officer Corps"
 A01_purge_officer_corps_desc:0 "Require personal loyalty to the council. The removal of experienced officers temporarily reduces army and navy organisation."
 A01_purge_the_admiralty:0 "The Night of Sealed Admiralties"
 A01_purge_the_admiralty_desc:0 "The Guard will seize the ministry and arrest the Council. Two loyal captain groups can hold the harbours, but mass dismissals will disrupt the fleet for a year."
 A01_reconstruction_commission:0 "Audit Damage and Obligations"
 A01_reconstruction_commission_desc:0 "Audit reconstruction costs, family compensation and existing loans before choosing a funding route."
 A01_recovery_investment:0 "From Recovery to Development"
 A01_recovery_investment_desc:0 "After settling obligations, invest in development: one civilian factory in Java and 5% construction speed."
 A01_reform_procurement:0 "Break the Admirals’ Contracts"
 A01_reform_procurement_desc:0 "Open tenders replace family contracts. Pensions will be honoured, but the former Council loses its hold over procurement."
 A01_renew_the_fleet:0 "The Fleet after the Political Storm"
 A01_renew_the_fleet_desc:0 "Restore professional examinations, train staff officers and fill vacancies. Rehabilitate innocent officers without restoring the Council’s political privileges."
 A01_repair_ports:0 "Restore Ports and Workshops"
 A01_repair_ports_desc:0 "Remove the destruction penalties to construction and factory output. Restored communications reduce supply consumption by 5%. Costs 40 political power."
 A01_request_fortification_project:0 "Request a Project"
 A01_request_fortification_project_desc:0 "Choose one British, Australian or Indonesian community proposal. Its defence bonus begins upon implementation."
 A01_responsible_cabinet:0 "A Prime Minister Answerable to Parliament"
 A01_responsible_cabinet_desc:0 "The Queen appoints parliament’s chosen premier. Ministers become accountable for budgets and the opposition gains questioning rights. The winning party determines the cabinet programme."
 A01_review_borneo_convention:0 "Review the Borneo Convention"
 A01_review_borneo_convention_desc:0 "With government and fleet restored, Batavia can formulate demands to revise the humiliating convention. Recovering the lost territories will remain central to foreign policy."
 A01_royal_academies:0 "Royal Institutes of the Archipelago"
 A01_royal_academies_desc:0 "Found an engineering institute, civil service school and translation bureau with places for island residents."
 A01_royal_commission:0 "Royal Commission on the Defeat"
 A01_royal_commission_desc:0 "Who left the depots undefended, and why did admirals’ relatives receive contracts? A public inquiry can build a case before the Council destroys its archives."
 A01_royal_constitution:0 "The Constitution of Crown and Archipelago"
 A01_royal_constitution_desc:0 "After ending admiral political rule, the Crown adopts a constitution. Parliament will pass an electoral law and elect a prime minister."
 A01_royal_development_bank:0 "Royal Development Bank"
 A01_royal_development_bank_desc:0 "Joint loans fund roads and schools in Crown lands and autonomous sultanates, excluding Japanese possessions."
 A01_royal_dictatorship:0 "Full Royal Authority"
 A01_royal_dictatorship_desc:0 "With Guard and fleet support, the Queen subordinates the Council. Direct rule boosts construction and military output; military monarchy adds offensive bonuses and new factories."
 A01_royal_guard_corps:0 "Royal Guard Corps"
 A01_royal_guard_corps_desc:0 "Raise a Royal Guard division to support reform. The Guard enables forcible dissolution of the Council, at the cost of fleet disruption."
 A01_royal_island_charter:0 "A Charter for Crown and Islands"
 A01_royal_island_charter_desc:0 "A Charter for Crown and Islands. Establish the institutions and guarantees of this political settlement."
 A01_royal_naval_advisors:0 "Royal Naval Advisers"
 A01_royal_naval_advisors_desc:0 "Naval officers pledge loyalty to the Crown and develop common service standards."
 A01_royal_secret_police:0 "Crown Secret Police"
 A01_royal_secret_police_desc:0 "Establish a surveillance service. Resistance will be suppressed at the cost of public trust."
 A01_rubber_processing:0 "Rubber Processing"
 A01_rubber_processing_desc:0 "Exporting raw rubber leaves much of the profit overseas. Processing plants beside the Sumatran plantations will keep more value at home."
 A01_rural_labour_duty:0 "Compulsory Labour Service"
 A01_rural_labour_duty_desc:0 "The administration introduces labour registers and compulsory village quotas. Peasants are assigned to factory settlements: agrarian constraints ease, but stability falls by 5 percentage points. Second reform stage: 35 days."
 A01_secure_sea_lanes:0 "Secure the Sea Lanes"
 A01_secure_sea_lanes_desc:0 "Convoy routes will receive common escort procedures. Maritime escort coordination will improve fleet organisation, while trade gains additional transports."
 A01_settle_crown_crisis:0 "Establish the New Order"
 A01_settle_crown_crisis_desc:0 "The Council is defeated and the island compact signed. Consolidate the civilian navy ministry and decide whether victory belongs to the constitution or personal royal authority."
 A01_state_loan:0 "State Loan"
 A01_state_loan_desc:0 "Increase WTC debt by 20 points and reduce political power gain by 10%. Unlock domestic construction."
 A01_strengthen_ludolfs_power:0 "Strengthen Ludolf\u2019s Authority"
 A01_strengthen_ludolfs_power_desc:0 "Ludolf Sloot van de Beele will retain civilian control, supported by engineers, industrialists and pragmatic officials."
 A01_sultanates_language_guarantees:0 "Guarantees of Rights and Languages"
 A01_sultanates_language_guarantees_desc:0 "The sultanates receive domestic autonomy, judicial recognition of adat law, and formal preservation of native languages in exchange for absolute loyalty and joint external defense."
 A01_sultans_at_the_palace:0 "The Sultans at the Palace"
 A01_sultans_at_the_palace_desc:0 "The sultans will recognise a crown, not another governor with a new title. Their delegates demand answers about taxes, judges and garrisons."
 A01_sumatran_railways:0 "Sumatran Railways"
 A01_sumatran_railways_desc:0 "Difficult terrain separates Sumatra plantations from their ports. Railway construction will shorten the journey from warehouse to quay."
 A01_summon_grand_council:0 "The Grand Council’s Last Ultimatum"
 A01_summon_grand_council_desc:0 "The Council demands control of appointments and a veto over decrees. The Queen must concede, negotiate or rely on the Guard."
 A01_surabaya_arsenal:0 "The Surabaya Arsenal"
 A01_surabaya_arsenal_desc:0 "Surabaya will become a centre for arms repair and ammunition production. The army cannot depend on every transport arriving from Europe."
 A01_technical_college:0 "Batavia Technical Institute"
 A01_technical_college_desc:0 "Higher technical education will connect the shipyards and factories with engineer training. Gain a research slot and unlock the Batavian Engineering Council."
 A01_town_hall_crisis:0 "Storming the Admiralty Town Hall"
 A01_town_hall_crisis_desc:0 "Deprived of moderate officer support, the hardliners of the Admirals' Council barricade themselves inside the Admiralty Town Hall, attempting an armed coup. Loyal regiments surround the stronghold with artillery and suppress the junta in the spirit of the Moscow 1993 crisis."
 A01_wartime_industry:0 "Industrial Mobilisation"
 A01_wartime_industry_desc:0 "Urgent defence orders will replace peacetime contracts. Increased arms output will divert labour and materials from civilian needs."
 A01_wilhelmina_comes_of_age:0 "Wilhelmina Comes of Age"
 A01_wilhelmina_comes_of_age_desc:0 "End Emma's regency and transfer power to Wilhelmina. Normally this is possible from 31 August 1898. If Wilhelmina insisted on taking power during her conversation with Mother, accession may take place earlier."
 A01_win_the_captains:0 "Win Over the Captains"
 A01_win_the_captains_desc:0 "Guarantee pay, pensions and merit promotion to officers who accept civilian control. The fleet must choose between its profession and the Council."
 A01_wtc_oil_and_rubber_offer:0 "An Offer for the WTC"
 A01_wtc_oil_and_rubber_offer_desc:0 "Guaranteed oil and rubber exports will attract investment, finance a factory and establish formal contact with the World Trade Chamber."
 A01_wtc_recovery_agreement:0 "WTC Recovery Agreement"
 A01_wtc_recovery_agreement_desc:0 "The earlier oil and rubber offer unlocks reconstruction financing and debt settlement. Accept one year of commercial guarantees: −5% production efficiency cap."
 A01_wtc_settlement:0 "Settle Obligations through the WTC"
 A01_wtc_settlement_desc:0 "Settle WTC debt, reconstruction costs and family compensation. Remove financial and destruction penalties, including defence loan servicing, and clear all three account balances."
 A01_wtc_strengthening_path:0 "Strengthen the World Trade Chamber"
 A01_wtc_strengthening_path_desc:0 "Begin democratisation through trading councils and Madeira. Cable priority and insurance require new debt. This opening excludes Lone Wolf and British union."
 A10_capital_charters:0 "Manila and Bataan at the Common Table"
 A10_capital_charters_desc:0 "Manila harbour and the Bataan batteries must guard the whole archipelago. Separate charters shall prevent the capital from swallowing the voices of the other republics."
 A10_coastal_arsenals:0 "Coastal Arsenals"
 A10_coastal_arsenals_desc:0 "Island defence begins with a dry store, a working bolt and a gunsmith of our own. Coastal workshops will receive machine tools and a reserve of rifles for future garrisons."
 A10_confederation:0 "Compact of Free Republics"
 A10_confederation_desc:0 "The Visayas and Samar shall retain their assemblies and treasuries in return for a common congress, mutual defence and delegates to Cavite."
 A10_equal_citizenship:0 "Equal Citizenship"
 A10_equal_citizenship_desc:0 "A citizen of one province shall have equal rights in another. A common passport and equal access to public service will end distinctions of rank between islanders."
 A10_federal_reconstruction:0 "Rebuild the Island Harbours"
 A10_federal_reconstruction_desc:0 "Peace cannot reconnect islands whose harbours remain unusable. Common funds shall restore quays, quarantine stations and repair workshops."
 A10_federation:0 "Proclaim the Federation"
 A10_federation_desc:0 "Delegates adopt a federal constitution. The accession of each republic remains subject to a separate ratification; silence shall never count as consent."
 A10_gendarmerie:0 "A Federal Constabulary"
 A10_gendarmerie_desc:0 "A common statute shall prohibit collective punishment. The constabulary must protect roads and courts without replacing local councils."
 A10_island_congress:0 "The Cavite Congress"
 A10_island_congress_desc:0 "Manila has fallen, but island delegates still reach Cavite. The provisional congress must settle who commands the treasury, the ports and the republican detachments."
 A10_landing_plans:0 "Plans for Island Landings"
 A10_landing_plans_desc:0 "A landing begins with fresh water, a tide table and an unloading boat, rather than an order to advance. The army and fleet will rehearse limited operations, leaving the decision for war to the country's government."
 A10_local_administration:0 "Elected Provincial Councils"
 A10_local_administration_desc:0 "Federal officials shall work alongside elected councils. Schools and roads must remain close to the people who use them."
 A10_luzon_charter:0 "Charter of Northern Luzon"
 A10_luzon_charter_desc:0 "Liberation does not entitle Cavite to impose masters on the north. A local assembly shall receive a republican charter and a place among equal allies."
 A10_mindanao_compact:0 "The Two Mindanao Republics"
 A10_mindanao_compact_desc:0 "Northern and southern Mindanao will not surrender authority to a distant capital. Local legal guarantees and mutual defence can bring them to one table."
 A10_strike_japan:0 "Recover the Northern Harbours"
 A10_strike_japan_desc:0 "With imperial ships committed in the south, an opportunity opens to recover the Luzon harbours. The staff prepares crossings while the government accepts responsibility for war."
 A10_united_command:0 "The Republican Joint Staff"
 A10_united_command_desc:0 "Commanders may keep their banners, but crossings, depots and staff orders must be shared. Seniority disputes must not decide a battle."
 A10_visayan_compact:0 "Charters of Cebu and Panay"
 A10_visayan_compact_desc:0 "Cebu demands open shipping and Panay protection for its farmers. Separate charters shall bind these demands into republican obligations."
 JSM_council:0 "Imperial policy council"
 JSM_council_desc:0 "Opens protectorate negotiations. Offers cost 100 political power and take 30 days. Refusal grants a puppet war goal."
 JSM_north:0 "The northern treaty"
 JSM_north_desc:0 "Opens protectorate negotiations. Offers cost 100 political power and take 30 days. Refusal grants a puppet war goal."
 JSM_ocean:0 "Order in the southern seas"
 JSM_ocean_desc:0 "Opens protectorate negotiations. Offers cost 100 political power and take 30 days. Refusal grants a puppet war goal."
 JSM_shipyards:0 "Nagasaki shipyards"
 JSM_shipyards_desc:0 "105 days. Adds two dockyards in Nagasaki."
 JSM_south:0 "Embassy to the Philippines"
 JSM_south_desc:0 "Opens protectorate negotiations. Offers cost 100 political power and take 30 days. Refusal grants a puppet war goal."
 JSM_steel:0 "Steel for a new Japan"
 JSM_steel_desc:0 "140 days. Adds three civilian factories in the capital region."
 JSM_workshops:0 "Imperial workshops"
 JSM_workshops_desc:0 "140 days. Adds three military factories in Osaka."
