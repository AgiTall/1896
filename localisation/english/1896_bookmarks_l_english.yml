 MLT_CANON_START_DESC:0 "Malta has gained independence after the British court moved to Bermuda. The State Council governs from Valletta, relying on its harbour and maritime trade. The island must protect its independence among rival naval powers."
 AVC_CANON_START_DESC:0 "From Melbourne, William Shiels governs one of the most developed Australian colonies. Industry and a busy port give Victoria influence, but commercial rivalry divides its neighbours. The colony must strengthen its economy and find its place in Australia’s future."
 AQL_CANON_START_DESC:0 "Samuel Griffith’s government administers Queensland from Brisbane. Great distances separate its coastal settlements, while the north needs roads, ports and labour. British protection maintains maritime links, but the colony’s future rests on its own economy."
 ASA_CANON_START_DESC:0 "John Downer governs South Australia from Adelaide. The colony also administers the Northern Territory, whose upkeep burdens its treasury. Trade and better transport must connect distant settlements and strengthen its position among the neighbouring colonies."
 AWA_CANON_START_DESC:0 "John Forrest’s government rules Western Australia from Perth. Vast distances separate it from the eastern colonies, and new settlements need supplies and transport. Mining promises growth if the coast can be connected to the interior."
 ATA_CANON_START_DESC:0 "Henry Dobson leads Tasmania’s government in Hobart. The island colony depends on maritime trade, farming and links with the mainland. Limited funds demand careful spending, while debate over closer ties between the Australian colonies calls for a cautious choice."

