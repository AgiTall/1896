l_english:
 A01_accountable_civil_service:0 "Accountable Civil Service"
 A01_accountable_civil_service_desc:0 "Permanent civilian administration: political power gain +5%, army adviser cost −5%."
 A01_admiralty_obstruction:0 "Admiralty Obstruction"
 A01_admiralty_obstruction_desc:0 "Procurement stalls and captains receive conflicting orders. Resolve the struggle through trial, purge or agreement."
 A01_admiralty_pensions:0 "The Price of Admiralty Retirement"
 A01_admiralty_pensions_desc:0 "Retired admirals receive pensions and retain procurement connections until parliamentary reform."
 A01_agrarian_labour_transition:0 "Agrarian Society: Compulsory Labour"
 A01_agrarian_labour_transition_desc:0 "Compulsory quotas assign workers to factories. The economy still depends on the countryside, but the industrial labour shortage is easing."
 A01_agrarian_schooling:0 "Agrarian Society: The First Schools"
 A01_agrarian_schooling_desc:0 "Primary education lays the foundation for a transition from farming to factory labour. Agrarian constraints remain in force."
 A01_agrarian_society:0 "Agrarian Society"
 A01_agrarian_society_desc:0 "Most inhabitants work on small farms and plantations. Industrial labour, engineers and local contractors are scarce; machinery must be imported and the treasury depends on export income. Mass conscription would strip agriculture of its workforce. Building factories and training reserves demand time and money that Batavia can barely spare.\n\nThese penalties stack with civilian economy, oil dependency and racial divisions. They persist after a change of government."
 A01_archipelago_power:0 "Pacific Crown"
 A01_archipelago_power_desc:0 "Shared island defence is the state’s principal mission."
 A01_army_transition:0 "Army in Transition"
 A01_army_transition_desc:0 "Demobilisation and retraining temporarily reduce army organisation by 5%. Removed by joint officer schools."
 A01_borneo_australian_commitments:0 "New Guinea Guarantees"
 A01_borneo_australian_commitments_desc:0 "Australian opinion improves by 10 points. Our commitment prevents taking the focus to fortify the Australian frontier."
 A01_borneo_australian_defence:0 "Australian Defence Project"
 A01_borneo_australian_defence_desc:0 "Australian materials and specialists grant 10% defence against Japan until the campaign ends."
 A01_borneo_british_commitments:0 "British Engineering Mission"
 A01_borneo_british_commitments_desc:0 "British influence rises by 15 points and sovereignty loss by 10. Foreign supervision reduces political power gain by 10%.\nBritish influence: [?A01_british_influence|0]. Sovereignty loss: [?A01_sovereignty_loss|0]."
 A01_borneo_british_defence:0 "British Defence Project"
 A01_borneo_british_defence_desc:0 "Concrete positions grant 15% defence against Japan until the campaign ends."
 A01_borneo_debt_service:0 "Defence Debt Service"
 A01_borneo_debt_service_desc:0 "Loan repayments and contractor obligations continue after the war."
 A01_borneo_fortification_directorate:0 "Borneo Fortification Directorate"
 A01_borneo_fortification_directorate_desc:0 "Military engineers prepare port defences. Land and coastal fort construction speed increases by 15% for 180 days. The program grants no general army defence bonus."
 A01_borneo_humiliation:0 "The Borneo Humiliation"
 A01_borneo_humiliation_desc:0 "The loss of northern Borneo and Japanese concessions undermine confidence in Batavia."
 A01_borneo_local_commitments:0 "Indonesian Community Cooperation"
 A01_borneo_local_commitments_desc:0 "Gain 15% recruitable population factor. Racial tensions improve by 10 stability points, but admiral respect falls by 5 points."
 A01_borneo_local_defence:0 "Local Defence Network"
 A01_borneo_local_defence_desc:0 "Earthworks, obstacles and hidden paths grant 5% defence against Japan until the campaign ends."
 A01_borneo_self_build:0 "State Fortification Program"
 A01_borneo_self_build_desc:0 "Gain 20% defence against Japan. Construction and debt consume civilian and political resources. Defence expires after the campaign; debt commitments remain."
 A01_borneo_state_loan:0 "WTC Defence Loan"
 A01_borneo_state_loan_desc:0 "WTC debt increased by 20 points. Political power gain falls by 10%.\nCurrent debt: [?A01_wtc_debt|0] points."
 A01_chamber_democrats:0 "Democracy of Trading Councils"
 A01_chamber_democrats_desc:0 "Democratisation through the Chamber strengthens creditors’ influence."
 A01_civilian_justice:0 "Civilian Justice"
 A01_civilian_justice_desc:0 "Courts established individual responsibility without mass dismissals."
 A01_civilian_naval_compact:0 "Civilian-Naval Compact"
 A01_civilian_naval_compact_desc:0 "The Council recognises civilian leadership in exchange for an agreed naval programme."
 A01_civilian_navy_ministry:0 "Royal Navy Ministry"
 A01_civilian_navy_ministry_desc:0 "Operational command is separated from civilian budgeting. The admirals no longer hold a political veto."
 A01_civilian_reform_mandate:0 "Ludolf’s Civilian Mandate"
 A01_civilian_reform_mandate_desc:0 "A temporary civilian mandate grants 0.05 daily political power during reform. Replaced by accountable civil service."
 A01_coerced_service:0 "Coerced Recruitment"
 A01_coerced_service_desc:0 "Police measures recover some recruits, but distrust, organisational problems and instability persist."
 A01_colonial_administration:0 "Colonial Administration"
 A01_colonial_administration_desc:0 "Colonial Administration: a permanent programme coordinating training and government services."
 A01_constitutional_crown:0 "A Constitutional Crown"
 A01_constitutional_crown_desc:0 "A Constitutional Crown. Establish the institutions and guarantees of this political settlement."
 A01_crown_commonwealth_idea:0 "Royal Commonwealth"
 A01_crown_commonwealth_idea_desc:0 "Royal Commonwealth."
 A01_crown_dialogue:0 "Crown Dialogue"
 A01_crown_dialogue_desc:0 "Crown Dialogue."
 A01_crown_parliament_idea:0 "Crown Parliament"
 A01_crown_parliament_idea_desc:0 "Crown Parliament."
 A01_crown_resolve:0 "The Crown Has the Final Word"
 A01_crown_resolve_desc:0 "The Crown Has the Final Word."
 A01_crown_secret_police:0 "Crown Secret Police"
 A01_crown_secret_police_desc:0 "Crown Secret Police."
 A01_demands_for_freedom:0 "Demands for Freedom"
 A01_demands_for_freedom_desc:0 "Demands for Freedom. Establish the institutions and guarantees of this political settlement."
 A01_democratic_federation_idea:0 "Citizenship and Elected Councils"
 A01_democratic_federation_idea_desc:0 "Citizenship and Elected Councils. Establish the institutions and guarantees of this political settlement."
 A01_development_bank:0 "Archipelago Development Bank"
 A01_development_bank_desc:0 "Shared credit funds roads, schools and local enterprises."
 A01_direct_royal_rule:0 "Direct Crown Rule"
 A01_direct_royal_rule_desc:0 "Direct Crown Rule."
 A01_dutch_primary_schooling:0 "Compulsory Dutch Schooling"
 A01_dutch_primary_schooling_desc:0 "Reading, arithmetic and Dutch form the basis of industrial workforce training."
 A01_emmas_caution:0 "The Regent's Caution"
 A01_emmas_caution_desc:0 "The Regent's Caution."
 A01_equal_citizenship_royal:0 "Common Citizenship"
 A01_equal_citizenship_royal_desc:0 "Dutch and Indonesian citizens share access to public service and military commissions."
 A01_escort_coordination:0 "Maritime Escort Coordination"
 A01_escort_coordination_desc:0 "Common routes and coordination procedures improve fleet organisation."
 A01_european_overture:0 "European Democratic Idea"
 A01_european_overture_desc:0 "An opening programme for union with Britain; negotiations still lie ahead."
 A01_exile_mission:0 "Mission of the Exiled Kingdom"
 A01_exile_mission_desc:0 "Refugees preserve the lost homeland’s institutions while shipyards prepare the fleet of return."
 A01_factory_workforce:0 "Trained Factory Workforce"
 A01_factory_workforce_desc:0 "Primary school graduates and resettled rural families provide a permanent industrial workforce. The agrarian national spirit has been removed."
 A01_federal_constitution_idea:0 "Federal Constitution"
 A01_federal_constitution_idea_desc:0 "Equal rights and parliamentary accountability are constitutional guarantees: stability +5%, daily political power +0.05."
 A01_federal_defence_command_idea:0 "Federal Defence Command"
 A01_federal_defence_command_idea_desc:0 "Joint army, naval and garrison staff: supply consumption −5%, naval organisation +5%."
 A01_federal_transition:0 "A Federal Mandate"
 A01_federal_transition_desc:0 "A Federal Mandate. Establish the institutions and guarantees of this political settlement."
 A01_guard_academy_idea:0 "Royal Guard School"
 A01_guard_academy_idea_desc:0 "A joint officer school trains Dutch and Indonesian cadets."
 A01_indonesian_refusal:0 "Widespread Refusal to Serve"
 A01_indonesian_refusal_desc:0 "Recruitment and unit cohesion suffer while the government debates its response."
 A01_indonesian_volunteers:0 "Indonesian Volunteers"
 A01_indonesian_volunteers_desc:0 "Three temporary militia divisions defend the islands. They disband when the war with Japan ends."
 A01_industrial_power_grid:0 "Industrial Power Grid"
 A01_industrial_power_grid_desc:0 "Coordinated development of steam power stations and factory districts accelerates new construction."
 A01_island_charter:0 "The Island Charter"
 A01_island_charter_desc:0 "The Island Charter. Establish the institutions and guarantees of this political settlement."
 A01_island_commissions:0 "Joint Officer Corps"
 A01_island_commissions_desc:0 "Training, rather than ancestry, determines access to command."
 A01_island_defence:0 "Archipelago Defence"
 A01_island_defence_desc:0 "Archipelago Defence: a permanent programme coordinating training and government services."
 A01_island_discontent:0 "The Islands Await an Answer"
 A01_island_discontent_desc:0 "The petition was postponed. Common citizenship or representation can settle the grievance."
 A01_island_representation_idea:0 "Island Representation"
 A01_island_representation_idea_desc:0 "Island delegations participate in federal preparations: stability +3%. Upon federation, representation becomes a permanent institution."
 A01_joint_officer_corps:0 "Joint Officer Corps"
 A01_joint_officer_corps_desc:0 "Equal access to officer careers strengthens the professional army: organisation +5%, training time −5%."
 A01_knil_field_training:0 "KNIL: Island Garrisons"
 A01_knil_field_training_desc:0 "The KNIL is the regular Royal Netherlands East Indies Army. Common training strengthens the organisation and defence of its island garrisons."
 A01_knil_professional:0 "KNIL: Trained Command Cadres"
 A01_knil_professional_desc:0 "Local NCOs improve the command structure of the KNIL, the regular colonial land army."
 A01_knil_reformed:0 "KNIL: Field Reforms"
 A01_knil_reformed_desc:0 "Field manuals and unified supply improve organisation, accelerate training and reduce supply consumption."
 A01_knil_training:0 "KNIL Training"
 A01_knil_training_desc:0 "The KNIL is the Royal Netherlands East Indies Army: the regular land forces of the archipelago. It is distinct from the temporary Indonesian volunteer militia."
 A01_local_armaments:0 "Island Armaments Contracts"
 A01_local_armaments_desc:0 "Local contracts and common armament standards strengthen weapons production."
 A01_marine_training:0 "Marine Brigade Training"
 A01_marine_training_desc:0 "Common training programmes expand capacity for specialised formations."
 A01_military_directorate:0 "The Admirals Directorate"
 A01_military_directorate_desc:0 "The Admirals Directorate. Establish the institutions and guarantees of this political settlement."
 A01_naval_staff:0 "Admiralty Staff"
 A01_naval_staff_desc:0 "Admiralty Staff: a permanent programme coordinating training and government services."
 A01_open_procurement:0 "Open Public Procurement"
 A01_open_procurement_desc:0 "Public oversight curbs family procurement contracts."
 A01_open_seas_idea:0 "Crown of the Trading Seas"
 A01_open_seas_idea_desc:0 "Trade, civilian construction and negotiated partnership define the kingdom."
 A01_pm_constitutional:0 "Matthijs van Rijn — Constitutional Union"
 A01_pm_constitutional_desc:0 "A cabinet of trading cities and lawyers: transparent budgets, engineering schools and public service."
 A01_pm_indonesian:0 "Raden Surya — Indonesian Coalition"
 A01_pm_indonesian_desc:0 "Island civic delegates prioritise schools, equal appointments and inland development."
 A01_pm_order:0 "Hendrik van der Velde — Order Party"
 A01_pm_order_desc:0 "Moderate monarchists and princely delegates favour local guarantees and maritime security."
 A01_postwar_budget_burden:0 "Postwar Recovery Costs"
 A01_postwar_budget_burden_desc:0 "Reconstruction and social obligations require 5% more consumer goods factories and 0.10 daily political power. Removed by the public fund or WTC settlement."
 A01_postwar_destruction:0 "Damaged Ports and Workshops"
 A01_postwar_destruction_desc:0 "Reconstruction liabilities: [?A01_reconstruction_costs|0] points. Removed by port repairs or WTC financing."
 A01_princely_compact:0 "Compact with the Princely Courts"
 A01_princely_compact_desc:0 "The Crown guarantees local law and succession; the courts recognise common justice."
 A01_provincial_diets:0 "Provincial Diets"
 A01_provincial_diets_desc:0 "Civic delegates scrutinise officials while the Crown retains its cabinet."
 A01_purged_administration:0 "Purged Administration"
 A01_purged_administration_desc:0 "Purged Administration. Establish the institutions and guarantees of this political settlement."
 A01_purged_fleet:0 "The Purged Fleet"
 A01_purged_fleet_desc:0 "Dismissals leave staff vacancies. Recovery takes a year or the fleet renewal focus."
 A01_purged_officers:0 "Officer Purges"
 A01_purged_officers_desc:0 "Officer Purges. Establish the institutions and guarantees of this political settlement."
 A01_reconstruction_cabinet:0 "Reconstruction Cabinet"
 A01_reconstruction_cabinet_desc:0 "The new cabinet coordinates port reconstruction and relations with autonomous rulers."
 A01_recovery_investment_idea:0 "Post-Recovery Investment"
 A01_recovery_investment_idea_desc:0 "Settled obligations release funds for development: construction speed +5%."
 A01_responsible_cabinet_idea:0 "Responsible Cabinet"
 A01_responsible_cabinet_idea_desc:0 "The Queen appoints the parliamentary majority’s premier. Deputies approve the budget."
 A01_restored_port_network:0 "Restored Port Network"
 A01_restored_port_network_desc:0 "Repaired harbours and warehouses reduce supply consumption by 5%."
 A01_revanchism_organised:0 "National Reconstruction Programme"
 A01_revanchism_organised_desc:0 "Revanchist sentiment is channelled into rebuilding the fleet and defence industry."
 A01_revanchism_simmering:0 "Simmering Revanchism"
 A01_revanchism_simmering_desc:0 "The public demands the lost territories back, but there is no common reconstruction programme."
 A01_royal_absolutism:0 "Royal Absolutism"
 A01_royal_absolutism_desc:0 "Royal Absolutism."
 A01_royal_academies_idea:0 "Royal Institutes"
 A01_royal_academies_idea_desc:0 "Engineers, translators and civil servants train in the archipelago."
 A01_royal_arbitration:0 "Emmas Regency"
 A01_royal_arbitration_desc:0 "Emmas Regency. Establish the institutions and guarantees of this political settlement."
 A01_royal_guard_loyalty:0 "Royal Guard"
 A01_royal_guard_loyalty_desc:0 "Royal Guard."
 A01_royal_militarism:0 "Military Monarchy"
 A01_royal_militarism_desc:0 "Military Monarchy."
 A01_royal_naval_loyalty:0 "Navy in Crown Service"
 A01_royal_naval_loyalty_desc:0 "Navy in Crown Service."
 A01_service_compromise:0 "Colonial Service Compact"
 A01_service_compromise_desc:0 "Pay and family guarantees reduce refusal without removing its deeper causes."
 A01_standardised_industry:0 "Unified Industrial Standards"
 A01_standardised_industry_desc:0 "Common blueprints and training standards help factories learn production faster and use machinery more efficiently."
 A01_sultanate_federation:0 "The Sultanate Compact"
 A01_sultanate_federation_desc:0 "Autonomous administrations retain a common defence compact with Batavia."
 A01_sultans_council_stability:0 "Council of Sultans"
 A01_sultans_council_stability_desc:0 "A temporary agreement with local rulers has eased tensions and restored order in the colonies."
 A01_total_military_state:0 "All Power to the Military Elite"
 A01_total_military_state_desc:0 "All Power to the Military Elite. Establish the institutions and guarantees of this political settlement."
 A01_unpaid_families:0 "Unpaid Family Compensation"
 A01_unpaid_families_desc:0 "Family compensation liabilities: [?A01_family_compensation_costs|0] points. Removed by pensions or WTC financing."
 A01_war_production:0 "Defence Orders"
 A01_war_production_desc:0 "Defence orders increase factory output at the cost of additional consumer goods requirements. The program begins before the war with Japan, continues during it and ends when peace returns."
 A01_wilhelmina:0 "Queen Wilhelmina"
 A01_wilhelmina_desc:0 "Queen Wilhelmina remains a living symbol of the unity of the Dutch Crown and inspires her subjects to defend the state."
 A01_wtc_concessions:0 "Dependence on the WTC"
 A01_wtc_concessions_desc:0 "The Chamber demands a share of the revenues and interferes in cabinet decisions. Audit contracts to reduce its influence below 50."
 A01_wtc_credit:0 "WTC Reconstruction Credit"
 A01_wtc_credit_desc:0 "Financing accelerates the construction of civilian industry."
 A01_wtc_recovery_guarantees:0 "WTC Commercial Guarantees"
 A01_wtc_recovery_guarantees_desc:0 "Commercial guarantees to the WTC reduce the production efficiency cap by 5% for 365 days, then expire automatically."
 A01_young_queens_resolve:0 "The Young Queen's Resolve"
 A01_young_queens_resolve_desc:0 "The Young Queen's Resolve."
 A03_army_reform:0 "Army Reform"
 A03_army_reform_desc:0 "Army Reform: a permanent programme coordinating training and government services."
 A03_civil_government:0 "Civil Cabinet"
 A03_civil_government_desc:0 "Civilian ministers seek strength through sound finances and commerce. The military will retain influence without directing every government order."
 A03_commercial_network:0 "Pacific Trading Network"
 A03_commercial_network_desc:0 "Pacific Trading Network: a permanent programme coordinating training and government services."
 A03_expeditionary_staff:0 "Expeditionary Staff"
 A03_expeditionary_staff_desc:0 "An overseas operation begins with cargo lists and routes. Expeditionary staff will coordinate transport, landings and troop supply."
 A03_industrial_contracts:0 "Industrial Contracts"
 A03_industrial_contracts_desc:0 "Industrial Contracts: a permanent programme coordinating training and government services."
 A03_island_supply:0 "Island Convoys"
 A03_island_supply_desc:0 "Distant garrisons require scheduled sailings and reserve depots. A permanent island convoy service will coordinate their supply."
 A03_landing_force:0 "Imperial Landing Forces"
 A03_landing_force_desc:0 "Imperial Landing Forces: a permanent programme coordinating training and government services."
 A03_naval_academy:0 "Naval Academy"
 A03_naval_academy_desc:0 "Officers need common instruction in navigation, gunnery and formation command. The academy will establish consistent training standards."
 A03_naval_government:0 "Naval Cabinet"
 A03_naval_government_desc:0 "The naval ministry will lead the cabinet. Securing the straits and supplying overseas bases will become central state priorities."
 A03_resource_commission:0 "Imperial Resource Commission"
 A03_resource_commission_desc:0 "Industry needs reliable accounts of stocks and deliveries. A resource commission will match factory demand with merchant shipping capacity."
 A03_southern_blitz:0 "Swift Southern Campaign"
 A03_southern_blitz_desc:0 "For 180 days: stronger shore bombardment, increased attack and naval range, faster invasion preparation and landings, and additional invasion capacity."
 A10_common_army:0 "Common Army of the Islands"
 A10_federal_administration:0 "Federal Administration"
 A10_separatism:0 "Island Separatism"
 A10_separatism_desc:0 "Local councils fear that a common government will repeat the practices of earlier conquerors. Cavite’s seal has yet to earn island trust."
 JPA_borneo_escorts:0 "Main Forces off Borneo"
 JPA_borneo_escorts_desc:0 "The fleet retains readiness at the cost of harder service on Luzon."
 JPA_forced_guarantees:0 "Guarantees Dictated by Osaka"
 JPA_forced_guarantees_desc:0 "The cabinet missed the ultimatum deadline. Completing State Guarantees removes the imposed terms."
 JPA_hasty_orders:0 "Last-minute Orders"
 JPA_hasty_orders_desc:0 "The ultimatum went out without an agreed fleet plan."
 JPA_manila_escorts:0 "Manila Receives the Escorts"
 JPA_manila_escorts_desc:0 "Manila’s burden falls while the Borneo squadron operates with fewer ships."
 JPA_unwritten_neutrality:0 "Unilateral Northern Neutrality"
 JPA_unwritten_neutrality_desc:0 "Saigo set the terms himself. Complete the Northern Protocol to negotiate a settlement."
 JPC_bad_loans:0 "Philippine Promissory Notes"
 JPC_bad_loans_desc:0 "Mitsubishi financed Manila. Occupation revenue cannot cover its garrisons; new ships are built on credit."
 JPC_credit:0 "WTC Secured Credit"
 JPC_credit_desc:0 "The Chamber finances shipping and collects debt service. The loan can be repaid after the war."
 JPC_exhaustion:0 "The Price of a Long War"
 JPC_exhaustion_desc:0 "The promised short expedition has become a succession of convoys, hospitals and loans."
 JPC_guarantees:0 "Oil We Do Not Yet Own"
 JPC_guarantees_desc:0 "Iwasaki supplies the fleet against a state guarantee of a Borneo oil monopoly. Bankruptcy is postponed, not repaid."
 JPC_joint_staff:0 "Ito’s Temporary Staff"
 JPC_joint_staff_desc:0 "Army officers and admirals agree on supply priorities: a practical compromise between rival factions."
 JPC_luzon:0 "Manila Is Not Luzon"
 JPC_luzon_desc:0 "The port is occupied; the mountains are not subdued. Occupation consumes men and supplies."
 JPC_monopoly:0 "Mitsubishi’s Borneo Monopoly"
 JPC_monopoly_desc:0 "The February 1893 promise is honoured. Extraction grows, but oil revenues first service corporate debt."
 JPC_neutral_ports:0 "Neutral Coaling Stations"
 JPC_neutral_ports_desc:0 "Hawaii permits commercial services. The agreement grants neither bases nor a right to drag the kingdom into war."
 JPC_north_neutral:0 "Hokkaido Neutrality"
 JPC_north_neutral_desc:0 "Saigo receives supplies from Honshu and stays out of the southern war. Tokyo cannot count on his soldiers."
 JPC_pacific_watch:0 "Pacific Alarm"
 JPC_pacific_watch_desc:0 "Japanese expansion prompts coastal preparations and a review of supply routes."
 JPC_paper_victory:0 "Pyrrhic Victory"
 JPC_paper_victory_desc:0 "Northern Borneo is gained. The treasury has new debts and families have casualty notices. Saigo and Iwasaki will present their claims again."
 JPC_recovery:0 "Demobilisation in Stages"
 JPC_recovery_desc:0 "Island garrisons remain, but part of the wartime expenditure can finally be reduced."
 JPC_returned_split:0 "The Split Returns"
 JPC_returned_split_desc:0 "The external enemy no longer binds the council. The north demands freedom, Osaka payment, and the fleet new ships."
 JPC_three_heads:0 "Three Heads of One Empire"
 JPC_three_heads_desc:0 "Meiji signs the orders; Ito, Saigo and Iwasaki each command a different part of the empire."
 JPC_two_fronts:0 "Two Seas, One Fleet"
 JPC_two_fronts_desc:0 "Ito divides his ships between Manila and Borneo. Success in one sea does not release the fleet from the other."
 JPD_industrial_economy:0 "A Developed Industrial Economy"
 JPD_industrial_economy_desc:0 "Local engineering and sustainable finance support production and research."
 JPD_oceanic_service:0 "Oceanic Fleet Service"
 JPD_oceanic_service_desc:0 "Coordinated fleet procedures sustain operations far from home."
 JPD_permanent_staff:0 "Permanent Joint General Staff"
 JPD_permanent_staff_desc:0 "The army and navy coordinate through permanent joint command."
 JPD_professional_supply:0 "Professional Supply Service"
 JPD_professional_supply_desc:0 "Permanent quartermasters and delivery procedures strengthen the army."
 JPD_settled_government:0 "A Settled Imperial Government"
 JPD_settled_government_desc:0 "The court and ministries have defined powers; emergency factional rivalry has ended."
 JPD_standardized_industry:0 "Standardized Production"
 JPD_standardized_industry_desc:0 "Common factory and dockyard standards improve production."
 JPD_sustainable_finance:0 "Sustainable Public Finance"
 JPD_sustainable_finance_desc:0 "With the wartime ledger settled, the treasury can plan continuing expenditure."
 JPF_budget_mistrust:0 "Depositors’ Mistrust"
 JPF_budget_mistrust_desc:0 "Confidence below 30 weakens the cabinet’s promises."
 JPF_cash_freeze:0 "Cash Freeze"
 JPF_cash_freeze_desc:0 "Credit promises cannot meet immediate invoices."
 JPF_civilian_retrenchment:0 "Civilian Retrenchment"
 JPF_civilian_retrenchment_desc:0 "The treasury postpones civilian projects to release funds."
 JPF_coal_contracts:0 "Coal for Active Squadrons"
 JPF_coal_contracts_desc:0 "Coal deliveries are reserved for active operations."
 JPF_debt_distress:0 "Unfunded Invoices"
 JPF_debt_distress_desc:0 "Pressure at 75: suppliers slow deliveries."
 JPF_delivery_arrears:0 "Dockworkers’ Arrears"
 JPF_delivery_arrears_desc:0 "Unpaid wages disrupt delivery schedules."
 JPF_excise_collection:0 "Emergency Excise"
 JPF_excise_collection_desc:0 "Urban consumers bear the cost of repayments."
 JPF_families_arrears:0 "Families’ Arrears"
 JPF_families_arrears_desc:0 "Fleet invoices took precedence over sailors’ families."
 JPF_treasury_ledger:0 "Emergency Treasury Ledger"
 JPF_treasury_ledger_desc:0 "Debt pressure and confidence determine monthly service and available measures."
 JPF_verified_accounts:0 "Audited Accounts"
 JPF_verified_accounts_desc:0 "Reformed accounts and confidence at 65 restore predictable orders."
 JPF_yard_retrenchment:0 "Deferred Yard Orders"
 JPF_yard_retrenchment_desc:0 "Savings today mean fewer completed ships tomorrow."
 JPI_airship_service:0 "Sky Shipyards"
 JPI_airship_service_desc:0 "Serial hangars reduce airship cost by 15%, diverting capacity from the surface fleet."
 JPI_coal_bunkers:0 "Kyushu Coal Programme"
 JPI_coal_bunkers_desc:0 "Steamships and new yards depend on a coal network whose maintenance requires additional naval supplies."
 JPI_exposed_orders:0 "Exposed Procurement"
 JPI_exposed_orders_desc:0 "The enemy knows some of our preparations. The squadron must change its plans and communications."
 JPI_heavy_yards:0 "Kure Slipways"
 JPI_heavy_yards_desc:0 "Shipbuilding receives our best specialists; aircraft production cost rises by 10%."
 JPI_oil_shortage:0 "Oil Industry Retooling"
 JPI_oil_shortage_desc:0 "For 180 days, specialists are diverted from current output to future oil refining. Coal remains the fleet’s principal fuel."
 JPI_portable_towers:0 "Tested Coastal Stations"
 JPI_portable_towers_desc:0 "The Japanese portable prototype has passed coastal trials. Its electrical field shields the first beachhead from the Song."
 JPI_rough_industry:0 "Independent Workshops"
 JPI_rough_industry_desc:0 "Domestic factories grow quickly, but uneven machinery limits efficiency."
 JPI_scarlet_iron_coal:0 "Iron Scarlet Sails"
 JPI_scarlet_iron_coal_desc:0 "Heavy scarlet ships cover the landing: reinforced hulls, powerful guns and grappling tentacles. The Kyushu coal network provides endurance and organised supply."
 JPI_scarlet_iron_copies:0 "Iron Scarlet Sails"
 JPI_scarlet_iron_copies_desc:0 "Heavy scarlet ships cover the landing: reinforced hulls, powerful guns and grappling tentacles. Domestic designs improve equipment reliability; the source of these solutions remains unacknowledged."
 JPI_scarlet_iron_machines:0 "Iron Scarlet Sails"
 JPI_scarlet_iron_machines_desc:0 "Heavy scarlet ships cover the landing: reinforced hulls, powerful guns and grappling tentacles. Purchased machinery increases output, but the Chamber knows our procurement lists."
 JPI_scarlet_iron_oil:0 "Iron Scarlet Sails"
 JPI_scarlet_iron_oil_desc:0 "Heavy scarlet ships cover the landing: reinforced hulls, powerful guns and grappling tentacles. Investment in the future gives oil refining a permanent research priority."
 JPI_scarlet_sky_coal:0 "Scarlet Skies"
 JPI_scarlet_sky_coal_desc:0 "Long-range reconnaissance airships guide the landing; the surface fleet has surrendered part of its industrial base. The Kyushu coal network provides endurance and organised supply."
 JPI_scarlet_sky_copies:0 "Scarlet Skies"
 JPI_scarlet_sky_copies_desc:0 "Long-range reconnaissance airships guide the landing; the surface fleet has surrendered part of its industrial base. Domestic designs improve equipment reliability; the source of these solutions remains unacknowledged."
 JPI_scarlet_sky_machines:0 "Scarlet Skies"
 JPI_scarlet_sky_machines_desc:0 "Long-range reconnaissance airships guide the landing; the surface fleet has surrendered part of its industrial base. Purchased machinery increases output, but the Chamber knows our procurement lists."
 JPI_scarlet_sky_oil:0 "Scarlet Skies"
 JPI_scarlet_sky_oil_desc:0 "Long-range reconnaissance airships guide the landing; the surface fleet has surrendered part of its industrial base. Investment in the future gives oil refining a permanent research priority."
 JPI_selective_imports:0 "Trade on Japanese Terms"
 JPI_selective_imports_desc:0 "Foreign knowledge speeds research. Import dependence raises supply costs and resource shortage penalties; the Chamber sees our orders."
 JPI_shipboard_power:0 "Shipboard Electrical Network"
 JPI_shipboard_power_desc:0 "Generators reduce naval supply consumption by 8% and speed naval invasion preparation by 10%."
 JPI_workshop_network:0 "Fleet Workshop Network"
 JPI_workshop_network_desc:0 "Distributed workshops improve dockyard construction speed by 5%. Development was funded through additional debt obligations."
 JPL_accountable_occupation:0 "Accountable Manila Administration"
 JPL_accountable_occupation_desc:0 "Purchases and wages face scrutiny; Luzon’s mountains remain unconquered."
 JPL_escorts_diverted:0 "Escorts off Manila"
 JPL_escorts_diverted_desc:0 "Philippine escort duties reduce readiness for Borneo."
 JPL_exhausted_rotations:0 "Exhausted Garrison"
 JPL_exhausted_rotations_desc:0 "Fatigue at 85: tropical service has become indefinite."
 JPL_garrison_emergency:0 "Manila Supply Emergency"
 JPL_garrison_emergency_desc:0 "Burden at 70: Manila consumes southern campaign resources."
 JPL_hospital_service:0 "Hospital Service"
 JPL_hospital_service_desc:0 "Medical evacuation restores men at a civilian cost."
 JPL_limited_garrison:0 "Limited Manila Garrison"
 JPL_limited_garrison_desc:0 "Burden below 40. Occupation still needs supplies."
 JPL_overloaded_garrison:0 "Overloaded Garrison"
 JPL_overloaded_garrison_desc:0 "Burden at 40: the port cannot meet army demand."
 JPL_perimeter_order:0 "Shortened Perimeter"
 JPL_perimeter_order_desc:0 "Fewer supply routes bring isolation and fatigue."
 JPL_repair_network:0 "Frontline Repair Network"
 JPL_repair_network_desc:0 "Forward repairs reduce army supply consumption by 5%."
 JPL_worn_rotations:0 "Worn Rotations"
 JPL_worn_rotations_desc:0 "Fatigue at 60 slows unit recovery."
 JPN_north_broken_protocol:0 "Broken Protocol"
 JPN_north_broken_protocol_desc:0 "Deliveries and arbitration must restore a working relationship."
 JPN_north_civilian_charters:0 "Northern Civilian Charters"
 JPN_north_civilian_charters_desc:0 "Civilian charters relieve naval routes at extra cost."
 JPN_north_closed_warehouses:0 "Closed Northern Warehouses"
 JPN_north_closed_warehouses_desc:0 "Trust below 35: Saigo restricts Tokyo’s officials."
 JPN_north_fleet_appropriation:0 "Admiralty Appropriation"
 JPN_north_fleet_appropriation_desc:0 "New funds reconcile Ito to northern expenditure."
 JPN_north_fleet_grievance:0 "Admiralty Grievances"
 JPN_north_fleet_grievance_desc:0 "Resentment at 60: Ito believes the fleet is paying for northern privilege."
 JPN_north_limited_compact:0 "Limited Northern Compact"
 JPN_north_limited_compact_desc:0 "Permanent civilian obligations replace emergency talks. Military neutrality remains."
 JPN_north_obligation:0 "The Price of Northern Neutrality"
 JPN_north_obligation_desc:0 "Hokkaido receives supplies without sending divisions to Borneo."
 JPN_north_unfinished_peace:0 "Unfinished Northern Peace"
 JPN_north_unfinished_peace_desc:0 "Borneo no longer excuses postponement. The North demands an answer."
 JPT_arctic_crisis:0 "Greenland Diplomatic Crisis"
 JPT_arctic_crisis_desc:0 "Saigo’s expedition has prompted Danish, British and Russian protests. An Arctic dispute threatens to widen the Pacific war."
 JPT_iwasaki_dependence:0 "Treasury Dependent on Iwasaki"
 JPT_iwasaki_dependence_desc:0 "Saving Mitsubishi and the Golden Mean Party has made the treasury dependent on the conglomerate."
 JPT_mitsubishi_collapse:0 "Mitsubishi Collapse"
 JPT_mitsubishi_collapse_desc:0 "Overdue bills have frozen military supplies. Reform borrowing and complete emergency restructuring."
 JPT_northern_front:0 "The North Is a Front Again"
 JPT_northern_front_desc:0 "Civil war consumes supplies and money intended for the Southern Push. The penalty ends after Hokkaido is subdued."
 JPT_osaka_distrust:0 "Distrust of Osaka Merchants"
 JPT_osaka_distrust_desc:0 "The treasury controls the debts, but merchant houses cut investment and military orders."
 JPX_kami_mandate:0 "The Future Kami Council"
 JPX_kami_mandate_desc:0 "Priests offer to unite the country around a living deity. Their circle is not yet a Kami Council, but supporting shrines already costs money. Meiji’s personal rule and priestly rule in his name are different futures."
 JPX_land_mandate:0 "Sermon of Return"
 JPX_land_mandate_desc:0 "Saigo needs a road to Honshu opened by preaching rather than bayonets. Officers, peasants and priests rally around a return to the continent. The fleet sees a challenge to its budget."
 JPX_sea_mandate:0 "Throne and Admiralty Pact"
 JPX_sea_mandate_desc:0 "Ito offers an agreement, not a coup: the Emperor keeps his throne while the Admiralty sets the southern course. Creditors still expect payment; northern officers remember whose interests were sacrificed."
 JPX_throne_mandate:0 "Meiji’s Personal Mandate"
 JPX_throne_mandate_desc:0 "Meiji demands direct reports that bypass the three factions. This is a first step towards personal rule, not priestly government. Ministries resist scrutiny; a guard and loyal bureaucracy still have to be built."
 JPX_trade_mandate:0 "Osaka’s Political Credit"
 JPX_trade_mandate_desc:0 "Iwasaki seeks a mandate to pursue agreement rather than victory. Directors promise revived trade; officers see a willingness to surrender. There is no truce yet: its price must first be calculated."
 PZ_aztec_prophecy:0 "The Fifth Sun"
 PZ_aztec_prophecy_desc:0 "Generalissimo Hernandez relies on the Prophet of the Fifth Sun. Military power and religious prophecy unite the Mexican exiles."
 PZ_british_admiralty:0 "Crown and Admiralty"
 PZ_british_admiralty_desc:0 "Victoria retains the crown, but Admiral John Fisher holds effective power. Bermuda shelters exiled monarchs and directs the struggle over sea routes."
 PZ_philippine_confederation:0 "A Confederation in Formation"
 PZ_philippine_confederation_desc:0 "The government in exile seeks to unite the islands against Japan. Cebu and Panay retain their governments; Sulu distrusts the centre."
 PZ_russian_dual_power:0 "Emperor and Pobedonostsev"
 PZ_russian_dual_power_desc:0 "Alexander III rules the empire in exile. Konstantin Pobedonostsev opposes modernisation and condemns Tesla. Their conflict remains unresolved."
 WTC_blacklist:0 "The Chamber’s Blacklist"
 WTC_blacklist_desc:0 "Above 90 debt, British cover allows the Chamber to deny trading contracts."
 WTC_british_dependence:0 "Madeira’s British Shield"
 WTC_british_dependence_desc:0 "The Chamber has no regular army. The Straits Guards are mercenaries; Britain supplies naval reach and intelligence."
 WTC_cable_blackout:0 "Cable Exclusion"
 WTC_cable_blackout_desc:0 "The Chamber delays the debtor’s commercial and diplomatic messages."
 WTC_cable_contract:0 "Madeira Cables"
 WTC_cable_contract_desc:0 "Priority telegraph access under a Chamber contract. The creditor retains the cable."
 WTC_local_receivership:0 "Local Receivership"
 WTC_local_receivership_desc:0 "At 100 debt, creditors replaced the cabinet. Local administrators retain territorial government and collect payments for the Chamber."
 WTC_pirate_channels:0 "Secret Pilotage Treaties"
 WTC_pirate_channels_desc:0 "Pirates are paid for safe corridors. Secret Department patronage carries a reputational cost."
 WTC_port_concession:0 "Chamber Port Concession"
 WTC_port_concession_desc:0 "The Chamber receives fees, not sovereignty. Debt falls by an additional point each month the concession remains active."
 WTC_silver_convoy:0 "Silver Convoy"
 WTC_silver_convoy_desc:0 "Insurance is available only through the Chamber. Subscription funds emergency services while binding shipowners to one insurer."
 WTC_technocratic_credit:0 "Chamber Laboratory Contracts"
 WTC_technocratic_credit_desc:0 "Young technocrats fund instruments and communications in exchange for access to research."
 WTC_unprotected_routes:0 "An Insurer Without Escorts"
 WTC_unprotected_routes_desc:0 "British cover is lost. Blacklists and debt coups fail, while cable pressure remains."
 pacific_trade_accord_idea:0 "Batavia Trade Convention"
 pacific_trade_accord_idea_desc:0 "Batavia Trade Convention: a permanent programme coordinating training and government services."
