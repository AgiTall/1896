l_english:
 A01_accept_naval_appointments:0 "Accept Council Appointments"
 A01_accept_naval_appointments_desc:0 "Admirals gain administrative posts. Respect +20; balance shifts 15% toward the Council."
 A01_admiralty_deadline:0 "The Council Delays the Inquiry"
 A01_admiralty_deadline_desc:0 "Resolve the trial, purge or retirement within 180 days. A missed deadline forces another concession without closing the route."
 A01_archipelago_naval_exercises:0 "Joint Archipelago Manoeuvres"
 A01_archipelago_naval_exercises_desc:0 "Crown and sultanate staffs practise strait defence. Gain 20 navy experience; autonomous sultanates gain 10 each. Available once."
 A01_audit_naval_contracts:0 "Audit Naval Contracts"
 A01_audit_naval_contracts_desc:0 "Account audits add one evidence dossier."
 A01_audit_wtc_contracts:0 "Audit WTC Contracts"
 A01_audit_wtc_contracts_desc:0 "Review the terms and reduce Chamber influence by 15. Stability rises by 1 percentage point."
 A01_back_admiralty_inquiry:0 "Support the Admiralty Inquiry"
 A01_back_admiralty_inquiry_desc:0 "Support the Admiralty Inquiry. Establish the institutions and guarantees of this political settlement."
 A01_bilingual_ballots:0 "Ballots in Local Languages"
 A01_bilingual_ballots_desc:0 "Help island constituencies take part in the election. Stability rises by 2 percentage points and political power by 15."
 A01_campaign_constitutional:0 "Campaign: Constitutional Union"
 A01_campaign_constitutional_desc:0 "Bloc support rises by 2; available once every 30 days."
 A01_campaign_indonesian:0 "Campaign: Indonesian Coalition"
 A01_campaign_indonesian_desc:0 "Bloc support rises by 2; available once every 30 days."
 A01_campaign_order:0 "Campaign: Order Party"
 A01_campaign_order_desc:0 "Bloc support rises by 2; available once every 30 days."
 A01_coalition_roundtable:0 "A Roundtable of Three Parties"
 A01_coalition_roundtable_desc:0 "Agree on Indonesian representation and settle the scandal. Stability rises by 3 percentage points."
 A01_concede_naval_budget:0 "Concede a Share of the Budget"
 A01_concede_naval_budget_desc:0 "The navy gains control over orders. Council respect +15; balance shifts 10% toward the admirals."
 A01_council_concessions:0 "Negotiate the Council Budget"
 A01_council_concessions_desc:0 "Budget negotiations: −15 royal influence. Part of the political cost is refunded."
 A01_council_relations:0 "Governor and Admirals Council"
 A01_council_relations_desc:0 "§YCouncil respect: [?A01_admirals_respect|0]/100§!\n\nConcessions transfer authority to the admirals but improve cooperation. Exercises, open accounts and fulfilled promises build respect. After defeat, a low balance can force Ludolf’s resignation."
 A01_crown_audiences:0 "The Queen’s Public Audiences"
 A01_crown_audiences_desc:0 "Public audiences: +15 royal influence, +2% stability. Repeat after 60 days."
 A01_crown_compromise:0 "Convene a Conciliation Commission"
 A01_crown_compromise_desc:0 "The commission moves the balance 20 points toward the centre and grants +3% stability."
 A01_crown_struggle:0 "Struggle for a New Order"
 A01_crown_struggle_desc:0 "Balance court and Council for a Constitution (−40%…+40%), or reach 60% royal influence for full authority. A strong Council obstructs government; excessive court power risks a plot."
 A01_exile_volunteer_register:0 "Open the Exile Volunteer Register"
 A01_exile_volunteer_register_desc:0 "Refugee records help recruit trained volunteers. Gain 6,000 manpower and 20 army experience. Available once."
 A01_extend_cabinet_hearings:0 "Extend the Cabinet Hearings"
 A01_extend_cabinet_hearings_desc:0 "Extend the hearings once by 60 days, at a political and stability cost."
 A01_fund_widows:0 "Support Bereaved Families"
 A01_fund_widows_desc:0 "Payments to sailors’ families ease bitterness in the ports. Respect +5, stability +3%."
 A01_future_contest:0 "The Contest for the Netherlands"
 A01_guard_oaths:0 "Officers Swear to the Queen"
 A01_guard_oaths_desc:0 "Guard oaths: +20 royal influence and 10 army experience, but −2% stability."
 A01_hear_island_delegates:0 "Hear the Island Delegates"
 A01_hear_island_delegates_desc:0 "Hear the Island Delegates. Establish the institutions and guarantees of this political settlement."
 A01_honour_naval_officers:0 "Recognise Naval Service"
 A01_honour_naval_officers_desc:0 "The governor will personally honour distinguished crews. Respect +10; balance shifts 5% toward Ludolf."
 A01_inevitable_conflict_category:0 "Japanese Expansion"
 A01_inevitable_conflict_category_desc:0 "Canonical preparations lead to the Borneo Crisis of January 1894. Commercial concessions do not change the war date. The prolonged campaign is settled in February 1896."
 A01_japanese_expansion:0 "Until the Borneo Conference"
 A01_japanese_expansion_desc:0 "The shared settlement deadline is 1 February 1896. Japan wins with control of any Borneo province, including a lease; otherwise the Netherlands wins. The separate Philippine war continues."
 A01_japanese_invasion_countdown:0 "Until the Japanese Ultimatum"
 A01_japanese_invasion_countdown_desc:0 "After the hidden diplomatic prelude, both countries share a countdown to 1 January 1894. Japanese transport, coaling and sailing-order decisions each remove 15 days. A peace agreement cancels preparations."
 A01_joint_naval_exercises:0 "Hold Joint Naval Exercises"
 A01_joint_naval_exercises_desc:0 "A joint inspection and exercises demonstrate commitment to defence. Respect +10; balance shifts 10% toward Ludolf."
 A01_lease_brunei:0 "Lease Brunei for Six Months"
 A01_lease_brunei_desc:0 "Lease Brunei for 180 days and receive 25 political power. The Borneo Crisis date is unchanged. Return is deferred during war; the treaty may make Japanese ownership permanent."
 A01_meet_princely_envoys:0 "Receive Princely Envoys"
 A01_meet_princely_envoys_desc:0 "Discuss taxation and justice. +1 court confidence."
 A01_monarchy_category:0 "Future of the Crown"
 A01_motion_to_dismiss_ludolf:0 "Hearings on the Dismissal of Ludolf"
 A01_motion_to_dismiss_ludolf_desc:0 "The postwar cabinet opens the political fork. On Ludolfs route the autonomous sultanates petition the council through an event. Hearings expire after 240 days."
 A01_new_republic:0 "Ludolf’s New Politics"
 A01_new_republic_desc:0 "Reforms require money and public trust. WTC influence: §Y[?A01_wtc_influence|0]/100§!. At 50 or above, the Chamber extracts economic concessions: consumer goods requirements rise and the government loses political power."
 A01_open_admiralty_accounts:0 "Open the Admiralty Accounts"
 A01_open_admiralty_accounts_desc:0 "Transparent procurement reduces mutual suspicion. Respect +8; a small gain in civilian control."
 A01_open_seas_convention:0 "Common Trading Sea Convention"
 A01_open_seas_convention_desc:0 "Coordinate Crown and sultanate port rules. Civilian investment builds a capital factory and strengthens autonomous partners. Available once."
 A01_pay_the_captains:0 "Pay the Captains"
 A01_pay_the_captains_desc:0 "Guarantee pay rather than political offices. +2 loyalty."
 A01_peace_request_category:0 "Negotiations with Japan"
 A01_peace_request_category_desc:0 "If Japan controls at least one Borneo province, offer an early peace on Japanese terms."
 A01_postwar_reconstruction:0 "Reorganising the East Indies"
 A01_postwar_reconstruction_desc:0 "The Borneo Convention changed borders without resolving tensions between governor, navy and local rulers. Autonomous sultanates remain under Batavia and retain Japanese resource concessions."
 A01_request_japanese_terms:0 "Request Japanese Peace Terms"
 A01_request_japanese_terms_desc:0 "Propose the Borneo Convention to Tokyo. Japan may accept or refuse. A surviving Brunei lease also counts as Japanese control."
 A01_review_charter_courts:0 "Joint Review of Island Courts"
 A01_review_charter_courts_desc:0 "Civic and princely judges review charter enforcement and arbitrary taxation. Improve Crown and autonomous sultanate stability. Available once."
 A01_royal_ballot:0 "Election of the Prime Minister"
 A01_royal_ballot_desc:0 "Incumbent prime minister: §Y[Root.GetA01RoyalPremier]§!.\nBloc support: Constitutional Union §Y[?A01_vote_constitutional|0]§!, Order Party §Y[?A01_vote_order|0]§!, Indonesian Coalition §Y[?A01_vote_indonesian|0]§!.\nHighest support wins. Ties favour the Indonesian Coalition, then the Order Party."
 A01_royal_election_campaign:0 "90 Days until Voting"
 A01_royal_election_campaign_desc:0 "At campaign end, the electoral commission determines the winning bloc by support."
 A01_royal_election_term:0 "Cabinet Term"
 A01_royal_election_term_desc:0 "The next campaign starts after 720 days. The incumbent serves until the next result."
 A01_royal_institutions:0 "Crown, Admirals and Islands"
 A01_royal_institutions_desc:0 "Evidence: §Y[?A01_admiralty_evidence|0]§! / 3. Captain loyalty: §Y[?A01_fleet_loyalty|0]§! / 2. Court confidence: §Y[?A01_sultan_confidence|0]§!.\nTrial needs evidence and captains; purge needs the Guard and captains. The island compact requires at least 3 court confidence."
 A01_rubber_concession:0 "Offer a Temporary Rubber Concession"
 A01_rubber_concession_desc:0 "Grant Japanese rubber rights in East Kalimantan for 180 days. Both sides gain 5 political power; the war date is unchanged."
 A01_secure_witnesses:0 "Protect Witnesses"
 A01_secure_witnesses_desc:0 "Family protection encourages captains to testify. +1 loyalty."
 A01_sultanate_conference:0 "Conference of Autonomous Sultanates"
 A01_sultanate_conference_desc:0 "Agree on defence and the budget with local rulers. Stability rises by 2 percentage points and political power by 15."
 A01_supply_concession:0 "Concede a Shipment of Small Arms"
 A01_supply_concession_desc:0 "Transfer 1,000 rifles to Japan. Both sides gain 5 political power. This concession neither cancels nor delays the crisis."
 A01_veterans_register:0 "A Common Register of Bereaved Families"
 A01_veterans_register_desc:0 "Extend payments and remove duplicate records. Stability and war support each rise by 2 percentage points."
 A01_wilhelminas_diary:0 "Wilhelmina's Diary"
 A01_wilhelminas_diary_desc:0 "Read the princess's diary and decide whether to support the Crown in the unresolved postwar political contest. Available from 1895."
 A01_wtc_port_concession:0 "A WTC Port Concession"
 A01_wtc_port_concession_desc:0 "The Chamber will build a civilian factory in the capital in exchange for a concession. WTC influence rises by 30. Can be repeated after 120 days."
 A01_wtc_reconstruction_credit:0 "WTC Reconstruction Credit"
 A01_wtc_reconstruction_credit_desc:0 "Spend 75 political power to receive 100 political power and industrial support; WTC influence rises by 20. Can be repeated after 90 days."
 A03_advance_coaling:0 "Advance the Supply Schedule"
 A03_advance_coaling_desc:0 "Stockpile 15,000 fuel for 50 political power and shorten both invasion clocks by 15 days. Once only."
 A03_charter_transports:0 "Charter Additional Transports"
 A03_charter_transports_desc:0 "Purchase 20 transports for 35 political power and shorten both invasion clocks by 15 days. Once only."
 A03_final_sailing_orders:0 "Issue Final Sailing Orders"
 A03_final_sailing_orders_desc:0 "Gain 10 naval experience and 10 command power for 35 political power and shorten both invasion clocks by 15 days. Once only."
 A03_imperial_press_campaign:0 "Imperial Press Campaign"
 A03_imperial_press_campaign_desc:0 "Raise war support and confidence in the cabinet. Press reports do not change the conference date."
 A03_japanese_expansion:0 "Until the Borneo Conference"
 A03_japanese_expansion_desc:0 "The shared settlement deadline is 1 February 1896. Japan wins with control of any Borneo province, including a lease; otherwise the Netherlands wins. The separate Philippine war continues."
 A03_japanese_invasion_countdown:0 "Until the Japanese Ultimatum"
 A03_japanese_invasion_countdown_desc:0 "After the hidden diplomatic prelude, both countries share a countdown to 1 January 1894. Three preparation decisions remove 15 days each, up to 45 days in total. Tokyo issues its ultimatum when time runs out."
 A03_mobilize_reserves:0 "Mobilise the Reserves"
 A03_mobilize_reserves_desc:0 "Mobilise 15,000 reservists, 2,000 rifles and fuel. The settlement date remains unchanged."
 A03_rush_second_wave:0 "Send a Second Wave"
 A03_rush_second_wave_desc:0 "Send the second wave: 1,000 rifles, 5,000 reservists and war support. Reinforcements do not postpone the February 1896 conference."
 A03_southern_preparations:0 "Final Southern Preparations"
 A03_southern_preparations_desc:0 "Canonical preparations lead to the Borneo Crisis of January 1894. Commercial concessions do not change the war date. The prolonged campaign is settled in February 1896."
 A03_wartime_operations:0 "Sustaining the Southern Campaign"
 A03_wartime_operations_desc:0 "Reserves and mobilisation extend the shared Borneo campaign deadline for both sides."
 A10_integrate_1026:0 "Integration: [1026.GetName]"
 A10_integrate_1026_desc:0 "At 80% compliance, this state becomes a federal core."
 A10_integrate_1027:0 "Integration: [1027.GetName]"
 A10_integrate_1027_desc:0 "At 80% compliance, this state becomes a federal core."
 A10_integrate_1085:0 "Integration: [1085.GetName]"
 A10_integrate_1085_desc:0 "At 80% compliance, this state becomes a federal core."
 A10_integrate_327:0 "Integration: [327.GetName]"
 A10_integrate_327_desc:0 "At 80% compliance, this state becomes a federal core."
 A10_integrate_623:0 "Integration: [623.GetName]"
 A10_integrate_623_desc:0 "At 80% compliance, this state becomes a federal core."
 A10_integrate_624:0 "Integration: [624.GetName]"
 A10_integrate_624_desc:0 "At 80% compliance, this state becomes a federal core."
 A10_integrate_625:0 "Integration: [625.GetName]"
 A10_integrate_625_desc:0 "At 80% compliance, this state becomes a federal core."
 A10_integrate_627:0 "Integration: [627.GetName]"
 A10_integrate_627_desc:0 "At 80% compliance, this state becomes a federal core."
 A10_integrate_628:0 "Integration: [628.GetName]"
 A10_integrate_628_desc:0 "At 80% compliance, this state becomes a federal core."
 A10_integration:0 "Federal Pacification and Integration"
 A10_integration_desc:0 "Suppress resistance and build compliance. At 80% compliance a state can become a core."
 A10_japanese_settlement:0 "Peace with Japan"
 A10_offer_archipelago_peace:0 "Offer Peace: A Free Archipelago"
 A10_offer_archipelago_peace_desc:0 "Japan has been expelled from the archipelago. Request recognition of the liberation of its possessions, including Manila, Bataan, northern Luzon and Palawan. Confederate subjects’ control counts. Japan can refuse."
 A10_offer_manila_peace:0 "Offer Peace: The Manila Compromise"
 A10_offer_manila_peace_desc:0 "We hold Manila while northern Luzon and Bataan remain under Japanese control. Request Manila in a peace settlement; northern Luzon, Bataan and Japan’s other possessions remain Japanese."
 A10_pacify_624:0 "Pacification: [624.GetName]"
 A10_pacify_624_desc:0 "Over 30 days, gain 10 compliance and reduce resistance by 10. Requires ownership and control."
 JPC_cabinet:0 "War Cabinet Minutes"
 JPC_cabinet_desc:0 "Three heads of the empire are bound by temporary promises. The diplomatic prelude gives way to a January 1894 deadline; preparation decisions can bring war forward. Borneo talks arrive in February 1896. Philippine and possible British wars have separate outcomes."
 JPC_emergency_shipping:0 "Pay for an Emergency Voyage"
 JPC_emergency_shipping_desc:0 "Spend political capital on ten transports. Available every 120 days; this does not postpone the peace conference."
 JPC_luzon_talks:0 "Hear the Confederation’s Terms"
 JPC_luzon_talks_desc:0 "If the Confederation has liberated Manila or the archipelago, propose the existing territorial settlement. The Borneo treaty does not replace this peace."
 JPC_repay_credit:0 "Repay the Secured Credit"
 JPC_repay_credit_desc:0 "After all wars end, repay the WTC loan for 175 political power and end debt service."
 JPC_support_families:0 "Allowances for Mobilised Families"
 JPC_support_families_desc:0 "A one-time grant sustains trust in the court without erasing casualties or the split."
 JPF_bridge_credit:0 "Request Bridge Credit"
 JPF_bridge_credit_desc:0 "Opens negotiations with the Chamber over shipping and liabilities."
 JPF_close_ledger:0 "Close the Emergency Ledger"
 JPF_close_ledger_desc:0 "Close the domestic crisis after all wars and repayment of emergency Chamber credit: pressure below 20, confidence at 65. Requires oil settlement after victory or restructuring after defeat."
 JPF_defer_yard_orders:0 "Defer Yard Orders"
 JPF_defer_yard_orders_desc:0 "Pressure −10, confidence −4; slower yards for 180 days."
 JPF_finance:0 "The War Ledger"
 JPF_finance_desc:0 "Mitsubishi debt pressure: §Y[?JPF_debt_pressure|0]/100§!\nBudget confidence: §Y[?JPF_budget_confidence|0]/100§!\nMonthly service: §R[?JPF_monthly_service|0]§! political power. War and supplies raise pressure; audited accounts and payment schedules reduce growth. Distress begins at 75 and a cash crisis becomes likely at 95. Chamber debt has its own ledger."
 JPF_levy_excise:0 "Collect Emergency Excise"
 JPF_levy_excise_desc:0 "Pressure −12, confidence −7; stability and construction penalties for 180 days."
 JPF_osaka_advance:0 "Take the Osaka Advance"
 JPF_osaka_advance_desc:0 "500 rifles and 15 transports; pressure +12, confidence −5."
 JPF_pay_dockworkers:0 "Pay the Dockworkers"
 JPF_pay_dockworkers_desc:0 "Clears delivery arrears; pressure +5, confidence +7."
 JPF_publish_accounts:0 "Publish Audited Accounts"
 JPF_publish_accounts_desc:0 "Pressure −4, confidence +8."
 JPF_redeem_small_savers:0 "Redeem Small Deposits"
 JPF_redeem_small_savers_desc:0 "Pressure −12, confidence +8; civilian retrenchment for 120 days."
 JPF_service_bonds:0 "Service Public Bonds"
 JPF_service_bonds_desc:0 "Pressure −10, confidence +3."
 JPF_voluntary_subscription:0 "Open Voluntary Subscription"
 JPF_voluntary_subscription_desc:0 "25 transports; pressure +8, confidence +5. Once only."
 JPL_escort_manila:0 "Assign Manila Escorts"
 JPL_escort_manila_desc:0 "Burden −6, slower growth for 90 days; temporary fleet organisation penalty and Mitsubishi pressure +5."
 JPL_hold_port_perimeter:0 "Shorten the Port Perimeter"
 JPL_hold_port_perimeter_desc:0 "Burden −10, fatigue +7; temporary morale penalty."
 JPL_luzon_cabinet:0 "Manila and Unconquered Luzon"
 JPL_luzon_cabinet_desc:0 "Garrison burden: §Y[?JPL_garrison_burden|0]/100§!\nFatigue: §Y[?JPL_garrison_fatigue|0]/100§!\nOverload begins at 40, emergency supply at 70; fatigue from 60 reduces morale. Supplies, escorts and hospitals add Mitsubishi liabilities. Borneo peace does not end the Confederation war."
 JPL_open_field_hospitals:0 "Open Field Hospitals"
 JPL_open_field_hospitals_desc:0 "25 support equipment: fatigue −10 and slower growth for 90 days; Mitsubishi pressure +5."
 JPL_prosecute_false_accounts:0 "Prosecute False Accounts"
 JPL_prosecute_false_accounts_desc:0 "Burden −15, fatigue +5; limited treasury savings."
 JPL_purchase_locally:0 "Purchase Food Locally"
 JPL_purchase_locally_desc:0 "Burden −6 and slower growth for 120 days; Mitsubishi pressure +5."
 JPL_rotate_garrison:0 "Rotate the Garrison"
 JPL_rotate_garrison_desc:0 "1,000 manpower: fatigue −8 and slower growth for 90 days; Mitsubishi pressure +5."
 JPL_supply_manila:0 "Extra Manila Supplies"
 JPL_supply_manila_desc:0 "200 rifles: burden −8 and reduced growth for 90 days; Mitsubishi pressure +5."
 JPL_verify_garrison_books:0 "Verify Garrison Books"
 JPL_verify_garrison_books_desc:0 "Burden −12, fatigue +4: audits disrupt established supply networks."
 JPN_north_admiralty_appropriation:0 "Compensate the Fleet"
 JPN_north_admiralty_appropriation_desc:0 "Resentment −14, trust −3; Mitsubishi pressure +5. At most three grants."
 JPN_north_bread_before_rifles:0 "Charter a Grain Convoy"
 JPN_north_bread_before_rifles_desc:0 "2 transports: trust +5, resentment +2, supplies +2 months. At most three charters."
 JPN_north_clear_arrears:0 "Clear Northern Supply Arrears"
 JPN_north_clear_arrears_desc:0 "500 rifles and 6 transports: trust +18, resentment +12, four months covered; restores the protocol."
 JPN_north_council:0 "Northern Neutrality Protocol"
 JPN_north_council_desc:0 "Saigo’s trust: §Y[?JPN_north_trust|0]/100§!\nNaval resentment: §Y[?JPN_north_fleet_irritation|0]/100§!\nSupplies covered: §Y[?JPN_north_supply_months|0] months§!\n250 rifles and 4 transports cover three months. Uncovered months cost 3 trust. Trust below 20 or resentment at 80 breaks the protocol. Northern neutrality grants no divisions or annexation."
 JPN_north_meiji_letter:0 "Send Meiji’s Personal Letter"
 JPN_north_meiji_letter_desc:0 "Trust +12, resentment +4."
 JPN_north_negotiate_compact:0 "Propose a Permanent Compact"
 JPN_north_negotiate_compact_desc:0 "Requires trust at 55, resentment below 60 and fresh supplies. Ends the recurring crisis while retaining the cost of neutrality."
 JPN_north_scheduled_shipment:0 "Dispatch Northern Supplies"
 JPN_north_scheduled_shipment_desc:0 "250 rifles and 4 transports: trust +8, resentment +6, supplies +3 months, Mitsubishi pressure +5."
 JPN_north_send_inspectors:0 "Send a Warehouse Commission"
 JPN_north_send_inspectors_desc:0 "Opens a choice over the inspectors’ authority."
 JPN_north_written_postponement:0 "Agree a Written Postponement"
 JPN_north_written_postponement_desc:0 "Coverage +2 months, trust −6, resentment −5. Twice during the war."
 JPT_mitsubishi_deadline:0 "Mitsubishi Bills Fall Due"
 JPT_mitsubishi_deadline_desc:0 "Complete state guarantees or borrowing reform within 180 days. Otherwise Mitsubishi collapses, blocking military supply payment and the common budget until restructuring."
 JPT_recall_expedition:0 "Secure Recall of Saigo’s Expedition"
 JPT_recall_expedition_desc:0 "Before 1894, recall the expedition. Requires a peace agreement and Saigo trust above 54. Costs 75 political power, 15 trust and adds 10 fleet irritation. Guarantees prevention of the Greenland crisis."
 JPT_restructure_after_crash:0 "Emergency Mitsubishi Restructuring"
 JPT_restructure_after_crash_desc:0 "After borrowing reform, spend 100 political power and 60 days resolving the collapse. Costs 3% stability, lowers debt pressure by 15 and unlocks supplies and the budget."
 JPT_three_heads:0 "Three Heads of the Dragon"
 JPT_three_heads_desc:0 "Mitsubishi owes Osaka banks and merchants; WTC debt is separate. Ito’s appointment starts 180 days to guarantee or reform borrowing. Saigo’s expedition may reach Greenland in early 1894; a peace agreement alone does not stop it."
 JSM_offer_A01:0 "East Indies protectorate"
 JSM_offer_A01_desc:0 "Negotiations take 30 days. Acceptance creates a Japanese puppet; refusal grants a war goal."
 JSM_offer_A08:0 "Northern treaty"
 JSM_offer_A08_desc:0 "Negotiations take 30 days. Acceptance creates a Japanese puppet; refusal grants a war goal."
 JSM_offer_A10:0 "Philippine protectorate"
 JSM_offer_A10_desc:0 "Negotiations take 30 days. Acceptance creates a Japanese puppet; refusal grants a war goal."
 JSM_subordination:0 "Imperial diplomacy"
 WTC_board:0 "Madeira’s Closed Directorate"
 WTC_board_desc:0 "Lambert is the directorate’s signature; the person behind it is unknown.\nOld Guard: §Y[?WTC_old_guard|0]§!\nYoung Technocrats: §Y[?WTC_technocrats|0]§!\nSecret Department: §Y[?WTC_secret_department|0]§!\nBankers defend insurance monopolies; technocrats seek Tesla; the department handles intelligence, eliminations and pirate treaties. An independent return to the continent threatens them all."
 WTC_board_old_guard:0 "Support the Old Guard"
 WTC_board_old_guard_desc:0 "Chosen influence +10, both others −5. Priorities affect insurance, laboratory contracts and pirate channels."
 WTC_board_secret:0 "Expand the Secret Department"
 WTC_board_secret_desc:0 "Chosen influence +10, both others −5. Priorities affect insurance, laboratory contracts and pirate channels."
 WTC_board_technocrats:0 "Hear the Technocrats"
 WTC_board_technocrats_desc:0 "Chosen influence +10, both others −5. Priorities affect insurance, laboratory contracts and pirate channels."
 WTC_borrow:0 "Take Maritime Credit"
 WTC_borrow_desc:0 "25 transports; debt +20. Interest adds one monthly for 180 days."
 WTC_cables:0 "Lease Cable Priority"
 WTC_cables_desc:0 "Debt +3; better naval coordination and political communications for 180 days."
 WTC_concede:0 "Concede Port Fees"
 WTC_concede_desc:0 "Debt −15, then −1 monthly for 240 days. Civilian costs and slower construction; sovereignty remains."
 WTC_debt_ledger:0 "Chamber Debt Ledger"
 WTC_debt_ledger_desc:0 "Debt: §Y[?WTC_debt|0]/100§!\nNonzero debt costs 2 political power monthly. War with debt at 30 and active loans each add one monthly.\n§YAbove 70§!: concession demands; §Rabove 90§!: cable sanctions and blacklisting; §R100§!: a financial coup through a local cabinet. Blacklisting and coups require British cover. The Chamber cannot annex territory."
 WTC_end_receivership:0 "Redeem the Receivership"
 WTC_end_receivership_desc:0 "After war, with debt at 20 or below, end receivership. The country must resolve its political system separately."
 WTC_insure:0 "Insure the Silver Convoy"
 WTC_insure_desc:0 "Insurance for 180 days. Banker priority adds 3 debt; technocrats grant laboratory contracts; secret priority grants a pirate corridor at a reputational cost."
 WTC_naval_service:0 "Service Debt Through Britain"
 WTC_naval_service_desc:0 "Send wartime Britain 10 transports and 500 rifles. Debt −12; the Chamber depends on its navy."
 WTC_repay:0 "Repay Part of the Debt"
 WTC_repay_desc:0 "Debt −12, with no new concessions."
