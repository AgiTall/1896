l_english:
 A01_DUAL_CAPITAL:0 "New Amsterdam–Batavia"
 A01_NEW_AMSTERDAM:0 "New Amsterdam"
 A01_conservatives:0 "Conservative Party"
 A01_crown.1.a:0 "Recognise the Council’s appointments"
 A01_crown.1.b:0 "Negotiate a division of powers"
 A01_crown.1.c:0 "The Guard will remind them of their oath"
 A01_crown.1.d:0 "Behind closed doors, admirals and island dignitaries demand a veto over decrees and ministerial appointments. The Guard awaits the Queen’s command. Will the monarchy rest on an agreement or the authority of a new court?"
 A01_crown.1.t:0 "The Grand Council’s Last Ultimatum"
 A01_crown.2.a:0 "Give the Council a seat at the table"
 A01_crown.2.b:0 "Appeal directly to our subjects"
 A01_crown.2.d:0 "The Council delays appointments and demands budget concessions. The court proposes a direct appeal to the public. Until the fundamental law is settled, the struggle will continue."
 A01_crown.2.t:0 "Petitions of the Grand Council"
 A01_crown.3.a:0 "Restore some Council powers"
 A01_crown.3.b:0 "Arrest the conspirators"
 A01_crown.3.d:0 "Court influence is nearly absolute. Several councillors secretly discuss removing the royal ministers. The Queen can retreat toward a settlement or order the Guard to arrest the plotters at the cost of a political crisis."
 A01_crown.3.t:0 "A Plot in the Palace Corridors"
 A01_crown_council_balance:0 "The Queen and the Grand Council"
 A01_future.1.a:0 "Prepare the islands."
 A01_future.1.d:0 "Japanese preparations begin. Both countries now use the same invasion deadline; diplomatic concessions and preparations can alter the shared clock."
 A01_future.1.t:0 "A Shared Countdown"
 A01_future.10.a:0 "Loyalty becomes a condition of service."
 A01_future.10.d:0 "Officers must swear personal loyalty to the council. Experience no longer guarantees a command. The purges weaken coordination while building a loyal corps."
 A01_future.10.t:0 "An Oath Behind Closed Doors"
 A01_future.11.a:0 "The regency must hold the country together."
 A01_future.11.d:0 "Neither the council nor the civilian cabinet could secure lasting authority. Emma accepts the regency as an arbiter, preserving naval command and opening negotiations on island rights."
 A01_future.11.t:0 "The Regent Arrives"
 A01_future.12.a:0 "The charter binds the crown."
 A01_future.12.d:0 "Emma confirms autonomous rights and community representation. The delegates insist that the charter must bind future monarchs as well as the regent."
 A01_future.12.t:0 "A Charter for the Islands"
 A01_future.13.a:0 "Long live Queen Wilhelmina."
 A01_future.13.d:0 "The adult Wilhelmina succeeds Queen Mother Emma. Alongside the state seal, she receives copies of the island charters. The regency ends; the duty to negotiate remains."
 A01_future.13.t:0 "Wilhelmina Takes Office"
 A01_future.14.a:0 "No order stands above the constitution."
 A01_future.14.d:0 "The new constitution separates the powers of the monarch, civilian institutions and military command, protecting island representation and autonomous charters."
 A01_future.14.t:0 "The Crown and the Law"
 A01_future.15.a:0 "Every institution answers to the council."
 A01_future.15.d:0 "Ministries, courts and appointments now answer to the council. Ludolf remains imprisoned. The purges end in complete control of the state by the military elite."
 A01_future.15.t:0 "The State Becomes a Headquarters"
 A01_future.16.a:0 "Consider a monarchical settlement."
 A01_future.16.b:0 "Continue the contest without the crown."
 A01_future.16.d:0 "With neither faction able to prevail, Emma privately offers a regency and guarantees for the islands. Ludolf must choose between yielding to an arbiter and continuing the unresolved struggle."
 A01_future.16.t:0 "An Unmarked Envelope"
 A01_future.17.a:0 "Begin civilian reforms."
 A01_future.17.d:0 "The cabinet preserves civilian rule, but Ludolf has not been absolved. Open reconstruction and autonomous charters must answer the demands for freedom. Once the sultanates exist, their delegates can petition the council to give him another chance."
 A01_future.17.t:0 "Ludolf Receives Time for Reform"
 A01_future.2.a:0 "We must answer them."
 A01_future.2.d:0 "Workers and village delegates gather outside the residence. They demand autonomy and a say in decisions made in their name. Ludolf promises reform; the council questions his right to lead it."
 A01_future.2.t:0 "The Islands Speak After Defeat"
 A01_future.3.a:0 "Open the hearings."
 A01_future.3.d:0 "The council opens hearings on Ludolfs responsibility. He stays in office for 240 days while presenting reforms and gathering support. Dismissal will require an explicit political settlement."
 A01_future.3.t:0 "The Cabinet Remains, for Now"
 A01_future.4.a:0 "Let the country hear both sides."
 A01_future.4.d:0 "The council demands unified military authority. Island delegates demand accountable government. Ludolf argues that replacing a cabinet cannot restore trust by itself. Every charter and appointment now shapes the future."
 A01_future.4.t:0 "Who Has the Right to Decide?"
 A01_future.5.a:0 "Grant Ludolf a federal mandate."
 A01_future.5.b:0 "Transfer power to the council and imprison Ludolf."
 A01_future.5.d:0 "The hearings have expired. Autonomous sultanates can sponsor a federal mandate for Ludolf; the admirals demand his dismissal and imprisonment. The temporary cabinet must give way to a lasting settlement."
 A01_future.5.t:0 "The Final Hearing"
 A01_future.6.a:0 "Citizenship is not ancestry."
 A01_future.6.d:0 "Racial restrictions on citizenship and public office are repealed. Delegates insist that elected institutions must enforce the promise beyond Batavia."
 A01_future.6.t:0 "One Line in the Law"
 A01_future.7.a:0 "Officials must answer to residents."
 A01_future.7.d:0 "A district council rejects Batavias nominee and proposes a local official. Ludolf accepts. Indonesian communities and sultanates gain a real role in nominations and public hearings."
 A01_future.7.t:0 "A Name on the Appointment List"
 A01_future.8.a:0 "The Netherlands becomes a shared undertaking."
 A01_future.8.d:0 "The cabinet, island representatives and autonomous sultanates sign the federal constitution. Elections and common citizenship replace exclusive colonial appointments."
 A01_future.8.t:0 "Signatures Under a Shared Country"
 A01_future.9.a:0 "The military controls appointments."
 A01_future.9.d:0 "Military commissioners replace civilian officials and seal archives. Political disagreement becomes evidence of disloyalty. Administration slows as the council consolidates control."
 A01_future.9.t:0 "The Seals Change Hands"
 A01_japan.10.a:0 "Continue the debate."
 A01_japan.10.d:0 "Casembroot demands police-backed conscription and punishment for deserters. Other officers warn that obedience obtained through fear will not create reliable formations."
 A01_japan.10.t:0 "Casembroot Demands Obedience"
 A01_japan.11.a:0 "Continue the debate."
 A01_japan.11.d:0 "Fabius proposes transparent pay, family support and investigations of abuse while retaining compulsory service. The population demands enforceable guarantees."
 A01_japan.11.t:0 "Fabius Offers a Service Compact"
 A01_japan.12.a:0 "Continue the debate."
 A01_japan.12.d:0 "Surya Wirata calls for local volunteers led by local officers, with a written promise to disband after the war. European officers fear autonomous armed formations."
 A01_japan.12.t:0 "Surya Wirata Appeals to the Islands"
 A01_japan.2.balance:0 "Ask Fabius to speak."
 A01_japan.2.d:0 "Unease is spreading through the ports and plantations. One of three admirals must address the Indonesian gathering in Batavia.\n\nFrancois de Casembroot is a decisive naval officer with a sharp temper. He speaks plainly, carries himself with dignity and prizes the honour of his uniform.\n\nGerhardus Fabius is a reserved veteran and an attentive listener. Beneath his austere manner lie patience, caution and a habit of hearing others out.\n\nRaden Surya Wirata is an island-born officer who rose through the colonial navy. Familiar with port life, he speaks easily with sailors and has an instinct for the mood of a crowd."
 A01_japan.2.hard:0 "Ask Casembroot to speak."
 A01_japan.2.support:0 "Ask Surya Wirata to speak."
 A01_japan.2.t:0 "Indonesians Refuse to Serve"
 A01_japan.20.a:0 "Continue the debate."
 A01_japan.20.d:0 "Fabius warns of unreliable conscripts. Surya Wirata reports families fleeing port districts. Coercion restores only part of recruitment and risks renewed unrest."
 A01_japan.20.t:0 "Admirals Debate Coercion"
 A01_japan.21.a:0 "Continue the debate."
 A01_japan.21.d:0 "Casembroot calls concessions a reward for disobedience; Surya Wirata demands local commanders. Fabius insists on practical, enforceable guarantees."
 A01_japan.21.t:0 "The Compromise Under Fire"
 A01_japan.22.a:0 "Continue the debate."
 A01_japan.22.d:0 "Casembroot demands disarmament after peace. Fabius proposes common supply arrangements. Surya Wirata accepts joint defence with local commanders and a limited wartime mandate."
 A01_japan.22.t:0 "Who Commands the Volunteers?"
 A01_japan.30.a:0 "Enact this policy."
 A01_japan.30.d:0 "Police conscription restores some manpower, but recruitment and organisation penalties remain. Stability falls and another partisan outbreak may follow."
 A01_japan.30.t:0 "Service Under Compulsion"
 A01_japan.31.a:0 "Enact this policy."
 A01_japan.31.d:0 "Pay inspections and family protections become binding. A council of sultans can hear complaints. Refusal decreases, but some communities still oppose colonial service."
 A01_japan.31.t:0 "Fabius Guarantees Enacted"
 A01_japan.32.a:0 "Enact this policy."
 A01_japan.32.d:0 "Twelve equipped volunteer militia divisions assemble on Java under local commanders. They will disband when the war with Japan ends; volunteering does not erase every grievance."
 A01_japan.32.t:0 "Island Volunteer Militia"
 A01_japan.40.a:0 "Honour the promise."
 A01_japan.40.d:0 "The military crisis with Japan has ended. In accordance with the government pledge, the volunteer divisions have been disbanded. The wider question of Indonesian political participation remains unresolved."
 A01_japan.40.t:0 "The Militia Goes Home"
 A01_japan.choose_balance:0 "Accept Fabius guarantees."
 A01_japan.choose_hard:0 "Return to compulsory service without concessions."
 A01_japan.choose_support:0 "Entrust the defence to volunteers."
 A01_liberals:0 "Liberal Party"
 A01_ludolf_admirals_balance:0 "Power in Batavia"
 A01_monarchy.0.a:0 "She is still a child."
 A01_monarchy.0.b:0 "She is our hope."
 A01_monarchy.0.d:0 "Young Wilhelmina writes that she refuses to be an ornament. She sees the Council and admirals ruin the country and wants responsibility for its future. Will we support the Crown in the postwar contest?"
 A01_monarchy.0.t:0 "Wilhelmina's Diary"
 A01_monarchy.1.a:0 "Yield to Mother."
 A01_monarchy.1.b:0 "Insist on taking the throne."
 A01_monarchy.1.d:0 "Emma of Waldeck and Pyrmont calls her daughter to her study. The mother speaks of duty, caution and a country unprepared for a child ruler. The daughter argues that delay is ruining the country. Their conversation lasts all night."
 A01_monarchy.1.t:0 "A Conversation with Mother"
 A01_monarchy.3.a:0 "Let them speak."
 A01_monarchy.3.b:0 "The Crown guarantees the constitution."
 A01_monarchy.3.d:0 "Wilhelmina opens the first parliament of the Netherlands and Indonesia. Merchants, island civic delegates and princely envoys debate the budget and electoral law. The Admiralty Council no longer holds a veto. The Queen promises to appoint a premier who commands the chamber’s confidence."
 A01_monarchy.3.t:0 "Parliament under the Crown"
 A01_monarchy.4.a:0 "One crown, many peoples."
 A01_monarchy.4.d:0 "The Commonwealth Charter recognises equal rights for the people of the Netherlands and Indonesia. Sultanates retain local laws and representation; shared affairs go before the Crown Parliament. One crown unites a partnership founded on agreement."
 A01_monarchy.4.t:0 "A Commonwealth of Two Shores"
 A01_monarchy.5.a:0 "It must be done."
 A01_monarchy.5.b:0 "We will return to parliament someday."
 A01_monarchy.5.d:0 "After defeating the Council, Wilhelmina establishes personal rule. The Guard swears allegiance to the Crown and ministers answer to her. No parliamentary cabinet is formed. Island charters remain binding: victory over the admirals does not cancel treaties with the sultanates."
 A01_monarchy.5.t:0 "Royal Dictatorship"
 A01_monarchy.6.a:0 "The Crown accepts responsibility."
 A01_monarchy.6.d:0 "The Admiralty Council loses its right to interfere in civilian affairs. Ministers answer to the Queen while the armed forces remain in state service. The Crown now bears responsibility for every decision."
 A01_monarchy.6.t:0 "Rule by Royal Decree"
 A01_monarchy.7.a:0 "Serve the Crown."
 A01_monarchy.7.d:0 "Shipyards and mobilisation offices adopt military priorities. The Royal Navy becomes the foundation of power across the islands. Civilian supply must give way to armaments."
 A01_monarchy.7.t:0 "Crown and Sword"
 A01_postwar.1.a:0 "Ludolf will receive a mandate for reform."
 A01_postwar.1.b:0 "Power passes to the Admiralty Council."
 A01_postwar.1.c:0 "Entrust the Crown to Emma as regent for Wilhelmina."
 A01_postwar.1.d:0 "Defeat has destroyed the old order. Ludolf proposes civilian reforms, the Admiralty Council demands power, and the Crown is ready to arbitrate if neither side prevails. Today the cabinet must decide who will lead the country."
 A01_postwar.1.t:0 "Who Holds Power in the Netherlands?"
 A01_postwar.2.a:0 "Begin registering parties and voters."
 A01_postwar.2.d:0 "The constituent assembly establishes a presidency and universal suffrage. The Liberal Party advocates free trade, the Conservatives favour gradual change, and the Indonesian People’s Party demands equal island representation. Each party will field a candidate in the first election."
 A01_postwar.2.t:0 "A President in Place of a Governor"
 A01_postwar.3.a:0 "The Liberal Party — Ludolf."
 A01_postwar.3.b:0 "The Conservative Party — Hendrik van der Velde."
 A01_postwar.3.c:0 "People’s Party — Raden Surya."
 A01_postwar.3.d:0 "Dutch and Indonesians vote together for the first time. Liberals promise to continue Ludolf’s reforms, conservatives defend order and local government, and the People’s Party campaigns for social guarantees and equal representation. The electoral commission announces the winner:"
 A01_postwar.3.t:0 "First Federal Election"
 A01_postwar.4.a:0 "Demand an apology and preserve equal representation."
 A01_postwar.4.b:0 "Negotiate a coalition behind closed doors."
 A01_postwar.4.c:0 "Yield to the opponents of Indonesian ministers."
 A01_postwar.4.conservative_d:0 "During discussions of ministerial appointments, a Conservative deputy protests: ‘Indonesians in the government? Who gave them the right to govern us?’ Journalists record his words. The Indonesian People’s Party demands an answer from the president: does equal citizenship extend to ministerial office?"
 A01_postwar.4.d:0 "During negotiations over cabinet posts, one politician loses his composure: ‘Are we really going to let Indonesians govern the state?’ Journalists hear the remark. The Indonesian delegation demands a public answer from the president: equal citizenship must apply behind ministry doors as well."
 A01_postwar.4.liberal_d:0 "During discussions of ministerial appointments, a Liberal deputy protests: ‘Indonesians in the government? Who gave them the right to govern us?’ Journalists record his words. The Indonesian People’s Party demands an answer from the president: does equal citizenship extend to ministerial office?"
 A01_postwar.4.t:0 "A Scandal over Cabinet Appointments"
 A01_royal_story.1.a:0 "Guarantee local self-government."
 A01_royal_story.1.b:0 "Start with a common budget and customs."
 A01_royal_story.1.d:0 "The envoys demand local taxation and secure succession. Ministers propose a shared defence budget. Emma insists that the compact protect taxpayers as well as palaces. Broad self-government and a customs-first agreement offer different starting points."
 A01_royal_story.1.t:0 "Four Courts and One Crown"
 A01_royal_story.10.a:0 "Let the electorate decide."
 A01_royal_story.10.d:0 "Three blocs publish their programmes: transparent budgets, princely guarantees and naval strength, or schools and equal appointments. Voting is in 90 days. Campaign decisions support each bloc once every 30 days."
 A01_royal_story.10.t:0 "A Campaign without the Admirals’ Veto"
 A01_royal_story.11.a:0 "Appoint the cabinet and open the session."
 A01_royal_story.11.d:0 "The prime minister is §Y[Root.GetA01RoyalPremier]§!. The speaker delivers the results. The winning bloc forms the cabinet, whose programme appears as a separate national spirit. The Queen confirms its appointment under the constitution. The next campaign begins in two years. Pre-agreed ties favour the Indonesian Coalition, then the Order Party."
 A01_royal_story.11.t:0 "The Queen Receives the Prime Minister"
 A01_royal_story.12.a:0 "The sea should connect us."
 A01_royal_story.12.d:0 "Shipping security and island development take priority over prestige campaigns. Courts gain markets and citizens gain jobs, while public willingness to fight declines."
 A01_royal_story.12.t:0 "A Crown on the Trade Routes"
 A01_royal_story.13.a:0 "Preserve the homeland and build a future."
 A01_royal_story.13.d:0 "Refugees establish an archive and school for the lost homeland. Ministers insist that remembrance must not consume Indonesia’s future. A fleet of return will require an openly funded budget and offers no easy victory."
 A01_royal_story.13.t:0 "A Homeland on Classroom Maps"
 A01_royal_story.14.a:0 "Our future is here."
 A01_royal_story.14.d:0 "Naval maps now begin with Java. Courts, civic delegates and the military ministry sign a common defence plan. The new power rests on cooperation among the archipelago’s peoples."
 A01_royal_story.14.t:0 "A State Facing the Pacific"
 A01_royal_story.15.a:0 "Fund another session from the court."
 A01_royal_story.15.b:0 "Appeal to the country."
 A01_royal_story.15.d:0 "The inquiry deadline expires while the Council still holds the ministry. The royal route remains open, but another 180-day session costs political capital and makes captains more cautious."
 A01_royal_story.15.t:0 "The Council Buys Time"
 A01_royal_story.2.a:0 "Give civic delegates seats."
 A01_royal_story.2.b:0 "Reach an agreement with the courts first."
 A01_royal_story.2.d:0 "A teacher reads the petition in Malay, then Dutch. Its signatories ask for courts, schools and officer commissions. Princely envoys fear a civic chamber will displace them. The Crown must recognise both claims or postpone an answer."
 A01_royal_story.2.t:0 "Who Represents Indonesia?"
 A01_royal_story.3.a:0 "Autonomous sultanates under one Crown."
 A01_royal_story.3.b:0 "One state with guaranteed charters."
 A01_royal_story.3.d:0 "One annex establishes autonomous sultanates with local administrations and common defence. The other preserves a unified state with local law, civic representation and tax guarantees. Only Crown-owned land can be transferred; Japanese rights on Borneo remain."
 A01_royal_story.3.t:0 "Signatures on the Island Compact"
 A01_royal_story.4.a:0 "Open the hearings."
 A01_royal_story.4.b:0 "Protect the witnesses first."
 A01_royal_story.4.d:0 "A clerk brings contract copies and an order to burn the originals. The admirals call them forgeries. Public hearings convince civic delegates; a confidential inquiry protects witnesses. Further evidence is needed either way."
 A01_royal_story.4.t:0 "The Archive Ordered Burned"
 A01_royal_story.5.a:0 "Punish proven offences only."
 A01_royal_story.5.b:0 "Investigate the entire senior staff."
 A01_royal_story.5.d:0 "The court finds Council leaders responsible for concealing contracts and interfering in civilian government. Captains await the fate of junior officers. Limited sentences preserve experience; wider investigations strengthen the Crown but disrupt the staff."
 A01_royal_story.5.t:0 "A Verdict Must Not Become Revenge"
 A01_royal_story.6.a:0 "Confine the purge to conspiracy leaders."
 A01_royal_story.6.b:0 "Continue the loyalty investigation."
 A01_royal_story.6.d:0 "The Guard seals the admiralty offices. Council leaders lose their political offices, but dozens of captains also face suspicion. Some demand trials, others endless loyalty checks. The fleet already lacks staff officers."
 A01_royal_story.6.t:0 "The Morning without the Council"
 A01_royal_story.7.a:0 "A victory for law: prepare a constitution."
 A01_royal_story.7.b:0 "A victory for the Crown: ministers serve the Queen."
 A01_royal_story.7.d:0 "The admirals’ political veto is gone, but guards, civic delegates and princely courts disagree about the new order. The Queen may divide powers or rely on personal allegiance. This determines access to constitutional or absolute rule."
 A01_royal_story.7.t:0 "Whose Victory Is This?"
 A01_royal_story.8.a:0 "New Amsterdam, capital of the Crown."
 A01_royal_story.8.b:0 "Batavia, the name of our shared city."
 A01_royal_story.8.c:0 "New Amsterdam–Batavia."
 A01_royal_story.8.d:0 "The government quarter opens. Courtiers propose New Amsterdam in memory of the lost homeland. City councillors speak for traders and neighbourhoods that call Batavia home. The Crown may rename the city, keep its name or recognise both."
 A01_royal_story.8.t:0 "What Is the Capital Called?"
 A01_royal_story.9.a:0 "Territorial guarantees and a civic chamber."
 A01_royal_story.9.b:0 "Equal civic representation."
 A01_royal_story.9.d:0 "Princely delegates demand territorial guarantees for small islands. Civic delegates demand equal votes. The Constitutional Union offers compromise. The electoral law changes initial party support; campaigning can still alter the result."
 A01_royal_story.9.t:0 "The Islands Count Their Votes"
 A01_town_hall.1.a:0 "The junta is broken. Order is restored."
 A01_town_hall.1.d:0 "Hardline admirals have barricaded themselves inside Batavia's Admiralty Town Hall, threatening an armed takeover. But Ludolf's golden bridges worked: moderate officers refuse to fire upon civilians. Surrounded by artillery and stormed by loyal colonial battalions, the junta surrenders. Military stratocracy is broken."
 A01_town_hall.1.t:0 "Crisis at the Admiralty Town Hall"
 A01_town_hall.2.a:0 "Forgiving past discord for the sake of the future."
 A01_town_hall.2.d:0 "Refusing to create martyrs or alienate the officer corps, the civilian administration proclaims a general amnesty. Ring leaders are held for trial, but the rank-and-file swear loyalty to the new order. The colony breathes a sigh of relief."
 A01_town_hall.2.t:0 "General Amnesty"
 A01_town_hall.3.a:0 "A masterstroke of political survival."
 A01_town_hall.3.d:0 "The grey cardinal concludes his masterpiece. Resigning without stain or prosecution, Ludolf transfers authority to the emerging civil order and assumes office as Commander-in-Chief of the Royal Navy. The path to federal democracy or royal regency is clear."
 A01_town_hall.3.t:0 "Ludolf Takes Naval Command"
 A03_imperial.1.a:0 "Create the Prime Minister as a lightning rod for the Throne."
 A03_imperial.1.b:0 "The Emperor must rule personally and absolutely."
 A03_imperial.1.d:0 "The halls of the palace echo with debate over the Empire's governance. Advisers propose instituting a Prime Minister as a political lightning rod: should disasters strike, the cabinet can be dissolved, shielding the sacred Tenno from public blame. Others urge direct, undivided imperial command without civilian buffers."
 A03_imperial.1.t:0 "The Debate over Sovereign Rule"
 A03_imperial.2.a:0 "The Throne is shielded forever."
 A03_imperial.2.d:0 "The imperial decree is sealed. A Prime Minister is appointed to lead the cabinet. Henceforth, the government answers to the nation, while the Emperor reigns supreme above secular politics. If storms gather, the lightning strikes the Premier, not the Throne."
 A03_imperial.2.t:0 "The Prime Minister as Political Shield"
 A03_imperial.3.a:0 "A glittering façade for the world, an iron fist for the colonies."
 A03_imperial.3.d:0 "The Imperial War Council establishes the doctrine for occupied territories. On borders, showcases of prosperity display Japanese benevolence to the world. But across the interior, the Kempeitai enforces an iron peace, and zaibatsu extract rubber and oil to the last drop."
 A03_imperial.3.t:0 "The Two-Faced Colonial Project"
 A10_philippines.1.a:0 "This is our chance!"
 A10_philippines.1.b:0 "We should not take the risk"
 A10_philippines.1.d:0 "Japan has been at war with the Dutch for a week. Its forces and fleet are distracted by the struggle for Borneo, leaving the garrisons on Luzon vulnerable. The island council must decide whether to enter the war immediately to reclaim our lands."
 A10_philippines.1.t:0 "Japan on Borneo"
 A10_settlement.1.d:0 "Our garrisons have been expelled from the Philippine archipelago. The island government offers peace in exchange for recognition of liberated Japanese possessions. The offer concerns the Philippine front."
 A10_settlement.1.t:0 "The Philippine Peace Offer"
 A10_settlement.2.d:0 "The Filipinos hold Manila and offer peace in exchange for recognition of its liberation. Northern Luzon, Bataan and our other possessions would remain Japanese."
 A10_settlement.2.t:0 "The Manila Compromise Offer"
 A10_settlement.3.a:0 "The islands have secured their freedom"
 A10_settlement.3.d:0 "Japan has recognised the liberation of its Philippine possessions. Peace is signed, and confederate members retain the states they liberated."
 A10_settlement.3.t:0 "The Archipelago Is Free"
 A10_settlement.4.a:0 "Preserve what we have gained"
 A10_settlement.4.d:0 "Manila is recognised as free, and the war has ended. Northern Luzon and Bataan remain Japanese: a bitter price for peace."
 A10_settlement.4.t:0 "The Manila Compromise"
 A10_settlement.5.a:0 "Continue the struggle"
 A10_settlement.5.d:0 "Tokyo has refused to sign. The war continues. Another offer can be sent after the diplomatic cooldown."
 A10_settlement.5.t:0 "Japan Rejects the Terms"
 A10_settlement.6.d:0 "Philippine troops have occupied our possessions in the archipelago. Our commanders recommend recognising the loss of the territories held by the enemy and ending the war. Delaying a settlement will deepen discontent at home: the government has three months to avert a political crisis."
 A10_settlement.6.t:0 "Negotiations over the Philippines"
 A10_settlement.7.a:0 "This is not worth the bloodshed"
 A10_settlement.7.b:0 "Luzon will be ours — whatever the cost!"
 A10_settlement.7.d:0 "For three months the government has promised to recover our lost positions. Philippine troops still hold our territories, while bereaved families demand answers. Newspapers denounce a pointless slaughter. We must recognise defeat and make peace, or continue fighting in defiance of mounting public anger."
 A10_settlement.7.t:0 "Collapse on Luzon"
 A10_settlement.8.d:0 "Japan offers to end the war and recognise the liberation of territories we hold. If only Manila has been liberated, Northern Luzon and Bataan will remain Japanese. If the entire archipelago has been liberated, Japan will relinquish its island possessions held by us and our subject republics."
 A10_settlement.8.t:0 "Japan Offers Peace"
 A10_settlement.accept:0 "Accept the terms"
 A10_settlement.delay:0 "We can still turn the tide"
 A10_settlement.propose:0 "Offer peace to the Philippines"
 A10_settlement.reject:0 "Continue the war"
 JSM_accept:0 "Accept the terms"
 JSM_offer_title:0 "A Japanese protectorate"
 JSM_refuse:0 "Defend our independence"
 a01_peace_request.1.a:0 "Await the response."
 a01_peace_request.1.d:0 "Batavia proposes ending the war under the Borneo Convention. The Japanese government must respond."
 a01_peace_request.1.t:0 "An Appeal to Tokyo"
 a01_peace_request.2.accept:0 "Accept the proposal."
 a01_peace_request.2.d:0 "The Dutch administration is ready to accept the Borneo Convention. We can end the campaign or continue the war."
 a01_peace_request.2.reject:0 "Continue the campaign."
 a01_peace_request.2.t:0 "Batavia Requests Peace"
 a01_peace_request.3.a:0 "Begin reconstruction."
 a01_peace_request.3.d:0 "Japan has accepted. Sabah, Brunei, Limbang and Sarawak pass to Japan; the war ends under the Convention."
 a01_peace_request.3.t:0 "An Early Borneo Convention"
 a01_peace_request.4.a:0 "Prepare to continue the struggle."
 a01_peace_request.4.d:0 "The Japanese government has refused the peace request. The campaign continues."
 a01_peace_request.4.t:0 "Tokyo Refuses"
 borneo_project.1.a:0 "British engineers and concrete."
 borneo_project.1.b:0 "Australian materials and specialists."
 borneo_project.1.c:0 "Trust the local communities."
 borneo_project.1.d:0 "Inspectors report weak coastal positions. Britain offers concrete and engineers; Australia offers materials and specialists in exchange for New Guinea guarantees. Indonesian communities propose earthworks, obstacles and hidden paths. The defence bonus begins only after project implementation."
 borneo_project.1.t:0 "Three Projects for Borneo"
 expansion.1.a:0 "The islands remain ours."
 expansion.1.d:0 "The Japanese campaign deadline has expired. No Japanese foothold remains on Borneo, forcing Tokyo to end its offensive. Peace preserves our territories and strengthens Ludolf and his standing with the navy."
 expansion.1.t:0 "Borneo Holds — Expansion Stopped"
 expansion.10.a:0 "Restore our administration."
 expansion.10.d:0 "Japan's temporary administration has completed its work. Brunei has returned to Batavia in accordance with the lease."
 expansion.10.t:0 "The Brunei Lease Expires"
 expansion.11.a:0 "Honour the temporary agreement."
 expansion.11.d:0 "Batavia leases Brunei for 180 days. The crisis date remains unchanged. Return is deferred in wartime; the Borneo Convention may make ownership permanent."
 expansion.11.t:0 "A Six-Month Lease of Brunei"
 expansion.2.a:0 "Acknowledge the expedition's failure."
 expansion.2.d:0 "The campaign deadline has expired without a single Borneo province under our control. Japan recognises the expedition as a failure and ends the war without territorial gains. Public support for the cabinet and the war has weakened."
 expansion.2.t:0 "The Borneo Expedition Fails"
 expansion.3.a:0 "Begin reconstruction."
 expansion.3.d:0 "Japan retains a foothold on Borneo at the campaign deadline. Batavia must accept the Borneo Convention. The war ends, while northern territorial transfers and resource concessions weaken the governor."
 expansion.3.t:0 "A Japanese Foothold on Borneo"
 japan_agency.1.a:0 "The cabinet answers for its choices."
 japan_agency.1.d:0 "The fleet needs money without an oil guarantee. State Guarantees takes 35 days. Delay it until the ultimatum and Mitsubishi will dictate emergency terms."
 japan_agency.1.t:0 "Iwasaki Will Wait No Longer"
 japan_agency.2.a:0 "The cabinet answers for its choices."
 japan_agency.2.d:0 "Saigo will not fight for Borneo. A negotiated protocol takes 35 cabinet days; unilateral neutrality needs none, but damages trust. Time spent on the North cannot also prepare Manila."
 japan_agency.2.t:0 "The North Demands an Answer"
 japan_agency.3.a:0 "The cabinet answers for its choices."
 japan_agency.3.d:0 "The ultimatum has gone. Negotiated arrangements retain their terms. Neglected priorities bring forced guarantees, northern mistrust, Manila overload or hurried fleet orders. Late focuses can repair the damage, during the war."
 japan_agency.3.t:0 "The Preparation Bill Falls Due"
 japan_canon.1.d:0 "Meiji has appointed Ito prime minister. Iwasaki demands guarantees for Mitsubishi debts to Osaka banks and merchant houses. Saigo rules the North and conceals an Arctic expedition. Ito demands supplies for Manila and a campaign toward Borneo. He holds the cabinet seal, but the other two heads remain powerful."
 japan_canon.1.o0:0 "Keep them at one table."
 japan_canon.1.t:0 "Council of Three Heads"
 japan_canon.2.d:0 "Mitsubishi will no longer finance the fleet without collateral. Iwasaki demands a state guarantee of exclusive northern Borneo oil rights after victory. The emperor seals it. Osaka now hopes war will save the company."
 japan_canon.2.o0:0 "The state underwrites these obligations."
 japan_canon.2.t:0 "The Financial Ultimatum"
 japan_canon.20.d:0 "Tokyo requests shipping credit. The WTC can supply Japan without recognising its territorial claims. Postwar repayments will secure the return."
 japan_canon.20.o0:0 "Open a secured credit line."
 japan_canon.20.o1:0 "The risk is too high."
 japan_canon.20.t:0 "Japanese Bills of Exchange"
 japan_canon.21.d:0 "Japan requests commercial services in Honolulu. Acceptance brings revenue but commits the neutral kingdom to neither bases nor war."
 japan_canon.21.o0:0 "Commercial services only."
 japan_canon.21.o1:0 "Neutrality matters more than profit."
 japan_canon.21.t:0 "Coal for Japanese Steamships"
 japan_canon.22.d:0 "Japan assures Sydney that its demands concern the Batavian war. Australia may accept or reinforce its coast. British New Zealand remains a separate centre of power."
 japan_canon.22.o0:0 "Acknowledge and stay out."
 japan_canon.22.o1:0 "Reinforce Australia’s approaches."
 japan_canon.22.t:0 "A Letter from Tokyo"
 japan_canon.23.d:0 "Japan’s war threatens British sea routes. New Zealand’s bases can support pressure. Fisher proposes demanding free-navigation guarantees. Tokyo’s refusal could justify aggression, but the Admiralty will still have to choose war."
 japan_canon.23.o0:0 "Demand navigation guarantees."
 japan_canon.23.o1:0 "Watch from New Zealand’s bases."
 japan_canon.23.t:0 "Leviathan Looks East"
 japan_canon.24.d:0 "Convoys are financed. The treasury accepts WTC debt service, repayable through a postwar decision."
 japan_canon.24.o0:0 "Record the liability."
 japan_canon.24.t:0 "The Chamber Opens Credit"
 japan_canon.25.d:0 "Our proposal has not won support. Partners are not obliged to finance Japan’s war or trust its assurances."
 japan_canon.25.o0:0 "We must make do."
 japan_canon.25.t:0 "A Cautious Reply"
 japan_canon.26.d:0 "A limited positive reply arrives. The arrangement changes no borders and brings no neutral country into our war."
 japan_canon.26.o0:0 "Respect the agreement’s limits."
 japan_canon.26.t:0 "An Agreement without an Alliance"
 japan_canon.27.d:0 "Leviathan demands free-navigation guarantees, backed by Singapore and British New Zealand bases. Compliance constrains the fleet; refusal may open a third front."
 japan_canon.27.o0:0 "Accept inspections of merchant voyages."
 japan_canon.27.o1:0 "Ito takes no orders from Bermuda."
 japan_canon.27.t:0 "The British Note"
 japan_canon.28.d:0 "Japan rejects the demands. The Admiralty can go to war using New Zealand’s bases, or limit itself to a demonstration. The Borneo settlement will not automatically end a separate British war."
 japan_canon.28.o0:0 "Issue the war order."
 japan_canon.28.o1:0 "Do not spend the fleet on this war."
 japan_canon.28.t:0 "Tokyo Rejects the Note"
 japan_canon.3.d:0 "Saigo demands Hokkaido’s neutrality. Supplies from Honshu must continue, but the Northern Army will send no regiments to Borneo. Ito protests. Meiji accepts: the empire cannot afford a civil war."
 japan_canon.3.o0:0 "Let the north remain silent."
 japan_canon.3.t:0 "The North Will Not March South"
 japan_canon.30.d:0 "Northern Borneo is secured by treaty. The Philippine war continues; Mitsubishi demands its monopoly, the WTC repayment, and Saigo freedom. Victory has saved the cabinet without healing the split."
 japan_canon.30.o0:0 "Now the promises fall due."
 japan_canon.30.t:0 "Borneo Is Won. The Bills Remain."
 japan_canon.31.d:0 "The council meets without its common enemy. Ito counts ships, Iwasaki debts, and Saigo lost months. Meiji must again keep them at one table. The first chapter ends; the contradictions survive."
 japan_canon.31.o0:0 "The empire still holds."
 japan_canon.31.t:0 "Three Heads Again"
 japan_canon.32.d:0 "Tokyo promises Mitsubishi a northern Borneo oil monopoly after victory. Iwasaki changes course: the company’s survival now depends on the southern expedition. Osaka retains its government and resumes supplying the fleet."
 japan_canon.32.o0:0 "Accept the state guarantee."
 japan_canon.32.t:0 "A Guarantee under the Imperial Seal"
 japan_canon.33.d:0 "Meiji confirms that Hokkaido will stay out of the Dutch war. Supplies from Honshu continue. Saigo gains time for his rituals and return to the continent; Tokyo gains respite from civil war."
 japan_canon.33.o0:0 "The north will wait."
 japan_canon.33.t:0 "Tokyo Recognises Northern Neutrality"
 japan_canon.4.d:0 "The Confederation attacks Japanese garrisons. Manila is occupied, but Luzon remains unconquered. Ito must keep part of his fleet in Philippine waters, weakening the coming Borneo expedition."
 japan_canon.4.o0:0 "Manila cannot be abandoned."
 japan_canon.4.t:0 "The April Offensive"
 japan_canon.5.d:0 "Japan demands northern Borneo, port access and compensation. Behind Ito stand Mitsubishi’s guarantees and the emperor’s promises. Surrendering the oil would only move the crisis to Batavia. The cabinet rejects the ultimatum."
 japan_canon.5.o0:0 "Borneo is not for sale."
 japan_canon.5.t:0 "Tokyo’s Ultimatum"
 japan_canon.6.d:0 "Batavia refuses. The fleet sails south, Osaka receives orders, and Hokkaido receives its promised silence. Japan is still divided; three parties temporarily benefit from the same order."
 japan_canon.6.o0:0 "Now we need victory."
 japan_canon.6.t:0 "War in Place of Unity"
 japan_canon.7.d:0 "Coal bills arrive faster than good news. Hospital ships return full. The war cabinet admits that its promised expedition has become a war of attrition."
 japan_canon.7.o0:0 "Revise the budget."
 japan_canon.7.t:0 "The Short War Is Over. The Long War Begins."
 japan_canon.8.d:0 "In spring 1895 Philippine resistance intensifies. The Confederation receives supplies and prepares an offensive. Japan cannot withdraw its garrisons even if Borneo demands the last reserves."
 japan_canon.8.o0:0 "Divide the reserves again."
 japan_canon.8.t:0 "Manila Returns to the Dispatches"
 japan_canon.9.d:0 "Creditors gain little from endless war. The Chamber plans talks for February 1896. Japan must hold a Borneo foothold or its oil guarantees will become worthless paper."
 japan_canon.9.o0:0 "Hold until February."
 japan_canon.9.t:0 "The WTC Proposes a Conference"
 japan_dragon.1.a:0 "Salvage the debt ledger."
 japan_dragon.1.d:0 "Osaka banks and merchants refuse to roll over Mitsubishi bills. Neither guarantees nor reform arrived in time. Supplies are frozen and the military budget must wait. Borrowing reform unlocks emergency restructuring."
 japan_dragon.1.t:0 "Mitsubishi Defaults on Its Bills"
 japan_dragon.2.a:0 "Recall the expedition and bear the cost."
 japan_dragon.2.b:0 "Stand firm: the expedition has our protection."
 japan_dragon.2.d:0 "Saigo’s secret expedition has reached Greenland. Danish representatives demand its recall, Britain considers intervention and Russian observers suspect plans for an Arctic base. The northern settlement gave Ito no control over this venture. Defending the expedition risks another war."
 japan_dragon.2.t:0 "Saigo’s Men in Greenland"
 japan_dragon.3.a:0 "Let them return."
 japan_dragon.3.d:0 "Ice and supply shortages have defeated the Greenland crossing. The expedition returns. A European crisis has been avoided, though Saigo’s supporters blame Tokyo."
 japan_dragon.3.t:0 "The Arctic Stops Saigo"
 japan_dragon.4.a:0 "Deliver a diplomatic protest."
 japan_dragon.4.d:0 "Japanese northerners have landed in Greenland. Denmark demands protection of its rights, Britain maritime guarantees, and Russia an explanation of Arctic intentions. Tokyo must recall the expedition or defend it."
 japan_dragon.4.t:0 "Protest over Saigo’s Expedition"
 japan_dragon.5.a:0 "Increase diplomatic pressure."
 japan_dragon.5.b:0 "Declare war on Japan."
 japan_dragon.5.d:0 "Ito refuses to recall Saigo’s men. We may increase diplomatic pressure or declare war on Japan. War would link the Arctic crisis to the struggle over Borneo and could start a wider chain of conflicts."
 japan_dragon.5.t:0 "Tokyo Defends the Greenland Expedition"
 japan_finance.1.audit:0 "Pay for an audit."
 japan_finance.1.d:0 "Osaka wants Philippine costs recorded as public liabilities and revenues as private income. Iwasaki warns that the yards need his advance. The emperor can fund an audit or accept sealed accounts."
 japan_finance.1.seal:0 "Accept their figures for now."
 japan_finance.1.t:0 "Whose Accounts Are These?"
 japan_finance.2.advance:0 "Take a private advance."
 japan_finance.2.d:0 "Mitsubishi’s guarantees are promised. Public registration restores confidence; a private advance immediately equips the fleet. Both preserve the promised postwar monopoly."
 japan_finance.2.public:0 "Register the guarantees publicly."
 japan_finance.2.t:0 "A Signature Against Future Oil"
 japan_finance.3.d:0 "The yards demand payment. Paying produces transports and increases debt. Deferral saves treasury resources but leaves unpaid workers."
 japan_finance.3.defer:0 "Defer payment."
 japan_finance.3.pay:0 "Pay the invoice now."
 japan_finance.3.t:0 "The Admiralty’s Invoice"
 japan_finance.4.advance:0 "Accept another Osaka advance."
 japan_finance.4.d:0 "On paper the treasury remains solvent. Today it cannot cover wages, coal and benefits together. Iwasaki offers another advance; the admirals demand priority."
 japan_finance.4.fleet:0 "Pay the fleet; families must wait."
 japan_finance.4.freeze:0 "Freeze orders and admit the shortfall."
 japan_finance.4.t:0 "No Cash Until Monday"
 japan_finance.5.credit:0 "Sign the credit agreement."
 japan_finance.5.d:0 "The Chamber offers shipping against future payments and insurance. Mitsubishi pressure rises by 14 and Chamber debt by 15. Refusal requires immediate civilian retrenchment."
 japan_finance.5.domestic:0 "Cut domestic expenditure."
 japan_finance.5.t:0 "Madeira Bridge Credit"
 japan_finance.6.creditors:0 "Service the major creditors first."
 japan_finance.6.d:0 "Borneo royalties finally reach Osaka. Creditors demand priority. Sailors’ families ask why victory delays their benefits again."
 japan_finance.6.families:0 "Repay the families."
 japan_finance.6.t:0 "Oil Without Free Cash"
 japan_industry.1.a:0 "The squadron is ready."
 japan_industry.1.copied_samples_airship_hangars:0 "The Chamber knows our materials lists, but we deny the origin of copied assemblies. Slow work did not eliminate the risks of our limited intelligence network. Scarlet airships pass above the coast; their speed was bought by forgoing heavy reinforcements. Transports carry portable towers for the first beachhead."
 japan_industry.1.copied_samples_kure_yards:0 "The Chamber knows our materials lists, but we deny the origin of copied assemblies. Slow work did not eliminate the risks of our limited intelligence network. Heavy scarlet ships from Kure extend their tentacles. Transports carry portable towers for the first beachhead."
 japan_industry.1.kyushu_coal_airship_hangars:0 "Closed ports produced rough but independent industry. Kyushu coal fills the bunkers. Scarlet airships pass above the coast; their speed was bought by forgoing heavy reinforcements. Transports carry portable towers for the first beachhead."
 japan_industry.1.kyushu_coal_kure_yards:0 "Closed ports produced rough but independent industry. Kyushu coal fills the bunkers. Heavy scarlet ships from Kure extend their tentacles. Transports carry portable towers for the first beachhead."
 japan_industry.1.oil_hunger_airship_hangars:0 "Domestic workshops sustain a coal-fired fleet, while our future oil programme requires the fields of Borneo. Scarlet airships pass above the coast; their speed was bought by forgoing heavy reinforcements. Transports carry portable towers for the first beachhead."
 japan_industry.1.oil_hunger_kure_yards:0 "Domestic workshops sustain a coal-fired fleet, while our future oil programme requires the fields of Borneo. Heavy scarlet ships from Kure extend their tentacles. Transports carry portable towers for the first beachhead."
 japan_industry.1.proxy_machines_airship_hangars:0 "The Chamber sees our procurement. Front companies quickly delivered foreign machinery, leaving a trail that may expose our preparations. Scarlet airships pass above the coast; their speed was bought by forgoing heavy reinforcements. Transports carry portable towers for the first beachhead."
 japan_industry.1.proxy_machines_kure_yards:0 "The Chamber sees our procurement. Front companies quickly delivered foreign machinery, leaving a trail that may expose our preparations. Heavy scarlet ships from Kure extend their tentacles. Transports carry portable towers for the first beachhead."
 japan_industry.1.t:0 "Scarlet Sails"
 japan_luzon.1.a:0 "Fund extra supplies."
 japan_luzon.1.b:0 "Shorten the perimeter."
 japan_luzon.1.d:0 "The port is held, its inland roads are not. Ito can finance extra supplies or order the same men to hold a smaller perimeter."
 japan_luzon.1.t:0 "Manila Requests Another Sailing"
 japan_luzon.2.a:0 "Divert escorts from Borneo."
 japan_luzon.2.b:0 "Manila must manage with less."
 japan_luzon.2.d:0 "Not every missing transport was sunk by the Confederation. Duplicate manifests and insurers’ demands complicate the losses. Assign escorts or cut the garrison’s ration?"
 japan_luzon.2.t:0 "An Insurance Claim in the Strait"
 japan_luzon.3.a:0 "Fund medical evacuation."
 japan_luzon.3.b:0 "The newspapers must report endurance."
 japan_luzon.3.d:0 "Fever outnumbers wounds on the sick lists. Hospitals cost money; orders to endure excite newspapers without restoring men."
 japan_luzon.3.t:0 "The Infirmary Is Full"
 japan_luzon.4.a:0 "Investigate the suppliers."
 japan_luzon.4.b:0 "Leave wartime contracts alone."
 japan_luzon.4.d:0 "The treasury feeds a unit found neither at port nor in the hills. Respected suppliers are implicated. An inquiry will cut losses and disrupt established purchases."
 japan_luzon.4.t:0 "The Battalion That Never Was"
 japan_luzon.5.a:0 "Return escorts to Manila."
 japan_luzon.5.b:0 "Ask for renewed effort in victory’s name."
 japan_luzon.5.d:0 "Tokyo hears victory salutes more clearly than garrison requests. Released escorts can return to Luzon, on another treasury invoice."
 japan_luzon.5.t:0 "Borneo Peace, Manila War"
 japan_luzon.6.a:0 "Fund evacuation and regrouping."
 japan_luzon.6.b:0 "Order the remaining positions held."
 japan_luzon.6.d:0 "The garrison’s message took a diversion. Losing the pier invalidates old plans. Evacuation costs money; holding on increases fatigue."
 japan_luzon.6.t:0 "Manila’s Pier Is Lost"
 japan_north.1.a:0 "Load the promised crates."
 japan_north.1.b:0 "Request a written postponement."
 japan_north.1.c:0 "Send a commission first."
 japan_north.1.d:0 "Saigo wants no seat on Ito’s staff; he wants his delivery. Supply, postponement or inspection will be judged by both Hokkaido and the Admiralty."
 japan_north.1.e:0 "The fleet needs it more. Cancel the sailing."
 japan_north.1.t:0 "The Next Sailing Telegram"
 japan_north.2.a:0 "Inspect cargo, not soldiers."
 japan_north.2.b:0 "Demand full access."
 japan_north.2.c:0 "Fund an imperial mediator."
 japan_north.2.d:0 "The commission may inspect waybills, but Saigo forbids unit registers. The Admiralty wants proof that neutrality is not a cover for revolt."
 japan_north.2.t:0 "Beyond the Northern Warehouse Door"
 japan_north.3.a:0 "Fund renewed mediation."
 japan_north.3.b:0 "Acknowledge the limits of our authority."
 japan_north.3.d:0 "The North closes its warehouses to Tokyo. Ito says concessions reward defiance. Civil war is not imminent, but signatures no longer ensure cooperation."
 japan_north.3.t:0 "The Protocol Has Broken Down"
 japan_north.4.a:0 "Appropriate funds to the Admiralty."
 japan_north.4.b:0 "Uphold the northern agreement."
 japan_north.4.d:0 "The admirals compare neutral northern deliveries with Borneo losses. They demand compensation before their next telegram indicts the cabinet."
 japan_north.4.t:0 "Ito Counts the Northern Transports"
 japan_north.5.a:0 "Arrange a personal audience."
 japan_north.5.b:0 "Finish demobilisation first."
 japan_north.5.d:0 "Saigo returns unanswered prewar letters. Temporary neutrality survived the war. Will Tokyo keep its word without a common enemy?"
 japan_north.5.t:0 "After the Victory Bulletins"
 japan_north.6.a:0 "Sign and dispatch the supplies."
 japan_north.6.b:0 "The terms need further discussion."
 japan_north.6.d:0 "Saigo accepts permanent deliveries under his own command. Predictable costs replace emergency charters. This is coexistence, with separate armies."
 japan_north.6.t:0 "Compact of Two Shores"
 japan_paths.1.a:0 "Fund the training cadre"
 japan_paths.1.b:0 "Approve only the charter for now"
 japan_paths.1.d:0 "Ito presents a list of instructors whom the army is unwilling to release. Funding a separate training cadre could postpone the dispute over command. A charter alone will not teach men to land under fire."
 japan_paths.1.t:0 "Charter of the Sea Samurai"
 japan_paths.2.a:0 "Open volunteer schools"
 japan_paths.2.b:0 "Hold closed hearings"
 japan_paths.2.d:0 "The envoys bring accounts of the Song and ask for volunteer schools. They promise discipline, but not obedience to the naval ministry. Admirals demand closed hearings; Saigo’s supporters demand a public platform."
 japan_paths.2.t:0 "Envoys of the Pure Land"
 japan_paths.3.a:0 "Fund an independent audit"
 japan_paths.3.b:0 "Prepare a confidential memorandum"
 japan_paths.3.d:0 "Osaka draws up two estimates: the cost of continuing the war and the price of ending it. The Chamber asks about collateral; bankers ask about repayment priority. Iwasaki proposes opening his own ledgers first."
 japan_paths.3.t:0 "The Price of a Future Peace"
 japan_paths.4.a:0 "Establish a soldiers’ family fund"
 japan_paths.4.b:0 "Issue a proclamation"
 japan_paths.4.d:0 "The priests disagree about where purification begins. Some demand a proclamation; others point to bereaved families unable to buy rice. A common fund would build support in the villages, but requires state organisation."
 japan_paths.4.t:0 "First Assembly of Shrines"
 japan_paths.5.a:0 "Reconcile every ministry’s accounts"
 japan_paths.5.b:0 "Standardise the reports first"
 japan_paths.5.d:0 "Fleet, army and Osaka bank reports lie on the same desk for the first time. Their figures disagree. Officials propose standardising the forms; Meiji can demand a real reconciliation and face every ministry’s resentment."
 japan_paths.5.t:0 "Office of Personal Reports"
 ludolf.1.a:0 "Dispatch a trade delegation."
 ludolf.1.d:0 "The World Trade Chamber has received Batavia’s proposal. Rubber and oil purchases, shipping insurance and warehouses must be agreed. The governor wants foreign capital without surrendering colonial administration."
 ludolf.1.t:0 "Oil, Rubber and Guarantees"
 ludolf.10.a:0 "Authority must be backed by trust."
 ludolf.10.d:0 "Rejecting outside alliances leaves Batavia alone against maritime threats. The admirals demand a voice in the budget. Ludolf retains civilian authority but must earn the officers’ respect through action.\n\nThe balance measures political control; Council respect determines its willingness to cooperate."
 ludolf.10.t:0 "The Governor and the Naval Ministry"
 ludolf.2.a:0 "Accept Batavia’s invitation."
 ludolf.2.d:0 "The East Indies offers the Chamber long-term oil and rubber deliveries. Our representatives are invited to discuss prices, port fees and insurance. This is an opportunity to expand commerce without assuming direct administration."
 ludolf.2.t:0 "The Batavia Resource Contract"
 ludolf.20.a:0 "Sign. We cannot sustain another campaign."
 ludolf.20.b:0 "Continue the war despite the Council."
 ludolf.20.d:0 "The Convention transfers states 1024, 1023 and 1059 to Japan; the East Indies receive 333 and 1022. Japan receives Borneo oil and rubber rights. Temporary militia will disband and the government must face the defeat."
 ludolf.20.t:0 "The Borneo Peace Terms"
 ludolf.21.a:0 "The resource question is settled."
 ludolf.21.d:0 "Japan receives 1024, 1023 and 1059 under the Convention. Batavia receives 333 and 1022 and recognises Japanese oil and rubber rights across Borneo."
 ludolf.21.t:0 "The Borneo Convention"
 ludolf.30.a:0 "Begin with an inquiry and open accounts."
 ludolf.30.b:0 "Keep the cabinet and close the debate."
 ludolf.30.d:0 "Batavia debates who will pay for the Borneo Convention. The admirals demand an inquiry and a new cabinet; local rulers demand autonomy. Ludolf proposes a reorganisation preserving common defence while giving the sultans their own governments."
 ludolf.30.t:0 "Government After Defeat"
 ludolf.31.a:0 "Autonomy becomes a political force."
 ludolf.31.d:0 "The autonomous administrations have been established. Their delegates ask the council to retain Ludolf in exchange for a federal programme with active Indonesian participation. Japanese resource concessions remain in force."
 ludolf.31.t:0 "The Sultans Ask for a Second Chance"
 ludolf.32.a:0 "Recovery comes before revenge."
 ludolf.32.b:0 "Support the firebrands."
 ludolf.32.d:0 "Officer clubs and port districts speak of recovering Sabah and Brunei. Some demand immediate revenge; others want the fleet rebuilt first. Ludolf sees a chance to unite the country around a long reconstruction programme."
 ludolf.32.t:0 "The Lost North Remembered"
 ludolf.33.a:0 "Expand the councils inquiry."
 ludolf.33.b:0 "Defend civilian procedures."
 ludolf.33.c:0 "Reject the Council’s demands."
 ludolf.33.d:0 "The inquiry requests greater authority. Ludolf insists that the hearings must not become a predetermined transfer of power. Neither option dismisses him."
 ludolf.33.resign:0 "Agree to hand over power."
 ludolf.33.t:0 "The Council Demands an Account"
 ludolf.34.a:0 "Give the commission more authority."
 ludolf.34.b:0 "Protect civilian procedures."
 ludolf.34.d:0 "The admirals challenge the cabinet again. The balance of power influences the hearings but cannot remove Ludolf automatically."
 ludolf.34.t:0 "Further Explanations Required"
 ludolf.35.a:0 "The directorate takes control."
 ludolf.35.d:0 "The council dismisses and imprisons Ludolf for the lost war. Sultanate protests are rejected. The military directorate prepares purges across civilian and military institutions."
 ludolf.35.t:0 "Ludolf Under Arrest"
 ludolf.36.a:0 "Begin the federal transformation."
 ludolf.36.d:0 "The sultanates and Indonesian delegates preserve Ludolfs government on condition that he creates a democratic federation with equal citizenship and participation in choosing officials. The dismissal proceedings end."
 ludolf.36.t:0 "A Second Chance for a Different Country"
 pacific.1.a:0 "Sign the trade agreement."
 pacific.1.b:0 "They can barely stand on their own feet."
 pacific.1.d:0 "Batavia offers guaranteed rubber deliveries in exchange for mutual non-aggression. Industrialists support the agreement; the naval ministry demands control of the resources."
 pacific.1.t:0 "An Offer from Batavia"
 pacific.2.a:0 "Diplomacy has prevailed."
 pacific.2.d:0 "The agreement with Japan secures export markets and mutual guarantees of non-aggression. The ports are preparing for the first merchant ships."
 pacific.2.t:0 "The Convention Is Signed"
 pacific.3.a:0 "Accept the terms."
 pacific.3.b:0 "Our ports will remain independent."
 pacific.3.d:0 "Japanese representatives offer a trade convention and mutual non-aggression. Accepting will secure investment while tying our commerce to the empire."
 pacific.3.t:0 "A Japanese Trade Mission"
 pacific.4.a:0 "Concede to preserve peace."
 pacific.4.b:0 "Reject the ultimatum. We will defend ourselves."
 pacific.4.d:0 "Japan demands privileged access to Borneo’s resources. Acceptance preserves peace through economic concessions. Rejection means an immediate declaration of war."
 pacific.4.t:0 "The Naval Ministry Demands"
 pacific.5.a:0 "They can barely stand on their own feet."
 pacific.5.d:0 "The Dutch government has declared a policy of direct rivalry with Japan. The naval ministry proposes preparing a Borneo expedition in response."
 pacific.5.t:0 "Batavia Issues a Challenge"
 pacific.6.d:0 "Japan has answered our declared rivalry with the threat of a naval expedition. Its preparations proceed independently of our diplomatic choices. We must prepare Borneo’s defence."
 pacific.6.t:0 "Tokyo Accepts the Challenge"
 sabah_war.1.a:0 "Reinforce the Jesselton coastal defences."
 sabah_war.1.b:0 "Announce an emergency local conscription."
 sabah_war.1.d:0 "Lookouts at Tawau report smoke on the horizon: Japanese cruisers and destroyers have passed north of Jesselton. The port garrison demands reinforced coastal batteries before the guns speak."
 sabah_war.1.t:0 "Japanese Fleet Sighted off Sabah"
 sabah_war.2.a:0 "The squadron is through — prepare the landings."
 sabah_war.2.b:0 "Dutch submarines forced a withdrawal. Recalculate the approach route."
 sabah_war.2.d:0 "A Japanese light squadron pushes past the Dutch submarine screen and takes position to cover the landing fleet. The naval staff reports that the approach to Sabah is now largely clear."
 sabah_war.2.t:0 "Skirmish off Jesselton"
 sabah_war.3.a:0 "Pour in reinforcements — we cannot waste a moment."
 sabah_war.3.b:0 "Secure the beachhead before advancing inland."
 sabah_war.3.d:0 "Transports covered by heavy cruisers enter Sandakan Bay. The first Nankai Tokubetsu Rikusentai units are ashore. Jesselton and Sandakan are the primary objectives. Sabah must be ours."
 sabah_war.3.t:0 "Nankai Marines Land on Sabah!"
 sabah_war.4.a:0 "Mobilise reserves — we must retake Sabah!"
 sabah_war.4.b:0 "Accept the loss and hold Brunei at all costs."
 sabah_war.4.d:0 "Japanese marines have taken Jesselton and Sandakan. The Dutch garrison held for several days without relief before being overwhelmed. North Borneo flies the Japanese flag. Batavia is in mourning."
 sabah_war.4.t:0 "Sabah Has Fallen!"
 sabah_war.6.a:0 "Consolidate the victory and push south."
 sabah_war.6.d:0 "The Imperial fleet has established dominance over the Sulu Sea. With Sabah and Brunei in our hands and Dutch shipping driven off, the southern strategy bears fruit. Borneo is becoming a Japanese sphere of influence."
 sabah_war.6.t:0 "The Sulu Sea Is Ours"
 southern_war.2.a:0 "Review the revised deadline."
 southern_war.2.d:0 "Intelligence reports an earlier Japanese sailing schedule. The active invasion countdown has been shortened."
 southern_war.2.t:0 "Japan Accelerates Preparations"
 wtc_credit.1.a:0 "Concede fees for eight months."
 wtc_credit.1.b:0 "Pay the obligations now."
 wtc_credit.1.c:0 "Reject the demand."
 wtc_credit.1.d:0 "Debt has passed 70. Director Lambert demands port fees. Pay now, concede revenue or reject the demand and add to the debt."
 wtc_credit.1.t:0 "Madeira Demands Collateral"
 wtc_credit.10.a:0 "Preserve the common signature."
 wtc_credit.10.d:0 "The directorate has three voices and one signature. Bankers defend Silver Convoy; technocrats seek Tesla; the secret department offers cables, pirates and disappearing names. Nobody knows whether Lambert is a person. Everybody knows their orders need British ships."
 wtc_credit.10.t:0 "Who Signs Lambert?"
 wtc_credit.11.a:0 "Contract the laboratories."
 wtc_credit.11.d:0 "Technocrats propose instruments and telegraph laboratories. The Old Guard fears independent power will bypass the insurer. Their priority opens laboratory contracts to subscribers."
 wtc_credit.11.t:0 "Tesla Does Not Ask Permission"
 wtc_credit.12.a:0 "Sign without a seal."
 wtc_credit.12.d:0 "The Secret Department offers to pay yesterday’s raiders for safe corridors. Straits Guards arrange meetings; British intelligence supplies names. Insured clients gain the channel at a reputational cost."
 wtc_credit.12.t:0 "Pirates with the Right Waybills"
 wtc_credit.2.a:0 "Find money for repayment."
 wtc_credit.2.d:0 "Debt exceeds 90. Cable messages are delayed. British cover enables blacklisting; without that shield the Chamber retains cable leverage but loses maritime enforcement."
 wtc_credit.2.t:0 "Exclusion from the Trade Book"
 wtc_credit.20.a:0 "Send the draft to the British cabinet."
 wtc_credit.20.d:0 "Batavia proposes rapprochement between European island societies as a first step towards possible union. London must consent. The Japanese deadline remains unchanged."
 wtc_credit.20.t:0 "A Letter on European Democracy"
 wtc_credit.21.a:0 "Receive the delegation."
 wtc_credit.21.b:0 "Keep the exchange diplomatic."
 wtc_credit.21.d:0 "The Netherlands proposes a common democratic course and future union talks. Receiving a delegation commits neither fleet, colonies nor crown."
 wtc_credit.21.t:0 "Batavia’s Union Proposal"
 wtc_credit.22.a:0 "Ratify the trading councils’ contract."
 wtc_credit.22.d:0 "Trading councils give democratic groups a voice. The Chamber offers cable priority and insurance for another ten debt points. Chamber cooperation and democratic growth become a distinct political course."
 wtc_credit.22.t:0 "Democracy Under an Insurance Seal"
 wtc_credit.3.a:0 "Accept the receivership."
 wtc_credit.3.b:0 "Redeem the debt with an emergency levy."
 wtc_credit.3.c:0 "Without British ships the order fails."
 wtc_credit.3.d:0 "Debt has reached 100. The Secret Department has prepared a local receivership cabinet. The Chamber cannot govern our provinces itself. Without British cover the operation fails; otherwise only an emergency redemption can avert it."
 wtc_credit.3.t:0 "The Final Promissory Note"
 A01_constitution.a:0 "Long live the new constitution!"
 A01_constitution.d:0 "The Constitution of 1854 was written in Amsterdam for a colony governed from the mother country. That country is gone. Amsterdam lies beneath the Song.\n\nThe new constitution will revise the articles governing the indigenous peoples of the Indonesian archipelago: civil rights, land ownership and military service."
 A01_constitution.t:0 "The Constitution of 1854"
 A01_japan.1.a:0 "We should prepare for the worst."
 A01_japan.1.d:0 "The Japanese government has rejected our proposed non-aggression pact and refused to discuss limited access to the rubber forests. Instead, Tokyo has issued an ultimatum: Batavia must grant Japan extensive rights to oil and rubber and admit Japanese representatives to key ports. Accepting these demands would mean surrendering our sovereignty."
 A01_japan.1.t:0 "Japan Rejects Our Proposal"
 A01_japan.4.a:0 "Hatred has emerged from hiding."
 A01_japan.4.d:0 "The calm following martial law proved deceptive. Armed groups have appeared in rural Borneo, supported by local residents and Japanese agents. The colonial administration is losing control of roads and plantations."
 A01_japan.4.t:0 "The Partisan Movement Gathers Strength"
 A01_japan.5.a:0 "We will meet them on the shore."
 A01_japan.5.d:0 "The Japanese ultimatum has expired. Intelligence reports transports and warships approaching Borneo. Japan has declared war on Batavia, making the island’s oilfields and rubber plantations the principal targets of its offensive."
 A01_japan.5.t:0 "The Japanese Offensive on Borneo"
