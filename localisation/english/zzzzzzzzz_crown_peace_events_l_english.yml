l_english:
 A01_crown.1.t:0 "The Grand Council’s Last Ultimatum"
 A01_crown.1.d:0 "Behind closed doors, admirals and island dignitaries demand a veto over decrees and ministerial appointments. The Guard awaits the Queen’s command. Will the monarchy rest on an agreement or the authority of a new court?"
 A01_crown.1.a:0 "Recognise the Council’s appointments"
 A01_crown.1.b:0 "Negotiate a division of powers"
 A01_crown.1.c:0 "The Guard will remind them of their oath"
 A01_crown.2.t:0 "Petitions of the Grand Council"
 A01_crown.2.d:0 "The Council delays appointments and demands budget concessions. The court proposes a direct appeal to the public. Until the fundamental law is settled, the struggle will continue."
 A01_crown.2.a:0 "Give the Council a seat at the table"
 A01_crown.2.b:0 "Appeal directly to our subjects"
 A01_crown.3.t:0 "A Plot in the Palace Corridors"
 A01_crown.3.d:0 "Court influence is nearly absolute. Several councillors secretly discuss removing the royal ministers. The Queen can retreat toward a settlement or order the Guard to arrest the plotters at the cost of a political crisis."
 A01_crown.3.a:0 "Restore some Council powers"
 A01_crown.3.b:0 "Arrest the conspirators"
 A01_crown_struggle_desc:0 "Balance court and Council for a Constitution (−40%…+40%), or reach 60% royal influence for full authority. A strong Council obstructs government; excessive court power risks a plot."
 A01_crown_audiences_desc:0 "Public audiences: +15 royal influence, +2% stability. Repeat after 60 days."
 A01_council_concessions_desc:0 "Budget negotiations: −15 royal influence. Part of the political cost is refunded."
 A01_guard_oaths_desc:0 "Guard oaths: +20 royal influence and 10 army experience, but −2% stability."
 A01_crown_compromise_desc:0 "The commission moves the balance 20 points toward the centre and grants +3% stability."
 A10_japanese_settlement:0 "Peace with Japan"
 A10_offer_archipelago_peace:0 "Offer Peace: A Free Archipelago"
 A10_offer_archipelago_peace_desc:0 "Japan has been expelled from the archipelago. Request recognition of the liberation of its possessions, including Manila, Bataan, northern Luzon and Palawan. Confederate subjects’ control counts. Japan can refuse."
 A10_offer_manila_peace:0 "Offer Peace: The Manila Compromise"
 A10_offer_manila_peace_desc:0 "We hold Manila while northern Luzon and Bataan remain under Japanese control. Request Manila in a peace settlement; northern Luzon, Bataan and Japan’s other possessions remain Japanese."
 A10_settlement.1.t:0 "The Philippine Peace Offer"
 A10_settlement.1.d:0 "Our garrisons have been expelled from the Philippine archipelago. The island government offers peace in exchange for recognition of liberated Japanese possessions. The offer concerns the Philippine front."
 A10_settlement.2.t:0 "The Manila Compromise Offer"
 A10_settlement.2.d:0 "The Filipinos hold Manila and offer peace in exchange for recognition of its liberation. Northern Luzon, Bataan and our other possessions would remain Japanese."
 A10_settlement.accept:0 "Accept the terms"
 A10_settlement.reject:0 "Continue the war"
 A10_settlement.3.t:0 "The Archipelago Is Free"
 A10_settlement.3.d:0 "Japan has recognised the liberation of its Philippine possessions. Peace is signed, and confederate members retain the states they liberated."
 A10_settlement.3.a:0 "The islands have secured their freedom"
 A10_settlement.4.t:0 "The Manila Compromise"
 A10_settlement.4.d:0 "Manila is recognised as free, and the war has ended. Northern Luzon and Bataan remain Japanese: a bitter price for peace."
 A10_settlement.4.a:0 "Preserve what we have gained"
 A10_settlement.5.t:0 "Japan Rejects the Terms"
 A10_settlement.5.d:0 "Tokyo has refused to sign. The war continues. Another offer can be sent after the diplomatic cooldown."
 A10_settlement.5.a:0 "Continue the struggle"
