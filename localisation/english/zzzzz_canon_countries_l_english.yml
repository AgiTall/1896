 PAZ_prophet_name:0 "Prophet of the Fifth Sun"
 PAZ_prophet_advisor:0 "Prophet of the Fifth Sun"
 A03_naval_commander_name:0 "Admiral Ito"
 A03_PACIFIC_START_DESC:0 "§YEmpire of the Southern Seas§!\n\nFrom Tokyo, Emperor Meiji rules a power embodied by Admiral Ito’s fleet. Saigo’s Northern Army holds Hokkaido, while Iwasaki governs commercial Osaka. Manila is occupied, but subduing the Philippines has proved harder than taking a port. Further expansion requires oil, and the fleet looks towards Borneo.\n\n§YOn the threshold of 1893: §!Secure fuel for the fleet and decide the fate of the divided archipelago."
 A02_CANON_START_DESC:0 "§YA Crown over the Seas§!\n\nLondon lies beyond the Song. On Malta, Victoria preserves the dignity of the empire while Admiral Fisher holds its scattered possessions together with the fleet. From Gibraltar to New Zealand, British harbours survive on trade, debt and the hope of returning home.\n\n§YOn the threshold of 1893: §!Hold the sea lanes and find a way home."
 A06_CANON_START_DESC:0 "§YA New Petersburg§!\n\nIceland shelters the emperor, his court and the name of a fallen empire. Alexander III seeks a future for Russian exile, but Pobedonostsev sees modernisation as a threat to faith and order. While the court debates Tesla’s work, the shortage of people grows more dangerous than any foreign enemy.\n\n§YOn the threshold of 1893: §!Reconcile faith and science while preserving a people in exile."
 A07_CANON_START_DESC:0 "§YThe Last Continent§!\n\nAustralia survived the collapse of the old world and became a refuge for those who escaped by sea. Henry Parkes must bind distant settlements into one state. Britain remains close, but Japanese expansion and the dispute with Batavia over New Guinea demand an independent course.\n\n§YOn the threshold of 1893: §!Strengthen the dominion and defend its northern approaches."
 A08_CANON_START_DESC:0 "§YThe Northern Oath§!\n\nOn Hokkaido, Saigo Takamori’s army guards its own vision of Japan’s destiny. Military discipline and Shinto faith stand against the southern fleet and Osaka’s trading houses. The archipelago is divided, but none of its rulers considers the division final.\n\n§YOn the threshold of 1893: §!Define the North’s place in a future united Japan."
 A09_CANON_START_DESC:0 "§YThe Gold of Osaka§!\n\nIn Osaka, trade holds power. Iwasaki Yanosuke steers the republic between the imperial fleet and the Northern Army as Mitsubishi’s debts narrow its choices. Factories and maritime connections provide strength, but gold alone may not preserve independence.\n\n§YOn the threshold of 1893: §!Turn commercial influence into a secure future."
 A05_CANON_START_DESC:0 "§YThe Iron Harbour§!\n\nExiles from the fallen American North have found a new foothold in Havana. Admiral Graves holds the Iron Union together through military discipline, but Cuba is divided between irreconcilable heirs of the old world. The struggle for the islands has already become a war.\n\n§YOn the threshold of 1893: §!Survive the Caribbean war and hold Havana."
 PCF_CANON_START_DESC:0 "§YThe Last Plantations§!\n\nIn central Cuba, Senator Beauregard gathers the heirs of the American South. Their power rests on plantations and old privileges, while the Iron Union and the followers of the Fifth Sun fight around them. Escape from the Song has brought no peace.\n\n§YOn the threshold of 1893: §!Preserve the Confederacy’s holdings among the warring Caribbean powers."
 PAZ_CANON_START_DESC:0 "§YAwaiting the Fifth Sun§!\n\nHernandez has united Mexican exiles with a promise of rebirth. In eastern Cuba and Hispaniola, military power rests on the preaching of the Prophet of the Fifth Sun. Neighbours see the new movement as a threat; its followers see the beginning of another age.\n\n§YOn the threshold of 1893: §!Hold army and faith together through the Caribbean war."
 PHR_CANON_START_DESC:0 "§YVoices of the Hurricane§!\n\nIn Haiti, Maman Brigitte leads communities that survived the fall of the continents. Faith binds them more tightly than old laws, but the Caribbean war leaves no safe shores. Across the straits wait armies that see the island as their next prize.\n\n§YOn the threshold of 1893: §!Defend the communities and preserve control of the island."
 A10_CANON_START_DESC:0 "§YThe Islands at a Crossroads§!\n\nManila, Bataan and northern Luzon are occupied by Japan. Only Cavite accepts central authority unconditionally. Local governments across the other islands demand self-rule.\n\n§YOn the threshold of 1893: §!Build a confederation with a common army or a united federation. Strike during the Japanese war against the Dutch and reclaim Luzon."
 PLS_CANON_START_DESC:0 "§YFaith in the Mountains§!\n\nAfter the fall of Manila, the Catholic Republic emerged in the mountains of northern Luzon. Emilio Aguinaldo seeks the strength to fight the Japanese garrisons. The Confederation may become an ally, but a shared danger does not yet mean agreement over the islands’ future.\n\n§YOn the threshold of 1893: §!Preserve a stronghold of resistance and find allies."
 PSL_CANON_START_DESC:0 "§YBetween the Great Fleets§!\n\nSultan Jamalul Kiram II rules islands where sea routes matter more than land borders. Sulu is slow to trust either the Confederation or Japan. Foreign protection promises safety, but its price may prove greater than the military threat.\n\n§YOn the threshold of 1893: §!Preserve independence at the crossroads of the sea lanes."
 PHW_CANON_START_DESC:0 "§YA Crown in the Ocean§!\n\nKalakaua’s kingdom stands at the crossroads of the Pacific. To the great powers, Hawaiian harbours are coveted bases; to the islanders, they are the foundation of an independent life. Distant wars draw ever closer to this refuge.\n\n§YOn the threshold of 1893: §!Preserve the kingdom among rival maritime powers."
 PZ_british_admiralty:0 "Crown and Admiralty"
 PZ_british_admiralty_desc:0 "Victoria retains the crown, but Admiral John Fisher holds effective power. Malta shelters exiled monarchs and directs the struggle over sea routes."
 PZ_russian_dual_power:0 "Emperor and Pobedonostsev"
 PZ_russian_dual_power_desc:0 "Alexander III rules the empire in exile. Konstantin Pobedonostsev opposes modernisation and condemns Tesla. Their conflict remains unresolved."
 PZ_aztec_prophecy:0 "The Fifth Sun"
 PZ_aztec_prophecy_desc:0 "Generalissimo Hernandez relies on the Prophet of the Fifth Sun. Military power and religious prophecy unite the Mexican exiles."
 PZ_philippine_confederation:0 "A Confederation in Formation"
 PZ_philippine_confederation_desc:0 "The government in exile seeks to unite the islands against Japan. Cebu and Panay retain their governments; Sulu distrusts the centre."
 A04_CANON_START_DESC:0 "§YThe Price of Survival§!\n\nThe World Trade Chamber has no empire on the map: its power is recorded in ledgers. From Funchal, Director Lambert binds the islands with credit, warehouses and trade agreements. Every new war threatens the sea lanes; every new technology may undermine the old debts.\n\n§YOn the threshold of 1893: §!Preserve influence in a world on the verge of change."
 PSY_CANON_START_DESC:0 "§YZanzibar in Exile§!\n\nBarghash’s heir has brought the sultanate to the Seychelles. The ocean shielded the new court from the Song but separated it from its old possessions. Between commerce and the memory of a lost home, the exiles must find a foundation for the future.\n\n§YOn the threshold of 1893: §!Strengthen the sultanate’s island refuge."
 PCB_CANON_START_DESC:0 "§YHarbour of the Trading Houses§!\n\nCebu’s council of trading houses values open harbours and its own authority. The Confederation calls the island to a common banner, while Japan’s advance threatens established trade. Neutrality becomes an increasingly costly choice.\n\n§YOn the threshold of 1893: §!Preserve trade and define relations with the Confederation."
 PPN_CANON_START_DESC:0 "§YA Union of Communities§!\n\nOn Panay, a council of caciques holds together a union of farming communities. The islanders are reluctant to exchange local freedom for orders from a distant capital, but the sea no longer guarantees safety. The Confederation’s future also depends on this island’s choice.\n\n§YOn the threshold of 1893: §!Defend the communities and their right to choose their own path."
