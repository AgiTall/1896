 A10W_PACIFIC_ADJ:0 "Pacific Metropolitan"
 A10W_accounts_tt:0 "Unlocks periodic account reconciliation: political power can reduce debt and charter disputes."
 A10W_colony_draft_tt:0 "Prepares a colonial project. Actual subjection requires a peaceful convention and Madeira’s separate consent."
 A10W_metropole_draft_tt:0 "Prepares an independent commercial centre. Madeira may voluntarily recognize it and become an autonomous Atlantic office."
 A10W_colony_convention_tt:0 "Offers the Chamber voluntary subjection. Requires an accepted oath, both countries at peace and independent, no island subjects and compatible faction obligations. An empty island faction is dissolved only upon the Chamber’s acceptance. Refusal preserves the charter and permits renewed talks."
 A10W_metropole_convention_tt:0 "Invites Madeira to become an autonomous office under our supremacy voluntarily. Requires an accepted oath, peace, independence, compatible factions and no Madeiran subjects. No territory changes hands. A provisional exchange operates until Manila is recovered; refused talks may be renewed."
 A10W_voluntary_office_tt:0 "The World Trade Chamber voluntarily becomes an autonomous subject of the A10 island metropole. Its territory remains its own, its troops are not transferred and participation in wars is optional."
 A10W_charter_book:0 "Island Charter Book"
 A10W_charter_book_desc:0 "Charter tension: §Y[?A10W_charter_tension|0]/100§!\nDebt to the Chamber: §Y[?WTC_debt|0]/100§!\n\nBonded customs, export leases and the supreme directorate each add §R1§! tension monthly. Debt above 70 adds another §R2§!. Harbour hospitals remove §G1§! monthly. Strikes begin above 59; above 89 an emergency dispute can occur once every six months. Mediation and open accounts preserve the contractual order."
 A10W_renew_oath:0 "Renew Correspondence with Madeira"
 A10W_renew_oath_desc:0 "New agents will repeat the petition to recognize our oath. Correspondence may resume six months after the previous approach; recognition does not automatically make the country a subject."
 A10W_renew_colonial_convention:0 "Renew the Colonial Convention"
 A10W_renew_colonial_convention_desc:0 "Talks require both parties at peace and independent, an accepted oath and no island subjects. Only our own empty faction may be dissolved. The Chamber must be outside a faction or lead its own; its directorate retains the final choice."
 A10W_renew_metropolitan_convention:0 "Reconvene the Manila Convention"
 A10W_renew_metropolitan_convention_desc:0 "A renewed invitation for Madeira to accept the supreme island centre voluntarily. Requires peace, independence, an accepted oath and no Chamber subjects. We must be outside a faction or lead it; the Chamber must be outside a faction, a nonleading member of ours, or the leader of an empty faction."
 A10W_public_accounts:0 "Publish Reconciled Accounts"
 A10W_public_accounts_desc:0 "Treasury agents will eliminate duplicate claims. Political expenditure reduces debt by 5 and charter tension by 5."
 A10W_port_arbitration:0 "Convene Harbour Arbitrators"
 A10W_port_arbitration_desc:0 "Dockers, tenants and warehouse holders will address current disputes before work stops. Charter tension falls by 12."
 A10W_fund_harbour_hospitals:0 "Fund Emergency Harbour Relief"
 A10W_fund_harbour_hospitals_desc:0 "Aid to families and patients reduces charter tension by 20. Providing relief for ninety days raises current treasury expenditure."
 A10W_customs_advance:0 "Take a Customs Advance"
 A10W_customs_advance_desc:0 "With the oath recognized and the Chamber reachable, obtain 15 convoys for 12 new debt. Assigning future revenues raises charter tension by 10."
 A10W_local_bond_sale:0 "Issue Island Bonds"
 A10W_local_bond_sale_desc:0 "Local holders will purchase 8 of the external debt. New obligations burden the treasury for 120 days and raise charter tension by 10."
 A10W_move_exchange_to_manila:0 "Open the Supreme Exchange in Manila"
 A10W_move_exchange_to_manila_desc:0 "After peacefully recovering Manila and obtaining the Chamber’s recognition, move the island clearing centre there. The capital moves within our own possessions; no foreign territory is involved."
 A10W_underwriting_reserve:0 "Replenish the Underwriting Reserve"
 A10W_underwriting_reserve_desc:0 "Local contributions fund six months of convoy insurance. This is not a new external loan, but the contributions raise charter tension by 5."
 A10W_constabulary_drill:0 "Drill the Charter Constabulary"
 A10W_constabulary_drill_desc:0 "Two hundred rifles will be used in training island companies. Reliable service and payroll inspection provide army experience and reduce charter tension."
 A10W_cable_school:0 "Recruit Cable School Apprentices"
 A10W_cable_school_desc:0 "Fund a six-month agreement for instructors and local apprentices. The islands gain technical knowledge, while new positions ease charter disputes."
 A10W_path.1.t:0 "An Oath from the Island Council"
 A10W_path.1.d:0 "A document has arrived from the islands: their council offers to recognize the Chamber’s contractual order and open its accounts to our agents. The delegates request insurance, cable priority and recognition of their government.\n\nRecognizing the oath does not yet make the islands a colony. The directorate must decide whether to lend them the Chamber’s name while the terms of a future settlement remain open."
 A10W_path.1.a:0 "Recognize the oath; future concessions require separate talks."
 A10W_path.1.b:0 "Retain ordinary commercial correspondence."
 A10W_path.2.t:0 "Madeira Accepts the Document"
 A10W_path.2.d:0 "The reply carries the Chamber’s mark and its familiar closed signature. The oath is recognized, and agents may negotiate insurance and cable access.\n\nWhether the islands remain a sovereign partner, become a colony or receive the principal clearing centre remains undecided. New signatures will be required."
 A10W_path.2.a:0 "Now examine every clause."
 A10W_path.3.t:0 "Madeira’s Closed Book"
 A10W_path.3.d:0 "No valid recognition of our oath has arrived. The directorate may have judged it premature, communications may have failed, or war and foreign protection may have made the promises impossible.\n\nThe island council will continue organizing accounts and harbours on its own responsibility. Agents may return after six months. Without a ratified convention, neither colonial clauses nor metropolitan claims alter sovereignty."
 A10W_path.3.a:0 "We will open our own books regardless."
 A10W_path.8.t:0 "Who May Read the Ledger?"
 A10W_path.8.d:0 "Delegates agree that contracts must be counted, but dispute who may read them. Dockers demand seats for their agents, provincial treasuries seek published rates, and the largest houses want rapid approval of credit.\n\nThe chair proposes either broader representation at a cost to the treasury, or immediate capital from major contract holders. This choice will shape the islands’ reception of the future charter."
 A10W_path.8.a:0 "Give the ports seats and fund public hearings."
 A10W_path.8.b:0 "Take the houses’ capital and expedite the agreement."
 A10W_path.10.t:0 "The Islands Offer a Colonial Convention"
 A10W_path.10.d:0 "The island council has completed its proposal of dependency: external obligations pass beneath the Chamber’s supreme seal, while local courts and armed guards remain. In return, the islands seek recognition, debt relief and daily administration through their own council.\n\nThis is a voluntary exception proposed by the islands themselves. The Chamber receives no new army and takes no provinces directly. Ratification establishes actual colonial subjection of the local government."
 A10W_path.10.a:0 "Ratify the voluntary island colony."
 A10W_path.10.b:0 "Local contracts are sufficient for now."
 A10W_path.11.t:0 "Two Seals on the Colonial Charter"
 A10W_path.11.d:0 "The convention is ratified. The island council recognizes the Chamber’s supremacy, and its directorate recognizes local government and the limits of its own demands. Some old debt has been discharged, but administration and assigned revenues will continue to burden the treasury.\n\nA resident will take a seat on the council. Island guards retain their own command; no signature can replace the people on the quays."
 A10W_path.11.a:0 "Uphold the charter and watch its cost."
 A10W_path.12.t:0 "The Convention Has Not Entered into Force"
 A10W_path.12.d:0 "The colonial convention has no effective signature. The Chamber may have rejected the terms; war, an existing overlord, island subjects or faction obligations may have prevented their execution.\n\nThe council retains its provisional charter as an internal arrangement. Once the obstacles disappear, envoys may renew the offer; until then the islands pass under no new authority."
 A10W_path.12.a:0 "Govern with our own means and await another meeting."
 A10W_path.20.t:0 "The Offer of a New Metropole"
 A10W_path.20.d:0 "The island directorate proposes moving the principal clearing centre to its Pacific network. Madeira will retain its land, closed archives and broad discretion, while recognizing the island cabinet as the metropole and becoming its autonomous Atlantic office.\n\nAcceptance means the Chamber’s actual, voluntary subjection to the new centre. No manpower or troops need be transferred, and calls to war may be declined. Lambert’s signature remains closed: the agreement does not establish who writes it."
 A10W_path.20.a:0 "Voluntarily recognize the island metropole."
 A10W_path.20.b:0 "The supreme seal will remain on Madeira."
 A10W_path.21.t:0 "The Supreme Ledger Turns East"
 A10W_path.21.d:0 "Madeira has signed the convention and voluntarily recognized the new centre. The Atlantic office retains its territory and private affairs; the island directorate assumes supreme direction of the common network.\n\nIf Manila remains unrecovered, meetings will continue at the provisional island exchange. Once the city is ours and peace returns, a separate allocation can move the capital. The Chamber’s inheritance contains as many obligations as opportunities."
 A10W_path.21.a:0 "Accept the books, reserves and responsibility."
 A10W_path.22.t:0 "The Metropole Has Only One Signature"
 A10W_path.22.d:0 "Madeira has given no effective consent to a change of supremacy. The old guard may have rejected the project, or wars, dependency and foreign alliances may have deprived the parties of freedom to agree.\n\nThe island exchange will continue its own work. Its registers, schools and reserves retain value without the old directorate’s recognition. Envoys may revisit the convention when circumstances permit, but neither foreign land nor sovereignty passes to us by proclamation alone."
 A10W_path.22.a:0 "Continue the work and prepare new negotiations."
 A10W_path.30.t:0 "Strike beneath the Sealed Warehouses"
 A10W_path.30.d:0 "Dockers have stopped loading, tenants have issued joint demands, and several treasuries are withholding transfers. The charter book has accumulated more promises than available cash and confidence can support.\n\nThe council may fund mediation and temporary relief from current revenues. It can also insist on immediate execution of the contracts, but interrupted collections will produce new debt and a loss of public support."
 A10W_path.30.a:0 "Fund mediation and family relief."
 A10W_path.30.b:0 "Insist on performance of the contracts."
