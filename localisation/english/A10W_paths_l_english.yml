l_english:
 A10W_conditional_oath:0 "Conditional Oath to the Chamber"
 A10W_conditional_oath_desc:0 "The island council seeks protection through the commercial network. Contractual obligations cost time and concessions; political dependency still requires a separate agreement by both parties."
 A10W_audited_ledger:0 "Reconciled Debt Books"
 A10W_audited_ledger_desc:0 "Common accounts allow duplicate creditor claims to be disputed. Island revenues pay for the treasury service."
 A10W_bonded_customs:0 "Customs under Two Seals"
 A10W_bonded_customs_desc:0 "Local collectors and insurance agents jointly inspect port warehouses. Trade is more reliable, fees are heavier, and disputes over profits raise charter tension each month."
 A10W_port_watch:0 "Harbour Watch and Signal Posts"
 A10W_port_watch_desc:0 "Island companies guard telegraphs, quays and warehouses. Neither Madeira nor its insurers can replace local coastal defence."
 A10W_local_shareholders:0 "Island Shareholders"
 A10W_local_shareholders_desc:0 "Local trading houses and provincial treasuries receive a share of profits and the right to inspect accounts. Their consent sustains the charter."
 A10W_provisional_charter:0 "Provisional Colonial Charter"
 A10W_provisional_charter_desc:0 "The island cabinet has drafted terms of dependency on the Chamber. Until both parties sign the convention, administration and foreign policy remain in their existing hands."
 A10W_resident_council_spirit:0 "Council of the Commercial Resident"
 A10W_resident_council_spirit_desc:0 "Provincial delegates sit alongside the holders of major contracts. The council expedites decisions, while its concentration of authority invites distrust."
 A10W_export_estates_spirit:0 "Export Leaseholds"
 A10W_export_estates_spirit_desc:0 "Long leases for abaca and sugar support road works. Revenues carry repayment obligations, while land disputes raise charter tension each month."
 A10W_colonial_administration:0 "Chamber Colonial Administration"
 A10W_colonial_administration_desc:0 "A voluntarily ratified convention places the islands under Madeira. The Chamber handles external obligations through a local council; armed guards and daily administration remain island institutions."
 A10W_port_hospitals:0 "Harbour Hospitals and Waterworks"
 A10W_port_hospitals_desc:0 "Regular allocations support dockers’ families, clean water and hospitals. Their cost to the treasury reduces charter tension each month."
 A10W_provisional_exchange:0 "Provisional Island Exchange"
 A10W_provisional_exchange_desc:0 "The new clearing network already handles local obligations. Its claim to become the Chamber’s principal metropole requires Madeira’s voluntary recognition."
 A10W_merchant_assembly_spirit:0 "Assembly of Merchant Houses"
 A10W_merchant_assembly_spirit_desc:0 "Port delegates raise capital and approve major contracts. Shared interests expedite business, though rivalry over dividends remains."
 A10W_duplicate_cables_spirit:0 "Duplicate Cable Network"
 A10W_duplicate_cables_spirit_desc:0 "Reserve stations and signal schools reduce dependence on a single line. Regular contributions pay for the network."
 A10W_escrow_courts:0 "Escrow Accounts and Commercial Court"
 A10W_escrow_courts_desc:0 "Verified collateral and common procedures support industrial trade. An empty promise no longer passes for a warehouse receipt."
 A10W_metropolitan_directorate:0 "Supreme Island Directorate"
 A10W_metropolitan_directorate_desc:0 "Madeira has recognized the island centre and voluntarily become an autonomous Atlantic office. Maintaining a worldwide network is expensive; its obligations raise charter tension each month. The identity behind Lambert’s signature remains unknown."
 A10W_network_covenant:0 "Covenant of Two Oceans"
 A10W_network_covenant_desc:0 "Insurance reserves, cable services and hired escorts operate under agreed obligations. Guarantees cost money and cannot save every ship."
 A10W_charter_strikes:0 "Strikes and Charter Disputes"
 A10W_charter_strikes_desc:0 "Charter tension has exceeded 59. Dockers suspend loading, tenants dispute fees and provincial treasuries delay transfers. Mediation and public accounts can restore harbour operations."
 A10W_emergency_mediation:0 "Temporary Treasury Obligations"
 A10W_emergency_mediation_desc:0 "The treasury covers mediation, worker relief or local bond servicing. Current revenues pay for the respite."
 A10W_chartered_colony:0 "Island Charter Colony"
 A10W_chartered_colony_desc:0 "A voluntary agreement between the island council and the Chamber. The metropole manages external obligations, while local government and armed guards remain; participation in war requires separate consent."
 A10W_atlantic_office:0 "Autonomous Atlantic Office"
 A10W_atlantic_office_desc:0 "Madeira has voluntarily recognized the supreme island centre. The old directorate retains its territory and broad autonomy, supplies no manpower to the island army and may decline calls to war."
 A10W_resident_name:0 "Island Charter Council"
 A10W_resident_desc:0 "A board of local agents, provincial delegates and the Chamber’s resident administers the ratified colony. Its powers arise from the convention rather than the identity of its seal bearer."
 A10W_directorate_name:0 "Supreme Island Directorate"
 A10W_directorate_desc:0 "The island board leads the new clearing metropole. The Atlantic office retains Lambert’s closed signature; neither correspondence nor minutes establish who stands behind it."
